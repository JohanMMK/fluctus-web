<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betere Lader · demo</title>
<!-- bl-demo.html v1.0.0 (2026-11-20, Johan): https-link voor de presentatie en QR-codes. ?c=THU|KMO|LOG opent meteen de mail
     «Betere Lader <code>» naar het dossieradres; de server voegt de demofactuur toe en zet de voorbeeldwagens klaar. Zonder c: drie knoppen. -->
<style>body{margin:0;font:17px/1.5 -apple-system,Segoe UI,Inter,sans-serif;background:#F5F7F2;color:#1B2A3A}
.w{max-width:560px;margin:0 auto;padding:40px 20px}img{height:44px}h1{font-size:26px;margin:24px 0 6px}p{color:#5B6B7C;margin:0 0 20px}
a.k{display:block;background:#0B2440;color:#fff;text-decoration:none;border-radius:14px;padding:18px 20px;margin:12px 0;font-weight:600}
a.k small{display:block;font-weight:400;color:#B9C6D4}</style></head>
<body><div class="w"><img src="/apps/bl/betere-lader-logo.svg" alt="Betere Lader">
<h1 id="t">Probeer een demo</h1><p id="u">Kies een voorbeeld. Je mailapp opent met het onderwerp klaar; verstuur de mail en je krijgt binnen enkele minuten een laadplan op een voorbeeldfactuur.</p>
<div id="lijst"></div></div>
<script>
(function(){
  var A='dossier'+'@'+'energie-compas.eu';
  var D={THU:['Thuis','Wagen ’s nachts aan de paal','thuis'],KMO:['Bedrijf','Personeelswagens overdag','bedrijf'],LOG:['Logistiek','Bestel- en vrachtwagens','logistiek']};
  function url(c){ return 'mailto:'+A+'?subject='+encodeURIComponent('Betere Lader '+c)+'&body='+encodeURIComponent('Graag een demolaadplan ('+D[c][2]+').'); }
  var h=''; for(var c in D) h+='<a class="k" href="'+url(c)+'">'+D[c][0]+'<small>'+D[c][1]+'</small></a>';
  document.getElementById('lijst').innerHTML=h;
  var m=/[?&]c=(THU|KMO|LOG)\b/i.exec(location.search);
  if(m){ var c=m[1].toUpperCase(); document.getElementById('t').textContent='Demo '+D[c][0];
    document.getElementById('u').textContent='Je mailapp opent nu. Gebeurt er niets? Tik hieronder op het voorbeeld.'; location.href=url(c); }
})();
</script></body></html>
