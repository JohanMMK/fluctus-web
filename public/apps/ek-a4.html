<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energie-analyse op één blad</title>
<link rel="icon" href="/favicon-ec-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<!-- ek-a4.html v1.5.1 (2026-11-03, Johan): benaming netposten — «capaciteitstarief» (maandpiek) en «vergoeding voor het toegangsvermogen» apart in de pil van de onbeheerste piek. -->
<!-- ek-a4.html v1.5.0 (2026-11-02, Johan): KPI's UIT HET MEERJARENMODEL — de terugverdientijd kwam al uit het plan over 15 jaar; nu staat er ook het gemiddelde per jaar (energie op de inflatie, netkosten sneller + verdubbeling in 2029), de bankdekking jaar 1 én gemiddeld over de looptijd, en de voetnoot zegt hoe het gerekend is (niet langer «zonder inflatie»). Bij «laden met verzwaring» toont een pil de domme piek zonder sturing en het vermeden capaciteitstarief. -->
<!-- ek-a4.html v1.4.3 (2026-11-02, Johan): in de browser is de tabtitel (dus de naam bij «Bewaren als PDF») YYYYMMDD_Klantnaam_Analyse-A4 (D.bestand uit EK); de server-PDF blijft zonder klantnaam. -->
<!-- ek-a4.html v1.4.2 (2026-11-02, Johan): afdrukken in Safari = één A4 (Safari houdt eigen marges aan: het blad wordt in de browser licht verkleind, zoom .94; de server-PDF blijft exact 210 × 297 mm); foto a4-10 opnieuw uitgesneden (de man stond half buiten beeld) en per foto een focuspunt zodat mensen niet afgeknipt worden. -->
<!-- ek-a4.html v1.4.1 (2026-11-02, Johan): afdrukken vanuit de browser — exact één A4 (geen lege tweede pagina), kleuren en achtergronden altijd mee (print-color-adjust: exact), knoppenbalk weg. -->
<!-- ek-a4.html v1.4.0 (2026-11-02, Johan): bij een laadplein staat bij de kerncijfers waarmee vergeleken werd («t.o.v. laden elders» of «t.o.v. laden op de site met verzwaring»), zoals de adviseur koos in Resultaat (D.keuze.vgl).
     ek-a4.html v1.3.0 (2026-11-02, Johan): witruimte onderaan benut — is er plaats over, dan worden de lijnen van het rooster hoger (max. 30 px) en wat dan nog overblijft gaat naar de foto; zo krijgt de foto bij een klein rooster meer hoogte.
     ek-a4.html v1.2.0 (2026-11-02, Johan): het witvlak onder «Wat we kregen» wordt een foto uit de LinkedIn-campagne (zonder tekst, /ec-img/a4/a4-01…27.jpg, telkens een andere: D.foto) met «Bedankt om het net beter te gebruiken.» + #NetBeterGebruiken; te weinig plaats (< 70 px) → geen foto.
     ek-a4.html v1.1.0 (2026-11-02, Johan): PARTNERBRANDING volledig — logo, inktkleur (titels + donkere kaart), accent (is de hoofdkleur heel donker, zoals EnergyPro zwart/geel, dan wordt de tweede kleur het accent), lettertype van de partner voor de titels; geen Energie-Compas-naam. Ook in «Bekijk de A4» (EK ≥ 0.164.0 haalt merk + adviseur op).
     ek-a4.html v1.0.1 (2026-11-02): bedragen vanaf € 1.000k als «€ 1,66 M»; kolomkoppen van het rooster breken af i.p.v. «…». v1.0.0 (2026-11-02, Johan): ANALYSE OP ÉÉN A4 — anoniem (geen klantnaam, geen adres), voor de adviseur om naar zijn klant te sturen
     als voorsmaakje of op LinkedIn te zetten. Data: window.EK_A4_DATA (headless PDF op de server) of localStorage EK_A4_DATA (knop «Bekijk de A4» in EK).
     Inhoud: (1) wat we kregen (factuur, profiel, laadplein), (2) wat we doorrekenden (rooster), (3) de gekozen combinatie, (4) slimme sturing zonder/met
     onbalans (passieve respons), (5) bankdossier en verhoogde investeringsaftrek. White-label: D.merk (logo, kleur, naam) i.p.v. Energie-Compas. -->
<script src="/apps/ec-iconen.js"></script>
<style>
  :root{ --navy:#1F3864; --ink:#14203a; --acc:#05B050; --acc-d:#05803C; --acc-l:#EAF7EF; --muted:#5A6577; --lijn:#E3E8EF; --eci-acc:var(--acc); --eci-ink:var(--navy); --eci-l:var(--acc-l); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:#e9edf2;font-size:11px;line-height:1.4}
  h1,h2,.hv,.pv{font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.005em}
  .a4{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:11mm 12mm 9mm;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,.12);display:flex;flex-direction:column}
  @page{size:A4;margin:0}
  /* v1.4.1: afdrukken uit de browser = exact één A4 met achtergronden (ook zonder vinkje «Druk achtergronden af»), geen lege tweede pagina */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  /* v1.4.2: Safari houdt eigen marges aan → in de browser verkleinen we het blad licht (zoom .94) zodat het altijd op één A4 past; de server-PDF (html.srv) blijft 210 × 297 mm */
  @media print{ html,body{height:auto;overflow:visible;background:#fff!important} .a4{margin:0 auto!important;box-shadow:none;break-after:avoid;page-break-after:avoid;break-inside:avoid} #bar{display:none!important}
    html:not(.srv) .a4{zoom:.94}
    html.srv,html.srv body{width:210mm;height:297mm;overflow:hidden} html.srv .a4{height:296.5mm} }
  #bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:8px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12)}
  #bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:var(--navy);color:#fff;cursor:pointer}
  #bar span{font-size:12px;color:var(--muted)}
  .kop{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--acc);padding-bottom:7px;margin-bottom:9px}
  .kop img{height:30px;max-width:190px;object-fit:contain}
  .kop .ey{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}
  h1{font-size:19px;line-height:1.2;margin:0 0 3px;color:var(--navy)}
  .lead{font-size:11.5px;color:var(--muted);margin:0 0 9px}
  h2{font-size:12.5px;margin:0 0 6px;color:var(--navy);display:flex;align-items:center;gap:6px}
  h2 .nr{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;flex:0 0 18px}
  .rij{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin-bottom:9px}
  .rij.gelijk{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .blok{border:1px solid var(--lijn);border-radius:12px;padding:9px 10px}
  .blok.b1{display:flex;flex-direction:column}
  .dank{flex:1 1 auto;min-height:0;margin-top:8px;border-radius:10px;overflow:hidden;position:relative;background:var(--navy)}
  .dank img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
  .dank .t{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78));color:#fff;font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;line-height:1.2}
  .dank .t:before{content:'';display:block;width:26px;height:3px;border-radius:2px;background:var(--acc);margin-bottom:6px}
  .dank .t small{display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.04em;opacity:.85;margin-top:3px}
  .in{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed #E6ECF3}
  .in:last-child{border-bottom:0}
  .in svg{width:30px;height:30px;flex:0 0 30px}
  .in b{display:block;color:var(--navy);font-size:11.5px}
  .in span{color:var(--muted);font-size:10.5px}
  table.ev{width:100%;border-collapse:collapse;margin-top:3px;font-size:10px}
  table.ev th{text-align:left;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:1px 3px}
  table.ev td{padding:2px 3px;border-top:1px solid #EEF2F6}
  table.ev td.n{text-align:right;font-variant-numeric:tabular-nums}
  .feit{font-size:10.5px;color:var(--ink);margin:0 0 5px}
  .feit b{color:var(--navy)}
  table.hm{border-collapse:separate;border-spacing:2px;width:100%;table-layout:fixed}
  table.hm th{font-size:7px;font-weight:600;color:var(--muted);padding:0 1px;white-space:normal;line-height:1.05;word-break:break-word;vertical-align:bottom}
  table.hm th.r{text-align:right;width:64px;line-height:1.05;white-space:nowrap;font-size:7px}
  table.hm td{font-size:8px;text-align:center;border-radius:4px;padding:1px 0;border:1px solid #E2E8F0;font-variant-numeric:tabular-nums;color:var(--navy)}
  table.hm td.est{border-style:dashed;color:#64748b;font-style:italic}
  table.hm td.sel{border:2px solid var(--navy)!important;font-weight:800;background:color-mix(in srgb,var(--acc) 26%,#fff)!important}
  table.hm td.best{outline:1.5px dashed var(--navy);outline-offset:-3px}
  .lg{display:flex;gap:10px;flex-wrap:wrap;font-size:8.5px;color:var(--muted);margin-top:3px}
  .lg i{display:inline-block;width:11px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .chips span{font-size:8.5px;padding:1px 6px;border-radius:999px;background:#F1F5F9;color:var(--navy)}
  .hero{background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px 11px;margin-bottom:6px}
  .hero .hk{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  .hero .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .hero .hv{font-size:30px;font-weight:700;line-height:1.05}
  .hero .hs{font-size:11px;margin:2px 0 7px;opacity:.95}
  .hero .tag{font-size:10px;font-weight:700;border:1.5px solid var(--acc);border-radius:999px;padding:3px 10px;color:#fff;background:rgba(5,176,80,.18);white-space:nowrap}
  .hero .eci-tg{gap:7px}
  .hero .eci-t{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);padding:6px 4px 5px;color:#fff}
  .hero .eci-t svg{width:40px;height:40px;margin-bottom:1px}
  .hero .eci-t b{color:#fff;font-size:11px}
  .hero .eci-t>span{color:rgba(255,255,255,.82);font-size:9px}
  .pil{display:inline-block;font-size:10px;padding:2px 9px;border-radius:999px;border:1px solid var(--lijn);margin-right:5px;color:var(--navy)}
  .pil.ok{background:#EAF7EF;border-color:#BFE6CD;color:var(--acc-d);font-weight:700}
  .pil.wr{background:#FFF4E0;border-color:#F3D9A6;color:#8A5A00;font-weight:700}
  .st{border:1px solid var(--lijn);border-radius:10px;padding:7px 9px}
  .st.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .st .l{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .st .pv{font-size:16px;font-weight:700;color:var(--navy);margin-top:1px}
  .st .pv small{font-size:10px;font-weight:600;color:var(--muted)}
  .st .t{font-size:10.5px}
  .st .s{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .rb{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;padding:2px 0;border-bottom:1px dashed #E6ECF3}
  .rb b{color:var(--navy);white-space:nowrap}
  .sub{font-size:9.5px;color:var(--muted)}
  .vt{margin-top:auto;border-top:1px solid var(--lijn);padding-top:6px;display:flex;justify-content:space-between;gap:12px;font-size:9px;color:var(--muted)}
  .vt b{color:var(--navy)}
</style>
</head>
<body>
<div id="bar"><button type="button" onclick="window.print()">🖨️ Afdrukken of bewaren als PDF</button><span>Eén A4, zonder naam van je klant.</span></div>
<div class="a4" id="a4"></div>
<script>
(function(){
  var D=null;
  try{ if(window.EK_A4_DATA){ D=window.EK_A4_DATA; document.documentElement.classList.add('srv'); } }catch(e){}   // v1.4.2: server-PDF
  if(!D){ try{ var s=localStorage.getItem('EK_A4_DATA'); if(s) D=JSON.parse(s); }catch(e){} }
  var root=document.getElementById('a4');
  if(window.EK_A4_DATA){ try{ document.getElementById('bar').style.display='none'; }catch(e){} }
  if(!D){ root.innerHTML='<p style="padding:40px;font-size:14px">Geen gegevens. Open deze pagina vanuit Energie-Compas (tab Adviseur → «Bekijk de A4»).</p>'; window.__A4_KLAAR=true; return; }

  function e(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function nf(v,d){ if(v==null||!isFinite(+v)) return '—'; return Number(v).toLocaleString('nl-BE',{maximumFractionDigits:(d==null?0:d)}); }
  function eur(v){ if(v==null||!isFinite(+v)) return '—'; return (v<0?'− ':'')+'€ '+nf(Math.abs(Math.round(v))); }
  function eurK(v){ if(v==null||!isFinite(+v)) return '—'; var a=Math.abs(v); return (v<0?'− ':'')+(a>=10000?'€ '+nf(Math.round(a/1000))+'k':'€ '+nf(Math.round(a))); }
  function _voetPlan(P){   /* v1.5.0: hoe de KPI's gerekend zijn (meerjarenmodel) */
    if(!P||!(P.jaren>0)) return 'Indicatieve cijfers op basis van de marktprijzen van de voorbije 12 maanden.';
    var t='Besparing per jaar = jaar 1, op de marktprijzen van de voorbije 12 maanden. Terugverdientijd en gemiddelde uit het plan over '+nf(P.jaren)+' jaar: energie volgt de inflatie ('+nf(P.inflatie,1)+' %)';
    if(P.net_extra>0) t+=', netkosten '+nf(P.net_extra,1)+' % sneller';
    if(P.dubbel_jaar>0 && P.dubbel_factor>1) t+=(P.dubbel_factor===2?', met een verdubbeling van de netkosten in ':', netkosten × '+nf(P.dubbel_factor,1)+' in ')+P.dubbel_jaar;
    return t+'.'; }
  function geld(x){ var m=String(x==null?'':x).replace(/\s/g,'').match(/^(-?)€(\d+(?:[.,]\d+)?)k$/i); if(!m) return x; var v=parseFloat(m[2].replace(',','.')); if(!(v>=1000)) return x;
    var M=v/1000; return (m[1]?'− ':'')+'€ '+M.toLocaleString('nl-BE',{maximumFractionDigits:(M>=10?1:2)})+' M'; }
  var I=(window.ECI&&ECI.icoon)||{};
  function ic(s,p){ try{ return I[s]?I[s](p):''; }catch(x){ return ''; } }

  var M=(D.merk&&D.merk.aan&&D.merk.logo)?D.merk:null;
  if(M){ var hx=/^#[0-9a-f]{6}$/i, lum=function(h){ var n=parseInt(h.slice(1),16), f=function(c){ c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); }; return 0.2126*f(n>>16&255)+0.7152*f(n>>8&255)+0.0722*f(n&255); };
    var P=hx.test(M.kleur||'')?M.kleur:'#0022AC', A2=hx.test(M.kleur2||'')?M.kleur2:P, INK=hx.test(M.ink||'')?M.ink:'#0B1F6B';
    var ACC=(lum(P)<0.06 && lum(A2)>lum(P))?A2:P, R=document.documentElement.style;   // hoofdkleur bijna zwart (EnergyPro) → tweede kleur als accent
    R.setProperty('--acc',ACC); R.setProperty('--acc-l','color-mix(in srgb,'+ACC+' 14%,#fff)'); R.setProperty('--acc-d','color-mix(in srgb,'+ACC+' 55%,'+INK+')'); R.setProperty('--navy',INK);
    if(M.font && /^[A-Za-z0-9 ]{2,40}$/.test(M.font)){ try{ var lk=document.createElement('link'); lk.rel='stylesheet'; lk.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(M.font).replace(/%20/g,'+')+':wght@400;600;700&display=swap'; document.head.appendChild(lk);
      var stF=document.createElement('style'); stF.textContent="h1,h2,.hv,.pv,.hero .eci-t b{font-family:'"+M.font+"','Helvetica Neue',Helvetica,Arial,sans-serif!important}"; document.head.appendChild(stF); }catch(eF){} }
    try{ document.title='Energie-analyse · '+(M.naam||''); }catch(eT){} }
  try{ if(D && D.bestand && !window.EK_A4_DATA) document.title=String(D.bestand).slice(0,120); }catch(eBt){}   // v1.4.3: YYYYMMDD_Klantnaam_Analyse-A4 (enkel in de browser; de server-PDF blijft anoniem)
  var logo=M?M.logo:'/apps/ec-logo.png', merkNaam=M?(M.naam||''):'Energie-Compas';

  var h='';
  // ── kop ──
  h+='<div class="kop"><img src="'+e(logo)+'" alt="'+e(merkNaam)+'"><div class="ey">Energie-analyse · '+e(D.datum||'')+'<br>anoniem voorbeeld</div></div>';
  h+='<h1>'+e(D.titel||'Wat zon, een batterij en slim sturen opleveren')+'</h1>';
  h+='<p class="lead">Een echte analyse van deze week, zonder naam. Hieronder zie je wat we kregen, wat we doorrekenden en wat het oplevert.</p>';

  // ── 1 · wat we kregen ──
  var IN=D.invoer||{}, V=(D.voertuigen||[]);
  var b1='<div class="blok b1"><h2><span class="nr">1</span>Wat we kregen</h2>';
  var fr=[]; if(IN.verbruik_mwh>0) fr.push(nf(IN.verbruik_mwh,1)+' MWh per jaar'); if(IN.aansluiting_kw>0) fr.push('aansluiting '+nf(IN.aansluiting_kw)+' kW'+(IN.spanning?' ('+e(IN.spanning)+')':'')); if(IN.kost_eur>0) fr.push(eur(IN.kost_eur)+' per jaar');
  b1+='<div class="in">'+ic('doc')+'<div><b>'+(IN.factuur?'Eén energiefactuur':'De gegevens van de factuur')+'</b><span>'+e(fr.join(' · ')||'—')+'</span></div></div>';
  b1+='<div class="in">'+ic('markt')+'<div><b>'+(IN.gemeten?'Gemeten verbruik per kwartier':'Een standaardprofiel')+'</b><span>'+(IN.gemeten?'Het echte verbruik van een volledig jaar, kwartier per kwartier.':'Profiel «'+e(IN.profiel||'—')+'», geschaald op het jaarverbruik.')+'</span></div></div>';
  if(IN.best_pv_kwp>0) b1+='<div class="in">'+ic('pv')+'<div><b>Bestaande zonnepanelen: '+nf(IN.best_pv_kwp,1)+' kWp</b><span>'+(IN.best_inj_mwh>0?nf(IN.best_inj_mwh,1)+' MWh per jaar naar het net':'mee in de berekening')+'</span></div></div>';
  if(V.length){ b1+='<div class="in">'+ic('lp')+'<div style="flex:1"><b>Elektrische voertuigen</b><table class="ev"><tr><th>Voertuig</th><th style="text-align:right">Aantal</th><th>Laadmoment</th><th style="text-align:right">kW</th></tr>'+
    V.map(function(r){ return '<tr><td>'+e(r.label)+(r.betalend?' <span class="sub">(betalend)</span>':'')+'</td><td class="n">'+nf(r.aantal)+(r.betalend?'/dag':'')+'</td><td>'+e(r.moment||'')+(r.weekend?' + weekend':'')+'</td><td class="n">'+(r.kw>0?nf(r.kw):'—')+'</td></tr>'; }).join('')+'</table></div></div>'; }
  var foto=(/^a4-\d{2}\.jpg$/.test(String(D.foto||'')))?D.foto:('a4-'+('0'+(1+Math.floor(Math.random()*27))).slice(-2)+'.jpg');
  var FOCUS={'a4-08.jpg':'85% 30%','a4-10.jpg':'20% 30%'};   // v1.4.2: wie aan de rand staat, blijft in beeld
  b1+='<div class="dank" id="a4-dank"><img id="a4-foto" src="/ec-img/a4/'+foto+'?v=2" alt="" style="object-position:'+(FOCUS[foto]||'50% 35%')+'"><div class="t">Bedankt om het net beter te gebruiken.<small>#NetBeterGebruiken</small></div></div>';
  b1+='</div>';

  // ── 2 · wat we doorrekenden ──
  var R=D.rooster||null, b2='<div class="blok"><h2><span class="nr">2</span>Wat we doorrekenden</h2>';
  if(R){
    b2+='<p class="feit"><b>'+nf(R.n)+' combinaties</b> van zonnepanelen en batterij. Elke combinatie rekenen we een volledig jaar door, <b>'+nf(R.kwartieren||35040)+' kwartieren</b>, met de marktprijzen van de voorbije 12 maanden.</p>';
    b2+='<div class="sub" style="margin:0 0 2px;font-weight:700;color:var(--navy)">'+e(R.titel||'')+'</div>';
    var vals=[]; (R.cel||[]).forEach(function(rw){ rw.forEach(function(c){ if(c&&c.v!=null&&isFinite(c.v)) vals.push(+c.v); }); });
    var mn=vals.length?Math.min.apply(null,vals):0, mx=vals.length?Math.max.apply(null,vals):1;
    b2+='<table class="hm"><tr><th class="r"></th>'+(R.cols||[]).map(function(c){ return '<th>'+e(c)+'</th>'; }).join('')+'</tr>';
    (R.rows||[]).forEach(function(rl,ri){ b2+='<tr><th class="r">'+e(rl)+'</th>'+((R.cel[ri])||[]).map(function(c){ if(!c) return '<td></td>';
      var t=(c.v!=null&&isFinite(c.v)&&mx>mn)?((c.v-mn)/(mx-mn)):0.5; if(!R.goedHoog) t=1-t;
      var bg='color-mix(in srgb,var(--acc) '+Math.round(4+t*30)+'%,#fff)';
      return '<td class="'+(c.ex?'':'est')+(c.sel?' sel':'')+(c.best?' best':'')+'" style="background:'+bg+'">'+e(c.t)+'</td>'; }).join('')+'</tr>'; });
    b2+='</table><div class="lg"><span><i style="border:2px solid var(--navy);background:color-mix(in srgb,var(--acc) 26%,#fff)"></i>gekozen</span>'+(R.heeftBest?'<span><i style="outline:1.5px dashed var(--navy);outline-offset:-2px;background:#fff"></i>ons advies</span>':'')+'<span>donkerder = beter</span></div>';
    if((R.kengetallen||[]).length) b2+='<div class="sub" style="margin-top:5px">Per combinatie vergelijken we '+R.kengetallen.length+' kengetallen:</div><div class="chips">'+R.kengetallen.map(function(k){ return '<span>'+e(k)+'</span>'; }).join('')+'</div>';
  } else b2+='<p class="feit">Alle combinaties van zonnepanelen en batterij, elk kwartier van een volledig jaar.</p>';
  b2+='</div>';
  h+='<div class="rij">'+b1+b2+'</div>';

  // ── 3 · de combinatie ──
  var K=D.keuze||{};
  h+='<h2><span class="nr">3</span>'+e(K.titel||'Ons advies')+'</h2>';
  var hs=[]; if(K.tvt) hs.push('terugverdiend in '+e(K.tvt)+' jaar'); if(K.inv) hs.push('investering '+e(geld(K.inv))+(K.inv_incl?' incl. laadpalen':'')); if(K.rend) hs.push('rendement '+e(K.rend)); if(K.vgl) hs.push(e(K.vgl));   /* v1.4.0 */
  var PL=K.plan||null; if(PL && PL.gem>0) hs.splice(1,0,'gemiddeld '+e(eurK(PL.gem))+'/jaar over '+nf(PL.jaren)+' jaar');   /* v1.5.0 */
  h+='<div class="hero"><div class="top"><div><div class="hk">Besparing per jaar</div><div class="hv">'+e(geld(K.besp)||'—')+'</div></div>'+(K.tag?'<span class="tag">'+e(K.tag)+'</span>':'')+'</div><div class="hs">'+hs.join(' · ')+'</div>'+
    ((window.ECI&&(K.tegels||[]).length)?ECI.tegels(K.tegels,{klein:true}):'')+'</div>';
  var pil='';
  if(K.netpiek_kw>0) pil+='<span class="pil">🔌 Netpiek ± '+nf(K.netpiek_kw)+' kW</span>';
  if(K.aansluiting_kw>0) pil+=K.binnen?'<span class="pil ok">✔ binnen de aansluiting van '+nf(K.aansluiting_kw)+' kW</span>':'<span class="pil wr">⚠ boven de aansluiting van '+nf(K.aansluiting_kw)+' kW'+(K.verzwaring?' · verzwaring nodig':'')+'</span>';
  if(PL && PL.onb_extra>0 && PL.onb_piek>0){ var _np=[]; if(PL.onb_cap>0) _np.push('± '+eur(PL.onb_cap)+' capaciteitstarief'); if(PL.onb_tv>0) _np.push('± '+eur(PL.onb_tv)+' vergoeding toegangsvermogen');   /* v1.5.1 */
    pil+='<span class="pil">⚡ Zonder sturing laden alle palen tegelijk: piek ± '+nf(PL.onb_piek)+' kW · vermeden per jaar: '+(_np.length?_np.join(' + '):('± '+eur(PL.onb_extra)+' capaciteitstarief en vergoeding toegangsvermogen'))+'</span>'; }   /* v1.5.0 */
  if(pil) h+='<div style="margin:0 0 9px">'+pil+'</div>';

  // ── 4 · sturing + 5 · financiering ──
  var S=D.sturing||null, b4='<div class="blok"><h2><span class="nr">4</span>Wat slimme sturing oplevert</h2>';
  if(S && S.zonder){
    b4+='<div class="g2"><div class="st"><div class="l">Zonder onbalans</div><div class="pv">'+eur(S.zonder.besp)+' <small>per jaar</small></div><div class="t">'+(S.zonder.tvt?'terugverdiend in '+e(S.zonder.tvt)+' jaar':'')+'</div><div class="s">De batterij laadt als stroom goedkoop is en levert als hij duur is. Meer eigen zonnestroom, een lagere piek.</div></div>';
    if(S.met) b4+='<div class="st on"><div class="l">Met onbalans</div><div class="pv">'+eur(S.met.besp)+' <small>per jaar</small></div><div class="t">'+(S.met.tvt?'terugverdiend in '+e(S.met.tvt)+' jaar':'')+'</div><div class="s">+ '+eur(S.met.extra)+' per jaar: soms betaalt het net je om even te wachten of bij te springen.</div></div>';
    else b4+='<div class="st"><div class="l">Met onbalans</div><div class="s">Enkel met een batterij.</div></div>';
    b4+='</div><div class="sub" style="margin-top:4px">Het advies hierboven rekent zonder onbalans. De onbalans is een extra.</div>';
  } else b4+='<p class="feit">Een slimme sturing (EMS) laadt de batterij als stroom goedkoop is en ontlaadt als hij duur is.</p>';
  b4+='</div>';
  var B=D.bank||null, A=D.aftrek||null, b5='<div class="blok"><h2><span class="nr">5</span>Financiering</h2>';
  if(B && B.inv>0){
    b5+='<div class="rb"><span>Investering zonnepanelen + batterij</span><b>'+eur(B.inv)+'</b></div>'+
      '<div class="rb"><span>Aflossing per jaar <span class="sub">('+B.jaren+' j · '+String(B.rente).replace('.',',')+' %)</span></span><b>± '+eur(B.ann)+'</b></div>'+
      '<div class="rb"><span>Besparing zonnepanelen + batterij per jaar</span><b>± '+eur(B.besp)+'</b></div>'+
      '<div class="rb"><span>Besparing dekt de aflossing'+(B.dek_gem!=null?' <span class="sub">(jaar 1)</span>':'')+'</span><b style="color:'+(B.dek>=100?'var(--acc-d)':'#B45309')+'">'+(B.dek>=100?'✔ ':'')+nf(B.dek)+' %</b></div>'+
      ((B.dek_gem!=null&&B.dek_gem!==B.dek)?'<div class="rb"><span>Gemiddeld over de looptijd <span class="sub">(± '+eur(B.besp_gem)+'/jaar)</span></span><b style="color:'+(B.dek_gem>=100?'var(--acc-d)':'#B45309')+'">'+(B.dek_gem>=100?'✔ ':'')+nf(B.dek_gem)+' %</b></div>':'');   /* v1.5.0 */
  }
  if(A && A.status && A.status!=='nvt'){
    var ok=(A.status==='alle'||A.status==='klein');
    b5+='<div style="margin-top:6px;font-size:10.5px"><b style="color:'+(ok?'var(--acc-d)':'var(--muted)')+'">'+(ok?'✔ Verhoogde investeringsaftrek mogelijk'+(A.status==='klein'?' (kleine ondernemingen)':''):'✖ Verhoogde investeringsaftrek waarschijnlijk niet mogelijk')+'</b>'+(ok&&A.voordeel>0?'<br>Indicatief belastingvoordeel: <b style="color:var(--navy)">± '+eur(A.voordeel)+'</b>':'')+'</div>';
  }
  b5+='<div class="sub" style="margin-top:5px">Het bankdossier en het dossier voor de investeringsaftrek maken we mee op, zodra de bestelling bevestigd is.</div></div>';
  h+='<div class="rij gelijk">'+b4+b5+'</div>';

  // ── voet ──
  var ad=D.adviseur||null;
  h+='<div class="vt"><div>'+(ad&&(ad.naam||ad.mail)?'Je adviseur: <b>'+e(ad.naam||'')+'</b>'+(ad.mail?' · '+e(ad.mail):'')+(ad.tel?' · '+e(ad.tel):''):'')+'</div><div style="text-align:right">'+(M?'<b>'+e(merkNaam)+'</b>'+(M.web?' · '+e(String(M.web).replace(/^https?:\/\//,'')):''):'Berekend met <b>Energie-Compas</b> · energie-compas.eu')+'<br>'+_voetPlan(PL)+'</div></div>';

  root.innerHTML=h;
  // past alles op één blad? Zo niet: alles iets kleiner
  try{ var hBeschikbaar=root.clientHeight; root.style.height='auto'; var nodig=root.scrollHeight; root.style.height='';
    if(nodig>hBeschikbaar+1){ var z=Math.max(0.7,(hBeschikbaar-2)/nodig); Array.prototype.forEach.call(root.children,function(c){ c.style.zoom=String(z); }); } }catch(x){}
  // v1.3.0: plaats over onderaan → eerst de roosterlijnen hoger, de rest naar de foto
  try{ var vt=root.querySelector('.vt'), vorig=vt&&vt.previousElementSibling;
    var vrij=function(){ return (vt&&vorig)?(vt.getBoundingClientRect().top-vorig.getBoundingClientRect().bottom-10):0; };
    var sp=vrij();
    if(sp>8){ var tds=root.querySelectorAll('table.hm tr'), rijen=Array.prototype.slice.call(tds,1);
      if(rijen.length){ var rh=rijen[0].getBoundingClientRect().height, extra=Math.min(30-rh, Math.floor(sp/rijen.length));
        if(extra>0){ rijen.forEach(function(tr){ Array.prototype.forEach.call(tr.children,function(c){ c.style.height=(rh+extra)+'px'; }); });
          Array.prototype.forEach.call(root.querySelectorAll('table.hm td'),function(c){ c.style.fontSize=(extra>6?'9.5px':'8.5px'); }); } }
    }
    // foto: eerst de lege ruimte onder de foto in blok 1 opvullen, dan de witruimte onderaan de pagina (in een paar stappen, nooit over de voet)
    var dk0=document.getElementById('a4-dank'), b1=root.querySelector('.blok.b1');
    if(dk0 && b1){ dk0.style.flex='0 0 auto';
      for(var it=0; it<4; it++){ var bb=b1.getBoundingClientRect(), db=dk0.getBoundingClientRect(), pad=parseFloat(getComputedStyle(b1).paddingBottom)||0;
        var slack=Math.max(0, bb.bottom-pad-db.bottom), v=vrij(), plus=slack+Math.max(0,v);
        if(plus<2 && v>=0) break; dk0.style.height=Math.max(0, db.height+plus+(v<0?v:0))+'px'; }
      if(vrij()<0) dk0.style.height=Math.max(0, dk0.getBoundingClientRect().height+vrij())+'px'; } }catch(x){}
  try{ var dk=document.getElementById('a4-dank'); if(dk && dk.getBoundingClientRect().height<70) dk.style.display='none'; }catch(x){}
  (function(){ var im=document.getElementById('a4-foto'), klaar=function(){ window.__A4_KLAAR=true; };
    if(!im || im.complete || (document.getElementById('a4-dank')||{style:{}}).style.display==='none'){ klaar(); return; }
    im.onload=klaar; im.onerror=function(){ try{ document.getElementById('a4-dank').style.display='none'; }catch(x){} klaar(); }; setTimeout(klaar,4000); })();
})();
</script>
