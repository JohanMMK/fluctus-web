<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gebruikersbeheer · Fluctus</title>
<!-- Gebruikersbeheer v1.7 (09-08): geen mail bij verwijderen (enkel lokale export) + terminologie 'verkoper'→'adviseur' (rol-waarde seller ongewijzigd). // v1.6 (09-08): authHeaders() async → altijd live token (fix 401 "niet ingelogd" op manager-acties na token-expiry). // v1.5 (08-08): "Preview"-knop per rij = dry-run van het verwijderen (server v15.64.0): toont
     hoeveel scenario’s/Kamino zouden herlinken naar oekene, wat er zou verwijderd worden, of GitHub-token + Brevo
     geconfigureerd zijn — zonder iets te wijzigen. Zo testbaar zonder wegwerp-account. Preview-export wordt gedownload.
     Gebruikersbeheer v1.4 (08-08): (1) app-toegang-fout in een alert (de #g-msg staat onder de tabel, buiten beeld bij
     een lange lijst); (2) bij toekennen stuurt de UI app_naam mee zodat de server een ontbrekende app-rij zelf aanmaakt
     in `apps` (auto-provision, server v15.61.0); (3) NIEUW: "Verwijderen"-knop per rij (niet voor jezelf) → server
     mailt eerst een .txt-export van alle gelogde info en verwijdert dan profiel+toegangen+log+login (server v15.62.0);
     de UI downloadt de export ook lokaal als vangnet. Handig om een testmail te recyclen voor een verse onboarding.
     v1.4 (08-08): de gelinkte projecten (scenario’s + Kamino) worden bij verwijderen herlinkt aan oekene@gmail.com
     (server v15.63.0) i.p.v. verweesd; de UI meldt de herlink-aantallen. -->

<style>
  :root{ --navy:#1F3864; --green:#05B050; --rood:#C0201A; --grijs:#6B7280; --lijn:#E5E7EB; --bg:#F5F6F8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#1F2430; background:var(--bg); }
  header{ background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1{ font-size:18px; margin:0; font-weight:800; letter-spacing:-.2px; }
  header .who{ font-size:13px; opacity:.9; }
  main{ max-width:1180px; margin:0 auto; padding:20px 16px 70px; }
  .kaart{ background:#fff; border:1px solid var(--lijn); border-radius:10px; padding:18px 18px 16px; margin:0 0 20px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .kaart h2{ font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); }
  .rij{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .veld{ display:flex; flex-direction:column; gap:4px; }
  .veld label{ font-size:11px; color:var(--grijs); font-weight:600; }
  input[type=text], input[type=email], input[type=search], select{ font-size:14px; padding:8px 10px; border:1px solid var(--lijn); border-radius:7px; background:#fff; }
  input[type=email]{ min-width:180px; } input[type=search]{ min-width:200px; }
  input:focus, select:focus{ outline:none; border-color:var(--navy); }
  button{ font-size:14px; font-weight:600; padding:9px 16px; border:0; border-radius:7px; cursor:pointer; background:var(--navy); color:#fff; }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.sec{ background:#EEF1F6; color:var(--navy); }
  button.gr{ background:var(--green); }
  .msg{ font-size:13px; margin:10px 0 0; min-height:18px; }
  .msg.ok{ color:var(--green); } .msg.err{ color:var(--rood); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--lijn); vertical-align:middle; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--grijs); font-weight:700; white-space:nowrap; }
  th.app,td.app{ text-align:center; }
  th.app .alt{ display:block; font-size:8px; color:var(--green); font-weight:700; letter-spacing:.02em; }
  tbody tr:hover{ background:#FAFBFC; }
  .u-email{ font-weight:600; color:#1F2430; }
  .u-naam{ color:var(--grijs); font-size:12px; }
  .badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; display:inline-block; }
  .b-active{ background:#E3F6EA; color:#0A7A38; }
  .b-invited{ background:#FFF3D6; color:#8A6100; }
  .b-inactive{ background:#F3D6D6; color:#8A1A14; }
  .app-toggle{ width:20px; height:20px; cursor:pointer; accent-color:var(--green); }
  .app-toggle:disabled{ cursor:not-allowed; }
  .noaid{ font-size:10px; color:#B08600; }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .acts button{ padding:5px 10px; font-size:12px; }
  .laad{ padding:40px; text-align:center; color:var(--grijs); }
  .fout-groot{ padding:30px; text-align:center; color:var(--rood); font-size:14px; }
  .hint{ font-size:12px; color:var(--grijs); margin:2px 0 0; }
  .tel{ font-size:12px; color:var(--grijs); font-weight:600; }
  select.rolsel{ padding:5px 8px; font-size:12px; }
  .filterbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin:0 0 14px; padding:12px; background:#F8FAFC; border:1px solid var(--lijn); border-radius:8px; }
  .filterbar .veld label{ color:var(--navy); }
  .filterbar .reset{ background:transparent; color:var(--grijs); border:1px solid var(--lijn); }
  .legende{ display:flex; gap:16px; flex-wrap:wrap; margin:10px 0 0; font-size:11.5px; color:var(--grijs); }
  .legende span{ display:flex; align-items:center; gap:6px; }
  .lg{ width:14px; height:14px; border-radius:3px; display:inline-block; border:1px solid var(--lijn); }
  .lg-on{ background:var(--green); border-color:var(--green); }
  .lg-auto{ background:#BFE3CC; border-color:#9ec7ad; }
  .lg-wait{ background:#F1F2F4; border-color:#d7dbe0; }
  @media(max-width:640px){ main{ padding:14px 8px 60px; } .kaart{ padding:14px; } input[type=search]{ min-width:150px; } }
</style>
</head>
<body>
<header>
  <h1>Gebruikersbeheer</h1>
  <div class="who" id="who"></div>
</header>
<main>
  <div id="root" class="laad">Laden…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  // Alle apps op Mijn Fluctus behalve de Gebruikers-app zelf. 'altijd:true' =
  // elke gebruiker/genodigde heeft er altijd toegang toe (Academy) → geen toggle.
  var APPS = [
    { id:'jacops',       naam:'Jacops' },
    { id:'kamino',       naam:'Kamino' },
    { id:'simulator',    naam:'Simulator' },
    { id:'betaalplein',  naam:'Laadplein' },
    { id:'gemeenteplan', naam:'Gemeenteplan' },
    { id:'energiemarkt', naam:'Energiemarkt' },
    { id:'academy',      naam:'Academy', altijd:true },
  ];

  var CFG=null, sb=null, SESSION=null, PROXY='', USERS=[];
  var FILT={ q:'', status:'', app:'', access:'' };
  var $ = function(id){ return document.getElementById(id); };
  var root = $('root');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  async function loadConfig(){ var r=await fetch('/api/config'); CFG=await r.json(); PROXY=(CFG.fluctusProxyUrl||'').replace(/\/+$/,''); }

  async function initAuth(){
    if(!CFG.supabaseUrl || !CFG.supabaseAnonKey){ root.className='fout-groot'; root.textContent='Supabase nog niet geconfigureerd op de server.'; return; }
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    var d = await sb.auth.getSession();
    SESSION = d.data.session;
    if(!SESSION){ window.location.href = '/portal.html'; return; }
    $('who').textContent = (SESSION.user && SESSION.user.email) || '';
    await laadUsers();
  }

  // v1.6 (09-08): ALTIJD het live token gebruiken. SESSION was een snapshot van bij page-load → na ~1u verlopen →
  // de server gaf 401 "niet ingelogd" op manager-acties (o.a. verwijderen). getSession() geeft het (auto-ververste) huidige token.
  async function authHeaders(extra){
    var tok = SESSION && SESSION.access_token;
    try{ if(sb){ var d = await sb.auth.getSession(); if(d && d.data && d.data.session){ SESSION = d.data.session; tok = SESSION.access_token; } } }catch(e){}
    return Object.assign({ 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' }, extra||{});
  }

  async function laadUsers(){
    root.className='laad'; root.textContent='Gebruikers laden…';
    var r;
    try{ r = await fetch(PROXY+'/api/manager/users', { headers: await authHeaders() }); }
    catch(e){ root.className='fout-groot'; root.textContent='Kan de server niet bereiken: '+e.message; return; }
    if(r.status===403){ root.className='fout-groot'; root.innerHTML='Deze pagina is enkel voor managers.<br><a href="/portal.html">← naar Mijn Fluctus</a>'; return; }
    if(r.status===401){ window.location.href='/portal.html'; return; }
    if(!r.ok){ root.className='fout-groot'; root.textContent='Fout bij ophalen ('+r.status+').'; return; }
    var j = await r.json();
    USERS = (j.users||[]);
    render();
  }

  // Heeft gebruiker toegang tot app? Managers = alles; academy = altijd; anders grant.
  function heeftToegang(u, appId){
    var app = APPS.filter(function(a){ return a.id===appId; })[0];
    if(app && app.altijd) return true;
    if(u.role==='manager') return true;
    return (u.apps||[]).indexOf(appId)>=0;
  }

  function filtered(){
    var q=(FILT.q||'').trim().toLowerCase();
    return USERS.filter(function(u){
      if(q){ var hay=((u.email||'')+' '+(u.name||'')+' '+(u.company||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
      if(FILT.status && (u.status||'active')!==FILT.status) return false;
      if(FILT.app && FILT.access){ var h=heeftToegang(u,FILT.app); if(FILT.access==='heeft' && !h) return false; if(FILT.access==='geen' && h) return false; }
      return true;
    });
  }

  function render(){
    root.className='';
    var appOpts = APPS.map(function(a){ return '<option value="'+a.id+'">'+esc(a.naam)+'</option>'; }).join('');
    root.innerHTML =
      '<div class="kaart">'+
        '<h2>Nieuwe gebruiker uitnodigen</h2>'+
        '<div class="rij">'+
          '<div class="veld"><label>E-mailadres *</label><input type="email" id="inv-email" placeholder="naam@bedrijf.be"></div>'+
          '<div class="veld"><label>Naam</label><input type="text" id="inv-naam" placeholder="Voor- en achternaam"></div>'+
          '<div class="veld"><label>Bedrijf</label><input type="text" id="inv-bedrijf" placeholder="Bedrijfsnaam"></div>'+
          '<button id="inv-btn" class="gr">Uitnodigen</button>'+
        '</div>'+
        '<p class="hint">Nieuwe gebruikers krijgen rol <b>adviseur</b>, een uitnodigingsmail én automatisch toegang tot de <b>Academy</b>. Andere tools ken je hieronder toe.</p>'+
        '<div class="msg" id="inv-msg"></div>'+
      '</div>'+
      '<div class="kaart">'+
        '<h2>Gebruikers &amp; toegang <span class="tel" id="tel"></span></h2>'+
        '<div class="filterbar">'+
          '<div class="veld"><label>Zoek op naam / e-mail</label><input type="search" id="f-q" placeholder="typ een naam…" value="'+esc(FILT.q)+'"></div>'+
          '<div class="veld"><label>Status</label><select id="f-status">'+
            '<option value="">alle</option>'+
            '<option value="active">actief</option>'+
            '<option value="invited">uitgenodigd</option>'+
            '<option value="inactive">inactief</option>'+
          '</select></div>'+
          '<div class="veld"><label>Toegang tot app</label><select id="f-app"><option value="">— kies app —</option>'+appOpts+'</select></div>'+
          '<div class="veld"><label>&nbsp;</label><select id="f-access">'+
            '<option value="">heeft / geen</option>'+
            '<option value="heeft">heeft toegang</option>'+
            '<option value="geen">geen toegang</option>'+
          '</select></div>'+
          '<button class="reset" id="f-reset">Wis filters</button>'+
        '</div>'+
        '<div style="overflow-x:auto"><table><thead><tr>'+
          '<th>Gebruiker</th><th>Rol</th><th>Status</th>'+
          APPS.map(function(a){ return '<th class="app">'+esc(a.naam)+(a.altijd?'<span class="alt">altijd</span>':'')+'</th>'; }).join('')+
          '<th>Acties</th>'+
        '</tr></thead><tbody id="tbody"></tbody></table></div>'+
        '<div class="legende">'+
          '<span><b class="lg lg-on"></b> aangevinkt = heeft toegang (klik om toe te kennen / in te trekken)</span>'+
          '<span><b class="lg lg-auto"></b> vergrendeld = automatisch — managers hebben alle tools, iedereen heeft de Academy</span>'+
          '<span><b class="lg lg-wait"></b> grijs met <span class="noaid">·</span> = adviseur moet eerst één keer inloggen; daarna kan je toekennen</span>'+
        '</div>'+
        '<div class="msg" id="g-msg"></div>'+
      '</div>';
    // sync filter-selects met state
    $('f-status').value=FILT.status; $('f-app').value=FILT.app; $('f-access').value=FILT.access;
    // wiring
    $('inv-btn').onclick = uitnodigen;
    $('f-q').oninput = function(){ FILT.q=this.value; renderTable(); };
    $('f-status').onchange = function(){ FILT.status=this.value; renderTable(); };
    $('f-app').onchange = function(){ FILT.app=this.value; renderTable(); };
    $('f-access').onchange = function(){ FILT.access=this.value; renderTable(); };
    $('f-reset').onclick = function(){ FILT={q:'',status:'',app:'',access:''}; render(); };
    renderTable();
  }

  function renderTable(){
    var list = filtered();
    var tb = $('tbody');
    tb.innerHTML = list.length ? list.map(function(u){ return userRow(u); }).join('')
      : '<tr><td colspan="'+(4+APPS.length)+'" style="color:#6B7280">Geen gebruikers voor deze filter.</td></tr>';
    $('tel').textContent = '· '+list.length+' van '+USERS.length+' gebruikers';
    // wire per zichtbare rij (via email als sleutel)
    list.forEach(function(u){ wireRow(u); });
  }

  function idFor(email){ return 'u_'+String(email).replace(/[^a-z0-9]/gi,'_'); }

  function userRow(u){
    var rid=idFor(u.email);
    var st=(u.status||'active');
    var stBadge='<span class="badge '+(st==='active'?'b-active':st==='invited'?'b-invited':'b-inactive')+'">'+esc(st==='active'?'actief':st==='invited'?'uitgenodigd':'inactief')+'</span>';
    var rolSel='<select class="rolsel" id="'+rid+'_rol">'+
        '<option value="seller"'+(u.role==='seller'?' selected':'')+'>adviseur</option>'+
        '<option value="manager"'+(u.role==='manager'?' selected':'')+'>manager</option>'+
      '</select>';
    var appsCells=APPS.map(function(a){
      var mgr=u.role==='manager';
      var kanNiet=!u.auth_uid;
      var checked=(a.altijd || mgr || (u.apps||[]).indexOf(a.id)>=0) ? ' checked' : '';
      var dis=(a.altijd || mgr || kanNiet) ? ' disabled' : '';
      var tip = a.altijd ? 'title="Iedereen heeft altijd toegang tot de Academy"' : (mgr ? 'title="Managers hebben automatisch alle tools"' : (kanNiet ? 'title="Gebruiker moet eerst inloggen"' : ''));
      return '<td class="app"><input type="checkbox" class="app-toggle" id="'+rid+'_'+a.id+'" data-app="'+a.id+'"'+checked+dis+' '+tip+'>'+
        (kanNiet && !mgr && !a.altijd ? '<div class="noaid">·</div>' : '')+'</td>';
    }).join('');
    var deact = st==='active'
      ? '<button class="sec" id="'+rid+'_deact">Deactiveren</button>'
      : '<button class="gr" id="'+rid+'_react">Activeren</button>';
    // v1.3: verwijderknop (niet voor jezelf). Verwijdert profiel + toegangen + log + auth-user en mailt eerst een export.
    var isZelf = !!(SESSION && SESSION.user && (SESSION.user.email||'').toLowerCase()===(u.email||'').toLowerCase());
    var preview = isZelf ? '' :
      '<button id="'+rid+'_preview" title="Toon wat er zou gebeuren bij verwijderen — wijzigt niets" '+
      'style="background:#fff;color:#1F3864;border:1px solid #C7D2E0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">Preview</button>';
    var verwijder = isZelf ? '' :
      '<button id="'+rid+'_verwijder" title="Gebruiker volledig verwijderen (met export per mail)" '+
      'style="background:#fff;color:#B42318;border:1px solid #F1B0AB;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer">Verwijderen</button>';
    return '<tr>'+
      '<td><div class="u-email">'+esc(u.email)+'</div>'+ (u.name?'<div class="u-naam">'+esc(u.name)+(u.company?' · '+esc(u.company):'')+'</div>':'') +'</td>'+
      '<td>'+rolSel+'</td><td>'+stBadge+'</td>'+appsCells+
      '<td><div class="acts">'+deact+preview+verwijder+'</div></td>'+
    '</tr>';
  }

  function wireRow(u){
    var rid=idFor(u.email);
    var sel=$(rid+'_rol'); if(sel) sel.onchange=function(){ zetRol(u, sel.value); };
    APPS.forEach(function(a){
      if(a.altijd) return;
      var cb=$(rid+'_'+a.id); if(cb && !cb.disabled) cb.onchange=function(){ zetToegang(u, a.id, cb.checked, cb); };
    });
    var da=$(rid+'_deact'); if(da) da.onclick=function(){ zetStatus(u,'inactive'); };
    var ra=$(rid+'_react'); if(ra) ra.onclick=function(){ zetStatus(u,'active'); };
    var vb=$(rid+'_verwijder'); if(vb) vb.onclick=function(){ verwijderGebruiker(u); };
    var pb=$(rid+'_preview'); if(pb) pb.onclick=function(){ previewVerwijder(u); };
  }

  // v1.5: PREVIEW (dry-run) — server telt wat er zou gebeuren en wijzigt/verwijdert/maildt niets.
  async function previewVerwijder(u){
    gmsg('Preview (er wordt niets gewijzigd)…');
    try{
      var r=await fetch(PROXY+'/api/manager/user',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ action:'delete', email:u.email, dry_run:true }) });
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ gmsg('Preview mislukt: '+(j.error||('fout '+r.status)),'err'); alert('Preview mislukt voor '+u.email+':\n\n'+(j.error||('fout '+r.status))); return; }
      if(j.txt){ try{ var bl=new Blob([j.txt],{type:'text/plain;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=j.bestandsnaam||('preview_'+u.email+'.txt'); document.body.appendChild(a); a.click(); setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(_e){} a.remove(); },1000); }catch(e){} }
      var hl=j.herlink||{}, hs=(hl.scenarios||{}).herlinkt||0, hk=(hl.kamino||{}).herlinkt||0, d=j.diagnostiek||{}, zv=j.zou_verwijderen||{};
      var sfout=(hl.scenarios&&hl.scenarios.fout)?(' ⚠ '+hl.scenarios.fout):'';
      var kfout=(hl.kamino&&hl.kamino.fout)?(' ⚠ '+hl.kamino.fout):'';
      var msg='PREVIEW voor '+u.email+' — er is NIETS gewijzigd.\n\n'+
        '• Herlink-doel gevonden: '+(d.doel_gevonden?('ja → '+d.doel_email):'NEE ('+ (d.audit_naar||'?') +' niet als profiel gevonden)')+'\n'+
        '• Zou herlinken: '+hs+' scenario’s'+sfout+' · '+hk+' Kamino-projecten'+kfout+'\n'+
        '• Zou verwijderen: '+(zv.grants||0)+' toegangen, '+(zv.logs||0)+' logregels, '+(zv.certificaten||0)+' certificaten · login: '+(zv.auth_user?'ja':'nee')+'\n'+
        '• GitHub-token (scenario-schrijven): '+(d.github_token?'aanwezig':'ONTBREEKT')+'\n'+
        '• Brevo-mail: '+(d.brevo_key_gezet?('geconfigureerd → '+ (d.audit_naar||'?')):'NIET gezet (export wordt dan enkel gedownload)')+'\n\n'+
        'De volledige preview-export is gedownload.';
      gmsg('Preview klaar voor '+u.email+' — niets gewijzigd. Zou herlinken: '+hs+' scenario’s, '+hk+' Kamino.','ok');
      alert(msg);
    }catch(e){ gmsg('Netwerkfout bij preview: '+e.message,'err'); alert('Netwerkfout bij preview: '+e.message); }
  }

  // v1.3: gebruiker volledig verwijderen — server mailt eerst een .txt-export; UI downloadt 'm ook lokaal als vangnet.
  async function verwijderGebruiker(u){
    var ok=confirm('Gebruiker VOLLEDIG verwijderen?\n\n'+u.email+'\n\nDit verwijdert het profiel, alle app-toegangen, het activiteitslog én de login, en maakt het e-mailadres weer vrij voor een nieuwe uitnodiging. De gelinkte projecten (scenario’s + Kamino) worden herlinkt aan oekene@gmail.com, niet verwijderd. Er wordt eerst een export gemaild (en lokaal gedownload).\n\nDoorgaan?');
    if(!ok) return;
    gmsg('Verwijderen…');
    try{
      var r=await fetch(PROXY+'/api/manager/user',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ action:'delete', email:u.email }) });
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ gmsg('Verwijderen mislukt: '+(j.error||('fout '+r.status)),'err'); alert('Verwijderen mislukt voor '+u.email+':\n\n'+(j.error||('fout '+r.status))); return; }
      // Backup-download van de export (ook als de mail faalde)
      if(j.txt){ try{ var bl=new Blob([j.txt],{type:'text/plain;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=j.bestandsnaam||'export.txt'; document.body.appendChild(a); a.click(); setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(_e){} a.remove(); },1000); }catch(e){} }
      var mailtxt='Audit-export lokaal gedownload.';   // v1.7: geen mail bij verwijderen
      var hl=j.herlink||{}, hs=(hl.scenarios||{}).herlinkt||0, hk=(hl.kamino||{}).herlinkt||0;
      var herlinktxt='Projecten herlinkt aan '+(hl.doel||'oekene@gmail.com')+': '+hs+' scenario’s, '+hk+' Kamino-projecten.';
      gmsg('Verwijderd: '+u.email+'. '+herlinktxt+' '+mailtxt,'ok');
      alert('Verwijderd: '+u.email+'\n\n'+herlinktxt+'\n\n'+mailtxt);
      await laadUsers();
    }catch(e){ gmsg('Netwerkfout bij verwijderen: '+e.message,'err'); alert('Netwerkfout bij verwijderen: '+e.message); }
  }

  async function uitnodigen(){
    var msg=$('inv-msg'); msg.className='msg';
    var email=($('inv-email').value||'').trim(), naam=($('inv-naam').value||'').trim(), bedrijf=($('inv-bedrijf').value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.className='msg err'; msg.textContent='Vul een geldig e-mailadres in.'; return; }
    $('inv-btn').disabled=true; msg.textContent='Bezig…';
    try{
      var r=await fetch(PROXY+'/api/manager/user',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ action:'invite', email:email, name:naam, company:bedrijf }) });
      var j=await r.json().catch(function(){return {};});
      $('inv-btn').disabled=false;
      if(!r.ok){ msg.className='msg err'; msg.textContent=(j.melding||j.error||('fout '+r.status)); return; }
      var mailtxt=(j.mail && j.mail.sent) ? ' Uitnodigingsmail verstuurd.' : (' Profiel aangemaakt (mail niet verstuurd'+(j.mail&&j.mail.reden?': '+j.mail.reden:'')+').');
      msg.className='msg ok'; msg.textContent='Uitgenodigd: '+email+'.'+mailtxt;
      $('inv-email').value=''; $('inv-naam').value=''; $('inv-bedrijf').value='';
      await laadUsers();
    }catch(e){ $('inv-btn').disabled=false; msg.className='msg err'; msg.textContent='Netwerkfout: '+e.message; }
  }

  function gmsg(txt, kind){ var m=$('g-msg'); if(!m) return; m.className='msg '+(kind||''); m.textContent=txt||''; }

  async function zetToegang(u, appId, aan, cb){
    cb.disabled=true; gmsg('');
    try{
      // v1.2: naam meesturen zodat de server een ontbrekende app-rij zelf kan aanmaken in `apps` (auto-provision).
      var _a=APPS.filter(function(x){ return x.id===appId; })[0];
      var _naam=(_a && _a.naam) || appId;
      var r=await fetch(PROXY+'/api/manager/app-access',{ method:(aan?'POST':'DELETE'), headers:await authHeaders(), body:JSON.stringify({ user_id:u.auth_uid, app_id:appId, app_naam:_naam }) });
      cb.disabled=false;
      if(!r.ok){ cb.checked=!aan; var j=await r.json().catch(function(){return {};}); var _reden=(j.error||('fout '+r.status)); gmsg('Kon toegang niet '+(aan?'toekennen':'intrekken')+' voor '+u.email+' ('+_reden+').','err'); alert('Kon toegang niet '+(aan?'toekennen':'intrekken')+' voor '+u.email+':\n\n'+_reden); return; }   // v1.1: fout ook in alert (de #g-msg staat onder de tabel, dus buiten beeld bij een lange lijst)
      u.apps=(u.apps||[]).filter(function(x){ return x!==appId; }); if(aan) u.apps.push(appId);
      gmsg((aan?'Toegang tot '+appId+' toegekend aan ':'Toegang tot '+appId+' ingetrokken bij ')+u.email+'.','ok');
      $('tel').textContent='· '+filtered().length+' van '+USERS.length+' gebruikers';
    }catch(e){ cb.disabled=false; cb.checked=!aan; gmsg('Netwerkfout bij toegang wijzigen: '+e.message,'err'); alert('Netwerkfout bij toegang wijzigen voor '+u.email+':\n\n'+e.message); }
  }

  async function zetRol(u, role){
    var r=await fetch(PROXY+'/api/manager/user',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ action:'role', email:u.email, role:role }) });
    if(r.ok){ u.role=role; renderTable(); } else { alert('Kon rol niet wijzigen ('+r.status+').'); renderTable(); }
  }

  async function zetStatus(u, status){
    var r=await fetch(PROXY+'/api/manager/user',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ action:'status', email:u.email, status:status }) });
    if(r.ok){ u.status=status; renderTable(); } else { alert('Kon status niet wijzigen ('+r.status+').'); }
  }

  (async function(){
    try{ await loadConfig(); await initAuth(); }
    catch(e){ root.className='fout-groot'; root.textContent='Init-fout: '+e.message; }
  })();
})();
</script>
<script src="/apps/mijn-fluctus.js"></script>
