<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campagne RESCert · Energie-Compas</title>
<link rel="icon" href="/favicon-ec.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-ec-32.png">
<!-- campagne-rescert.html v1.0.1 (2026-11-10, Johan): ondertitel «Tel in batterijen per week, niet in batterijen per klant». -->
<!-- campagne-rescert.html v1.0.0 (2026-11-09, Johan): RESCERT-CAMPAGNE «Eén batterij per week».
     Voortgang van de mailing aan RESCert-installateurs (Vlaanderen): verzending met mondjesmaat vanuit johan@energie-compas.eu,
     A/B/C-varianten, antwoorden om manueel te behandelen, aspiranten → adviseur (via /api/adviseur/aanmaken), contacten, instellingen.
     Enkel managers. Server ≥ 15.415.0 (/api/rc…). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/mijnec-knop.js?v=1.0.1"></script>
<style>
  :root{--ink:#14203a;--ink2:#54617a;--muted:#8a94a6;--line:#e6eaf1;--soft:#f5f8fc;--green:#05b050;--green-d:#048443;--green-bg:#e6f6ec;--amber:#B45309;--amber-bg:#FFF4E5;--red:#c0392b;--red-bg:#FDECEC;--blue:#2a44a8}
  *{box-sizing:border-box} body{margin:0;background:var(--soft);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px} .sub{color:var(--muted);font-size:12px}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;max-width:1250px;margin:0 auto}
  nav.tabs button{border-radius:10px 10px 0 0;border-bottom:none;background:#eef2f7;color:var(--ink2)}
  nav.tabs button.on{background:#fff;color:var(--ink);font-weight:700}
  .tel{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;text-align:center}
  main{max-width:1250px;margin:0 auto;padding:0 16px 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  .rij{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .rij label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.groen{background:var(--green);border-color:var(--green);color:#fff;font-weight:600} button.groen:hover{background:var(--green-d)}
  button.rood{border-color:#F2C7C7;color:var(--red)} button.klein{padding:3px 10px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:24px;font-weight:750;line-height:1.2} .kpi .s{font-size:12px;color:var(--ink2)}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:70vh}
  table{border-collapse:collapse;width:100%} th,td{padding:7px 10px;border-bottom:1px solid #EEF2F7;text-align:left;font-size:13px;vertical-align:top}
  thead th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:#F1F3F7;color:var(--ink2)}
  .st.groen{background:var(--green-bg);color:var(--green-d)} .st.oranje{background:var(--amber-bg);color:var(--amber)} .st.rood{background:var(--red-bg);color:var(--red)} .st.blauw{background:#EAF0FF;color:var(--blue)}
  .msg{font-size:13px;min-height:1.2em} .ok{color:var(--green-d)} .err{color:var(--red)}
  pre.vb{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.55 inherit;font-family:inherit;margin:6px 0 0}
  .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px} .state{color:var(--muted);padding:20px}
  .banner{border-radius:12px;padding:12px 16px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner.aan{background:var(--green-bg)} .banner.uit{background:#EEF2F7} .banner.pauze{background:var(--amber-bg)}
  .prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px} .prog div{height:100%;background:var(--green)}
  .grafiek{position:relative} .grafiek svg{display:block;width:100%;height:auto} .tip{position:absolute;pointer-events:none;background:#14203a;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;display:none;white-space:nowrap}
  .antw{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .antw .kop{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline} .antw .prev{white-space:pre-wrap;color:var(--ink2);margin:6px 0}
  .muted{color:var(--muted)} .klein{font-size:12px}
  details summary{cursor:pointer;color:var(--blue)}
  @media (max-width:640px){ .kpi .v{font-size:20px} }
</style>
</head>
<body>
<header><b>✉️ Campagne RESCert</b><span class="sub">Tel in batterijen per week, niet in batterijen per klant</span><span class="who" id="who"></span><a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a></header>
<nav class="tabs" id="tabs"></nav>
<main><div id="root"><div class="state">Laden…</div></div></main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var sb=null, SESSION=null, PROXY='', D=null, TAB='overzicht', FILTER={st:'',tier:'',q:''};
  try{ TAB=localStorage.getItem('rc_tab')||'overzicht'; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function p2(n){ return (n<10?'0':'')+n; }
  function dt(ts){ if(!ts) return ''; var d=new Date(+ts); return p2(d.getDate())+'-'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
  function pct(a,b){ return b?Math.round(100*a/b)+' %':'–'; }
  async function hdr(){ try{ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session) SESSION=d.data.session; }catch(e){} return { 'Authorization':'Bearer '+(SESSION&&SESSION.access_token), 'Content-Type':'application/json' }; }
  async function api(pad, body){ var r=await fetch(PROXY+pad,{ method:body?'POST':'GET', headers:await hdr(), body:body?JSON.stringify(body):undefined, cache:'no-store' }); var j=await r.json().catch(function(){return{};}); if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status)); return j; }
  var ST={ wacht:['wacht',''], nakijken:['nakijken','oranje'], reserve:['reserve',''], uitgesloten:['uitgesloten','rood'], verstuurd:['verstuurd','blauw'], opgevolgd:['opgevolgd','blauw'], geklikt:['geklikt','groen'],
    antwoord_open:['antwoord open','oranje'], geantwoord:['geantwoord','groen'], aspirant:['aspirant','groen'], adviseur:['adviseur','groen'], afgemeld:['afgemeld',''], bounce:['bounce','rood'] };
  function stLabel(s){ var x=ST[s]||[s,'']; return '<span class="st '+x[1]+'">'+esc(x[0])+'</span>'; }
  function openAntw(){ var n=0; (D.contacten||[]).forEach(function(c){ (c.antw||[]).forEach(function(a){ if(a.soort==='antwoord'&&!a.af) n++; }); }); return n; }
  function nieuweAsp(){ return (D.aspiranten||[]).filter(function(a){ return a.status==='aspirant'&&!a.gezien; }).length; }
  function tabs(){
    var T=[['overzicht','Overzicht'],['antwoorden','Antwoorden',openAntw()],['aspiranten','Aspiranten',nieuweAsp()],['contacten','Contacten'],['mails','Mails'],['instellingen','Instellingen']];
    $('tabs').innerHTML=T.map(function(t){ return '<button data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+(t[2]?'<span class="tel">'+t[2]+'</span>':'')+'</button>'; }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){ b.onclick=function(){ TAB=b.dataset.t; try{localStorage.setItem('rc_tab',TAB);}catch(e){} render(); }; });
  }
  function banner(){
    var s=D.status||{}, c=D.config||{};
    var cls=!s.actief?'uit':(s.pauze?'pauze':'aan');
    var t=!s.actief?'<b>Verzending staat uit.</b> Niets vertrekt tot je op Start klikt.'
      : (s.pauze?'<b>Gepauzeerd:</b> '+esc(s.pauze.reden)+'. Behandel eerst de antwoorden of aanmeldingen; daarna loopt het vanzelf verder.'
      : '<b>Verzending loopt.</b> '+(s.in_venster?'Volgende mail '+(s.volgende&&s.volgende>Date.now()?'rond '+dt(s.volgende).slice(6):'binnen de minuut')+'.':'Buiten het venster ('+esc(c.venster_van)+'–'+esc(c.venster_tot)+', werkdagen).'));
    return '<div class="banner '+cls+'"><div style="flex:1;min-width:240px">'+t+'<div class="klein muted">Vandaag '+(s.vandaag||0)+' van max. '+(s.plafond||0)+' mails · golven: tier '+esc((c.tiers||[]).join(', '))+' · afzender '+esc(c.afzender)+(s.inbox_sync?' · inbox gelezen '+dt(s.inbox_sync).slice(6):'')+(s.graph?'':' · <b class="err">Graph niet actief</b>')+'</div>'+
      '<div class="prog"><div style="width:'+Math.min(100,Math.round(100*(s.vandaag||0)/Math.max(1,s.plafond||1)))+'%"></div></div></div>'+
      (s.actief?'<button id="b-pauze">⏸ Pauzeer</button>':'<button class="groen" id="b-start">▶ Start verzending</button>')+'<button id="b-sync">↻ Inbox nu lezen</button></div>';
  }
  function bindBanner(){
    var st=$('b-start'), pz=$('b-pauze'), sy=$('b-sync');
    if(st) st.onclick=async function(){ if(!confirm('Verzending starten? Er vertrekken mails vanuit '+D.config.afzender+', met mondjesmaat binnen het venster.')) return; st.disabled=true; try{ await api('/api/rc/config',{config:{actief:true}}); await laad(); }catch(e){ alert(e.message); st.disabled=false; } };
    if(pz) pz.onclick=async function(){ pz.disabled=true; try{ await api('/api/rc/config',{config:{actief:false}}); await laad(); }catch(e){ alert(e.message); pz.disabled=false; } };
    if(sy) sy.onclick=async function(){ sy.disabled=true; try{ var r=await api('/api/rc/sync',{}); await laad(); toast((r.nieuw||0)+' nieuwe berichten verwerkt'); }catch(e){ alert(e.message); sy.disabled=false; } };
  }
  function toast(t){ var m=document.createElement('div'); m.textContent=t; m.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14203a;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:9'; document.body.appendChild(m); setTimeout(function(){ m.remove(); },2600); }

  function grafiek(dagen){
    var W=760,H=170,pl=28,pb=22,pt=10, n=dagen.length, max=Math.max(5,Math.max.apply(null,dagen.map(function(d){return d.mail||0;})));
    var bw=(W-pl-8)/n, g='';
    for(var k=0;k<=2;k++){ var y=pt+(H-pt-pb)*(1-k/2), v=Math.round(max*k/2); g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="#EEF2F7"/><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="10" fill="#8a94a6" text-anchor="end">'+v+'</text>'; }
    dagen.forEach(function(d,i){
      var v=d.mail||0, h=(H-pt-pb)*v/max, x=pl+i*bw+2, w=Math.max(2,bw-4), y=H-pb-h;
      if(v>0) g+='<path d="M'+x+','+(H-pb)+'V'+(y+Math.min(4,h))+'q0,-4 4,-4h'+(w-8)+'q4,0 4,4V'+(H-pb)+'z" fill="#05b050"/>';
      g+='<rect class="hit" data-i="'+i+'" x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+(H-pt-pb)+'" fill="transparent"/>';
      if(i%3===0||i===n-1) g+='<text x="'+(x+w/2)+'" y="'+(H-6)+'" font-size="10" fill="#8a94a6" text-anchor="middle">'+d.datum.slice(8,10)+'/'+d.datum.slice(5,7)+'</text>';
    });
    g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#d9dee7"/>';
    return '<div class="grafiek" id="graf"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Verstuurde mails per dag, laatste 21 dagen">'+g+'</svg><div class="tip" id="tip"></div></div>';
  }
  function bindGrafiek(dagen){
    var box=$('graf'); if(!box) return; var tip=$('tip');
    Array.prototype.forEach.call(box.querySelectorAll('.hit'),function(r){
      r.addEventListener('mousemove',function(ev){ var d=dagen[+r.dataset.i]; tip.innerHTML='<b>'+d.datum.split('-').reverse().join('/')+'</b><br>mails '+(d.mail||0)+(d.opvolg?' (waarvan '+d.opvolg+' opvolg)':'')+'<br>kliks '+(d.klik||0)+' · antwoorden '+(d.antwoord||0)+'<br>aanmeldingen '+(d.aanmelding||0)+' · bounces '+(d.bounce||0)+' · afgemeld '+(d.afgemeld||0);
        var bb=box.getBoundingClientRect(); tip.style.display='block'; tip.style.left=Math.min(bb.width-170,Math.max(0,ev.clientX-bb.left+12))+'px'; tip.style.top=Math.max(0,ev.clientY-bb.top-70)+'px'; });
      r.addEventListener('mouseleave',function(){ tip.style.display='none'; });
    });
  }
  function rOverzicht(){
    var s=D.stats, T=s.totaal, A=D.activatie||{}, asp=D.aspiranten||[];
    var nAdv=asp.filter(function(a){return a.status==='adviseur';}).length, nAsp=asp.filter(function(a){return a.status==='aspirant';}).length;
    var actief=0, verk=0; asp.forEach(function(a){ var p=(A.per||{})[String(a.mail||'').toLowerCase()]; if(p){ if(p.dossiers>0) actief++; verk+=p.batterijen||0; } });
    var h=banner();
    h+='<div class="kpis">'+
      kpi('Batterijen per dag (platform)', (A.per_dag_30d||0).toLocaleString('nl-BE'), 'doel 1 · '+(A.batterijen_30d||0)+' bevestigd in 30 dagen')+
      kpi('Verstuurd', T.verstuurd, 'van '+(T.totaal-(s.perStatus.uitgesloten||0))+' te bereiken · '+T.opgevolgd+' opgevolgd')+
      kpi('Geklikt', T.geklikt, pct(T.geklikt,T.verstuurd)+' van verstuurd')+
      kpi('Geantwoord', T.antwoord, pct(T.antwoord,T.verstuurd)+' · '+openAntw()+' open')+
      kpi('Aspiranten', nAsp, nieuweAsp()+' nieuw')+
      kpi('Adviseurs', nAdv, actief+' met een dossier · '+verk+' batterij(en) verkocht')+
      kpi('Afgemeld / bounce', T.afgemeld+' / '+T.bounce, pct(T.bounce,T.verstuurd)+' bounce')+
    '</div>';
    h+='<div class="card" style="margin-top:14px"><h3>Mails per dag (laatste 21 dagen)</h3>'+grafiek(s.dagen)+'</div>';
    h+='<div class="card"><h3>Welke variant werkt?</h3><div class="wrap" style="max-height:none"><table><thead><tr><th>Variant</th><th>Onderwerp</th><th class="n">Verstuurd</th><th class="n">Geklikt</th><th class="n">Geantwoord</th><th class="n">Aangemeld</th><th class="n">Afgemeld</th><th class="n">Bounce</th></tr></thead><tbody>'+
      ['A','B','C'].map(function(v){ var x=s.perVar[v]; return '<tr><td><b>'+v+'</b></td><td>'+esc(D.voorbeeld[v].subject)+'</td><td class="n">'+x.verstuurd+'</td><td class="n">'+x.geklikt+' <span class="muted">'+pct(x.geklikt,x.verstuurd)+'</span></td><td class="n">'+x.antwoord+' <span class="muted">'+pct(x.antwoord,x.verstuurd)+'</span></td><td class="n">'+x.aangemeld+' <span class="muted">'+pct(x.aangemeld,x.verstuurd)+'</span></td><td class="n">'+x.afgemeld+'</td><td class="n">'+x.bounce+'</td></tr>'; }).join('')+
      '</tbody></table></div><p class="klein muted">Trek pas conclusies vanaf ± 150 verstuurde mails per variant. Tot dan is het verschil vooral toeval.</p></div>';
    h+='<div class="card"><h3>Per golf</h3><div class="wrap" style="max-height:none"><table><thead><tr><th>Tier</th><th>Wat</th><th class="n">Totaal</th><th class="n">Wacht</th><th class="n">Verstuurd</th><th class="n">Geklikt</th><th class="n">Geantwoord</th><th class="n">Aangemeld</th></tr></thead><tbody>'+
      [[1,'bedrijfsdomein, sterkste signalen'],[2,'bedrijfsdomein'],[3,'gmail, telenet, …']].map(function(t){ var x=s.perTier[t[0]]; return '<tr><td><b>'+t[0]+'</b>'+((D.config.tiers||[]).indexOf(t[0])>=0?' <span class="st groen">aan</span>':'')+'</td><td>'+t[1]+'</td><td class="n">'+x.totaal+'</td><td class="n">'+x.wacht+'</td><td class="n">'+x.verstuurd+'</td><td class="n">'+x.geklikt+'</td><td class="n">'+x.antwoord+'</td><td class="n">'+x.aangemeld+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>';
    h+='<div class="card"><h3>Status van alle contacten</h3><div class="rij">'+Object.keys(s.perStatus).map(function(k){ return '<span>'+stLabel(k)+' '+s.perStatus[k]+'</span>'; }).join('')+'</div></div>';
    $('root').innerHTML=h; bindBanner(); bindGrafiek(s.dagen);
  }
  function kpi(l,v,s){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>'; }

  function rAntwoorden(){
    var lijst=[]; (D.contacten||[]).forEach(function(c){ (c.antw||[]).forEach(function(a){ lijst.push({c:c,a:a}); }); });
    lijst.sort(function(x,y){ return (x.a.af===y.a.af?0:(x.a.af?1:-1)) || y.a.ts-x.a.ts; });
    var h=banner()+'<div class="card"><h3>Antwoorden</h3><p class="klein muted">«stop» en afwezigheidsberichten worden automatisch verwerkt. Echte antwoorden blijven open tot je ze afhandelt; bij te veel open antwoorden pauzeert de verzending.</p>';
    if(!lijst.length) h+='<div class="state">Nog geen antwoorden.</div>';
    lijst.slice(0,200).forEach(function(x){ var c=x.c,a=x.a;
      h+='<div class="antw" style="'+(a.af?'opacity:.6':'')+'"><div class="kop"><b>'+esc(c.naam||c.mail)+'</b><span class="muted">'+esc(c.bedrijf||'')+' · '+esc(c.prov||'')+'</span>'+
        '<span class="st '+(a.soort==='antwoord'?(a.af?'groen':'oranje'):'')+'">'+(a.soort==='antwoord'?(a.af?'afgehandeld':'open'):(a.soort==='stop'?'stop':'afwezig'))+'</span><span class="muted klein" style="margin-left:auto">'+dt(a.ts)+' · variant '+esc(c.sent_var||c.var)+'</span></div>'+
        '<div class="klein"><b>'+esc(a.onderwerp)+'</b> — '+esc(a.van)+'</div><div class="prev">'+esc(a.prev)+'</div>'+
        '<div class="rij">'+(a.link?'<a href="'+esc(a.link)+'" target="_blank" rel="noopener">Open in Outlook</a>':'')+(c.tel?'<a href="tel:'+esc(c.tel)+'">📞 '+esc(c.tel)+'</a>':'')+
        (a.soort==='antwoord'&&!a.af?'<button class="klein groen" data-a="stuur_link" data-id="'+c.id+'" title="Korte mail met de aanmeldlink en markeer als afgehandeld">Stuur aanmeldlink</button><button class="klein" data-a="afgehandeld" data-id="'+c.id+'">Afgehandeld</button><button class="klein rood" data-a="afmelden" data-id="'+c.id+'">Geen interesse</button>':'')+'</div></div>';
    });
    $('root').innerHTML=h+'</div>'; bindBanner(); bindActies();
  }
  function bindActies(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(b){ b.onclick=async function(){
      var actie=b.dataset.a, body={ids:[b.dataset.id],actie:actie};
      if(actie==='uitsluiten'){ var r=prompt('Reden van uitsluiting?','manueel'); if(r===null) return; body.reden=r; }
      if(actie==='notitie'){ var n=prompt('Notitie',b.dataset.n||''); if(n===null) return; body.notitie=n; }
      b.disabled=true; try{ var j=await api('/api/rc/contact',body); if(j.fouten&&j.fouten.length) alert(j.fouten.join('\n')); await laad(); }catch(e){ alert(e.message); b.disabled=false; } }; });
  }

  function rAspiranten(){
    var A=D.activatie||{}, L=(D.aspiranten||[]).slice().sort(function(a,b){ return (a.status==='aspirant'?0:1)-(b.status==='aspirant'?0:1) || b.ts-a.ts; });
    var h=banner()+'<div class="card"><h3>Aspiranten</h3><p class="klein muted">Wie zich aanmeldt, is aspirant. Bel hem, kijk na en maak hem dan adviseur: dan krijgt hij de uitnodiging en toegang tot de tools.</p>';
    if(!L.length) h+='<div class="state">Nog geen aanmeldingen.</div>';
    L.forEach(function(a){ var v=a.velden||{}, p=(A.per||{})[String(a.mail||'').toLowerCase()]||{};
      h+='<div class="antw"><div class="kop"><b>'+esc([v.voornaam,v.naam].join(' '))+'</b><span>'+esc(v.bedrijf)+'</span>'+stLabel(a.status)+(a.gezien||a.status!=='aspirant'?'':'<span class="st oranje">nieuw</span>')+(a.waarschuwing?'<span class="st rood">⚠ '+esc(a.waarschuwing)+'</span>':'')+'<span class="muted klein" style="margin-left:auto">'+dt(a.ts)+(a.code?' · via mail':' · open aanmelding')+'</span></div>'+
        '<table style="margin-top:6px"><tbody>'+
        rij('Contact', esc(v.mail)+' · <a href="tel:'+esc(v.gsm)+'">'+esc(v.gsm)+'</a>'+(v.website?' · <a href="'+esc(/^https?:/.test(v.website)?v.website:'https://'+v.website)+'" target="_blank" rel="noopener">'+esc(v.website)+'</a>':''))+
        rij('Bedrijf', esc(v.bedrijf)+' · btw '+esc(v.btw)+' · '+esc(v.postcode))+
        rij('Regio', esc((v.regio||[]).join(', ')))+
        rij('Ploeg / capaciteit', esc(v.technici||'?')+' technici · '+esc(v.capaciteit||'?')+' C&I-batterijen per maand')+
        rij('Ervaring', 'batterijen bij bedrijven: '+esc(v.batt_bedrijven||'?')+' · cabines/MS: '+esc(v.ms_ervaring||'?')+' · laadpalen: '+esc(v.laadpalen||'?'))+
        rij('Klanten met cabine', esc(v.klanten_cabine||'?'))+(v.merken?rij('Merken',esc(v.merken)):'')+(v.opmerking?rij('Opmerking',esc(v.opmerking)):'')+
        (a.status==='adviseur'?rij('Activatie', (p.dossiers||0)+' dossier(s) · '+(p.verkopen||0)+' bevestigd · '+(p.batterijen||0)+' met batterij'):'')+
        rij('Notitie', '<textarea data-not="'+a.id+'" rows="2" style="width:100%">'+esc(a.notitie||'')+'</textarea>')+
        '</tbody></table><div class="rij" style="margin-top:8px">'+
        (a.status==='aspirant'?'<button class="groen" data-asp="adviseur" data-id="'+a.id+'">✔ Maak adviseur</button><button data-asp="gezien" data-id="'+a.id+'">Gezien, bel later</button><button class="rood" data-asp="afwijzen" data-id="'+a.id+'">Afwijzen</button>':'')+
        (a.status==='afgewezen'?'<button data-asp="aspirant" data-id="'+a.id+'">Terug naar aspirant</button>':'')+
        '<button data-asp="notitie" data-id="'+a.id+'">Notitie bewaren</button></div></div>';
    });
    $('root').innerHTML=h+'</div>'; bindBanner();
    Array.prototype.forEach.call(document.querySelectorAll('[data-asp]'),function(b){ b.onclick=async function(){
      var a=(D.aspiranten||[]).find(function(x){return x.id===b.dataset.id;}), v=a.velden||{}, actie=b.dataset.asp;
      var not=document.querySelector('[data-not="'+a.id+'"]'), body={id:a.id,actie:actie==='notitie'?null:actie,notitie:not?not.value:undefined};
      if(actie==='adviseur'&&!confirm('Maak '+[v.voornaam,v.naam].join(' ')+' ('+a.mail+') adviseur? Hij krijgt meteen de uitnodigingsmail met toegang tot de tools.')) return;
      if(actie==='afwijzen'&&!confirm('Aanmelding afwijzen? Er gaat geen mail naar de kandidaat.')) return;
      b.disabled=true;
      try{
        if(actie==='adviseur') await api('/api/adviseur/aanmaken',{email:a.mail,naam:[v.voornaam,v.naam].filter(Boolean).join(' '),company:v.bedrijf});
        await api('/api/rc/aspirant',body); await laad(); toast(actie==='adviseur'?'Adviseur aangemaakt en uitgenodigd':'Bewaard');
      }catch(e){ alert(e.message); b.disabled=false; } }; });
  }
  function rij(k,v){ return '<tr><th style="width:170px;background:none;position:static;text-transform:none;font-size:12px;letter-spacing:0">'+esc(k)+'</th><td>'+v+'</td></tr>'; }

  function rContacten(){
    var C=D.contacten||[], q=FILTER.q.toLowerCase();
    var L=C.filter(function(c){ return (!FILTER.st||c.st===FILTER.st) && (!FILTER.tier||String(c.tier)===FILTER.tier) && (!q||[c.mail,c.naam,c.bedrijf,c.plaats,c.prov].join(' ').toLowerCase().indexOf(q)>=0); })
      .sort(function(a,b){ return (b.sent_ts||0)-(a.sent_ts||0) || (a.tier-b.tier) || ((a.volg||1e9)-(b.volg||1e9)); });
    var sts=Object.keys(ST);
    var h=banner()+'<div class="card"><div class="rij" style="margin-bottom:10px"><label>Zoeken<input id="f-q" value="'+esc(FILTER.q)+'" placeholder="naam, bedrijf, plaats"></label>'+
      '<label>Status<select id="f-st"><option value="">alle</option>'+sts.map(function(s){ return '<option value="'+s+'"'+(FILTER.st===s?' selected':'')+'>'+esc(ST[s][0])+' ('+(D.stats.perStatus[s]||0)+')</option>'; }).join('')+'</select></label>'+
      '<label>Tier<select id="f-t"><option value="">alle</option><option'+(FILTER.tier==='1'?' selected':'')+'>1</option><option'+(FILTER.tier==='2'?' selected':'')+'>2</option><option'+(FILTER.tier==='3'?' selected':'')+'>3</option></select></label>'+
      '<span class="muted klein">'+L.length+' van '+C.length+(L.length>400?' (eerste 400 getoond)':'')+'</span></div>'+
      '<div class="wrap"><table><thead><tr><th>Status</th><th>Naam</th><th>Bedrijf</th><th>Plaats</th><th>Tier</th><th>Var.</th><th>Verstuurd</th><th>Klik</th><th>Info</th><th></th></tr></thead><tbody>'+
      L.slice(0,400).map(function(c){ return '<tr><td>'+stLabel(c.st)+'</td><td>'+esc(c.naam)+'<div class="klein muted">'+esc(c.mail)+'</div></td><td>'+esc(c.bedrijf)+'<div class="klein muted">'+esc(c.tel)+'</div></td><td>'+esc(c.plaats)+'<div class="klein muted">'+esc(c.prov)+'</div></td><td>'+c.tier+'</td><td>'+esc(c.sent_var||c.var)+'</td><td class="klein">'+dt(c.sent_ts)+(c.fu_ts?'<br>opvolg '+dt(c.fu_ts):'')+'</td><td class="klein">'+(c.kliks?c.kliks+'×':'')+'</td>'+
        '<td class="klein">'+esc(c.uit||c.nak||'')+(c.notitie?'<div>📝 '+esc(c.notitie)+'</div>':'')+'</td><td style="white-space:nowrap">'+
        ((c.uit||c.nak||c.st==='reserve')?'<button class="klein" data-a="vrijgeven" data-id="'+c.id+'">Vrijgeven</button>':(c.st==='wacht'?'<button class="klein rood" data-a="uitsluiten" data-id="'+c.id+'">Uitsluiten</button>':''))+
        '<button class="klein" data-a="notitie" data-id="'+c.id+'" data-n="'+esc(c.notitie)+'">📝</button></td></tr>'; }).join('')+'</tbody></table></div></div>';
    $('root').innerHTML=h; bindBanner(); bindActies();
    $('f-q').oninput=function(){ FILTER.q=this.value; clearTimeout(window._fq); window._fq=setTimeout(function(){ rContacten(); var i=$('f-q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },300); };
    $('f-st').onchange=function(){ FILTER.st=this.value; rContacten(); }; $('f-t').onchange=function(){ FILTER.tier=this.value; rContacten(); };
  }

  function rMails(){
    var V=D.voorbeeld, h=banner()+'<div class="card"><h3>Mails</h3><p class="klein muted">Platte tekst, vanuit '+esc(D.config.afzender)+'. Voornaam, plaats, provincie en de links worden per contact ingevuld. De opvolgmail (F) gaat één keer, na '+esc(D.config.opvolg_werkdagen)+' werkdagen zonder reactie.</p>'+
      '<div class="rij"><button class="groen" id="t-alle">🧪 Stuur A, B, C en F naar mij</button><label>naar<input id="t-aan" placeholder="'+esc((SESSION.user&&SESSION.user.email)||'')+'"></label><span class="msg" id="t-msg"></span></div></div>';
    ['A','B','C','F'].forEach(function(k){ h+='<div class="card"><h3>'+(k==='F'?'Opvolgmail':'Variant '+k)+' — «'+esc(V[k].subject)+'»</h3><pre class="vb">'+esc(V[k].text)+'</pre></div>'; });
    $('root').innerHTML=h; bindBanner();
    $('t-alle').onclick=async function(){ var b=this; b.disabled=true; $('t-msg').textContent='Versturen…';
      try{ var r=await api('/api/rc/test',{variant:'alle',aan:$('t-aan').value.trim()||undefined}); $('t-msg').innerHTML='<span class="ok">'+r.resultaat.map(function(x){return x.soort+(x.ok?' ✔':' ✖ '+x.fout);}).join(' · ')+' → '+esc(r.aan)+'</span>'; }
      catch(e){ $('t-msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } b.disabled=false; };
  }

  function rInstellingen(){
    var c=D.config, h=banner();
    h+='<div class="card"><h3>Tempo en venster</h3><div class="rij">'+
      inp('dag_start','Start (mails/dag)')+inp('dag_stap','Erbij per verzenddag')+inp('dag_max','Maximum per dag')+inp('gap_min','Min. minuten ertussen')+inp('gap_max','Max. minuten ertussen')+
      inp('venster_van','Van (werkdagen)','text')+inp('venster_tot','Tot','text')+'</div>'+
      '<div class="rij" style="margin-top:10px">'+inp('max_open','Pauze bij zoveel open antwoorden')+inp('bounce_pct','Pauze bij bounce % >')+inp('opvolg_werkdagen','Opvolgmail na werkdagen')+
      '<label>Opvolgmail<select data-k="opvolg"><option value="1"'+(c.opvolg!==false?' selected':'')+'>aan</option><option value="0"'+(c.opvolg===false?' selected':'')+'>uit</option></select></label></div>'+
      '<div class="rij" style="margin-top:10px"><label>Golven die mogen vertrekken<span>'+[1,2,3].map(function(t){ return '<label style="display:inline-flex;flex-direction:row;gap:4px;margin-right:10px"><input type="checkbox" data-tier="'+t+'"'+((c.tiers||[]).indexOf(t)>=0?' checked':'')+'>tier '+t+'</label>'; }).join('')+'</span></label>'+
      '<label>Varianten<span>'+['A','B','C'].map(function(v){ return '<label style="display:inline-flex;flex-direction:row;gap:4px;margin-right:10px"><input type="checkbox" data-var="'+v+'"'+((c.varianten||[]).indexOf(v)>=0?' checked':'')+'>'+v+'</label>'; }).join('')+'</span></label></div></div>';
    h+='<div class="card"><h3>Afzender, meldingen en spelregels</h3><div class="rij">'+inp('afzender','Afzender (@energie-compas.eu)','text')+inp('melding_aan','Meldingen van aanmeldingen naar','text')+
      inp('fee_ls','Vergoeding LS (euro)')+inp('fee_ms','Vergoeding MS (euro)')+inp('excl_dagen','Exclusiviteit (dagen)')+inp('max_open_dossiers','Max. open berekeningen')+'</div>'+
      '<div class="rij" style="margin-top:10px"><label style="flex:1;min-width:260px">Handtekening<textarea data-k="handtekening" rows="3">'+esc(c.handtekening)+'</textarea></label>'+
      '<label style="flex:1;min-width:260px">Uitsluiten (één per regel: domein, bedrijf of naam)<textarea data-k="uitsluit" rows="6">'+esc(c.uitsluit)+'</textarea></label></div>'+
      '<p class="klein muted">Daarnaast sluit de server altijd uit: iedereen met een profiel in Gebruikers (en zijn bedrijfsdomein), partners en hun adviseurs, contacten van de EPC-campagne en LinkedIn-ambassadeurs. Dat wordt vlak voor elke mail opnieuw gecontroleerd.</p>'+
      '<div class="rij"><button class="groen" id="c-ok">Bewaren</button><span class="msg" id="c-msg"></span></div></div>';
    h+='<div class="card"><h3>Lijst importeren</h3><p class="klein muted">JSON-bestand met de gescoorde lijst (rescert_vlaanderen_campagne.json). Bestaande adressen worden niet dubbel opgenomen; wie al gemaild is, blijft ongewijzigd.</p>'+
      '<div class="rij"><input type="file" id="imp" accept=".json,application/json"><button id="imp-ok">Importeren</button><span class="msg" id="imp-msg"></span></div></div>';
    $('root').innerHTML=h; bindBanner();
    $('c-ok').onclick=async function(){ var b=this, cfg={};
      Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(el){ var k=el.dataset.k; cfg[k]=(k==='opvolg')?el.value==='1':el.value; });
      cfg.tiers=Array.prototype.filter.call(document.querySelectorAll('[data-tier]'),function(x){return x.checked;}).map(function(x){return +x.dataset.tier;});
      cfg.varianten=Array.prototype.filter.call(document.querySelectorAll('[data-var]'),function(x){return x.checked;}).map(function(x){return x.dataset.var;});
      b.disabled=true; try{ await api('/api/rc/config',{config:cfg}); $('c-msg').innerHTML='<span class="ok">Bewaard</span>'; await laad(); }catch(e){ $('c-msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; b.disabled=false; } };
    $('imp-ok').onclick=async function(){ var f=$('imp').files[0]; if(!f){ $('imp-msg').textContent='Kies eerst een bestand.'; return; } var b=this; b.disabled=true; $('imp-msg').textContent='Bezig…';
      try{ var j=JSON.parse(await f.text()); var lijst=Array.isArray(j)?j:(j.contacten||[]); var tot={nieuw:0,bijgewerkt:0,uitgesloten:0};
        for(var i=0;i<lijst.length;i+=500){ var r=await api('/api/rc/import',{contacten:lijst.slice(i,i+500)}); tot.nieuw+=r.nieuw; tot.bijgewerkt+=r.bijgewerkt; tot.uitgesloten+=r.uitgesloten; $('imp-msg').textContent='Bezig… '+Math.min(lijst.length,i+500)+'/'+lijst.length; }
        $('imp-msg').innerHTML='<span class="ok">'+tot.nieuw+' nieuw, '+tot.bijgewerkt+' bijgewerkt, '+tot.uitgesloten+' uitgesloten</span>'; await laad(); }
      catch(e){ $('imp-msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; b.disabled=false; } };
  }
  function inp(k,l,type){ return '<label>'+esc(l)+'<input data-k="'+k+'" type="'+(type||'number')+'" value="'+esc(D.config[k])+'" style="width:'+(type==='text'?'200px':'110px')+'"></label>'; }

  function render(){ if(!D) return; tabs();
    if(TAB==='antwoorden') rAntwoorden(); else if(TAB==='aspiranten') rAspiranten(); else if(TAB==='contacten') rContacten(); else if(TAB==='mails') rMails(); else if(TAB==='instellingen') rInstellingen(); else rOverzicht(); }
  async function laad(){
    try{ D=await api('/api/rc'); render(); }
    catch(e){ $('root').innerHTML='<div class="fout">'+(/Manager|401|toegang/i.test(e.message)?'Deze pagina is enkel voor de managers van Energie-Compas. Meld je aan via MijnEC en open ze opnieuw.':'Fout bij ophalen: '+esc(e.message))+'</div>'; }
  }
  (async function(){
    try{
      var rc=await fetch('/api/config'); var CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld je aan via MijnEC en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      await laad();
      setInterval(function(){ if(document.visibilityState==='visible'&&TAB!=='instellingen'&&TAB!=='aspiranten') laad(); },60000);
    }catch(e){ $('root').innerHTML='<div class="fout">Init-fout: '+esc(e.message)+'</div>'; }
  })();
})();
</script>
</body>
</html>
