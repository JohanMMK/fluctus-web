<title>EnergieKompas — Onderhandelingsnota</title>
<!-- energiekompas-nota.html v0.7.6 (2026-09-01, Fase 5c — copy-fix): winst-noemer-zin las "van uw brutomarge van
     uw resultaat" (dubbel); nu "± X% van uw nettowinst — en ± Y% van uw brutomarge (boekjaar YYYY)."
     ── v0.7.5 (2026-09-01, Fase 5c — RESULTAAT-IMPACT): pSlot valt zonder NBB-cijfers terug
     op een KWALITATIEVE boodschap (geen getallen) — meerkosten/besparingen kunnen het verschil maken tussen
     overschot en tekort op het operationeel resultaat. EKI blijft enkel numeriek bij NBB-winst; géén budget-
     noemer voor besturen (zou de impact vertekenen: heel gemeentebudget vs één gemeenteschool). EKI2 geschrapt.
     ── v0.7.4 (2026-08-31, Fase 5c — WINST-NOEMER): pSlot drukt de "winst zonder investering"
     ook uit als % van de nettowinst/brutomarge uit D.financieel (NBB-jaarrekening). Enkel wanneer die data er is
     (NBB-koppeling actief) en er een besparing getoond wordt; verlies-boekjaar → geen deling. Besparing uit de sim,
     winst uit de jaarrekening — nooit een forfait. Geen data → regel valt weg (geen regressie).
     ── v0.7.3 (2026-08-31, Fase 5 — GROEIPAD): pGroeistap (§14.4) in de volledige studie —
     twee blokken "Wat u nu kan doen" (eerste groeistap, doorgerekend) + "Wat later kan" (benoemd, niet becijferd),
     gevoed door PV-dekking, wagens en de spreiden-vraag. Vrije onderhandelingsnota ongewijzigd (4/4 pagina's).
     ── v0.7.2 (2026-08-31, Fase 4 — RAMING-LABEL): D.raming → banner "RAMING — GEEN
     FACTUURDATA" + marge als bandbreedte (nooit hard bedrag) in het afname-luik (voorschotfactuur-pad).
     ── v0.7.1 (2026-08-31, Fase 4 — DOWNLOAD-GATING): rapport-tier 'view' (nooit betalen) →
     PDF-knop verborgen + upsell-strook (server: /api/lead/:token geeft mag_download). later/direct = downloadbaar.
     ── v0.7.0 (2026-08-31, Fase 4 — INHOUD, Johan): meer uitleg zoals Kamino tegel 1, minder push
     naar de betaalde studie. Afname-luik: "wat betekent dit?" + onderhandelingschecklist (spot-tarief, transparante
     opslag, toegangsvermogen) — 2 heatmaps i.p.v. 3. Injectie-luik (tegel 2, bij PV): uitgebreide tips over injectie op
     de spot- én onbalansmarkt (afregelen bij negatieve prijzen, imbalance settlement, flex vastleggen). Slot: geen
     paid-study-CTA/rendementsgarantie meer, maar een concrete ACTIELIJST + een zachte doorverwijzing naar de adviseur.
     ── v0.6.2 (2026-08-30, Fase 4) — LEAD-LINK. Nieuw: ?lead=<token> → de nota haalt de
     bewaarde data op bij /api/lead/:token (klant opent z'n nota via de mail-link). Val terug op sessionStorage/
     opener/demo zoals voorheen. ── v0.6.1 (2026-08-30, Fase 4) — PRINT-PAGINERING DEFINITIEF + THEMA-FIX.
     (1) .a4 hoogte 285mm (i.p.v. 293/296) + cover-in 275mm: Chromium's printbare A4-hoogte bij @page margin:0 is
     ~286mm, waardoor de cover z'n voetlijn/achtergrond naar een blanco pagina 2 duwde. Nu past ELKE sectie exact op
     één A4 → bedrijf-onderhandelingsnota = 4 pagina's, particulier = 4, volledig = 6 (geen blanco tussenpagina's).
     (2) E+Drive-thema toonde per abuis de rode "JACOPS."-badge in de voettekst (copy-paste uit jacops-thema) → leeg.
     ── v0.6.0 (2026-08-28, Fase 4) — PRINT-FIX + BRON-EERLIJKHEID.
     (1) Print: @page margin:0 + print-color-adjust:exact (heatmaps/achtergronden printen mee, geen wit) + compactere
     heatmaps (23mm) → elke sectie past op één A4 (geen blanco tussenpagina's). (2) Zonder factuur tonen we de
     onbetrouwbare all-in "energiekost nu"/onderhandelingsmarge NIET meer (die overschatte, bv. €17.032 i.p.v. €6.361);
     we vragen de factuur op te laden. Met factuur = exacte marge. Idem in de slot-samenvatting.
     ── v0.5.1 (2026-08-28, Fase 4) — onderhandel-luik toont de BRON: bij een ingelezen factuur
     "identiek aan tegel 1" (energiepost + factuurperiode), anders "indicatief op handmatige invoer".
     ── v0.5.0 (2026-08-27, Fase 4 — CONCEPT-CORRECTIE onderhandelingsnota, Johan): de gratis
     onderhandelingsnota gaat over een BETERE DEAL voor afname (tegel 1) + injectie (tegel 2: afregelen + onbalans)
     ZONDER extra investering. De PV+batterij-combinatie én het generator-hoofdstuk zijn INVESTERINGEN → verhuisd naar
     de volledige studie (enkel getoond bij D.volledig). Slot toont "winst zonder investering" = afname-marge +
     injectie-meerwaarde. Preview volledige studie: ?volledig=1.
     ── v0.4.1 (2026-08-27, Fase 4) — "Bewaar als PDF"-knop (window.print(); print-CSS met
     A4-paginabreaks was er al; knop verborgen in print). Thema-gekleurd.
     ── v0.4.0 (2026-08-27, Fase 4) — MODE-AWARE (particulier | bedrijf). Bedrijf toont het
     onbalans-luik in de injectie (3e heatmap) en het generator-hoofdstuk; particulier enkel curtail_neg. Preview:
     ?mode=bedrijf. Datacontract-veld D.mode stuurt de labels/inhoud.
     ── v0.3.0 (2026-08-27, Fase 4) — GENERATOR-hoofdstuk: rendert wanneer D.generator aanwezig is
     (bedrijf) — diesel-economics (liter, vermeden diesel, egen, vervang-batterij P_gen) + de 24×365 generator-heatmap
     (wanneer de shots vallen) via dezelfde render-component + thema-laag.
     ── v0.2.1 (2026-08-27, Fase 4 slice D) — WHITE-LABEL: geen "Fluctus" zichtbaar, enkel
     "EnergieKompas" + het installateur-merk. Default-thema = 'energiekompas' (neutraal, geen merk).
     ── v0.2.0 (2026-08-27, Fase 4 slice D) — GRATIS particulier-onderhandelingsnota + THEMA-LAAG.
     NIEUW v0.2.0: white-label thema-laag (§7). Eén rapport, merk = een style. Thema via ?thema= / ?partner= of
     D.thema (edrive · jacops · wattkraft · energypro · fluctus). Merk-tokens: accent, ink, cover-bg/-foto, merklabel,
     footer, badge. De heat-ramp wordt AFGELEID uit de accent → de heatmaps kleuren automatisch mee per installateur.
     ── v0.1.0 (2026-08-27, Fase 4 slice D) — GRATIS particulier-onderhandelingsnota.
     Model = onderhandelingsnota uit laadplein (§17): onderhandeling (Kamino-vraag 1) + injectie/SolarActive
     (Kamino-vraag 2), gevoed vanuit de EnergieKompas-schil (particulier). Rekent NIETS opnieuw — spiegelt de data.
     Data via sessionStorage['FLUCTUS_EK_NOTA'] (window-global of demo-fallback voor standalone preview).
     Heatmap-component 1-op-1 uit laadplein-rapport.html (heatmapSvg + heatKleur, 24×365-kalender, groene ladder).
     Particulier: injectie enkel curtail_neg (netto_injectie + bespaard_curtail), GEEN onbalans (anti-regressie). -->
<style>
  :root{ --navy:#1F3864; --groen:#05B050; --edg:#80C539; --charcoal:#3B4049; --panel:#3f444d;
    --lijn:#DCE3EC; --grijs:#5A6577; --zwart:#1A1F2B; --zacht:#F5F8FD; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#e9edf2; color:var(--zwart);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.45;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  /* A4 print zonder paginamarge → elke .a4 = exact één pagina (geen blanco tussenpagina's) */
  @page{ size:A4; margin:0; }
  .demo{ background:#FFF7EC; border-bottom:1px solid #E8A33D; color:#9E480E; font-size:12px;
    padding:7px 14px; text-align:center; }
  .a4{ width:210mm; height:285mm; background:#fff; margin:14px auto; padding:16mm 15mm;
    box-shadow:0 2px 14px rgba(20,40,80,.12); position:relative; overflow:hidden; }
  h1,h2,h3{ margin:0; }
  .eyebrow{ color:var(--edg); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:11px; }
  .h-sec{ color:var(--navy); font-weight:800; font-size:17px; margin:2px 0 10px; }
  .lead{ color:var(--grijs); font-size:12.5px; margin:0 0 12px; }
  .note{ color:var(--grijs); font-size:11px; font-style:italic; }
  /* KPI-tegels */
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 10px; }
  .kpi{ border:1px solid var(--lijn); border-radius:10px; padding:9px 12px; background:var(--zacht); }
  .kpi.g{ background:#F3FBF5; border-color:#05B05033; }
  .kpi .l{ font-size:11px; color:var(--grijs); font-weight:700; }
  .kpi .v{ font-size:24px; font-weight:800; color:var(--navy); margin:3px 0; }
  .kpi.g .v{ color:#048443; }
  .kpi .s{ font-size:10.5px; color:var(--grijs); }
  /* tabel */
  table.spec{ width:100%; border-collapse:collapse; font-size:11.5px; margin:6px 0 10px; }
  table.spec td{ padding:4px 6px; border-bottom:1px solid #EEF2F7; }
  table.spec td.k{ color:var(--grijs); width:46%; }
  table.spec td.v{ font-weight:700; color:var(--zwart); }
  /* heatmap (uit laadplein-rapport.html) */
  .hm-titel{ font-size:12px; font-weight:800; color:var(--navy); margin:8px 0 2px; }
  .hm-titel .hm-sub{ font-weight:500; color:var(--grijs); font-size:10.5px; }
  .heat-wrap{ margin:4px 0 2px; }
  .heat-svg{ display:block; width:100%; height:20mm; border:1px solid var(--lijn); border-radius:4px; }
  .heat-leg{ display:flex; align-items:center; gap:6px; font-size:9.5px; color:var(--grijs); margin-top:3px; flex-wrap:wrap; }
  .heat-leg .bar{ height:9px; width:120px; border-radius:2px;
    background:var(--rampgrad, linear-gradient(90deg,#EAF7EE,#9AD4A6,#05B050,#048443,#0B3D24)); }
  /* cover */
  .a4.cover{ padding:0; background:var(--charcoal); color:#fff; }
  .cover-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cover-in{ position:relative; padding:22mm 18mm; display:flex; flex-direction:column; height:275mm; }
  .cover-in .brand{ color:var(--edg); font-weight:800; letter-spacing:.04em; font-size:15px; }
  .cover-in .titel{ margin-top:auto; font-size:34px; font-weight:800; line-height:1.12; }
  .cover-in .titel span{ color:var(--edg); }
  .cover-in .subtitel{ color:#C7CCD1; font-size:14px; margin-top:8px; }
  .cover-grid{ margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; max-width:120mm; }
  .cover-grid .cf{ background:rgba(255,255,255,.06); border-left:3px solid var(--edg); border-radius:4px; padding:9px 12px; }
  .cover-grid .cf .cl{ color:#9aa3ad; text-transform:uppercase; font-size:9px; letter-spacing:.05em; }
  .cover-grid .cf .cv{ color:#fff; font-weight:800; font-size:19px; }
  .cover-in .foot{ margin-top:22px; color:#9aa3ad; font-size:11px; }
  /* slot */
  .a4.slot{ background:var(--charcoal); color:#fff; }
  .slot .eyebrow{ color:var(--edg); }
  .slot h2{ font-size:26px; font-weight:800; line-height:1.18; margin:4px 0 10px; }
  .slot h2 .g{ color:var(--edg); }
  .slot .sub{ color:#C7CCD1; font-size:13px; }
  .promise{ background:#fff; color:var(--zwart); border-radius:12px; padding:16px 18px; margin:16px 0; }
  .promise .t{ color:#048443; font-weight:800; font-size:13px; margin-bottom:8px; }
  .promise ul{ margin:0; padding:0; list-style:none; }
  .promise li{ position:relative; padding:5px 0 5px 22px; font-size:12px; color:#33404f; border-top:1px solid #EAF3EC; }
  .promise li:first-child{ border-top:none; }
  .promise li:before{ content:'✓'; position:absolute; left:0; top:5px; color:#048443; font-weight:800; }
  .cta{ background:var(--edg); color:#12240a; border-radius:10px; padding:14px 18px; font-weight:800; font-size:14px; }
  .cta .s{ font-weight:500; color:#22350f; font-size:12px; margin-top:4px; }
  .slot .footer{ margin-top:auto; display:flex; justify-content:space-between; align-items:center;
    color:#9aa3ad; font-size:11px; padding-top:16px; }
  .slot-jc{ background:#E8352A; color:#fff; font-weight:800; font-size:11px; letter-spacing:-.3px; padding:3px 7px; border-radius:3px; }
  .disc{ color:var(--grijs); font-size:10.5px; margin-top:10px; }
  .pdfbtn{ position:fixed; right:18px; bottom:18px; z-index:50; background:var(--edg); color:#0d1b06; border:none;
    border-radius:10px; padding:11px 16px; font-weight:800; font-size:13px; cursor:pointer; box-shadow:0 3px 12px rgba(20,40,80,.22); }
  @media print{
    html,body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }   /* forceer achtergronden/kleuren (heatmaps!) */
    .a4{ margin:0; box-shadow:none; }
    .a4:not(:last-child){ page-break-after:always; break-after:page; }   /* break NA elke sectie behalve de laatste → exact N pagina's */
    .demo, .pdfbtn{ display:none; }
  }
</style>
</head>
<body>
<div id="demo-banner" class="demo" style="display:none">Voorbeeldweergave — deze nota toont demodata (geen sessie doorgegeven vanuit de EnergieKompas-schil).</div>
<div id="root"></div>
<button id="__pdfbtn" class="pdfbtn" type="button" onclick="window.print()">⤓ Bewaar als PDF</button>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function eur(v){ if(v==null||isNaN(v)) return '—'; return '€ '+Math.round(v).toLocaleString('nl-BE'); }
  function num(v,d){ if(v==null||isNaN(v)) return '—'; var f=Math.pow(10,d||0); return (Math.round(v*f)/f).toLocaleString('nl-BE'); }

  // ── Thema-laag (§7): merk = een style. Zelfde rapport, andere merk-tokens per gekozen installateur. ──
  // Tokens: accent (kleur + heat-ramp), ink (titels), cover-achtergrond/-foto, merklabel, footer, badge.
  // De heat-ramp wordt AFGELEID uit de accent → de heatmaps kleuren automatisch mee per merk.
  // White-label: NERGENS "Fluctus" op de nota — enkel "EnergieKompas" + het merk van de gekozen installateur.
  var THEMES = {
    energiekompas:{ merk:'ENERGIEKOMPAS',          accent:'#05B050', ink:'#1F3864', coverBg:'#12263f', coverImg:'',                            footer:'EnergieKompas',              badge:'' },
    edrive:    { merk:'E+DRIVE · ENERGIEKOMPAS',   accent:'#80C539', ink:'#3B4049', coverBg:'#3B4049', coverImg:'/apps/voorblad-simuleer.jpg', footer:'E+Drive · EnergieKompas',     badge:'' },
    jacops:    { merk:'JACOPS · ENERGIEKOMPAS',    accent:'#E8352A', ink:'#1A1F2B', coverBg:'#1A1F2B', coverImg:'/apps/voorblad-simuleer.jpg', footer:'Jacops · EnergieKompas',      badge:'JACOPS.' },
    wattkraft: { merk:'WATTKRAFT · ENERGIEKOMPAS', accent:'#0E7DB5', ink:'#12303f', coverBg:'#12303f', coverImg:'/apps/voorblad-wattkraft.jpg', footer:'Wattkraft · EnergieKompas',   badge:'' },
    energypro: { merk:'ENERGYPRO · ENERGIEKOMPAS', accent:'#EF7D00', ink:'#2b2016', coverBg:'#2b2016', coverImg:'/apps/voorblad-energypro.jpg', footer:'EnergyPro · EnergieKompas',   badge:'' }
  };
  THEMES.fluctus = THEMES.energiekompas;   // alias: default toont enkel "EnergieKompas"
  function hex2rgb(h){ h=String(h).replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function mix(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]; }
  function rampFromAccent(hex){ var a=hex2rgb(hex),W=[255,255,255],B=[16,32,20];
    return [mix(a,W,0.90),mix(a,W,0.52),a,mix(a,B,0.40),mix(a,B,0.75)]; }
  var RAMP = rampFromAccent('#05B050'), T = THEMES.fluctus;   // defaults; overschreven door applyTheme
  function applyTheme(theme){
    T = theme || THEMES.fluctus; RAMP = rampFromAccent(T.accent);
    var st=document.documentElement.style;
    st.setProperty('--edg',   T.accent);
    st.setProperty('--navy',  T.ink);
    st.setProperty('--groen', T.accent);
    st.setProperty('--charcoal', T.coverBg);
    var g=RAMP.map(function(s){ return 'rgb('+s[0]+','+s[1]+','+s[2]+')'; });
    st.setProperty('--rampgrad','linear-gradient(90deg,'+g[0]+','+g[1]+','+g[2]+','+g[3]+','+g[4]+')');
  }
  function qp(n){ try{ return new URLSearchParams(location.search).get(n); }catch(e){ return null; } }
  function kiesThema(D){
    var k=(D&&(D.thema||D.partner)) || qp('thema') || qp('partner') || 'energiekompas';
    return THEMES[String(k).toLowerCase()] || THEMES.energiekompas;
  }

  // ── Heatmap-component (1-op-1 uit laadplein-rapport.html) — ramp uit het actieve thema ──
  function heatKleur(t){
    if(t<=0) return '#F2F5F8';
    var stops=RAMP;
    var x=Math.min(1,t)*(stops.length-1), i=Math.floor(x), f=x-i,
        a=stops[i], b=stops[Math.min(stops.length-1,i+1)];
    var r=Math.round(a[0]+(b[0]-a[0])*f), g=Math.round(a[1]+(b[1]-a[1])*f), bl=Math.round(a[2]+(b[2]-a[2])*f);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function heatmapSvg(mat, piek){
    if(!mat||!mat.length) return '<div class="note">Geen sessie-profiel beschikbaar.</div>';
    var DAYS=mat[0].length, HRS=mat.length, W=728, H=200, padL=26, padB=16;
    var cw=(W-padL)/DAYS, ch=(H-padB)/HRS, mx=piek||1;
    mat.forEach(function(row){ row.forEach(function(v){ if(v>mx) mx=v; }); });
    var s='<svg class="heat-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
    for(var h=0;h<HRS;h++){ for(var d=0;d<DAYS;d++){ var v=mat[h][d]||0; if(v<=0) continue;
      s+='<rect x="'+(padL+d*cw).toFixed(1)+'" y="'+((HRS-1-h)*ch).toFixed(1)+'" width="'+(cw+0.6).toFixed(1)+'" height="'+(ch+0.4).toFixed(1)+'" fill="'+heatKleur(v/mx)+'"/>'; } }
    [0,6,12,18].forEach(function(h){ s+='<text x="2" y="'+((HRS-1-h)*ch+ch*0.5+3).toFixed(1)+'" font-size="8" fill="#5A6577">'+h+'u</text>'; });
    var mnd=['J','F','M','A','M','J','J','A','S','O','N','D'], cum=[0,31,59,90,120,151,181,212,243,273,304,334];
    cum.forEach(function(c,i){ var x=padL+c*cw;
      s+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>';
      s+='<text x="'+(x+2).toFixed(1)+'" y="'+(H-4)+'" font-size="8" fill="#5A6577">'+mnd[i]+'</text>'; });
    s+='</svg>'; return s;
  }
  // platte 24×365-array (cel = uur*365 + dag) → mat[uur][dag]
  function mat24(flat, uren, dagen){ uren=uren||24; dagen=dagen||365;
    if(!flat||!flat.length) return null; var m=[];
    for(var u=0;u<uren;u++){ var row=[]; for(var d=0;d<dagen;d++){ row.push(+flat[u*dagen+d]||0); } m.push(row); }
    return m; }
  function heatBlok(titel, sub, flat, uren, dagen, legL, legR){
    if(!flat||!flat.length) return '';
    var m=mat24(flat, uren, dagen); if(!m) return '';
    return '<div class="hm-titel">'+titel+(sub?(' <span class="hm-sub">— '+sub+'</span>'):'')+'</div>'+
      '<div class="heat-wrap">'+heatmapSvg(m,0)+
      '<div class="heat-leg"><span>'+legL+'</span><span class="bar"></span><span>'+legR+'</span>'+
      '<span style="margin-left:auto">verticaal = uur (0u onder → 23u boven) · horizontaal = jan → dec</span></div></div>';
  }

  // ── Pagina's ──
  function pCover(D){
    var i=D.input||{}, c=D.combo||{};
    return '<section class="a4 cover">'+
      (T.coverImg?('<img class="cover-bg" src="'+T.coverImg+'" onerror="this.style.display=\'none\'">'):'')+
      '<div class="cover-in">'+
        '<div class="brand">'+T.merk+'</div>'+
        '<div class="titel">Onderhandelings<span>nota</span></div>'+
        '<div class="subtitel">Uw eerste, gratis indicatie — een betere deal voor uw <b>afname</b> én uw <b>injectie</b> (afregelen + onbalans), <b>zonder extra investeringen</b>.</div>'+
        '<div class="cover-grid">'+
          '<div class="cf"><div class="cl">Klant</div><div class="cv">'+(D.klant||'—')+'</div></div>'+
          '<div class="cf"><div class="cl">Regio · profiel</div><div class="cv">'+(D.regio||'—')+' · '+(D.profiel||'standaard')+'</div></div>'+
          '<div class="cf"><div class="cl">Jaarverbruik</div><div class="cv">'+num(i.afname_mwh,1)+' <span style="font-size:12px;color:#9aa3ad">MWh</span></div></div>'+
          '<div class="cf"><div class="cl">Datum</div><div class="cv">'+(D.datum||'')+'</div></div>'+
        '</div>'+
        '<div class="foot">Indicatief, op '+(D.specifiek_profiel?'uw specifiek meetprofiel':'een standaard verbruiksprofiel')+'. De volledige studie draait op uw echte kwartierdata (na Fluvius-mandaat).</div>'+
      '</div></section>';
  }

  function pOnderhandel(D){
    var o=D.onderhandel||{}, hm=o.heatmaps||{};
    var factuur=(o.bron==='factuur');
    var raming=!!D.raming;
    // RAMING (voorschotfactuur, geen factuurdata): marge als bandbreedte, nooit als hard bedrag.
    var ramingBadge = raming ? '<div style="background:#FFF4E5;border:1px solid #F0C070;color:#7A4A00;border-radius:8px;padding:9px 12px;font-size:12px;margin:0 0 10px"><b>RAMING — GEEN FACTUURDATA.</b> Deze cijfers staan op een <b>geschat</b> jaarverbruik en markt-referentieprijzen, niet op uw factuur. Ze tonen een orde van grootte (bandbreedte), geen exact bedrag. Voor exacte cijfers: laad uw jaarafrekening op of zet een mandaat op uw meetgegevens.</div>' : '';
    // Zonder factuur is de "energiekost nu" (en dus de marge) all-in en overschat ze de marge sterk.
    // We tonen dan enkel de dynamische prijs + het verbruik, en vragen om de factuur op te laden.
    var kpis='<div class="kpis">'+
      (factuur
        ? '<div class="kpi"><div class="l">Uw energiekost vandaag</div><div class="v">'+(o.energiekost_nu_mwh!=null?('± '+eur(o.energiekost_nu_mwh)+'/MWh'):'—')+'</div><div class="s">energiepost van uw factuur</div></div>'
        : '<div class="kpi"><div class="l">Uw energiekost vandaag</div><div class="v" style="font-size:15px;color:#5A6577">laad uw factuur op</div><div class="s">de energiepost staat op uw factuur</div></div>')+
      '<div class="kpi g"><div class="l">Met een dynamisch contract</div><div class="v">'+(o.energiekost_dyn_mwh!=null?('± '+eur(o.energiekost_dyn_mwh)+'/MWh'):'—')+'</div><div class="s">zelfde verbruik, spot-gebaseerd</div></div>'+
      (raming
        ? '<div class="kpi g"><div class="l">Geschatte marge</div><div class="v" style="font-size:16px">'+eur(Math.round((+o.marge_jaar||0)*0.7))+' – '+eur(Math.round((+o.marge_jaar||0)*1.3))+'<span style="font-size:12px;color:#5A6577"> /jaar</span></div><div class="s">raming — geen factuurdata, geen hard bedrag</div></div>'
        : factuur
        ? '<div class="kpi g"><div class="l">Onderhandelingsmarge</div><div class="v">'+eur(o.marge_jaar)+'<span style="font-size:13px;color:#5A6577"> /jaar</span></div><div class="s">'+(o.besparing_pct!=null?(num(o.besparing_pct,1)+' % van uw energiefactuur'):'')+'</div></div>'
        : '<div class="kpi"><div class="l">Onderhandelingsmarge</div><div class="v" style="font-size:15px;color:#5A6577">na factuurscan</div><div class="s">exact zodra we uw energiepost kennen</div></div>')+
      '<div class="kpi"><div class="l">Verbruik</div><div class="v">'+num(o.volume_mwh,1)+' <span style="font-size:13px;color:#5A6577">MWh/j</span></div><div class="s">'+(D.specifiek_profiel?'uit uw meetprofiel':'standaardprofiel')+'</div></div>'+
      '</div>';
    var ta=o.toegangsvermogen_advies;
    var heats='';
    heats+=heatBlok('Uw afname-profiel','wanneer u stroom trekt (kW gemiddeld)', hm.afname_kw, hm.uren, hm.dagen, 'weinig', 'veel afname');
    heats+=heatBlok('De dynamische prijs','spot day-ahead (€/MWh) — donker = duur', hm.spot_eur_mwh, hm.uren, hm.dagen, 'goedkoop', 'duur');
    // Uitleg + onderhandelingschecklist (meer duiding, geen push naar een betaalde studie).
    var uitleg='<div class="hm-titel" style="margin-top:12px">Wat betekent dit?</div>'+
      '<div class="note" style="margin-top:2px">Een <b>dynamisch contract</b> geeft u kwartier per kwartier rechtstreeks de groothandelsprijs (day-ahead spot) door. Uw huidige vaste of variabele contract rekent daar een <b>opslag en risicomarge</b> bovenop. Het verschil op net hetzelfde verbruik is precies wat u kan onderhandelen — <b>zonder iets te veranderen aan uw installatie</b>. De heatmaps tonen wanneer u stroom trekt (24 u verticaal × 365 dagen horizontaal) en wanneer de markt duur is: zo weet u waar uw factuur zwaar weegt.</div>';
    var tips='<div class="hm-titel" style="margin-top:10px">Wat vraagt u aan uw leverancier?</div>'+
      '<table class="spec">'+
        '<tr><td class="k">Spot-gekoppeld tarief</td><td class="v">een prijs die de day-ahead-spot volgt, i.p.v. een vaste opslag die uw marge opeet.</td></tr>'+
        '<tr><td class="k">Transparante opslag</td><td class="v">vraag de opslag (€/MWh) apart — zo ziet u exact wat u bovenop de markt betaalt.</td></tr>'+
        '<tr><td class="k">Toegangsvermogen</td><td class="v">'+((ta&&ta.verlaagbaar)?('verlaagbaar van <b>'+ta.huidig_kw+' → '+ta.verlaagbaar_naar_kw+' kW</b> — uw maandpiek over 12 maanden is '+ta.maandpiek_12m_kw+' kW'+(ta.besparing_indicatie_eur_jaar!=null?(', ± '+eur(ta.besparing_indicatie_eur_jaar)+'/j extra'):'')+'.'):'laat uw piekvermogen nakijken — u betaalt vaak capaciteit voor méér dan u gebruikt.')+'</td></tr>'+
      '</table>';
    return '<section class="a4">'+
      '<div class="eyebrow">1 · Uw huidige situatie</div>'+
      '<div class="h-sec">Kunt u beter onderhandelen?</div>'+
      ramingBadge+
      '<div class="lead">We spiegelen uw '+(raming?'<b>geraamde</b> verbruik':((o.bron==='factuur')?'<b>ingelezen factuur</b> (energiepost + factuurperiode)':'invoer'))+' aan een dynamisch (spot-gebaseerd) contract op hetzelfde verbruik.'+(raming?' Raming op een geschat jaarverbruik — laad uw jaarafrekening op of zet een mandaat op voor exacte cijfers.':((o.bron==='factuur')?'':' Indicatief op uw handmatige invoer — laad uw factuur op voor een exacte analyse.'))+' Geen offerte.</div>'+
      kpis+heats+uitleg+tips+
      '</section>';
  }

  // PV+batterij-combinatie = een INVESTERING → hoort in de volledige studie, NIET in de gratis onderhandelingsnota.
  function pCombo(D){
    if(!D.volledig) return '';
    var c=D.combo||{}, i=D.input||{};
    var tvt=(c.terugverdientijd!=null)?c.terugverdientijd:((c.besparing>0&&c.capex>0)?(Math.round(c.capex/c.besparing*10)/10):null);
    var kpis='<div class="kpis">'+
      '<div class="kpi g"><div class="l">Besparing per jaar</div><div class="v">'+eur(c.besparing)+'</div><div class="s">t.o.v. uw huidige jaarkost</div></div>'+
      '<div class="kpi g"><div class="l">Rendement</div><div class="v">'+(c.rendement!=null?(num(c.rendement,1)+' %'):'—')+'</div><div class="s">'+(tvt!=null?('terugverdiend in ± '+String(tvt).replace('.',',')+' j'):'op uw investering')+'</div></div>'+
      '<div class="kpi"><div class="l">Jaarkost met deze combinatie</div><div class="v">'+eur(c.kost)+'</div><div class="s">'+(c.ref_kost!=null?('nu ± '+eur(c.ref_kost)+'/j'):'')+'</div></div>'+
      '<div class="kpi"><div class="l">Investering</div><div class="v">'+eur(c.capex)+'</div><div class="s">PV + batterij incl. plaatsing (indicatief)</div></div>'+
      '</div>';
    var combo=((c.pv_kwp>0)?(num(c.pv_kwp,1)+' kWp PV'):'geen PV')+
      ((c.batt_kwh>0)?(' + '+num(c.batt_kwh,0)+' kWh'+(c.batt_kw?(' / '+num(c.batt_kw,0)+' kW'):'')+' batterij'):' · geen batterij');
    return '<section class="a4">'+
      '<div class="eyebrow">2 · PV + batterij op uw aansluiting</div>'+
      '<div class="h-sec">Wat levert de combinatie op die u koos?</div>'+
      '<div class="lead">U koos op de interactieve heatmaps de combinatie <b>'+combo+'</b>. Deze cijfers draaien op dezelfde motor als de '+((D.mode==='bedrijf')?'laadplein-studie':'thuisladen-studie')+' (indicatief op '+(D.specifiek_profiel?'uw meetprofiel':'het standaardprofiel')+').</div>'+
      kpis+
      '<table class="spec">'+
        '<tr><td class="k">Aansluiting</td><td class="v">'+num(i.aansluiting_kva,0)+' kVA'+(i.fasen?(' · '+i.fasen+'-fasig'):'')+'</td></tr>'+
        '<tr><td class="k">Jaarverbruik (afname)</td><td class="v">'+num(i.afname_mwh,1)+' MWh</td></tr>'+
        (i.bestaand_pv_kwp>0?'<tr><td class="k">Bestaande PV</td><td class="v">'+num(i.bestaand_pv_kwp,1)+' kWp</td></tr>':'')+
        (i.injectie_mwh>0?'<tr><td class="k">Injectie vandaag</td><td class="v">'+num(i.injectie_mwh,1)+' MWh/j</td></tr>':'')+
        '<tr><td class="k">Voorgestelde PV</td><td class="v">'+((c.pv_kwp>0)?num(c.pv_kwp,1)+' kWp':'—')+'</td></tr>'+
        '<tr><td class="k">Voorgestelde batterij</td><td class="v">'+((c.batt_kwh>0)?(num(c.batt_kwh,0)+' kWh / '+num(c.batt_kw,0)+' kW'):'geen')+'</td></tr>'+
      '</table>'+
      '<div class="note">De exacte combinatie kiest u zelf op de heatmaps in de EnergieKompas-schil; deze nota bevestigt de gekozen cel.</div>'+
      '</section>';
  }

  function pInjectie(D){
    var inj=D.injectie; if(!inj) return '';
    var bedrijf=(D.mode==='bedrijf');
    var op=inj.opbrengst_jaar||{}, hm=inj.heatmaps||{};
    var kpis='<div class="kpis">'+
      '<div class="kpi"><div class="l">Injectie vandaag (spot)</div><div class="v">'+eur(op.vandaag_spot_eur)+'<span style="font-size:13px;color:#5A6577"> /j</span></div><div class="s">alles injecteren aan day-ahead</div></div>'+
      '<div class="kpi g"><div class="l">Met slim afregelen</div><div class="v">'+eur(op.met_curtail_eur)+'<span style="font-size:13px;color:#5A6577"> /j</span></div><div class="s">niet injecteren bij negatieve prijs</div></div>'+
      '<div class="kpi g"><div class="l">Meerwaarde curtailment</div><div class="v">'+eur(op.meerwaarde_curtail_eur)+'<span style="font-size:13px;color:#5A6577"> /j</span></div><div class="s">zuivere winst, zonder extra investering</div></div>'+
      (bedrijf
        ? '<div class="kpi g"><div class="l">+ Meerwaarde onbalans</div><div class="v">'+eur(op.meerwaarde_onbalans_eur)+'<span style="font-size:13px;color:#5A6577"> /j</span></div><div class="s">passieve respons op de onbalansmarkt</div></div>'
        : '<div class="kpi"><div class="l">Productie</div><div class="v">'+num((inj.energie_jaar||{}).productie_mwh,1)+' <span style="font-size:13px;color:#5A6577">MWh/j</span></div><div class="s">op uw PV-vermogen</div></div>')+
      '</div>';
    var heats='';
    heats+=heatBlok('Injectie-opbrengst vandaag','netto €/kwartier, zonder sturing', hm.netto_injectie_eur, hm.uren, hm.dagen, 'weinig', 'veel');
    heats+=bedrijf
      ? heatBlok('Winst op de onbalansmarkt','passieve respons (imbalance settlement)', hm.verdiend_onbalans_eur, hm.uren, hm.dagen, 'weinig', 'veel winst')
      : heatBlok('Winst door af te regelen','meerwaarde curtailment bij negatieve prijzen', hm.bespaard_curtail_eur, hm.uren, hm.dagen, 'weinig', 'veel winst');
    return '<section class="a4">'+
      '<div class="eyebrow">'+(D.volledig?'3':'2')+' · Meer uit uw injectie</div>'+
      '<div class="h-sec">Meer verdienen aan uw injectie</div>'+
      '<div class="lead">U hebt PV en injecteert. Vandaag krijgt u daar vaak een <b>vast, laag forfait</b> voor. Door uw injectie te koppelen aan de spotmarkt'+(bedrijf?' én passief op onbalans te reageren':' en af te regelen bij negatieve prijzen')+' haalt u meer uit <b>net dezelfde installatie</b> — zonder extra investering.</div>'+
      kpis+heats+
      '<div class="hm-titel" style="margin-top:12px">Hoe laat u uw injectie renderen op de onbalansmarkt?</div>'+
      '<table class="spec">'+
        '<tr><td class="k">Spot-gekoppelde injectieprijs</td><td class="v">vraag een injectievergoeding die de day-ahead-spot volgt i.p.v. een vast forfait — zo wordt uw productie op dure momenten ook écht betaald.</td></tr>'+
        '<tr><td class="k">Afregelen bij negatieve prijzen</td><td class="v">niet injecteren als de spotprijs onder nul zakt — zo vermijdt u dat u moet <b>betalen</b> om te injecteren. Laat uw omvormer/EMS hierop sturen.</td></tr>'+
        (bedrijf?'<tr><td class="k">Onbalans laten meetellen</td><td class="v">vraag een leverancier/BRP die u laat delen in de <b>imbalance settlement</b>: passief bijsturen wanneer het net tekort of overschot heeft levert extra op — zonder batterij.</td></tr>':'')+
        '<tr><td class="k">Flex contractueel vastleggen</td><td class="v">leg vast dat uw stuurbare omvormer/flex mag meetellen — winst voor u én voor het net.</td></tr>'+
      '</table>'+
      '</section>';
  }

  // ── Generator-hoofdstuk (bedrijf): de dieselgenerator elektrisch vervangen (§3). ──
  // Ook dit is een INVESTERING (batterij) → enkel in de volledige studie, niet in de gratis onderhandelingsnota.
  function pGenerator(D){
    if(!D.volledig) return '';
    var g=D.generator; if(!g) return '';
    var hm=g.heatmap||{}, ven=g.venster||[7,18];
    var seed=num(g.batterij_seed_kw,0)+' kW / '+num(g.batterij_seed_kwh,0)+' kWh';
    var nr=D.injectie?'4':'3';
    var kpis='<div class="kpis">'+
      '<div class="kpi"><div class="l">Diesel die u nu verstookt</div><div class="v">'+num(g.liter_jaar,0)+' <span style="font-size:13px;color:#5A6577">L/j</span></div><div class="s">generator '+num(g.kva,0)+' kVA</div></div>'+
      '<div class="kpi g"><div class="l">Vermeden dieselkost</div><div class="v">'+eur(g.diesel_vermeden_eur_jaar)+'<span style="font-size:13px;color:#5A6577"> /j</span></div><div class="s">door elektrisch te vervangen (± '+num(g.diesel_eur_l,2)+' €/L)</div></div>'+
      '<div class="kpi"><div class="l">Generator-energie</div><div class="v">'+num((g.egen_kwh_jaar||0)/1000,1)+' <span style="font-size:13px;color:#5A6577">MWh/j</span></div><div class="s">'+num(g.momenten_jaar,0)+' shots × '+num(g.kwh_per_moment,1)+' kWh</div></div>'+
      '<div class="kpi g"><div class="l">Vervang-batterij (minimaal)</div><div class="v" style="font-size:18px">'+seed+'</div><div class="s">levert het generatorvermogen · 2 u autonomie</div></div>'+
      '</div>';
    var heat=heatBlok('Wanneer uw generator draait', 'elektrische last die de batterij overneemt (kWh/uur)', hm.last_kwh, hm.uren, hm.dagen, 'stil', 'vol vermogen');
    return '<section class="a4">'+
      '<div class="eyebrow">'+nr+' · Generator vervangen</div>'+
      '<div class="h-sec">Uw dieselgenerator elektrisch vervangen</div>'+
      '<div class="lead">Uw generator draait '+num(g.dagen_per_week,0)+' dagen/week binnen het venster '+ven[0]+'–'+ven[1]+'u. In plaats van diesel te verstoken, laat een batterij (minstens '+num(g.batterij_seed_kw,0)+' kW) die momenten elektrisch leveren — dat vermijdt <b>'+eur(g.diesel_vermeden_eur_jaar)+'/jaar</b> aan diesel. Dezelfde batterij verdient de rest van de tijd op zelfconsumptie en arbitrage.</div>'+
      kpis+heat+
      '<div class="note">De besparing in het combinatie-hoofdstuk nettot al beide bakjes: de vermeden diesel én de bijgekomen stroomkost om de shots elektrisch te dekken (twee-bakjes-model).</div>'+
      '</section>';
  }

  function pSlot(D){
    var ond=D.onderhandel||{}, injop=(D.injectie&&D.injectie.opbrengst_jaar)||{};
    var factuur=(ond.bron==='factuur'); var ta=ond.toegangsvermogen_advies;
    // Afname-marge telt enkel mee als ze op de factuur-energiepost berust (anders overschat all-in ze sterk).
    var winstAfname=factuur?(+ond.marge_jaar||0):0;
    var winstInjectie=(+injop.meerwaarde_curtail_eur||0)+((D.mode==='bedrijf')?(+injop.meerwaarde_onbalans_eur||0):0);
    var totaal=Math.round(winstAfname+winstInjectie);
    var toonSamenvatting=(!D.volledig && (winstAfname>0||winstInjectie>0));
    var samenvatting=toonSamenvatting
      ? '<div class="cta" style="margin-bottom:14px">Uw winst zonder één euro te investeren: ± '+eur(totaal)+' /jaar'+
        '<div class="s">'+(factuur?('beter onderhandelen op uw afname ('+eur(winstAfname)+') + '):'')+'slimmer injecteren — afregelen'+((D.mode==='bedrijf')?' en onbalans':'')+' ('+eur(winstInjectie)+')'+(factuur?'':' — <b>laad uw factuur op</b> voor uw contract-marge erbovenop')+' — op uw <b>huidige installatie</b>.</div></div>'
      : '';
    // v0.7.5 — resultaat-impact (EKI). MET NBB-cijfers: druk de besparing uit als % van netto/brutowinst.
    // ZÓNDER NBB-cijfers: geen getallen (nooit een forfait), maar wél de kwalitatieve boodschap dat
    // meerkosten/besparingen het verschil kunnen maken tussen overschot en tekort op het operationeel
    // resultaat. Bewust géén budget-noemer voor besturen: de hele-entiteit-noemer (bv. het volledige
    // gemeentebudget tegenover één gemeenteschool) zou de impact vertekenen. EKI = enkel NBB-winst.
    var fin=D.financieel||null, winstContext='';
    if(toonSamenvatting && totaal>0){
      var delen=[];
      if(fin){
        if(+fin.nettowinst>0) delen.push('± <b>'+Math.round(totaal/(+fin.nettowinst)*100)+'%</b> van uw nettowinst');
        if(+fin.brutomarge>0) delen.push('± <b>'+Math.round(totaal/(+fin.brutomarge)*100)+'%</b> van uw brutomarge');
      }
      if(delen.length){
        var bj=fin.boekjaar_einde?(' (boekjaar '+String(fin.boekjaar_einde).slice(0,4)+')'):'';
        winstContext='<div style="margin:-4px 0 14px;padding:10px 12px;background:#EAF3EC;border:1px solid #A9CDB4;border-radius:8px;font-size:13px;color:#1F3864">'+
          'Dat is '+delen.join(' — en ')+bj+'.'+
          '<div style="font-size:11.5px;color:#5A6577;margin-top:3px">Bron: uw neergelegde jaarrekening (NBB). Deze winst komt rechtstreeks bij uw resultaat, zonder investering.</div></div>';
      } else {
        winstContext='<div style="margin:-4px 0 14px;padding:10px 12px;background:#EAF3EC;border:1px solid #A9CDB4;border-radius:8px;font-size:13px;color:#1F3864">'+
          'Ook zonder uw exacte resultaatcijfers: deze meerkosten bij niets doen — en de besparingen hierboven — kunnen het verschil maken tussen een <b>overschot</b> en een <b>tekort</b> op uw operationeel resultaat.</div>';
      }
    }
    return '<section class="a4 slot"><div style="display:flex;flex-direction:column;height:100%">'+
      '<div class="eyebrow">Wat u nu kan doen</div>'+
      '<h2>Een <span class="g">betere deal</span> — zonder te investeren.</h2>'+
      '<div class="sub">Deze nota toont wat u wint door uw <b>afname en injectie</b> slimmer te regelen, op uw <b>huidige installatie</b>. U kan er meteen mee aan de slag bij uw energieleverancier.</div>'+
      samenvatting+
      winstContext+
      '<div class="promise"><div class="t">Uw actielijst</div><ul>'+
        '<li>Neem deze cijfers mee naar uw <b>energieleverancier</b> en vraag een <b>spot-gekoppeld tarief</b> met een transparante opslag.</li>'+
        (D.injectie?('<li>Vraag een <b>spot-gekoppelde injectieprijs</b> en laat uw omvormer <b>afregelen bij negatieve prijzen</b>'+((D.mode==='bedrijf')?' + meedelen in de onbalansmarkt':'')+'.</li>'):'')+
        ((ta&&ta.verlaagbaar)?('<li>Laat uw <b>toegangsvermogen</b> verlagen naar '+ta.verlaagbaar_naar_kw+' kW — u betaalt nu voor meer capaciteit dan u gebruikt.</li>'):'<li>Laat uw <b>piek-/toegangsvermogen</b> nakijken — vaak betaalt u voor meer capaciteit dan u nodig heeft.</li>')+
      '</ul></div>'+
      '<div class="cta" style="background:transparent;color:inherit;border:1px dashed rgba(255,255,255,.4)">Alles exact op uw eigen meetgegevens — of ook uw aansluiting (opslag, laden'+((D.mode==='bedrijf')?', generator':'')+') laten doorrekenen?'+
        '<div class="s">Uw adviseur kan een mandaat op uw meetgegevens organiseren en, als u dat wenst, de volledige studie maken.</div></div>'+
      '<div class="disc">Alle bedragen zijn indicatief en berekend op een '+(D.specifiek_profiel?'gemeten':'standaard')+' verbruiksprofiel met actuele marktdata. Geen offerte.</div>'+
      '<div class="footer"><span>'+T.footer+'</span>'+(T.badge?('<span class="slot-jc">'+T.badge+'</span>'):'')+'<span>'+(D.datum||'')+'</span></div>'+
    '</div></section>';
  }

  // §14.4 — het eerste-groeistap-principe: elke conclusie in twee blokken. Enkel in de volledige studie.
  // Blok 1 = wat u NU kan doen (de simpelste stap, op zichzelf verdedigbaar). Blok 2 = wat later kan (benoemd, niet becijferd).
  function pGroeistap(D){
    if(!D.volledig) return '';
    var bedrijf=(D.mode==='bedrijf'); var inp=D.input||{}; var ond=D.onderhandel||{};
    var afnMwh=+inp.afname_mwh||0, pvKwp=+inp.bestaand_pv_kwp||0;
    var dekking=(afnMwh>0&&pvKwp>0)?Math.round(pvKwp*0.95/afnMwh*100):null;
    var heeftWagens=bedrijf ? ((inp.pleinen&&inp.pleinen.length)|| (inp.wagens&&inp.wagens.length)) : (inp.wagens&&inp.wagens.length);
    // Blok 1 — de eerste groeistap
    var nu=[];
    nu.push('<li>Uw <b>afname en injectie</b> slimmer regelen op uw huidige installatie — dat werkt vandaag, zonder investering en zonder iemands akkoord.</li>');
    if(bedrijf && heeftWagens){
      if(D.spreiden==='bijladen') nu.push('<li><b>Laadpalen + een batterij</b> binnen uw bestaande aansluiting: omdat uw wagens overdag moeten bijladen, draagt de batterij de piek — meteen verdedigbaar, geen netverzwaring.</li>');
      else nu.push('<li><b>Laadpalen met slimme sturing</b> binnen uw bestaande aansluiting: die neemt uw piek weg voor een fractie van een batterij. Geen netverzwaring, niemands akkoord nodig.</li>');
    } else if(bedrijf){
      nu.push('<li><b>Slimme sturing</b> binnen uw bestaande aansluiting houdt uw piek laag — de goedkoopste eerste stap.</li>');
    }
    if(dekking!=null && dekking<40) nu.push('<li><b>Zonnepanelen bijleggen</b> — uw dak is nog grotendeels vrij en meer eigen productie verbruikt u overdag zelf.</li>');
    // Blok 2 — wat later kan (benoemd, niet becijferd)
    var later=[];
    if(!(D.spreiden==='bijladen')) later.push('<li><b>Een batterij</b> als tweede stap — arbitrage en passieve onbalans bovenop de sturing, zodra u wil.</li>');
    if(dekking!=null && dekking>=40 && dekking<=90) later.push('<li><b>Extra zonnepanelen</b> in combinatie met opslag — een batterij bepaalt of dat nog rendeert.</li>');
    if(dekking!=null && dekking>90) later.push('<li>Uw verbruik <b>verhogen waar het loont</b> (uw wagenpark elektrificeren) i.p.v. meer panelen die u toch injecteert.</li>');
    later.push('<li><b>Een betalend laadplein</b> voor bezoekers — enkel als u dat zelf wil; het is nooit nodig om de rest rond te krijgen.</li>');
    return '<section class="a4">'+
      '<div class="eyebrow">Uw groeipad</div>'+
      '<div class="h-sec">Eén stap tegelijk</div>'+
      '<div class="lead">U hoeft niet alles ineens te doen. Dit is de <b>eerste stap</b> die vandaag al rendeert — en wat er later bovenop kan, wanneer u eraan toe bent.</div>'+
      '<div class="hm-titel" style="margin-top:12px">Wat u nu kan doen</div>'+
      '<div class="promise" style="margin-top:2px"><ul>'+nu.join('')+'</ul></div>'+
      '<div class="hm-titel" style="margin-top:12px">Wat later kan</div>'+
      '<div class="note" style="margin-top:2px"><ul style="margin:0;padding-left:18px">'+later.join('')+'</ul></div>'+
    '</section>';
  }
  function render(D){
    var html = pCover(D) + pOnderhandel(D) + pCombo(D) + pInjectie(D) + pGenerator(D) + pGroeistap(D) + pSlot(D);
    $('root').innerHTML = html;
  }

  // ── Data: sessionStorage of demo ──
  function demoHeat(kind){
    var a=new Array(24*365), r=0;
    for(var u=0;u<24;u++){ for(var d=0;d<365;d++){ var idx=u*365+d, v=0;
      var seiz=0.6+0.4*Math.cos((d-172)/365*2*Math.PI);           // zomer-piek voor solar-achtig
      if(kind==='afname') v=(u>=6&&u<=9)||(u>=17&&u<=21)?1:(u>=1&&u<=5?0.15:0.5);
      else if(kind==='spot') v=(u>=17&&u<=20)?1:(u>=11&&u<=14?0.2:0.55);
      else if(kind==='kost') v=((u>=17&&u<=21)?1:0.4)*((u>=6&&u<=9)||(u>=17&&u<=21)?1:0.5);
      else if(kind==='inj') v=(u>=9&&u<=16)?seiz:0;
      else if(kind==='curt') v=(u>=11&&u<=14)?seiz*0.5*(d%7<2?1:0.3):0;
      else if(kind==='gen') v=(u>=7&&u<18 && (new Date(Date.UTC(2025,0,1+d)).getUTCDay()%6!==0) && new Date(Date.UTC(2025,0,1+d)).getUTCDay()!==0)?9.2:0;
      if(kind==='gen'){ a[idx]=v; continue; }
      a[idx]=Math.max(0, v*(0.8+0.4*Math.random()));
    } }
    return a;
  }
  function demo(mode){
    var D={ mode:'particulier', klant:'Voorbeeld gezin', datum:new Date().toLocaleDateString('nl-BE'),
      regio:'Vlaanderen', profiel:'residentieel', specifiek_profiel:false,
      input:{ afname_mwh:6, injectie_mwh:2.4, aansluiting_kva:9.2, fasen:3, bestaand_pv_kwp:4, wagens:[{km:15000}] },
      combo:{ pv_kwp:4.5, batt_kwh:5, batt_kw:5, besparing:891, rendement:17.0, kost:1645, ref_kost:2536, capex:5250, terugverdientijd:5.9 },
      onderhandel:{ marge_jaar:210, marge_maand:18, besparing_pct:6.2, energiekost_nu_mwh:165, energiekost_dyn_mwh:150, volume_mwh:6,
        toegangsvermogen_advies:{ verlaagbaar:false },
        heatmaps:{ uren:24, dagen:365, afname_kw:demoHeat('afname'), spot_eur_mwh:demoHeat('spot'), afnamekost_eur:demoHeat('kost') } },
      injectie:{ opbrengst_jaar:{ vandaag_spot_eur:120, met_curtail_eur:168, meerwaarde_curtail_eur:48, meerwaarde_onbalans_eur:0 },
        energie_jaar:{ productie_mwh:3.6 }, payback:{},
        heatmaps:{ uren:24, dagen:365, netto_injectie_eur:demoHeat('inj'), bespaard_curtail_eur:demoHeat('curt') } } };
    if(mode==='bedrijf'){
      D.mode='bedrijf'; D.klant='Voorbeeld bedrijf'; D.regio='Vlaanderen'; D.profiel='Kantoor';
      D.input={ afname_mwh:120, injectie_mwh:30, aansluiting_kva:160, spanning:'MS', bestaand_pv_kwp:80, pleinen:[] };
      D.combo={ pv_kwp:38, batt_kwh:200, batt_kw:100, besparing:16788, rendement:18.1, kost:23310, ref_kost:40098, capex:92800 };
      D.onderhandel={ marge_jaar:3200, marge_maand:267, besparing_pct:4.1, energiekost_nu_mwh:158, energiekost_dyn_mwh:142, volume_mwh:120,
        toegangsvermogen_advies:{ verlaagbaar:true, huidig_kw:144, verlaagbaar_naar_kw:120, maandpiek_12m_kw:112, besparing_indicatie_eur_jaar:1080 },
        heatmaps:{ uren:24, dagen:365, afname_kw:demoHeat('afname'), spot_eur_mwh:demoHeat('spot'), afnamekost_eur:demoHeat('kost') } };
      D.injectie={ opbrengst_jaar:{ vandaag_spot_eur:2400, met_curtail_eur:2760, meerwaarde_curtail_eur:360, meerwaarde_onbalans_eur:1150 },
        energie_jaar:{ productie_mwh:72 }, payback:{},
        heatmaps:{ uren:24, dagen:365, netto_injectie_eur:demoHeat('inj'), bespaard_curtail_eur:demoHeat('curt'), verdiend_onbalans_eur:demoHeat('inj') } };
      D.generator={ kva:100, liter_jaar:8000, kwh_per_l:3.3, egen_kwh_jaar:26400, starts_per_dag:3, momenten_jaar:780,
        kwh_per_moment:33.8, venster:[7,18], dagen_per_week:5, diesel_eur_l:1.58, diesel_vermeden_eur_jaar:12640,
        batterij_seed_kw:100, batterij_seed_kwh:200, heatmap:{ uren:24, dagen:365, last_kwh:demoHeat('gen') } };
    }
    return D;
  }
  var API='https://lucid-amazement-production.up.railway.app';
  // Download-gating per rapport-tier: 'view' (nooit betalen) = enkel bekijken → PDF-knop weg + upsell-strook.
  // later/direct/geen tier = gewoon downloadbaar (de onderhandelingsnota zelf blijft altijd de gratis magneet).
  function _gate(magDownload){
    if(magDownload===false){
      var b=$('__pdfbtn'); if(b) b.style.display='none';
      var s=document.createElement('div'); s.className='demo'; s.style.cssText='display:block;background:#FFF4E5;color:#7A4A00;border-color:#F0C070';
      s.innerHTML='U koos <b>rapport enkel bekijken</b> (niet downloaden). Wilt u dit rapport toch bewaren of laten opvolgen door een adviseur? Antwoord op uw EnergieKompas-mail — dan schakelen wij het downloaden voor u vrij.';
      document.body.appendChild(s);
    }
  }
  function _klaar(D, gate){
    if(!D){ D=demo(qp('mode')); $('demo-banner').style.display='block'; }
    if(D && qp('volledig')==='1') D.volledig=true;   // preview-toggle: volledige studie (mét PV/batterij/generator)
    applyTheme(kiesThema(D));
    render(D);
    if(gate) _gate(gate.mag_download);
  }
  var D=null;
  try{ var raw=sessionStorage.getItem('FLUCTUS_EK_NOTA'); if(raw) D=JSON.parse(raw); }catch(e){}
  if(!D && window.FLUCTUS_EK_NOTA) D=window.FLUCTUS_EK_NOTA;
  // De schil opent eerst een blanco venster (user-gesture) en navigeert ons hierheen ná de async data-opbouw;
  // sessionStorage wordt dan niet gekopieerd → lees de data van de opener (zelfde origin).
  try{ if(!D && window.opener && window.opener.__EK_NOTA) D=window.opener.__EK_NOTA; }catch(e){}
  // ?lead=<token> (uit de klant-mail): geen in-page data → haal de bewaarde nota op bij de proxy.
  var leadTok=qp('lead');
  if(!D && leadTok){
    fetch(API+'/api/lead/'+encodeURIComponent(leadTok)).then(function(r){return r.ok?r.json():null;})
      .then(function(j){ _klaar(j&&j.nota?j.nota:null, j?{mag_download:j.mag_download}:null); }).catch(function(){ _klaar(null); });
  } else { _klaar(D); }
})();
