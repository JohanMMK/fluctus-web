<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factuurcheck · Energie-Compas</title>
<link rel="icon" href="/favicon-ec-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<!-- ek-fc.html v1.6.0 (2026-11-07, Johan): EAN, leverancier en netbeheerder onder de 4 kerncijfers uit de factuur (server ≥ 15.413.2). -->
<!-- ek-fc.html v1.5.0 (2026-11-07, Johan): foto willekeurig uit de 24 campagnebeelden (D.foto van de server); «Volgende stap»: met het echte profiel een oplossing waarin alles samenkomt (besparingen, rendement, stabiliteit, duurzaamheid; PV, batterij, laden, sturing). -->
<!-- ek-fc.html v1.4.0 (2026-11-07, Johan): vraag 4 = potentieel, geen rendement — km onder het toegangsvermogen, gemakkelijk N wagens (helft, max 25), besparing t.o.v. thuisladen en diesel; geen batterij en geen laadpalenblok meer (server ≥ 15.413.0). -->
<!-- ek-fc.html v1.3.1 (2026-11-07): jaarverbruik «volgens de factuur» (jaarverbruik op een maand-/voorschotfactuur, server ≥ 15.412.1). -->
<!-- ek-fc.html v1.3.0 (2026-11-07, Johan): vraag 4 — 5 dubbele AC-laadpalen op de personeelsparking: laden op het bedrijf i.p.v. thuis, besparing en terugverdientijd samen met de batterij (server ≥ 15.412.0). -->
<!-- ek-fc.html v1.2.0 (2026-11-07, Johan): vraag 2 — batterij net onder het toegangsvermogen (10/30/60/125 kW) × € 100, tegen 2029 het dubbele; volgende stap — echte profieldata nodig, studies gratis, offertes op maat, één klik. -->
<!-- ek-fc.html v1.1.1 (2026-11-07, Johan): vraag 1 — «Wie dezelfde aansluiting twee keer zo goed gebruikt, halveert zijn netkosten per kWh». -->
<!-- ek-fc.html v1.1.0 (2026-11-07, Johan): foto uit de eigen campagnebeelden (/ec-img/factuurcheck/fc-01…24.jpg), in kleur. -->
<!-- ek-fc.html v1.0.0 (2026-11-07, Johan): FACTUURCHECK op één A4 — campagne «Staan in uw factuur van … ook besparingen?».
     Vier vragen beantwoord uit één energieafrekening + het standaardprofiel «Industrie met zomersluiting»: (1) hoe goed gebruiken
     we onze aansluiting (loadfactor), (2) netkosten structureel verlagen (± € 100 per kVA per jaar), (3) meer goedkope energie
     (dynamische prijzen, lokale productie), (4) meer elektrificeren (batterij onder het toegangsvermogen + laden onder de huidige
     piek, €/100 km tegenover thuisladen en diesel). Zonder klantnaam of adres. Data: window.EK_FC_DATA (server-PDF, server ≥ 15.408.0)
     of localStorage EK_FC_DATA. Huisstijl Energie-Compas (navy #1F3864, groen #05B050, Poppins). -->
<style>
  :root{ --navy:#1F3864; --ink:#14203a; --acc:#05B050; --acc-d:#05803C; --acc-l:#EAF7EF; --muted:#5A6577; --lijn:#E3E8EF; --grijs:#C7CCD1; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:#e9edf2;font-size:11px;line-height:1.42}
  h1,h2,.big,.sv{font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.005em}
  .a4{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:11mm 12mm 9mm;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,.12);display:flex;flex-direction:column}
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  @media print{ html,body{height:auto;overflow:visible;background:#fff!important} .a4{margin:0 auto!important;box-shadow:none;break-after:avoid;page-break-after:avoid;break-inside:avoid} #bar{display:none!important}
    html:not(.srv) .a4{zoom:.94} html.srv,html.srv body{width:210mm;height:297mm;overflow:hidden} html.srv .a4{height:296.5mm} }
  #bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:8px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12)}
  #bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:var(--navy);color:#fff;cursor:pointer}
  .kop{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--acc);padding-bottom:7px;margin-bottom:10px}
  .kop img{height:30px;max-width:190px;object-fit:contain}
  .kop .ey{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}
  h1{font-size:21px;line-height:1.18;margin:0 0 3px;color:var(--navy)}
  .lead{font-size:11.5px;color:var(--muted);margin:0 0 9px}
  .las{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:5px}
  .ids{font-size:9.5px;color:var(--muted);margin:0 2px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
  .ids span{text-transform:uppercase;letter-spacing:.06em;font-size:8.2px;font-weight:700}
  .ids b{color:var(--navy,#1F3864);font-weight:700}
  .ids i{font-style:normal;color:#B8C2D0}
  .las>div{background:#F4F7FB;border:1px solid #E1E8F1;border-radius:10px;padding:6px 8px}
  .las .l{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .las .sv{font-size:14px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:1px}
  .las .s{font-size:9px;color:var(--muted)}
  .vg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
  .q{border:1px solid var(--lijn);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column}
  h2{font-size:12.5px;line-height:1.25;margin:0 0 6px;color:var(--navy);display:flex;align-items:flex-start;gap:7px}
  h2 .nr{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;flex:0 0 19px;margin-top:-1px}
  .big{font-size:27px;font-weight:700;color:var(--navy);line-height:1.05}
  .big small{font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
  .big .acc{color:var(--acc-d)}
  .t{font-size:10.5px;margin:6px 0 0}
  .t b{color:var(--navy)}
  .s2{font-size:9.5px;color:var(--muted);margin-top:auto;padding-top:6px}
  .gauge{position:relative;height:12px;border-radius:999px;background:#EEF2F6;margin:7px 0 2px;overflow:hidden}
  .gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--acc)}
  .gauge u{position:absolute;top:0;bottom:0;border-left:2px dashed var(--navy)}
  .gl{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted)}
  .bars{margin-top:7px}
  .bar{display:grid;grid-template-columns:112px minmax(0,1fr) 62px;align-items:center;gap:6px;font-size:9.5px;margin:3px 0}
  .bar span{color:var(--muted)}
  .bar .tr{height:11px;border-radius:4px;background:#EEF2F6;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:4px;background:var(--grijs)}
  .bar.on .tr i{background:var(--acc)}
  .bar b{text-align:right;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pal{margin-top:6px;background:var(--acc-l);border:1px solid #BFE6CD;border-radius:9px;padding:6px 8px;font-size:9.8px;line-height:1.38}
  .pal b{color:var(--acc-d)}
  .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:4px}
  .duo>div{background:#F7F9FC;border:1px solid #E6ECF3;border-radius:10px;padding:7px 8px}
  .duo .l{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .duo .sv{font-size:15px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:1px}
  .rb{display:flex;justify-content:space-between;gap:6px;font-size:10px;padding:2px 0;border-bottom:1px dashed #E6ECF3}
  .rb:last-child{border-bottom:0}
  .rb b{color:var(--navy);white-space:nowrap}
  .vlg{display:flex;flex:1 1 auto;min-height:0;gap:10px;margin-bottom:8px}
  .vlg .tx{flex:1 1 56%;background:var(--navy);color:#fff;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;justify-content:center}
  .vlg .tx .ey{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9FE3BC}
  .vlg .tx b{display:block;font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.25;margin:4px 0 5px}
  .vlg .tx p{margin:0;font-size:10px;opacity:.92}
  .vlg .ft{flex:1 1 44%;border-radius:12px;overflow:hidden;position:relative;background:var(--navy);min-height:80px}
  .vlg .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 30%}
  .vlg .ft .d{position:absolute;left:0;right:0;bottom:0;padding:22px 11px 9px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78));color:#fff;font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;line-height:1.2}
  .vlg .ft .d:before{content:'';display:block;width:24px;height:3px;border-radius:2px;background:var(--acc);margin-bottom:5px}
  .vlg .ft .d small{display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:9px;opacity:.85;margin-top:2px}
  .vt{border-top:1px solid var(--lijn);padding-top:6px;font-size:8.5px;line-height:1.4;color:var(--muted);display:flex;justify-content:space-between;gap:14px}
  .vt b{color:var(--navy)}
</style>
</head>
<body>
<div id="bar"><button type="button" onclick="window.print()">🖨️ Afdrukken of bewaren als PDF</button></div>
<div class="a4" id="a4"></div>
<script>
(function(){
  var D=null;
  try{ if(window.EK_FC_DATA){ D=window.EK_FC_DATA; document.documentElement.classList.add('srv'); document.getElementById('bar').style.display='none'; } }catch(e){}
  if(!D){ try{ var s=localStorage.getItem('EK_FC_DATA'); if(s) D=JSON.parse(s); }catch(e){} }
  var root=document.getElementById('a4');
  if(!D){ root.innerHTML='<p style="padding:40px;font-size:14px">Geen gegevens.</p>'; window.__FC_KLAAR=true; return; }
  function e(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ok(v){ return v!=null && isFinite(+v); }
  function nf(v,d){ if(!ok(v)) return '—'; return Number(v).toLocaleString('nl-BE',{minimumFractionDigits:(d||0),maximumFractionDigits:(d||0)}); }
  function eur(v){ return ok(v)?'€ '+nf(Math.round(v)):'—'; }
  function eur2(v){ return ok(v)?'€ '+nf(v,2):'—'; }
  function eur3(v){ return ok(v)?'€ '+nf(v,3):'—'; }
  function dmy(s){ if(!s) return ''; var p=String(s).split('-'); return p.length===3?(+p[2])+'/'+(+p[1]):s; }
  var F=D.factuur||{}, Q1=D.q1||{}, Q2=D.q2||{}, Q3=D.q3||{}, Q4=D.q4||{}, B=Q4.batt, L=Q4.laden||{}, P=Q4.potentieel||null;
  var h='';
  h+='<div class="kop"><img src="/apps/ec-logo.png" alt="Energie-Compas"><div class="ey">Factuurcheck · '+e(D.datum||'')+'</div></div>';
  h+='<h1>Staan in uw factuur van '+e(String(D.factuurmaand||'').replace(/\s\d{4}$/,''))+' ook besparingen?</h1>';
  h+='<p class="lead">Vier vragen, beantwoord uit één energieafrekening en het standaardprofiel «'+e(D.profiel||'')+'». Met uw echte kwartierprofiel worden de cijfers exact.</p>';
  // wat we lazen
  var per=(F.van&&F.tot)?(dmy(F.van)+' – '+dmy(F.tot)):(F.dagen?F.dagen+' dagen':'');
  h+='<div class="las">'
    +'<div><div class="l">Op de factuur</div><div class="sv">'+nf(F.kwh)+' kWh</div><div class="s">'+e(per)+'</div></div>'
    +'<div><div class="l">Jaarverbruik</div><div class="sv">'+((F.jaar_bron==='jaarafrekening'||F.jaar_bron==='factuur')?'':'± ')+nf(F.jaar_mwh)+' MWh</div><div class="s">'+(F.jaar_bron==='jaarafrekening'?'uit de jaarafrekening':(F.jaar_bron==='factuur'?'volgens de factuur':'geschat uit de factuurperiode'))+'</div></div>'
    +'<div><div class="l">Aansluiting</div><div class="sv">'+nf(F.kva)+' kVA</div><div class="s">'+e(F.spanning==='MS'?'middenspanning':'laagspanning')+(F.kva_geschat?' · geschat':'')+'</div></div>'
    +'<div><div class="l">Kost per kWh</div><div class="sv">'+eur3(F.prijs_kwh)+'</div><div class="s">alles inbegrepen, excl. btw</div></div>'
    +'</div>';
  /* v1.6.0: EAN, leverancier en netbeheerder onder de 4 kerncijfers */
  var _id=[]; if(F.ean) _id.push('<span>EAN</span> <b>'+e(String(F.ean).replace(/(\d{4})(?=\d)/g,'$1 '))+'</b>'); if(F.leverancier) _id.push('<span>Leverancier</span> <b>'+e(F.leverancier)+'</b>'); if(F.dnb) _id.push('<span>Netbeheerder</span> <b>'+e(F.dnb)+'</b>');
  if(_id.length) h+='<div class="ids">'+_id.join('<i>·</i>')+'</div>';
  h+='<div class="vg">';
  // 1 — aansluiting
  var lf=+Q1.lf_pct||0, lfw=Math.max(1.5,Math.min(100,lf)), lf2=Math.min(100,lf*2);
  h+='<div class="q"><h2><span class="nr">1</span>Hoe goed gebruiken we onze aansluiting?</h2>'
    +'<div class="big">'+nf(lf,1)+' %<small>van uw '+nf(Q1.kva)+' kVA</small></div>'
    +'<div class="gauge"><i style="width:'+lfw.toFixed(1)+'%"></i><u style="left:'+lf2.toFixed(1)+'%"></u></div><div class="gl"><span>0 %</span><span>- - - verdubbeld: '+nf(lf*2,1)+' %</span><span>100 %</span></div>'
    +'<p class="t">Stel dat u maar '+nf(lf,0)+' % van uw machines of gebouwen zou gebruiken: hoe lang blijft u dan competitief? Wie dezelfde aansluiting twee keer zo goed gebruikt, <b>halveert zijn netkosten per kWh</b>'+(ok(Q1.net_kwh)?': bij u van <b>'+eur3(Q1.net_kwh)+'</b> naar <b>'+eur3(Q1.net_kwh_half)+'</b>.':'.')+'</p>'
    +'<div class="s2">Gemiddeld vermogen over het jaar ÷ het vermogen van uw aansluiting.</div></div>';
  // 2 — netkosten (v1.2.0: batterij uit 10/30/60/125 kW, net onder het toegangsvermogen; kW × € 100, tegen 2029 het dubbele)
  var p0=+Q2.piek_kw||0, bq=+Q2.batt_kw||0, p1=bq?Math.max(0,p0-bq):0, mx=Math.max(p0,1);
  h+='<div class="q"><h2><span class="nr">2</span>Kunnen we de netkosten structureel verlagen?</h2>'
    +'<div class="big">± € '+nf(Q2.eur_kva)+'<small>per kVA per jaar</small></div>'
    +'<p class="t">Pieken beheersen kan met gebruiksgedrag. Nog beter zijn <b>flexibele verbruikers die automatisch gestuurd worden</b> om pieken te vermijden. Elke kVA die u niet nodig hebt, is een besparing die <b>tegen 2029 twee keer zo groot</b> is.</p>'
    +(bq>0?('<div class="bars"><div class="bar"><span>Hoogste kwartier nu</span><div class="tr"><i style="width:'+(p0/mx*100).toFixed(1)+'%"></i></div><b>'+nf(p0)+' kW</b></div>'
      +'<div class="bar on"><span>Met batterij '+nf(bq)+' kW</span><div class="tr"><i style="width:'+(p1/mx*100).toFixed(1)+'%"></i></div><b>'+nf(p1)+' kW</b></div></div>'
      +'<p class="t">Een batterij van <b>'+nf(bq)+' kW</b>, net onder uw toegangsvermogen, die uw piek met haar vermogen verlaagt: <b>± '+eur(Q2.eur_jaar)+' per jaar</b>, tegen 2029 ± '+eur(Q2.eur_jaar_later)+'.</p>')
      :('<p class="t">Uw hoogste kwartier op dit profiel: <b>± '+nf(p0)+' kW</b>.</p>'))
    +'</div>';
  // 3 — goedkope energie
  var dyn=(ok(Q3.nu_mwh)&&ok(Q3.dyn_mwh)&&+Q3.dyn_mwh<+Q3.nu_mwh);
  h+='<div class="q"><h2><span class="nr">3</span>Kunnen we meer goedkope energie binnenhalen?</h2>'
    +(dyn?('<div class="big">'+eur(Q3.nu_mwh)+' <span style="font-size:18px;color:var(--muted)">→</span> <span class="acc">'+eur(Q3.dyn_mwh)+'</span><small>per MWh</small></div>'
      +'<div class="s2" style="margin-top:2px;padding-top:0">Uw energieprijs nu → dezelfde maand aan de dynamische prijzen.</div>')
      :'<div class="big">Ja<small>met flex</small></div>')
    +'<p class="t">Met flex gebruikt u <b>meer lokale productie</b>, zoals zonnestroom, en <b>plant u uw afname</b> op de goedkopere uren van de dynamische prijzen. Dezelfde sturing die uw pieken aanpakt, klaart ook dit klusje.</p>'
    +'<div class="s2">Energie-arbitrage op de day-ahead- en intradaymarkt en passieve respons op de onbalans.</div></div>';
  // 4 — elektrificeren
  var m100=Math.max(+L.eur100||0,+L.thuis100||0,+L.diesel100||0,1);
  h+='<div class="q"><h2><span class="nr">4</span>Hoe kunnen we met die lagere kosten meer elektrificeren?</h2>'
    +'<div class="duo">'
      +'<div><div class="l">Laden zonder hogere piek</div><div class="sv">± '+nf(L.km)+' km</div>'
        +'<div class="rb"><span>Laadruimte</span><b>± '+nf(L.mwh,0)+' MWh/jaar</b></div><div class="rb"><span>Onder uw piek van</span><b>'+nf(L.cap_kw)+' kW</b></div>'
        +'<div class="rb"><span>Op werkdagen</span><b>7 tot 19 uur</b></div></div>'
      +((P&&+P.wagens>=1&&+L.wagens>=2)?('<div><div class="l">Gemakkelijk haalbaar, per jaar</div><div class="sv">'+nf(P.wagens)+' wagen'+(+P.wagens>1?'s':'')+'</div>'
        +'<div class="rb"><span>Kilometers</span><b>'+nf(P.km)+' km</b></div><div class="rb"><span>Besparing vs. thuis</span><b>± '+eur(P.besp_thuis)+'</b></div>'
        +'<div class="rb"><span>Besparing vs. diesel</span><b>± '+eur(P.besp_diesel)+'</b></div></div>')
        :('<div><div class="l">Laadruimte</div><div class="sv">Beperkt op dit profiel</div><p class="t" style="margin-top:3px">Onder uw huidige piek is er op dit standaardprofiel weinig laadruimte. Met uw kwartierprofiel zien we hoeveel er werkelijk kan.</p></div>'))
    +'</div>'
    +'<div class="bars" style="margin-top:6px">'
      +'<div class="bar on"><span>Laden op uw site</span><div class="tr"><i style="width:'+((+L.eur100||0)/m100*100).toFixed(1)+'%"></i></div><b>'+eur2(L.eur100)+'</b></div>'
      +'<div class="bar"><span>Thuisladen</span><div class="tr"><i style="width:'+((+L.thuis100||0)/m100*100).toFixed(1)+'%"></i></div><b>'+eur2(L.thuis100)+'</b></div>'
      +'<div class="bar"><span>Diesel</span><div class="tr"><i style="width:'+((+L.diesel100||0)/m100*100).toFixed(1)+'%"></i></div><b>'+eur2(L.diesel100)+'</b></div>'
    +'</div>'
    +'<div class="s2">Potentieel, geen rendement: «gemakkelijk» = de helft van de laadruimte, hoogstens 25 wagens van 15.000 km per jaar, AC-laden op werkdagen van 7 tot 19 uur.</div></div>';
  h+='</div>';
  // volgende stap + foto
  var foto=(/^fc-\d\d\.jpg$/.test(D.foto||'')?D.foto:('fc-'+('0'+(Math.floor(Math.random()*24)+1)).slice(-2)+'.jpg'));   /* v1.5.0: willekeurig uit de 24 campagnebeelden (ondernemers met hun factuur), server kiest D.foto */
  h+='<div class="vlg"><div class="tx"><div class="ey">Volgende stap</div><b>Om de echte meerwaarde in uw situatie te tonen, hebben we uw echte profieldata nodig.</b><p>Met uw echte profiel ontwerpen we een oplossing waarin alles samenkomt: <strong style="color:#fff">besparingen, rendement, stabiliteit en duurzaamheid</strong>, door de juiste combinatie van zonnepanelen, batterij, laden en sturing. Al onze studies zijn gratis, ook op uw kwartierverbruik. Kiest u een oplossing, dan vragen we offertes op die de berekende besparingen en inkomsten ook echt waarmaken. Eén klik in onze mail volstaat: «Ja, ik wil het exact weten».</p></div>'
    +'<div class="ft"><img id="fc-foto" src="/ec-img/factuurcheck/'+e(foto)+'" alt=""><div class="d">Bedankt om het net beter te gebruiken.<small>#NetBeterGebruiken</small></div></div></div>';
