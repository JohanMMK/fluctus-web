<script>
// ============================================================
//   FLUCTUS APP-AUTH SNIPPET — v1.2 (sessie 9a, token-verversing)
//   Globale naam = FluctusAppAuth (NIET FluctusAuth: die is al bezet
//   door de Academy-login op hetzelfde Odoo-domein).
//   Identiek aan fluctus_auth_snippet.js (Snippets-repo). Wijzigingen
//   ALTIJD eerst daar, dan hier spiegelen.
// ============================================================
(function(global){
'use strict';
var FA_API = 'https://lucid-amazement-production.up.railway.app';
var FA_SB  = 'https://haagysosdaorrxkrwkcj.supabase.co';
var FA_KEY = 'sb_publishable_lnpeEjaj960Jjk_jbc-bdw_WFZnORL3'; // publiek (zelfde als Academy)

var _token = null;   // laatst bekende geldige access_token
var _timer = null;   // achtergrond-verversing

function _sessie(){
  // Vindt de supabase-js sessie in localStorage. Returnt {key, s} of null.
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(/^sb-.+-auth-token$/.test(k)){
        var v = JSON.parse(localStorage.getItem(k));
        if(v && v.currentSession) v = v.currentSession; // legacy v1-formaat
        if(v && v.access_token) return { key: k, s: v };
      }
    }
  }catch(e){ /* localStorage niet beschikbaar — behandel als uitgelogd */ }
  return null;
}

function _geldig(s){
  // 60s marge zodat we nooit met een net-verlopen token de server raken.
  return !!(s.expires_at && s.expires_at * 1000 > Date.now() + 60000);
}

function _vernieuw(o){
  // Ververst via refresh_token en schrijft terug naar localStorage.
  if(!o || !o.s.refresh_token) return Promise.resolve(null);
  return fetch(FA_SB + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey': FA_KEY },
    body: JSON.stringify({ refresh_token: o.s.refresh_token })
  })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(n){
    if(!n || !n.access_token){
      var o2 = _sessie();
      return (o2 && _geldig(o2.s)) ? o2.s.access_token : null;
    }
    if(!n.expires_at && n.expires_in){
      n.expires_at = Math.floor(Date.now() / 1000) + n.expires_in;
    }
    try{
      var samengevoegd = {};
      for (var a in o.s) samengevoegd[a] = o.s[a];
      for (var b in n)   samengevoegd[b] = n[b];
      localStorage.setItem(o.key, JSON.stringify(samengevoegd));
    }catch(e){ /* terugschrijven best-effort */ }
    return n.access_token;
  })
  .catch(function(){ return null; });
}

function _zorgToken(){
  var o = _sessie();
  if(!o){ _token = null; return Promise.resolve(null); }
  if(_geldig(o.s)){ _token = o.s.access_token; return Promise.resolve(_token); }
  return _vernieuw(o).then(function(t){ _token = t; return t; });
}

function _startVerversing(){
  if(_timer) return;
  _timer = setInterval(function(){
    var o = _sessie();
    if(!o) return;
    if(o.s.expires_at && o.s.expires_at * 1000 - Date.now() < 10 * 60 * 1000){
      _zorgToken();
    }else{
      _token = o.s.access_token;
    }
  }, 5 * 60 * 1000);
}

function _blok(rootEl, titel, tekst){
  if(!rootEl) return;
  rootEl.innerHTML =
    '<div style="font-family:Helvetica,Arial,sans-serif;border:1px solid #D5DBE3;border-radius:8px;'+
    'padding:32px;text-align:center;background:#F5F7FA;color:#1A1F2B;margin:20px 0;">'+
    '<div style="font-size:16px;font-weight:700;color:#1F3864;margin-bottom:8px;">'+titel+'</div>'+
    '<div style="font-size:13px;color:#5A6577;line-height:1.6;">'+tekst+'</div></div>';
}

var FluctusAppAuth = {
  user: null,
  toegang: false,

  token: function(){
    if(_token) return _token;
    var o = _sessie();
    return o ? o.s.access_token : null;
  },

  // Controleert login + app-permissie. Ververst eerst het token indien nodig.
  // Blokkeert rootEl bij weigering. Returnt Promise<boolean>.
  requireAccess: function(appId, rootEl){
    return _zorgToken().then(function(t){
      if(!t){
        _blok(rootEl, 'Aanmelden vereist',
          'Log in via de Fluctus Academy om deze app te gebruiken.');
        return false;
      }
      return fetch(FA_API + '/api/app-access/check', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + t },
        body: JSON.stringify({ app_id: appId })
      })
      .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j }; }); })
      .then(function(res){
        if(res.status === 200 && res.j && res.j.toegang){
          FluctusAppAuth.user = res.j.user || null;
          FluctusAppAuth.toegang = true;
          _startVerversing();
          return true;
        }
        if(res.status === 401){
          _blok(rootEl, 'Sessie verlopen',
            'Uw sessie is verlopen. Log opnieuw in via de Fluctus Academy en herlaad deze pagina.');
        }else{
          _blok(rootEl, 'Geen toegang',
            'U heeft nog geen toegang tot deze app. Vraag toegang aan uw manager.');
        }
        return false;
      })
      .catch(function(){
        _blok(rootEl, 'Toegangscontrole niet bereikbaar',
          'De server is tijdelijk niet bereikbaar. Herlaad de pagina of probeer over enkele minuten opnieuw.');
        return false;
      });
    });
  },

  tokenAsync: function(){ try{ return _zorgToken(); }catch(e){ return Promise.resolve(FluctusAppAuth.token()); } },
  vernieuwNu: function(){ try{ var o=_sessie(); return o ? _vernieuw(o).then(function(t){ _token=t; return t; }) : Promise.resolve(null); }catch(e){ return Promise.resolve(null); } },

  logActivity: function(appId, actie, payload){
    try{
      var t = FluctusAppAuth.token();
      if(!t) return;
      var p = payload || {};
      fetch(FA_API + '/api/app-activity/log', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + t },
        body: JSON.stringify({
          app_id: appId, actie: actie,
          klant_btw: p.klant_btw || null,
          klant_naam: p.klant_naam || null,
          details: p
        }),
        keepalive: true
      }).catch(function(){ /* stil */ });
    }catch(e){ /* stil */ }
  }
};

global.FluctusAppAuth = FluctusAppAuth;
})(typeof window !== 'undefined' ? window : this);
</script>

<script>
// ============================ MODEL-/PROCESPARAMETERS ============================
var P = {
  MAX_KVA_2F:5, MAX_KVA_3F:25, LAADVERMOGEN_BASIS:4,
  PANEEL_WP:450, PANEEL_M2:2, PV_KOST:500, PV_MIN:4, PV_MAX:40, PV_STAP:2,
  RENDEMENT_MIN:10, INFLATIE:2, NETINDEX:2, DIESEL_100KM:9.0,
  // CREG = refertetarief thuisladen bedrijfswagen (= gemiddeld huishoudelijk elektriciteitstarief per regio).
  // Q3 2026: Vlaanderen 32,22 c/kWh · Brussel 37,19 · Wallonië 37,83. Kwartaal- en regio-afhankelijk → instelbaar.
  CREG_VL:322, CREG_BR:372, CREG_WA:378,
  SPOT:95, NETKOST_MWH:70, HEFFING_MWH:35, CAPACITEIT_KW_JR:45, INJECTIE_MWH:40,
  PV_YIELD:950, RTE:0.90, HORIZON:15, BATT_CRATE:2,   // omvormer-sizing: kW = kWh / C-rate (2 = 2-uurs batterij)
  BATT:[ {kva:5,kwh:5,eur:3000},{kva:5,kwh:10,eur:5000},{kva:5,kwh:15,eur:7500},{kva:5,kwh:20,eur:10000},{kva:5,kwh:25,eur:12500},
         {kva:10,kwh:10,eur:7000},{kva:10,kwh:15,eur:9500},{kva:10,kwh:20,eur:12000},{kva:10,kwh:25,eur:14500},
         {kva:15,kwh:15,eur:11000},{kva:15,kwh:20,eur:14000},{kva:15,kwh:25,eur:16500} ]
};
// ============================ KLANT-INVOER ============================
var IN = {
  profiel:'residentieel', jaarverbruik_mwh:3.5, piek_kw:5.0, fasen:3,
  regio:'VL',                 // CREG-tarief-regio (VL/BR/WA); wordt uit de factuur-postcode afgeleid
  bestaand_pv_kwp:0, bestaand_inj_mwh:0,
  referentiekost:1400,
  wagens:[ {km:15000, kwhkm:0.16, wd_start:19, wd_eind:7, we_start:0, we_eind:24, creg:true} ],
  max_pv_pan:null, max_budget:null, min_rend:null
};
var STATE = { rol:'manager', grid:null, gemeten:{}, sel:null, iterLog:[], status:'idle', selBusy:false };

// ============================ HELPERS ============================
function fmtE(x){ return '€ '+Math.round(x).toLocaleString('nl-BE'); }
function fmtE1(x){ return '€ '+(+x).toLocaleString('nl-BE',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtN(x,d){ return (+x).toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function maxKva(){ return IN.fasen===2 ? P.MAX_KVA_2F : P.MAX_KVA_3F; }
// Bij 2 fasen (5 kVA) heeft méér dan ~20 panelen geen zin (kleine aansluiting) → PV-as afkappen op 20.
function pvMaxEff(){ return IN.fasen===2 ? Math.min(20, P.PV_MAX) : P.PV_MAX; }
// Actief CREG-tarief volgens de gekozen regio (VL/BR/WA).
var REGIO_NAAM={VL:'Vlaanderen',BR:'Brussel',WA:'Wallonië'};
function cregTarief(){ return P['CREG_'+(IN.regio||'VL')] || P.CREG_VL; }
// Belgische postcode → regio (VL/BR/WA). 1000-1299 Brussel; 1300-1499 & 4000-7999 Wallonië; rest Vlaanderen.
function regioVanPostcode(pc){ pc=parseInt(pc,10); if(!pc) return null;
  if(pc>=1000&&pc<=1299) return 'BR';
  if((pc>=1300&&pc<=1499)||(pc>=4000&&pc<=7999)) return 'WA';
  return 'VL'; }
function evMwh(){ return IN.wagens.reduce(function(s,w){return s+(w.km*w.kwhkm/1000);},0); }
// Laadfactor = totaal jaarverbruik (gebouw + wagens) / (maximale piek × 8760 u), in %. Hoger = vlakker = gunstig.
function laadfactorVan(piek){ var totKwh=(IN.jaarverbruik_mwh+evMwh())*1000; return (piek>0)? totKwh/(piek*8760)*100 : 0; }
function paneelKwp(pan){ return pan*P.PANEEL_WP/1000; }
function battCrate(){ return (P.BATT_CRATE>0)?P.BATT_CRATE:2; }
function battPrijs(kwh){ // omvormer = kleinste kVA ≥ (kWh / C-rate), binnen de fasegrens
  if(kwh<=0) return {kwh:0,kva:0,eur:0};
  var cand=P.BATT.filter(function(b){return b.kwh===kwh && b.kva<=maxKva();});
  if(!cand.length) return null;   // past niet op deze aansluiting
  cand.sort(function(a,b){return a.kva-b.kva;});
  var req=kwh/battCrate();        // vereist omvormervermogen (kW)
  for(var i=0;i<cand.length;i++){ if(cand[i].kva>=req) return cand[i]; }
  return cand[cand.length-1];     // geen enkele haalt de vereiste power → grootste beschikbare
}
// as-waarden
function battAs(){ return [0,5,10,15,20,25]; }
function pvAs(){ var a=[0]; for(var n=P.PV_MIN;n<=pvMaxEff();n+=P.PV_STAP) a.push(n); return a; }

// ============================ REKENHART (indicatief prototype) ============================
// Berekent voor één combinatie (batterij-kWh, extra-PV-panelen) de jaarkost, besparing, capex, rendement, €/MWh.
// Transparante heuristiek: zelfconsumptie stijgt met PV én batterij; batterij verschuift laden naar goedkope/PV-uren
// en shaaft de piek (capaciteitskost). GEEN onbalans. Onbalans-extra = losse bonus (zie onbalansExtra()).
function model(battKwh, pvPan, _isRef){
  // In server-modus ENKEL de echte dispatch tonen (geen lokaal benaderingsmodel meer als resultaat).
  if(!_isRef && STATE.serverMode){ return svModel(battKwh,pvPan); }
  var bt = battPrijs(battKwh);
  if(bt===null) return null;   // batterij past niet op de aansluiting
  var ev = evMwh();                                  // MWh/jaar laden
  var gebouw = IN.jaarverbruik_mwh;                  // MWh/jaar woning
  var totLoad = gebouw + ev;
  var pvKwp = IN.bestaand_pv_kwp + paneelKwp(pvPan);
  var pvProd = pvKwp * P.PV_YIELD / 1000;            // MWh/jaar
  var battBruik = battKwh * 0.9;                      // bruikbaar (DoD)
  // Zelfconsumptie: direct overdag (~32% van de overlap load↔PV) + wat de batterij 's avonds/nachts buffert
  // (≈300 nuttige woning-cycli/jaar). Nooit meer dan de last of de productie.
  var directSC = Math.min(pvProd, totLoad) * 0.32;
  var battSC = Math.min( battBruik*300/1000, Math.max(0, Math.min(pvProd,totLoad) - directSC) );
  var zelfverbruik = Math.min(pvProd, totLoad, directSC + battSC);
  var injectieBruto = Math.max(0, pvProd - zelfverbruik);
  // Injectie realistisch waarderen: nuttige injectie (tot ~de jaarlast) aan INJECTIE_MWH, overschot ~waardeloos
  // (curtailment/lage terugleverprijs) → oversized PV verhoogt de capex zonder evenredige besparing.
  var injNuttig = Math.min(injectieBruto, totLoad);
  var injOver = Math.max(0, injectieBruto - totLoad);
  var netAfname = Math.max(0, totLoad - zelfverbruik);                   // MWh uit net
  var laadP = Math.min(P.LAADVERMOGEN_BASIS, Math.max(0.5, maxKva()-IN.piek_kw));
  var piekMetEV = IN.piek_kw + laadP;
  var piekEff = Math.max(IN.piek_kw, piekMetEV - bt.kva);               // batterij shaaft de laadpiek
  var energie = netAfname * (P.SPOT + P.NETKOST_MWH + P.HEFFING_MWH);
  var injOpbr = injNuttig * P.INJECTIE_MWH + injOver * 5;
  var capac = piekEff * P.CAPACITEIT_KW_JR;
  var kostScenario = Math.max(capac*0.2, energie - injOpbr + capac);    // vloer: capaciteit blijft altijd betaald
  var injectie = injectieBruto;
  // tussenkomst werkgever: CREG voor vergoede wagens, dieselbesparing voor niet-vergoede
  var creg=0, diesel=0;
  IN.wagens.forEach(function(w){ var mwh=w.km*w.kwhkm/1000; if(w.creg) creg += mwh*cregTarief(); else diesel += (w.km/100)*P.DIESEL_100KM; });
  var capex = bt.eur + paneelKwp(pvPan)*P.PV_KOST;
  var eurMwh = totLoad>0 ? kostScenario/totLoad : 0;
  // Benaderende factuur + energiebalans (prototype). De server levert de echte cijfers.
  var locFactuur = { A_energie:Math.round(netAfname*P.SPOT), B_afname:Math.round(netAfname*P.NETKOST_MWH+capac),
    C_injectie:-Math.round(injOpbr), D_transport:0, E_heffingen:Math.round(netAfname*P.HEFFING_MWH),
    subtotaal:Math.round(kostScenario) };
  var locEnergie = { afname_mwh:totLoad, pv_prod_mwh:pvProd,
    verbruik:{ pv_direct:directSC, pv_batt:battSC, net_direct:netAfname, net_batt:0 },
    productie:{ pv_direct:directSC, pv_batt:battSC, pv_inj:injectieBruto },
    pct_zelfconsumptie: pvProd>0?Math.round(zelfverbruik/pvProd*100):0,
    pct_zelfvoorziening: totLoad>0?Math.round(zelfverbruik/totLoad*100):0 };
  // Referentie-run (0 batterij, 0 extra PV): kost + factuur + energie teruggeven, geen besparing → geen recursie.
  if(_isRef){ return { kostScenario:kostScenario, factuur:locFactuur, energie:locEnergie }; }
  // BESPARING = referentie (gebouw + laden, geen PV/batterij) − scenariokost (met PV+batterij+sturing).
  var ref = model(0, 0, true); var refKost = ref ? ref.kostScenario : kostScenario;
  var besparing = refKost - kostScenario;
  var rend = capex>0 ? (besparing/capex*100) : (besparing>0?999:0);
  return { battKwh:battKwh, kva:bt.kva, pvPan:pvPan, kwp:pvKwp, capex:capex,
    kostScenario:kostScenario, besparing:besparing, rendement:rend, eurMwh:eurMwh, refKost:refKost,
    piek:piekEff, laadfactor:laadfactorVan(piekEff),
    factuur:locFactuur, energie:locEnergie, refFactuur:(ref?ref.factuur:null), refEnergie:(ref?ref.energie:null),
    netAfname:netAfname, injectie:injectie, zelfverbruik:zelfverbruik, piekEff:piekEff,
    creg:creg, diesel:diesel };
}
// onbalans-extra (losse bonus, niet in de zoektocht): kleine % extra winst die stijgt met batterijgrootte
function onbalansExtra(m){ if(!m||m.battKwh<=0) return 0; return Math.min(0.18,0.05+m.battKwh*0.004) * Math.max(0,m.kostScenario) * 0.25; }

// ============================ ANKERNET + SPLINE-INTERPOLATIE ============================
function pctPanelen(pct){ return Math.round(pvMaxEff()*pct/100/P.PV_STAP)*P.PV_STAP; }
function buildGrid(){
  var by=battAs(), px=pvAs();
  var battAnk=[0,5,10,15,20,25];                        // 5 kVA dekt alle kWh → alle klassen als anker
  var pvAnk=[0, pctPanelen(25), pctPanelen(50), pctPanelen(75), pctPanelen(100)];
  // exacte ankerwaarden
  var A={}; var runs=0;
  battAnk.forEach(function(b){ pvAnk.forEach(function(pv){ var key=b+'_'+pv; A[key]=model(b,pv); runs++; }); });
  // ingemeten (klik-)cellen overschrijven
  for(var kk in STATE.gemeten){ A[kk]=STATE.gemeten[kk]; }
  // interpoleer volledige grid (bilineair over de anker-assen; splinevlak-benadering)
  function interp(field, b, pv){
    // vind omliggende anker-b en anker-pv
    function bracket(arr,v){ var lo=arr[0],hi=arr[arr.length-1]; for(var i=0;i<arr.length-1;i++){ if(v>=arr[i]&&v<=arr[i+1]){lo=arr[i];hi=arr[i+1];break;} } return [lo,hi]; }
    var bb=bracket(battAnk,b), pp=bracket(pvAnk,pv);
    function val(bx,px){ var m=A[bx+'_'+px]; return m?m[field]:null; }
    var q11=val(bb[0],pp[0]),q12=val(bb[0],pp[1]),q21=val(bb[1],pp[0]),q22=val(bb[1],pp[1]);
    if(q11==null) return null;
    var tb=bb[1]===bb[0]?0:(b-bb[0])/(bb[1]-bb[0]);
    var tp=pp[1]===pp[0]?0:(pv-pp[0])/(pp[1]-pp[0]);
    var a=q11+(q21-q11)*tb, c=q12+(q22-q12)*tb;
    return a+(c-a)*tp;
  }
  var G=[];
  by.forEach(function(b){ px.forEach(function(pv){
    var exact=A[b+'_'+pv];
    var cell={ b:b, pv:pv, exact:!!exact };
    ['kostScenario','besparing','capex','rendement','eurMwh','piek','laadfactor'].forEach(function(f){
      cell[f]= exact? exact[f] : interp(f,b,pv);
    });
    // capex is exact bekend (geen interpolatie nodig): batterijprijs + PV
    var bt=battPrijs(b); cell.capex = bt? (bt.eur + paneelKwp(pv)*P.PV_KOST) : null;
    cell.kva = bt? bt.kva : null;
    G.push(cell);
  }); });
  STATE.grid={ cells:G, by:by, px:px, runs:runs };
  return STATE.grid;
}

// ============================ HEATMAPS ============================
var HM=[ {f:'eurMwh',t:'€ / MWh',fmt:function(v){return '€ '+fmtN(v,0)+' · '+fmtN(v/10,1)+' €c/kWh';},inv:true},
         {f:'piek',t:'Maximale piek (kW)',fmt:function(v){return fmtN(v,0)+' kW';},inv:true},
         {f:'laadfactor',t:'Laadfactor (%)',fmt:function(v){return fmtN(v,1)+' %';},inv:false},
         {f:'rendement',t:'Rendement %',fmt:function(v){return fmtN(v,1)+' %';},inv:false} ];
// Wit → donkergroen (ColorBrewer Greens). Eén tint, enkel helderheid varieert →
// kleurenblind-veilig (geen rood-groen). Wit = ongunstig, donkergroen = gunstig.
var GREENS=[[240,249,237],[186,228,179],[116,196,118],[49,163,84],[0,68,27]];
function ramp(t,inv){
  t=Math.max(0,Math.min(1,t)); if(inv) t=1-t;   // inv → hoog is ongunstig; donkergroen blijft altijd 'gunstig'
  var seg=t*(GREENS.length-1), i=Math.floor(seg), f=seg-i;
  if(i>=GREENS.length-1) return GREENS[GREENS.length-1].slice();
  var a=GREENS[i], b=GREENS[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}
function drawAll(){
  var G=STATE.grid; if(!G) return;
  HM.forEach(function(h){
    var cv=document.getElementById('cv_'+h.f); if(!cv) return;
    var by=G.by, px=G.px; cv.width=px.length; cv.height=by.length;
    var ctx=cv.getContext('2d'); var img=ctx.createImageData(px.length,by.length);
    var vals=G.cells.map(function(c){return c[h.f];}).filter(function(v){return v!=null && isFinite(v);});
    var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals); if(hi===lo)hi=lo+1;
    G.cells.forEach(function(c){
      var xi=px.indexOf(c.pv), yi=by.indexOf(c.b);
      var v=c[h.f]; var col= (v==null||!isFinite(v))?[225,228,232]:ramp((v-lo)/(hi-lo), h.inv);
      var idx=((by.length-1-yi)*px.length+xi)*4;   // y omgekeerd: kleine batterij onderaan
      img.data[idx]=col[0];img.data[idx+1]=col[1];img.data[idx+2]=col[2];img.data[idx+3]=255;
    });
    ctx.putImageData(img,0,0);
    // markeer geselecteerde cel
    if(STATE.sel){ var sx=px.indexOf(STATE.sel.pv), sy=by.indexOf(STATE.sel.b);
      if(sx>=0&&sy>=0){ ctx.strokeStyle='#9E480E'; ctx.lineWidth=0.18; ctx.strokeRect(sx+0.09,(by.length-1-sy)+0.09,0.82,0.82);} }
  });
}
function cellAt(h,ev){ var cv=document.getElementById('cv_'+h.f); var r=cv.getBoundingClientRect(); var G=STATE.grid;
  var xi=Math.floor((ev.clientX-r.left)/r.width*G.px.length); var yiTop=Math.floor((ev.clientY-r.top)/r.height*G.by.length);
  var yi=G.by.length-1-yiTop; xi=Math.max(0,Math.min(G.px.length-1,xi)); yi=Math.max(0,Math.min(G.by.length-1,yi));
  return G.cells.find(function(c){return c.pv===G.px[xi]&&c.b===G.by[yi];});
}
function bindHeatmaps(){
  var tip=document.getElementById('tooltip');
  HM.forEach(function(h){ var cv=document.getElementById('cv_'+h.f);
    cv.onmousemove=function(ev){ var c=cellAt(h,ev); if(!c) return; updateHvals(c); };
    cv.onmouseleave=function(){ updateHvals(STATE.sel?selCell():null); };   // terug naar de gekozen cel
    cv.onclick=function(ev){ var c=cellAt(h,ev); if(c){ simulateCell(c.b,c.pv); } };
  });
}

// klik = exact (laten) berekenen. Anker-cel = al berekend → meteen tonen. Geïnterpoleerde cel = échte
// single-cell dispatch op de server; de info onder de heatmap verschijnt PAS als die berekening binnen is.
function simulateCell(b,pv){
  STATE.sel={b:b,pv:pv};
  var key=b+'_'+pv;
  var have = STATE.serverAnchors[key] && STATE.serverAnchors[key].kost!=null;   // anker of eerder berekend
  if(have){ STATE.selBusy=false; render(); return; }                            // instant is hier terecht
  STATE.selBusy=true; render();                                                 // toon "rekenen…" onder de heatmap
  var badge=document.getElementById('modeBadge'); if(badge){ badge.textContent='cel rekent…'; }
  fetch(API_BASE+'/api/thuisladen-cel',{ method:'POST', headers:tlHeaders(),
      body: JSON.stringify({ in:IN, params:Object.assign({},P,{CREG:cregTarief()}), cel:{b:b,pv:pv} }) })
    .then(function(r){ return r.json().then(function(j){ return {status:r.status,j:j}; }); })
    .then(function(res){
      if(badge){ badge.textContent='server-dispatch'; }
      var cell=(res.j&&res.j.cell)||null;
      STATE.selBusy=false;
      if(res.status!==200 || !cell || cell.kost==null){ STATE.selError=true; console.warn('[thuisladen-cel] geen cijfer', res.j&&res.j.error); render(); return; }
      STATE.selError=false;
      var r0=STATE.serverAnchors['0_0']; var ref=(r0&&r0.kost!=null)?r0.kost:null;
      var besp=(ref!=null)?Math.round((ref-cell.kost)*10)/10:null;
      var rend=(besp!=null&&cell.capex>0)?Math.round(besp/cell.capex*100*100)/100:(besp>0?999:0);
      STATE.serverAnchors[key]={ kost:cell.kost, besparing:besp, rendement:rend, eurMwh:cell.eurMwh,
        capex:cell.capex, kva:cell.kva, ev_mwh:cell.ev_mwh, ref_kost:ref, piek_kw:cell.piek_kw,
        factuur:cell.factuur, energie:cell.energie };
      STATE.gemeten[key]=svModel(b,pv);   // exacte cel → verfijnt de heatmap consistent
      render();
    })
    .catch(function(e){ if(badge){ badge.textContent='server-dispatch'; } STATE.selBusy=false; STATE.selError=true; console.warn('[thuisladen-cel] faalde', e&&e.message); render(); });
}

// ============================ RANDVOORWAARDEN-ZOEK (≤5 iter) ============================
function autoZoek(){
  STATE.iterLog=[];
  var G=STATE.grid; var maxPan=IN.max_pv_pan, maxBud=IN.max_budget, minR=IN.min_rend!=null?IN.min_rend:P.RENDEMENT_MIN;
  function kandidaten(){ return G.cells.filter(function(c){
    if(c.rendement==null||c.capex==null) return false;
    if(c.rendement < minR) return false;
    if(maxBud!=null && c.capex>maxBud) return false;
    if(maxPan!=null && c.pv>maxPan) return false;
    return true; }); }
  var pick=null;
  for(var it=1; it<=5; it++){
    var K=kandidaten(); if(!K.length){ STATE.iterLog.push('Iteratie '+it+': geen cel voldoet aan de randvoorwaarden.'); break; }
    K.sort(function(a,b){return b.capex-a.capex;});          // grootste investering die nog voldoet
    pick=K[0];
    if(pick.exact){ STATE.iterLog.push('Iteratie '+it+': cel '+pick.b+'kWh/'+pick.pv+'p is al exact — bevestigd.'); break; }
    if(STATE.serverMode){ STATE.iterLog.push('Cel '+pick.b+'kWh/'+pick.pv+'p wordt exact op de server gesimuleerd…'); break; }
    // prototype: simuleer exact → verfijn
    var before=pick.rendement; simulateCellQuiet(pick.b,pick.pv); G=STATE.grid;
    var now=STATE.grid.cells.find(function(c){return c.b===pick.b&&c.pv===pick.pv;});
    STATE.iterLog.push('Iteratie '+it+': '+pick.b+'kWh/'+pick.pv+'p gesimuleerd (rend. '+fmtN(before,1)+'% → '+fmtN(now.rendement,1)+'%).');
    var K2=kandidaten(); K2.sort(function(a,b){return b.capex-a.capex;});
    if(K2.length && K2[0].b===pick.b && K2[0].pv===pick.pv && K2[0].exact){ pick=K2[0]; STATE.iterLog.push('→ bevestigd als optimale opstelling.'); break; }
    pick = K2.length? K2[0] : pick;
  }
  if(pick){
    if(STATE.serverMode && !pick.exact){ simulateCell(pick.b,pick.pv); return; }   // gekozen cel echt (laten) berekenen
    STATE.sel={b:pick.b,pv:pick.pv};
  }
  render();
}
function simulateCellQuiet(b,pv){ if(STATE.serverMode) return; var m=model(b,pv); if(m){ STATE.gemeten[b+'_'+pv]=m; buildGrid(); } }

// ============================ RENDER ============================

function renderReport(){
  var el=document.getElementById('report');
  if(STATE.status!=='klaar' || STATE.selBusy || STATE.selError){ el.innerHTML=''; return; }

  // meerjaren met inflatie + netkosten-indexatie

}

// Factuurdetail — referentie (0/0) naast het gekozen scenario.
// Elke factuurlijn heeft een ⓘ waarop je klikt om te zien welke posten eronder vallen.
function _factuurDetailBlok(refF, scnF, refKost){
  if(!scnF) return '';
  // Wat zit onder elke hoofding (Belgische energiefactuur, LS 2026):
  var UITLEG = {
    A_energie:  'De pure energieprijs van de leverancier: afgenomen kWh aan spot/day-ahead + markup + vaste leverkost, minus de opbrengst van geïnjecteerde PV (spot − eventuele markdown). Dit is het deel dat de leverancier bepaalt; de rest is gereguleerd. De GSC/WKK-certificaten staan als aparte lijn hieronder.',
    A_certificaten:'Groenestroom- (GSC) en warmtekracht-certificaten (WKK): een wettelijke opslag die de leverancier op elke afgenomen MWh doorrekent (standaard € 11,00 + € 4,20 /MWh). Ze schalen met de netafname → PV+batterij drukt ze mee omlaag.',
    B_afname:   'Distributienetkosten voor AFNAME (uw netbeheerder, bv. Fluvius): capaciteitstarief op de maandpiek (€/kW), toegangsvermogen, eventuele overschrijdingspenalty, het proportionele kWh-tarief, databeheer en reactief vermogen. Hier grijpt de batterij aan: piek shaven verlaagt het capaciteitstarief.',
    C_injectie: 'Netkosten voor INJECTIE van PV-overschot: proportioneel injectietarief (€/MWh), capaciteitstarief injectie (€/kVA), databeheer en de vaste injectievergoeding.',
    D_transport:'Elia-transportkost (systeembeheer, reserves, marktintegratie, transport-maandpiek). In Vlaanderen en Brussel is dit ALLEMAAL al in de distributiekost (post B) verrekend → hier €0. Enkel in Wallonië staat Elia apart op de factuur en is deze post > 0.',
    E_heffingen:'Overheidsheffingen en toeslagen: openbare-dienstverplichtingen (ODV), federale/regionale toeslagen, soldes regulatoires, de energiebijdrage/accijnzen (staffel per jaarverbruik) en het vaste Energiefonds Vlaanderen. Grotendeels €/MWh, dus daalt mee met het verbruik.',
  };
  // v0.9.3: "Energie (leverancier)" = A_energie − GSC/WKK; de certificaten krijgen een eigen lijn.
  // (Sommeert nog steeds naar het A-subtotaal en dus naar het totaal.)
  function val(F,key){
    if(!F) return null;
    if(key==='A_energie_excl') return (F.A_energie!=null)?(F.A_energie-(F.A_certificaten||0)):null;
    return F[key];
  }
  function rij(lbl, key, uitlegKey, klasse, indent){
    var r=val(refF,key), s=val(scnF,key);

    var pad = indent ? ' style="padding-left:22px;color:#5A6577"' : '';
    return '<tr'+(klasse?(' style="font-weight:700"'):'')+'><td'+pad+'>'+lbl+info+'</td><td>'+(r!=null?fmtE(r):'—')+'</td><td>'+(s!=null?fmtE(s):'—')+'</td></tr>'+
      (UITLEG[ik] ? ('<tr id="fdrow_'+ik+'" style="display:none"><td colspan="3" style="background:#F5F8FC;color:#3A4657;font-size:12px;line-height:1.5;font-weight:400;padding:8px 12px">'+UITLEG[ik]+'</td></tr>') : '');
  }
  return '<h3 style="border:none;margin-top:14px">Factuurdetail — referentie vs scenario</h3>'+
    '<div class="note">Klik op de <b>ⓘ</b> bij een lijn om te zien welke posten eronder vallen.</div>'+
    '<table><thead><tr><th>Component (excl. btw)</th><th>Referentie</th><th>Scenario</th></tr></thead><tbody>'+
     rij('Energie (leverancier)','A_energie_excl','A_energie')+
     rij('waarvan GSC/WKK-certificaten','A_certificaten','A_certificaten',false,true)+
     rij('Netkosten afname','B_afname')+
     rij('Netkosten injectie','C_injectie')+
     rij('Transport (Elia)','D_transport')+
     rij('Heffingen','E_heffingen')+
     rij('Totaal excl. btw','subtotaal',null,true)+
    '</tbody></table>'+

}

// Welke netbeheerder/tariefkaart is verondersteld? Zonder postcode valt de server terug op Fluvius West|LS (Vlaanderen).

// Netto-positie voor de klant (jaar) + expliciete winst op het thuisladen.
// Energiefactuur (gebouw+laden) − werkgever-vergoeding (CREG) − vermeden diesel = netto out-of-pocket.
// De laadwinst = CREG-vergoeding − werkelijke laadkost van de vergoede wagens (indicatief op de site-€/MWh).
function _nettoPositieBlok(m, refKost){
  var factScn=m.kostScenario, factRef=(refKost!=null?refKost:m.kostScenario);
  var evCregMwh=0, creg=0, diesel=0;
  IN.wagens.forEach(function(w){ var mwh=w.km*w.kwhkm/1000;
    if(w.creg){ evCregMwh+=mwh; creg+=mwh*cregTarief(); } else { diesel+=(w.km/100)*P.DIESEL_100KM; } });
  var nettoRef=factRef-creg-diesel, nettoScn=factScn-creg-diesel;
  function nettoCel(v){ return v<0 ? ('<span class="pos">'+fmtE(-v)+' voordeel</span>') : (fmtE(v)+' kost'); }
  var rows=''+

// Canvas pie + legende (kleurenblind-veilig: verschil in tint én helderheid, met directe labels).
function drawPie(canvasId, legId, slices){
  var cv=document.getElementById(canvasId); if(!cv) return;
  var ctx=cv.getContext('2d'); var W=cv.width, H=cv.height, R=Math.min(W,H)/2-2, cx=W/2, cy=H/2;
  ctx.clearRect(0,0,W,H);
  var tot=slices.reduce(function(s,x){return s+Math.max(0,x.value);},0);
  if(tot<=0){ ctx.fillStyle='#E1E4E8'; ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.fill(); return; }
  var a0=-Math.PI/2;
  slices.forEach(function(x){ var frac=Math.max(0,x.value)/tot; var a1=a0+frac*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath();
    ctx.fillStyle=x.color; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); a0=a1; });
  var leg=document.getElementById(legId);
  if(leg){ leg.innerHTML=slices.map(function(x){ var pct=tot>0?Math.round(x.value/tot*100):0;
    return '<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span style="width:11px;height:11px;border-radius:2px;background:'+x.color+';display:inline-block;flex:none"></span>'+
      '<span>'+x.label+' — '+fmtN(x.value,2)+' MWh ('+pct+' %)</span></div>'; }).join(''); }
}

// ============================ FACTUUR INLEZEN (/api/factuur-extract) ============================
// Zelfde weg als de simulator: PDF('s) → base64 → /api/factuur-extract → baseCase.
// We mappen enkel de velden die de Thuisladen-tegel nodig heeft en jaarrekenen op
// de factuurperiode (residentieel jaarmodel). De rest kan de klant manueel bijstellen.
function _tlFileB64(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ var s=String(r.result||''); var i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
    r.onerror=function(){ rej(new Error('Kon bestand niet lezen')); };
    r.readAsDataURL(file);
  });
}
function _tlDagen(a,b){ try{ var d=(new Date(b)-new Date(a))/86400000; return (isFinite(d)&&d>0)?d:0; }catch(e){ return 0; } }
function _tlZetMsg(txt){ STATE.factuurMsg=txt; var el=document.getElementById('tlFactuurMsg'); if(el) el.innerHTML=txt; }
window.tlFactuurUpload=function(input){
  if(!input || !input.files || !input.files.length) return;
  var files=[]; for(var i=0;i<input.files.length;i++) files.push(input.files[i]);
  input.value='';   // zelfde bestand opnieuw kiezen toestaan
  _tlZetMsg('⏳ Factuur wordt gelezen… (Anthropic API, ~15-25s)');
  Promise.all(files.map(_tlFileB64)).then(function(b64s){
    return fetch(API_BASE+'/api/factuur-extract', { method:'POST', headers:tlHeaders(),
      body: JSON.stringify({ files: b64s.map(function(b,ix){ return { base64:b, mediaType:'application/pdf', fileName:files[ix].name }; }) }) });
  }).then(function(r){ return r.json().then(function(j){ return { status:r.status, j:j }; }); })
    .then(function(res){
      var r=res.j;
      if(res.status!==200 || !r || !r.ok || !r.baseCase){ _tlZetMsg('⚠️ Kon de factuur niet lezen'+((r&&r.error)?(': '+r.error):'')+'. Vul manueel in.'); return; }
      var bc=r.baseCase;
      // Jaarrekenen op de factuurperiode (voor een jaarafrekening ≈ ×1).
      var dagen=_tlDagen(bc.periodeVan, bc.periodeTot); var jf=(dagen>0)?(365/dagen):1;
      var afnKwh=+bc.afnameKwh||0;
      if(afnKwh>0) IN.jaarverbruik_mwh = Math.round(afnKwh/1000*jf*100)/100;
      var tot=+bc.totaalExclBtw||0;
      if(tot>0) IN.referentiekost = Math.round(tot*jf);
      var kva=+bc.aansluitVermogenKva||0;
      if(kva>0) IN.piek_kw = Math.round(kva*10)/10;
      var pv=+bc.pvKwpAanwezig||0;
      if(pv>0) IN.bestaand_pv_kwp = Math.round(pv*10)/10;
      // Regio (voor het CREG-tarief) uit de postcode van het leveringsadres.
      var pc=(String(bc.leveringsadres||bc.postcode||'').match(/\b(\d{4})\b/)||[])[1];
      var reg=regioVanPostcode(pc); if(reg) IN.regio=reg;
      // Fasen: enkel LS is relevant; laat de klant 2/3 fasen zelf kiezen (staat niet betrouwbaar op de factuur).
      try{ if(window.FluctusAppAuth) window.FluctusAppAuth.logActivity('thuisladen','factuur_geparseerd',{ klant_naam:bc.klantNaam||null, klant_btw:bc.klantBtw||null }); }catch(e){}
      if(bc.klantNaam){ IN._klant=bc.klantNaam; if(!IN._project) IN._project=bc.klantNaam; }   // v0.9.7: klantnaam → projectnaam (FLX)
      var naam=bc.klantNaam?(' — '+bc.klantNaam):'';
      _tlZetMsg('✅ Factuur ingelezen'+naam+'. Verbruik '+fmtN(IN.jaarverbruik_mwh,2)+' MWh/jaar'+(tot>0?(', referentie '+fmtE(IN.referentiekost)):'')+(reg?(', regio '+REGIO_NAAM[reg]+' → CREG '+fmtE(cregTarief())+'/MWh'):'')+(dagen>0&&Math.abs(jf-1)>0.05?(' (naar jaar herrekend uit '+Math.round(dagen)+' dagen)'):'')+'. Controleer + vul fasen/wagens aan, klik dan “Bereken heatmaps”.');
      STATE.status='idle'; STATE.serverMode=false; render(); renderSide();
    })
    .catch(function(e){ _tlZetMsg('⚠️ Factuur lezen mislukt: '+(e&&e.message||'netwerkfout')+'. Vul manueel in.'); });
};

// Zelfde kamino-record als de simulator (POST /api/kamino/project, scenario 'thuisladen').
function _projectIdLokaal(project){
  var s=String(project||'').trim().toLowerCase();
  var h=0x811c9dc5>>>0;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  var code=h.toString(36).toUpperCase();
  while(code.length<7) code='0'+code;
  code=code.slice(-7);
  return 'FLX-'+code.slice(0,3)+'-'+code.slice(3);
}
function _tlApiPost(path, body){ return fetch(API_BASE+path,{method:'POST',headers:tlHeaders(),body:JSON.stringify(body||{})}).then(function(r){ return r.json(); }); }
function _tlApiGet(path){ return fetch(API_BASE+path,{headers:tlHeaders()}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
var _TL_INPUT_VELDEN=['_project','_klant','profiel','jaarverbruik_mwh','piek_kw','fasen','regio','bestaand_pv_kwp','bestaand_inj_mwh','referentiekost','wagens','max_pv_pan','max_budget','min_rend'];

    _tlApiPost('/api/kamino/project',{ id:_projectIdLokaal(naam), naam:naam, scenario:'thuisladen', klant:{ naam:IN._klant||naam }, input:_tlStateNaarInput() })
      .then(function(){ _tlKaminoCache=null; }).catch(function(){});

}
var _tlKaminoCache=null;
function _tlKortDatum(iso){ try{ var d=new Date(iso); if(isNaN(d.getTime())) return ''; var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'-'+p(d.getMonth()+1); }catch(e){ return ''; } }
function _tlVulDropdown(){
  var sel=document.getElementById('tlKaminoSel'); if(!sel) return;
  function vul(lijst){ var s=document.getElementById('tlKaminoSel'); if(!s) return; s.innerHTML='<option value="">– kies project –</option>';
    (lijst||[]).filter(function(p){ return p.scenarioKey==='thuisladen'; }).forEach(function(p){ var dt=p.bijgewerkt?(' · '+_tlKortDatum(p.bijgewerkt)):''; var o=document.createElement('option'); o.value=p.id; o.textContent=(p.naam||p.id)+dt+' — '+p.id; s.appendChild(o); }); }
  if(_tlKaminoCache!==null){ vul(_tlKaminoCache); return; }
  _tlApiGet('/api/kamino/projecten').then(function(r){ _tlKaminoCache=(r&&r.projecten)||[]; vul(_tlKaminoCache); }).catch(function(){});
}
window.setProj=function(v){ IN._project=v; if(!IN._klant) IN._klant=v; renderSide(); };
window._tlSelOpen=function(v){ if(v){ var i=document.getElementById('tlProjCode'); if(i) i.value=v; window._tlProjectOpen(v); } };
window._tlProjectOpen=function(id){
  id=String(id||'').trim().toUpperCase();
  var m=document.getElementById('tlProjMsg'); var zet=function(k,t){ if(m){m.style.color=k;m.textContent=t;} };
  if(!/^FLX-[A-Z0-9]{3}-[A-Z0-9]{3,4}$/.test(id)){ zet('#B23','Vul een geldig project-ID in (FLX-…).'); return; }
  zet('#5A6577','Project ophalen…');
  _tlApiGet('/api/kamino/project-get?id='+encodeURIComponent(id)+'&scenario=thuisladen').then(function(r){
    var rec=(r&&r.project)||{};
    if(!rec.input){ zet('#B23','Dit project heeft geen thuisladen-invoer om te laden.'); return; }
    _tlInputNaarState(rec.input);
    STATE.gemeten={}; STATE.sel=null; STATE.serverMode=false; if(STATE.status==='klaar') STATE.status='idle';
    renderSide(); render();
    zet('#0A6B2E','Project '+id+' geladen.');
  }).catch(function(e){ var msg=(e&&e.message)||String(e); zet('#B23', /403/.test(msg)?'Geen toegang tot dit project.':('Kon niet openen: '+msg)); });
};
function cregDiesel(){
  var creg=0, diesel=0;
  IN.wagens.forEach(function(w){ var mwh=w.km*w.kwhkm/1000; if(w.creg) creg += mwh*cregTarief(); else diesel += (w.km/100)*P.DIESEL_100KM; });
  return { creg:creg, diesel:diesel };
}
// Referentiekost (gebouw + laden, geen PV/batterij) — server: de 0/0-cel; lokaal: het 0/0-model.
function refKostWaarde(){
  if(STATE.serverMode){ var r=STATE.serverAnchors['0_0']; return (r&&r.kost!=null)?r.kost:null; }
  var m0=model(0,0,true); return m0?m0.kostScenario:null;
}
// Server-anker → model-vormig object (server-cijfers + lokaal berekende CREG/diesel voor het rapport).
function svModel(b, pv){
  var a = STATE.serverAnchors[b+'_'+pv]; if(!a || a.kost==null) return null;
  var bt = battPrijs(b); var cd = cregDiesel();
  var r0 = STATE.serverAnchors['0_0'];
  return { battKwh:b, kva:(a.kva!=null?a.kva:(bt?bt.kva:null)), pvPan:pv, kwp:IN.bestaand_pv_kwp+paneelKwp(pv),
    capex:(a.capex!=null?a.capex:(bt?(bt.eur+paneelKwp(pv)*P.PV_KOST):null)),
    kostScenario:a.kost, besparing:a.besparing, rendement:a.rendement, eurMwh:a.eurMwh,
    refKost:(a.ref_kost!=null?a.ref_kost:(r0&&r0.kost!=null?r0.kost:null)),
    piek:(a.piek_kw!=null?a.piek_kw:null), laadfactor:(a.piek_kw>0?laadfactorVan(a.piek_kw):null),
    factuur:a.factuur||null, energie:a.energie||null,
    refFactuur:(r0&&r0.factuur)||null, refEnergie:(r0&&r0.energie)||null,
    netAfname:null, injectie:null, zelfverbruik:null, piekEff:null,
    creg:cd.creg, diesel:cd.diesel, _server:true };
}
// POST /api/thuisladen → 30 ankers. De heatmaps verschijnen ENKEL bij succes (server-dispatch).
// Geen browser-benadering meer als resultaat: bij fout → foutscherm, geen (misleidende) prototype-cijfers.
function fetchServerGrid(){
  var badge = document.getElementById('modeBadge');
  STATE.status='rekenen'; STATE.sel=null; STATE.selBusy=false; STATE.selError=false; STATE.iterLog=[];
  if(badge){ badge.textContent='server rekent…'; badge.style.background='#FFF3E0'; badge.style.color='#9E480E'; badge.style.borderColor='#9E480E55'; }
  render(); renderSide();
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var to = setTimeout(function(){ try{ if(ctrl) ctrl.abort(); }catch(e){} }, 180000);
  return fetch(API_BASE+'/api/thuisladen', { method:'POST', headers:tlHeaders(),
      body: JSON.stringify({ in: IN, params: Object.assign({}, P, { CREG: cregTarief() }) }), signal: ctrl?ctrl.signal:undefined })
    .then(function(r){ clearTimeout(to); return r.json().then(function(j){ return { status:r.status, j:j }; }); })
    .then(function(res){
      if(res.status!==200 || !res.j || !Array.isArray(res.j.anchors)) throw new Error((res.j&&res.j.error)||('HTTP '+res.status));
      var map={};
      res.j.anchors.forEach(function(a){
        if(a.battKwh==null||a.pvPan==null) return;
        map[a.battKwh+'_'+a.pvPan] = { kost:a.kost, besparing:a.besparing, rendement:a.rendement,
          eurMwh:a.eurMwh, capex:a.capex, kva:a.kva, ev_mwh:a.ev_mwh, ref_kost:a.ref_kost,
          piek_kw:a.piek_kw, factuur:a.factuur, energie:a.energie };
      });
      STATE.serverAnchors = map; STATE.serverMode = true; STATE.gemeten = {}; STATE.status='klaar';
      STATE.netbeheer = res.j.netbeheer || null;   // {grd,spanning,regio,default} — welke tariefkaart draaide er
      if(badge){ badge.textContent='server-dispatch'; badge.style.background='#05B05022'; badge.style.color='#048443'; badge.style.borderColor='#05B05066'; }
      try{ if(window.FluctusAppAuth) window.FluctusAppAuth.logActivity('thuisladen','grid_gedraaid',{ runs:res.j.runs, ev_mwh:res.j.ev_mwh }); }catch(e){}
      render(); renderSide();
    })
    .catch(function(err){
      clearTimeout(to);
      STATE.serverMode = false; STATE.status='fout';
      STATE.foutTekst = (err && err.name==='AbortError') ? 'De berekening duurde te lang (time-out). Probeer opnieuw.' : ('Serverfout: '+((err&&err.message)||'onbekend')+'. Klik opnieuw op “Bereken heatmaps”.');
      if(badge){ badge.textContent='berekening mislukt'; badge.style.background='#F9E0DE'; badge.style.color='#C0392B'; badge.style.borderColor='#C0392B55'; }
      console.warn('[thuisladen] fout:', err && err.message);
      render(); renderSide();
    });
}

// ============================ INIT + APP-TOEGANG ============================
// De app draait pas na een geslaagde toegangscontrole (FluctusAppAuth.requireAccess).
// Managers krijgen impliciet toegang tot elke app; verkopers moeten de app 'thuisladen'
// toegekend krijgen. In een embed (Kamino-iframe) zit de login al vóór → gate overslaan.
// NAAMGEVING: bewust FluctusAppAuth, NIET FluctusAuth (Academy-login) — nooit verwarren.
(function _boot(){
  var root = document.getElementById('tl-root');
  var _embed = false; try{ _embed = (window.self !== window.top); }catch(e){ _embed = true; }
  var toegangsCheck = _embed
    ? Promise.resolve(true)
    : ((window.FluctusAppAuth && typeof window.FluctusAppAuth.requireAccess === 'function')
        ? window.FluctusAppAuth.requireAccess('thuisladen', root)
        : Promise.resolve(true));   // fail-open bij ontbrekend snippet (app niet blokkeren)
  toegangsCheck.then(function(toegang){
    if(!toegang) return;   // requireAccess heeft #tl-root al met een melding vervangen
    // Rol uit de toegangscontrole: manager ziet de parametermodal.
    try{ var u = window.FluctusAppAuth && window.FluctusAppAuth.user;
      STATE.rol = (u && u.role === 'manager') ? 'manager' : 'seller'; }catch(e){}
    STATE.status='idle';                 // niet rekenen bij openen; pas bij "Bereken heatmaps"
    render(); renderSide(); renderMgrBtn();
  });
})();
