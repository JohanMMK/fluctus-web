<!DOCTYPE html>
<!-- ============================================================
     FLUCTUS ONTWERP-RAPPORT  v2.9.6  (dual-mode: klant + management)
     v2.9.6 (BATTERIJ = CORE, PV = OPTIE, Johan 03-08): de "optimale opstelling"-pagina stelt nu de BATTERIJ als kern
             voor (KPI 2 = batterij-only rendement); de PV-pagina is herdoopt tot "Zonnepanelen — een optie op uw
             batterij" en toont de PV-optie (kWp op x% marginale zelfconsumptie) met A (batterij-core) / B (PV-eigen) /
             C (batterij + PV). De groeistap-pagina houdt de PV-optie op de eerste stap. Data uit simulator v1.63.41
             (STATE.pvOptie, marginaal uit de sweep — geen PV meer in het core-optimum).
     v2.9.5 (GROEIPAD BATTERIJ-ONLY, Johan 01-08): de groeistappen zijn nu batterij-only (data uit de simulator).
             Op de eerste-groeistap-pagina staat een PV-optie-blok (A = instap-batterij, B = PV-eigen rendement,
             C = instap + PV) uit INV.groeistap.pv_optie. Het groeipad-hoofdstuk kreeg een "batterij-only + PV eenmalig
             op de eerste stap"-noot. De optimale-opstelling-A/B/C (v2.9.4) blijft als einddoel-optie staan.
     v2.9.4 (BATTERIJ-EERST, Johan 01-08): op de Extra-PV-pagina staat nu een drie-rendementen-blok wanneer de
             simulator de batterij-eerst-cases levert (INV.batterij_case + INV.pv_optie): A = batterij alleen,
             B = PV-optie (eigen rendement = Δbesparing/Δcapex), C = batterij + PV gecombineerd. De batterij is de
             hoofd-case; de extra PV is een aparte, vrijwillige optie eróp met haar eigen én gecombineerde rendement.
     v2.9.3 (4c, Johan 01-08): verkoop-signaal op de 1-batterij-instap (groeistap-kaart). Rendement ≥ 10 % → groene
             "verkoopbaar"-melding; < 10 % → oranje "valt onder de studiegarantie" (risk-reversal 10 %-belofte).
     v2.9.2 (Optie B — twee-bakjes-rendement, Johan 01-08): KPI 2 (rendement) staat nu op het PV+batterij-bakje op ELKE
             pagina: p.5-kaart, groeistap-kaart (p.7) én groeipad (p.7+) rekenen besparing (gebouw+CREG) ÷ capex
             (PV+batterij+verzwaring+cabine, zónder laadpalen). De START-kaart toont nu de échte instap-stap (bv. 98 kVA)
             met correcte "geen verzwaring nodig / incl. verzwaring (cabine)"-melding, en telt de laadpalen niet meer in
             het bakje-1-rendement (die staan als bakje 2 op p.1). berekenCapex telt nu verzwaring + LS→MS-cabine mee →
             de cabine "verdwijnt" niet meer uit de volledige investering; capex-uitsplitsing toont ze apart.
     v2.9.1 (consistentie, 31-07): CAPEX + besparing = TOTAAL overal (investering p.8 incl. laadinfra, groeistap p.9 toont
             laadpalen + prijs). Twee-bakjes-TVT: rendReal/headline = combined (totaal); p.1-box toont pvbatt-TVT (_tvtEsc)
             + laadpaal-TVT apart. p.4-balk toont nu vier balken: Vandaag / +vloot @ CREG / +vloot op diesel / Voorstel
             (diesel→CREG = laadpalen, CREG→voorstel = PV+batterij).
     v2.9.0 (twee-bakjes, Johan 31-07): de headline-besparing is nu de DIESEL-referentie (16/07-model): totaal =
             PV+batterij (gebouw + slim laden vs. CREG) + laadpalen (vermeden brandstof: diesel − CREG). p.1 toont de
             twee terugverdienpaden apart; de referentiebalk p.4 werd "Vloot op diesel". De financiering (p.8/11-13)
             blijft op het PV+batterij-bakje (energie-escalatie); laadpalen apart met eigen capex + TVT. Data uit
             FIN.diesel_kost_jaar / totaal_besparing_jaar1 / laadpaal_* (simulator v1.63.23+). Geen laadplein → D=0 →
             identiek aan v2.8.0.
     v2.8.0 (Johan-keuze A, 31-07): ENGINE = ENIGE BRON. De besparing komt nu al correct (incl. CREG én batterij) uit
             de simulator-engine (eng.beste.besparing). Het rapport telt CREG NIET meer bij (dat deed v2.7.0 als
             noodpleister) — enkel nog presentatie: het reconstrueert de ontwerpfactuur voor de "Vloot @ CREG"-balk op
             p.4. MOET SAMEN met simulator.html v1.63.18+ live (die de besparing incl. CREG levert), anders telt het
             rapport te weinig CREG. Zonder laadplein: km_CREG = 0 → identiek aan battery-only (geen regressie).
     v2.7.0 (Johan 31-07): MOBILITEIT-BASELINE FIX. Bij een laadplein-case hoorde de nieuwe laadvraag gratis in de
             besparing (besparing = bestaand − ontwerp), waardoor de besparing negatief werd zodra er een vloot bijkwam
             (Kiemkracht: −€22.087, TVT "—", negatieve DSCR, rendement −49,6% naast KPI2 +21,3%). Correct: de vloot hoort
             in de REFERENTIE. besparing = (bestaande factuur + geladen km @ CREG-forfait) − ontwerpfactuur. km_CREG_kost =
             laadplein.km_jaar × creg_per_km; één reassign van FIN.besparing_jaar1 corrigeert de hele keten (headline, %,
             €/MWh, financiering, TVT, DSCR, groeistap-tabel, flowstrip). p.4 toont nu de referentiebalk "Vloot @ CREG".
             Zonder laadplein is km_CREG_kost = 0 → identiek aan v2.6.0 (geen regressie op tegel 3 / battery-only).
             Extra guards: loadfactor toont "—" i.p.v. "NaN"; batterij-narratief ("snijdt de piek") alleen als er
             effectief een batterij ≠ 0/0 én een vermeden verzwaring is. Kiemkracht → +€45.913/jaar (−42,7% vs referentie).
     v2.5.0: "Onze belofte"-pagina (risk-reversal) na de ontwerpstrategie — 10%-rendementsgarantie met
             terugbetaling, uitvoeringsbegeleiding samen met de installateur, en terugbetaling door de installateur bij
             de eerste bestelling. Filosofie die de betaalde studie risicoloos maakt en de CTA versterkt.
     v2.4.0: project-identificatienummer (INV.project_id) op de titel + in de voettekst van ELKE pagina.
             "PDF opslaan"-knop (jsPDF + html2canvas): lokale download + upload naar de Supabase-bucket
             (/api/rapport-opslaan → rapporten/<project-id>/). + "Print"-knop.
     v2.3.0: productie-pies tonen "via batterij" apart van injectie zodra er een batterij is.
     v2.3.0: productie-pies tonen "via batterij (lokaal geconsumeerd)" APART van injectie zodra er een
             batterij is (extra PV in hst 6 + start-PV in de groeistap). Zonder batterij → 2 segmenten.
     v2.2.0: PV-zin in de groeistap weg + verticaal groeipad-hoofdstuk (optimum + stappen erná).
     v2.2.0: (1) uitlegzin over de PV-post in de groeistap verwijderd (logica blijft). (2) Nieuw hoofdstuk
             "Volledig groeipad": verticaal proces (boven→beneden) met per stap wat erbij komt, extra capex en
             de 3 KPI's; optimale opstelling gemarkeerd; stappen voorbij het optimum getoond (dalend rendement).
     v2.1.0: (1) productie-pie ("waar gaat de productie naartoe") bij bestaande PV, extra PV én de groeistap
             (indien PV aanwezig/bijkomt); (2) groeistap toont nu rendement + terugverdientijd + de
             investeringsuitsplitsing (batterij/PV/laadpalen); (3) pagina 1 = process flow factuur→groeistap,
             uitgelegd op een aparte strategiepagina met kerncijfers; headline-KPI's gelabeld als "volledige
             opstelling (einddoel)" i.p.v. verwarrend met de groeistap.
     v2.0.0: eerste dual-mode versie (klant + management + data-eiland).
     Eén generator, twee modi:
       • mode 'klant'      → helder narratief voor prospect/klant (geen jargon), met grafieken + heatmaps.
       • mode 'management' → hetzelfde + na ELK hoofdstuk een verificatiepaneel met alle onderliggende
                             cijfers/formules/aannames + een volledig JSON data-eiland (chatbot-klaar).
     Narratief: factuur → verbruiksprofiel → laadplein → bestaande PV (SolarActive) → optimale opstelling
                → extra PV → eerste groeistap → financieel (besparing/jaar + 5 financieringsmodellen).
     Voeding: window.FLUCTUS_ONTWERP_RAPPORT (generator) OF sessionStorage 'FLUCTUS_ONTWERP_RAPPORT'
              OF het ingebouwde VOORBEELD (zodat dit bestand standalone rendert). ?mode=management forceert
              de managementmodus; anders volgt hij data._mode (default 'klant').
     ============================================================ -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluctus — Ontwerp-rapport</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blauw:#1F3864; --blauw-l:#2d4f8e; --groen:#05B050; --groen-d:#048443;
    --oranje:#9E480E; --oranje-l:#E8A33D; --grijs:#5A6577; --lijn:#D5DBE3; --bg:#F5F7FA; --zwart:#1A1F2B;
    --rood:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--zwart);background:#e9edf2;font-size:14px;line-height:1.55}
  .a4{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:16mm 18mm 12mm;box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;position:relative}
  .a4 > .a4-content{flex:1}
  .a4-foot{margin-top:auto;padding-top:8px;font-size:9px;color:var(--grijs);border-top:1px solid var(--lijn);display:flex;justify-content:space-between}
  .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grijs);font-weight:700}
  h1{font-size:34px;color:var(--blauw);line-height:1.1;margin:6px 0 10px;font-weight:800}
  h2{font-size:22px;color:var(--blauw);margin:0 0 4px;font-weight:800}
  h3{font-size:15px;color:var(--blauw);margin:16px 0 6px;font-weight:700}
  .lead{font-size:15px;color:var(--grijs);margin-bottom:14px}
  p{margin:8px 0}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .kpi-row.k3{grid-template-columns:repeat(3,1fr)}
  .kpi-row.k2{grid-template-columns:repeat(2,1fr)}
  .kpi{border:1px solid var(--lijn);border-left:4px solid var(--blauw);border-radius:4px;padding:12px}
  .kpi.groen{border-left-color:var(--groen)}
  .kpi.oranje{border-left-color:var(--oranje)}
  .kpi .l{font-size:10px;color:var(--grijs);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:24px;font-weight:800;color:var(--zwart);margin-top:3px}
  .kpi .s{font-size:10px;color:var(--grijs);margin-top:2px}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
  th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--lijn)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--blauw);color:#fff;font-weight:700;border-bottom:none}
  tbody tr:nth-child(even){background:var(--bg)}
  tfoot td{font-weight:800;border-top:2px solid var(--blauw);background:#eef2f8}
  .pos{color:var(--groen-d);font-weight:700}
  .neg{color:var(--rood);font-weight:700}
  .box{border:1px solid var(--lijn);border-radius:6px;padding:14px;margin:12px 0;background:var(--bg)}
  .box.blauw{background:#1F386408;border-color:#1F386430}
  .box.groen{background:#05B0500f;border-color:#05B05040}
  .box.oranje{background:#FFF3E0;border-color:#9E480E55}
  .note{font-size:11px;color:var(--grijs);font-style:italic}
  .quote{font-size:20px;font-style:italic;color:var(--blauw);border-left:4px solid var(--groen);padding:10px 18px;margin:20px 0;line-height:1.4}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .chart-wrap{position:relative;height:190px;margin:8px 0}
  .chart-wrap.sm{height:150px}
  .hm-canvas{width:100%;height:150px;border:1px solid var(--lijn);border-radius:3px;image-rendering:pixelated;background:#F0F2F6}
  .hm-legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:10px;color:var(--grijs);margin-top:6px}
  ul.toc{list-style:none}
  ul.toc li{padding:6px 0;border-bottom:1px dotted var(--lijn);display:flex;justify-content:space-between;font-size:14px}
  ul.toc li .n{color:var(--blauw);font-weight:700;width:28px}
  ul.toc li .t{flex:1}
  /* management-detailpaneel */
  .mgmt{border:1px dashed #9E480E88;background:#FFFBF3;border-radius:6px;padding:12px 14px;margin:12px 0;font-size:11.5px;color:#3A424C}
  .mgmt h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--oranje);margin:0 0 6px;font-weight:800}
  .mgmt table{font-size:10.5px;margin:6px 0}
  .mgmt .frm{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--lijn);border-radius:4px;padding:6px 8px;margin:4px 0;font-size:10.5px;white-space:pre-wrap}
  .mgmt-banner{background:linear-gradient(90deg,#9E480E,#E8A33D);color:#fff;font-weight:800;font-size:12px;padding:7px 12px;border-radius:5px;margin-bottom:12px;letter-spacing:.04em}
  .badge{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:10px;background:#1F386414;color:var(--blauw);margin-left:6px}
  .stap-band{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .stap-band .nr{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--blauw);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
  /* process flow (factuur → groeistap) */
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;margin:14px 0}
  .flow .node{flex:1 1 0;min-width:0;background:var(--bg);border:1px solid var(--lijn);border-radius:6px;padding:7px 3px;text-align:center}
  .flow .node .ic{font-size:16px;line-height:1}
  .flow .node .t{font-size:9px;font-weight:800;color:var(--blauw);margin-top:3px;line-height:1.12}
  .flow .node .n{font-size:8px;color:var(--grijs);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow .arr{display:flex;align-items:center;color:var(--oranje-l);font-weight:800;padding:0 1px;font-size:12px}
  .flow .node.eind{background:#05B0500f;border-color:#05B05055}
  .flow .node.start{background:#FFF3E0;border-color:#9E480E88}
  .strat{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted var(--lijn)}
  .strat .si{flex:0 0 34px;height:34px;border-radius:8px;background:#1F386412;display:flex;align-items:center;justify-content:center;font-size:17px}
  .strat .sk{flex:0 0 130px;text-align:right;font-weight:800;color:var(--blauw)}
  .strat .sk .kl{display:block;font-size:9px;color:var(--grijs);text-transform:uppercase;font-weight:700}
  table.mini{font-size:12px;margin:4px 0}
  table.mini td{padding:3px 6px}
  /* groeipad — verticaal proces (boven → beneden) */
  .gp{margin:10px 0}
  .gp-step{display:flex;gap:12px;align-items:stretch}
  .gp-rail{flex:0 0 26px;display:flex;flex-direction:column;align-items:center}
  .gp-rail .dot{width:24px;height:24px;border-radius:50%;background:var(--blauw);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .gp-rail .line{flex:1;width:2px;background:var(--lijn);min-height:8px}
  .gp-card{flex:1;border:1px solid var(--lijn);border-radius:6px;padding:8px 12px;margin-bottom:10px;background:#fff}
  .gp-card.opt{border:2px solid var(--groen);background:#05B0500a}
  .gp-card.voorbij{border-color:var(--oranje-l);background:#FFFBF3}
  .gp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gp-titel{font-weight:800;color:var(--blauw);font-size:13px}
  .gp-wat{font-size:11px;color:var(--grijs);margin:2px 0 6px;line-height:1.4}
  .gp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .gp-kpis .k{background:var(--bg);border-radius:4px;padding:5px 7px;text-align:center}
  .gp-kpis .k.dim{opacity:.62}
  .gp-kpis .k .kl{font-size:8px;color:var(--grijs);text-transform:uppercase;letter-spacing:.03em}
  .gp-kpis .k .kv{font-size:13px;font-weight:800;color:var(--zwart)}
  #fdpdf-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px}
  #fdpdf-bar button{font-family:inherit;font-size:12px;font-weight:700;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  #fdpdf-save{background:var(--groen);color:#fff}
  #fdpdf-print{background:#fff;color:var(--blauw);border:1px solid var(--lijn)!important}
  @media print{ body{background:#fff} .a4{box-shadow:none;margin:0;width:auto;min-height:auto} .mgmt{break-inside:avoid} .flow{overflow:visible} #fdpdf-bar{display:none} }
</style>
</head>

<script>

                 netto_curtail:-56, netto_beide:341, payback_curtail:null, payback_beide:10.3,
                 investering:3500, beheer_jaar:132 },
  // 5 · OPTIMALE OPSTELLING (het voorstel)
  optimaal:{ pv_kwp:192, batterij_kw:240, batterij_kwh:520, aansluiting_kw:135, aansluiting_vandaag_kw:71,
             spanning_nieuw:'MS', laadpalen:{ac:20,dc160:1,dc400:0}, npv:117419,
             kpi1_eur_per_km:0.041, kpi1_creg_per_km:0.050, kpi2_rendement:14.2, kpi3_loadfactor_voor:0.28, kpi3_loadfactor_na:0.52 },
  // 6 · EXTRA PV (nieuw geïnstalleerd, bovenop bestaand) — productie apart uitgesplitst

    var t=Math.max(0,Math.min(1,(v-lo)/((hi-lo)||1))), r,g,b;

    else if(t<0.5){ var k=t/0.5; r=Math.round(43+k*212); g=Math.round(158+k*47); b=Math.round(74-k*34); }
    else { var k2=(t-0.5)/0.5; r=Math.round(255-k2*43); g=Math.round(205-k2*163); b=Math.round(40-k2*4); }
    return [r,g,b]; }
  for(var d=0;d<W;d++){ for(var q=0;q<H;q++){ var v=dataFn(d,q); var c=kleur(v);
    var idx=(q*W+d)*4; img.data[idx]=c[0]; img.data[idx+1]=c[1]; img.data[idx+2]=c[2]; img.data[idx+3]=255; } }
  ctx.putImageData(img,0,0);
  var lg=document.getElementById(canvas.id+'-lg');
  if(lg){ var grad=(palet==='blauw')?'linear-gradient(to right,rgb(234,241,250),rgb(20,60,140))':'linear-gradient(to right,rgb(43,158,74),rgb(255,205,40),rgb(212,42,36))';
    lg.innerHTML='<span>'+Math.round(lo)+' '+eenheid+'</span><span style="display:inline-block;width:150px;height:9px;border-radius:3px;background:'+grad+'"></span><span>'+Math.round(hi)+' '+eenheid+'</span>'; }
}
// synthetische dagcurve (zonvorm / lastvorm) voor de voorbeeld-heatmaps als er geen echte arrays zijn
function synthZon(d,q){ var h=q/4; var seiz=0.55+0.45*Math.cos((d-172)/365*2*Math.PI); var dag=Math.max(0,Math.sin((h-6)/12*Math.PI)); return seiz*dag; }
function synthLast(d,q){ var h=q/4; var wk=((d%7)<5)?1:0.45; var basis=0.25+ (h>=6&&h<=20?0.75*Math.sin((h-6)/14*Math.PI):0); return wk*basis; }

  _heatmaps.push({id:id, fn:fn, lo:lo, hi:hi, palet:palet, eenheid:eenheid});
  return html;
}

        '</div></div>';

    (heeftVoorbij?'<div class="box oranje"><b>Waarom stoppen bij het optimum?</b> Voorbij de optimale opstelling blijft u investeren, maar de markt biedt niet genoeg extra waarde: het rendement (KPI 2) daalt terwijl de capex verder stijgt. De optimale opstelling is precies het punt met de beste verhouding tussen investering en meerwaarde.</div>':'')+
    mgmt('groeipad — alle stappen',
      '<table><thead><tr><th>Stap</th><th>Extra capex</th><th>Cumulatief</th><th>KPI1 €/km</th><th>KPI2 rend.</th><th>KPI3 lf</th></tr></thead><tbody>'+
      GP.map(function(s){ return '<tr><td>'+esc(s.label)+(s.is_optimaal?' ★':'')+'</td><td>'+eur(s.extra_capex)+'</td><td>'+eur(s.cum_capex)+'</td><td>'+eur2(s.kpi1_eur_km)+'</td><td>'+pct(s.kpi2_rendement)+'</td><td>'+lf(s.kpi3_loadfactor)+'</td></tr>'; }).join('')+
      '</tbody></table>')
  );
}

// ---- PAGINA 9 — FINANCIEEL: BESPARING OVER DE HORIZON ----
var scReeks=['conservatief','realistisch','optimistisch'].map(function(k){ var sc=AAN.scenarios[k]; var rij=[]; var cum=0;
  for(var y=0;y<AAN.horizon;y++){ var netto=besparingJaar(sc,y)-opexJaar(sc,y,OH1,VERZ); if(y===9) netto-=(INV.ontwerp.pv_kwp||0)*AAN.omvormer_vervang_kwp; cum+=netto; rij.push(Math.round(cum-CAPEX.totaal)); }
  return {key:k, naam:sc.naam, cum:rij}; });
pagina(
  '<div class="stap-band"><div class="nr">8</div><div><h2>Het financieringsplan</h2><div class="note">Zwart op wit: hoe uw besparing evolueert, en hoe u het financiert.</div></div></div>'+
  '<p>Hieronder ziet u hoe uw <b>cumulatieve netto besparing</b> evolueert over '+AAN.horizon+' jaar, onder drie kostenscenario\'s. Het punt waar de lijn de nullijn kruist, is uw terugverdientijd. Netkosten stijgen structureel — hoe sneller ze stijgen, hoe waardevoller dit ontwerp wordt.</p>'+
  chartBlok('ch-cashflow')+
  '<div class="kpi-row k3">'+
    '<div class="kpi"><div class="l">Totale investering</div><div class="v">'+eur(CAPEX.totaal)+'</div><div class="s">PV+batterij'+((CAPEX.cabine>0)?'+cabine':'')+'+laadinfra</div></div>'+
    '<div class="kpi groen"><div class="l">Besparing jaar 1</div><div class="v">'+eur(FIN.besparing_jaar1)+'</div><div class="s">realistisch</div></div>'+
    '<div class="kpi oranje"><div class="l">Terugverdientijd</div><div class="v">'+(rendReal.tvt!=null?fmt1.format(rendReal.tvt):'—')+' jr</div><div class="s">realistisch scenario</div></div>'+
  '</div>'+
  (FIN.onbalans_windfall_jaar1>0?'<div class="box oranje"><b>Bonus — onbalanssturing:</b> bovenop het bovenstaande kan de flexibiliteit ± '+eur(FIN.onbalans_windfall_jaar1)+'/jaar extra opbrengen. Dit is een bonus, geen basis: de sturing oogst die waarde wanneer de markt ze biedt.</div>':'')+
  mgmt('capex/opex & rendement',
    '<table><tbody>'+
    '<tr><td>Capex PV / batterij / laadinfra</td><td>'+eur(CAPEX.pv)+' / '+eur(CAPEX.batterij)+' / '+eur(CAPEX.laadpalen)+'</td></tr>'+
    (((CAPEX.verzwaring||0)+(CAPEX.cabine||0))>0?'<tr><td>Capex verzwaring / cabine (LS→MS)</td><td>'+eur(CAPEX.verzwaring||0)+' / '+eur(CAPEX.cabine||0)+'</td></tr>':'')+
    '<tr><td>Capex totaal</td><td>'+eur(CAPEX.totaal)+'</td></tr>'+
    '<tr><td>Onderhoud jaar 1 / verzekering</td><td>'+eur(OH1)+' / '+eur(VERZ)+'</td></tr>'+
    '<tr><td>Rendement jaar 1 (realistisch)</td><td>'+pct(rendReal.rendement)+' · netto jaar 1 = '+eur(rendReal.netto1)+'</td></tr>'+
    '</tbody></table>'+
    frm('besparing(y) = besparing_jaar1 × [ energie_deel·(1+infl)^y + net_deel·(1+infl+net_extra)^y·(netsprong) ]\nenergie_deel = '+pct(FIN.besparing_energie_deel*100)+', net_deel = '+pct((1-FIN.besparing_energie_deel)*100)+'\ncumulatief(y) = Σ (besparing(y) − opex(y)) − capex; omvormervervanging in jaar 10 = '+eur((INV.ontwerp.pv_kwp||0)*AAN.omvormer_vervang_kwp)))
);

// ---- PAGINA 10 — 5 FINANCIERINGSMODELLEN ----
var CT=CAPEX.totaal;
function opex(y){ return OH1*Math.pow(1.02,y)+VERZ; }
function omvormer(y){ return y===9?(INV.ontwerp.pv_kwp||0)*AAN.omvormer_vervang_kwp:0; }
function besp(y){ return besparingJaar(AAN.scenarios.realistisch,y); }
// Model 1 — Eigen kas
var m1 = bouwReeks({scKey:'realistisch', initieel:-CT, inkomstenFn:function(y){return besp(y);}, kostenFn:function(y){return opex(y)+omvormer(y);}});
// Model 2 — Banklening 70% @5% 10j
var len2=CT*0.70, ds2=annuiteit(len2,0.05,10);
var m2 = bouwReeks({scKey:'realistisch', initieel:-(CT-len2), inkomstenFn:function(y){return besp(y);}, kostenFn:function(y){return opex(y)+omvormer(y);}, finFn:function(y){return y<10?ds2:0;}, dscrFn:function(y,ink,kost){var ds=(y<10?ds2:0);return ds>0?(ink-kost)/ds:null;}});
// Model 3 — Operationele lease @10% 10j
var leaseDS=annuiteit(CT,0.10,10);
var m3 = bouwReeks({scKey:'realistisch', initieel:0, inkomstenFn:function(y){return besp(y);}, kostenFn:function(y){return (y<10?leaseDS+opex(y):opex(y))+omvormer(y);}, dscrFn:function(y,ink,kost){var ds=(y<10?leaseDS:0);return ds>0?besp(y)/ds:null;}});
// Model 4 — ESCO / derdepartijfinanciering (revenue share 50/50)
var m4 = bouwReeks({scKey:'realistisch', initieel:0, inkomstenFn:function(y){return besp(y)*0.5;}, kostenFn:function(y){return 0;}});
// Model 5 — Sale & lease back @10% 10j
var slbDS=annuiteit(CT,0.10,10);
var m5 = bouwReeks({scKey:'realistisch', initieel:CT, inkomstenFn:function(y){return besp(y);}, kostenFn:function(y){return (y<10?slbDS+opex(y):opex(y))+omvormer(y);}, dscrFn:function(y,ink,kost){var ds=(y<10?slbDS:0);return ds>0?besp(y)/ds:null;}});
var MODELLEN=[
  {nr:1,titel:'Eigen kas',sub:'U investeert zelf. Maximaal rendement, eigen inbreng = volledige capex.',reeks:m1,eigen:CT,dscr:false},
  {nr:2,titel:'Banklening (70% @5%, 10j)',sub:'Deels geleend; eigen inbreng '+eur(CT*0.30)+'. DSCR toont de dekkingsgraad.',reeks:m2,eigen:CT*0.30,dscr:true},
  {nr:3,titel:'Operationele lease (10%, 10j)',sub:'U huurt de installatie. Geen eigen inbreng.',reeks:m3,eigen:0,dscr:true},
  {nr:4,titel:'ESCO / derde partij (revenue share 50/50)',sub:'Een derde financiert en deelt de besparing. Geen inbreng, lager maar risicoloos.',reeks:m4,eigen:0,dscr:false},
  {nr:5,titel:'Sale & lease back (10%, 10j)',sub:'U ontvangt de capex en huurt terug. Directe liquiditeit.',reeks:m5,eigen:0,dscr:true}
];
function modelTabel(m){
  var toon=m.dscr; var body='';
  m.reeks.forEach(function(r){
    if(r.isNul){ body+='<tr style="background:#eef2f8"><td>0</td><td>—</td><td>—</td><td class="'+(r.cashflow>=0?'pos':'neg')+'">'+eur(r.cashflow)+'</td><td class="'+(r.cumm>=0?'pos':'neg')+'">'+eur(r.cumm)+'</td>'+(toon?'<td>—</td>':'')+'</tr>'; return; }
    if(r.label>6 && r.label!=10 && r.label!=15 && !MGMT) return; // klant: compact (jaar 1-6,10,15); management: alles
    body+='<tr><td>'+r.label+'</td><td>'+eur(r.inkomsten)+'</td><td>'+eur(r.kosten+r.fin+r.aflossing)+'</td><td class="'+(r.cashflow>=0?'pos':'neg')+'">'+eur(r.cashflow)+'</td><td class="'+(r.cumm>=0?'pos':'neg')+'">'+eur(r.cumm)+'</td>'+(toon?'<td>'+(r.dscr!=null?fmt1.format(r.dscr):'—')+'</td>':'')+'</tr>';
  });
  return '<table class="'+(MGMT?'':'compact')+'"><thead><tr><th>Jaar</th><th>Besparing</th><th>Kosten+fin</th><th>Cashflow</th><th>Cumulatief</th>'+(toon?'<th>DSCR</th>':'')+'</tr></thead><tbody>'+body+'</tbody></table>';
}
pagina(
  '<div class="eyebrow">Financiering</div><h2>Vijf manieren om dit te financieren</h2>'+
  '<p class="lead">Van eigen kas tot volledig extern gefinancierd — kies wat bij uw balans past.</p>'+
  MODELLEN.slice(0,3).map(function(m){ return '<h3>Model '+m.nr+' — '+esc(m.titel)+'</h3><p class="note">'+esc(m.sub)+'</p>'+modelTabel(m); }).join('')
);
pagina(
  '<div class="eyebrow">Financiering (vervolg)</div><h2>Modellen 4 & 5</h2>'+
  MODELLEN.slice(3).map(function(m){ return '<h3>Model '+m.nr+' — '+esc(m.titel)+'</h3><p class="note">'+esc(m.sub)+'</p>'+modelTabel(m); }).join('')+
  '<div class="box groen"><b>Ons advies.</b> De keuze hangt af van uw fiscale en liquiditeitssituatie. In de meeste gevallen geeft een gedeeltelijke banklening (model 2) het beste evenwicht tussen rendement en beperkte eigen inbreng. Wij nemen dit graag met u en uw boekhouder door.</div>'+
  '<p class="quote">"Slim zijn is goedkoper — en met het juiste financieringsplan hoeft slim zijn u vandaag geen liquiditeit te kosten."</p>'+
  mgmt('financieringsmodellen — parameters',
    frm('Model 1 eigen kas: initieel −capex ('+eur(CT)+').\nModel 2 banklening 70% @5% 10j: annuïteit = '+eur(ds2)+'/jaar, eigen inbreng '+eur(CT*0.30)+'.\nModel 3 operationele lease @10% 10j: DS = '+eur(leaseDS)+'/jaar.\nModel 4 ESCO revenue share 50/50: klant ontvangt 50% van de besparing, geen inbreng.\nModel 5 sale & leaseback @10% 10j: klant ontvangt capex ('+eur(CT)+'), betaalt DS '+eur(slbDS)+'/jaar.\nAlle modellen: besparing = realistisch scenario; opex groeit 2%/jaar; omvormervervanging jaar 10.'))
);

// ---- management: volledig data-eiland (chatbot-klaar) ----
if(MGMT){
  var island = { meta:{ generator:'ontwerp-rapport v2.0.0', mode:MODE, gegenereerd:INV.datum, klant:INV.klant, locatie:INV.locatie, scenario:INV.scenario_naam },
    aannames:AAN, invoer:INV,
    berekend:{ capex:CAPEX, onderhoud_jaar1:OH1, verzekering:VERZ, batterij_levensduur:BAT_LV,
      kostpermwh_bestaand:kostpermwh_bestaand, kostpermwh_voorstel:kostpermwh_voorstel, besparing_pct:besp_pct,
      rendement_realistisch:rendReal, aansluiting_vermeden_kw:aansluiting_vermeden, zelfconsumptie_pct:zelfcons_pct,
      cumulatief_per_scenario:scReeks,
      financieringsmodellen:MODELLEN.map(function(m){return {nr:m.nr, titel:m.titel, eigen_inbreng:m.eigen, eindwaarde_cumulatief:m.reeks[m.reeks.length-1].cumm};}) } };
  pagina(
    '<div class="eyebrow">Bijlage — machineleesbaar</div><h2>Volledig data-eiland</h2>'+
    '<p class="note">Dit blok bevat alle onderliggende gegevens, aannames en tussenresultaten van dit rapport in JSON. Het voedt de rapport-chatbox: elke vraag over dit dossier kan hieruit beantwoord worden. Niet voor de klant.</p>'+
    '<div class="frm" style="max-height:none">'+esc(JSON.stringify(island,null,1))+'</div>'
  );
  var s=document.createElement('script'); s.type='application/json'; s.id='fluctus-data-island'; s.textContent=JSON.stringify(island); document.body.appendChild(s);
}

// ============================ CHARTS + HEATMAPS TEKENEN ============================
window.addEventListener('load', function(){

  // factuur pie
  mk('ch-fact-pie', { type:'doughnut', data:{ labels:['Energie','Distributie','Capaciteit','Heffingen'],

  mk('ch-fact-bar', { type:'bar', data:{ labels: _heeftMobiliteit?['Vandaag','+ vloot @ CREG','+ vloot op diesel','Voorstel']:['Vandaag','Scherp dyn.','Voorstel'],
    datasets:[{ data: _heeftMobiliteit?[F.bestaand_jaar,_cregReferentie,_referentieJaar,_voorstelJaar]:[F.bestaand_jaar,F.scherp_dynamisch_jaar,_voorstelJaar], backgroundColor: _heeftMobiliteit?[C_GRIJS,'#9DB4DE',C_ORANJE,C_GROEN]:[C_GRIJS,C_ORANJE,C_GROEN] }] },

  // PV donut (benutting)
  mk('ch-pv-donut', { type:'doughnut', data:{ labels:['Direct eigen verbruik','Via batterij','Injectie'],
    datasets:[{ data:[E.pv_naar_gebouw_mwh+E.pv_naar_laadplein_mwh, E.pv_via_batterij_mwh, Math.max(0,E.pv_productie_mwh-E.pv_zelfverbruik_mwh-E.pv_via_batterij_mwh)], backgroundColor:[C_GROEN,C_BLAUW,C_ORANJE], borderWidth:1, borderColor:'#fff' }] },
    options:{ plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}, cutout:'58%', responsive:true, maintainAspectRatio:false } });

  // extra PV — waar gaat de productie naartoe (via batterij apart als er een batterij is)
  var xpLab = heeftBatterij ? ['Direct eigen verbruik','Via batterij (lokaal)','Injectie'] : ['Direct eigen verbruik','Injectie'];
  var xpDat = heeftBatterij ? [xpDirect, xpViaBatt, xpInj] : [xpDirect, xpInj];
  var xpCol = heeftBatterij ? [C_GROEN,C_BLAUW,C_ORANJE] : [C_GROEN,C_ORANJE];
  mk('ch-xpv-pie', { type:'doughnut', data:{ labels:xpLab, datasets:[{ data:xpDat, backgroundColor:xpCol, borderWidth:1, borderColor:'#fff' }] },
    options:{ plugins:{legend:{position:'bottom',labels:{font:{size:10}}}, title:{display:true,text:'Extra PV · productie/jaar',font:{size:11}}}, cutout:'55%', responsive:true, maintainAspectRatio:false } });
  // groeistap PV — waar gaat de start-productie naartoe (via batterij apart als er een batterij is)
  var gsLab = gsHeeftBatt ? ['Direct eigen verbruik','Via batterij (lokaal)','Injectie'] : ['Eigen verbruik','Injectie'];
  var gsDat = gsHeeftBatt ? [gsDirect, gsViaBatt, gsInj] : [gsZelf, gsInj];
  var gsCol = gsHeeftBatt ? [C_GROEN,C_BLAUW,C_ORANJE] : [C_GROEN,C_ORANJE];
  mk('ch-gs-pie', { type:'doughnut', data:{ labels:gsLab, datasets:[{ data:gsDat, backgroundColor:gsCol, borderWidth:1, borderColor:'#fff' }] },
    options:{ plugins:{legend:{position:'bottom',labels:{font:{size:10}}}, title:{display:true,text:'Start-PV · productie/jaar',font:{size:11}}}, cutout:'55%', responsive:true, maintainAspectRatio:false } });
  // piek bar
  mk('ch-piek', { type:'bar', data:{ labels:['Zonder batterij','Met batterij','Aansluiting'],
    datasets:[{ data:[E.sitepiek_zonder_batterij_kw,E.sitepiek_met_batterij_kw,E.aansluiting_kw], backgroundColor:[C_ROOD,C_GROEN,C_BLAUW] }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:function(v){return v+' kW';}}}}, responsive:true, maintainAspectRatio:false } });
  // extra PV maand
  var maandProd=[3,5,9,13,16,17,17,15,11,7,4,3].map(function(x){return Math.round((XP.productie_mwh||154)*x/120);});
  mk('ch-pv-maand', { type:'bar', data:{ labels:['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],
    datasets:[{ data:maandProd, backgroundColor:C_ORANJE }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:function(v){return v+' MWh';}}}}, responsive:true, maintainAspectRatio:false } });
  // cumulatieve cashflow (3 scenario's)
  var jl=[]; for(var y=1;y<=AAN.horizon;y++) jl.push('J'+y);
  mk('ch-cashflow', { type:'line', data:{ labels:jl, datasets:[

    options:{ plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}, scales:{y:{ticks:{callback:function(v){return '€'+Math.round(v/1000)+'k';}}, grid:{color:function(c){return c.tick.value===0?'#1F3864':'#eee';}}}}, responsive:true, maintainAspectRatio:false } });
  // heatmaps
  _heatmaps.forEach(function(h){ var c=document.getElementById(h.id); if(c) tekenHeatmap(c, h.fn, h.lo, h.hi, h.palet, h.eenheid); });

<div id="fdpdf-bar">
  <button id="fdpdf-print" onclick="window.print()">🖨️ Print</button>
  <button id="fdpdf-save">⬇ PDF opslaan</button>
</div>
<script>
// PDF genereren (jsPDF + html2canvas) → lokale download + opslag in de Supabase-bucket (rapporten/<project-id>/).
(function(){
  var btn=document.getElementById('fdpdf-save');
  // De apps draaien op fluctus.net maar de API leeft op de Railway-proxy → absolute URL (anders 404 op /api).
  var API_BASE='https://lucid-amazement-production.up.railway.app';
  function bearer(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(/^sb-.+-auth-token$/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null');
      return (v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)))||null; } } }catch(e){} return null; }
  async function genPdf(){
    if(!window.jspdf||!window.html2canvas) throw new Error('PDF-bibliotheken niet geladen (internetverbinding?)');
    var pages=document.querySelectorAll('.a4');
    var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    for(var i=0;i<pages.length;i++){
      var canvas=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      var img=canvas.toDataURL('image/jpeg',0.92);
      var h=canvas.height*210/canvas.width;
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,210,h>297?297:h);
    }
    return pdf;
  }
  btn.onclick=async function(){
    btn.disabled=true; var orig=btn.textContent;
    try{
      btn.textContent='PDF genereren…';
      var pdf=await genPdf();
      var fn=(INV.klant||'ontwerp-rapport').replace(/[^A-Za-z0-9._-]/g,'_')+'_'+(MGMT?'management':'klant')+(PID?'_'+PID:'')+'.pdf';
      pdf.save(fn);
      var tok=bearer();
      if(tok){
        btn.textContent='Opslaan in Supabase…';
        var b64=pdf.output('datauristring').split(',')[1];
        var r=await fetch(API_BASE+'/api/rapport-opslaan',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
          body:JSON.stringify({project:INV.scenario_naam||INV.klant, project_id:PID, type:(MGMT?'ontwerp-management':'ontwerp-klant'), filenaam:fn, pdf_base64:b64})});
        var j={}; try{ j=await r.json(); }catch(e){}
        btn.textContent = r.ok ? '✓ Opgeslagen in Supabase' : ('Upload mislukt: '+(j.error||('HTTP '+r.status)));
      } else {
        btn.textContent='✓ PDF gedownload (niet ingelogd → geen Supabase)';
      }
    }catch(e){ btn.textContent='Fout: '+((e&&e.message)||e); }
    setTimeout(function(){ btn.disabled=false; btn.textContent=orig; }, 4500);
  };
})();
</script>
