r−na (incl. capaciteit), BW.cap=0. besp1 = energie − OPEX (netto jaar-1). (B) OPEX = onderhoud (opex_jaar) + kost slimme sturing (PV-omvormer 0,72 + batterij 1,2 €/kVA/mnd ×12), BEIDE jaarlijks in mindering op de cashflow (was: enkel onderhoud; sturing enkel getoond). (C) VERSTREKEN MAANDEN: databron-regel + bijlage 1 tonen de écht verstreken maanden uit van/tot (_verstrekenMnd) i.p.v. de aangeraakte kalendermaanden (1 mei–1 jul = 2 mnd, niet 3). (D) ONDERHANDELINGSNOTA 3-weg: dynamisch ≥5 goedkoper → onderhandelruimte; structureel >20 scherper dan markt → geen nota (overgeslagen); anders → bevestig kwaliteit. // v0.15.2 (2026-10-01, Johan feedback Energie-analyse Momignies): (1) BIJLAGE 1 DATUMBUG — _paDatum parste "01/05/2026" als Amerikaanse MM/DD → "5 jan 2026"; nu expliciet DD/MM/YYYY → gemeten periode toont "1 mei – 1 jul 2026". (2) ONDERHANDELINGSNOTA "verwaarloosbaar"-box: ± 50 €/MWh verschil was fout gelabeld als "verwaarloosbaar" → nu "Uw contract t.o.v. dynamisch · goedkoper (scherp)" wanneer de klant onder de dynamische prijs zit (alleen ≤8 €/MWh = verwaarloosbaar). (3) MARKTBEWEGING-nota: zei onterecht "een groot deel van het verschil komt van de marktevolutie" ook bij Δspot −7 op een verschil van 50; nu aandeel-afhankelijk (|Δspot|/|dyn−huidig|): <40% → "spotmarkt nauwelijks bewogen, verschil zit in contractstructuur". Misleidende "uw tarief weerspiegelt de spotmarkt van uw factuurperiode" geschrapt. (4) ONBALANS-PAGINA (optie a): zonder becijferde onbalanswaarde (onbExtra=0) klapt de "Extra potentieel: onbalans-sturing"-pagina in tot een compacte EMS-keuzeraad — titel "Uw dynamisch contract & EMS-keuze", géén lege hero/stappenplan meer; de EMS-deur-open-raad + dynamisch-contract-vereiste blijven. Mét waarde (onbExtra>0) → volledige potentieel-pagina ongewijzigd. // v0.15.1 (2026-10-01, Johan bouwplan §1/§4/§5/§6d): (1) spotmarkt-evolutie-opmerking in de onderhandelingsnota (commodity.spot_evolutie); (2) NIEUWE laadplein-bijlage vóór de laad-heatmaps — lad, geen pariteits-opvulling meer. // v0.14.11 (2026-09-29) — STURINGSKOST PER COMPONENT (Johan): de "kost slimme sturing" op p5 is nu de SOM van PV (0,72 €/kVA-omvormer/maand × 12) + batterij (1,2 €/kVA/maand × 12), elk op zijn eigen vermogen (PV = pv_kwp als omvormer-kVA-proxy, batterij = batt_kw) i.p.v. één tarief × toegangsvermogen. Anoniem (geen merknaam). // v0.14.10 (2026-09-29) — EXPLOITATIEKOSTEN OP P5 (Johan): onder de tegels van het financieel plan staan nu de jaarlijkse exploitatiekosten — de opgegeven exploitatiekost (zit in de cashflow) + de (anonieme) kost van slimme sturing = (batterij ? 0,20 : 0,12) €/kVA/maand × toegangsvermogen × 12. // v0.14.9 (2026-09-29) — EXPLOITATIEKOST JAARLIJKS (Johan): het 15-jaar plan leest nu D.battwaarde.opex_jaar (jaarbedrag) i.p.v. opex_maand×12 (oude sleutel blijft als fallback). // v0.14.8 (2026-09-29) — ONDERHANDELINGSNOTA WEG ZONDER FACTUUR (Johan: "als ik geen factuurdata kreeg heeft deze bijlage geen zin"): de onderhandelingsnota (huidig vs dynamisch energietarief) wordt overgeslagen als er geen huidig energietarief is (nu_energie = 0/onbekend, bv. dossier zonder factuur) → geen "0 €/MWh"-vergelijking meer; de overige bijlagen hernummeren automatisch. // v0.14.7 (2026-09-29) — EXPLOITATIEKOST IN 15J-PLAN (Johan): het financieel plan trekt nu de maandelijkse exploitatiekost (D.battwaarde.opex_maand × 12, geïndexeerd met inflatie) jaarlijks van de cashflow af → TVT, netto meerwaarde en rendement houden er rekening mee; de aannames-noot toont de netto jaar-1. // v0.14.6 (2026-09-28) — COVER-GRAMMATICA (Johan, coherentie-check): de cover-subtitel zei "Wat een batterij voor u betekenen" (meervoudsvorm van 'zonnepanelen' hergebruikt) → nu "betekent" bij een enkelvoudig onderwerp (batterij / slim laden / de voorgestelde installatie); "zonnepanelen" of een samengestelde opsomming blijft "betekenen". // v0.14.5 (2026-09-28) — GEEN LEGE PAGINA'S BIJ PRINTEN (Johan: "als we het printen laat hij telkens een lege bladzijde RACT (Johan: "extrapolatie van 1 maand factuur naar jaarkost lijkt te goedkoop; zet de besparing van PV+batterij t.o.v. een optimaal spotcontract, en de contractvergelijking alleen in de bijlage als het bedrag van die maand"): cover + factuurvergelijking + TVT tonen nu ENKEL de installatie op een optimaal dynamisch (spot) contract — zonder installatie (NUL) → met installatie (OPT) = besp (PV+batterij), volledig op kwartierbasis over een jaar → betrouwbaar én overal consistent. De vergelijking met de échte (vaste) factuur is geschrapt van de cover/factuurvergelijking en staat nu ENKEL in de onderhandelingsnota (bijlage), als het energieverschil voor ÉÉN maand (huidig tarief vs scherp dynamisch tarief × één maand afname), bewust niet geëxtrapoleerd naar een jaar. // v0.13.2 (2026-09-28) — BESPARING CONSISTENT (Johan: "besparingen zijn niet consistent"): de cover ankert op de ÉCHTE factuur (HUIDIG − MET = BESP_TOTAAL), maar de factuurvergelijking toonde het spot-verschil (NUL − OPT = besp) als besparing → twee verschillende bedragen wanneer de échte factuur goedkoper is dan de spot-basis (bv. €29.952 vs €32.610 door de +€10/MWh forfait). Fix: de factuurvergelijking toont nu ALTIJD dezelfde headline-besparing als de cover (BESP_TOTAAL) en reconcilieert in BEIDE richtingen (échte factuur → spot-basis → met installatie → besparing t.o.v. de factuur). De posttabel-totaalregel is her-gelabeld als "Effect van de installatie (dynamisch contract)". // v0.13.1 (2026-09-28) — PROFIELANALYSE-BIJLAGE (Johan): vóór bijlage 1 (onderhandelingsnota) staat nu, per aanwezig profiel (afname/injectie), 1 A4 met kerncijfers (jaarvolume MWh · maandpiek kW · gemeten periode), volume per maand (staafdiagram) en een maand×uur-warmtekaart — zoals bij het opladen van de profielen. Data: D.profielanalyse{afname,injectie} (server v15.195 / ek v0.24.11). GEEN betrouwbaarheids-kwalificatie; geen profiel → geen bijlage; dynamische nummering via _bijlage. // v0.13.0 (2026-09-28) — HUIDIG = ECHTE ALL-IN FACTUUR (Johan): "uw huidige contract" = D.huidig_all_in_jaar (de door de klant ingevulde all-in jaarfactuur, excl btw), niet meer NUL.saldo+onderhandelingsmarge. CONTRACTSWITCH = max(0, HUIDIG − dynamisch contract) → het ECHTE verschil (kan ~0 zijn → 2-staps hero op de echte factuur). Bijlage 1 onderhandelingsmarge = diezelfde CONTRACTSWITCH. // v0.12.2 (2026-09-28) — DATABRON + LEVERINGSADRES (Johan): (1) databron expliciet in de Aansluiting-sectie (gemeten kwartierdata Fluvius vs standaardprofiel) via A.profiel_bron/D.databron; (2) leveringsadres (ADRES) telkens náást de klantnaam getoond (kop-blok elke pagina + footer), zoals op het voorblad. // v0.12.0 (2026-09-28) — CONTRACTSWITCH EXPLICIET (Johan, optie B): basis blijft op spot (dynamisch contract), maar de contractwissel wordt apart getoond zodat het rapport aansluit op de échte factuur. CONTRACTSWITCH = onderhandelingsmarge (bijlage 1) → geen dubbeltelling. Cover+P2 hero = 3-staps ketting (huidig contract → dynamisch zonder PV → met PV+batt) via _heroBoxes/_bespRegel; factuurvergelijking krijgt reconciliatie-tabel (huidig vast → +contractswitch → spot-basis → met installatie) + kop "Dynamisch (spot)"; TVT/rendement blijft enkel op PV+batt (besp). // v0.11.2 (2026-09-28) — PDF-FIX v2 (Johan): elke SVG + bannerafbeelding wordt vóór html2canvas naar PNG omgezet met CORRECTE cover-crop-aspect (kompas blijft rond, geen heatmap valt weg). _rasterizeForPdf/_drawCover. // v0.11.1 (2026-09-28) — PDF-CONSISTENTIE (Johan, batch 4): _genPdf geeft inline-SVG's tijdelijk expliciete px-afmetingen vóór html2canvas (anders vielen de heatmaps weg in de gedownloade/gemailde PDF; native print had ze wél) + onclone normaliseert de full-bleed banners (geen versmald/geknipt logo). Download-knop + auto-mail delen nu dezelfde (gefixte) render. // v0.11.0 (2026-09-28) — RAPPORT-OPKUIS (Johan): CREG-verwijzingen weg (cover/P2/factuurvergelijking); voorpagina met klantnaam + afname-adres groot/centraal; Aansluittype (LS/MS) bij Aans <style>

<script>
// ============================================================================
//  ENERGIE-ANALYSE — anonieme klant-renderer (toont enkel; rekent niets opnieuw)
// ============================================================================
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _num(x,d){ x=+x||0; return x.toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function eur(x){ return '€ '+_num(x,0); }
// v0.15.3 (Johan): écht verstreken maanden tussen twee datums (DD/MM/YYYY of ISO), i.p.v. de aangeraakte kalendermaanden.
function _verstrekenMnd(van, tot){ try{ function p(s){ var m=String(s).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); return m?new Date(+m[3],+m[2]-1,+m[1]):new Date(s); } var a=p(van), b=p(tot); if(isNaN(a)||isNaN(b)) return null; var mnd=(b-a)/(1000*60*60*24*30.4375); return (mnd>0)?Math.max(1,Math.round(mnd)):null; }catch(e){ return null; } }
function eur2(x){ return '€ '+_num(x,2); }
function pct(x,d){ return _num(x,d==null?0:d)+' %'; }
function signEur(x){ var s=(+x||0)>=0?'+':'−'; return s+' € '+_num(Math.abs(+x||0),0); }

// ---------- heatmap-engine (per uur, mat[24][365]) — groenladder ----------
function heatKleur(t){
  if(t<=0) return '#F2F5F8';
  var stops=[[234,247,238],[154,212,166],[5,176,80],[4,132,67],[11,61,36]];
  var x=Math.min(1,t)*(stops.length-1), i=Math.floor(x), f=x-i, a=stops[i], b=stops[Math.min(stops.length-1,i+1)];
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
// v0.11 (Johan): randkleur voor kengetal-cellen — licht (#E2E8F0) → Energie-Compas-groen (26,140,64). t in [0,1], hoger = gunstiger.
function _kgRand(t){ t=Math.max(0,Math.min(1,+t||0)); return 'rgb('+Math.round(200-(200-26)*t)+','+Math.round(224-(224-140)*t)+','+Math.round(202-(202-64)*t)+')'; }
// mat[24][365]; 0u ONDER → 23u boven. Maand-as: met vanISO volgt ze het ECHTE venster (bv. rolling-sim), zonder vanISO = vast 1 jan → 31 dec.
// v0.38.1: heatmap-vakjes als PNG (canvas, 2× resolutie, scherpe randen). null → caller valt terug op SVG-vakjes.
function _heatPng(mat, mx, DAYS, HRS, wPx, hPx){
  try{
    var S=2, c=document.createElement('canvas'); c.width=Math.round(wPx*S); c.height=Math.round(hPx*S);
    var g=c.getContext&&c.getContext('2d'); if(!g) return null;
    g.fillStyle='#F2F5F8'; g.fillRect(0,0,c.width,c.height);   // v0.39.0: geen transparantie → geen lichte randjes bij schalen (Safari)
    var cw=c.width/DAYS, ch=c.height/HRS, n=0;
    for(var h=0;h<HRS;h++){ var row=mat[h]||[]; for(var d=0;d<DAYS;d++){ var v=+row[d]||0; if(v<=0) continue;
      var x0=Math.floor(d*cw), x1=Math.ceil((d+1)*cw), y0=Math.floor((HRS-1-h)*ch), y1=Math.ceil((HRS-h)*ch);
      g.fillStyle=heatKleur(v/mx); g.fillRect(x0, y0, Math.max(1,x1-x0), Math.max(1,y1-y0)); n++; } }
    if(!n) return null;
    var url=c.toDataURL('image/png'); return (url && url.indexOf('data:image/png')===0) ? url : null;
  }catch(e){ return null; }
}
function heatmapSvg(mat, piek, vanISO){
  if(!mat||!mat.length) return '<div class="note">Geen profiel beschikbaar.</div>';
  var HRS=24, DAYS=mat[0].length||365, padL=16, padB=13, W=760, H=200;
  var mx=+piek||0; if(!(mx>0)){ mat.forEach(function(r){ r.forEach(function(v){ if(v>mx)mx=v; }); }); }
  if(!(mx>0)) mx=1;
  var cw=(W-padL)/DAYS, ch=(H-padB)/HRS, s='';
  s+='<rect x="'+padL+'" y="0" width="'+(W-padL)+'" height="'+(H-padB)+'" fill="#F2F5F8"/>';
  // v0.38.1 (Johan): één afbeelding i.p.v. 8.760 SVG-vakjes → printvoorvertoning/PDF blijft licht (was blanco bij grote rapporten).
  var _img=_heatPng(mat, mx, DAYS, HRS, W-padL, H-padB);
  if(_img) s+='<image href="'+_img+'" x="'+padL+'" y="0" width="'+(W-padL)+'" height="'+(H-padB)+'" preserveAspectRatio="none"/>';
  else for(var h=0;h<HRS;h++){ for(var d=0;d<DAYS;d++){ var v=mat[h][d]||0; if(v<=0) continue;
    s+='<rect x="'+(padL+d*cw).toFixed(1)+'" y="'+((HRS-1-h)*ch).toFixed(1)+'" width="'+(cw+0.6).toFixed(1)+'" height="'+(ch+0.4).toFixed(1)+'" fill="'+heatKleur(v/mx)+'"/>'; } }
  [0,6,12,18].forEach(function(h){ s+='<text x="2" y="'+((HRS-1-h)*ch+ch*0.5+3).toFixed(1)+'" font-size="8" fill="#5A6577">'+h+'u</text>'; });
  // v0.25.0 (Johan): maand-as volgt het ECHTE venster. De sim-heatmaps (injectie/afname/batterij/laadplein) draaien op een
  //   ROLLEND 12-maanden-venster (server: rolling12, kolom 0 = MARKT.van ≈ ~12 mnd geleden), NIET op 1 jan. Met vanISO
  //   (= HT.periode.van) plaatsen we een label op de 1e kolom van elke ECHTE maand (wrappend). Zonder vanISO: vast 1 jan→31 dec
  //   (profielanalyse = kalender-geïndexeerd, blijft juist).
  var mnd=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  var _d0=null; if(vanISO){ var _t=Date.parse((''+vanISO).length<=10?(vanISO+'T00:00:00Z'):vanISO); if(!isNaN(_t)) _d0=new Date(_t); }
  if(_d0){
    var _pm=-1;
    for(var d=0;d<DAYS;d++){ var _dt=new Date(_d0.getTime()+d*86400000), _m=_dt.getUTCMonth();
      if(_m!==_pm){ var xM=padL+d*cw; s+='<line x1="'+xM.toFixed(1)+'" y1="0" x2="'+xM.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>';
        s+='<text x="'+(xM+2).toFixed(1)+'" y="'+(H-3)+'" font-size="8" fill="#5A6577">'+mnd[_m]+'</text>'; _pm=_m; } }
  } else {
    var cum=0, dpm=[31,28,31,30,31,30,31,31,30,31,30,31];
    for(var mi=0;mi<12;mi++){ var x=padL+cum*cw; s+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>';
      s+='<text x="'+(x+2).toFixed(1)+'" y="'+(H-3)+'" font-size="8" fill="#5A6577">'+mnd[mi]+'</text>'; cum+=dpm[mi]; }
  }
  return '<svg class="heat-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+s+'</svg>';
}
function heatBlok(titel, mat, eenheid, duiding, vanISO){
  // v0.25.0 (Johan): vanISO default = HEAT_VAN (het rolling-sim-venster). Oproepen die kalender willen (profielanalyse)
  //   geven expliciet null mee. Zo volgen alle sim-heatmaps het echte venster zonder elke caller aan te raken.
  if(vanISO===undefined) vanISO=(typeof HEAT_VAN!=='undefined'?HEAT_VAN:null);
  var piek=0; if(mat&&mat.length){ mat.forEach(function(r){ r.forEach(function(v){ if(v>piek)piek=v; }); }); }
  var pk=Math.round(piek*10)/10;
  return '<div class="heat-wrap"><div class="heat-titel">'+esc(titel)+'</div>'+
    (duiding?'<div class="heat-duid">'+duiding+'</div>':'')+   // v0.31.0: duiding is interne HTML (bv. <b>piek</b>, <span class=muted>) — werd ge-escaped en toonde letterlijke tags
    heatmapSvg(mat, piek, vanISO)+
    '<div class="heat-leg"><span>laag</span><span class="bar"></span><span>hoog — piek '+_num(pk,1)+' '+esc(eenheid||'kW')+'</span></div></div>';
}

function _uitOpslag(){
  var rid=null; try{ rid=new URLSearchParams(location.search).get('rid'); }catch(e){}
  var ss=null, ls=null;
  try{ var s=sessionStorage.getItem('KLANTRAPPORT_DATA'); if(s) ss=JSON.parse(s); }catch(e){}
  try{ var l=localStorage.getItem('KLANTRAPPORT_DATA'); if(l) ls=JSON.parse(l); }catch(e){}
  if(rid){ if(ls&&ls._rid===rid) return ls; if(ss&&ss._rid===rid) return ss; }
  return ls||ss||null;
}

// FINANCIEEL PLAN over 15 jaar (uit eigen middelen, geen financiering)
function _cashflowSvg(rows, inv, hmm){
  var W=760, H=210, padL=52, padB=26, padT=10, n=rows.length;
  var vals=rows.map(function(r){return r.cumulatief;}); vals.push(-inv);
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx<0) mx=0; if(mn>0) mn=0; var span=(mx-mn)||1;
  var plotH=H-padB-padT, plotW=W-padL-8;
  function y(v){ return padT+(mx-v)/span*plotH; }
  var y0=y(0), bw=plotW/n*0.62, gap=plotW/n;
  var s='';
  // nul-lijn (break-even)
  s+='<line x1="'+padL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-8)+'" y2="'+y0.toFixed(1)+'" stroke="#5A6577" stroke-width="1"/>';
  s+='<text x="'+(padL-6)+'" y="'+(y0+3).toFixed(1)+'" font-size="9" fill="#5A6577" text-anchor="end">€ 0</text>';
  // y-top & y-bottom labels
  s+='<text x="'+(padL-6)+'" y="'+(padT+8)+'" font-size="9" fill="#5A6577" text-anchor="end">'+_fmtK(mx)+'</text>';
  s+='<text x="'+(padL-6)+'" y="'+(H-padB+2)+'" font-size="9" fill="#5A6577" text-anchor="end">'+_fmtK(mn)+'</text>';
  rows.forEach(function(r,i){
    var x=padL+i*gap+(gap-bw)/2, yv=y(r.cumulatief);
    var pos=r.cumulatief>=0;
    var top=pos?yv:y0, hgt=Math.abs(yv-y0);
    s+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,hgt).toFixed(1)+'" rx="1.5" fill="'+(pos?'#05B050':'#C7CCD1')+'"/>';
    if(i%2===0||i===rows.length-1) s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-padB+12)+'" font-size="8" fill="#5A6577" text-anchor="middle">j'+r.jaar+'</text>';
  });
  // eindwaarde-label
  var last=rows[rows.length-1], lx=padL+(n-1)*gap+(gap-bw)/2+bw/2, ly=y(last.cumulatief);
  s+='<text x="'+lx.toFixed(1)+'" y="'+((last.cumulatief>=0?ly-4:ly+11)).toFixed(1)+'" font-size="9" font-weight="700" fill="#037a3d" text-anchor="middle">'+_fmtK(last.cumulatief)+'</text>';
  return '<svg class="heat-svg" style="height:'+((+hmm>0?+hmm:46))+'mm" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+s+'</svg>';
}

    for(var i=0;i<n;i++){ var v=arr[i]||0, bh=(H-padB-padT)*(v/mx), x=padL+i*gw+(gw-bw)/2, y=H-padB-bh;

// A1 — onderhandelingsnota
(function(){
  var o=D.onderhandeling||{};
  // v0.23 (Johan 07-10): de onderhandelingsnota is ENKEL zinvol op een echte AFREKENINGSFACTUUR. Bij een voorschot- of
  //   korte-periodefactuur (of geen factuur) is het huidige commodity-€/MWh vertekend → server zet commodity.afrekening=false
  //   → bijlage volledig overslaan (hernummert automatisch).
  if(o.commodity && o.commodity.afrekening===false) return;
  // v0.26.0 (Johan): POSITIEVE gate — enkel bij een door de server bevestigde afrekeningsfactuur (zie HAS_NOTA).
  if(!HAS_NOTA) return;

  //   (vergelijking t.o.v. een onbestaand tarief) → sla de hele bijlage over. De overige bijlagen hernummeren automatisch.
  var _nuTarief = (o.commodity && +o.commodity.nu_energie_eur_mwh) || (+o.energie_nu_mwh) || 0;
  // v0.21.0 (Johan 06-10): geen factuur opgeladen (HUIDIG all-in jaarbasis onbekend) → geen onderhandelingsnota. De bijlage
  //   vergelijkt met het huidige contract; zonder factuur bestaat die vergelijking niet. Overige bijlagen hernummeren automatisch.
  if(!(_nuTarief>0) || !(HUIDIG>0)) return;
  var _cm = o.commodity || null;
  // v0.15.3 (Johan): 3-weg beslissing op basis van (dynamisch − huidig €/MWh) en de spotmarkt-evolutie.
  //   • dynamisch ≥5 €/MWh GOEDKOPER dan huidig → ONDERHANDELRUIMTE (klant kan besparen door te wisselen).
  //   • huidig STRUCTUREEL >20 €/MWh scherper dan de markt (verschil ná correctie voor de marktevolutie) → GEEN NOTA:
  //     het contract is uitzonderlijk scherp, onderhandelen heeft geen zin → hele bijlage overgeslagen (hernummert automatisch).
  //   • anders (verschil ≈ 0 of grotendeels door de marktevolutie verklaard) → BEVESTIG de contractkwaliteit.
  var _DR=5, _DR_GROOT=20, _onderTak='bevestig';
  if(_cm && _cm.nu_energie_eur_mwh!=null && _cm.dyn_energie_eur_mwh!=null){
    var _verschil=(+_cm.dyn_energie_eur_mwh)-(+_cm.nu_energie_eur_mwh);
    var _deltaMkt=(_cm.spot_evolutie&&_cm.spot_evolutie.delta_eur_mwh!=null)?+_cm.spot_evolutie.delta_eur_mwh:0;

  var h=_bijlage('Onderhandelingsnota energiecontract');
  h+='<p class="lead">Met de juiste installatie word je een aantrekkelijke klant voor je energieleverancier: je neemt '+
     'gerichter af en injecteert waardevoller. Gebruik onderstaande punten om bij je eigen leverancier een scherper, '+
     '<b>dynamisch (spot) contract</b> te bespreken.</p>';
  // v0.14.1 (Johan): vergelijk ENKEL de zuivere energie (piek/dal €/MWh) + vaste kost/maand tussen het bestaande en een
  //   dynamisch contract — certs (GSC/WKK), net en heffingen zijn identiek en vallen weg. De server (commodity-blok) levert
  //   nu/dyn energie €/MWh + contract_scherp. Is het dynamische niet scherper → we BEVESTIGEN dat het contract al scherp is.
  //   Anders: het energieverschil voor ÉÉN maand (niet geëxtrapoleerd naar een jaar).

// A2d — GELADEN KM PER VOERTUIG (v0.19, Johan): per voertuigtype gevraagd vs effectief geladen km, gegroepeerd
//   betalend (verkoop aan de paal) / niet-betalend (eigen vloot). Enkel als de server per-type-data meegaf.
(function(){
  if(!PER_TYPE.length) return;
  function _row(x){
    var kg=+x.km_gevraagd||0, kl=+x.km_geleverd||0, dp=kg>0?Math.round(kl/kg*100):0, bet=!!x.betalend;
    return '<tr style="border-bottom:1px solid #EEF2F8"><td style="padding:6px 8px">'+esc(x.voertuig||x.type||'—')+'</td>'+
      '<td style="padding:6px 8px">'+_lmTxt(x)+'</td>'+   // v0.27.0 (Johan): laadmoment (overdag / ’s nachts / 24 u)
      '<td style="padding:6px 8px;text-align:right">'+_num(kg,0)+'</td>'+
      '<td style="padding:6px 8px;text-align:right">'+_num(kl,0)+'</td>'+
      '<td style="padding:6px 8px;text-align:right"><b>'+(kg>0?dp+'%':'—')+'</b></td>'+
      '<td style="padding:6px 8px;text-align:right">'+(bet?eur(+x.opbrengst_eur||0):'—')+'</td></tr>';
  }
  // v0.27.0 (Johan): laadmoment per rij uit het laadvenster (server v15.256 per_type.laadmoment/laadvenster). Oude server → '—'.
  function _lmTxt(x){ var m=x&&x.laadmoment; if(!m) return '—';
    var lbl=(m==='24u')?'24 u':(m==='overdag'?'overdag':'’s nachts');
    var v=x.laadvenster, uur=(m!=='24u' && v && v.length===2)?('<span style="color:#6b7280;font-size:11px"> '+esc(v[0]+'–'+v[1]+' u')+'</span>'):'';
    return '<span>'+lbl+'</span>'+uur; }
  function _groep(bet,label){
    var list=PER_TYPE.filter(function(x){return !!x.betalend===bet;});
    if(!list.length) return '';
    var sg=0,sl=0,so=0; list.forEach(function(x){ sg+=+x.km_gevraagd||0; sl+=+x.km_geleverd||0; so+=+x.opbrengst_eur||0; });
    var dp=sg>0?Math.round(sl/sg*100):0;
    var g='<tr style="background:#f6f8fb"><td colspan="6" style="padding:6px 8px;font-weight:700;color:#0A2540">'+label+'</td></tr>';
    list.forEach(function(x){ g+=_row(x); });
    g+='<tr style="border-top:2px solid #E2E8F0;font-weight:700"><td style="padding:6px 8px">Subtotaal</td><td></td>'+
       '<td style="padding:6px 8px;text-align:right">'+_num(sg,0)+'</td>'+
       '<td style="padding:6px 8px;text-align:right">'+_num(sl,0)+'</td>'+
       '<td style="padding:6px 8px;text-align:right">'+(sg>0?dp+'%':'—')+'</td>'+
       '<td style="padding:6px 8px;text-align:right">'+(bet?eur(so):'—')+'</td></tr>';
    return g;
  }
  var h=_bijlage('Geladen kilometers per voertuig');
  h+='<p class="lead">Per voertuigtype tonen we hoeveel kilometer je op het plein wil laden (<b>gevraagd</b>) en hoeveel '+
     'de installatie er effectief van levert (<b>geladen</b>). Een betalend laadplein verkoopt die energie aan passanten; '+
     'een eigen vloot laadt voor eigen rekening. Het verschil tussen gevraagd en geladen is energie die de aansluiting '+
     'op drukke momenten niet aankon — bij een betalend plein is dat gemiste omzet.</p>';
  h+='<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:13px">'+
       '<thead><tr style="text-align:left;border-bottom:2px solid #E2E8F0"><th style="padding:6px 8px">Voertuig</th><th style="padding:6px 8px">Laadmoment</th>'+
       '<th style="padding:6px 8px;text-align:right">Gevraagde km/jaar</th>'+
       '<th style="padding:6px 8px;text-align:right">Geladen km/jaar</th>'+
       '<th style="padding:6px 8px;text-align:right">Dekking</th>'+
       '<th style="padding:6px 8px;text-align:right">Omzet/jaar</th></tr></thead><tbody>'+
       _groep(true,'Betalend laadplein')+_groep(false,'Eigen vloot (niet betalend)')+
     '</tbody></table>';
  if(HAS_BZ) h+='<p class="note">De omzet is de verkoop aan de paal voor het effectief geleverde volume. Kost elektriciteit en '+
     'de netto plaza-marge staan in het financieel plan. Bedragen exclusief btw, indicatieve raming.</p>';
  pagina(h);
})();

      (row||[]).forEach(function(cel){

//  PDF (client-side) + optioneel: PDF naar de klant mailen via EK
// ============================================================================
// v0.11.2 (Johan) — PDF-CONSISTENTIE. html2canvas 1.4.1 is onbetrouwbaar met (a) inline-SVG met enkel CSS-breedte → heatmaps
//   vielen weg; en (b) object-fit:cover op <img> → banner werd uitgerekt (kompas platgeduwd). Oplossing: ELKE SVG en elke
//   banner-afbeelding wordt VÓÓR de capture zelf naar een PNG omgezet, met de CORRECTE verhouding (cover-crop met de juiste
//   aspect ratio), en tijdelijk in de DOM geplaatst. html2canvas rendert daarna enkel nog gewone <img>'s → betrouwbaar.
function _loadImg(src){ return new Promise(function(res){ var im=new Image(); im.crossOrigin='anonymous'; im.onload=function(){res(im);}; im.onerror=function(){res(null);}; im.src=src; }); }
function _pngFrom(w,h,draw){ var s=2, cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s)); var ctx=cv.getContext('2d'); ctx.scale(s,s); draw(ctx,w,h); return cv.toDataURL('image/png'); }
function _drawCover(ctx,im,w,h){ var ir=im.naturalWidth/im.naturalHeight, tr=w/h, sw,sh,sx,sy; if(ir>tr){ sh=im.naturalHeight; sw=sh*tr; sx=(im.naturalWidth-sw)/2; sy=0; } else { sw=im.naturalWidth; sh=sw/tr; sx=0; sy=(im.naturalHeight-sh)/2; } ctx.drawImage(im,sx,sy,sw,sh,0,0,w,h); }
async function _rasterizeForPdf(){
  var restore=[];
  // 1) inline-SVG → PNG (zelfde px-grootte)
  var svgs=[].slice.call(document.querySelectorAll('#rapport svg'));
  for(var i=0;i<svgs.length;i++){
    var sv=svgs[i], r=sv.getBoundingClientRect(); if(!(r.width>0&&r.height>0)) continue;
    var clone=sv.cloneNode(true); clone.setAttribute('width',Math.round(r.width)); clone.setAttribute('height',Math.round(r.height));
    if(!clone.getAttribute('xmlns')) clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    var xml=new XMLSerializer().serializeToString(clone);
    var im=await _loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)); if(!im) continue;
    var png=_pngFrom(r.width,r.height,function(ctx,w,h){ ctx.drawImage(im,0,0,w,h); });
    var el=document.createElement('img'); el.src=png; el.style.cssText='display:block;width:'+r.width+'px;height:'+r.height+'px';
    sv.style.display='none'; sv.parentNode.insertBefore(el,sv); restore.push([sv,el]);
  }
  // 2) banner-afbeeldingen (object-fit:cover) → PNG met correcte cover-crop → geen uitgerekt/plat kompas
  var bands=[].slice.call(document.querySelectorAll('#rapport .band-top, #rapport .band'));
  for(var j=0;j<bands.length;j++){
    var bi=bands[j], rb=bi.getBoundingClientRect(); if(!(rb.width>0&&rb.height>0)) continue;
    var im2=await _loadImg(bi.currentSrc||bi.src); if(!im2) continue;
    var png2=_pngFrom(rb.width,rb.height,function(ctx,w,h){ _drawCover(ctx,im2,w,h); });
    var cs=getComputedStyle(bi);
    var el2=document.createElement('img'); el2.src=png2; el2.style.cssText='display:block;width:'+rb.width+'px;height:'+rb.height+'px;margin:'+cs.margin;
    bi.style.display='none'; bi.parentNode.insertBefore(el2,bi); restore.push([bi,el2]);
  }
  return restore;
}
async function _genPdf(){
  if(!window.jspdf||!window.html2canvas) throw new Error('PDF-bibliotheken niet geladen (internetverbinding?)');
  var pages=[].filter.call(document.querySelectorAll('.a4'),function(p){ return getComputedStyle(p).display!=='none'; });   // v0.63.0: enkel zichtbare pagina's (bank/studie verbergen de rest)
  var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  var restore=await _rasterizeForPdf();
  try{
    for(var i=0;i<pages.length;i++){
      var canvas=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      var img=canvas.toDataURL('image/jpeg',0.92);
      var hh=canvas.height*210/canvas.width;
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,210,hh>297?297:hh);
    }
  } finally {
    restore.forEach(function(x){ try{ x[0].style.display=''; if(x[1]&&x[1].parentNode) x[1].parentNode.removeChild(x[1]); }catch(e){} });
  }
  return pdf;
}

// ============================================================================
//  v0.24.0 (Johan): HER-PAGINATIE ROOSTERS — geen weggeknipte roosters meer.
//  Elke .a4 is in print 296mm hoog met overflow:hidden. Bijlagen die meerdere
//  roosters (.heat-wrap) of kengetallen-tabellen (.kg) op EEN blad stapelen,
//  lieten de roosters die niet pasten wegknippen ("vergeten"). Deze pass meet
//  na de opbouw per pagina de natuurlijke hoogte van de blokken; wat niet past
//  verhuist naar een nieuwe "(vervolg)"-pagina (kop + meta herhaald). Daarna
//  hernummeren we alle voetteksten. Enkel pagina's met .heat-wrap/.kg worden
//  geraakt; cover/achterpagina/tabel-only blijven ongemoeid.
// ============================================================================
// v0.75.3: vertaal (FR/EN) VÓÓR het pagineren — de i18n-laag vertaalde pas achteraf, waardoor langere FR/EN-teksten na de paginering
//   toch onder de voettekst liepen (bv. FR-voorblad, «Votre parc de recharge payant»).
try{ if(window.EC_LANG && window.EC_LANG!=='nl' && typeof window.EC_translate==='function' && R) window.EC_translate(R); }catch(e){}
function _krPagineer(){
  // v0.75.0 (Johan 25-10): ALGEMENE PAGINERING voor ALLE pagina's (niet enkel pagina's met roosters):
  //   (1) niets wordt weggeknipt: wat niet past, verhuist als geheel blok (tabel, grafiek, rooster, kader, sectie) naar een
  //       «(vervolg)»-pagina — nooit een blok over twee pagina's; een tussenkop (h2/h3) verhuist mee met wat erop volgt;
  //   (2) geen vervolgblad voor een klein restje: past de pagina met ≤ 15 % verkleining (CSS zoom ≥ 0,85), dan wordt de
  //       inhoud van die pagina iets compacter gezet in plaats van ± 2 cm tekst naar een nieuw blad te sturen;
  //   (3) één blok dat op zich groter is dan een blad wordt verkleind tot het past (min. 0,70).
  //   Meting met getBoundingClientRect (werkt correct met zoom). Voorblad/achterblad/scheidingsblad blijven ongemoeid.
  try{
    if(!R) return;
    var probe=document.createElement('div');
    probe.style.cssText='position:absolute;left:-9999px;top:0;height:100mm;width:1mm;visibility:hidden';
    R.appendChild(probe); var pxmm=probe.getBoundingClientRect().height/100; R.removeChild(probe);
    if(!pxmm || !isFinite(pxmm) || pxmm<=0) return;
    var EPS=6, guard=0, ZMIN=0.85, ZMIN_BLOK=0.70, RESTJE=0.25;
    function availVan(pg){ var cs=getComputedStyle(pg); var foot=pg.querySelector('.a4-foot');
      return 296*pxmm-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0)-(foot?foot.getBoundingClientRect().height:0)-EPS; }
    function onderkant(content, el){ var cr=content.getBoundingClientRect(), r=el.getBoundingClientRect(); var mb=parseFloat(getComputedStyle(el).marginBottom)||0; var z=parseFloat(content.style.zoom)||1; return (r.bottom-cr.top)+mb*z; }
    function natuurlijk(content){ var kids=content.children, m=0; for(var i=0;i<kids.length;i++){ var o=onderkant(content,kids[i]); if(o>m) m=o; } return m; }
    function isKop(el){ return /^H[2-4]$/.test(el.tagName) || (el.classList && el.classList.contains('kop')); }
    function zetZoom(content,z){ content.style.zoom = (z>=0.999?'':String(Math.round(z*1000)/1000)); }
    var pi=0;
    while(pi < R.querySelectorAll('.a4').length){
      if(++guard>600) break;
      var pg=R.querySelectorAll('.a4')[pi];
      var content=pg.querySelector('.a4-content');
      if(!content){ pi++; continue; }
      var avail=availVan(pg), nat=natuurlijk(content);
      if(nat<=avail){ pi++; continue; }
      var vast=pg.classList.contains('cover')||pg.classList.contains('back')||pg.classList.contains('divider');
      if(vast){   // voorblad/achterblad/scheidingsblad: eigen opmaak (vullen het blad bewust) → enkel verkleinen als het blad écht langer wordt dan A4 (bv. FR-voorblad)
        var zv=1, tv=0; while(pg.getBoundingClientRect().height>297*pxmm+2 && zv>0.85 && tv<10){ zv=Math.round((zv-0.02)*100)/100; zetZoom(content,zv); tv++; }
        pi++; continue; }
      var kids=[].slice.call(content.children);
      // splitpunt: eerste kind dat niet meer past (de paginakop + titel tellen niet als inhoud)
      var split=-1, eersteInhoud=0;
      while(eersteInhoud<kids.length && (kids[eersteInhoud].classList.contains('kop') || kids[eersteInhoud].tagName==='H1')) eersteInhoud++;
      for(var k=eersteInhoud;k<kids.length;k++){ if(onderkant(content,kids[k])>avail){ split=k; break; } }
      // tussenkoppen verhuizen mee met wat erop volgt
      while(split>eersteInhoud && isKop(kids[split-1])) split--;
      var restH = split>=0 ? (nat - (split>0 ? (kids[split].getBoundingClientRect().top-content.getBoundingClientRect().top) : 0)) : 0;
      var zFit = avail/nat;
      // (2) klein restje → pagina iets compacter zetten in plaats van een bijna leeg vervolgblad
      if(vast || split<=eersteInhoud || (restH < avail*RESTJE && zFit>=ZMIN)){
        var zMin = vast ? ZMIN_BLOK : (split<=eersteInhoud ? ZMIN_BLOK : ZMIN);
        var z=Math.max(zMin, zFit*0.995); zetZoom(content, z);
        // controleer na het zetten (tekst herloopt bij zoom → kan iets anders uitvallen)
        var tries=0; while(natuurlijk(content)>avail && tries<6 && z>zMin){ z=Math.max(zMin, z-0.02); zetZoom(content,z); tries++; }
        if(natuurlijk(content)<=avail || vast || split<=eersteInhoud){ pi++; continue; }
        zetZoom(content,1);   // lukte niet binnen de grens → toch splitsen
      }
      var move=kids.slice(split);
      // bouw vervolg-pagina
      var titel=''; var h1=pg.querySelector('h1');
      if(h1) titel=h1.textContent.replace(/\s*\((vervolg|suite|continued)\)\s*$/,'');
      var kopNode=pg.querySelector('.kop');
      var np=document.createElement('div'); np.className='a4';
      var nc=document.createElement('div'); nc.className='a4-content';
      if(kopNode) nc.appendChild(kopNode.cloneNode(true));
      if(titel){ var nh=document.createElement('h1'); var _mn=titel.match(/^\s*(\d+)\.\s+([\s\S]*)$/);   // v0.42.0: hoofdstuknummer apart houden (vertaling)
        if(_mn){ var _sp=document.createElement('span'); _sp.className='hnr'; _sp.textContent=_mn[1]+'.'; nh.appendChild(_sp); nh.appendChild(document.createTextNode(' '+_mn[2]+' (vervolg)')); }
        else nh.textContent=titel+' (vervolg)';
        nc.appendChild(nh); }
      move.forEach(function(m){ nc.appendChild(m); });   // verplaatst de knopen uit de oude pagina
      var nf=document.createElement('div'); nf.className='a4-foot';
      nf.innerHTML='<span>'+(typeof _identLeft==='function'?_identLeft():'')+(window._DEMO?' · voorbeeld':'')+'</span><span class="a4-nr"></span>';
      np.appendChild(nc); np.appendChild(nf);
      pg.parentNode.insertBefore(np, pg.nextSibling);
      pi++;   // de nieuwe pagina wordt zo dadelijk zelf geëvalueerd (kan opnieuw splitsen of verkleinen)
    }
    // hernummer alle voetteksten
    var pref=(typeof PID!=='undefined' && PID)?('Dossier '+(typeof esc==='function'?esc(PID):PID)+' · '):'';
    var allp=R.querySelectorAll('.a4');
    for(var n=0;n<allp.length;n++){ var nr=allp[n].querySelector('.a4-nr'); if(nr) nr.textContent=pref+'p. '+(n+1); }
  }catch(e){ try{console.warn('splitRooster',e);}catch(_){} }
}
