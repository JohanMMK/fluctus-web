<!-- klantrapport.html v0.15.1 (2026-10-01, Johan bouwplan §1/§4/§5/§6d): (1) spotmarkt-evolutie-opmerking in de onderhandelingsnota (commodity.spot_evolutie); (2) NIEUWE laadplein-bijlage vóór de laad-heatmaps — laadverbruik + meerkost boven het gebouw (D.laadplein) + km-dekking vóór/ná + of de dagelijkse km-vraag gedekt is; (3) databron-regel verrijkt (gemeten maanden + periode + aangevuld + EAN + vaststelling, D.databron_detail); (4) lichtrode transparante achtergrond op elke kengetallen-cel <100% km-dekking (cel.km) + km-dekking-legende/km_dekking_voor. Oudere versie: klantrapport.html v0.15.0 (2026-09-30) — ENERGIESTROMEN (Johan: "tonen we bij de factuurvergelijking ook de MWh afname/injectie van de twee situaties? En zelfconsumptie PV + injectie MWh + % t.o.v. productie/verbruik, al dan niet via batterij, in een aparte bijlage vóór de injectiesturing met een donutdiagram + een maandstaafdiagram (positief zelfconsumptie PV direct + via batterij, negatief injectie)"): (1) P2 factuurvergelijking toont nu naast de €-posten ook de VOLUMES op het net — MWh afname + injectie, zonder vs met installatie (D.energie_mwh, server v15.212). (2) Nieuwe bijlage "Zelfconsumptie & zelfvoorziening" VÓÓR de injectiesturing-bijlage: twee donuts (zelfconsumptie = PV-bestemming direct/via batterij/injectie; zelfvoorziening = verbruik-dekking direct/via batterij/net) met %-in het midden, plus een maand-staafdiagram (positief PV direct + via batterij, negatief injectie) uit D.zelfconsumptie.maand (simulator v1.14.5 maand_energiebalans). Enkel met PV; batterij-loos → "via batterij"-segment valt weg. Dynamische bijlagenummering. // v0.14.12 (2026-09-29) — JAAR-PER-JAAR TABEL TERUG + STAART COMPACTER (Johan: "in het financieel plan (p5/p6) zijn de tabellen verdwenen" + "die 3 bijna-lege laatste bladzijden compacter, even-blad-forcing weg"): (1) de "Jaar per jaar"-tabel werd als break-inside:avoid-blok onder de 296mm-printvouw geschoven en door overflow:hidden VOLLEDIG weggeknipt → nu een COMPACTE 2-KOLOMS tabel (jaar 1–8 | 9–15) die integraal op de plan-pagina past. (2) De aparte waiver-pagina + de even/oneven-divider zijn geschrapt (3 staartpagina's → 1): de waiver-tekst staat nu op het achterblad, geen pariteits-opvulling meer. // v0.14.11 (2026-09-29) — STURINGSKOST PER COMPONENT (Johan): de "kost slimme sturing" op p5 is nu de SOM van PV (0,72 €/kVA-omvormer/maand × 12) + batterij (1,2 €/kVA/maand × 12), elk op zijn eigen vermogen (PV = pv_kwp als omvormer-kVA-proxy, batterij = batt_kw) i.p.v. één tarief × toegangsvermogen. Anoniem (geen merknaam). // v0.14.10 (2026-09-29) — EXPLOITATIEKOSTEN OP P5 (Johan): onder de tegels van het financieel plan staan nu de jaarlijkse exploitatiekosten — de opgegeven exploitatiekost (zit in de cashflow) + de (anonieme) kost van slimme sturing = (batterij ? 0,20 : 0,12) €/kVA/maand × toegangsvermogen × 12. // v0.14.9 (2026-09-29) — EXPLOITATIEKOST JAARLIJKS (Johan): het 15-jaar plan leest nu D.battwaarde.opex_jaar (jaarbedrag) i.p.v. opex_maand×12 (oude sleutel blijft als fallback). // v0.14.8 (2026-09-29) — ONDERHANDELINGSNOTA WEG ZONDER FACTUUR (Johan: "als ik geen factuurdata kreeg heeft deze bijlage geen zin"): de onderhandelingsnota (huidig vs dynamisch energietarief) wordt overgeslagen als er geen huidig energietarief is (nu_energie = 0/onbekend, bv. dossier zonder factuur) → geen "0 €/MWh"-vergelijking meer; de overige bijlagen hernummeren automatisch. // v0.14.7 (2026-09-29) — EXPLOITATIEKOST IN 15J-PLAN (Johan): het financieel plan trekt nu de maandelijkse exploitatiekost (D.battwaarde.opex_maand × 12, geïndexeerd met inflatie) jaarlijks van de cashflow af → TVT, netto meerwaarde en rendement houden er rekening mee; de aannames-noot toont de netto jaar-1. // v0.14.6 (2026-09-28) — COVER-GRAMMATICA (Johan, coherentie-check): de cover-subtitel zei "Wat een batterij voor u betekenen" (meervoudsvorm van 'zonnepanelen' hergebruikt) → nu "betekent" bij een enkelvoudig onderwerp (batterij / slim laden / de voorgestelde installatie); "zonnepanelen" of een samengestelde opsomming blijft "betekenen". // v0.14.5 (2026-09-28) — GEEN LEGE PAGINA'S BIJ PRINTEN (Johan: "als we het printen laat hij telkens een lege bladzijde tussen elke bladzijde", PDF telde 36 i.p.v. ~18 pagina's): elke .a4 was exact 297mm = precies één A4 én kreeg een geforceerd pagina-einde erna → de browser schoof telkens een lege pagina ertussen. Fix: print-.a4 op 296mm (net onder de printbare hoogte) + overflow:hidden + break-after enkel op niet-laatste pagina's. // v0.14.4 (2026-09-28) — SNEL OPENEN: GEEN AUTO-PDF (Johan: "rapport opent nooit snel, duurt eeuwen — geheugenprobleem van mijn PC?"): NEE — het openen toonde de (snelle) SVG's, maar draaide dan AUTOMATISCH de zware html2canvas-PDF (elke A4 pixel per pixel hertekend op 2×) om te mailen. Dat blokkeerde het tabblad ("eeuwen"), ook als je enkel wou kijken. Nu draait de PDF ENKEL nog in ?mode=mail (achtergrond-tabblad, geopend via de knop "Mail mij het rapport" op het resultatenscherm): renderen → PDF → mail met PDF-link + link terug naar de resultaten → tabblad sluit zichzelf. Gewoon openen ("Toon rapport") = instant (enkel SVG). // v0.14.3 (2026-09-28) — PDF ALS MAIL-LINK (Johan): nieuwe knop "📧 Mail mij dit rapport" (+ de bestaande auto-mail) bewaart de PDF van de gekozen combi in de bucket en mailt de klant een STABIELE link i.p.v. een bijlage (server v15.199, als_link → /api/ek-rapport-pdf). // v0.14.2 (2026-09-28) — STIPPELLIJN = GEKOZEN COMBI (Johan): de kengetallen-bijlage markeert nu de in dit rapport gekozen combinatie (i.p.v. "onze aanbeveling"). // v0.14.1 (2026-09-28) — HEATMAP-RESOLUTIE + COMMODITY-VERGELIJKING (Johan): (1) de profielanalyse-"warmtekaarten" heten nu "heatmaps" en tonen per uur × per DAG (24×365) — zelfde engine/stijl als de andere bijlage-heatmaps (was per uur × per maand). (2) De onderhandelingsnota vergelijkt nu ENKEL de zuivere energie (piek/dal €/MWh) + vaste kost/maand tussen bestaand en dynamisch (server-commodity lfde (gefixte) render. // v0.11.0 (2026-09-28) — RAPPORT-OPKUIS (Johan): CREG-verwijzingen weg (cover/P2/factuurvergelijking); voorpagina met klantnaam + afname-adres groot/centraal; Aansluittype (LS/MS) bij Aansluiting; investeringsoverzicht = componenten + technische specs (rechts uitgelijnd), alleen totaalprijs; nieuwe pagina "Extra potentieel: onbalans-sturing" (spotmarkt=dynamisch contract + onbalans-besparing + EMS-waarschuwing (geen voetnoot) + stappenplan implementatie→EMS→onbalans); P5-bis financieel plan MÉT onbalans meegerekend (titel + caveat 100% oogst); bijlage 1 onderhandelingsmarge als getal (richtgetal) + prijs-van-zekerheid framing; kengetal-tabellen even breed (table-layout:fixed) + RAND-kleuring i.p.v. celvulling (_kgRand); laad-kengetallen weg zonder laden. Vereist server v15.189 (factuur.besparing_onbalans_jaar). // v0.10.0 (2026-09-27) — HUISSTIJL: stockfoto-banners vervangen door het Energie-Compas KOMPASSYMBOOL

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#12233b; --navy-l:#22406e; --blauw:#1F3864; --groen:#05B050; --groen-d:#048443;
    --grijs:#5A6577; --lijn:#D5DBE3; --bg:#F5F7FA; --zwart:#1A1F2B; --rood:#C0392B;
    --accent:#05B050; --accent-d:#037a3d; --zacht:#EAF2EC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--zwart);background:#e9edf2;font-size:14px;line-height:1.55}
  .a4{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:16mm 18mm 13mm;box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;position:relative}
  .a4 > .a4-content{flex:1}
  .a4-foot{margin-top:auto;padding-top:8px;font-size:9px;color:var(--grijs);border-top:1px solid var(--lijn);display:flex;justify-content:space-between}
  /* neutrale kop */
  .kop{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:9px;margin-bottom:16px}
  .kop .merk{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:.02em}
  .kop .merk span{color:var(--accent)}
  .kop .meta{font-size:10.5px;color:var(--grijs);text-align:right;line-height:1.5}
  h1{font-size:23px;color:var(--navy);margin:6px 0 4px}
  h2{font-size:16px;color:var(--navy);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--lijn)}
  h3{font-size:13px;color:var(--navy);margin:14px 0 4px}
  p{margin:6px 0}
  .lead{font-size:14.5px;color:#33404f}
  .muted{color:var(--grijs);font-size:11.5px}
  /* hero */
  .hero{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin:18px 0 6px}
  .hero .box{border:1px solid var(--lijn);border-radius:12px;padding:16px 14px;text-align:center;background:#fff}
  .hero .box.win{border-color:var(--accent);background:var(--zacht)}
  .hero .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--grijs);min-height:2.6em;display:block}
  .hero .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;margin-top:6px}
  .hero .v.win{color:var(--accent-d)}
  .hero .u{font-size:11px;color:var(--grijs);font-weight:600}
  .hero .arr{display:flex;align-items:center;font-size:22px;color:var(--grijs)}
  /* tabel */
  table.f{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  table.f th,table.f td{padding:8px 10px;border-bottom:1px solid var(--lijn);text-align:right}
  table.f th:first-child,table.f td:first-child{text-align:left}
  table.f thead th{background:#f3f6fa;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  table.f tr.tot td{font-weight:800;color:var(--navy);border-top:2px solid var(--navy);border-bottom:none;font-size:13.5px}
  table.f td.win{color:var(--accent-d);font-weight:700}
  .pos{color:var(--accent-d)} .neg{color:var(--rood)}
  /* v0.14.12 (Johan): "Jaar per jaar" als compacte 2-koloms tabel → past onder de cashflow-grafiek op de plan-pagina (voorheen werd de volle 15-rij tabel als break-inside:avoid-blok onder de vouw geschoven en weggeknipt). */
  .jpj-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:6px;break-inside:avoid}
  table.f.jpj{margin-top:0;font-size:11px}
  table.f.jpj th,table.f.jpj td{padding:3.5px 8px}
  table.f.jpj thead th{font-size:10px}
  /* kengetallen-roosters (bijlage): PV×batterij per kengetal, gekleurde tabel in rapportstijl */
  .kg{margin:14px 0 6px;break-inside:avoid}
  .kg-t{font-size:13.5px;color:var(--navy);margin:0 0 6px;font-weight:700}
  .kg-scroll{overflow-x:auto}
  table.kg-tab{border-collapse:separate;border-spacing:2px;font-size:11px;table-layout:fixed;width:100%}
  table.kg-tab th{background:#f3f6fa;color:var(--navy);font-size:9.5px;font-weight:700;padding:4px 6px;text-align:center;white-space:nowrap}

  table.kg-tab td.kg-cel{text-align:center;padding:5px 6px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;background:#fff;color:#12305c;border:2px solid #E2E8F0}
  table.kg-tab td.kg-best{outline:2px dashed var(--navy);outline-offset:-3px}
  /* uitleg-blokken */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .card{border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;background:#fff}

  ul.check{list-style:none;padding:0;margin:8px 0}
  ul.check li{padding:6px 0 6px 26px;position:relative;font-size:12.5px;border-bottom:1px dotted var(--lijn)}
  ul.check li:before{content:'✓';position:absolute;left:2px;top:6px;color:var(--accent-d);font-weight:800}
  ul.check li b{color:var(--navy)}
  .note{font-size:11px;color:var(--grijs);margin-top:6px}
  /* EMS-waarschuwing (belangrijke bemerking, geen voetnoot) + stappenplan (v0.11 Johan) */
  .ems-warn{border:2px solid var(--groen,#05B050);background:var(--groenlicht,#eef7f0);border-radius:10px;padding:12px 16px;margin:14px 0}
  .ems-warn .ems-t{font-weight:800;color:var(--navy);font-size:14px;margin-bottom:4px}
  .ems-warn p{font-size:12.8px;color:#2a3540;margin:2px 0;line-height:1.5}
  .ems-caveat{border-left:4px solid var(--groen,#05B050);background:var(--groenlicht,#eef7f0);border-radius:8px;padding:10px 14px;margin:2px 0 12px;font-size:12.5px;color:#2a3540;line-height:1.5}
  .stap3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:8px;margin:10px 0}
  .stap{border:1px solid var(--lijn);border-top:4px solid var(--navy);border-radius:10px;padding:12px 12px;background:#fff;text-align:center}
  .stap-t{font-weight:800;color:var(--navy);font-size:14px;margin-bottom:6px}
  .stap-b{font-size:12.5px;color:#3a444f;line-height:1.55}
  .stap-pijl{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--groen,#05B050);font-weight:800}
  /* heatmap */
  .heat-wrap{margin:10px 0 4px;break-inside:avoid}
  .heat-titel{font-weight:700;color:var(--navy);font-size:12.5px;margin:10px 0 3px}
  .heat-svg{display:block;width:100%;height:40mm;border:1px solid var(--lijn);border-radius:4px;background:#fff}
  .heat-leg{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--grijs);margin-top:4px}
  .heat-leg .bar{height:9px;width:120px;border-radius:2px;background:linear-gradient(90deg,#EAF7EE,#9AD4A6,#05B050,#048443,#0B3D24)}

  .don-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 4px}
  .don-card{border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;text-align:center;break-inside:avoid;background:#fff}
  .don-t{font-weight:700;color:var(--navy);font-size:12.5px;margin-bottom:4px}
  .don-card svg{margin:2px auto 4px}
  .don-leg{margin-top:4px;text-align:left}
  .don-leg-h{display:flex;gap:16px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .don-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--zwart);margin:2px 0}

  #pdf-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px}
  #pdf-bar button{font-family:inherit;font-size:12px;font-weight:700;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  #pdf-save{background:var(--accent);color:#fff}

  #mailstatus{position:fixed;left:16px;bottom:16px;z-index:9999;font-size:11px;color:var(--grijs);background:#fff;border:1px solid var(--lijn);border-radius:8px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:300px}
  /* cover + achterpagina (full-bleed beeld) */

  .back-t{font-size:26px;font-weight:800;margin:18px 0 10px;max-width:155mm;color:var(--navy)}
  .back-p{font-size:13px;color:#33404f;max-width:155mm;line-height:1.6;margin:6px 0}

  .divider-flex{display:flex;flex-direction:column;height:100%}
  .divider-flex .t{margin-top:auto;font-size:18px;font-weight:700;color:var(--navy)}
  /* band-beeld op contentpagina (met randbleed) */
  .band{width:calc(100% + 36mm);margin:2px -18mm 14mm;height:42mm;object-fit:cover;display:block}
  /* disclaimer */
  .disc{border:1px solid var(--lijn);border-left:4px solid var(--navy);border-radius:8px;background:#f7f9fc;padding:16px 18px;font-size:12.8px;line-height:1.65;color:#33404f}
  .disc h3{margin:0 0 6px;color:var(--navy)}
  .disc ul{margin:10px 0 0;padding-left:18px} .disc li{margin:7px 0}
  .disc b{color:var(--navy)}
  /* waiver / fine print (klein, wit, geen kader, geen titel) */
  .fineprint{font-size:9.5px;line-height:1.55;color:var(--grijs);text-align:justify;max-width:170mm}
  .fineprint p{margin:0 0 7px}
  .fineprint b{color:#3a444f;font-weight:600}
  .waiver-bottom{position:absolute;left:18mm;right:18mm;bottom:22mm}
  /* aansluiting-blok */
  .aansl{border:1px solid var(--lijn);border-radius:10px;overflow:hidden;margin-top:8px}
  .aansl .rij{display:grid;grid-template-columns:150px 1fr;gap:0;font-size:12.5px;border-bottom:1px solid var(--lijn)}
  .aansl .rij:last-child{border-bottom:none}
  .aansl .k{background:#f3f6fa;color:var(--navy);font-weight:700;padding:8px 12px}
  .aansl .v{padding:8px 12px;color:var(--zwart)}
  .aansl .v .ean{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  @page{size:A4;margin:0}
  /* v0.14.5 (Johan): GEEN LEGE PAGINA MEER TUSSEN ELKE PAGINA bij het printen. Oorzaak: elke .a4 was exact 297mm = precies
     één A4 én kreeg een geforceerd pagina-einde erna → de browser voegde telkens een lege pagina in. Fix: de pagina een
     fractie kleiner dan de printbare hoogte (296mm) + overflow:hidden tegen sub-pixel-overloop; break-after enkel op de niet-
     laatste pagina's. Inhoud is ~268mm (297 − padding), dus 1mm minder knipt niets weg. */
  @media print{ html,body{margin:0;padding:0;background:#fff} .a4{box-shadow:none;margin:0;min-height:0;height:296mm;overflow:hidden;break-after:page;page-break-after:always;break-inside:avoid} .a4:last-child{break-after:auto;page-break-after:auto} table,.card,.hero,.heat-wrap{break-inside:avoid} #pdf-bar,#mailstatus{display:none} }
</style>

<script>
// ============================================================================
//  ENERGIE-ANALYSE — anonieme klant-renderer (toont enkel; rekent niets opnieuw)
// ============================================================================
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _num(x,d){ x=+x||0; return x.toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function eur(x){ return '€ '+_num(x,0); }
function eur2(x){ return '€ '+_num(x,2); }
function pct(x,d){ return _num(x,d==null?0:d)+' %'; }
function signEur(x){ var s=(+x||0)>=0?'+':'−'; return s+' € '+_num(Math.abs(+x||0),0); }

// ---------- heatmap-engine (per uur, mat[24][365]) — groenladder ----------
function heatKleur(t){
  if(t<=0) return '#F2F5F8';
  var stops=[[234,247,238],[154,212,166],[5,176,80],[4,132,67],[11,61,36]];
  var x=Math.min(1,t)*(stops.length-1), i=Math.floor(x), f=x-i, a=stops[i], b=stops[Math.min(stops.length-1,i+1)];
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
// v0.11 (Johan): randkleur voor kengetal-cellen — licht (#E2E8F0) → Energie-Compas-groen (26,140,64). t in [0,1], hoger = gunstiger.
function _kgRand(t){ t=Math.max(0,Math.min(1,+t||0)); return 'rgb('+Math.round(200-(200-26)*t)+','+Math.round(224-(224-140)*t)+','+Math.round(202-(202-64)*t)+')'; }
// mat[24][365]; 0u ONDER → 23u boven, horizontaal 1 jan → 31 dec.
function heatmapSvg(mat, piek){
  if(!mat||!mat.length) return '<div class="note">Geen profiel beschikbaar.</div>';
  var HRS=24, DAYS=mat[0].length||365, padL=16, padB=13, W=760, H=200;
  var mx=+piek||0; if(!(mx>0)){ mat.forEach(function(r){ r.forEach(function(v){ if(v>mx)mx=v; }); }); }
  if(!(mx>0)) mx=1;
  var cw=(W-padL)/DAYS, ch=(H-padB)/HRS, s='';
  s+='<rect x="'+padL+'" y="0" width="'+(W-padL)+'" height="'+(H-padB)+'" fill="#F2F5F8"/>';
  for(var h=0;h<HRS;h++){ for(var d=0;d<DAYS;d++){ var v=mat[h][d]||0; if(v<=0) continue;
    s+='<rect x="'+(padL+d*cw).toFixed(1)+'" y="'+((HRS-1-h)*ch).toFixed(1)+'" width="'+(cw+0.6).toFixed(1)+'" height="'+(ch+0.4).toFixed(1)+'" fill="'+heatKleur(v/mx)+'"/>'; } }
  [0,6,12,18].forEach(function(h){ s+='<text x="2" y="'+((HRS-1-h)*ch+ch*0.5+3).toFixed(1)+'" font-size="8" fill="#5A6577">'+h+'u</text>'; });
  var mnd=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'], cum=0, dpm=[31,28,31,30,31,30,31,31,30,31,30,31];
  for(var mi=0;mi<12;mi++){ var x=padL+cum*cw; s+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>';
    s+='<text x="'+(x+2).toFixed(1)+'" y="'+(H-3)+'" font-size="8" fill="#5A6577">'+mnd[mi]+'</text>'; cum+=dpm[mi]; }
  return '<svg class="heat-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+s+'</svg>';
}
function heatBlok(titel, mat, eenheid, duiding){
  var piek=0; if(mat&&mat.length){ mat.forEach(function(r){ r.forEach(function(v){ if(v>piek)piek=v; }); }); }
  var pk=Math.round(piek*10)/10;
  return '<div class="heat-wrap"><div class="heat-titel">'+esc(titel)+'</div>'+
    (duiding?'<div class="heat-duid">'+esc(duiding)+'</div>':'')+
    heatmapSvg(mat, piek)+
    '<div class="heat-leg"><span>laag</span><span class="bar"></span><span>hoog — piek '+_num(pk,1)+' '+esc(eenheid||'kW')+'</span></div></div>';
}

var F=D.factuur||{}, NUL=F.nul||{}, OPT=F.opt||{};
var besp=(+F.besparing_jaar)|| ( (+NUL.saldo||0)-(+OPT.saldo||0) );   // PV+batterij (basis = spot); hier hangt de investering/TVT aan
var bespPct=(+F.besparing_pct) || ((+NUL.saldo>0)?(besp/(+NUL.saldo)*100):0);
// v0.14 (Johan): de kernvergelijking (cover + factuurvergelijking + TVT) draait volledig op een optimaal dynamisch (spot)
//   contract: zonder installatie (NUL) → met installatie (OPT) = besp. De vergelijking met de échte (vaste) factuur staat
//   ENKEL nog in de onderhandelingsnota (bijlage), als één-maand-energieverschil — niet geëxtrapoleerd naar een jaar.
var O_=D.onderhandeling||{};
// v0.14 (Johan): HEADLINE = INSTALLATIE t.o.v. een OPTIMAAL DYNAMISCH (SPOT) CONTRACT. De vergelijking met de ÉCHTE (vaste)
//   factuur is in wezen een 1-maand→jaar-extrapolatie die te goedkoop/onbetrouwbaar oogt → die hoort NIET op de cover of in de
//   factuurvergelijking, maar ENKEL in de onderhandelingsnota (bijlage), en daar als het bedrag van de factuurmaand (energie),
//   niet geëxtrapoleerd. Cover + factuurvergelijking tonen: dynamisch (spot) contract ZONDER installatie (NUL) → MET installatie
//   (OPT) = besp (PV+batterij) — volledig op kwartierbasis over een jaar → betrouwbaar én overal consistent (cover =
//   factuurvergelijking = terugverdientijd). HUIDIG blijft enkel informatief voor de onderhandelingsnota.
var HUIDIG = (+D.huidig_all_in_jaar>0) ? Math.round(+D.huidig_all_in_jaar) : 0;
var BESP_PCT = (+NUL.saldo>0) ? (besp/(+NUL.saldo)*100) : 0;
function _heroBoxes(){
  return '<div class="box"><span class="l">Dynamisch (spot) contract<br>zonder '+CS+'</span><div class="v">'+eur(NUL.saldo)+'</div><span class="u">per jaar</span></div>'+
    '<div class="arr">→</div>'+
    '<div class="box win"><span class="l">Met '+CN_BR+'</span><div class="v win">'+eur(OPT.saldo)+'</div><span class="u">per jaar</span></div>'+
    '<div class="arr">=</div>'+
    '<div class="box"><span class="l">U bespaart</span><div class="v win">'+eur(besp)+'</div><span class="u">per jaar · '+pct(BESP_PCT,0)+'</span></div>';
}
function _bespRegel(){
  return '<p class="note" style="text-align:center;margin-top:10px">Deze besparing is wat '+CN_PROSE+' oplevert op een <b>optimaal dynamisch (spot) contract</b>, becijferd op kwartierbasis over een volledig jaar. '+
    'De overstap van uw huidige contract naar zo\'n dynamisch contract wordt apart behandeld in de onderhandelingsnota (bijlage).</p>';
}
var combi=D.combi||{};
var HT=D.heat||{};
// aantal volledige batterij-cycli per jaar: exact uit payload of afgeleid uit de ontlaad-heatmap / capaciteit
function _cycliJaar(){
  var cap=(+combi.batt_kwh||0); if(!(cap>0)) return null;
  if(D.financieel && +D.financieel.batt_cycli_jaar) return +D.financieel.batt_cycli_jaar;
  var m=(HT.batt_ontladen&&(HT.batt_ontladen.mat||HT.batt_ontladen));
  if(!m||!m.length) return null;
  var kwh=0; m.forEach(function(r){ r.forEach(function(v){ kwh+=(+v||0); }); });  // kW-gem/uur × 1u = kWh/jaar ontladen
  return kwh/cap;
}
var CYCLI=_cycliJaar();

// FINANCIEEL PLAN over 15 jaar (uit eigen middelen, geen financiering)
function _cashflowSvg(rows, inv, hmm){
  var W=760, H=210, padL=52, padB=26, padT=10, n=rows.length;
  var vals=rows.map(function(r){return r.cumulatief;}); vals.push(-inv);
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx<0) mx=0; if(mn>0) mn=0; var span=(mx-mn)||1;
  var plotH=H-padB-padT, plotW=W-padL-8;
  function y(v){ return padT+(mx-v)/span*plotH; }
  var y0=y(0), bw=plotW/n*0.62, gap=plotW/n;
  var s='';
  // nul-lijn (break-even)
  s+='<line x1="'+padL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-8)+'" y2="'+y0.toFixed(1)+'" stroke="#5A6577" stroke-width="1"/>';
  s+='<text x="'+(padL-6)+'" y="'+(y0+3).toFixed(1)+'" font-size="9" fill="#5A6577" text-anchor="end">€ 0</text>';
  // y-top & y-bottom labels
  s+='<text x="'+(padL-6)+'" y="'+(padT+8)+'" font-size="9" fill="#5A6577" text-anchor="end">'+_fmtK(mx)+'</text>';
  s+='<text x="'+(padL-6)+'" y="'+(H-padB+2)+'" font-size="9" fill="#5A6577" text-anchor="end">'+_fmtK(mn)+'</text>';
  rows.forEach(function(r,i){
    var x=padL+i*gap+(gap-bw)/2, yv=y(r.cumulatief);
    var pos=r.cumulatief>=0;
    var top=pos?yv:y0, hgt=Math.abs(yv-y0);
    s+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,hgt).toFixed(1)+'" rx="1.5" fill="'+(pos?'#05B050':'#C7CCD1')+'"/>';

function _fmtK(v){ v=+v||0; var a=Math.abs(v); var s=(v<0?'−':''); if(a>=1000) return s+'€ '+_num(a/1000,a>=100000?0:1)+'k'; return s+'€ '+_num(a,0); }
// v0.11 (Johan): herbruikbaar → 1× normaal (spot-sturing) + 1× "potentieel met onbalans" (P5-bis). energieOverride vervangt
//   de jaar-1 energiebesparing (de onbalans-extra is commodity/spot → indexeert op inflatie, net als 'rest').
function financieelPagina(energieOverride, titelArg, extraNote){
  var BW=D.battwaarde||null;
  var FIN=D.financieel||{};
  var invBruto=(BW&&+BW.invTot)||+FIN.investering||0;
  if(!(invBruto>0)) return;
  var verzw=(BW&&+BW.verzwaring)||0;
  var netInv=(BW&&BW.netInv!=null)?+BW.netInv:invBruto;
  var energie=(BW&&BW.energie!=null)?+BW.energie:((+FIN.besparing_jaar)||besp);
  if(energieOverride!=null && isFinite(+energieOverride)) energie=+energieOverride;
  var cap=(BW&&+BW.cap)||0;
  // v0.11 (Johan): TWEE-FACTUREN gesplitste indexatie. besp_net = netkosten-deel van de jaarbesparing; de rest = commodity/heffingen.
  var bespNet=(BW&&BW.besp_net!=null)?+BW.besp_net:0; bespNet=Math.max(0,Math.min(bespNet,energie));
  var rest=energie-bespNet;
  var HOR=(BW&&+BW.horizon)||15;
  var infl=((BW&&BW.inflatie_pct!=null)?+BW.inflatie_pct:(FIN.energieprijs_stijging_pct!=null?+FIN.energieprijs_stijging_pct:2))/100;
  var extra=((BW&&BW.net_extra_pct!=null)?+BW.net_extra_pct:0)/100;
  var dubJ=(BW&&+BW.net_dubbel_jaar)||9999, dubF=(BW&&+BW.net_dubbel_factor)||1, y0=(new Date()).getFullYear();
  var besp1=energie+cap;
  var opexJ=(BW && +BW.opex_jaar>0) ? +BW.opex_jaar : ((BW && +BW.opex_maand>0) ? +BW.opex_maand*12 : 0);   // v0.14.9 (Johan): JAARLIJKSE exploitatiekost → (geïndexeerd) in mindering (opex_maand = oude sleutel, fallback)
  var rows=[], cum=-netInv, tvt=null, som=0;
  for(var t=1;t<=HOR;t++){ var jaar=y0+(t-1);
    var eB=rest*Math.pow(1+infl,t-1);                                                    // commodity/heffingen → inflatie
    var nB=(bespNet+cap)*Math.pow((1+infl)*(1+extra),t-1)*(jaar>=dubJ?dubF:1);           // netkosten-deel + vermeden capaciteitstarief → sneller pad + 2029
    var oB=opexJ*Math.pow(1+infl,t-1);                                                   // exploitatiekost → inflatie, in mindering
    var b=eB+nB-oB; som+=b; var prev=cum; cum+=b;
    if(tvt===null && cum>=0) tvt=(t-1)+(prev<0?(-prev/b):0);
    rows.push({ jaar:t, besparing:b, cumulatief:cum });
  }
  var meerwaarde=som-netInv;
  var roi15=netInv>0?(meerwaarde/netInv*100):0;
  var rendGem=netInv>0?(som/HOR/netInv*100):0;

  var h=kop(titelArg||'Financieel plan over 15 jaar');
  if(extraNote) h+=extraNote;
  h+='<p class="lead">Deze berekening gaat uit van een investering <b>uit eigen middelen</b> (geen lening of leasing). '+
     'Ze toont wat u elk jaar bespaart en wanneer uw investering is terugverdiend.'+(BW?' De <b>netkosten stijgen</b> jaarlijks (inflatie + '+_num(extra*100,0)+' %'+(dubJ<9999?', met een eenmalige verdubbeling in '+dubJ:'')+') — dat maakt de batterij elk jaar waardevoller.':'')+'</p>';
  h+='<div class="hero" style="grid-template-columns:1fr 1fr 1fr 1fr">'+
       '<div class="box"><span class="l">'+(verzw>0?'Netto-investering<br>(na vermeden verzwaring)':'Investering<br>(eigen middelen)')+'</span><div class="v">'+eur(netInv)+'</div><span class="u">'+(verzw>0?('bruto '+eur(invBruto)+' − '+eur(verzw)):'eenmalig')+'</span></div>'+
       '<div class="box win"><span class="l">Terugverdiend na</span><div class="v win">'+(tvt!=null?_num(tvt,1)+' j':'> 15 j')+'</div><span class="u">break-even</span></div>'+
       '<div class="box"><span class="l">Netto meerwaarde<br>na 15 jaar</span><div class="v">'+eur(meerwaarde)+'</div><span class="u">na aftrek investering</span></div>'+
       '<div class="box"><span class="l">Rendement<br>(gemiddeld/jaar)</span><div class="v">'+pct(rendGem,0)+'</div><span class="u">15j · ROI '+pct(roi15,0)+'</span></div>'+
     '</div>';
  // v0.14.11 (Johan): kost slimme sturing = SOM van PV (0,72 €/kVA-omvormer/mnd × 12) + batterij (1,2 €/kVA/mnd × 12),
  //   elk op zijn eigen vermogen. PV-omvormer-kVA ≈ pv_kwp (geen aparte omvormer-kVA in het dossier); batterij-kVA = batt_kw.
  //   Anoniem (geen merknaam). Informatief; de opgegeven exploitatiekost zit al in de cashflow.
  (function(){
    var _pvKva   = (+combi.pv_kwp || +_V0.pv_kwp || 0);          // omvormer-kVA-proxy = PV-kWp
    var _battKva = (+combi.batt_kw || +_V0.batt_kw || 0);        // batterij-kVA = vermogen (kW)
    var _stuurPV   = HAS_PV   ? Math.round(0.72 * _pvKva   * 12) : 0;
    var _stuurBatt = HAS_BATT ? Math.round(1.2  * _battKva * 12) : 0;
    var _sturingskost = _stuurPV + _stuurBatt;
    if(opexJ>0 || _sturingskost>0){
      var _dl=[];
      if(opexJ>0) _dl.push('opgegeven exploitatiekost '+eur(opexJ)+'/jaar');
      if(_sturingskost>0) _dl.push('kost slimme sturing ± '+eur(_sturingskost)+'/jaar');
      h+='<p class="note" style="margin-top:8px"><b>Jaarlijkse exploitatiekosten:</b> '+_dl.join(' · ')+'.'+(opexJ>0?' De opgegeven exploitatiekost is in bovenstaande terugverdientijd en cashflow verrekend.':'')+'</p>';
    }
  })();
  if(BW && (cap>0 || verzw>0)){
    h+='<p class="note" style="margin-top:8px">Besparing jaar 1 = factuurbesparing (energie + netgebruik) '+eur(energie)+(cap>0?(' + vermeden capaciteitstarief '+eur(cap)):'')+' = <b>'+eur(besp1)+'/jaar</b>'+(verzw>0?('. Daarnaast vermijdt de batterij een <b>aansluitingsverzwaring</b> van '+eur(verzw)+' (eenmalig, in mindering op de investering)'):'')+'.</p>';
  }
  // v0.14.12 (Johan): grafiekhoogte iets kleiner (46mm) zodat de "Jaar per jaar"-tabel er integraal onder past;
  //   op de onbalans-variant (extraNote → extra caveat-blok van ~16mm) een compactere grafiek (32mm) voor headroom.
  h+='<div class="heat-wrap"><div class="heat-titel">Cumulatieve cashflow (eigen middelen)</div>'+
     '<div class="heat-duid">Onder de lijn = investering nog niet terugverdiend · boven de lijn = winst.</div>'+
     _cashflowSvg(rows, netInv, extraNote?27:46)+'</div>';
  h+='<h2>Jaar per jaar</h2>';
  // v0.14.12 (Johan): 2 kolommen (jaar 1–8 | 9–15) → compact, past integraal op de pagina i.p.v. weggeknipt te worden.
  h+='<div class="jpj-grid">';
  (function(){ var _half=Math.ceil(rows.length/2);
    [[0,_half],[_half,rows.length]].forEach(function(rg){
      h+='<table class="f jpj"><thead><tr><th>Jaar</th><th>Besparing</th><th>Cumulatief</th></tr></thead><tbody>';
      rows.slice(rg[0],rg[1]).forEach(function(r){
        h+='<tr><td>Jaar '+r.jaar+'</td><td>'+eur(r.besparing)+'</td><td class="'+(r.cumulatief>=0?'pos':'neg')+'">'+(r.cumulatief>=0?'+ ':'− ')+'€ '+_num(Math.abs(r.cumulatief),0)+'</td></tr>';
      });
      h+='</tbody></table>';
    });
  })();
  h+='</div>';
  h+='<p class="note">Aannames: investering uit eigen middelen, geen financieringskosten; besparing jaar 1 = '+eur(besp1)+
     (opexJ>0?(' − exploitatiekost '+eur(opexJ)+'/jaar = <b>'+eur(besp1-opexJ)+' netto jaar 1</b>'):'')+
     '. Kosten geïndexeerd met '+_num(infl*100,0)+' %/jaar'+(BW&&extra>0?(', het netkosten-deel van de besparing (net­gebruik + capaciteitstarief) met inflatie + '+_num(extra*100,0)+' %/jaar'+(dubJ<9999?' + eenmalige verdubbeling in '+dubJ:'')):'')+
     '. Bedragen exclusief btw. Indicatieve raming, geen persoonlijk financieel advies.</p>';
  pagina(h);
}

    if(_cm.spot_evolutie && _cm.spot_evolutie.periode_maand_gem_eur_mwh!=null && _cm.spot_evolutie.trailing_gem_eur_mwh!=null){

    var _dNu=+o.energie_nu_mwh||0, _dDyn=+o.energie_dyn_mwh||0, _mb=Math.max(0,Math.round((_dNu-_dDyn)*_maandMwh));

           '<div class="box win"><span class="l">Besparing op energie<br>voor één maand</span><div class="v win">± '+eur(_mb)+'</div><span class="u">een gemiddelde maand</span></div>'+

  h+='<ul class="check">'+
       '<li><b>Dynamisch (spot) afnametarief</b> gekoppeld aan de day-ahead-marktprijs, met een zo laag mogelijke opslag (€/MWh) en transparante doorrekening.</li>'+
       (HAS_INJ?'<li><b>Marktconforme injectievergoeding</b> — bij voorkeur eveneens spot-gekoppeld, zodat u profiteert op uren met hoge prijzen.</li>':'')+
       '<li><b>Geen of lage vaste vergoeding</b> en geen onnodige capaciteits- of abonnementskosten bovenop het netgedeelte.</li>'+
       '<li><b>Kwartierafrekening</b> op uw digitale meter, zodat uw slim laden'+(HAS_BATT?' en uw batterij':'')+' effectief verrekend worden.</li>'+
       (HAS_BATT?'<li><b>Correcte capaciteitscomponent</b>: laat uw afgevlakte piek (dankzij de batterij) meenemen in de tarifering.</li>':'')+
       '<li><b>Looptijd & opzeg</b> die u toelaten mee te bewegen met de markt (vermijd lange vaste contracten net nu).</li>'+

// A1b — ENERGIEBALANS: zelfconsumptie & zelfvoorziening (v0.15.0, Johan). Vóór A2 (injectiesturing).
//   Twee donuts (PV-bestemming = zelfconsumptie; verbruik-dekking = zelfvoorziening, direct vs via de batterij)
//   + een maand-staafdiagram (positief: PV direct + via batterij; negatief: injectie). Data: D.zelfconsumptie
//   (server v15.212 / simulator v1.14.5). Enkel zinvol met PV → anders overgeslagen (dynamische bijlagenummering).
(function(){
  var Z=D.zelfconsumptie; if(!Z||!HAS_PV) return;
  var GRN='#05B050', BLW='#2E7CB8', AMB='#E8A33D', GRY='#9AA7B4';
  var MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  var prod=+Z.pv_productie_mwh||0, dir=+Z.pv_direct_mwh||0, vb=+Z.pv_via_batt_mwh||0, inj=+Z.pv_injectie_mwh||0;
  var verbr=+Z.verbruik_mwh||0, rte=((+Z.rte_pct||92))/100;
  var vbLoad=Math.round(vb*rte*10)/10;                       // PV via batterij die effectief de last dekt (na omzetverlies)
  var net=Math.max(0, Math.round((verbr-dir-vbLoad)*10)/10); // rest van het verbruik komt van het net
  var zcPct=prod>0?Math.round((dir+vb)/prod*100):0;          // zelfconsumptie incl. via batterij
  var zvPct=verbr>0?Math.round((dir+vbLoad)/verbr*100):0;    // zelfvoorziening incl. via batterij
  function _donut(segs, big, sub){
    var tot=0; segs.forEach(function(s){ tot+=Math.max(0,+s.val||0); }); if(!(tot>0)) tot=1;
    var R=52,cx=68,cy=68,sw=20,C=2*Math.PI*R,off=0,arcs='';
    segs.forEach(function(s){ var len=Math.max(0,+s.val||0)/tot*C;
      arcs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>'; off+=len; });
    return '<svg viewBox="0 0 136 136" width="130" height="130">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#EEF1F5" stroke-width="'+sw+'"/>'+
      '<g transform="rotate(-90 '+cx+' '+cy+')">'+arcs+'</g>'+
      '<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" font-size="24" font-weight="800" fill="#12233b">'+esc(big)+'</text>'+
      '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="8.5" fill="#5A6577">'+esc(sub||'')+'</text></svg>';
  }
  function _leg(segs){ var l='<div class="don-leg">'; segs.forEach(function(s){
      var pct=s.tot>0?Math.round(s.val/s.tot*100):0;
      l+='<div class="don-row"><span class="don-sw" style="background:'+s.color+'"></span><span class="don-lb">'+esc(s.label)+'</span>'+
         '<span class="don-vl">'+_num(s.val, s.val<10?1:0)+' MWh · '+pct+'%</span></div>'; });
    return l+'</div>'; }
  function _maandBalans(m){
    m=m||{};
    var D1=(m.pv_direct_mwh||[]).map(function(v){return +v||0;}),
        D2=(m.pv_via_batt_mwh||[]).map(function(v){return +v||0;}),
        IN=(m.pv_injectie_mwh||[]).map(function(v){return +v||0;});
    var n=12, maxP=0, maxN=0, i;
    for(i=0;i<n;i++){ var p=(D1[i]||0)+(D2[i]||0); if(p>maxP)maxP=p; if((IN[i]||0)>maxN)maxN=IN[i]||0; }
    var tot=maxP+maxN; if(!(tot>0)) tot=1;
    var W=760,H=250,padL=30,padT=16,padB=30, plotH=H-padT-padB, s=plotH/tot, yZero=padT+maxP*s, gw=(W-padL)/n, bw=gw*0.6;
    var svg='<rect x="'+padL+'" y="'+padT+'" width="'+(W-padL)+'" height="'+plotH.toFixed(1)+'" fill="#F7F9FB"/>';
    svg+='<line x1="'+padL+'" y1="'+yZero.toFixed(1)+'" x2="'+W+'" y2="'+yZero.toFixed(1)+'" stroke="#B4BECC" stroke-width="1"/>';
    for(i=0;i<n;i++){
      var x=padL+i*gw+(gw-bw)/2;
      var hd=(D1[i]||0)*s, hb=(D2[i]||0)*s, hi=(IN[i]||0)*s;
      var yd=yZero-hd; svg+='<rect x="'+x.toFixed(1)+'" y="'+yd.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,hd).toFixed(1)+'" fill="'+GRN+'"/>';
      var yb=yd-hb; svg+='<rect x="'+x.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,hb).toFixed(1)+'" fill="'+BLW+'"/>';
      svg+='<rect x="'+x.toFixed(1)+'" y="'+yZero.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,hi).toFixed(1)+'" fill="'+AMB+'"/>';
      svg+='<text x="'+(padL+i*gw+gw/2).toFixed(1)+'" y="'+(H-15)+'" font-size="8" text-anchor="middle" fill="#5A6577">'+MND[i]+'</text>';
    }
    return '<svg class="heat-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:56mm">'+svg+'</svg>';
  }
  var totP=dir+vb+inj, totV=dir+vbLoad+net;
  var seg1=[{val:dir,color:GRN,label:'Direct zelfverbruik',tot:totP},{val:vb,color:BLW,label:'Via de batterij',tot:totP},{val:inj,color:AMB,label:'Injectie op het net',tot:totP}];
  var seg2=[{val:dir,color:GRN,label:'PV — direct',tot:totV},{val:vbLoad,color:BLW,label:'PV — via de batterij',tot:totV},{val:net,color:GRY,label:'Van het net',tot:totV}];
  if(!HAS_BATT){ seg1=[seg1[0],seg1[2]]; seg2=[seg2[0],seg2[2]]; }   // geen batterij → geen "via batterij"-segment
  var h=_bijlage('Zelfconsumptie & zelfvoorziening');
  h+='<p class="lead">Deze bijlage toont hoe uw zonnestroom wordt ingezet en hoeveel van uw verbruik u zelf dekt'+
     (HAS_BATT?' — rechtstreeks én via de batterij':'')+'. Links: waar uw <b>PV-productie</b> naartoe gaat '+
     '(zelf verbruikt vs geïnjecteerd). Rechts: hoe uw <b>verbruik</b> wordt gedekt (eigen zon vs het net).</p>';
  h+='<div class="don-wrap">'+
       '<div class="don-card"><div class="don-t">Zelfconsumptie van uw PV</div>'+_donut(seg1, zcPct+'%','zelf verbruikt')+_leg(seg1)+
         '<div class="don-foot">PV-productie: <b>'+_num(prod,prod<100?1:0)+' MWh/jaar</b></div></div>'+
       '<div class="don-card"><div class="don-t">Zelfvoorziening van uw verbruik</div>'+_donut(seg2, zvPct+'%','zelf voorzien')+_leg(seg2)+
         '<div class="don-foot">Jaarverbruik: <b>'+_num(verbr,verbr<100?1:0)+' MWh/jaar</b></div></div>'+
     '</div>';
  if(HAS_BATT) h+='<p class="note"><b>Zelfconsumptie</b> = het deel van uw zonnestroom dat u zelf verbruikt (rest = injectie). '+
     '<b>Zelfvoorziening</b> = het deel van uw verbruik dat u met eigen zon dekt (rest = afname van het net). '+
     '"Via de batterij" is zonnestroom die u overdag opslaat en later verbruikt, na omzetverlies (± '+Math.round(rte*100)+'% rendement).</p>';
  h+='<div class="heat-wrap"><div class="heat-titel">Energiebalans per maand (MWh) — zelfconsumptie boven de nullijn, injectie eronder</div>'+
     _maandBalans(Z.maand)+
     '<div class="don-leg don-leg-h">'+
       '<div class="don-row"><span class="don-sw" style="background:'+GRN+'"></span><span class="don-lb">PV — direct zelfverbruik</span></div>'+
       (HAS_BATT?'<div class="don-row"><span class="don-sw" style="background:'+BLW+'"></span><span class="don-lb">PV — via de batterij</span></div>':'')+
       '<div class="don-row"><span class="don-sw" style="background:'+AMB+'"></span><span class="don-lb">Injectie op het net</span></div>'+
     '</div></div>';
  pagina(h);
})();

// A6 — kengetallen-roosters (PV×batterij per kengetal). Elk rooster een gekleurde tabel in rapportstijl, onder elkaar.
//   Data: D.kengetallen = { pv_as:[kolomlabels], batt_as:[rijlabels], roosters:[{key,titel,mat:[[{t,txt,best}]]}] } uit EK.
(function(){
  var K=D.kengetallen; if(!K || !Array.isArray(K.roosters) || !K.roosters.length) return;
  var pvAs=K.pv_as||[], battAs=K.batt_as||[];
  function tabel(R){
    var s='<div class="kg"><h3 class="kg-t">'+esc(R.titel)+'</h3><div class="kg-scroll"><table class="kg-tab"><thead><tr><th class="kg-hoek"></th>';
    pvAs.forEach(function(c){ s+='<th>'+esc(c)+'</th>'; });
    s+='</tr></thead><tbody>';
    (R.mat||[]).forEach(function(row,ri){
      s+='<tr><td class="kg-ax">'+esc(battAs[ri]||'')+'</td>';
      (row||[]).forEach(function(cel){
        var t=(cel&&cel.t!=null)?cel.t:null;
        // v0.11 (Johan): niet de cel invullen, maar de RAND lichter/donkerder kleuren (licht → Energie-Compas-groen).
        var rand=(t==null)?'#E2E8F0':_kgRand(t);
        // v0.15.1 (Johan, bouwplan §6d): lichtrode transparante achtergrond op élke cel die de dagelijkse km-vraag niet
        //   100% dekt (cel.km < 100), in álle kengetallen-roosters.
        var kmbg=(cel&&cel.km!=null&&cel.km<100)?'background:rgba(220,38,38,0.13);':'';
        s+='<td class="kg-cel'+(cel&&cel.best?' kg-best':'')+'" style="border-color:'+rand+';'+kmbg+'">'+esc(cel?cel.txt:'')+'</td>';
      });
      s+='</tr>';
    });
    return s+'</tbody></table></div></div>';
  }
  // ~3 roosters per A4 → over meerdere pagina's; eerste pagina krijgt het bijlagenummer, vervolg een "(vervolg)"-kop.
  var per=3;
  for(var i=0;i<K.roosters.length;i+=per){
    var grp=K.roosters.slice(i,i+per);
    var h=(i===0)?_bijlage('Alle kengetallen per combinatie'):kop('Alle kengetallen per combinatie (vervolg)');
    if(i===0){ h+='<p class="lead">Voor elke combinatie van zonnepanelen (horizontaal) en batterij (verticaal) tonen we per kengetal het resultaat. '+
      '<b>Donkerder = gunstiger.</b> Het <b>gestreepte</b> vakje is de in dit rapport gekozen combinatie.</p>';
      // v0.15.1 (Johan §6c/§6d): bij een laadplein — legende lichtrood + km-dekking zonder installatie.
      if(K.heeftLaadplein){ h+='<p class="note"><span style="display:inline-block;width:12px;height:12px;background:rgba(220,38,38,0.13);border:1px solid #E2E8F0;vertical-align:middle;margin-right:4px"></span> '+
        '<b>Lichtrood</b> = deze combinatie dekt niet 100% van de dagelijkse km-vraag van het laadplein.'+
        (K.km_dekking_voor!=null?(' Zonder installatie wordt ± '+_num(K.km_dekking_voor,0)+'% van de dagelijkse km-vraag geladen.'):'')+'</p>'; }
    }
    grp.forEach(function(R){ h+=tabel(R); });
    pagina(h);
  }
})();

// ============================================================================
//  PDF (client-side) + optioneel: PDF naar de klant mailen via EK
// ============================================================================
// v0.11.2 (Johan) — PDF-CONSISTENTIE. html2canvas 1.4.1 is onbetrouwbaar met (a) inline-SVG met enkel CSS-breedte → heatmaps
//   vielen weg; en (b) object-fit:cover op <img> → banner werd uitgerekt (kompas platgeduwd). Oplossing: ELKE SVG en elke
//   banner-afbeelding wordt VÓÓR de capture zelf naar een PNG omgezet, met de CORRECTE verhouding (cover-crop met de juiste
//   aspect ratio), en tijdelijk in de DOM geplaatst. html2canvas rendert daarna enkel nog gewone <img>'s → betrouwbaar.
function _loadImg(src){ return new Promise(function(res){ var im=new Image(); im.crossOrigin='anonymous'; im.onload=function(){res(im);}; im.onerror=function(){res(null);}; im.src=src; }); }
function _pngFrom(w,h,draw){ var s=2, cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s)); var ctx=cv.getContext('2d'); ctx.scale(s,s); draw(ctx,w,h); return cv.toDataURL('image/png'); }
function _drawCover(ctx,im,w,h){ var ir=im.naturalWidth/im.naturalHeight, tr=w/h, sw,sh,sx,sy; if(ir>tr){ sh=im.naturalHeight; sw=sh*tr; sx=(im.naturalWidth-sw)/2; sy=0; } else { sw=im.naturalWidth; sh=sw/tr; sx=0; sy=(im.naturalHeight-sh)/2; } ctx.drawImage(im,sx,sy,sw,sh,0,0,w,h); }
async function _rasterizeForPdf(){
  var restore=[];
  // 1) inline-SVG → PNG (zelfde px-grootte)
  var svgs=[].slice.call(document.querySelectorAll('#rapport svg'));
  for(var i=0;i<svgs.length;i++){
    var sv=svgs[i], r=sv.getBoundingClientRect(); if(!(r.width>0&&r.height>0)) continue;
    var clone=sv.cloneNode(true); clone.setAttribute('width',Math.round(r.width)); clone.setAttribute('height',Math.round(r.height));
    if(!clone.getAttribute('xmlns')) clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    var xml=new XMLSerializer().serializeToString(clone);
    var im=await _loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)); if(!im) continue;
    var png=_pngFrom(r.width,r.height,function(ctx,w,h){ ctx.drawImage(im,0,0,w,h); });
    var el=document.createElement('img'); el.src=png; el.style.cssText='display:block;width:'+r.width+'px;height:'+r.height+'px';
    sv.style.display='none'; sv.parentNode.insertBefore(el,sv); restore.push([sv,el]);
  }
  // 2) banner-afbeeldingen (object-fit:cover) → PNG met correcte cover-crop → geen uitgerekt/plat kompas
  var bands=[].slice.call(document.querySelectorAll('#rapport .band-top, #rapport .band'));
  for(var j=0;j<bands.length;j++){
    var bi=bands[j], rb=bi.getBoundingClientRect(); if(!(rb.width>0&&rb.height>0)) continue;
    var im2=await _loadImg(bi.currentSrc||bi.src); if(!im2) continue;
    var png2=_pngFrom(rb.width,rb.height,function(ctx,w,h){ _drawCover(ctx,im2,w,h); });
    var cs=getComputedStyle(bi);
    var el2=document.createElement('img'); el2.src=png2; el2.style.cssText='display:block;width:'+rb.width+'px;height:'+rb.height+'px;margin:'+cs.margin;
    bi.style.display='none'; bi.parentNode.insertBefore(el2,bi); restore.push([bi,el2]);
  }
  return restore;
}
async function _genPdf(){
  if(!window.jspdf||!window.html2canvas) throw new Error('PDF-bibliotheken niet geladen (internetverbinding?)');
  var pages=document.querySelectorAll('.a4');
  var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  var restore=await _rasterizeForPdf();
  try{
    for(var i=0;i<pages.length;i++){
      var canvas=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      var img=canvas.toDataURL('image/jpeg',0.92);
      var hh=canvas.height*210/canvas.width;
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,210,hh>297?297:hh);
    }
  } finally {
    restore.forEach(function(x){ try{ x[0].style.display=''; if(x[1]&&x[1].parentNode) x[1].parentNode.removeChild(x[1]); }catch(e){} });
  }
  return pdf;
}

// Bij ECHTE data met een e-mailadres: EK laat het rapport als PDF naar de klant mailen (fire-and-forget, 1×).
(function(){
  if(window._DEMO) return;
  // v0.14.4 (Johan): de zware html2canvas-PDF draait NIET meer automatisch bij het openen (dat maakte "Toon rapport" traag —
  //   de SVG-render is snel, maar html2canvas hertekent élke pagina pixel per pixel op 2×). Enkel in ?mode=mail (achtergrond-
  //   tabblad, geopend door de knop "Mail mij het rapport") wordt de PDF gemaakt, gemaild als link, en sluit het tabblad zich.
  var _MAILMODE=((new URLSearchParams(location.search).get('mode')||'').toLowerCase()==='mail');
  if(!_MAILMODE) return;
  if(!(D.mail && D.token)) return;
  var API = D.api || 'https://lucid-amazement-production.up.railway.app';
  function status(t){ var el=document.getElementById('mailstatus'); if(!el){ el=document.createElement('div'); el.id='mailstatus'; document.body.appendChild(el); } el.textContent=t; }
  setTimeout(async function(){
    try{
      status('⏳ Rapport wordt als PDF naar u verstuurd…');
      var pdf=await _genPdf();
      var b64=pdf.output('datauristring');   // 'data:application/pdf;base64,....'
      var r=await fetch(API+'/api/ek-rapport-mail',{ method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ token:D.token, mail:D.mail, project_id:PID||'', als_link:true, pdf_base64:b64, filename:'Energie-analyse'+(PID?'_'+PID:'')+'.pdf' }) });   // v0.14.3 (Johan): link i.p.v. bijlage
      var j=await r.json().catch(function(){return{};});
      if(j&&j.ok){ status(j.throttled?'✓ Rapport is recent al verstuurd — u kan dit tabblad sluiten.':'✓ Rapport is naar u gemaild (PDF-link + link terug naar uw resultaten). U kan dit tabblad sluiten.');
        setTimeout(function(){ try{ window.close(); }catch(e){} }, 3500); }   // v0.14.4 (Johan): achtergrond-tabblad sluit zichzelf na het mailen
      else status('Mailen lukte niet — sluit dit tabblad en probeer opnieuw via "Mail mij het rapport".');
    }catch(e){ status('Mailen lukte niet — sluit dit tabblad en probeer opnieuw via "Mail mij het rapport".'); }
    setTimeout(function(){ var el=document.getElementById('mailstatus'); if(el) el.style.opacity='0.55'; }, 6000);
  }, 400);
})();

// ============================================================================

function _demo(){
  function mat(fn){ var m=[]; for(var h=0;h<24;h++){ var row=[]; for(var d=0;d<365;d++){ row.push(Math.max(0, fn(h,d))); } m.push(row); } return m; }
  var TWO_PI=Math.PI*2;
  var solar=function(h,d){ var day=Math.sin((d/365)*Math.PI); var sun=Math.max(0,Math.sin(((h-6)/12)*Math.PI)); return 260*sun*(0.55+0.6*day); };
  var evload=function(h,d){ var night=(h>=22||h<6)?1:0.06; var wk=((d%7)<5)?1:0.4; return 180*night*wk*(0.8+0.4*Math.random()); };
  var afnGeb=function(h,d){ var work=(h>=7&&h<19)?1:0.25; var wk=((d%7)<5)?1:0.5; return 70*work*wk; };
  return {
    project_id:'VB-2026-001', datum:'september 2026',
    klant:{ naam:'Voorbeeld NV', btw:'BE 0123.456.789' },
    aansluiting:{
      verbruiksadres:'Industrieweg 12, 9000 Gent',

      injectie:{ ean:'541448000000067890', piek_kw:400, injectie_mwh:210 },
      metertype:'Digitale meter (kwartierregistratie)',
      profiel:'Industrie / productie (gemeten profiel)'
    },
    voorstel:{ pv_kwp:500, batt_kw:500, batt_kwh:1000, batt_cycli:210,
      laadpalen_ac:{ kva:22, aantal:21 }, laadpalen_dc:{ kva:160, aantal:4 } },
    creg_eur_per_mwh:322,
    combi:{ pv_kwp:500, batt_kwh:1000 },
    factuur:{
      nul:{ energie:280000, netkosten:96000, heffingen:32000, injectie_opbrengst:0, saldo:408000 },
      opt:{ energie:112000, netkosten:66000, heffingen:23000, injectie_opbrengst:22000, saldo:201000 },
      besparing_jaar:207000, besparing_pct:51
    },
    onderhandeling:{ afname_marge_jaar:18000, injectie_marge_jaar:9000, digitale_meter:true },
    financieel:{ investering:940000, besparing_jaar:207000, energieprijs_stijging_pct:3, batt_cycli_jaar:210,
      posten:[ {label:'Zonnepanelen (500 kWp)', bedrag:375000}, {label:'Batterij (1.000 kWh)', bedrag:350000},
               {label:'Laadinfrastructuur & laadpalen', bedrag:150000}, {label:'Aansluiting, kabeltracé & installatie', bedrag:65000} ] },
    heeftLaadplein:true,
    heat:{
      injectie_gewoon:{ mat:mat(function(h,d){ return Math.max(0, solar(h,d)-afnGeb(h,d)); }), eenheid:'kW' },
      injectie_spot:{ mat:mat(function(h,d){ var i=Math.max(0, solar(h,d)-afnGeb(h,d)); return i*(0.4+0.4*Math.sin((h/24)*TWO_PI)); }), eenheid:'kW' },
      injectie_onbalans:{ mat:mat(function(h,d){ var i=Math.max(0, solar(h,d)-afnGeb(h,d)); return i*(0.3+0.5*Math.abs(Math.sin((d/30)))); }), eenheid:'kW' },
      laadplein:[ { naam:'Laadplein 1', mat:mat(evload), eenheid:'kW' } ],
      batt_soc:{ mat:mat(function(h,d){ return 300+700*Math.max(0,Math.sin(((h-9)/14)*Math.PI)); }), eenheid:'kWh' },
      batt_ontladen:{ mat:mat(function(h,d){ return (h>=17&&h<22)?300*(0.6+0.4*Math.random()):0; }), eenheid:'kW' },
      batt_laden:{ mat:mat(function(h,d){ return (h>=9&&h<15)?280*(0.6+0.4*Math.random()):((h<5)?120:0); }), eenheid:'kW' },
      afname_asis:{ mat:mat(afnGeb), eenheid:'kW' },
      afname_laden_zonder:{ mat:mat(function(h,d){ return afnGeb(h,d)+evload(h,d); }), eenheid:'kW' },
      afname_met_sturing:{ mat:mat(function(h,d){ return Math.max(0, afnGeb(h,d)+evload(h,d)*0.5-solar(h,d)*0.5); }), eenheid:'kW' }
    }
  };
}
