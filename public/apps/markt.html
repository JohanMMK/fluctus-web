<div id="app"><div class="laden">⏳ Uw profiel op de markt wordt geladen…</div></div>
<script>
(function(){

var Q=new URLSearchParams(location.search), MID=Q.get('mid')||'', PDF=false;   // v0.11.0 (Johan 30-10): geen PDF-inleiding meer — de pagina is HTML (oude ?pdf=1-links tonen het overzicht)
var D=null, KEY=null, STAP=1, ELIA={}, SPEEL=null, CUR=null, MERK=null;
var VOLG=['cu','co','zc','on','pk','lg','gk','cb','ar','pl','pg'];
// v0.13.0 (Johan 30-10): TAAL — ?lang=nl|fr|en wint; anders D.lang van het dossier (na het laden); vóór het laden (aanmelden, fouten) de browsertaal; anders nl.
var LQ=String(Q.get('lang')||'').toLowerCase().slice(0,2); if(!/^(nl|fr|en)$/.test(LQ)) LQ='';
var LANG=LQ||(function(){ var n=String((navigator.language||'')).toLowerCase().slice(0,2); return (n==='fr'||n==='en')?n:'nl'; })(), LOC='nl-BE';
function T(n,f,e){ return LANG==='fr'?f:(LANG==='en'?e:n); }
var NAAM, GROEP, KORT, STAPPEN, UITLEG;
function zetTaal(l){
  LANG=(l==='fr'||l==='en')?l:'nl'; LOC={nl:'nl-BE',fr:'fr-BE',en:'en-GB'}[LANG];
  try{ document.documentElement.lang=LANG; }catch(e){}
  document.title=T('Uw profiel op de markt','Votre profil sur le marché','Your profile on the market')+(MERK&&MERK.naam?' — '+MERK.naam:'');
  NAAM=T({cu:'Panelen af bij een negatieve spotprijs',co:'Panelen sturen op de onbalans',zc:'Zonnestroom bewaren voor dure momenten',on:'Het net helpen met de batterij (onbalans)',
    pk:'Uw hoogste piek afvlakken',lg:'Laden als uw eigen verbruik laag is',gk:'Goedkoop inkopen',cb:'Goedkoop én onder uw piek laden',ar:'Goedkoop kopen, duur verkopen',
    pl:'Laden op de parking zonder piek',pg:'Laden op de parking buiten de piek'},
   {cu:'Couper les panneaux quand le prix spot est négatif',co:'Piloter les panneaux selon le déséquilibre',zc:'Garder l’énergie solaire pour les moments chers',on:'Aider le réseau avec la batterie (déséquilibre)',
    pk:'Écrêter votre pointe la plus haute',lg:'Charger quand votre consommation est basse',gk:'Acheter bon marché',cb:'Charger bon marché et sous votre pointe',ar:'Acheter bon marché, revendre cher',
    pl:'Recharger au parking sans pointe',pg:'Recharger au parking hors de la pointe'},
   {cu:'Panels off when the spot price is negative',co:'Steering the panels on imbalance',zc:'Saving solar power for expensive moments',on:'Helping the grid with the battery (imbalance)',
    pk:'Shaving your highest peak',lg:'Charging when your own use is low',gk:'Buying cheap',cb:'Charging cheap and below your peak',ar:'Buy cheap, sell high',
    pl:'Charging at the car park without a peak',pg:'Charging at the car park outside the peak'});
  var g0=T('Zonder batterij','Sans batterie','Without a battery'), g1=T('Met een batterij','Avec une batterie','With a battery'), g2=T('Laden op uw bedrijfsparking','Recharger sur le parking de votre entreprise','Charging at your company car park');
  GROEP={cu:g0,co:g0,zc:g1,on:g1,pk:g1,lg:g1,gk:g1,cb:g1,ar:g1,pl:g2,pg:g2};
  KORT=T({cu:'Bij een negatieve prijs kost injecteren geld. De sturing zet uw panelen dan even af. Geen batterij nodig.',
    co:'Gepland afzetten bij een negatieve spotprijs, en toch weer aanzetten als de onbalansmarkt u daarvoor beloont.',
    zc:'Middagoverschot opslaan en gebruiken op de duurste momenten van de dag.',on:'De batterij reageert op het prijssignaal als het net uit balans is.',
    pk:'De batterij springt bij op uw drukste kwartier, zodat uw piek lager blijft.',lg:'De batterij vullen terwijl er ruimte is op uw aansluiting.',
    gk:'Stroom nemen in de goedkoopste uren van de dag.',cb:'Goedkoop laden én zonder uw piek te verhogen.',ar:'Laden bij een lage prijs, terugleveren bij een hoge.',
    pl:'Wagens slim laden: gespreid onder uw aansluiting in plaats van allemaal tegelijk.',pg:'Laden op goedkope kwartieren zonder extra piek: lagere kost per 100 km.'},
   {cu:'Quand le prix est négatif, injecter coûte de l’argent. Le pilotage coupe alors brièvement vos panneaux. Pas besoin de batterie.',
    co:'Coupure prévue quand le prix spot est négatif, mais remise en marche si le marché du déséquilibre vous paie pour cela.',
    zc:'Stocker le surplus de midi et l’utiliser aux moments les plus chers de la journée.',on:'La batterie réagit au signal de prix quand le réseau est en déséquilibre.',
    pk:'La batterie prend le relais pendant votre quart d’heure le plus chargé, pour que votre pointe reste plus basse.',lg:'Remplir la batterie quand il reste de la place sur votre raccordement.',
    gk:'Prendre l’électricité aux heures les moins chères de la journée.',cb:'Charger bon marché, sans augmenter votre pointe.',ar:'Charger quand le prix est bas, réinjecter quand il est haut.',
    pl:'Recharger les véhicules intelligemment : étalé sous votre raccordement au lieu de tous en même temps.',pg:'Recharger aux quarts d’heure bon marché sans pointe en plus : un coût plus bas aux 100 km.'},
   {cu:'When the price is negative, feeding power in costs money. The control system then switches your panels off for a while. No battery needed.',
    co:'Planned switch-off when the spot price is negative, but back on when the imbalance market pays you for it.',
    zc:'Store the midday surplus and use it at the most expensive moments of the day.',on:'The battery responds to the price signal when the grid is out of balance.',
    pk:'The battery helps out during your busiest quarter-hour, so your peak stays lower.',lg:'Fill the battery while there is room on your grid connection.',
    gk:'Take power in the cheapest hours of the day.',cb:'Charge cheaply, without raising your peak.',ar:'Charge when the price is low, feed back when it is high.',
    pl:'Charge vehicles smartly: spread out below your connection instead of all at once.',pg:'Charge in cheap quarter-hours without an extra peak: a lower cost per 100 km.'});
  STAPPEN=T(['Wat is het?','Vandaag bij u','De markt','Wat doet deze actie?','Wat levert het op?'],
    ['C’est quoi ?','Aujourd’hui chez vous','Le marché','Que fait cette action ?','Que rapporte-t-elle ?'],
    ['What is it?','Today at your site','The market','What does this action do?','What does it earn you?']);
  bouwUitleg();
}
window._mkTaal=function(l){ try{ var u=new URLSearchParams(location.search); u.set('lang',l); if(D){ if(KEY) u.set('k',KEY); else u.delete('k'); } location.search=u.toString(); }catch(e){} return false; };
function taalKeuze(){ return '<div class="taal noprint" role="group" aria-label="Taal · Langue · Language">'+['nl','fr','en'].map(function(l){ return l===LANG?'<b aria-current="true">'+l.toUpperCase()+'</b>':'<a href="?lang='+l+'" hreflang="'+l+'" onclick="return window._mkTaal(\''+l+'\')">'+l.toUpperCase()+'</a>'; }).join('<span aria-hidden="true">·</span>')+'</div>'; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nf(v,d){return (Math.round((+v||0)*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString(LOC,{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function ckwh(m){return nf((+m||0)/10,1)+' c/kWh';}
function uur(q){var h=Math.floor(q/4),m=(q%4)*15;return h+':'+(m<10?'0':'')+m;}
function dagTxt(iso){try{var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}catch(e){return iso;}}
function KWP(){ return T('kWp','kWc','kWp'); }
function argmax(a,f){var b=-1,bv=-Infinity;for(var i=0;i<a.length;i++){var v=f?f(i):a[i];if(v>bv){bv=v;b=i;}}return b;}
function argmin(a){var b=-1,bv=Infinity;for(var i=0;i<a.length;i++){if(a[i]<bv){bv=a[i];b=i;}}return b;}
function H(){return D.hefbomen[KEY];}
function park(k){return k==='pl'||k==='pg';}
function wagens(h){var v=(h&&h.ev)||{};return v.type==='vrachtwagen'?T(['vrachtwagen','vrachtwagens'],['camion','camions'],['truck','trucks']):T(['personenwagen','personenwagens'],['voiture','voitures'],['car','cars']);}
function lblVoor(k){return k==='cu'?T('zonder afzetten','sans coupure','without switching off'):(k==='co'?T('gepland op de spotmarkt','selon le plan du marché spot','planned on the spot market'):(k==='on'?T('batterij zonder onbalans','batterie sans déséquilibre','battery without imbalance'):(park(k)?T('allemaal tegelijk laden','recharge simultanée','all charging at once'):T('zonder batterij','sans batterie','without battery'))));}
function lblMet(k){return k==='co'?T('met sturing op de onbalans','avec pilotage selon le déséquilibre','with imbalance steering'):(k==='cu')?T('met afzetten','avec coupure','with switching off'):(k==='on'?T('met onbalans-respons','avec réponse au déséquilibre','with imbalance response'):(park(k)?T('slim laden','recharge intelligente','smart charging'):T('met batterij','avec batterie','with battery')));}
function merkNaam(){return MERK?(MERK.naam||''):'Energie-Compas';}
function moment(k,h){
  if(k==='co'&&h.aan&&h.aan.indexOf(1)>=0) return argmax(h.voor,function(i){return h.aan[i]===1?((h.voor[i]||0)-(h.met[i]||0)):-1;});   // v0.6.0: het «toch weer aan»-moment
  if(k==='cu'||k==='co') return argmax(h.voor,function(i){return (h.met[i]||0)-(h.voor[i]||0);});
  if(k==='zc') return h.af?argmax(h.laden,function(i){return (h.laden[i]||0)>0?-(h.spot[i]||0):-1e9;}):argmax(h.laden);
  if(k==='on') return argmax(h.met,function(i){return Math.abs((h.met[i]||0)-(h.voor[i]||0));});
  if(k==='pk'||park(k)) return argmax(h.voor);
  if(k==='ar') return argmax(h.ontladen,function(i){return (h.ontladen[i]||0)*(h.spot[i]||0);});
  return argmax(h.laden,function(i){return Math.max(0,(h.laden[i]||0)-Math.max(0,(h.pv[i]||0)-(h.verbruik[i]||0)))*(1000-(h.spot[i]||0));});
}
// ---------- jaarpotentieel ----------
// v0.5.0: % van de integrale meerwaarde (excl. onbalans)
var MEEVALLER={co:1,on:1};
// v0.5.1: welke dag tonen we? (de server kiest per voordeel de dag met het grootste effect; parking = gewone werkdag)
var LUCR={cu:1,co:1,zc:1,on:1,gk:1,cb:1,ar:1};   // v0.6.4: ook «Het net helpen» toont de meest lucratieve dag
function dagKort(k){ var t=dagKort0(k); return (D&&D.hefbomen&&D.hefbomen[k]&&D.hefbomen[k].zx)?t+T(' (uitzonderlijke prijspieken niet meegeteld)',' (pics de prix exceptionnels non comptés)',' (exceptional price spikes not counted)'):t; }   // v0.12.0: server 15.373.0
function dagKort0(k){ if(k==='co'&&D&&D.hefbomen&&D.hefbomen.co&&D.hefbomen.co.aan) return T('meest lucratieve dag met «toch weer aan»','jour le plus lucratif avec «remise en marche»','most lucrative day with “back on”'); return LUCR[k]?T('meest lucratieve dag','jour le plus lucratif','most lucrative day'):(k==='pk'?T('dag met de grootste piekverlaging','jour avec la plus forte baisse de pointe','day with the largest peak reduction'):(k==='lg'?T('dag met het meeste laden op rustige momenten','jour avec le plus de recharge aux moments calmes','day with the most charging at quiet times'):(k==='on'?T('dag met de meeste reactie op het net','jour avec le plus de réaction au réseau','day with the most response to the grid'):((k==='pl'||k==='pg')?T('gewone werkdag','jour ouvrable ordinaire','normal working day'):T('voorbeelddag','jour d’exemple','example day'))))); }
function integ(){ return (D&&D.integraal&&+D.integraal.eur>0)?+D.integraal.eur:0; }
function pctKeys(){ return ['cu','zc','pk','gk','cb','ar'].concat(D&&D.ev_aanwezig?['pg']:[]).filter(function(k){return D.hefbomen&&D.hefbomen[k]&&D.hefbomen[k].jaar&&+D.hefbomen[k].jaar.eur>0;}); }
function pct(k){ var I=integ(), j=D.hefbomen[k]&&D.hefbomen[k].jaar; if(!I||!j||!(+j.eur>0)||pctKeys().indexOf(k)<0) return null; return Math.round(j.eur/I*100); }
function somPct(){ var I=integ(); if(!I) return null; var t=0; pctKeys().forEach(function(k){ t+=+D.hefbomen[k].jaar.eur||0; }); return Math.round(t/I*100); }
function pctChip(k){ if(MEEVALLER[k]&&D.hefbomen[k]) return '<em class="chip mv">'+T('meevaller · niet in het totaal','bonus · hors du total','bonus · not in the total')+'</em>'; var p=pct(k); return p==null?'':'<em class="chip">± '+p+' % '+T('van het totaal','du total','of the total')+'</em>'; }
function PJ(){ return T(' per jaar',' par an',' per year'); }
function IPV(){ return T(' i.p.v. ',' au lieu de ',' instead of '); }
function jaarTxt(k,j){ if(!j) return null;
  if(k==='pl') return ['± '+nf(j.km_dag,0)+T(' km per werkdag',' km par jour ouvrable',' km per working day'),T('met uw bestaande aansluiting','avec votre raccordement actuel','with your existing connection')];
  if(k==='pg') return ['€ '+nf(j.e100_slim,2)+IPV()+'€ '+nf(j.e100_dom,2)+' / 100 km','± € '+nf(j.eur,0)+T(' per jaar minder',' de moins par an',' less per year')];
  if(k==='pk') return ['± € '+nf(j.eur,0)+PJ(),T('gemiddeld '+nf(j.kw_mnd,0)+' kW lagere maandpiek','pointe mensuelle en moyenne '+nf(j.kw_mnd,0)+' kW plus basse','monthly peak '+nf(j.kw_mnd,0)+' kW lower on average')];
  if(k==='lg') return ['± '+nf(j.kwh/1000,1)+' MWh'+PJ(),T('geladen op rustige momenten','chargés aux moments calmes','charged at quiet times')];
  if(j.eur!=null&&j.eur>0) return ['± € '+nf(j.eur,0)+PJ(),(j.kwh?('± '+nf(j.kwh/1000,1)+' MWh'):'')];
  if(j.eur!=null) return ['± € 0'+PJ(),T('in het voorbije jaar niet van belang','sans importance l’année passée','not relevant in the past year')];
  return null; }
// ---------- teksten ----------
// v0.13.0: alle teksten per taal via T(nl,fr,en)
function zone(kl,nl,fr,en){ var c={o:'var(--amber)',g:'var(--groen-d)',b:'#2a6fb0',r:'#D64545'}[kl]; return '<span style="color:'+c+';font-weight:700">('+T(nl,fr,en)+')</span>'; }
function ZO(){ return zone('o','oranje zone','zone orange','orange zone'); }
function ZG(){ return zone('g','groene zone','zone verte','green zone'); }
function ZB(){ return zone('b','blauwe zone','zone bleue','blue zone'); }
function ZR(){ return zone('r','rode stippellijn','pointillé rouge','red dotted line'); }
function tekst(k,h,s){
  var m=CUR==null?0:Math.round(CUR), sp=h.spot, iMin=argmin(sp), iMax=argmax(sp), dg=dagTxt(h.datum), neg=sp.filter(function(v){return v<0;}).length;
  var piekV=Math.max.apply(null,h.voor), piekM=Math.max.apply(null,h.met), w=wagens(h), ev=h.ev||{}, kp=h.kpi||{}, MS=D.spanning==='MS', geenEv=(ev.type!=='vrachtwagen');
  var GB=T('<b>Hiervoor is geen batterij nodig.</b>','<b>Pas besoin de batterie pour cela.</b>','<b>No battery is needed for this.</b>');
  var t1={
    cu:T(['Panelen even af als injecteren geld kost','Soms is er zo veel zon en wind in België dat de stroomprijs onder nul zakt. Wie dan stroom op het net zet, betaalt erbij. Slimme sturing zet uw zonnepanelen op zo’n moment even af. Wat u zelf verbruikt, blijft van uw panelen komen. '+GB],
         ['Couper les panneaux quand injecter coûte de l’argent','Parfois, il y a tellement de soleil et de vent en Belgique que le prix de l’électricité passe sous zéro. Celui qui injecte alors de l’électricité sur le réseau paie en plus. Le pilotage intelligent coupe alors brièvement vos panneaux solaires. Ce que vous consommez vous-même continue à venir de vos panneaux. '+GB],
         ['Panels off for a while when feeding in costs money','Sometimes there is so much sun and wind in Belgium that the power price drops below zero. Anyone who puts power on the grid then pays extra. Smart control switches your solar panels off for a moment. What you use yourself still comes from your panels. '+GB]),
    co:(h.aan?T(['Panelen sturen op de onbalans','De dag voordien plant de sturing op de spotmarkt: uw panelen gaan af op de kwartieren met een negatieve spotprijs (dat noemen we nomineren). Op de dag zelf kijkt de sturing naar de <b>onbalansmarkt</b>. Betaalt die op een gepland afgezet moment net goed voor stroom op het net, dan zet ze uw panelen <b>toch weer aan</b>. Duikt de onbalansprijs onder nul op een moment dat u wél injecteert, dan gaan ze extra af. Zo stuurt u uw panelen op het signaal van het net (passieve respons). '+GB],
         ['Piloter les panneaux selon le déséquilibre','La veille, le pilotage planifie sur le marché spot : vos panneaux s’arrêtent aux quarts d’heure où le prix spot est négatif (c’est ce qu’on appelle nominer). Le jour même, le pilotage regarde le <b>marché du déséquilibre</b>. S’il paie bien pour de l’électricité sur le réseau à un moment où l’arrêt était prévu, il <b>remet quand même vos panneaux en marche</b>. Si le prix de déséquilibre passe sous zéro à un moment où vous injectez, ils s’arrêtent en plus. Ainsi, vous pilotez vos panneaux selon le signal du réseau (réponse passive). '+GB],
         ['Steering the panels on imbalance','The day before, the control system plans on the spot market: your panels switch off in the quarter-hours with a negative spot price (this is called nominating). On the day itself, the control system watches the <b>imbalance market</b>. If it pays well for power on the grid at a moment when a switch-off was planned, it turns your panels <b>back on anyway</b>. If the imbalance price drops below zero at a moment when you do feed in, they switch off as well. This way you steer your panels on the grid signal (passive response). '+GB])
       :T(['Ook afzetten als het net uit balans is','De dag voordien legt de sturing vast wanneer uw panelen afgaan: op de kwartieren met een negatieve spotprijs (dat noemen we nomineren). Op de dag zelf kan het net toch nog uit balans raken. Duikt de <b>onbalansprijs</b> dan onder nul, dan zet de sturing uw panelen ook op dat moment even af. Zo volgt u het signaal van het net (passieve respons). '+GB],
         ['Couper aussi quand le réseau est en déséquilibre','La veille, le pilotage fixe quand vos panneaux s’arrêtent : aux quarts d’heure où le prix spot est négatif (c’est ce qu’on appelle nominer). Le jour même, le réseau peut quand même se déséquilibrer. Si le <b>prix de déséquilibre</b> passe alors sous zéro, le pilotage coupe aussi brièvement vos panneaux à ce moment-là. Ainsi, vous suivez le signal du réseau (réponse passive). '+GB],
         ['Also switching off when the grid is out of balance','The day before, the control system decides when your panels switch off: in the quarter-hours with a negative spot price (this is called nominating). On the day itself, the grid can still get out of balance. If the <b>imbalance price</b> then drops below zero, the control system also switches your panels off for a moment. This way you follow the grid signal (passive response). '+GB])),
    zc:T(['Zonnestroom bewaren voor dure momenten','Uw zonnepanelen maken het meest rond de middag, als u vaak minder gebruikt dan ze maken. Zonder batterij gaat dat overschot het net op, meestal voor weinig. Met een batterij bewaart u het en gebruikt u het op de <b>duurste</b> momenten van de dag. Dan neemt u minder van het net.'+(h.af?' Slimme sturing kiest daarbij ook <b>wanneer</b> de batterij laadt: op de momenten dat zonnestroom op het net het minst opbrengt, of zelfs geld kost.':'')],
         ['Garder l’énergie solaire pour les moments chers','Vos panneaux solaires produisent le plus vers midi, quand vous consommez souvent moins qu’ils ne produisent. Sans batterie, ce surplus part sur le réseau, en général pour pas grand-chose. Avec une batterie, vous le gardez et vous l’utilisez aux moments les <b>plus chers</b> de la journée. Vous prenez alors moins au réseau.'+(h.af?' Le pilotage intelligent choisit aussi <b>quand</b> la batterie se charge : aux moments où l’énergie solaire injectée rapporte le moins, ou coûte même de l’argent.':'')],
         ['Saving solar power for expensive moments','Your solar panels produce the most around midday, when you often use less than they make. Without a battery, that surplus goes onto the grid, usually for very little. With a battery you keep it and use it at the <b>most expensive</b> moments of the day. Then you take less from the grid.'+(h.af?' Smart control also chooses <b>when</b> the battery charges: at the moments when solar power on the grid earns the least, or even costs money.':'')]),
    on:T(['Het net een handje helpen','Het net moet elk moment in evenwicht zijn. Is er even te veel of te weinig stroom, dan loopt de onbalansprijs op of zakt ze. De batterij kan dan even meer of minder nemen. Ze volgt gewoon dat prijssignaal (passieve respons).'],
         ['Donner un coup de main au réseau','Le réseau doit être en équilibre à chaque instant. S’il y a un moment trop ou trop peu d’électricité, le prix de déséquilibre monte ou descend. La batterie peut alors prendre un peu plus ou un peu moins. Elle suit simplement ce signal de prix (réponse passive).'],
         ['Giving the grid a hand','The grid must be in balance at every moment. If there is briefly too much or too little power, the imbalance price goes up or down. The battery can then take a bit more or a bit less. It simply follows that price signal (passive response).']),
    pk:T(['Uw hoogste piek lager houden','Een deel van uw nettarief hangt af van uw drukste kwartier van de maand (het capaciteitstarief). Springt de batterij op dat moment bij, dan blijft uw piek lager en betaalt u minder.'],
         ['Garder votre pointe la plus basse','Une partie de votre tarif de réseau dépend de votre quart d’heure le plus chargé du mois (le tarif capacitaire). Si la batterie prend le relais à ce moment-là, votre pointe reste plus basse et vous payez moins.'],
         ['Keeping your highest peak lower','Part of your grid tariff depends on your busiest quarter-hour of the month (the capacity tariff). If the battery helps out at that moment, your peak stays lower and you pay less.']),
    lg:T(['Laden als er ruimte is','Uw aansluiting heeft een maximum. Op rustige momenten gebruikt u maar een deel daarvan. Dan kan de batterij laden uit het net, zonder dat uw piek hoger wordt.','Zo stijgt uw <b>loadfactor</b>: de verhouding tussen wat u gemiddeld van het net neemt en wat uw aansluiting (of uw hoogste piek) toelaat. Bij 100 % neemt u de hele tijd het volle vermogen af; bij 25 % gebruikt u gemiddeld maar een vierde ervan. Hoe hoger de loadfactor, hoe beter u de aansluiting benut waarvoor u betaalt. De batterij vult de rustige momenten op, zonder de piek te verhogen.'],
         ['Charger quand il y a de la place','Votre raccordement a un maximum. Aux moments calmes, vous n’en utilisez qu’une partie. La batterie peut alors se charger sur le réseau, sans que votre pointe augmente.','Ainsi, votre <b>facteur de charge</b> augmente : le rapport entre ce que vous prenez en moyenne au réseau et ce que votre raccordement (ou votre pointe la plus haute) permet. À 100 %, vous prélevez tout le temps la pleine puissance ; à 25 %, vous n’en utilisez en moyenne qu’un quart. Plus le facteur de charge est élevé, mieux vous utilisez le raccordement que vous payez. La batterie remplit les moments calmes, sans augmenter la pointe.'],
         ['Charging when there is room','Your connection has a maximum. At quiet moments you only use part of it. Then the battery can charge from the grid without raising your peak.','This raises your <b>load factor</b>: the ratio between what you take from the grid on average and what your connection (or your highest peak) allows. At 100 % you draw full power all the time; at 25 % you only use a quarter of it on average. The higher the load factor, the better you use the connection you pay for. The battery fills the quiet moments without raising the peak.']),

 ev:{ t:'Energie & vermogen', h:
  '<h3>🏊 Het zwembad</h3><p>Denk aan een zwembad dat u met water vult. Het water in het bad is de <b>energie</b> (kWh): hoeveel u in totaal gebruikt. Hoe snel het water stroomt, is het <b>vermogen</b> (kW).</p>'+
  '<div class="slang"><div><b>🌱 Tuinslang</b>Weinig vermogen. Het bad loopt traag vol: het duurt lang.</div><div><b>🚒 Brandslang</b>Veel vermogen. Het bad is in een mum van tijd vol.</div></div>'+
  '<p>Op het einde zit er evenveel water in het bad: dezelfde energie. Alleen het tempo verschilt. In cijfers: <b>energie = vermogen × tijd</b>. 10 kW gedurende 2 uur is 20 kWh.</p>'+
  '<p>Uw <b>aansluiting</b> is de leiding naar het bad. Een dikke leiding, zoals een brandslang, kost meer, ook als u ze maar af en toe helemaal opendraait. Een <b>batterij</b> is als een extra watertank naast het bad: u vult hem rustig met de tuinslang en giet bij als u even veel water tegelijk nodig hebt. Zo hoeft de leiding niet dikker.</p>'+
  '<h3>💶 Wat betaalt u voor energie, wat voor vermogen?</h3><p>Zo ziet het eruit in Vlaanderen. In Wallonië en Brussel zijn de regels anders.</p>'+
  '<table><thead><tr><th></th><th>Per kWh (energie)</th><th>Per kW (vermogen)</th></tr></thead><tbody>'+
  '<tr><td><b>LS</b><br><span style="color:var(--grijs)">laagspanning</span></td><td>De energieprijs van uw leverancier · het nettarief per kWh · heffingen en accijnzen · groene stroom en WKK</td><td>Het capaciteitstarief op uw maandpiek, met een minimum per jaar</td></tr>'+
  '<tr><td><b>MS</b><br><span style="color:var(--grijs)">middenspanning</span></td><td>Dezelfde posten, maar met lagere tarieven per kWh</td><td>Het toegangsvermogen: wat u reserveert, ook als u het niet gebruikt · de maandpiek · een toeslag als uw toestellen te veel «blinde stroom» vragen</td></tr>'+
  '</tbody></table><p style="font-size:13px;color:var(--grijs)">Daarbovenop komt een vaste kost voor uw meter en de meetgegevens (databeheer). Er geldt ook een plafond op uw netkost per MWh: het maximumtarief.</p>'+
  '<h3>📈 Loadfactor</h3><p>De loadfactor zegt hoe goed u uw leiding benut. <b>Loadfactor = jaarverbruik ÷ (piek × 8.760 uur)</b>.</p>'+
  '<p>Voorbeeld: u verbruikt 100 MWh per jaar met een piek van 50 kW. Dat geeft 100.000 kWh ÷ (50 × 8.760) = <b>23 %</b>. 100 % zou betekenen dat de kraan het hele jaar door volledig open staat.</p>'+
  '<div class="kort">Hoe hoger de loadfactor, hoe meer kWh de vaste vermogenskosten dragen, en hoe goedkoper elke kWh. Slim laden en een batterij verhogen uw loadfactor: dezelfde energie, met een lagere piek.</div>' }
  };

 markten:{ t:'Les marchés de l’énergie', h:
  '<p>L’électricité est difficile à stocker. C’est pourquoi il faut, à chaque instant, mettre exactement autant d’électricité sur le réseau qu’on en consomme. Pour organiser cela, il existe plusieurs marchés. Cela fonctionne un peu comme un marché aux légumes : quand il y a beaucoup d’offre, le prix baisse.</p>'+
  '<h3>📅 Le marché day-ahead (le marché spot)</h3><p>Chaque jour vers midi, acheteurs et vendeurs se mettent d’accord sur la quantité d’électricité livrée demain, quart d’heure par quart d’heure, et à quel prix. C’est ainsi que naît le <b>prix spot</b> de chaque quart d’heure de demain. Beaucoup de soleil ou de vent ? Le prix est bas, parfois même sous zéro. Peu de vent alors que tout le monde cuisine ? Il est élevé. Avec un contrat dynamique, vous payez ce prix spot.</p>'+
  '<h3>⏱ Le marché intraday</h3><p>Si la prévision n’est pas tout à fait juste, par exemple à cause d’un nuage ou d’un vent plus faible, on peut encore acheter ou vendre de l’électricité le jour même, jusqu’à peu avant le moment lui-même.</p>'+
  '<h3>⚖️ Le déséquilibre</h3><p>Ce qui ne colle toujours pas après tous ces accords, c’est Elia qui le rattrape. Elia est le gestionnaire du réseau à haute tension en Belgique. Pour chaque quart d’heure, Elia fixe un <b>prix de déséquilibre</b>. Si le réseau manque d’électricité, ce prix est élevé. S’il y en a trop, il est bas, voire négatif. Celui qui aide à ce moment-là, par exemple en prélevant moins quand l’électricité manque, y gagne. Une batterie peut en profiter.</p>'+
  '<h3>🛟 Les réserves d’Elia</h3><p>En plus, Elia garde des réserves sous la main : de grandes installations qui, sur appel, viennent en renfort en quelques secondes à quelques minutes. C’est un marché à part, avec des exigences strictes et des contrats conclus à l’avance. Votre installation n’y participe pas. Votre avantage vient du marché spot et du déséquilibre.</p>'+
  '<div class="kort"><b>En bref :</b> day-ahead = l’accord pour demain · intraday = corriger aujourd’hui · déséquilibre = le décompte de ce qui ne collait pas.</div>' },

 ev:{ t:'Énergie & puissance', h:
  '<h3>🏊 La piscine</h3><p>Imaginez une piscine que vous remplissez d’eau. L’eau dans le bassin, c’est l’<b>énergie</b> (kWh) : la quantité totale que vous utilisez. La vitesse à laquelle l’eau coule, c’est la <b>puissance</b> (kW).</p>'+
  '<div class="slang"><div><b>🌱 Tuyau d’arrosage</b>Peu de puissance. La piscine se remplit lentement : cela prend longtemps.</div><div><b>🚒 Lance d’incendie</b>Beaucoup de puissance. La piscine est pleine en un rien de temps.</div></div>'+
  '<p>À la fin, il y a autant d’eau dans la piscine : la même énergie. Seul le rythme change. En chiffres : <b>énergie = puissance × temps</b>. 10 kW pendant 2 heures, cela fait 20 kWh.</p>'+
  '<p>Votre <b>raccordement</b> est le tuyau qui mène à la piscine. Un gros tuyau, comme une lance d’incendie, coûte plus cher, même si vous ne l’ouvrez à fond que de temps en temps. Une <b>batterie</b> est comme un réservoir d’eau à côté de la piscine : vous le remplissez tranquillement avec le tuyau d’arrosage, et vous ajoutez de l’eau quand vous en avez besoin de beaucoup d’un coup. Ainsi, le tuyau ne doit pas être plus gros.</p>'+
  '<h3>💶 Que payez-vous pour l’énergie, et que payez-vous pour la puissance ?</h3><p>Voici comment cela se passe en Flandre. En Wallonie et à Bruxelles, les règles sont différentes.</p>'+
  '<table><thead><tr><th></th><th>Par kWh (énergie)</th><th>Par kW (puissance)</th></tr></thead><tbody>'+
  '<tr><td><b>BT</b><br><span style="color:var(--grijs)">basse tension</span></td><td>Le prix de l’énergie de votre fournisseur · le tarif de réseau par kWh · les taxes et accises · l’électricité verte et la cogénération</td><td>Le tarif capacitaire sur votre pointe mensuelle, avec un minimum par an</td></tr>'+
  '<tr><td><b>MT</b><br><span style="color:var(--grijs)">moyenne tension</span></td><td>Les mêmes postes, mais avec des tarifs plus bas par kWh</td><td>La puissance d’accès : ce que vous réservez, même si vous ne l’utilisez pas · la pointe mensuelle · un supplément si vos appareils demandent trop d’«énergie réactive»</td></tr>'+
  '</tbody></table><p style="font-size:13px;color:var(--grijs)">S’y ajoute un coût fixe pour votre compteur et les données de mesure (gestion des données). Il existe aussi un plafond sur vos frais de réseau par MWh : le tarif maximum.</p>'+
  '<h3>📈 Facteur de charge</h3><p>Le facteur de charge indique si vous utilisez bien votre tuyau. <b>Facteur de charge = consommation annuelle ÷ (pointe × 8 760 heures)</b>.</p>'+
  '<p>Exemple : vous consommez 100 MWh par an avec une pointe de 50 kW. Cela donne 100 000 kWh ÷ (50 × 8 760) = <b>23 %</b>. 100 % voudrait dire que le robinet est grand ouvert toute l’année.</p>'+
  '<div class="kort">Plus le facteur de charge est élevé, plus il y a de kWh pour porter les coûts fixes de puissance, et moins chaque kWh coûte. La recharge intelligente et une batterie augmentent votre facteur de charge : la même énergie, avec une pointe plus basse.</div>' }

 markten:{ t:'Energy markets', h:
  '<p>Electricity is hard to store. That is why, at every moment, exactly as much power must go onto the grid as is being used. Several markets exist to arrange this. It works a bit like a vegetable market: when there is plenty on offer, the price drops.</p>'+
  '<h3>📅 The day-ahead market (the spot market)</h3><p>Every day around noon, buyers and sellers agree how much power will be delivered tomorrow, quarter-hour by quarter-hour, and at what price. This creates the <b>spot price</b> for every quarter-hour of tomorrow. Lots of sun or wind? Then the price is low, sometimes even below zero. Little wind while everyone is cooking? Then it is high. With a dynamic contract you pay that spot price.</p>'+
  '<h3>⏱ The intraday market</h3><p>If the forecast is not quite right, for example because of a cloud or less wind, power can still be bought or sold on the same day, until shortly before the moment itself.</p>'+
  '<h3>⚖️ Imbalance</h3><p>Whatever still does not match after all these deals is handled by Elia. Elia runs the high-voltage grid in Belgium. For every quarter-hour, Elia sets an <b>imbalance price</b>. If the grid is short of power, that price is high. If there is too much, it is low or even negative. Anyone who happens to help at that moment, for example by using less when power is short, gains from it. A battery can make use of this.</p>'+
  '<h3>🛟 Elia’s reserves</h3><p>Elia also keeps reserves on standby: large installations that step in on request within seconds to minutes. That is a separate market with strict requirements and contracts made in advance. Your installation does not take part in it. Your benefit comes from the spot market and imbalance.</p>'+
  '<div class="kort"><b>In short:</b> day-ahead = the deal for tomorrow · intraday = adjusting today · imbalance = settling what did not match.</div>' },
 termen:{ t:'Glossary', lijst:[

 ev:{ t:'Energy & power', h:
  '<h3>🏊 The swimming pool</h3><p>Think of a swimming pool that you fill with water. The water in the pool is the <b>energy</b> (kWh): how much you use in total. How fast the water flows is the <b>power</b> (kW).</p>'+
  '<div class="slang"><div><b>🌱 Garden hose</b>Little power. The pool fills slowly: it takes a long time.</div><div><b>🚒 Fire hose</b>Lots of power. The pool is full in no time.</div></div>'+
  '<p>In the end there is the same amount of water in the pool: the same energy. Only the speed is different. In numbers: <b>energy = power × time</b>. 10 kW for 2 hours is 20 kWh.</p>'+
  '<p>Your <b>connection</b> is the pipe to the pool. A thick pipe, like a fire hose, costs more, even if you only open it fully now and then. A <b>battery</b> is like an extra water tank next to the pool: you fill it calmly with the garden hose and top up when you need a lot of water at once. That way the pipe does not need to be thicker.</p>'+
  '<h3>💶 What do you pay for energy, and what for power?</h3><p>This is how it works in Flanders. In Wallonia and Brussels the rules are different.</p>'+
  '<table><thead><tr><th></th><th>Per kWh (energy)</th><th>Per kW (power)</th></tr></thead><tbody>'+
  '<tr><td><b>LV</b><br><span style="color:var(--grijs)">low voltage</span></td><td>Your supplier’s energy price · the grid tariff per kWh · levies and excise duties · green power and CHP</td><td>The capacity tariff on your monthly peak, with a minimum per year</td></tr>'+
  '<tr><td><b>MV</b><br><span style="color:var(--grijs)">medium voltage</span></td><td>The same items, but with lower rates per kWh</td><td>Access power: what you reserve, even if you do not use it · the monthly peak · a surcharge if your equipment draws too much “reactive power”</td></tr>'+
  '</tbody></table><p style="font-size:13px;color:var(--grijs)">On top of that comes a fixed cost for your meter and the metering data (data management). There is also a cap on your grid cost per MWh: the maximum tariff.</p>'+
  '<h3>📈 Load factor</h3><p>The load factor tells you how well you use your pipe. <b>Load factor = yearly use ÷ (peak × 8,760 hours)</b>.</p>'+
  '<p>Example: you use 100 MWh per year with a peak of 50 kW. That gives 100,000 kWh ÷ (50 × 8,760) = <b>23 %</b>. 100 % would mean the tap is fully open all year round.</p>'+
  '<div class="kort">The higher the load factor, the more kWh share the fixed power costs, and the cheaper each kWh becomes. Smart charging and a battery raise your load factor: the same energy, with a lower peak.</div>' }

function aanmelden(){
  app('<div class="aanm"><h2>🔒 '+T('Aanmelden','Connexion','Sign in')+'</h2><p>'+T('Deze pagina hoort bij een dossier en opent enkel voor de klant en de adviseur die op dat dossier staan. Vul het e-mailadres in dat bij het dossier hoort: we mailen u een code van 6 cijfers. Op dit toestel hoeft dat daarna niet opnieuw.',
      'Cette page fait partie d’un dossier et ne s’ouvre que pour le client et le conseiller qui figurent sur ce dossier. Saisissez l’adresse e-mail liée au dossier : nous vous envoyons un code de 6 chiffres. Ensuite, vous ne devrez plus le refaire sur cet appareil.',
      'This page belongs to a project file and only opens for the customer and the adviser listed on that file. Enter the e-mail address linked to the file: we will e-mail you a 6-digit code. After that you will not need to do this again on this device.')+'</p>'+
    '<div id="st1"><input id="am-mail" type="email" autocomplete="email" placeholder="'+T('uw e-mailadres','votre adresse e-mail','your e-mail address')+'"><button class="kn" id="am-stuur">'+T('Stuur mij de code','Envoyez-moi le code','Send me the code')+'</button></div>'+
    '<div id="st2" style="display:none"><input id="am-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="'+T('code van 6 cijfers','code de 6 chiffres','6-digit code')+'"><button class="kn" id="am-ok">'+T('Aanmelden','Se connecter','Sign in')+'</button><p style="margin:8px 0 0"><a href="#" id="am-terug">'+T('Ander e-mailadres','Autre adresse e-mail','Different e-mail address')+'</a></p></div>'+
    '<div class="msg" id="am-msg"></div>'+taalKeuze()+'</div>');
  var $=function(i){ return document.getElementById(i); }, msg=function(t,c){ var m=$('am-msg'); m.className='msg'+(c?' '+c:''); m.textContent=t||''; };
  $('am-stuur').onclick=async function(){ var m=($('am-mail').value||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ msg(T('Vul een geldig e-mailadres in.','Saisissez une adresse e-mail valide.','Please enter a valid e-mail address.'),'err'); return; }
    this.disabled=true; msg(T('Bezig met versturen…','Envoi en cours…','Sending…'));
    var ok=false; try{ var r=await fetch(API+'/api/auth/otp-request',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:m, lang:LANG }) }); ok=r.ok||r.status===429; }catch(e){}
    this.disabled=false;
    if(!ok){ msg(T('De code kon niet verstuurd worden. Probeer het straks opnieuw.','Le code n’a pas pu être envoyé. Réessayez dans un moment.','The code could not be sent. Please try again later.'),'err'); return; }
    $('st1').style.display='none'; $('st2').style.display=''; msg(T('We mailden u een code van 6 cijfers (kijk ook bij ongewenste mail).','Nous vous avons envoyé un code de 6 chiffres (regardez aussi dans vos courriers indésirables).','We have e-mailed you a 6-digit code (also check your spam folder).'),'ok'); $('am-code').focus(); };
  $('am-mail').onkeydown=function(e){ if(e.key==='Enter') $('am-stuur').click(); };
  $('am-code').onkeydown=function(e){ if(e.key==='Enter') $('am-ok').click(); };
  $('am-terug').onclick=function(e){ e.preventDefault(); $('st2').style.display='none'; $('st1').style.display=''; msg(''); };
  $('am-ok').onclick=async function(){ var m=($('am-mail').value||'').trim().toLowerCase(), c=($('am-code').value||'').trim();
    if(!/^[0-9]{6}$/.test(c)){ msg(T('Vul de code van 6 cijfers in.','Saisissez le code de 6 chiffres.','Please enter the 6-digit code.'),'err'); return; }
    this.disabled=true; msg(T('Bezig met aanmelden…','Connexion en cours…','Signing in…'));
    try{ var k=await sb(); var v=await k.auth.verifyOtp({ email:m, token:c, type:'email' }); if(v&&v.error) v=await k.auth.verifyOtp({ email:m, token:c, type:'magiclink' }); if(v&&v.error) v=await k.auth.verifyOtp({ email:m, token:c, type:'signup' });
      if(v&&v.error){ this.disabled=false; msg(T('De code klopt niet of is verlopen.','Le code est incorrect ou a expiré.','The code is wrong or has expired.'),'err'); return; } }
    catch(e){ this.disabled=false; msg(T('Aanmelden lukte niet. Probeer opnieuw.','La connexion a échoué. Réessayez.','Sign-in failed. Please try again.'),'err'); return; }
    app(laadTxt()); laad().catch(fout); };
}
function geenToegang(mail){
  app('<div class="aanm"><h2>'+T('Geen toegang','Pas d’accès','No access')+'</h2><p>'+T('U bent aangemeld als <b>'+esc(mail||'')+'</b>, maar dat adres staat niet als klant of adviseur op dit dossier. Gebruik het e-mailadres dat bij het dossier hoort, of vraag uw adviseur om de link.',
      'Vous êtes connecté avec l’adresse <b>'+esc(mail||'')+'</b>, mais cette adresse ne figure pas comme client ou conseiller sur ce dossier. Utilisez l’adresse e-mail liée au dossier, ou demandez le lien à votre conseiller.',
      'You are signed in as <b>'+esc(mail||'')+'</b>, but that address is not listed as customer or adviser on this file. Use the e-mail address linked to the file, or ask your adviser for the link.')+'</p><button class="kn" id="am-af">'+T('Afmelden en ander e-mailadres gebruiken','Se déconnecter et utiliser une autre adresse','Sign out and use another address')+'</button>'+taalKeuze()+'</div>');
  document.getElementById('am-af').onclick=async function(){ try{ var k=await sb(); await k.auth.signOut(); }catch(e){} aanmelden(); };
}
function fout(e){ app('<div class="laden">'+T('Deze pagina kon niet geladen worden','Cette page n’a pas pu être chargée','This page could not be loaded')+' ('+esc(e&&e.message||T('fout','erreur','error'))+').</div>'); }
laad().catch(fout);
})();
</script></body></html>
