<style>

<script>
(function(){
var API='https://lucid-amazement-production.up.railway.app';
var Q=new URLSearchParams(location.search), MID=Q.get('mid')||'', PDF=Q.get('pdf')==='1';
var D=null, KEY=null, STAP=1, ELIA={}, SPEEL=null, CUR=null;
var NAAM={zc:'Zonnestroom bewaren voor ’s avonds',cu:'Panelen even af bij negatieve prijs',on:'Het net helpen (onbalans)',pk:'Uw hoogste piek afvlakken',
  lg:'Laden als uw eigen verbruik laag is',gk:'Goedkoop inkopen',cb:'Goedkoop én onder uw piek laden',ar:'Goedkoop kopen, duur verkopen'};
var VOLG=['zc','cu','on','pk','lg','gk','cb','ar'];
var STAPPEN=['Wat is het?','Vandaag bij u','De markt','Wat doet de batterij?','Wat levert het op?'];
var KORT={zc:'Middagoverschot van uw zonnepanelen opslaan en ’s avonds zelf gebruiken.',cu:'Bij een negatieve prijs kost injecteren geld. Even afzetten scheelt.',
  on:'De batterij springt even bij als het net uit balans is. Dat levert een vergoeding op.',pk:'De batterij springt bij op uw drukste kwartier, zodat uw piek lager blijft.',
  lg:'De batterij vullen terwijl er ruimte is op uw aansluiting.',gk:'Stroom nemen in de goedkoopste uren van de dag.',cb:'Goedkoop laden én zonder uw piek te verhogen.',ar:'Laden bij een lage prijs, terugleveren bij een hoge.'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nf(v,d){return (Math.round((+v||0)*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function ckwh(eurMwh){return nf((+eurMwh||0)/10,0)+' c/kWh';}
function uur(q){var h=Math.floor(q/4),m=(q%4)*15;return h+':'+(m<10?'0':'')+m;}
function dagTxt(iso){try{var p=iso.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}catch(e){return iso;}}
function argmax(a,f){var b=-1,bv=-Infinity;for(var i=0;i<a.length;i++){var v=f?f(i):a[i];if(v>bv){bv=v;b=i;}}return b;}
function argmin(a){var b=-1,bv=Infinity;for(var i=0;i<a.length;i++){if(a[i]<bv){bv=a[i];b=i;}}return b;}
function H(){return D.hefbomen[KEY];}
function lblVoor(k){return k==='cu'?'zonder afzetten':(k==='on'?'batterij zonder onbalans':'zonder batterij');}
function moment(k,h){
  var sur=function(i){return Math.max(0,(h.pv[i]||0)-(h.verbruik[i]||0));};
  if(k==='zc') return argmax(h.laden,function(i){return Math.min(h.laden[i]||0,sur(i));});
  if(k==='cu') return argmax(h.afgezet);
  if(k==='on') return argmax(h.met,function(i){return Math.abs((h.met[i]||0)-(h.voor[i]||0));});
  if(k==='pk') return argmax(h.voor);
  if(k==='ar') return argmax(h.ontladen,function(i){return (h.ontladen[i]||0)*(h.spot[i]||0);});
  return argmax(h.laden,function(i){return Math.max(0,(h.laden[i]||0)-sur(i))*(1000-(h.spot[i]||0));});
}
// ---------- teksten (u-vorm, eenvoudig) ----------
function tekst(k,h,s){
  var m=CUR, sp=h.spot, iMin=argmin(sp), iMax=argmax(sp), dg=dagTxt(h.datum);
  var neg=sp.filter(function(v){return v<0;}).length;
  var piekV=Math.max.apply(null,h.voor), piekM=Math.max.apply(null,h.met);
  var t1={zc:['Zonnestroom bewaren','Uw zonnepanelen maken het meest rond de middag. Dan gebruikt u vaak minder dan ze maken. Zonder batterij gaat dat overschot het net op, meestal voor een lage prijs. Met een batterij bewaart u het voor later.'],
    cu:['Even afzetten als injecteren geld kost','Soms is er zo veel zon en wind in België dat de prijs onder nul zakt. Wie dan stroom op het net zet, betaalt erbij. Slimme sturing zet uw panelen op zo’n moment even af, of laat ze de batterij vullen.'],
    on:['Het net een handje helpen','Het net moet elk moment in evenwicht zijn. Is er even te veel of te weinig stroom, dan loopt de onbalansprijs op of zakt ze. Een batterij kan dan even meer of minder nemen. Ze volgt gewoon dat prijssignaal; dat heet passieve respons.'],
    pk:['Uw hoogste piek lager houden','Een deel van uw nettarief hangt af van uw drukste kwartier van de maand (het capaciteitstarief). Springt de batterij op dat moment bij, dan blijft uw piek lager en betaalt u minder.'],
    lg:['Laden als er ruimte is','Uw aansluiting heeft een maximum. Op rustige momenten gebruikt u maar een deel daarvan. Dan kan de batterij laden uit het net, zonder dat uw piek hoger wordt.'],
    gk:['Goedkoop inkopen','De stroomprijs verandert elk kwartier. ’s Nachts of op zonnige middagen is ze vaak laag. Met een dynamisch contract laadt de batterij op die goedkope momenten.'],
    cb:['Goedkoop én onder uw piek','Dit combineert de twee vorige: de batterij laadt op momenten die goedkoop zijn én waarop uw eigen verbruik laag is. Zo wint u op de prijs, zonder uw piek te verhogen.'],
    ar:['Goedkoop kopen, duur verkopen','Op dezelfde dag kan de prijs sterk verschillen. De batterij laadt als stroom goedkoop is en levert terug als hij duur is. Het verschil is uw winst.']}[k];
  if(s===1) return {h:t1[0],p:[t1[1],'We tonen het op een echte dag: <b>'+esc(dg)+'</b>. Klik op «Volgende stap».']};
  if(s===2){
    var inj=h.voor.reduce(function(a,v){return a+(v<0?-v*0.25:0);},0), afn=h.voor.reduce(function(a,v){return a+(v>0?v*0.25:0);},0);
    return {h:'Zo loopt uw stroom '+lblVoor(k),p:['Grafiek ① toont uw stroom op '+esc(dg)+', '+lblVoor(k)+(D.installatie.pv_kwp>0&&k!=='on'?' (wel met de zonnepanelen)':'')+'. <b>Boven de lijn</b> neemt u stroom van het net, <b>onder de lijn</b> zet u stroom op het net.',
      'Die dag neemt u ± <b>'+nf(afn,0)+' kWh</b> af'+(inj>1?(' en zet u ± <b>'+nf(inj,0)+' kWh</b> op het net'):'')+'. Uw hoogste kwartier: <b>'+nf(piekV,0)+' kW</b>.']};}
  if(s===3){
    var p=['Grafiek ② toont de prijs per kwartier. De laagste prijs is <b>'+ckwh(sp[iMin])+'</b> om '+uur(iMin)+', de hoogste <b>'+ckwh(sp[iMax])+'</b> om '+uur(iMax)+'.'];
    if(neg>0) p.push('Gedurende <b>'+nf(neg/4,1)+' uur</b> is de prijs zelfs <b style="color:var(--rood)">negatief</b>.');
    p.push('Grafiek ③ toont waarom: hoeveel zon en wind heel België die dag maakt. Veel zon of wind betekent een lage prijs.');
    if(k==='on') p.push('De grijze lijn is de onbalansprijs. Ze springt veel meer op en neer dan de spotprijs.');
    return {h:'Wat gebeurt er op de markt?',p:p};}
  if(s===4){
    var mt=uur(m), w={
      zc:'Om '+mt+' maken uw panelen meer dan u gebruikt. De batterij laadt dat overschot op <span style="color:var(--groen-d);font-weight:700">(groene zone)</span> en geeft het ’s avonds terug <span style="color:#2a6fb0;font-weight:700">(blauwe zone)</span>.',
      cu:'Om '+mt+' is de prijs '+ckwh(sp[m])+'. Uw panelen gaan dan even (deels) uit <span style="color:var(--amber);font-weight:700">(oranje zone)</span>: zo zet u geen stroom op het net aan een negatieve prijs.',
      on:'Om '+mt+' is de onbalansprijs '+ckwh(h.imb[m])+' tegenover een spotprijs van '+ckwh(sp[m])+'. De batterij volgt dat signaal en neemt even '+((h.met[m]>h.voor[m])?'meer':'minder')+' stroom van het net.',
      pk:'Uw drukste kwartier is om '+mt+': '+nf(piekV,0)+' kW. De batterij levert dan zelf stroom <span style="color:#2a6fb0;font-weight:700">(blauwe zone)</span>, zodat u van het net maar '+nf(piekM,0)+' kW nodig hebt.',
      lg:'Om '+mt+' gebruikt u zelf weinig. De batterij laadt dan uit het net <span style="color:var(--groen-d);font-weight:700">(groene zone)</span>, ver onder uw piek.',
      gk:'Om '+mt+' is stroom goedkoop: '+ckwh(sp[m])+'. De batterij laadt dan <span style="color:var(--groen-d);font-weight:700">(groene zone)</span> en levert later als stroom duurder is.',
      cb:'Om '+mt+' is stroom goedkoop ('+ckwh(sp[m])+') én is uw eigen verbruik laag. De batterij laadt dan <span style="color:var(--groen-d);font-weight:700">(groene zone)</span>, zonder uw piek te verhogen.',
      ar:'De batterij laadt als de prijs laag is <span style="color:var(--groen-d);font-weight:700">(groene zone)</span> en levert om '+mt+' terug, aan '+ckwh(sp[m])+' <span style="color:#2a6fb0;font-weight:700">(blauwe zone)</span>.'}[k];
    return {h:'Wat doet de '+(k==='cu'?'sturing':'batterij')+'?',p:[w,'De groene lijn in grafiek ① is uw stroom <b>met</b> '+(k==='cu'?'slimme sturing':(k==='on'?'onbalans-respons':'batterij'))+'; grijs is '+lblVoor(k)+'.']};}
  var kp=h.kpi||{}, p5=[];
  if(k==='zc') p5.push('Die dag bewaart de batterij ± <b>'+nf(kp.kwh,0)+' kWh</b> zonnestroom voor later.');
  if(k==='cu') p5.push('Die dag zet de sturing ± <b>'+nf(kp.kwh,0)+' kWh</b> af op momenten met een negatieve prijs.');
  if(k==='on') p5.push('Die dag reageert de batterij op het net met ± <b>'+nf(kp.kwh,0)+' kWh</b>.');
  if(k==='pk') p5.push('Uw piek die dag: <b>'+nf(kp.piek_voor,0)+' kW → '+nf(kp.piek_met,0)+' kW</b>. Dat verlaagt uw capaciteitstarief voor die maand.');
  if(k==='lg') p5.push('Die dag laadt de batterij ± <b>'+nf(kp.kwh,0)+' kWh</b> uit het net op rustige momenten.');
  if(k==='gk'||k==='cb'||k==='ar') p5.push('Het prijsverschil tussen laden en leveren is die dag het grootst van het jaar.');
  p5.push('Uw energierapport rekent alle voordelen samen uit over een volledig jaar, kwartier per kwartier.');
  return {h:'Wat levert het op?',p:p5};
}
function resultaat(k,h){
  var kp=h.kpi||{}, a=null, b=null;
  if(k==='pk'){ a=['Piek die dag',nf(kp.piek_voor,0)+' → '+nf(kp.piek_met,0)+' kW']; }
  else if(k==='on'){ a=['Die dag',(kp.eur>0?'+ € '+nf(kp.eur,0):'± '+nf(kp.kwh,0)+' kWh')]; }
  else if(k==='cu'){ a=['Afgezet die dag','± '+nf(kp.kwh,0)+' kWh']; }
  else { a=['Die dag (spotprijs)',(h.dag_eur>0?'+ € '+nf(h.dag_eur,0):'—')]; }
  if(k==='zc'||k==='lg') b=['Geladen','± '+nf(kp.kwh,0)+' kWh'];
  else if(k==='gk'||k==='cb'||k==='ar') b=['Prijsvoordeel',(kp.eur>0?'€ '+nf(kp.eur,0):'—')];
  else if(k==='cu') b=['Vermeden kost',(kp.eur>0?'€ '+nf(kp.eur,2):'—')];
  else if(k==='pk') b=['Minder piek',nf(Math.max(0,kp.piek_voor-kp.piek_met),0)+' kW'];
  else b=['Reactie','± '+nf(kp.kwh,0)+' kWh'];
  return '<div class="res"><div class="w"><small>'+a[0]+'</small><b>'+a[1]+'</b></div><div><small>'+b[0]+'</small><b>'+b[1]+'</b></div></div>';
}
// ---------- grafieken ----------
var L=46,R=750,W=R-L;
function X(i){return L+W*i/95;}
function y(v,lo,hi,t,b){return b-(v-lo)/(hi-lo)*(b-t);}
function lijn(a,lo,hi,t,b){return a.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+y(+v||0,lo,hi,t,b).toFixed(1);}).join('');}
function vlak(a,lo,hi,t,b){return lijn(a,lo,hi,t,b)+'L'+X(95)+','+y(0,lo,hi,t,b)+'L'+X(0)+','+y(0,lo,hi,t,b)+'Z';}
function rond(v,up){var s=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];var a=Math.abs(v);for(var i=0;i<s.length;i++){if(a<=s[i])return (v<0?-1:1)*s[i];}return v;}
function as(lo,hi,t,b,ticks,unit){var s='';ticks.forEach(function(v){var yy=y(v,lo,hi,t,b);s+='<line x1="'+L+'" x2="'+R+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(v===0?'#9AA6B8':'#E3E8EF')+'" stroke-width="'+(v===0?1.2:1)+'"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#7a869a">'+nf(v,0)+unit+'</text>';});
  for(var u=0;u<=24;u+=3)s+='<text x="'+(L+W*u/24)+'" y="'+(b+15)+'" text-anchor="middle" font-size="11" fill="#7a869a">'+u+'u</text>';return s;}
function ticks(lo,hi,n){var st=rond((hi-lo)/n);var a=[];for(var v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)a.push(Math.round(v*100)/100);return a;}
function cursor(t,b,q,id,extra){return q==null?'':'<g class="cur" id="'+id+'" transform="translate('+X(q).toFixed(1)+',0)"><line x1="0" x2="0" y1="'+(t-4)+'" y2="'+b+'" stroke="#003A5D" stroke-width="1.5" stroke-dasharray="3 3"/>'+(extra||'')+'</g>';}
// v0.2.0: cursor + tooltip verschuiven zonder de grafieken opnieuw te tekenen (vloeiend afspelen)
function zetCursor(qf){
  var x=X(qf).toFixed(1); ['cur1','cur2','cur3'].forEach(function(id){var g=document.getElementById(id); if(g) g.setAttribute('transform','translate('+x+',0)');});
  var h=D&&KEY&&H(); if(!h) return; var q=Math.max(0,Math.min(95,Math.round(qf)));
  var tt=document.getElementById('tt1'); if(tt){ tt.setAttribute('transform','translate('+(qf>66?-182:6)+',0)');
    var a=document.getElementById('tt1a'),b=document.getElementById('tt1b'),c=document.getElementById('tt1c'),v0=h.voor[q]||0,v1=h.met[q]||0;
    if(a) a.textContent=uur(q); if(b) b.textContent=lblVoor(KEY)+': '+(v0>=0?'afname ':'injectie ')+nf(Math.abs(v0),0)+' kW'; if(c) c.textContent='met: '+(v1>=0?'afname ':'injectie ')+nf(Math.abs(v1),0)+' kW'; }
}
function g1(h,toonMet,q){
  var all=h.voor.concat(toonMet?h.met:[]),mx=Math.max(5,Math.max.apply(null,all)),mn=Math.min(0,Math.min.apply(null,all));
  var hi=rond(mx*1.15),lo=mn<0?rond(mn*1.15):0,t=10,b=168,s=as(lo,hi,t,b,ticks(lo,hi,4),'');
  s+='<path d="'+vlak(h.voor,lo,hi,t,b)+'" fill="#C9D3DF" opacity=".8"/>';
  if(toonMet){var bw=W/95+0.4;
    for(var i=0;i<96;i++){var d=(h.met[i]||0)-(h.voor[i]||0);if(Math.abs(d)<0.05)continue;
      var kleur=(KEY==='cu')?'rgba(232,147,12,.35)':(d>0?'rgba(106,175,66,.32)':'rgba(93,169,233,.35)');
      var y1=y(h.voor[i],lo,hi,t,b),y2=y(h.met[i],lo,hi,t,b);s+='<rect x="'+(X(i)-bw/2)+'" y="'+Math.min(y1,y2)+'" width="'+bw+'" height="'+Math.abs(y2-y1)+'" fill="'+kleur+'"/>';}
    s+='<path d="'+lijn(h.met,lo,hi,t,b)+'" fill="none" stroke="#6AAF42" stroke-width="2.4"/>';}
  if(q!=null){ var tip='<g id="tt1" transform="translate('+(q>66?-182:6)+',0)"><rect x="0" y="'+t+'" width="176" height="'+(toonMet?50:36)+'" rx="6" fill="#003A5D"/>'+
      '<text id="tt1a" x="8" y="'+(t+15)+'" fill="#fff" font-size="11" font-weight="700"></text><text id="tt1b" x="8" y="'+(t+29)+'" fill="#fff" font-size="11"></text>'+
      (toonMet?'<text id="tt1c" x="8" y="'+(t+43)+'" fill="#B9E29F" font-size="11"></text>':'')+'</g>';
    s+=cursor(t,b,q,'cur1',tip); }
  return s;}
function g2(h,q){
  var all=h.spot.concat(KEY==='on'?h.imb:[]).filter(function(v){return isFinite(v);});var mx=Math.max(50,Math.max.apply(null,all)),mn=Math.min(0,Math.min.apply(null,all));
  var hi=rond(mx*1.1),lo=mn<0?rond(mn*1.1):0,t=8,b=125,s=as(lo/10,hi/10,t,b,ticks(lo/10,hi/10,4),'');
  var bw=W/95+0.4;h.spot.forEach(function(v,i){if(v<0)s+='<rect x="'+(X(i)-bw/2)+'" y="'+t+'" width="'+bw+'" height="'+(b-t)+'" fill="rgba(214,69,69,.10)"/>';});
  s+='<clipPath id="c2"><rect x="'+L+'" y="'+t+'" width="'+W+'" height="'+(b-t)+'"/></clipPath>';
  if(h.imb&&h.imb.length)s+='<path clip-path="url(#c2)" d="'+lijn(h.imb.map(function(v){return v/10;}),lo/10,hi/10,t,b)+'" fill="none" stroke="#9AA6B8" stroke-width="'+(KEY==='on'?1.6:1.1)+'"/>';
  s+='<path d="'+lijn(h.spot.map(function(v){return v/10;}),lo/10,hi/10,t,b)+'" fill="none" stroke="#003A5D" stroke-width="2.4"/>';
  s+=cursor(t,b,q,'cur2');return s;}
function g3(h,q){
  var e=ELIA[h.datum],t=8,b=112;
  if(!e) return '<text x="'+(L+W/2)+'" y="60" text-anchor="middle" font-size="13" fill="#7a869a">⏳ zon en wind in België worden opgehaald…</text>';
  if(e.fout) return '<text x="'+(L+W/2)+'" y="60" text-anchor="middle" font-size="13" fill="#7a869a">Zon en wind van Elia zijn nu niet beschikbaar.</text>';
  var tot=e.zon.map(function(z,i){return (z||0)+(e.wind[i]||0);}),hi=Math.max(2,rond(Math.max.apply(null,tot)*1.1)),s=as(0,hi,t,b,ticks(0,hi,2),'');
  s+='<path d="'+vlak(e.wind,0,hi,t,b)+'" fill="#5DA9E9" opacity=".85"/>';
  var top=lijn(tot,0,hi,t,b),back=e.wind.map(function(w,i){return 'L'+X(95-i).toFixed(1)+','+y(e.wind[95-i]||0,0,hi,t,b).toFixed(1);}).join('');
  s+='<path d="'+top+back+'Z" fill="#F2B705" opacity=".85"/>';s+=cursor(t,b,q,'cur3');return s;}
// ---------- Elia ----------
function brusselsQ(ms,datum){try{var f=new Intl.DateTimeFormat('nl-BE',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  var p={};f.formatToParts(new Date(ms)).forEach(function(x){p[x.type]=x.value;});if((p.year+'-'+p.month+'-'+p.day)!==datum)return -1;return (+p.hour)*4+Math.floor((+p.minute)/15);}catch(e){return -1;}}
function haalElia(datum){
  if(ELIA[datum]) return;
  ELIA[datum]=null;
  var d0=new Date(datum+'T00:00:00Z'),van=new Date(d0.getTime()-86400000).toISOString().slice(0,10),tot=new Date(d0.getTime()+86400000).toISOString().slice(0,10);
  function ds(n){return fetch(API+'/elia-renewable?dataset='+n+'&from='+van+'&to='+tot).then(function(r){return r.json();}).then(function(j){var a=new Array(96).fill(null);(j.data||[]).forEach(function(r){var q=brusselsQ(r.t,datum);if(q>=0)a[q]=(+r.v||0)/1000;});return a;});}
  Promise.all([ds('solar'),ds('wind')]).then(function(r){
    var ok=r[0].some(function(v){return v!=null;})||r[1].some(function(v){return v!=null;});
    ELIA[datum]=ok?{zon:r[0].map(function(v){return v||0;}),wind:r[1].map(function(v){return v||0;})}:{fout:true};teken();
  }).catch(function(){ELIA[datum]={fout:true};teken();});
}
// ---------- opbouw ----------
function beschikbaar(){return VOLG.filter(function(k){return D.hefbomen&&D.hefbomen[k];});}
function bouw(){
  var ks=beschikbaar(); if(!ks.length){document.getElementById('app').innerHTML='<div class="laden">Voor deze combinatie is er nog geen voorbeeld beschikbaar.</div>';return;}
  if(!KEY||ks.indexOf(KEY)<0) KEY=ks[0];
  var opts=VOLG.map(function(k,i){return '<option value="'+k+'"'+(k===KEY?' selected':'')+(D.hefbomen[k]?'':' disabled')+'>'+(i+1)+' · '+esc(NAAM[k])+(D.hefbomen[k]?'':' (niet bij deze installatie)')+'</option>';}).join('');
  var inst=[D.installatie.pv_kwp>0?nf(D.installatie.pv_kwp,0)+' kWp PV':'',D.installatie.batt_kwh>0?nf(D.installatie.batt_kw,0)+' kW / '+nf(D.installatie.batt_kwh,0)+' kWh batterij':''].filter(Boolean).join(' · ');
  document.getElementById('app').innerHTML=
   '<div class="top"><div class="logo"><img src="/apps/ec-logo.png" alt="Energie-Compas"></div><div class="dos">'+esc(D.klant||'')+(D.project_id?' · '+esc(D.project_id):'')+' · '+nf(D.afname_mwh,0)+' MWh/jaar · '+esc(inst)+'</div></div>'+
   '<div class="wrap"><h1>Uw profiel op de markt verdient beter</h1><p class="sub">Zo loopt uw stroom vandaag, zo beweegt de markt, en zo kan een batterij met slimme sturing daarop inspelen.</p>'+
   '<div class="balk"><label class="kies"><small>Kies een voordeel</small><select id="kies">'+opts+'</select></label><div class="stappen" id="stappen"></div>'+
   '<a class="pdfknop noprint" href="?mid='+encodeURIComponent(MID)+'&pdf=1" target="_blank" rel="noopener">📄 Inleiding als PDF</a></div>'+
   (D.gemeten?'':'<div class="voorb">Voorbeeld op basis van een standaardprofiel — exact zodra uw kwartierdata van Fluvius binnen is</div>')+
   '<div class="grid"><div class="kaart">'+
     '<div class="paneel" id="p1"><div class="kop"><b>① Uw stroom</b><span id="d1"></span></div><div class="leg" id="l1"></div><svg id="g1" viewBox="0 0 760 190"></svg></div>'+
     '<div class="paneel" id="p2" style="margin-top:6px"><div class="kop"><b>② De prijzen</b><span>c/kWh</span></div><div class="leg"><span><i style="background:var(--navy)"></i>spotprijs (day-ahead)</span><span><i style="background:#9AA6B8"></i>onbalansprijs</span><span><i style="background:rgba(214,69,69,.2)"></i>negatieve prijs</span></div><svg id="g2" viewBox="0 0 760 145"></svg></div>'+
     '<div class="paneel" id="p3" style="margin-top:6px"><div class="kop"><b>③ België</b><span>productie in GW (Elia)</span></div><div class="leg"><span><i style="background:var(--geel)"></i>zon</span><span><i style="background:var(--blauw)"></i>wind</span></div><svg id="g3" viewBox="0 0 760 135"></svg></div>'+
   '</div><div class="kaart uitleg" id="uitleg"></div></div>'+
   '<div class="voet">Echte marktdag (spot en onbalans: Elia/EPEX; zon en wind: Elia). Uw stroom komt uit de simulatie van uw dossier'+(D.gemeten?' op uw gemeten kwartierdata':' op een standaardprofiel')+'. Bedragen zijn voorbeelden voor één dag; uw energierapport rekent het volledige jaar uit. Energie-Compas · Fluctus.net CVSO.</div></div>';
  document.getElementById('kies').onchange=function(){KEY=this.value;STAP=1;stopSpeel();CUR=null;teken();};
  teken();
}
function teken(){
  if(!D||!KEY) return; var h=H(); if(CUR==null) CUR=moment(KEY,h);
  haalElia(h.datum);
  document.getElementById('stappen').innerHTML=STAPPEN.map(function(n,i){var s=i+1;return '<span class="st'+(s===STAP?' on':(s<STAP?' ok':''))+'" data-s="'+s+'">'+s+' '+n+'</span>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#stappen .st'),function(e){e.onclick=function(){STAP=+e.getAttribute('data-s');stopSpeel();CUR=moment(KEY,h);teken();};});
  var toonMet=STAP>=4;
  document.getElementById('d1').textContent=dagTxt(h.datum)+' · kW per kwartier';
  document.getElementById('l1').innerHTML='<span><i style="background:#C9D3DF"></i>'+lblVoor(KEY)+': afname ↑ / injectie ↓</span>'+(toonMet?('<span><i style="background:var(--groen)"></i>met '+(KEY==='cu'?'sturing':'batterij')+'</span>'+(KEY==='cu'?'<span><i style="background:rgba(232,147,12,.45)"></i>panelen even af</span>':'<span><i style="background:rgba(106,175,66,.4)"></i>batterij laadt</span><span><i style="background:rgba(93,169,233,.45)"></i>batterij levert</span>')):'');
  var q=(STAP>=2)?Math.round(CUR):null;
  document.getElementById('g1').innerHTML=g1(h,toonMet,q);
  document.getElementById('g2').innerHTML=g2(h,q);
  document.getElementById('g3').innerHTML=g3(h,q);
  if(q!=null) zetCursor(CUR);
  ['p1','p2','p3'].forEach(function(id,i){document.getElementById(id).classList.toggle('focus',(STAP===2&&i===0)||(STAP===3&&i>0)||(STAP===4&&i===0));});
  var t=tekst(KEY,h,STAP), lijst=VOLG.map(function(k,i){var ok=!!D.hefbomen[k];return '<div class="'+(k===KEY?'a':'')+(ok?'':' nvt')+'" data-k="'+k+'"><span>'+(i+1)+' · '+esc(NAAM[k])+'</span><span>'+(k===KEY?'✓':'')+'</span></div>';}).join('');
  document.getElementById('uitleg').innerHTML='<span class="tag">Stap '+STAP+' · '+STAPPEN[STAP-1]+'</span><h2>'+t.h+'</h2>'+t.p.map(function(x){return '<p>'+x+'</p>';}).join('')+
    (STAP===5?resultaat(KEY,h):'')+
    '<div class="knop noprint"><button class="k1" id="speel">'+(SPEEL?'⏸ Pauze':'▶ Speel de dag af')+'</button><button class="k2" id="volg">'+(STAP<5?'Volgende stap →':'Volgend voordeel →')+'</button></div><div class="lijst">'+lijst+'</div>';
  document.getElementById('speel').onclick=function(){ if(SPEEL){ stopSpeel(); knopSpeel(); return; } speel(); };
  document.getElementById('volg').onclick=function(){stopSpeel(); if(STAP<5){STAP++;CUR=moment(KEY,h);} else { var ks=beschikbaar(); KEY=ks[(ks.indexOf(KEY)+1)%ks.length]; STAP=1; CUR=null; var se=document.getElementById('kies'); if(se) se.value=KEY; } teken();};
  Array.prototype.forEach.call(document.querySelectorAll('.lijst div'),function(e){var k=e.getAttribute('data-k'); if(!D.hefbomen[k]) return; e.onclick=function(){KEY=k;STAP=1;CUR=null;stopSpeel();var se=document.getElementById('kies');if(se)se.value=k;teken();};});
}
// v0.2.0 (Johan 30-10): vloeiend en rustiger afspelen — requestAnimationFrame, ± 30 s voor een volledige dag (± 1,25 s per uur),
//   de cursor glijdt continu; enkel cursor en tooltip bewegen (geen herbouw van de knoppen → «Pauze» reageert meteen).
var DAG_MS=30000;
function knopSpeel(){ var b=document.getElementById('speel'); if(b) b.textContent=SPEEL?'⏸ Pauze':((CUR!=null&&CUR>0&&CUR<95)?'▶ Verder afspelen':'▶ Speel de dag af'); }
function speel(){
  if(!D||!KEY) return;
  if(STAP<2){ STAP=2; CUR=0; teken(); }
  if(CUR==null||CUR>=95) CUR=0;
  var start=null, van=CUR;
  function stap(ts){ if(!SPEEL) return; if(start==null) start=ts; CUR=Math.min(95, van+(ts-start)/DAG_MS*96); zetCursor(CUR);
    if(CUR>=95){ SPEEL=null; knopSpeel(); return; } SPEEL=requestAnimationFrame(stap); }
  SPEEL=requestAnimationFrame(stap); knopSpeel();
}
function stopSpeel(){ if(SPEEL){ cancelAnimationFrame(SPEEL); SPEEL=null; } }
// ---------- PDF-inleiding (A4) ----------
function miniSvg(k,h){var a=h.voor.concat(h.met),mx=Math.max(1,Math.max.apply(null,a)),mn=Math.min(0,Math.min.apply(null,a)),t=6,b=44;
  function P(arr){return arr.map(function(v,i){return (i?'L':'M')+(4+i*102/95).toFixed(1)+','+(b-((v||0)-mn)/(mx-mn)*(b-t)).toFixed(1);}).join('');}
  var z=b-(0-mn)/(mx-mn)*(b-t);
  return '<svg viewBox="0 0 110 50"><line x1="4" x2="106" y1="'+z+'" y2="'+z+'" stroke="#C9D3DF" stroke-width=".7"/><path d="'+P(h.voor)+'" fill="none" stroke="#9AA6B8" stroke-width="1.4"/><path d="'+P(h.met)+'" fill="none" stroke="#6AAF42" stroke-width="1.8"/></svg>';}

  var qr='';try{var qq=qrcode(0,'M');qq.addData(url);qq.make();qr=qq.createSvgTag({cellSize:3,margin:0});}catch(e){}
  document.getElementById('app').innerHTML='<div class="noprint" style="text-align:center;padding:10px"><button class="pdfknop" onclick="window.print()">🖨 Afdrukken of bewaren als PDF</button></div>'+
   '<div class="pag"><div class="hd"><div class="logo"><img src="/apps/ec-logo.png" alt="Energie-Compas"></div><span>Inleiding bij uw energierapport</span></div>'+
   '<h1>Uw profiel op de markt verdient beter</h1><div class="ond">Wat een batterij met slimme sturing voor u kan doen, in '+ks.length+' eenvoudige voorbeelden</div>'+
   (D.gemeten?'':'<div class="voorb">Voorbeeld op basis van een standaardprofiel · '+esc(D.klant||'')+' · '+nf(D.afname_mwh,0)+' MWh/jaar</div>')+
   '<p>Stroom kost niet altijd hetzelfde. Als heel België veel zon of wind heeft, is stroom goedkoop of zelfs gratis. ’s Avonds, als iedereen kookt en verwarmt, is ze duur. Vandaag merkt u daar weinig van: u neemt stroom af wanneer u ze nodig hebt, en uw overschot gaat het net op.</p>'+
   '<p>Een batterij met slimme sturing (een <b>EMS</b>) kijkt elk kwartier naar drie dingen tegelijk:</p>'+
   '<div class="drie"><div><b>① Uw stroom</b>Wat u nu afneemt en wat uw panelen nu maken.</div><div><b>② De prijzen</b>De spotprijs per kwartier en de onbalansprijs.</div><div><b>③ Zon en wind</b>Hoeveel stroom heel België nu zelf maakt.</div></div>'+
   '<h2>Zo kan uw profiel beter inspelen op de markt</h2><div class="mini">'+mini+'</div>'+
   '<div class="cta"><div><b>Bekijk het zelf, dag per dag</b><span>Op de interactieve pagina ziet u per voorbeeld een echte dag: uw stroom, de prijzen en zon en wind in België, en wat de batterij op dat moment doet. Stap voor stap, zonder vakjargon.<br><br>'+esc(url.replace(/^https?:\/\//,''))+'</span></div><div class="qr">'+qr+'</div></div>'+
   '<div class="pvt"><span>Energie-Compas · Fluctus.net CVSO · grijs = zonder batterij, groen = met batterij en slimme sturing · uw energierapport rekent het volledige jaar uit</span><span>'+esc(D.project_id||'')+'</span></div></div>';
}
if(!/^[0-9a-f]{20}$/.test(MID)){document.getElementById('app').innerHTML='<div class="laden">Deze link is niet geldig.</div>';return;}
fetch(API+'/api/markt-edu/'+MID).then(function(r){return r.json();}).then(function(j){
  if(!j||!j.ok) throw new Error((j&&j.error)||'niet gevonden');
  D=j; if(PDF){bouwPdf();} else {bouw();}
}).catch(function(e){document.getElementById('app').innerHTML='<div class="laden">Deze pagina kon niet geladen worden ('+esc(e.message)+').</div>';});
})();
