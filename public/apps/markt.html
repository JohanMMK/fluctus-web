<style>

.pag p{font-size:12px;line-height:1.5;margin:0 0 8px}
.drie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.drie div{border:1px solid var(--lijn);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.4}.drie b{display:block;font-family:var(--kop-font);color:var(--navy);font-size:12px;margin-bottom:2px}
.pag h2{font-family:var(--kop-font);color:var(--navy);font-size:14px;margin:4px 0 6px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.mk svg{width:96px;height:44px;background:var(--bg);border-radius:7px}.mk b{font-family:var(--kop-font);color:var(--navy);font-size:11px;display:block;margin-bottom:1px}.mk span{font-size:10px;line-height:1.35;color:#2a3342;display:block}.mk em{font-style:normal;color:var(--groen-d);font-weight:700}
.cta{margin-top:12px;display:grid;grid-template-columns:1fr 96px;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px}
.cta b{font-family:var(--kop-font);font-size:14px;display:block;margin-bottom:3px}.cta span{font-size:11px;opacity:.92;line-height:1.45}

<script>
(function(){
var API='https://lucid-amazement-production.up.railway.app';
var Q=new URLSearchParams(location.search), MID=Q.get('mid')||'', PDF=Q.get('pdf')==='1';
var D=null, KEY=null, STAP=1, ELIA={}, SPEEL=null, CUR=null, MERK=null, KEUZE={};
var VOLG=['cu','co','zc','on','pk','lg','gk','cb','ar','pl','pg'];
var NAAM={cu:'Panelen af bij een negatieve spotprijs',co:'Panelen af bij een negatieve onbalansprijs',zc:'Zonnestroom bewaren voor dure momenten',on:'Het net helpen met de batterij (onbalans)',
  pk:'Uw hoogste piek afvlakken',lg:'Laden als uw eigen verbruik laag is',gk:'Goedkoop inkopen',cb:'Goedkoop én onder uw piek laden',ar:'Goedkoop kopen, duur verkopen',
  pl:'Laden op de parking zonder piek',pg:'Laden op de parking buiten de piek'};
var GROEP={cu:'Zonder batterij',co:'Zonder batterij',zc:'Met een batterij',on:'Met een batterij',pk:'Met een batterij',lg:'Met een batterij',gk:'Met een batterij',cb:'Met een batterij',ar:'Met een batterij',pl:'Laden op uw bedrijfsparking',pg:'Laden op uw bedrijfsparking'};
var KORT={cu:'Bij een negatieve prijs kost injecteren geld. De sturing zet uw panelen dan even af. Geen batterij nodig.',
  co:'Bovenop de planning van de dag voordien: ook afzetten als de onbalansprijs onder nul duikt.',
  zc:'Middagoverschot opslaan en gebruiken op de duurste momenten van de dag.',on:'De batterij reageert op het prijssignaal als het net uit balans is.',
  pk:'De batterij springt bij op uw drukste kwartier, zodat uw piek lager blijft.',lg:'De batterij vullen terwijl er ruimte is op uw aansluiting.',
  gk:'Stroom nemen in de goedkoopste uren van de dag.',cb:'Goedkoop laden én zonder uw piek te verhogen.',ar:'Laden bij een lage prijs, terugleveren bij een hoge.',
  pl:'Wagens slim laden: gespreid onder uw aansluiting in plaats van allemaal tegelijk.',pg:'Laden op goedkope kwartieren zonder extra piek: lagere kost per 100 km.'};
var STAPPEN=['Wat is het?','Vandaag bij u','De markt','Wat doet deze actie?','Wat levert het op?'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nf(v,d){return (Math.round((+v||0)*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function ckwh(m){return nf((+m||0)/10,1)+' c/kWh';}
function uur(q){var h=Math.floor(q/4),m=(q%4)*15;return h+':'+(m<10?'0':'')+m;}
function dagTxt(iso){try{var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}catch(e){return iso;}}
function argmax(a,f){var b=-1,bv=-Infinity;for(var i=0;i<a.length;i++){var v=f?f(i):a[i];if(v>bv){bv=v;b=i;}}return b;}
function argmin(a){var b=-1,bv=Infinity;for(var i=0;i<a.length;i++){if(a[i]<bv){bv=a[i];b=i;}}return b;}
function H(){return D.hefbomen[KEY];}
function park(k){return k==='pl'||k==='pg';}
function wagens(h){var v=(h&&h.ev)||{};return v.type==='vrachtwagen'?['vrachtwagen','vrachtwagens']:['personenwagen','personenwagens'];}
function lblVoor(k){return k==='cu'?'zonder afzetten':(k==='co'?'enkel gepland afzetten':(k==='on'?'batterij zonder onbalans':(park(k)?'allemaal tegelijk laden':'zonder batterij')));}
function lblMet(k){return (k==='cu'||k==='co')?'met afzetten':(k==='on'?'met onbalans-respons':(park(k)?'slim laden':'met batterij'));}
function merkNaam(){return MERK?(MERK.naam||''):'Energie-Compas';}
function moment(k,h){
  if(k==='cu'||k==='co') return argmax(h.voor,function(i){return (h.met[i]||0)-(h.voor[i]||0);});
  if(k==='zc') return argmax(h.laden);
  if(k==='on') return argmax(h.met,function(i){return Math.abs((h.met[i]||0)-(h.voor[i]||0));});
  if(k==='pk'||park(k)) return argmax(h.voor);
  if(k==='ar') return argmax(h.ontladen,function(i){return (h.ontladen[i]||0)*(h.spot[i]||0);});
  return argmax(h.laden,function(i){return Math.max(0,(h.laden[i]||0)-Math.max(0,(h.pv[i]||0)-(h.verbruik[i]||0)))*(1000-(h.spot[i]||0));});
}
// ---------- jaarpotentieel ----------
function jaarTxt(k,j){ if(!j) return null;
  if(k==='pl') return ['± '+nf(j.km_dag,0)+' km per werkdag','met uw bestaande aansluiting'];
  if(k==='pg') return ['€ '+nf(j.e100_slim,2)+' i.p.v. € '+nf(j.e100_dom,2)+' / 100 km','± € '+nf(j.eur,0)+' per jaar minder'];
  if(k==='pk') return ['± € '+nf(j.eur,0)+' per jaar','gemiddeld '+nf(j.kw_mnd,0)+' kW lagere maandpiek'];
  if(k==='lg') return ['± '+nf(j.kwh/1000,1)+' MWh per jaar','geladen op rustige momenten'];
  if(j.eur!=null&&j.eur>0) return ['± € '+nf(j.eur,0)+' per jaar',(j.kwh?('± '+nf(j.kwh/1000,1)+' MWh'):'')];
  if(j.eur!=null) return ['± € 0 per jaar','in het voorbije jaar niet van belang'];
  return null; }
// ---------- teksten ----------
function tekst(k,h,s){
  var m=CUR==null?0:Math.round(CUR), sp=h.spot, iMin=argmin(sp), iMax=argmax(sp), dg=dagTxt(h.datum), neg=sp.filter(function(v){return v<0;}).length;
  var piekV=Math.max.apply(null,h.voor), piekM=Math.max.apply(null,h.met), w=wagens(h), ev=h.ev||{}, kp=h.kpi||{};
  var t1={cu:['Panelen even af als injecteren geld kost','Soms is er zo veel zon en wind in België dat de stroomprijs onder nul zakt. Wie dan stroom op het net zet, betaalt erbij. Slimme sturing zet uw zonnepanelen op zo’n moment even af. Wat u zelf verbruikt, blijft van uw panelen komen. <b>Hiervoor is geen batterij nodig.</b>'],
    co:['Ook afzetten als het net uit balans is','De dag voordien legt de sturing vast wanneer uw panelen afgaan: op de kwartieren met een negatieve spotprijs (dat noemen we nomineren). Op de dag zelf kan het net toch nog uit balans raken. Duikt de <b>onbalansprijs</b> dan onder nul, dan zet de sturing uw panelen ook op dat moment even af. Zo volgt u het signaal van het net (passieve respons). <b>Hiervoor is geen batterij nodig.</b>'],
    zc:['Zonnestroom bewaren voor dure momenten','Uw zonnepanelen maken het meest rond de middag, als u vaak minder gebruikt dan ze maken. Zonder batterij gaat dat overschot het net op, meestal voor weinig. Met een batterij bewaart u het en gebruikt u het op de <b>duurste</b> momenten van de dag. Dan neemt u minder van het net.'],
    on:['Het net een handje helpen','Het net moet elk moment in evenwicht zijn. Is er even te veel of te weinig stroom, dan loopt de onbalansprijs op of zakt ze. De batterij kan dan even meer of minder nemen. Ze volgt gewoon dat prijssignaal (passieve respons).'],
    pk:['Uw hoogste piek lager houden','Een deel van uw nettarief hangt af van uw drukste kwartier van de maand (het capaciteitstarief). Springt de batterij op dat moment bij, dan blijft uw piek lager en betaalt u minder.'],
    lg:['Laden als er ruimte is','Uw aansluiting heeft een maximum. Op rustige momenten gebruikt u maar een deel daarvan. Dan kan de batterij laden uit het net, zonder dat uw piek hoger wordt.'],
    gk:['Goedkoop inkopen','De stroomprijs verandert elk kwartier. ’s Nachts of op zonnige middagen is ze vaak laag. Met een dynamisch contract laadt de batterij op die goedkope momenten.'],
    cb:['Goedkoop én onder uw piek','Dit combineert de twee vorige: de batterij laadt op momenten die goedkoop zijn én waarop uw eigen verbruik laag is. Zo wint u op de prijs, zonder uw piek te verhogen.'],
    ar:['Goedkoop kopen, duur verkopen','Op dezelfde dag kan de prijs sterk verschillen. De batterij laadt als stroom goedkoop is en levert terug als hij duur is. Het verschil is uw winst.'],
    pl:['Laden op de parking zonder piek','Elektrische '+w[1]+' laden op uw parking? Gaan ze allemaal tegelijk aan de lader, dan trekt dat een hoge piek: uw aansluiting is te klein en het capaciteitstarief stijgt. Laadt u slim, gespreid over de kwartieren met ruimte, dan blijft u onder uw aansluiting.'+(ev.type==='vrachtwagen'?'':' U hebt nog geen elektrische wagens? We rekenen met personenwagens, zodat u ziet wat mogelijk is.')],
    pg:['Laden op de parking buiten de piek','Laden op uw eigen parking kost uw stroomprijs plus nettarieven. Wanneer u laadt, maakt veel uit. Op goedkope kwartieren en zonder uw piek te verhogen betaalt u '+(D.spanning==='MS'?'op middenspanning bijna geen extra netkosten':'op laagspanning alleen het kWh-tarief, geen extra capaciteitstarief')+'. Dat ziet u in de kost per 100 km.']}[k];
  if(s===1) return {h:t1[0],p:[t1[1],'We tonen het op een echte dag: <b>'+esc(dg)+'</b>. Klik op «Volgende stap».']};
  if(s===2){
    if(park(k)) return {h:'Zo zou het lopen als iedereen tegelijk laadt',p:['Grafiek ① toont uw gebouw (grijs) en '+nf(ev.n,0)+' '+(ev.n===1?w[0]:w[1])+' die om '+uur(m)+' allemaal tegelijk beginnen te laden (rood). Uw piek stijgt tot <b>'+nf(piekV,0)+' kW</b>, boven uw aansluiting van <b>'+nf(h.grens,0)+' kW</b> (rode stippellijn).']};
    var inj=h.voor.reduce(function(a,v){return a+(v<0?-v*0.25:0);},0), afn=h.voor.reduce(function(a,v){return a+(v>0?v*0.25:0);},0);
    return {h:'Zo loopt uw stroom '+lblVoor(k),p:['Grafiek ① toont uw stroom op '+esc(dg)+', '+lblVoor(k)+'. <b>Boven de lijn</b> neemt u stroom van het net, <b>onder de lijn</b> zet u stroom op het net.',
      'Die dag neemt u ± <b>'+nf(afn,0)+' kWh</b> af'+(inj>1?(' en zet u ± <b>'+nf(inj,0)+' kWh</b> op het net'):'')+'. Uw hoogste kwartier: <b>'+nf(piekV,0)+' kW</b>.']};}
  if(s===3){

      (h?miniSvg(k,h,118,56):'<svg viewBox="0 0 118 56"></svg>')+'<div><b>'+(VOLG.indexOf(k)+1)+' · '+esc(NAAM[k])+'</b><span>'+esc(KORT[k])+'</span>'+
      (h?('<div class="pot">'+(jt?esc(jt[0]):'')+'<small>'+(jt&&jt[1]?esc(jt[1])+' · ':'')+'voorbeelddag: '+esc(dagTxt(h.datum))+'</small></div>'):'<div class="pot"><small>niet van toepassing bij deze installatie</small></div>')+'</div></div>'; });
  html+='</div>';
  document.getElementById('app').innerHTML=kop()+'<div class="wrap"><h1>Uw profiel op de markt verdient beter</h1><p class="sub">Hieronder ziet u per voordeel wat het u het voorbije jaar had opgeleverd. Klik op een voordeel om stap voor stap te zien hoe het werkt, op een echte dag.</p>'+
    (D.gemeten?'':'<div class="voorb">Voorbeeld op basis van een standaardprofiel — exact zodra uw kwartierdata van Fluvius binnen is</div>')+
    '<div class="balk noprint"><a class="kn" href="?mid='+encodeURIComponent(MID)+'&pdf=1" target="_blank" rel="noopener">📄 Inleiding als PDF</a></div>'+html+
    '<div class="combi noprint"><p>De bedragen zijn <b>niet op te tellen</b>: sommige voordelen gebruiken dezelfde batterij of dezelfde zonnestroom. Vink aan wat u wilt meenemen; '+(MERK?'wij rekenen':'Energie-Compas rekent')+' de combinatie kwartier per kwartier door.</p><a id="combi" href="#">Combineer tot één oplossing →</a></div>'+
    '<div class="voet">Echte marktgegevens (spot en onbalans: Elia/EPEX; zon en wind: Elia). Uw stroom komt uit de simulatie van uw dossier'+(D.gemeten?' op uw gemeten kwartierdata':' op een standaardprofiel')+'. '+esc(voetMerk())+'.</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('.ovk'),function(e){ var k=e.getAttribute('data-k'); if(!D.hefbomen[k]) return; e.onclick=function(ev){ if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-c')) return; detail(k); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-c]'),function(c){ c.onchange=function(){ KEUZE[c.getAttribute('data-c')]=c.checked; }; });
  document.getElementById('combi').onclick=function(ev){ ev.preventDefault(); var sel=ks.filter(function(k){return KEUZE[k]!==false;}); location.href=API+'/api/markt-edu/'+MID+'/ek?h='+sel.join(','); };
}
function detail(k){
  KEY=k; STAP=1; CUR=null;
  var opts=VOLG.map(function(x,i){return '<option value="'+x+'"'+(x===KEY?' selected':'')+(D.hefbomen[x]?'':' disabled')+'>'+(i+1)+' · '+esc(NAAM[x])+(D.hefbomen[x]?'':' (niet bij deze installatie)')+'</option>';}).join('');
  document.getElementById('app').innerHTML=kop()+
   '<div class="wrap"><h1>Uw profiel op de markt verdient beter</h1><p class="sub">Zo loopt uw stroom, zo beweegt de markt, en zo kan slimme sturing daarop inspelen.</p>'+
   '<div class="balk"><a class="kn noprint" href="#" id="naarOv">← Overzicht</a><label class="kies"><small>Kies een voordeel</small><select id="kies">'+opts+'</select></label><div class="stappen" id="stappen"></div></div>'+
   (D.gemeten?'':'<div class="voorb">Voorbeeld op basis van een standaardprofiel — exact zodra uw kwartierdata van Fluvius binnen is</div>')+
   '<div class="grid"><div class="kaart">'+
     '<div class="paneel" id="p1"><div class="kop"><b>① Uw stroom</b><span id="d1"></span></div><div class="leg" id="l1"></div><svg id="g1" viewBox="0 0 760 190"></svg></div>'+
     '<div class="paneel" id="p2" style="margin-top:6px"><div class="kop"><b>② De prijzen</b><span>c/kWh</span></div><div class="leg"><span><i style="background:var(--navy)"></i>spotprijs (day-ahead)</span><span><i style="background:#9AA6B8"></i>onbalansprijs</span><span><i style="background:rgba(214,69,69,.2)"></i>negatieve spotprijs</span></div><svg id="g2" viewBox="0 0 760 145"></svg></div>'+
     '<div class="paneel" id="p3" style="margin-top:6px"><div class="kop"><b>③ België</b><span>productie in GW (Elia)</span></div><div class="leg"><span><i style="background:var(--geel)"></i>zon</span><span><i style="background:var(--blauw)"></i>wind</span></div><svg id="g3" viewBox="0 0 760 135"></svg></div>'+
     '<div class="tijdlijn noprint"><input type="range" id="tijd" min="0" max="95" step="0.05" value="0" aria-label="Tijdstip van de dag"></div>'+
     '<div class="hint noprint">Sleep de tijdlijn (of over de grafieken) om zelf door de dag te gaan: <b id="tijdtxt">—</b></div>'+
   '</div><div class="kaart uitleg" id="uitleg"><div class="knop noprint"><button class="k1" id="speel">▶ Speel de dag af</button><button class="k2" id="volg">Volgende stap →</button></div><div id="uitlegTekst"></div></div></div>'+
   '<div class="voet">Echte marktdag (spot en onbalans: Elia/EPEX; zon en wind: Elia). Uw stroom komt uit de simulatie van uw dossier'+(D.gemeten?' op uw gemeten kwartierdata':' op een standaardprofiel')+'. Bedragen zijn voorbeelden; het rapport rekent de combinatie. '+esc(voetMerk())+'.</div></div>';
  document.getElementById('kies').onchange=function(){stopSpeel();KEY=this.value;STAP=1;CUR=null;teken();};
  document.getElementById('naarOv').onclick=function(e){e.preventDefault();overzicht();};
  document.getElementById('speel').onclick=function(){ if(SPEEL){ stopSpeel(); knopSpeel(); return; } speel(); };
  document.getElementById('volg').onclick=function(){ stopSpeel(); var h=H(); if(STAP<5){STAP++;CUR=moment(KEY,h);} else { var ks=beschikbaar(); KEY=ks[(ks.indexOf(KEY)+1)%ks.length]; STAP=1; CUR=null; var se=document.getElementById('kies'); if(se) se.value=KEY; } teken(); };
  bindSlepen(); teken(); window.scrollTo(0,0);
}
function teken(){
  if(!D||!KEY) return; var h=H(); if(CUR==null) CUR=moment(KEY,h);
  haalElia(h.datum);
  document.getElementById('stappen').innerHTML=STAPPEN.map(function(n,i){var s=i+1;return '<span class="st'+(s===STAP?' on':(s<STAP?' ok':''))+'" data-s="'+s+'">'+s+' '+n+'</span>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#stappen .st'),function(e){e.onclick=function(){stopSpeel();STAP=+e.getAttribute('data-s');CUR=moment(KEY,h);teken();};});
  var toonMet=STAP>=4, pk=park(KEY);
  document.getElementById('d1').textContent=dagTxt(h.datum)+' · kW per kwartier';
  document.getElementById('l1').innerHTML=pk
    ? ('<span><i style="background:#C9D3DF"></i>gebouw</span><span><i style="background:rgba(214,69,69,.38)"></i>allemaal tegelijk laden</span>'+(toonMet?'<span><i style="background:rgba(106,175,66,.5)"></i>slim laden</span>':'')+'<span><i style="background:#D64545;height:2px"></i>uw aansluiting</span>')
    : ('<span><i style="background:#C9D3DF"></i>'+lblVoor(KEY)+': afname ↑ / injectie ↓</span>'+(toonMet?('<span><i style="background:var(--groen)"></i>'+lblMet(KEY)+'</span>'+((KEY==='cu'||KEY==='co')?'<span><i style="background:rgba(232,147,12,.5)"></i>panelen even af</span>':'<span><i style="background:rgba(106,175,66,.4)"></i>batterij laadt</span><span><i style="background:rgba(93,169,233,.45)"></i>batterij levert</span>')):''));
  var q=(STAP>=2)?Math.round(CUR):null;
  document.getElementById('g1').innerHTML=g1(h,toonMet,q); document.getElementById('g2').innerHTML=g2(h,q); document.getElementById('g3').innerHTML=g3(h,q);
  if(q!=null) zetCursor(CUR);
  ['p1','p2','p3'].forEach(function(id,i){document.getElementById(id).classList.toggle('focus',(STAP===2&&i===0)||(STAP===3&&i>0)||(STAP===4&&i===0));});
  var t=tekst(KEY,h,STAP), lijst=VOLG.map(function(k,i){var ok=!!D.hefbomen[k];return '<div class="'+(k===KEY?'a':'')+(ok?'':' nvt')+'" data-k="'+k+'"><span>'+(i+1)+' · '+esc(NAAM[k])+'</span><span>'+(k===KEY?'✓':'')+'</span></div>';}).join('');
  document.getElementById('uitlegTekst').innerHTML='<span class="tag">Stap '+STAP+' · '+STAPPEN[STAP-1]+'</span><h2>'+t.h+'</h2>'+t.p.map(function(x){return '<p>'+x+'</p>';}).join('')+(STAP===5?resultaat(KEY,h):'')+'<div class="lijst">'+lijst+'</div>';
  var vb=document.getElementById('volg'); if(vb) vb.textContent=(STAP<5?'Volgende stap →':'Volgend voordeel →'); knopSpeel();
  Array.prototype.forEach.call(document.querySelectorAll('.lijst div'),function(e){var k=e.getAttribute('data-k'); if(!D.hefbomen[k]) return; e.onclick=function(){stopSpeel();KEY=k;STAP=1;CUR=null;var se=document.getElementById('kies');if(se)se.value=k;teken();};});
}
// zelf door de dag (tijdlijn of grafieken slepen) + rustig afspelen (± 30 s per dag)
function naarTijd(qf){ qf=Math.max(0,Math.min(95,qf)); stopSpeel(); if(STAP<2){ STAP=2; CUR=qf; teken(); } CUR=qf; zetCursor(qf); knopSpeel(); }
function bindSlepen(){
  var sl=document.getElementById('tijd'); if(sl) sl.oninput=function(){ naarTijd(+sl.value); };
  ['g1','g2','g3'].forEach(function(id){ var g=document.getElementById(id); if(!g) return; var neer=false;
    function qVan(ev){ var r=g.getBoundingClientRect(); return ((ev.clientX-r.left)/r.width*760-L)/W*95; }
    g.addEventListener('pointerdown',function(ev){ neer=true; try{ g.setPointerCapture(ev.pointerId); }catch(e){} naarTijd(qVan(ev)); });
    g.addEventListener('pointermove',function(ev){ if(neer) naarTijd(qVan(ev)); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){ g.addEventListener(t,function(){ neer=false; }); }); });
}
var DAG_MS=30000;
function knopSpeel(){ var b=document.getElementById('speel'); if(b) b.textContent=SPEEL?'⏸ Pauze':((CUR!=null&&CUR>0.5&&CUR<95&&STAP>=2)?'▶ Verder afspelen':'▶ Speel de dag af'); }
function speel(){
  if(!D||!KEY) return; if(STAP<2){ STAP=2; CUR=0; teken(); } if(CUR==null||CUR>=95) CUR=0;
  var start=null, van=CUR;
  function stap(ts){ if(!SPEEL) return; if(start==null) start=ts; CUR=Math.min(95, van+(ts-start)/DAG_MS*96); zetCursor(CUR);
    if(CUR>=95){ SPEEL=null; knopSpeel(); return; } SPEEL=requestAnimationFrame(stap); }
  SPEEL=requestAnimationFrame(stap); knopSpeel();
}
function stopSpeel(){ if(SPEEL){ cancelAnimationFrame(SPEEL); SPEEL=null; } }
// ---------- PDF-inleiding (A4) ----------
function bouwPdf(){
  var url='https://www.energie-compas.eu/apps/markt.html?mid='+encodeURIComponent(MID), ks=beschikbaar();
  var mini=ks.map(function(k){var h=D.hefbomen[k], jt=jaarTxt(k,h.jaar);return '<div class="mk">'+miniSvg(k,h,96,44)+'<div><b>'+(VOLG.indexOf(k)+1)+' · '+esc(NAAM[k])+'</b><span>'+esc(KORT[k])+'</span>'+(jt?'<span><em>'+esc(jt[0])+'</em></span>':'')+'</div></div>';}).join('');
  var qr='';try{var qq=qrcode(0,'M');qq.addData(url);qq.make();qr=qq.createSvgTag({cellSize:3,margin:0});}catch(e){}
  document.getElementById('app').innerHTML='<div class="noprint" style="text-align:center;padding:10px"><button class="kn" onclick="window.print()">🖨 Afdrukken of bewaren als PDF</button></div>'+
   '<div class="pag"><div class="hd"><div class="logo">'+logoHtml()+'</div><span>Inleiding bij uw energierapport</span></div>'+
   '<h1>Uw profiel op de markt verdient beter</h1><div class="ond">Wat slimme sturing voor u kan doen, in '+ks.length+' eenvoudige voorbeelden</div>'+
   (D.gemeten?'':'<div class="voorb">Voorbeeld op basis van een standaardprofiel · '+esc(D.klant||'')+' · '+nf(D.afname_mwh,0)+' MWh/jaar</div>')+
   '<p>Stroom kost niet altijd hetzelfde. Als heel België veel zon of wind heeft, is stroom goedkoop of zelfs gratis. ’s Avonds, als iedereen kookt en verwarmt, is ze duur. Vandaag merkt u daar weinig van: u neemt stroom af wanneer u ze nodig hebt, en uw overschot gaat het net op.</p>'+
   '<p>Slimme sturing (een <b>EMS</b>) kijkt elk kwartier naar drie dingen tegelijk:</p>'+
   '<div class="drie"><div><b>① Uw stroom</b>Wat u nu afneemt en wat uw panelen nu maken.</div><div><b>② De prijzen</b>De spotprijs per kwartier en de onbalansprijs.</div><div><b>③ Zon en wind</b>Hoeveel stroom heel België nu zelf maakt.</div></div>'+
   '<h2>Zo kan uw profiel beter inspelen op de markt (potentieel over het voorbije jaar)</h2><div class="mini">'+mini+'</div>'+
   '<div class="cta"><div><b>Bekijk het zelf, dag per dag</b><span>Op de interactieve pagina ziet u per voorbeeld een echte dag: uw stroom, de prijzen en zon en wind in België, en wat de sturing op dat moment doet. De bedragen overlappen deels; het rapport rekent de combinatie.<br><br>'+esc(url.replace(/^https?:\/\//,''))+'</span></div><div class="qr">'+qr+'</div></div>'+
   '<div class="pvt"><span>'+esc(voetMerk())+' · grijs = zonder, groen = met slimme sturing</span><span>'+esc(D.project_id||'')+'</span></div></div>';
}
if(!/^[0-9a-f]{20}$/.test(MID)){document.getElementById('app').innerHTML='<div class="laden">Deze link is niet geldig.</div>';return;}
fetch(API+'/api/markt-edu/'+MID).then(function(r){return r.json();}).then(function(j){
  if(!j||!j.ok) throw new Error((j&&j.error)||'niet gevonden');
  D=j; pasMerk();
  if(!D.versie_hefbomen){ document.getElementById('app').innerHTML='<div class="laden">Deze pagina werd met een oudere versie gemaakt. Maak ze opnieuw aan vanuit het dossier.</div>'; return; }
  if(PDF) bouwPdf(); else { var k=Q.get('k'); if(k&&D.hefbomen[k]) detail(k); else overzicht(); }
}).catch(function(e){document.getElementById('app').innerHTML='<div class="laden">Deze pagina kon niet geladen worden ('+esc(e.message)+').</div>';});
})();
</script></body></html>
