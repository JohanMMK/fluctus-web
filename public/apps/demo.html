<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Energie-Compas</title>
<!-- demo.html v0.7.0 (2026-10-11, Johan): UITLEG-MODAL — verschijnt automatisch de eerste keer (per browser, localStorage EC_DEMO_UITLEG_V1) en daarna via de knop «ℹ️ Uitleg» in de kop: wat de demo is, hoe de tabel leest (rij = bezoeker, kolom = stap, cel = tijdstip + tijd sinds vorige stap), de extra kolommen, interesse- en vlot-score, detail + reset. Legende bijgewerkt (PDF +0,5, offertes +1). -->
<!-- demo.html v0.6.0 (2026-10-11, Johan): + kolom 'Offertes gevraagd' (server ≥ 15.268.5; in de demo wordt niets verstuurd) + KPI 'vragen offertes'; telt niet mee in 'hoe ver' maar +1 interesse. 'Hoe ver' rekent nu tot en met de samenvatting via indexOf. -->
<!-- demo.html v0.5.0 (2026-10-11, Johan): + kolommen 'PDF standaard' / 'PDF echt profiel' (bezoeker bewaarde het rapport via 🖨️ Print → PDF; server ≥ 15.268.4, klantrapport ≥ v0.33.0) + KPI 'rapport als PDF bewaard'; de PDF-stappen tellen niet mee in 'hoe ver' maar geven +0,5 interesse. -->
<!-- demo.html v0.4.0 (2026-10-11, Johan): + kolom 'Type' (energiegebruiker / energieleverancier / installatiebedrijf / verkoper van EV's, uit het contactformulier; server ≥ 15.268.3) + teller per type bovenaan. v0.3.0 (2026-10-11, Johan): + knop "↺ Demo resetten" per bezoeker (POST /api/ek/demo-reset, server ≥ 15.268.1). v0.2.0 (2026-10-11, Johan): + herhalingen (↻ n× opnieuw: demo opnieuw gevraagd → geen nieuw project, link naar het bestaande). v0.1.0 (2026-10-11, Johan) — DEMO KLANTBELEVING (manager). Leest GET /api/ek/demo-overzicht (fluctus-proxy ≥ 15.267):
     één rij per bezoeker-mail, één kolom per demo-stap (tijdstip), interesse-score 1–5 per bezoeker (hoe ver + hoe snel) en
     bovenaan een vlot-score 1–5 per stap (5 = vlotte doorgang, 1 = hier blijven bezoekers hangen). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#1F3864;--green:#05B050;--line:#D6E0EC;--muted:#6B7689;--bg:#F4F7FB}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1A1F2B}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{color:var(--navy);font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px}
  main{max-width:1600px;margin:0 auto;padding:16px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px} .kpis div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px}
  .kpis b{display:block;font-size:22px;color:var(--navy)} .kpis span{font-size:12px;color:var(--muted)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .bar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:78vh}
  table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
  th,td{padding:7px 9px;border-bottom:1px solid #EEF2F7;text-align:left;vertical-align:top;font-size:12.5px;white-space:nowrap}
  thead th{background:#F7F9FC;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:2;max-width:110px;white-space:normal;line-height:1.25}
  thead tr.vlot th{position:static;background:#FBFCFE;text-transform:none;letter-spacing:0;font-size:12px}
  th.s0,td.s0{position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid #EEF2F7;min-width:230px;white-space:normal}
  thead th.s0{z-index:3;background:#F7F9FC} thead tr.vlot th.s0{position:sticky;left:0}
  .t{font-variant-numeric:tabular-nums;color:#1A1F2B} .d{display:block;color:var(--muted);font-size:11px} .x{color:#C8D0DA}
  .sc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:13px;color:#fff}
  .sc1{background:#C0392B}.sc2{background:#E67E22}.sc3{background:#D4AC0D}.sc4{background:#58B368}.sc5{background:#05B050}.sc0{background:#C8D0DA}
  .rol{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:#EEF2F7;color:#33404f;white-space:nowrap}
  .rol-gebruiker{background:#E6F6EC;color:#0a7d3c}.rol-leverancier{background:#FFF3D6;color:#8a5a00}.rol-installateur{background:#E8EEFF;color:#2a44a8}.rol-ev_verkoper{background:#F3E8FF;color:#6b2fa8}
  .mail{font-weight:600;color:var(--navy)} .sub{color:var(--muted);font-size:11.5px}
  tr.det td{background:#FAFBFD;white-space:normal}
  a{color:#2a44a8}
  .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px} .state{color:var(--muted);padding:20px}
  .legende{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
  #uitleg-knop{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:600 12.5px inherit;font-family:inherit;color:var(--navy);cursor:pointer}
  #dm-ov{position:fixed;inset:0;z-index:1000;background:rgba(15,28,48,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  #dm-ov .k{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:20px 22px;font-size:14px;line-height:1.55}
  #dm-ov h3{margin:0 0 6px;color:var(--navy);font-size:19px} #dm-ov h4{margin:14px 0 4px;color:var(--navy);font-size:14px}
  #dm-ov ul,#dm-ov ol{margin:4px 0;padding-left:20px} #dm-ov li{margin:3px 0} #dm-ov p{margin:4px 0}
  #dm-ov .tip{margin-top:12px;padding:10px 12px;background:#E6F6EC;border-radius:10px;color:#0B6B35;font-weight:600}
  #dm-ov .a{display:flex;justify-content:flex-end;margin-top:14px} #dm-ov .a button{border:0;background:var(--green);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<header><b>🎬 Demo — klantbeleving</b><span class="sub">bezoekers die de demo aanvroegen via het contactformulier</span><button type="button" id="uitleg-knop">ℹ️ Uitleg</button><span class="who" id="who"></span></header>
<main><div id="root"><div class="state">Laden…</div></div></main>
<script>
  var $=function(id){return document.getElementById(id);};
  var CFG=null, sb=null, SESSION=null, PROXY='', DATA=null, ZOEK='', OPEN={};
  var LABEL={ aangevraagd:'Aangevraagd', demo_mail:'Demo-mail verstuurd', factuur_doorgestuurd:'Factuur doorgestuurd', projectlink:'Projectlink gemaild',
    project_geopend:'Project geopend', sim_std_start:'Sim. standaard gestart', sim_std_klaar:'Resultaat standaard', rapport_std_open:'Rapport standaard', rapport_std_print:'PDF standaard',
    profiel_gekoppeld:'Profiel opgehaald', sim_echt_start:'Sim. echt gestart', sim_echt_klaar:'Resultaat echt profiel', rapport_echt_open:'Rapport echt profiel', rapport_echt_print:'PDF echt profiel',
    samenvatting:'Samenvatting', feedback:'Feedback', contact:'Contact', offertes:'Offertes gevraagd' };
  // Vorige stap voor de doorstroom (feedback/contact volgen allebei op de samenvatting) + max. vlotte wachttijd (min)
  var VORIGE={ offertes:'sim_std_klaar', feedback:'samenvatting', contact:'samenvatting', profiel_gekoppeld:'rapport_std_open', samenvatting:'rapport_echt_open' };   // v0.5.0: PDF-stappen zijn optioneel → niet de 'vorige' van de hoofdlijn
  var VLOT_MIN={ offertes:60, rapport_std_print:30, rapport_echt_print:30, factuur_doorgestuurd:30, project_geopend:30, projectlink:15, rapport_std_open:15, profiel_gekoppeld:15, rapport_echt_open:15, feedback:30, contact:30 };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function p2(n){ return (n<10?'0':'')+n; }
  function tijd(ts){ var d=new Date(+ts); if(isNaN(d.getTime())) return '—'; return p2(d.getHours())+':'+p2(d.getMinutes()); }
  function datum(ts){ var d=new Date(+ts); return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
  function duur(ms){ if(ms==null||!isFinite(ms)) return ''; var s=Math.round(ms/1000); if(s<60) return s+' s'; var m=Math.round(s/60); if(m<120) return m+' min'; var h=Math.round(m/60); if(h<48) return h+' u'; return Math.round(h/24)+' d'; }
  function med(a){ if(!a.length) return null; a=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(a.length/2); return a.length%2?a[m]:(a[m-1]+a[m])/2; }
  function vorige(k,i){ return VORIGE[k]||DATA.stappen[i-1]; }
  function nf(x){ return (x==null||!isFinite(+x))?'—':String(Math.round(+x*10)/10).replace('.',','); }
  // ── Interesse-score per bezoeker: hoe ver (aandeel bereikte stappen) + hoe snel ──
  function interesse(r){
    var S=r.stappen||{}, ks=DATA.stappen.filter(function(k){ return !/_print$/.test(k); }), ver=-1;   // v0.5.0: PDF-stappen tellen niet mee voor 'hoe ver'
    var basis=Math.max(1,ks.indexOf('samenvatting'));   // v0.6.0: tot en met 'samenvatting' (feedback/contact/offertes zijn extra's)
    for(var i=0;i<=basis;i++) if(S[ks[i]]) ver=i;
    var p=Math.max(0,ver)/basis;
    var sc=1+4*Math.min(1,p), uitleg=['ver: '+(ver+1)+'/'+(basis+1)+' stappen'];
    var t0=(S.factuur_doorgestuurd||S.aangevraagd||{}).ts, tEind=null; for(var j=0;j<ks.length;j++) if(S[ks[j]]) tEind=Math.max(tEind||0, +S[ks[j]].ts||0);
    if(t0 && tEind && S.rapport_std_open){ var mins=(tEind-t0)/60000; if(mins<30){ sc+=0.5; uitleg.push('snel (< 30 min): +0,5'); } else if(mins>1440){ sc-=0.5; uitleg.push('traag (> 1 dag): −0,5'); } }
    if(S.rapport_std_print||S.rapport_echt_print){ sc+=0.5; uitleg.push('rapport als PDF bewaard: +0,5'); }
    if(S.offertes){ sc+=1; uitleg.push('vraagt offertes: +1'); }
    if(S.feedback){ sc+=0.5; uitleg.push('feedback: +0,5'); }
    if(S.contact){ sc=5; uitleg.push('vraagt contact → 5'); }
    sc=Math.max(1,Math.min(5,Math.round(sc)));
    return { sc:sc, uitleg:uitleg.join(' · ') };
  }
  // ── Vlot-score per stap: doorstroom vanuit de vorige stap (+ mediane wachttijd) ──
  function vlot(k,i){
    if(i===0) return null;
    var vk=vorige(k,i), nPrev=0, nOk=0, wacht=[], nu=Date.now(), lopend=0;
    DATA.rijen.forEach(function(r){ var S=r.stappen||{}; if(!S[vk]) return;
      if(!S[k] && nu-(+S[vk].ts||0) < 30*60000){ lopend++; return; }   // nog bezig → (nog) niet meetellen
      nPrev++; if(S[k]){ nOk++; var w=(+S[k].ts||0)-(+S[vk].ts||0); if(w>=0) wacht.push(w); } });
    if(!nPrev) return { sc:0, txt:'nog geen data'+(lopend?' ('+lopend+' bezig)':'') };
    var c=nOk/nPrev, sc=c>=0.9?5:(c>=0.75?4:(c>=0.5?3:(c>=0.25?2:1)));
    var m=med(wacht), lim=(VLOT_MIN[k]||10)*60000, extra='';
    if(m!=null && m>lim && sc>1){ sc--; extra=' · mediane wachttijd '+duur(m)+' > '+duur(lim)+' (−1)'; }
    return { sc:sc, txt:nOk+'/'+nPrev+' ('+Math.round(c*100)+' %) vanuit «'+LABEL[vk]+'»'+(m!=null?' · mediaan '+duur(m):'')+extra+(lopend?' · '+lopend+' bezig':'') };
  }
  function cel(r,k,i){
    var S=r.stappen||{}, e=S[k]; if(!e) return '<td class="x">—</td>';
    var vk=vorige(k,i), pv=S[vk], d=(pv&&i>0)?'+'+duur((+e.ts)-(+pv.ts)):'';
    var extra='';
    if((k==='sim_std_klaar'||k==='sim_echt_klaar'||k==='rapport_echt_open') && e.data && (e.data.tvt!=null||e.data.rend!=null)) extra='<span class="d">TVT '+nf(e.data.tvt)+' j · '+nf(e.data.rend)+' %</span>';
    return '<td title="'+esc(datum(e.ts))+(e.n>1?' · '+e.n+'×':'')+'"><span class="t">'+tijd(e.ts)+'</span>'+(d?'<span class="d">'+d+'</span>':'')+extra+'</td>';
  }
  function render(){
    var ks=DATA.stappen, rijen=DATA.rijen.filter(function(r){ if(!ZOEK) return true; return ((r.mail||'')+' '+(r.naam||'')+' '+(r.bedrijf||'')).toLowerCase().indexOf(ZOEK)>=0; });
    var n=DATA.rijen.length, nOpen=DATA.rijen.filter(function(r){return r.stappen.project_geopend;}).length, nEcht=DATA.rijen.filter(function(r){return r.stappen.rapport_echt_open;}).length, nC=DATA.rijen.filter(function(r){return r.stappen.contact;}).length;
    var h='<div class="kpis"><div><b>'+n+'</b><span>bezoekers</span></div><div><b>'+nOpen+'</b><span>project geopend</span></div><div><b>'+nEcht+'</b><span>rapport echt profiel</span></div><div><b>'+DATA.rijen.filter(function(r){return r.stappen.rapport_std_print||r.stappen.rapport_echt_print;}).length+'</b><span>rapport als PDF bewaard</span></div><div><b>'+nC+'</b><span>vragen contact</span></div><div><b>'+DATA.rijen.filter(function(r){return r.stappen.offertes;}).length+'</b><span>vragen offertes</span></div>'+(function(){ var c={}; DATA.rijen.forEach(function(r){ var k=r.rol_label||'onbekend'; c[k]=(c[k]||0)+1; }); return Object.keys(c).sort().map(function(k){ return '<div><b>'+c[k]+'</b><span>'+esc(k)+'</span></div>'; }).join(''); })()+'</div>';
    h+='<div class="bar"><input type="search" id="zoek" placeholder="Zoek op mail, naam of bedrijf…" value="'+esc(ZOEK)+'"><button type="button" id="ververs">↻ Vernieuwen</button></div>';
    h+='<div class="wrap"><table><thead><tr><th class="s0">Bezoeker · interesse</th><th>Type</th>'+ks.map(function(k){ return '<th>'+esc(LABEL[k]||k)+'</th>'; }).join('')+'</tr>';
    h+='<tr class="vlot"><th class="s0" title="5 = vlotte doorgang · 1 = hier blijven bezoekers hangen">Vlot-score per stap</th><th></th>'+ks.map(function(k,i){ var v=vlot(k,i); if(!v) return '<th class="x">—</th>'; return '<th title="'+esc(v.txt)+'"><span class="sc sc'+v.sc+'">'+(v.sc||'–')+'</span></th>'; }).join('')+'</tr></thead><tbody>';
    if(!rijen.length) h+='<tr><td class="s0" colspan="'+(ks.length+2)+'"><div class="state">Nog geen demo-aanvragen'+(ZOEK?' voor deze zoekterm':'')+'.</div></td></tr>';
    rijen.forEach(function(r,ix){
      var it=interesse(r), id='r'+ix;
      h+='<tr><td class="s0"><div style="display:flex;gap:9px;align-items:flex-start"><span class="sc sc'+it.sc+'" title="'+esc('Interesse '+it.sc+'/5 — '+it.uitleg)+'">'+it.sc+'</span><div><a href="#" data-open="'+esc(r.mail)+'" class="mail">'+esc(r.mail)+'</a>'+
        '<div class="sub">'+esc([r.naam,r.bedrijf,r.tel,(r.taal||'').toUpperCase()].filter(Boolean).join(' · '))+(r.n_projecten>1?' · '+r.n_projecten+' projecten':'')+((r.herhalingen&&r.herhalingen.length)?' · <b style="color:#8a5a00" title="Demo opnieuw gevraagd terwijl er al een demo-project was">↻ '+r.herhalingen.length+'× opnieuw</b>':'')+'</div></div></div></td>'+'<td>'+(r.rol_label?'<span class="rol rol-'+esc(r.rol||'')+'">'+esc(r.rol_label)+'</span>':'<span class="x">—</span>')+'</td>'+ks.map(function(k,i){ return cel(r,k,i); }).join('')+'</tr>';
      if(OPEN[r.mail]){
        var fb=r.feedback;
        h+='<tr class="det"><td class="s0" colspan="'+(ks.length+2)+'"><div style="max-width:900px">'+
          (r.project_id?'<div><b>Project:</b> '+esc(r.project_id)+(r.token?' · <a target="_blank" rel="noopener" href="/apps/projectlog.html?token='+encodeURIComponent(r.token)+'">📜 Projectlog</a> · <a target="_blank" rel="noopener" href="/apps/ek.html?case='+encodeURIComponent(r.token)+'&lang='+esc(r.taal||'nl')+'">Open in EK</a>':'')+'</div>':'<div class="sub">Nog geen demo-project (factuur nog niet doorgestuurd).</div>')+
          '<div><b>Aanvragen:</b> '+r.n_aanvragen+' · <b>projecten:</b> '+r.n_projecten+'</div>'+
          '<div style="margin-top:8px"><button type="button" data-reset="'+esc(r.mail)+'" style="border:1px solid #F2C7C7;background:#fff;color:#8a1f1f;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer">↺ Demo resetten</button> <span class="sub">archiveert het demo-project en zet dit mailadres terug op nul → de demo kan opnieuw.</span></div>'+
          ((r.herhalingen&&r.herhalingen.length)?'<div><b>Opnieuw gevraagd (geen nieuw project, link naar het bestaande gemaild):</b> '+r.herhalingen.map(function(h){ return esc(datum(h.ts))+' via '+esc(h.via==='aanvraag'?'contactformulier':(h.via==='antwoord'?'antwoord op demo-mail':'doorgestuurde factuur'))+(h.sent?'':' (mail NIET verstuurd)'); }).join(' · ')+'</div>':'')+
          (fb?('<div style="margin-top:6px"><b>Feedback</b> ('+esc(fb.ts?datum(Date.parse(fb.ts)):'')+')'+(fb.contact?' · <b style="color:#05B050">wil contact</b> · '+esc(fb.mail||'')+(fb.gsm?' · '+esc(fb.gsm):''):'')+'<div style="white-space:pre-wrap;background:#fff;border:1px solid #EEF2F7;border-radius:8px;padding:8px 10px;margin-top:4px">'+esc(fb.commentaar||'—')+'</div></div>'):'<div class="sub">Geen feedback.</div>')+
          '</div></td></tr>';
      }
    });
    h+='</tbody></table></div>';
    h+='<div class="legende"><b>Interesse 1–5</b> (per bezoeker): hoe ver de bezoeker kwam (aandeel van de stappen tot de samenvatting) + snelheid (< 30 min van factuur tot rapport: +0,5; > 1 dag: −0,5) + rapport als PDF bewaard (+0,5) + feedback (+0,5) + offertes gevraagd (+1); contactvraag = 5. Hover voor de opbouw.<br>'+
      '<b>Vlot-score 1–5</b> (per stap): aandeel bezoekers dat de stap bereikte vanuit de vorige stap (≥ 90 % = 5, ≥ 75 % = 4, ≥ 50 % = 3, ≥ 25 % = 2, anders 1), −1 als de mediane wachttijd te lang is. Wie nog geen 30 min op de vorige stap staat, telt (nog) niet mee. Hover voor de cijfers.<br>'+
      'Cellen: tijdstip (hover = volledige datum) en de tijd sinds de vorige stap. Klik op een mailadres voor projectlog, EK-link en feedback.</div>';
    $('root').innerHTML=h;
    $('zoek').oninput=function(){ ZOEK=this.value.trim().toLowerCase(); var pos=this.selectionStart; render(); var z=$('zoek'); z.focus(); try{ z.setSelectionRange(pos,pos); }catch(e){} };
    $('ververs').onclick=laad;
    Array.prototype.forEach.call(document.querySelectorAll('[data-reset]'),function(b){ b.onclick=async function(){
      var m=b.getAttribute('data-reset'); if(!confirm('Demo van '+m+' resetten?\n\nHet demo-project wordt gearchiveerd en dit mailadres kan de demo opnieuw doen.')) return;
      b.disabled=true; b.textContent='⏳ Resetten…';
      try{ var h=await authHeaders(); h['Content-Type']='application/json'; var r=await fetch(PROXY+'/api/ek/demo-reset',{ method:'POST', headers:h, body:JSON.stringify({ mail:m }) }); var j=await r.json().catch(function(){return{};});
        if(!r.ok||!j.ok) throw new Error(j.error||('status '+r.status)); delete OPEN[m]; await laad(); }
      catch(e){ b.disabled=false; b.textContent='↺ Demo resetten'; alert('Resetten lukte niet: '+e.message); }
    }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-open]'),function(a){ a.onclick=function(e){ e.preventDefault(); var m=a.getAttribute('data-open'); OPEN[m]=!OPEN[m]; render(); }; });
  }

  // ── v0.7.0: uitleg-modal (eerste keer automatisch, daarna via «ℹ️ Uitleg») ──
  function uitleg(){
    var o=document.getElementById('dm-ov'); if(o) o.remove();
    o=document.createElement('div'); o.id='dm-ov';
    o.innerHTML='<div class="k" role="dialog" aria-modal="true">'+
      '<h3>🎬 Zo werkt het demo-overzicht</h3>'+
      '<p>Een prospect vinkt op <b>energie-compas.eu/contact</b> «klantbeleving (demo)» aan en kiest wat hij is (energiegebruiker, energieleverancier, installatiebedrijf of verkoper van EV\'s). Hij krijgt een demo-factuur per mail, stuurt die door naar dossier@energie-compas.eu en doorloopt zelf het échte proces: project → simulatie op standaardprofiel → rapport → echt profiel → rapport op maat → samenvatting en feedback. Elke stap komt hier binnen.</p>'+
      '<h4>De tabel</h4><ul>'+
        '<li><b>Eén rij per bezoeker</b> (mailadres), <b>één kolom per stap</b>, van links naar rechts in de volgorde van de klantreis.</li>'+
        '<li>Elke cel toont het <b>tijdstip</b> (hover = volledige datum) en eronder de <b>tijd sinds de vorige stap</b>. Bij de resultaten staan ook terugverdientijd en rendement. «—» = stap nog niet bereikt.</li>'+
        '<li><b>Type</b>: wat de bezoeker op de contactpagina koos. <b>PDF standaard / PDF echt profiel</b>: hij bewaarde het rapport via 🖨️ Print. <b>Offertes gevraagd</b>: hij klikte «📨 Offertes opvragen» (in de demo wordt niets verstuurd). <b>Feedback / Contact</b>: uit de samenvatting op het einde.</li>'+
      '</ul>'+
      '<h4>Twee scores</h4><ul>'+
        '<li><b>Interesse 1–5</b> (bolletje vóór het mailadres): hoe ver de bezoeker kwam + hoe snel, plus PDF bewaard (+0,5), feedback (+0,5) en offertes gevraagd (+1). Wie contact vraagt, krijgt altijd 5. Hover voor de opbouw.</li>'+
        '<li><b>Vlot-score 1–5</b> (bovenste rij, per stap): welk deel van de bezoekers deze stap haalde vanuit de vorige. 5 = vlotte doorgang, 1 = hier haken bezoekers af. Hover voor de cijfers en de mediane wachttijd.</li>'+
      '</ul>'+
      '<h4>Detail en acties</h4><ul>'+
        '<li><b>Klik op een mailadres</b>: project, 📜 projectlog, de EK-link (zie wat de bezoeker zag), feedback en eventuele herhaal-aanvragen.</li>'+
        '<li><b>↺ Demo resetten</b> (in het detail): archiveert het demo-project; dat mailadres kan de demo daarna opnieuw doen.</li>'+
        '<li>Bovenaan: tellers en het aantal per type, zoeken op mail/naam/bedrijf en <b>↻ Vernieuwen</b>.</li>'+
      '</ul>'+
      '<div class="tip">👉 Bel eerst de bezoekers met de hoogste interesse-score — zeker wie offertes of contact vroeg. Een lage vlot-score toont waar de demo beter moet.</div>'+
      '<div class="a"><button type="button" id="dm-ok">Begrepen</button></div></div>';
    document.body.appendChild(o);
    document.getElementById('dm-ok').onclick=function(){ o.remove(); };
    o.addEventListener('click', function(e){ if(e.target===o) o.remove(); });
    try{ localStorage.setItem('EC_DEMO_UITLEG_V1','1'); }catch(e){}
  }
  $('uitleg-knop').onclick=uitleg;
  function uitlegEersteKeer(){ var gezien=null; try{ gezien=localStorage.getItem('EC_DEMO_UITLEG_V1'); }catch(e){} if(!gezien) uitleg(); }
  async function authHeaders(){
    var tok=SESSION&&SESSION.access_token;
    try{ if(sb){ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session){ SESSION=d.data.session; tok=SESSION.access_token; } } }catch(e){}
    return { 'Authorization':'Bearer '+tok };
  }
  async function laad(){
    var r;
    try{ r=await fetch(PROXY+'/api/ek/demo-overzicht?cb='+Date.now(),{ headers: await authHeaders(), cache:'no-store' }); }
    catch(e){ $('root').innerHTML='<div class="fout">Kan de server niet bereiken: '+esc(e.message)+'</div>'; return; }
    if(r.status===401||r.status===403){ $('root').innerHTML='<div class="fout">Het demo-overzicht is enkel voor managers. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
    if(!r.ok){ $('root').innerHTML='<div class="fout">Fout bij ophalen ('+r.status+').</div>'; return; }
    DATA=await r.json(); DATA.rijen=DATA.rijen||[]; DATA.stappen=DATA.stappen||Object.keys(LABEL);
    render();
    if(!laad.ok){ laad.ok=true; uitlegEersteKeer(); }   // v0.7.0
  }
  (async function(){
    try{
      var rc=await fetch('/api/config'); CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      await laad();
    }catch(e){ $('root').innerHTML='<div class="fout">Init-fout: '+esc(e.message)+'</div>'; }
  })();
</script>
