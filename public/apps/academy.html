<style>/*<![CDATA[*/

#fluctus-training-root {
  /* Fluctus brand */
  --green: #05B050;
  --green-dark: #048a3f;
  --green-light: #E8F8EF;
  --green-soft: #F4FBF6;
  --blue: #1F3864;
  --blue-mid: #2E4E8A;
  --blue-light: #EEF3FA;
  --orange: #9E480E;
  --orange-light: #FEF0E6;
  --red: #C0392B;
  --red-light: #FDECEA;

  /* Light neutrals (new palette) */
  --bg: #F8FAFB;
  --surface: #FFFFFF;
  --surface-soft: #F4F6F8;
  --border: #E4E8EC;
  --border-strong: #CBD2D9;
  --text: #1A2B4A;
  --text-mid: #4A5568;
  --text-soft: #6B7785;
  --text-faint: #9AA4B0;

  /* Type */
  --font-head: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, Arial, sans-serif;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(26,43,74,.04), 0 1px 3px rgba(26,43,74,.06);
  --shadow-md: 0 2px 6px rgba(26,43,74,.06), 0 4px 12px rgba(26,43,74,.08);
  --shadow-lg: 0 4px 16px rgba(26,43,74,.08), 0 12px 32px rgba(26,43,74,.10);
  --shadow-green: 0 4px 16px rgba(5,176,80,.18);
}#fluctus-training-root * { margin:0; padding:0; box-sizing:border-box; }#fluctus-training-root, #fluctus-training-root {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}#fluctus-training-root #root { min-height: 100vh; }#fluctus-training-root /* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }#fluctus-training-root ::-webkit-scrollbar-track { background: transparent; }#fluctus-training-root ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }#fluctus-training-root ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }#fluctus-training-root /* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes checkmark { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }#fluctus-training-root .fade-in { animation: fadeIn .35s ease both; }#fluctus-training-root .slide-in { animation: slideIn .3s ease both; }#fluctus-training-root .slide-up { animation: slideUp .4s ease both; }#fluctus-training-root /* ═══════════════════════════════════════════════════════════
   CONTENT ELEMENTS (used inside module slide bodies)
   ═══════════════════════════════════════════════════════════ */
.slide-body h3 {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 17px;
  color: var(--blue);
  margin: 20px 0 10px;
  letter-spacing: 0.2px;
}#fluctus-training-root .slide-body h3:first-child { margin-top: 0; }#fluctus-training-root .slide-body p { margin-bottom: 10px; line-height: 1.6; }#fluctus-training-root .slide-body strong { color: var(--text); font-weight: 700; }#fluctus-training-root .slide-body em { font-style: italic; color: var(--text-mid); }#fluctus-training-root .slide-body ul { margin: 10px 0 14px 20px; }#fluctus-training-root .slide-body ul li { margin-bottom: 4px; line-height: 1.55; }#fluctus-training-root /* Highlight box (call-out) */
.highlight-box {
  background: var(--green-soft);
  border-left: 3px solid var(--green);
  padding: 14px 18px;
  border-radius: 0 6px 6px 0;
  margin: 14px 0;
  font-size: 14px;
  color: var(--text);
  line-height: 1.55;
}#fluctus-training-root .highlight-box strong { color: var(--green-dark); }#fluctus-training-root .highlight-box-xl {
  background: linear-gradient(135deg, var(--green-soft) 0%, var(--blue-light) 100%);
  border: 2px solid var(--green);
  padding: 20px 24px;
  border-radius: 10px;
  margin: 18px 0;
  font-size: 15.5px;
  color: var(--text);
  text-align: center;
  line-height: 1.6;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root /* Triple-grid (golden circle etc) */
.triple-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 14px 0;
}#fluctus-training-root .triple-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .triple-card.triple-why { border-top: 3px solid var(--blue); }#fluctus-training-root .triple-card.triple-how { border-top: 3px solid #FFA800; }#fluctus-training-root .triple-card.triple-what { border-top: 3px solid var(--green); }#fluctus-training-root .triple-label {
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--text-soft);
  text-transform: uppercase;
  margin-bottom: 6px;
}#fluctus-training-root .triple-title {
  font-family: var(--font-head);
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}#fluctus-training-root .triple-text { font-size: 12.5px; color: var(--text-mid); line-height: 1.5; }#fluctus-training-root /* Split grid (left/right) */
.split-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 14px 0;
}#fluctus-training-root .split-left, #fluctus-training-root .split-right {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .split-left.green-border, #fluctus-training-root .split-right.green-border { border-left: 3px solid var(--green); }#fluctus-training-root .split-left.red-border, #fluctus-training-root .split-right.red-border { border-left: 3px solid var(--red); }#fluctus-training-root .split-left.blue-border, #fluctus-training-root .split-right.blue-border { border-left: 3px solid var(--blue); }#fluctus-training-root .split-header {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}#fluctus-training-root .split-header.green { color: var(--green-dark); border-bottom-color: var(--green-light); }#fluctus-training-root .split-header.red { color: var(--red); border-bottom-color: var(--red-light); }#fluctus-training-root .split-header.blue { color: var(--blue); border-bottom-color: var(--blue-light); }#fluctus-training-root .split-sub { font-size: 12px; color: var(--text-soft); font-style: italic; margin-bottom: 6px; }#fluctus-training-root /* Check-list + cross-list */
.check-list, #fluctus-training-root .cross-list { list-style: none; margin-left: 0 !important; padding-left: 0; }#fluctus-training-root .check-list li, #fluctus-training-root .cross-list li {
  position: relative;
  padding-left: 22px;
  margin-bottom: 6px;
  font-size: 13px;
  line-height: 1.5;
}#fluctus-training-root .check-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  top: 0;
  color: var(--green);
  font-weight: 800;
}#fluctus-training-root .cross-list li::before {
  content: '✗';
  position: absolute;
  left: 0;
  top: 0;
  color: var(--red);
  font-weight: 800;
}#fluctus-training-root /* Step-block (numbered vertical) */
.step-block {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 14px;
  margin-bottom: 12px;
  align-items: start;
}#fluctus-training-root .step-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}#fluctus-training-root .step-num.blue { background: var(--blue); }#fluctus-training-root .step-num.orange { background: #C97A1E; }#fluctus-training-root .step-body { font-size: 13px; line-height: 1.55; padding-top: 2px; }#fluctus-training-root .step-body strong { display: block; font-size: 14px; color: var(--text); margin-bottom: 2px; }#fluctus-training-root .step-detail { color: var(--text-mid); font-size: 12.5px; line-height: 1.5; }#fluctus-training-root /* KPI grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 14px 0;
}#fluctus-training-root .kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .kpi-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-soft);
  margin-bottom: 6px;
}#fluctus-training-root .kpi-value {
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 26px;
  color: var(--blue);
  line-height: 1;
  margin-bottom: 4px;
}#fluctus-training-root .kpi-value.green { color: var(--green); }#fluctus-training-root .kpi-sub { font-size: 11.5px; color: var(--text-soft); }#fluctus-training-root /* Data table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  background: var(--surface);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  font-size: 13px;
}#fluctus-training-root .data-table th {
  background: var(--surface-soft);
  padding: 10px 12px;
  text-align: left;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-mid);
  border-bottom: 1px solid var(--border);
}#fluctus-training-root .data-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}#fluctus-training-root .data-table tr:last-child td { border-bottom: none; }#fluctus-training-root .data-table tr.row-highlight td {
  background: var(--green-soft);
  font-weight: 600;
}#fluctus-training-root .data-table tr.row-total td {
  background: var(--blue-light);
  font-weight: 700;
  border-top: 2px solid var(--blue);
}#fluctus-training-root .data-table tr.row-total.green td {
  background: var(--green-light);
  border-top-color: var(--green);
}#fluctus-training-root .data-table .col-good { color: var(--green-dark); font-weight: 600; }#fluctus-training-root .data-table .col-bad { color: #C97A1E; font-weight: 600; }#fluctus-training-root /* Calc block (stacked math) */
.calc-block {
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin: 12px 0;
  font-family: 'Barlow', sans-serif;
  font-size: 13.5px;
}#fluctus-training-root .calc-line { padding: 4px 0; color: var(--text-mid); }#fluctus-training-root .calc-line strong { color: var(--text); }#fluctus-training-root .calc-line.green strong { color: var(--green-dark); }#fluctus-training-root .calc-line.orange strong { color: #C97A1E; }#fluctus-training-root .calc-line.total { font-size: 15.5px; font-weight: 700; padding-top: 6px; }#fluctus-training-root .calc-line.total strong { color: var(--green); }#fluctus-training-root .calc-divider { border-top: 2px solid var(--border-strong); margin: 6px 0; }#fluctus-training-root /* Journey grid */
.journey-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin: 14px 0;
}#fluctus-training-root .journey-step {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 3px solid var(--green);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .journey-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}#fluctus-training-root .journey-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 6px;
}#fluctus-training-root .journey-body { font-size: 12.5px; color: var(--text-mid); line-height: 1.5; margin-bottom: 8px; }#fluctus-training-root .journey-time {
  font-size: 11px;
  color: var(--text-soft);
  font-style: italic;
  padding-top: 6px;
  border-top: 1px solid var(--border);
}#fluctus-training-root /* Scenario box */
.scenario-box {
  background: var(--surface);
  border-radius: 8px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .scenario-box.green { border-left: 3px solid var(--green); background: var(--green-soft); }#fluctus-training-root .scenario-box.red { border-left: 3px solid var(--red); background: var(--red-light); }#fluctus-training-root .scenario-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 8px;
  color: var(--text);
}#fluctus-training-root .scenario-box.green .scenario-title { color: var(--green-dark); }#fluctus-training-root .scenario-box.red .scenario-title { color: var(--red); }#fluctus-training-root .scenario-action {
  margin-top: 10px;
  padding: 10px;
  background: var(--surface);
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text-mid);
  border: 1px solid var(--border);
}#fluctus-training-root /* Doc grid */
.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin: 14px 0;
}#fluctus-training-root .doc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
}#fluctus-training-root .doc-num {
  position: absolute;
  top: -10px;
  left: 14px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--blue);
  color: white;
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}#fluctus-training-root .doc-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  margin: 8px 0 6px;
}#fluctus-training-root .doc-detail { font-size: 12.5px; color: var(--text-mid); line-height: 1.5; margin-bottom: 8px; }#fluctus-training-root .doc-who { font-size: 11px; color: var(--blue); font-weight: 600; }#fluctus-training-root /* Email block */
.email-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}#fluctus-training-root .email-header {
  background: var(--surface-soft);
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--text-mid);
  border-bottom: 1px solid var(--border);
}#fluctus-training-root .email-header > div { margin-bottom: 2px; }#fluctus-training-root .email-header code {
  background: var(--green-soft);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--green-dark);
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 12px;
  font-weight: 600;
}#fluctus-training-root .email-body { padding: 14px; font-size: 12.5px; line-height: 1.6; color: var(--text); }#fluctus-training-root .email-body p { margin-bottom: 8px; }#fluctus-training-root .email-body ul { margin: 6px 0 8px 18px; }#fluctus-training-root /* Objection box */
.obj-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .obj-label {
  font-family: var(--font-head);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-soft);
  margin-bottom: 4px;
  margin-top: 8px;
}#fluctus-training-root .obj-label:first-child { margin-top: 0; }#fluctus-training-root .obj-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
  padding-bottom: 4px;
}#fluctus-training-root .obj-text em { color: var(--blue); font-style: italic; }#fluctus-training-root /* Pitch card */
.pitch-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin: 14px 0;
  box-shadow: var(--shadow-sm);
}#fluctus-training-root .pitch-step {
  padding: 10px 12px;
  margin-bottom: 8px;
  background: var(--surface-soft);
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.55;
  border-left: 3px solid var(--green);
}#fluctus-training-root .pitch-step:last-child { margin-bottom: 0; }#fluctus-training-root .pitch-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 12px;
  margin-right: 6px;
}#fluctus-training-root /* Numbered list + compare list */
.num-list { counter-reset: item; list-style: none !important; padding-left: 0; margin-left: 0 !important; }#fluctus-training-root .num-list li {
  counter-increment: item;
  position: relative;
  padding-left: 32px;
  margin-bottom: 6px;
  font-size: 13px;
  line-height: 1.55;
}#fluctus-training-root .num-list li::before {
  content: counter(item);
  position: absolute;
  left: 0;
  top: 0;
  width: 22px; height: 22px;
  background: var(--blue);
  color: white;
  border-radius: 50%;
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}#fluctus-training-root .compare-list {
  list-style: none !important;
  padding: 8px 12px;
  margin: 10px 0 !important;
  background: var(--surface-soft);
  border-radius: 6px;
  border: 1px solid var(--border);
}#fluctus-training-root .compare-list li { padding: 3px 0; font-size: 13px; }#fluctus-training-root /* Eco table, #fluctus-training-root wrong/right boxes, #fluctus-training-root tags */
.eco-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  font-size: 13px;
}#fluctus-training-root .eco-table th {
  background: var(--blue);
  color: white;
  padding: 10px 12px;
  text-align: left;
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}#fluctus-training-root .eco-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}#fluctus-training-root .wrong-box, #fluctus-training-root .right-box {
  padding: 14px 16px;
  margin: 12px 0;
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  font-size: 13px;
  line-height: 1.55;
}#fluctus-training-root .wrong-box {
  background: var(--red-light);
  border: 1px solid #F0B8B2;
}#fluctus-training-root .right-box {
  background: var(--green-soft);
  border: 1px solid #A8E0BC;
}#fluctus-training-root .wrong-box em, #fluctus-training-root .right-box em { display: block; margin: 6px 0; font-size: 14px; }#fluctus-training-root .wrong-box small, #fluctus-training-root .right-box small { color: var(--text-mid); font-size: 12px; }#fluctus-training-root .tag-green, #fluctus-training-root .tag-red {
  display: inline-block;

  function backend(path, opts) {

    if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

      createdAt: p.created_at,
      progress: p.progress || { modules: {}, startedAt: null, lastActiveAt: null } };
  }

      return snap.certs.filter(function (c) { return c.email && c.email.toLowerCase() === email.toLowerCase(); });
    },

      limit = limit || 200;
      var l = snap.logs;
      if (email) l = l.filter(function (x) { return x.email && x.email.toLowerCase() === email.toLowerCase(); });

/* ═══════════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════════ */
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return `${s}s geleden`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m geleden`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}u geleden`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}d geleden`;
  return new Date(iso).toLocaleDateString('nl-BE');
}
