<!DOCTYPE html>
<!-- ============================================================
     KAMINO — single-page front v0.9.1 (Mijn Fluctus-app · testmodus)
     v0.9: STUDIE 1 ECHT — de onderhandelingsmarge wordt live berekend via /api/kamino/onderhandel
           (dezelfde buildSimInput → simulator.py als de simulator, dus drift-vrij). Kerncijfers op de kaart
           en het resultaat komen uit de echte run; verbruiksprofielen geladen uit /api/profielen-lijst.
           Studies 2–4 volgen hetzelfde patroon (nog placeholder).
     v0.8: TOEGANGSPOORT — bestaand project openen met project-ID + e-mail (klant of adviseur). Zo werken
           klant en adviseur samen verder op hetzelfde project (volgende studie), zonder mailverkeer.
           Projectrecord (incl. e-mails, factuurref, baseCase, gedane studies) wordt bewaard via
           /api/kamino/project; heropenen via /api/kamino/project-open (e-mail moet matchen).
     NIEUW MODEL (27-07): 4 AANDACHTSPUNTEN × 1 studie × 3 kerncijfers. Geen teasers/inzichten meer.
       1 Mijn contract  → Dynamisch contract (gratis)
       2 Mijn productie → SolarActive (gratis)
       3 Mijn aansluiting → BatteryActive (€2.950 + cash back)
       4 Mijn mobiliteit → E+Drive / Jacopsroute (€3.950 + cash back)
     Input 1–3: factuur + verbruiksprofiel + bestaande PV (kWp, injectie MWh) — één keer, voedt 3 studies.
     Input 4: laadpleinen (per plein: autotype, tijd/dag, 5/6/7 dagen, laadpalen), meerdere pleinen.
     Flow 3&4: eerste rapport op standaardprofiel → videovergadering + kabelplanner (+ mandaat specifiek profiel).
     Behoudt slice 1a: echte factuur-upload → /api/factuur-extract (Supabase) + echt project-ID.
     De echte kerncijfers (marge/rendement/€per km) = de run, per studie, geverifieerd — volgt (nu placeholder).
     ============================================================ -->
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamino — uw pad naar maximale elektrificatie</title>
<style>
  :root{--blauw:#1F3864;--blauw-l:#2d4f8e;--groen:#05B050;--groen-d:#048443;--oranje:#E8A33D;--oranje-d:#9E480E;
    --grijs:#5A6577;--lijn:#DCE3EC;--bg:#EEF2F7;--zwart:#1A1F2B;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--zwart);
    background:radial-gradient(1200px 600px at 50% -10%,#fff,var(--bg));min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 44px}
  a{color:inherit;text-decoration:none}
  header.k{text-align:center;margin-bottom:8px}
  .brand{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--grijs);font-weight:700;cursor:pointer}
  h1{font-size:34px;color:var(--blauw);font-weight:800;line-height:1.06;margin:6px 0 4px}
  h1 span{color:var(--groen-d)}
  .baseline{font-size:14.5px;color:var(--grijs);max-width:680px;margin:6px auto 0;line-height:1.5}
  .projbanner{max-width:720px;margin:16px auto 0;background:#F3FBF5;border:1px solid #05B05055;border-radius:10px;padding:9px 14px;font-size:13px;color:#0A6B2E}
  .projbanner b{color:var(--blauw)}
  .projbanner-top{display:flex;align-items:center;gap:10px}
  .projbanner-contact{margin-top:7px;padding-top:7px;border-top:1px solid #05B05033;display:flex;flex-direction:column;gap:3px}
  .projcontact{font-size:12.5px;color:#33475b}
  .pcrol{display:inline-block;min-width:66px;font-weight:700;color:#0A6B2E}
  /* 4 aandachtspunten */
  .punten{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .punt{position:relative;background:#fff;border:1px solid var(--lijn);border-top:5px solid var(--blauw);border-radius:14px;
    padding:18px 18px 16px;cursor:pointer;box-shadow:0 3px 12px rgba(31,56,100,.07);transition:transform .16s,box-shadow .16s}
  .punt:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(31,56,100,.15)}
  .punt.gratis{border-top-color:var(--groen)} .punt.betaald{border-top-color:var(--oranje-d)}
  .punt.done{background:#F6FBF7}
  .p-top{display:flex;align-items:center;gap:11px}
  .p-nr{width:30px;height:30px;border-radius:50%;background:#1F386410;color:var(--blauw);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .punt.gratis .p-nr{background:#05B05018;color:var(--groen-d)} .punt.betaald .p-nr{background:#E8A33D22;color:var(--oranje-d)}
  .p-ic{font-size:24px} .p-punt{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--grijs);font-weight:700}
  .p-vr{font-size:17px;font-weight:800;color:var(--blauw);line-height:1.2;margin:8px 0 2px}
  .p-studie{font-size:12.5px;color:var(--grijs);margin-bottom:12px}
  .p-studie b{color:var(--zwart)}
  .p-badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;margin-left:6px}
  .badge-gratis{background:#05B05018;color:var(--groen-d)} .badge-betaald{background:#E8A33D22;color:var(--oranje-d)}
  .kern3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .kern{background:#F7F9FC;border:1px solid var(--lijn);border-radius:9px;padding:9px 10px;text-align:center}
  .kern .kl{font-size:9.5px;color:var(--grijs);font-weight:700;line-height:1.2;min-height:22px}
  .kern .kv{font-size:16px;color:var(--blauw);font-weight:800;margin-top:3px}
  .punt.betaald .kern .kv{color:var(--oranje-d)} .punt.gratis .kern .kv{color:var(--groen-d)}
  .p-check{position:absolute;top:14px;right:15px;color:var(--groen-d);font-weight:800}
  .p-open{font-size:12px;color:var(--blauw);font-weight:700;margin-top:12px}
  .poort{max-width:640px;margin:16px auto 0;text-align:center;background:#fff;border:1px dashed #9db4de;border-radius:10px;padding:11px 16px;font-size:13px;color:var(--grijs);cursor:pointer;transition:background .15s}
  .poort:hover{background:#1F386408}.poort b{color:var(--blauw)}
  .voet{font-size:11.5px;color:var(--grijs);text-align:center;margin-top:16px}
  /* scherm / formulier */
  .screen{max-width:720px;margin:0 auto}
  .crumb{font-size:12.5px;color:var(--grijs);margin-bottom:10px;cursor:pointer}.crumb:hover{color:var(--blauw)}
  .card{background:#fff;border:1px solid var(--lijn);border-radius:14px;padding:22px 24px;box-shadow:0 4px 16px rgba(31,56,100,.08)}
  .qh{display:flex;align-items:flex-start;gap:12px}.qh .ic{font-size:30px}
  .qh h2{font-size:22px;color:var(--blauw);font-weight:800;line-height:1.15}
  .qsub{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-top:3px}
  .qintro{font-size:13.5px;color:var(--grijs);margin:8px 0 4px;line-height:1.5}
  .sec{border-top:1px solid var(--lijn);padding-top:14px;margin-top:14px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--oranje-d);font-weight:800;margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:12px;color:var(--grijs);font-weight:600;margin-bottom:4px}
  .fld input,.fld select{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--lijn);border-radius:8px;padding:9px 10px;background:#fff}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--blauw)}
  .fld .hint{font-size:10.5px;color:#8A93A3;margin-top:3px}
  .radio{display:flex;gap:8px;flex-wrap:wrap}
  .radio label{border:1px solid var(--lijn);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .radio label.on{border-color:var(--blauw);background:#1F386408;font-weight:700;color:var(--blauw)}
  .prijs{background:#FFF7EC;border:1px solid #E8A33D66;border-radius:8px;padding:8px 12px;font-size:12px;color:var(--oranje-d);margin:10px 0}
  .projkies{background:#F3FBF5;border:1px solid #05B05055;border-radius:8px;padding:10px 12px;font-size:13px;color:#0A6B2E}.projkies b{color:var(--blauw)}
  .belofte{background:linear-gradient(180deg,#F5FBF7,#fff);border:1px solid #05B05055;border-radius:10px;padding:14px 16px;margin:12px 0}
  .belofte .bt{font-size:13px;font-weight:800;color:var(--groen-d);margin-bottom:8px}
  .belofte ul{list-style:none;margin:0;padding:0}
  .belofte li{font-size:12.5px;color:#33404f;line-height:1.5;padding:6px 0 6px 22px;position:relative;border-top:1px solid #EAF3EC}
  .belofte li:first-child{border-top:none}.belofte li:before{content:"✓";position:absolute;left:0;top:6px;color:var(--groen-d);font-weight:800}
  .belofte li b{color:var(--blauw)}
  .plein{border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#FBFCFE}
  .plein-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .plein-top b{color:var(--blauw);font-size:13px} .plein-del{font-size:11px;color:#B23;cursor:pointer;font-weight:700}
  .tweestaps{background:#F5F8FD;border:1px solid #1F386426;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#33404f;line-height:1.55;margin-top:12px}
  .tweestaps b{color:var(--blauw)}
  .btn{border:1px solid var(--blauw);background:#fff;color:var(--blauw);font-family:inherit;font-weight:700;font-size:12.5px;border-radius:8px;padding:10px 15px;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--blauw);color:#fff}.btn.green{border-color:var(--groen-d);background:var(--groen-d);color:#fff}.btn.green:hover{filter:brightness(1.07)}
  .btn.ghost{border-color:var(--lijn);color:var(--grijs)}.btn.ghost:hover{color:var(--blauw);border-color:var(--blauw)}
  .bevestig{background:#EAF7EE;border:1px solid #05B05055;border-radius:10px;padding:16px;color:#0A6B2E;font-size:13.5px;line-height:1.5}
  .kernbig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
  .kernbig .k{background:#fff;border:1px solid var(--lijn);border-radius:10px;padding:13px;text-align:center}
  .kernbig .kl{font-size:11px;color:var(--grijs);font-weight:700;min-height:26px}.kernbig .kv{font-size:22px;font-weight:800;color:var(--blauw);margin-top:4px}
  .sim-topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #e2ebe4;background:#fff;position:sticky;top:0;z-index:100}
  .sim-topbar a{color:#2b8f3a;font-weight:600;text-decoration:none;font-size:.95rem}.sim-topbar a:hover{text-decoration:underline}
  .sim-topbar .titel{font-weight:800;color:#1a2b22}
  .sim-topbar .test{margin-left:auto;font-size:11px;font-weight:700;color:#9E480E;background:#FFF3E0;border:1px solid #E8A33D66;border-radius:20px;padding:3px 10px}
  @media (max-width:760px){.punten{grid-template-columns:1fr}.row,.row3,.kern3,.kernbig{grid-template-columns:1fr}h1{font-size:28px}}
</style>

<script>(function(){try{var has=false;for(var i=0;i<localStorage.length;i++){if(/^sb-.+-auth-token$/.test(localStorage.key(i)))has=true;}if(!has)location.replace('/portal.html');}catch(e){}})();</script>
<div class="sim-topbar"><a href="/portal.html">← Mijn Fluctus</a><span class="titel">Kamino</span><span class="test">TESTMODUS · betaalde studies gaan door</span></div>
<div class="wrap" id="app"></div>

<script>
// ---------- 4 aandachtspunten ----------
var PUNTEN=[
 {id:'contract', nr:1, ic:'📄', punt:'Mijn contract', vr:'Kan ik beter onderhandelen?',
   studie:'Dynamisch contract', gratis:true,
   kern:[{l:'Onderhandelingsmarge',v:'− € 12.200/j'},{l:'Kost nu → dynamisch',v:'€82 → €61'},{l:'Besparing',v:'− 15 %'}],
   intro:'We lezen uw factuur in en simuleren exact hetzelfde verbruik op een scherp dynamisch contract. Het verschil is uw onderhandelingsmarge.',
   input:'factuur' },
 {id:'productie', nr:2, ic:'☀️', punt:'Mijn productie', vr:'Kan ik meer verdienen aan mijn injectie?',
   studie:'SolarActive', gratis:true,
   kern:[{l:'Extra opbrengst',v:'+ € 473/j'},{l:'Vermeden curtailment',v:'8 MWh/j'},{l:'Terugverdientijd',v:'3,2 j'}],
   intro:'We berekenen wat uw bestaande PV extra kan opbrengen door slim te sturen op de spot- en onbalansmarkt — zonder uw eigen verbruik te raken.',
   input:'factuur' },
 {id:'aansluiting', nr:3, ic:'🔋', punt:'Mijn aansluiting', vr:'Kan ik met mijn aansluiting meer besparen of verdienen?',
   studie:'BatteryActive', gratis:false, prijs:'€ 2.950', cashback:true,
   kern:[{l:'Besparing',v:'− € 90.000/j'},{l:'Rendement',v:'14 %'},{l:'Terugverdientijd',v:'6,3 j'}],
   intro:'We rekenen de ideale opstelling én uw groeipad door op uw echte verbruik (extra PV + opslag + slimme sturing, afschrijving 15 jaar).',
   input:'factuur', tweestaps:true },
 {id:'mobiliteit', nr:4, ic:'🚐', punt:'Mijn mobiliteit', vr:'Kan ik de kost per km verlagen?',
   studie:'E+Drive (Jacopsroute)', gratis:false, prijs:'€ 3.950', cashback:true,
   kern:[{l:'Kost per km',v:'± € 0,04/km'},{l:'Rendement',v:'> 12 %'},{l:'Vloot gedekt',v:'40 voertuigen'}],
   intro:'We tonen wat het laden van uw vloot kost per km binnen uw aansluiting, met de ideale laadinfrastructuur en het groeipad.',
   input:'laadpleinen', tweestaps:true }
];
var PROFIELEN=['Standaardprofiel (aanbevolen)','Kantoor / diensten','Winkel / retail','Productie / KMO','Opslag / magazijn','Landbouw','Horeca','Zorg / school'];
var AUTOTYPES=['Bestelwagens','Personenwagens','Vrachtwagens','Gemengd'];

// ---------- state: project-centrisch (één factuur → studies 1–3; 4 voegt laadpleinen toe) ----------
var STATE={
  contact:{k_naam:'',k_mail:'',k_tel:'',a_naam:'',a_mail:'',a_tel:''},
  werk:{ id:null, naam:'', factuur:'', profiel:PROFIELEN[0], pv_kwp:'', pv_inj:'', pleinen:[], baseCase:null, opgeslagen:false },
  projecten:[],
  gedaan:{},  // { projectId: { puntId: true } }
  kern:{},    // { projectId: { puntId: [{l,v},...] } } — echte kerncijfers na de run
  diag:{},    // { projectId: { puntId: 'toelichting' } }
  rapport:{}  // { 'projectId|puntId': { key, data } } — rapportdata uit de simulator, voor "Bekijk rapport"
};
var _factuurFile=null;

// ---------- echte opslag-plumbing (slice 1a) ----------
var API_BASE='https://lucid-amazement-production.up.railway.app';
function kToken(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
  if(/^sb-.+-auth-token$/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null');
    return (v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)))||null; } } }catch(e){} return null; }
function ingelogd(){ return !!kToken(); }
function kApiPost(path, body){ var tok=kToken(), h={'Content-Type':'application/json'}; if(tok) h['Authorization']='Bearer '+tok;
  return fetch(API_BASE+path,{method:'POST',headers:h,body:JSON.stringify(body)}).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); }); }
function kApiGet(path){ var tok=kToken(), h={}; if(tok) h['Authorization']='Bearer '+tok;
  return fetch(API_BASE+path,{headers:h}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
// echte kerncijfers per project+studie
function kernOf(pid,id){ return (STATE.kern[pid]||{})[id]||null; }
function bewaarKern(id,kern){ var pid=STATE.werk.id; if(!pid) return; (STATE.kern[pid]||(STATE.kern[pid]={}))[id]=kern; }
function bewaarDiag(id,txt){ var pid=STATE.werk.id; if(!pid) return; (STATE.diag[pid]||(STATE.diag[pid]={}))[id]=txt; }
function diagOf(pid,id){ return (STATE.diag[pid]||{})[id]||''; }
function eurJaar(n){ n=Math.round(+n||0); var s=(''+Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return '€ '+s+'/j'; }
function fileNaarB64(file){ return new Promise(function(res,rej){ var fr=new FileReader();
  fr.onload=function(){ try{ res(String(fr.result).split(',')[1]); }catch(e){ rej(e); } };
  fr.onerror=function(){ rej(new Error('bestand lezen mislukt')); }; fr.readAsDataURL(file); }); }
function projectIdLokaal(project){ var s=String(project||'').trim().toLowerCase(),h=0x811c9dc5>>>0;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  var c=h.toString(36).toUpperCase(); while(c.length<7)c='0'+c; c=c.slice(-7); return 'FLX-'+c.slice(0,3)+'-'+c.slice(3); }
function extractFactuur(file){ return fileNaarB64(file).then(function(b64){
  return kApiPost('/api/factuur-extract',{ files:[{ base64:b64, mediaType:(file.type||'application/pdf'), fileName:file.name }] });
  }).then(function(r){ return (r&&r.baseCase)||r||{}; }); }

// ---------- helpers ----------
function byId(id){ return PUNTEN.find(function(p){return p.id===id;}); }
function heeftActief(){ return !!STATE.werk.id; }
function projById(id){ return STATE.projecten.find(function(p){return p.id===id;}); }
function gedaanMap(){ var id=STATE.werk.id; if(!id) return {}; return STATE.gedaan[id]||(STATE.gedaan[id]={}); }
function nieuwWerk(){ STATE.werk={ id:null, naam:'', factuur:'', profiel:PROFIELEN[0], pv_kwp:'', pv_inj:'', pleinen:[], baseCase:null, opgeslagen:false }; _factuurFile=null; }
function vandaag(){ var d=new Date(); return ('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear(); }
function ci(k){ return (STATE.contact[k]||'').replace(/"/g,'&quot;'); }
function heeftFactuur(){ return !!(STATE.werk.opgeslagen || STATE.werk.factuur); }

function belofteBlok(){
  return '<div class="belofte"><div class="bt">Onze belofte — u neemt geen risico (de "cash back")</div><ul>'+
    '<li><b>Rendementsgarantie.</b> Tonen we geen rendement van minstens 10 % aan? Dan betalen we u de studie integraal terug.</li>'+
    '<li><b>Wij begeleiden de uitvoering.</b> We staan uw installateur bij zodat u de berekende resultaten ook effectief haalt.</li>'+
    '<li><b>Bij uitvoering kost ze u niets.</b> Ernstige installateurs betalen de studie met plezier terug bij uw eerste bestelling.</li>'+
    '</ul></div>';
}
var app=document.getElementById('app');

// ---------- OVERZICHT: 4 aandachtspunten ----------
function renderOverzicht(){
  var g=gedaanMap();
  var kaarten=PUNTEN.map(function(p){
    var done=g[p.id], kls=p.gratis?'gratis':'betaald';
    var badge=p.gratis?'<span class="p-badge badge-gratis">gratis</span>':'<span class="p-badge badge-betaald">'+p.prijs+(p.cashback?' + cash back':'')+'</span>';
    var kern=kernOf(STATE.werk.id,p.id)||p.kern;   // echte cijfers als beschikbaar, anders voorbeeld
    return '<div class="punt '+kls+(done?' done':'')+'" onclick="location.hash=\'#/punt/'+p.id+'\'">'+
      (done?'<span class="p-check">✓</span>':'')+
      '<div class="p-top"><div class="p-nr">'+p.nr+'</div><div class="p-ic">'+p.ic+'</div><div class="p-punt">'+p.punt+'</div></div>'+
      '<div class="p-vr">'+p.vr+'</div>'+
      '<div class="p-studie">Studie: <b>'+p.studie+'</b>'+badge+'</div>'+
      '<div class="kern3">'+kern.map(function(k){return '<div class="kern"><div class="kl">'+k.l+'</div><div class="kv">'+k.v+'</div></div>';}).join('')+'</div>'+
      '<div class="p-open">'+(done?'Bekijk opnieuw →':'Start deze studie →')+'</div>'+
    '</div>';
  }).join('');
  var banner='';
  if(heeftActief()){
    var c=STATE.contact||{};
    var esc=function(s){ return String(s||'').replace(/</g,'&lt;'); };
    var contactRegel=function(rol,naam,mail,tel){
      var d=[naam,mail,tel].map(esc).filter(Boolean).join(' · ');
      return d?('<div class="projcontact"><span class="pcrol">'+rol+'</span> '+d+'</div>'):'';
    };
    var kr=contactRegel('Klant', c.k_naam, c.k_mail, c.k_tel);
    var ar=contactRegel('Adviseur', c.a_naam, c.a_mail, c.a_tel);
    banner='<div class="projbanner">'+
      '<div class="projbanner-top">📁 Actief project: <b>'+STATE.werk.id+'</b>'+(STATE.werk.naam?' · '+STATE.werk.naam:'')+
        '<button class="btn ghost" style="margin-left:auto;padding:5px 11px" onclick="nieuwWerk();renderOverzicht()">+ Nieuw project</button></div>'+
      ((kr||ar)?('<div class="projbanner-contact">'+kr+ar+'</div>'):'')+
    '</div>';
  }
  app.innerHTML=
    '<header class="k"><div class="brand" onclick="location.hash=\'#/\'">Fluctus.net · Kamino</div>'+

function _bezig(msg){ app.innerHTML='<div class="screen"><div class="card" style="text-align:center;padding:40px 24px">'+
  '<div style="font-size:34px">⏳</div><div style="font-size:16px;color:#1F3864;font-weight:700;margin-top:10px">'+msg+'</div>'+
  '<div class="hint" style="margin-top:8px">Een factuur inlezen duurt ± 30–45 seconden. Sluit dit scherm niet.</div></div></div>'; }
// async job-poller (studie 3/4): pollt /api/sim-voortgang tot 'klaar' of 'fout'; toont de laatste logregel.
function _pollKamino(jobId, onKlaar, onFout){
  var pogingen=0, max=260; // ~6,5 min @ 1,5s
  (function tick(){
    pogingen++;
    kApiGet('/api/sim-voortgang/'+encodeURIComponent(jobId)).then(function(j){
      if(j&&j.status==='klaar'){ onKlaar(j.resultaat||{}); return; }
      if(j&&j.status==='fout'){ onFout(j.fout||'onbekende fout'); return; }
      if(pogingen>=max){ onFout('time-out — probeer opnieuw'); return; }
      var laatste=(j&&j.log&&j.log.length)?j.log[j.log.length-1]:null;
      if(laatste&&laatste.tekst) _bezig(laatste.tekst);
      setTimeout(tick,1500);
    }).catch(function(e){ if(pogingen>=max){ onFout((e&&e.message)||e); } else setTimeout(tick,1500); });
  })();
}
// v0.9.4 — LAUNCHER-model, KLANTVRIENDELIJK. De klant ziet ALLEEN Kamino. De simulator draait als
// ONZICHTBARE rekenmachine in een verborgen iframe; na de run stuurt hij (postMessage) de kerncijfers +
// rapportdata terug. Kamino blijft op zijn eigen scherm en toont daar de kerncijfers + een knop "Bekijk
// rapport", die het simulator-rapport IN Kamino opent. De simulator wordt nooit aan de klant getoond.
var SIM_URL='/apps/simulator.html';
var LAUNCHERS={ contract:1, productie:1, aansluiting:1, mobiliteit:1 };   // alle vier de tegels draaien via de simulator-autopilot
var _kMsgListener=null, _kIframe=null, _kTimeout=null;
function _kOpruimen(){
  if(_kTimeout){ clearTimeout(_kTimeout); _kTimeout=null; }
  if(_kMsgListener){ try{ window.removeEventListener('message', _kMsgListener); }catch(e){} _kMsgListener=null; }
  if(_kIframe){ try{ _kIframe.parentNode.removeChild(_kIframe); }catch(e){} _kIframe=null; }
}
function _startStudieAutopilot(id){
  if(!LAUNCHERS[id]){ alert('De automatische studie voor deze tegel volgt binnenkort. “Mijn aansluiting” is al live.'); return; }
  var bc=STATE.werk.baseCase;
  if(!bc){ alert('Laad eerst een factuur op om de studie te starten.'); return; }
  var pid=STATE.werk.id;
  var payload={ tegel:id, baseCase:bc, profielNaam:STATE.werk.profiel, pvDrempel:90, projectId:pid, embed:true };
  if(id==='productie'){ payload.pvKwp=+STATE.werk.pv_kwp||0; payload.injectieMwh=+STATE.werk.pv_inj||0; payload.inverterKva=Math.round(((+STATE.werk.pv_kwp||0)/1.3)*10)/10; }
  if(id==='mobiliteit'){ payload.laadpleinen=(STATE.werk.pleinen||[]).map(_pleinNaarSim); }
  try{ localStorage.setItem('FLUCTUS_AUTOPILOT', JSON.stringify(payload)); }
  catch(e){ alert('Kon de studie niet starten: '+((e&&e.message)||e)); return; }
  _toonBerekenen(id);
  _kOpruimen();
  _kMsgListener=function(e){
    if(e.origin!==location.origin) return;
    var d=e.data; if(!d || d.__fluctus!=='kamino-result') return;
    if(d.projectId!==pid || d.tegel!==id) return;
    _kOpruimen();
    _ontvangKern(id, pid, d.kern||{}, d.reportData||null, d.reportKey||null, d.reportHtml||null);
  };
  window.addEventListener('message', _kMsgListener);
  // verborgen simulator-iframe = de rekenmachine. De klant ziet dit niet.
  _kIframe=document.createElement('iframe');
  _kIframe.title='rekenmotor';
  _kIframe.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none';
  _kIframe.src=SIM_URL;
  document.body.appendChild(_kIframe);
  _kTimeout=setTimeout(function(){ _kOpruimen(); if(STATE.werk.id===pid) _fout(id,'De berekening duurde te lang. Probeer de studie opnieuw te starten.'); }, 240000);
}
function _ontvangKern(id, pid, k, reportData, reportKey, reportHtml){
  var kern=null, diag='';
  var _pctv=function(x){ return x!=null?(String(Math.round(x*10)/10).replace('.',',')+' %'):'—'; };
  var _tvtv=function(x){ return x!=null?(String(Math.round(x*10)/10).replace('.',',')+' j'):'—'; };
  if(id==='aansluiting'){
    kern=[
      {l:'Besparing/jaar', v:'− '+eurJaar(k.besparing_jaar)},
      {l:'Rendement', v:_pctv(k.rendement_pct)},
      {l:'Terugverdientijd', v:_tvtv(k.terugverdientijd_jaar)}
    ];
    diag='Berekend door de Fluctus-simulator'+(k.pv_kwp?(' · extra PV '+k.pv_kwp+' kWp'):'')+'. De kerncijfers en het rapport komen uit dezelfde berekening.';
  }
  else if(id==='mobiliteit'){
    kern=[
      {l:'Kost per km', v:(k.kost_km!=null?('€ '+String(Math.round(k.kost_km*1000)/1000).replace('.',',')+'/km'):'—')},
      {l:'Rendement', v:_pctv(k.rendement_pct)},
      {l:'Terugverdientijd', v:_tvtv(k.terugverdientijd_jaar)}
    ];
    diag='Berekend door de Fluctus-simulator op uw laadpleinen. Kaart en rapport uit dezelfde berekening.';
  }
  else if(id==='contract'){
    kern=[
      {l:'Onderhandelingsmarge', v:'− '+eurJaar(k.marge_jaar)},
      {l:'Energiekost nu → dynamisch', v:(k.energie_nu_mwh!=null?('€'+k.energie_nu_mwh+' → €'+k.energie_dyn_mwh):'—')},
      {l:'Besparing', v:(k.besparing_pct!=null?('− '+String(k.besparing_pct).replace('.',',')+' %'):'—')}
    ];
    diag='Onderhandelingsmarge op uw factuurperiode (scherp dynamisch contract vs uw huidige). Kaart en factuurrapport uit dezelfde berekening.';
  }
  else if(id==='productie'){
    kern=[
      {l:'Extra opbrengst', v:'+ '+eurJaar(k.extra_opbrengst_jaar)},
      {l:'Netto na beheer', v:'+ '+eurJaar(k.netto_jaar)},
      {l:'Terugverdientijd', v:_tvtv(k.terugverdientijd_jaar)}
    ];
    diag='SolarActive — extra opbrengst uit uw bestaande PV via slimme injectie-sturing. Kaart en rapport uit dezelfde berekening.';
  }
  if(kern){
    (STATE.kern[pid]||(STATE.kern[pid]={}))[id]=kern;
    (STATE.diag[pid]||(STATE.diag[pid]={}))[id]=diag;
    (STATE.gedaan[pid]||(STATE.gedaan[pid]={}))[id]=true;
  }
  if(reportHtml){ STATE.rapport[pid+'|'+id]={ html:reportHtml }; }
  else if(reportData && reportKey){ STATE.rapport[pid+'|'+id]={ key:reportKey, data:reportData }; }
  if(STATE.werk.id===pid){ persistProject(); _toonResultaat(id); }
}

function _fout(id,msg){ app.innerHTML='<div class="screen"><div class="crumb" onclick="location.hash=\'#/\'">← Terug</div>'+

function startStudie(id){
  var p=byId(id);
  // Factuur-studie zonder actief project + echte factuur + ingelogd → echt oplaadt/extract, dan resultaat.
  if(p.input==='factuur' && !STATE.werk.id && _factuurFile && ingelogd()){
    _bezig('Uw factuur wordt gelezen en veilig opgeslagen…');
    extractFactuur(_factuurFile).then(function(bc){
      _maakProject(bc); resultaat(id);
    }).catch(function(e){ _fout(id,'Het inlezen/opslaan van uw factuur is mislukt: '+((e&&e.message)||e)+'. Bent u ingelogd in Mijn Fluctus?'); });
    return;
  }
  // laadplein-studie zonder project maar met factuur → zelfde; anders (bestaand project of mock) → direct.
  if(p.input==='laadpleinen' && !STATE.werk.id && _factuurFile && ingelogd()){
    _bezig('Uw factuur wordt gelezen en veilig opgeslagen…');
    extractFactuur(_factuurFile).then(function(bc){ _maakProject(bc); resultaat(id); })
      .catch(function(e){ _fout(id,'Het inlezen/opslaan van uw factuur is mislukt: '+((e&&e.message)||e)); });
    return;
  }
  if(!STATE.werk.id){ _maakProject(null); }   // mock-fallback (niet ingelogd / geen factuur)
  resultaat(id);
}
function _maakProject(bc){
  var naam=(STATE.contact.k_naam||'').trim() || (bc&&(bc.klant||bc.klantNaam)) || (STATE.werk.factuur?STATE.werk.factuur.replace(/\.[^.]+$/,''):'Nieuw project');
  var echt=!!(bc && ingelogd() && _factuurFile);
  var pid=echt?projectIdLokaal(naam):('FLX-—'+Math.floor(Math.random()*900+100));
  if(echt){ kApiPost('/api/project-id',{ project:naam }).catch(function(){}); }
  STATE.projecten.unshift({ id:pid, naam:naam, datum:vandaag(), factuur:STATE.werk.factuur||'', baseCase:bc, opgeslagen:echt });
  STATE.werk.id=pid; STATE.werk.naam=naam; STATE.werk.baseCase=bc; STATE.werk.opgeslagen=echt; _factuurFile=null;
}

function resultaat(id){
  var p=byId(id); gedaanMap()[id]=true;
  // LAUNCHER-model: tegels met een simulator-autopilot rekenen NIET zelf — ze openen de simulator (de enige
  // rekenmachine), die na de run de kerncijfers terugschrijft → kaart = rapport, één berekening.
  if(LAUNCHERS[id] && STATE.werk.baseCase && ingelogd()){ persistProject(); _startStudieAutopilot(id); return; }
  // Studie 1 (contract): echte onderhandelingsmarge draaien op de baseCase — zelfde sim als de simulator.
  if(id==='contract' && STATE.werk.baseCase && ingelogd() && !kernOf(STATE.werk.id,id)){
    _bezig('Uw onderhandelingsmarge wordt berekend op de spotmarkt (profiel × spot)…');
    kApiPost('/api/kamino/onderhandel',{ baseCase:STATE.werk.baseCase, profielNaam:STATE.werk.profiel }).then(function(r){
      var kern=[
        {l:'Onderhandelingsmarge', v:'− '+eurJaar(r.marge_jaar)},
        {l:'Energiekost nu → dynamisch', v:(r.energiekost_nu_mwh!=null?('€'+r.energiekost_nu_mwh+' → €'+r.energiekost_dyn_mwh):'—')},
        {l:'Besparing op totaal', v:'− '+r.besparing_pct+' %'}
      ];
      bewaarKern(id,kern);
      var d=r._debug||{}, di=d.in||{}, pr=d.pricing||{};
      var dbg='<br><span style="font-family:monospace;font-size:10px;color:#8A93A3">debug · vergroening '+(di.vergroening)+' €/MWh · effectief jaarverbr. '+(d.effectief_jaarverbruik_mwh!=null?Math.round(d.effectief_jaarverbruik_mwh):'?')+' MWh · schijf '+(pr.schijf_label||pr.schijf_code||r.schijf||'?')+' · markup '+(pr.markup_dam!=null?pr.markup_dam:(r.markup!=null?r.markup:'?'))+' €/MWh · energiepost dyn € '+((d.A_energiekost&&d.A_energiekost._subtotaal!=null)?Math.round(d.A_energiekost._subtotaal):'?')+'</span>';
      bewaarDiag(id,'Berekend op verbruiksprofiel <b>'+(STATE.werk.profiel||'?')+'</b>'+(r.geprojecteerd_mwh!=null?(' · geprojecteerd '+r.geprojecteerd_mwh+' MWh/jaar'):'')+'. Kies in de simulator hetzelfde profiel voor een identiek cijfer.'+dbg);
      persistProject(); _toonResultaat(id);
    }).catch(function(e){ persistProject(); _toonResultaat(id, 'De echte marge-berekening lukte niet ('+((e&&e.message)||e)+'). Hieronder voorbeeldcijfers.'); });
    return;
  }
  // Studie 2 (productie): echte injectie-opbrengst draaien — ZELFDE server-functie als de simulator (_analyseerInjectieOptimalisatie).
  if(id==='productie' && STATE.werk.baseCase && ingelogd() && (+STATE.werk.pv_kwp>0) && !kernOf(STATE.werk.id,id)){
    _bezig('Uw extra injectie-opbrengst wordt berekend op spot + onbalans…');
    kApiPost('/api/kamino/productie',{ baseCase:STATE.werk.baseCase, profielNaam:STATE.werk.profiel, pv_kwp:STATE.werk.pv_kwp, injectie_mwh_jaar:STATE.werk.pv_inj }).then(function(r){
      var tvt=(r.terugverdientijd_jaar!=null)?(String(r.terugverdientijd_jaar).replace('.',',')+' j'):'—';
      var kern=[
        {l:'Extra opbrengst', v:'+ '+eurJaar(r.extra_opbrengst_jaar)},
        {l:'Netto na sturing', v:'+ '+eurJaar(r.netto_jaar)},
        {l:'Terugverdientijd', v:tvt}
      ];
      bewaarKern(id,kern);
      bewaarDiag(id,'Berekend op bestaande PV <b>'+r.pv_kwp+' kWp</b> · injectie '+(STATE.werk.pv_inj||'?')+' MWh/j · profiel <b>'+(STATE.werk.profiel||'?')+'</b> (standaard: inverter '+r.inverter_kva+' kVA, piek '+r.piek_kw+' kW). Zelfde cijfer in de simulator met dezelfde PV-invoer.');
      persistProject(); _toonResultaat(id);
    }).catch(function(e){ persistProject(); _toonResultaat(id, 'De echte injectie-berekening lukte niet ('+((e&&e.message)||e)+'). Hieronder voorbeeldcijfers.'); });
    return;
  }
  // (Studie 3 aansluiting is nu een LAUNCHER — zie de LAUNCHERS-check bovenaan resultaat().)
  persistProject();   // projectrecord bewaren → later heropenbaar via de toegangspoort (ID + e-mail)
  _toonResultaat(id);
}
function _toonResultaat(id, waarschuwing){
  var p=byId(id);
  var actief=projById(STATE.werk.id)||{}, echt=!!actief.opgeslagen;
  var kernData=kernOf(STATE.werk.id,id)||p.kern, echteKern=!!kernOf(STATE.werk.id,id);
  var kern='<div class="kernbig">'+kernData.map(function(k){return '<div class="k"><div class="kl">'+k.l+'</div><div class="kv" style="color:'+(p.gratis?'#048443':'#9E480E')+'">'+k.v+'</div></div>';}).join('')+'</div>';
  var diag=diagOf(STATE.werk.id,id);
  var diagHtml=diag?'<div class="hint" style="margin:2px 0 6px">'+diag+'</div>':'';
  var tweestaps=p.tweestaps?'<div class="tweestaps"><b>Volgende stap:</b> dit rapport draait op een standaardprofiel. We plannen een videovergadering + kabelplanner om te bekijken of uw specifiek profiel meerwaarde geeft (met uw mandaat).</div>':'';
  app.innerHTML='<div class="screen"><div class="crumb" onclick="location.hash=\'#/\'">← Terug naar het overzicht</div>'+
    '<div class="card"><div class="qh"><div class="ic">✅</div><div><h2>'+p.studie+' — uw kerncijfers</h2>'+
      '<div class="qsub" style="color:#5A6577">Project '+STATE.werk.id+(STATE.werk.naam?' · '+STATE.werk.naam:'')+'</div></div></div>'+
    kern+diagHtml+
    '<div class="bevestig">'+(waarschuwing?('⚠️ '+waarschuwing+'<br><br>'):'')+(echteKern
      ? '✅ Deze kerncijfers zijn <b>écht berekend op uw factuur</b> (zelfde simulatie als de Fluctus-simulator). Uw factuur is veilig opgeslagen; u en uw adviseur ontvangen het volledige rapport per mail.'
      : (echt
        ? '✅ Uw factuur is opgeslagen in Supabase. Voor deze studie zijn dit nog voorbeeldcijfers — de echte run wordt hier aangehaakt (studie 1 is al echt).'
        : '⚠️ Voorlopig projectnummer — <b>nog niet opgeslagen</b>. Log in via Mijn Fluctus én laad een factuur op om echt te bewaren.'))+'</div>'+
    (p.gratis?'':belofteBlok())+
    tweestaps+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'+
      '<button class="btn green" onclick="_bekijkRapport(\''+id+'\')">📄 Bekijk uw volledige rapport</button>'+
      '<button class="btn ghost" onclick="location.hash=\'#/\'">← Naar het overzicht</button></div>'+
    '</div></div>';
}

// ---------- TOEGANGSPOORT: bestaand project openen met ID + e-mail ----------
function renderOpen(){
  app.innerHTML='<div class="screen"><div class="crumb" onclick="location.hash=\'#/\'">← Terug naar het overzicht</div>'+
    '<div class="card"><div class="qh"><div class="ic">🔑</div><div><h2>Open een bestaand project</h2>'+
      '<div class="qsub" style="color:#2d4f8e">Toegangspoort · project-ID + e-mail</div></div></div>'+
    '<div class="qintro">Vul uw projectnummer (FLX-…) en het e-mailadres van de klant óf de adviseur in. Zo werken u en uw adviseur samen verder op hetzelfde project — na een eerste studie meteen een volgende, zonder heen-en-weer via mail.</div>'+
    '<div class="sec"><div class="row">'+
      '<div class="fld"><label>Projectnummer</label><input id="op-id" placeholder="FLX-XXX-XXX" value="'+(STATE.werk.id||'')+'"></div>'+
      '<div class="fld"><label>E-mail (klant of adviseur)</label><input id="op-mail" placeholder="naam@bedrijf.be" value="'+ci('k_mail')+'"></div>'+
    '</div><div id="op-msg" class="hint"></div></div>'+
    '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn green" onclick="openBestaand()">Open project</button>'+
    '<button class="btn ghost" onclick="location.hash=\'#/\'">Annuleren</button></div></div></div>';
}
function openBestaand(){
  var id=(document.getElementById('op-id').value||'').trim().toUpperCase();
  var email=(document.getElementById('op-mail').value||'').trim();
  var msg=document.getElementById('op-msg');
  if(!/^FLX-/.test(id)||!/\S+@\S+\.\S+/.test(email)){ msg.style.color='#B23'; msg.textContent='Vul een geldig projectnummer (FLX-…) en e-mailadres in.'; return; }
  msg.style.color='#5A6577'; msg.textContent='Bezig met openen…';
  kApiPost('/api/kamino/project-open',{ id:id, email:email }).then(function(r){
    laadProject(r.project); location.hash='#/'; renderOverzicht();
  }).catch(function(e){ msg.style.color='#B23'; msg.textContent='Kon niet openen: '+((e&&e.message)||e); });
}
function laadProject(rec){
  var k=rec.klant||{}, a=rec.adviseur||{};
  STATE.contact={ k_naam:k.naam||'', k_mail:k.email||'', k_tel:k.tel||'', a_naam:a.naam||'', a_mail:a.email||'', a_tel:a.tel||'' };
  var pv=rec.pv||{};
  if(!projById(rec.id)) STATE.projecten.unshift({ id:rec.id, naam:rec.naam||k.naam||'', datum:'', factuur:rec.factuur||'', baseCase:rec.baseCase||null, opgeslagen:true });
  STATE.werk={ id:rec.id, naam:rec.naam||k.naam||'', factuur:rec.factuur||'', profiel:PROFIELEN[0], pv_kwp:pv.kwp||'', pv_inj:pv.inj||'', pleinen:[], baseCase:rec.baseCase||null, opgeslagen:true };
  STATE.gedaan[rec.id]=Object.assign({}, rec.studies||{});
}
// Projectrecord bewaren zodat het later via de toegangspoort heropend kan worden (enkel echte projecten).
function persistProject(){
  var act=projById(STATE.werk.id)||{};
  if(!STATE.werk.id || !ingelogd() || !act.opgeslagen) return;
  kApiPost('/api/kamino/project',{
    id:STATE.werk.id, naam:STATE.werk.naam,
    klant:{ naam:STATE.contact.k_naam, email:STATE.contact.k_mail, tel:STATE.contact.k_tel },
    adviseur:{ naam:STATE.contact.a_naam, email:STATE.contact.a_mail, tel:STATE.contact.a_tel },
    factuur:STATE.werk.factuur||'', baseCase:STATE.werk.baseCase||null,
    pv:{ kwp:STATE.werk.pv_kwp||'', inj:STATE.werk.pv_inj||'' }, studies:gedaanMap()
  }).catch(function(){});
}

// ---------- router ----------
function router(){ var h=location.hash||'#/', m=h.match(/#\/punt\/([a-z]+)/i);
  if(/#\/open/.test(h)){ renderOpen(); window.scrollTo(0,0); }
  else if(m){ renderPunt(m[1]); window.scrollTo(0,0); }
  else { renderOverzicht(); } }
// Echte verbruiksprofielen uit de simulator laden (zodat de naam matcht met wat de sim verwacht).
kApiGet('/api/profielen-lijst').then(function(r){
  var lijst=(r&&r.profielen)||[];
  var namen=lijst.map(function(x){ return (typeof x==='string')?x:(x&&(x.naam||x.name)||''); }).filter(Boolean);
  if(namen.length){ PROFIELEN=namen; if(PROFIELEN.indexOf(STATE.werk.profiel)<0) STATE.werk.profiel=PROFIELEN[0]; router(); }
}).catch(function(){});
window.addEventListener('hashchange',router); router();
</script>
