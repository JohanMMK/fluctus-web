     KAMINO — single-page front v0.9.19 (Mijn Fluctus-app · testmodus)
     v0.9.19 (STOPGAP TRAGE ZWARE CASE, 06-08): absolute veiligheidscap 25 → 45 min (K_ABS_CAP_MS). Na de PV-sweep-fix
              (simulator v1.63.57) startte de sweep wél, maar een zware verzwaring/mix-case op tegel 4 (volledige
              zoektocht opstelling 2 + mix 1/2 batt + opstelling 3, elk × 3 sturingen) duurt server-side >25 min en werd
              afgekapt. Dit is een tijdelijke verruiming zodat zulke cases afronden; de echte fix = /api/nominatie-sim-3
              server-side sneller (parallelle sturingen / mix-zoektocht snoeien / cache) — apart, met de proxy-code.
     v0.9.21 (TERMINOLOGIE, 09-08): 'verkoper' → 'adviseur' in de teksten. // v0.9.20 (NO-FACTUUR-FLOW, 09-08, Johan): instappunt zonder factuur — 'Geen factuur? Manueel invullen' (klant/EAN/
           postcode/DNB/spanning/kVA/jaarverbruik/referentieprijs) bouwt een baseCase zonder factuurposten; de server
           (/api/kamino/onderhandel v15.70) rekent de marge op referentieprijs × verbruik. Bestaande factuur-flow ongewijzigd.
     v0.9.17 (Johan): KABELTRACÉ-KOPPELING tegel 3/4 — knop "Kabeltracé intekenen" op het resultaatscherm seedt de
           kabelplanner (adres + laadpunten + batterij + voorgestelde PV) uit de optimale opstelling; bij terugkeer
           herrekent de autopilot de optimale opstelling + groeistap 1 (PV/onbalans blijven optie) met de EXACTE
           kabelprijs + getekende PV; de luchtfoto komt in de reeds voorziene rapport-bijlage (T3/T4). Zelfde
           localStorage-contract (fluctus_kbl_seed / fluctus_kbl_result) als de interactieve simulator — planner ongewijzigd.
     v0.9.16 (Johan): (1) rode "JACOPS-versie"-knop op het resultaatscherm + de "vorig rapport"-plekken.
           (2) laadplein-invoer (tegel 4) toont per plein LIVE: minimaal nodige kVA om de vloot in het venster
           geladen te krijgen (vloot-energie/laadbeurt ÷ venster-uren) + totaal geselecteerd laadvermogen
           (AC22×22 + DC160×160 + DC300×300), met ✓/te-laag-indicatie.
     v0.9.15 (LAADPALEN VERPLICHT, Johan 03-08): de mobiliteit-tegel vraagt nu VERPLICHT de laadpalen per plein
           (AC22 / DC160 / DC300 aantallen). Validatie blokkeert de studie als een plein geen paal heeft. _pleinNaarSim
           geeft de echte aantallen door → de simulator rekent op de échte laadpiek (nodige aansluiting/batterij/capex).
           De ideaal-gespreide best-case-terugval vervalt zo voor Kamino.
     v0.9.14 (LAADPALEN-INVOER): eerste versie — optioneel met auto-terugval (vervangen door v0.9.15 verplicht).
     v0.9.13 (PROFIEL PERSISTEREN, Johan 03-08): persistProject bewaart nu STATE.werk.profiel in het projectrecord en
           laadProject herstelt het bij heropenen. Zonder dit veld ging het gekozen verbruiksprofiel verloren bij het
           heropenen (kamino) én bij de manager-open in de interactieve simulator (die viel dan terug op een default-
           profiel → verkeerde dispatch). Server v15.57 whitelist het 'profiel'-veld.
     v0.9.12 (GROEIPAD BATTERIJ-ONLY, Johan 01-08): tegel 3 (aansluiting) toont de 1-batterij-INSTAP (batterij-only)
           als headline + verkoop-signaal, met de extra PV als OPTIE op die eerste groeistap (eigen B + gecombineerd C).
           Tegel 4 (mobiliteit) houdt de volgroeide batterij-case (A) + optimale PV-optie. _ontvangKern leest
           kern.batterij_eerst + kern.pv_optie (simulator v1.63.38).
     v0.9.11 (BATTERIJ-EERST, Johan 01-08): tegel 3 (aansluiting) + 4 (mobiliteit) tonen nu de batterij als hoofd-case
           (eigen rendement A + verkoop-signaal), en de extra PV als OPTIE eróp: PV-eigen rendement (B) + batterij+PV
           gecombineerd (C). _ontvangKern leest kern.batterij_eerst + kern.pv_optie (simulator v1.63.37).
     v0.9.10 (01-08): RAPPORTEN HEROPVRAGEN per tegel. Bij een heropend project (of een tegel die al gerekend is) toont
           Kamino nu een "📄 Bekijk vorig rapport"-knop (overzicht-tegel + tegel-scherm). Het bewaarde rapport komt uit
           de bucket via /api/kamino/rapport-open; de beschikbaarheid uit /api/kamino/project-open (rapporten.studies,
           server v15.53). De bestaande "Bekijk uw volledige rapport"-knop valt nu ook terug op de bucket i.p.v. enkel
           de in-sessie data. Voorheen kon je enkel herrekenen.
     v0.9.9 (01-08): PV-zelfverbruik-drempel-regelaar VERPLAATST van tegel 2 (productie) naar tegel 3 (aansluiting) +
           tegel 4 (mobiliteit) — daar wordt de extra PV gedimensioneerd. Tegel 2 = enkel sturing bestaande PV, geen extra PV.
     v0.9.8 (01-08): (1) zelfverbruik-drempel voor de extra-PV-dimensionering als parameter (STATE.werk.pvDrempel),
           default 80% (was 90), met een regelaar op het PRODUCTIE-tegel (project-breed → geldt in aansluiting & mobiliteit;
           veldPvDrempel). Sluit aan bij de marginale-zelfconsumptie-keuze in de simulator (v1.63.33 / server v15.52).
           (2) 4c: tegel-3-kaart toont nu de 1-batterij-instap (BatteryActive) als headline + verkoop-signaal
           (✅ ROI > 10 % verkoopbaar / ⚠️ < 10 % studiegarantie).
     v0.9.7 (01-08): LIVENESS-KILL WEG. De hartslag dient nu ENKEL voor de live-statusregel, niet meer als kill-timer.
           Reden: een zware synchrone verwerking in de iframe-thread kan de hartslag-ticker even bevriezen, waardoor de
           oude liveness-watchdog een WERKENDE studie onterecht afkapte ("reageert niet meer"). Er blijft enkel één
           ruime absolute veiligheidscap (25 min) die hartslagen BEWUST niet resetten → een lange-maar-werkende studie
           wordt nooit meer afgekapt; enkel een echte oneindige lus loopt in de cap. De simulator toont via de hartslag
           nu ook de échte sim-substap (opstelling/run uit simLog), dus je ziet of stap 1 vooruitgaat of echt hangt.
     v0.9.6 (01-08): ruimere watchdog-vensters (liveness 5 min, fallback 20 min) + console-diagnose "hartslag ontvangen".
     v0.9.5 (31-07): ROBUUSTE watchdog. Als er nooit een hartslag binnenkomt (bv. een gecachte simulator zonder heartbeat)
           valt de watchdog terug op een ruime totale cap (15 min) i.p.v. de studie na 2 min te killen. Mét hartslag: liveness
           (3 min zonder hartslag = vastloper). Zo breekt een cache-mismatch tussen kamino en simulator niets meer.
     v0.9.4 (twee-bakjes, 31-07): dieselbasis per voertuigtype in VT_DEF (diesel_km) + _pleinNaarSim stuurt diesel_eur_km
           mee → de simulator verdient de laadpalen terug via het prijsverschil diesel↔elektrisch per km.
     v0.9.3 (31-07): LEESBAARHEID — een tegel die nog NIET berekend is toont geen voorbeeldcijfers meer (die leken op
           echte resultaten). De studie-labels blijven staan, de waarden worden een neutrale "—" tot de studie écht
           gedraaid is (klasse .berekend / .kv-leeg). Zo zie je in één oogopslag welke studies al gebeurd zijn.
     v0.9.2 (31-07): LIVE STATUS + LIVENESS-WATCHDOG i.p.v. harde tijdscap. De autopilot (simulator) stuurt nu elke
           ~8s een hartslag (kamino-progress) met de huidige stap → de loadingscreen toont live voortgang, en de
           launcher reset een liveness-watchdog bij elke hartslag. De harde 10-min-cap (die zware tegel-3/4-studies
           onterecht afkapte) is weg: een studie mag zo lang duren als nodig ZOLANG de rekenmachine leeft; enkel als
           er 120s lang geen hartslag meer binnenkomt (iframe gecrasht / JS-thread geblokkeerd = echte vastloper)
           grijpt hij in. Server-side hangs meldt de simulator zelf via zijn per-stap-timeouts. Vereist simulator
           v1.63.21+ (die de hartslagen stuurt).
     v0.9: STUDIE 1 ECHT — de onderhandelingsmarge wordt live berekend via /api/kamino/onderhandel
           (dezelfde buildSimInput → simulator.py als de simulator, dus drift-vrij). Kerncijfers op de kaart
           en het resultaat komen uit de echte run; verbruiksprofielen geladen uit /api/profielen-lijst.
           Studies 2–4 volgen hetzelfde patroon (nog placeholder).
     v0.8: TOEGANGSPOORT — bestaand project openen met project-ID + e-mail (klant of adviseur). Zo werken
           klant en adviseur samen verder op hetzelfde project (volgende studie), zonder mailverkeer.
           Projectrecord (incl. e-mails, factuurref, baseCase, gedane studies) wordt bewaard via
           /api/kamino/project; heropenen via /api/kamino/project-open (e-mail moet matchen).
     NIEUW MODEL (27-07): 4 AANDACHTSPUNTEN × 1 studie × 3 kerncijfers. Geen teasers/inzichten meer.
       1 Mijn contract  → Dynamisch contract (gratis)
       2 Mijn productie → SolarActive (gratis)
       3 Mijn aansluiting → BatteryActive (€2.950 + cash back)
       4 Mijn mobiliteit → E+Drive / Jacopsroute (€3.950 + cash back)
     Input 1–3: factuur + verbruiksprofiel + bestaande PV (kWp, injectie MWh) — één keer, voedt 3 studies.
     Input 4: laadpleinen (per plein: autotype, tijd/dag, 5/6/7 dagen, laadpalen), meerdere pleinen.
     Flow 3&4: eerste rapport op standaardprofiel → videovergadering + kabelplanner (+ mandaat specifiek profiel).
     Behoudt slice 1a: echte factuur-upload → /api/factuur-extract (Supabase) + echt project-ID.
     De echte kerncijfers (marge/rendement/€per km) = de run, per studie, geverifieerd — volgt (nu placeholder).

function kToken(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
  if(/^sb-.+-auth-token$/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null');
    return (v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)))||null; } } }catch(e){} return null; }
function ingelogd(){ return !!kToken(); }
function kApiPost(path, body){ var tok=kToken(), h={'Content-Type':'application/json'}; if(tok) h['Authorization']='Bearer '+tok;
  return fetch(API_BASE+path,{method:'POST',headers:h,body:JSON.stringify(body)}).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); }); }
function kApiGet(path){ var tok=kToken(), h={}; if(tok) h['Authorization']='Bearer '+tok;
  return fetch(API_BASE+path,{headers:h}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }

function fileNaarB64(file){ return new Promise(function(res,rej){ var fr=new FileReader();
  fr.onload=function(){ try{ res(String(fr.result).split(',')[1]); }catch(e){ rej(e); } };
  fr.onerror=function(){ rej(new Error('bestand lezen mislukt')); }; fr.readAsDataURL(file); }); }
function projectIdLokaal(project){ var s=String(project||'').trim().toLowerCase(),h=0x811c9dc5>>>0;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  var c=h.toString(36).toUpperCase(); while(c.length<7)c='0'+c; c=c.slice(-7); return 'FLX-'+c.slice(0,3)+'-'+c.slice(3); }

// v0.9.16 (Johan): live-indicatie per plein — (1) minimaal nodige kVA om de vloot geladen te krijgen in het venster,
// (2) totaal geselecteerd laadvermogen. Minimum = vloot-energie per laadbeurt, gespreid over de venster-uren.
function _pleinKvaCalc(i){
  var pl=(STATE.werk.pleinen||[])[i]||{};
  var def=VT_DEF[pl.autotype]||VT_DEF[AUTOTYPES[0]];
  var aantal=+pl.voertuigen||0;
  var vs=(pl.start!=null&&pl.start!=='')?+pl.start:8, ve=(pl.eind!=null&&pl.eind!=='')?+pl.eind:18;
  var win=(((ve-vs)%24)+24)%24; if(win<=0) win=24;      // overnacht-venster (bv. 18→6 = 12 u)
  var dagen=+pl.dagen||5;
  var dagKm=def.km_per_jaar/(dagen*52);                  // km per laadbeurt per wagen
  var energie=aantal*dagKm*def.kwh_per_km;               // kWh per laadbeurt (hele vloot)
  var minKw=win>0?energie/win:0;                         // minimaal aggregaat-vermogen, ideaal gespreid
  var lp=pl.laadpunten||{};
  var selKva=(+lp.ac22||0)*22+(+lp.dc160||0)*160+(+lp.dc300||0)*300;
  return { minKw:minKw, selKva:selKva, energie:energie, win:win };
}
function _pleinKvaHtml(i){
  var c=_pleinKvaCalc(i), min=Math.ceil(c.minKw);

  var kleur=(c.selKva<=0)?'#8A93A3':(ok?'#048443':'#C0392B');
  var vink=(c.selKva<=0)?'':(ok?' ✓ volstaat':' ⚠️ te laag voor het venster');
  return '<div style="font-size:12px;margin-top:8px;padding:8px 11px;background:#F5F7FA;border:1px solid #E3E8EF;border-radius:6px;line-height:1.55">'+
    '⚡ <b>Minimaal nodig:</b> ± '+min+' kVA'+(min>0?' <span style="color:#8A93A3">(± '+Math.round(c.energie)+' kWh gespreid over een venster van '+c.win+' u)</span>':' <span style="color:#8A93A3">— vul aantal voertuigen in</span>')+'<br>'+
    '🔌 <b>Geselecteerd vermogen:</b> <span style="color:'+kleur+';font-weight:700">'+Math.round(c.selKva)+' kVA'+vink+'</span></div>';

// ---------- START: echte factuur-opslag (slice 1a) → resultaat ----------
function _bezig(msg){ app.innerHTML='<div class="screen"><div class="card" style="text-align:center;padding:40px 24px">'+
  '<div style="font-size:34px">⏳</div><div style="font-size:16px;color:#1F3864;font-weight:700;margin-top:10px">'+msg+'</div>'+
  '<div class="hint" style="margin-top:8px">Een factuur inlezen duurt ± 30–45 seconden. Sluit dit scherm niet.</div></div></div>'; }
// async job-poller (studie 3/4): pollt /api/sim-voortgang tot 'klaar' of 'fout'; toont de laatste logregel.
function _pollKamino(jobId, onKlaar, onFout){
  var pogingen=0, max=260; // ~6,5 min @ 1,5s
  (function tick(){
    pogingen++;
    kApiGet('/api/sim-voortgang/'+encodeURIComponent(jobId)).then(function(j){
      if(j&&j.status==='klaar'){ onKlaar(j.resultaat||{}); return; }
      if(j&&j.status==='fout'){ onFout(j.fout||'onbekende fout'); return; }
      if(pogingen>=max){ onFout('time-out — probeer opnieuw'); return; }
      var laatste=(j&&j.log&&j.log.length)?j.log[j.log.length-1]:null;
      if(laatste&&laatste.tekst) _bezig(laatste.tekst);
      setTimeout(tick,1500);
    }).catch(function(e){ if(pogingen>=max){ onFout((e&&e.message)||e); } else setTimeout(tick,1500); });
  })();
}
// v0.9.4 — LAUNCHER-model, KLANTVRIENDELIJK. De klant ziet ALLEEN Kamino. De simulator draait als
// ONZICHTBARE rekenmachine in een verborgen iframe; na de run stuurt hij (postMessage) de kerncijfers +
// rapportdata terug. Kamino blijft op zijn eigen scherm en toont daar de kerncijfers + een knop "Bekijk
// rapport", die het simulator-rapport IN Kamino opent. De simulator wordt nooit aan de klant getoond.
var SIM_URL='/apps/simulator.html';
var LAUNCHERS={ contract:1, productie:1, aansluiting:1, mobiliteit:1 };   // alle vier de tegels draaien via de simulator-autopilot
var _kMsgListener=null, _kIframe=null, _kTimeout=null, _kWatchdog=null, _kFallback=null, _kSeenHb=false;
// v0.9.7: GEEN liveness-kill meer. De simulator stuurt elke ~8s een hartslag (kamino-progress) met zijn huidige
//  substap; die gebruiken we UITSLUITEND om de live-statusregel te verversen — NIET meer om een kill-timer te
//  resetten. Reden: zware synchrone verwerking in de iframe-thread kan de hartslag-ticker even bevriezen, waarna
//  een liveness-watchdog een WÉRKENDE studie onterecht afkapte. Er blijft enkel één ruime absolute cap (K_ABS_CAP_MS)
//  die BEWUST niet door hartslagen wordt gereset: een lange-maar-werkende studie mag zo lang duren als nodig, enkel
//  een echte oneindige lus loopt in de cap. Server-side hangs meldt de simulator zelf via zijn per-stap-timeouts.
var K_ABS_CAP_MS=2700000;    // v0.9.19: 45 min absolute veiligheidscap (was 25) — zware verzwaring/mix-cases (tegel 4) haalden de 25 min niet; hartslagen resetten dit BEWUST niet
function _kStartTimers(id,pid){
  _kSeenHb=false;
  if(_kFallback) clearTimeout(_kFallback);
  _kFallback=setTimeout(function(){ _kOpruimen(); if(STATE.werk.id===pid) _fout(id,'De berekening duurde uitzonderlijk lang (>45 min) en is gestopt. Probeer de studie opnieuw te starten.'); }, K_ABS_CAP_MS);
}
function _kHeartbeat(id,pid){ /* v0.9.7: no-op — de hartslag dient enkel voor de live-status (zie message-handler), niet meer als kill-timer */ }
function _kOpruimen(){
  if(_kTimeout){ clearTimeout(_kTimeout); _kTimeout=null; }
  if(_kWatchdog){ clearTimeout(_kWatchdog); _kWatchdog=null; }
  if(_kFallback){ clearTimeout(_kFallback); _kFallback=null; }
  if(_kMsgListener){ try{ window.removeEventListener('message', _kMsgListener); }catch(e){} _kMsgListener=null; }
  if(_kIframe){ try{ _kIframe.parentNode.removeChild(_kIframe); }catch(e){} _kIframe=null; }
}
function _startStudieAutopilot(id, extra){
  if(!LAUNCHERS[id]){ alert('De automatische studie voor deze tegel volgt binnenkort. “Mijn aansluiting” is al live.'); return; }
  var bc=STATE.werk.baseCase;
  if(!bc){ alert('Laad eerst een factuur op om de studie te starten.'); return; }
  var pid=STATE.werk.id;
  var payload={ tegel:id, baseCase:bc, profielNaam:STATE.werk.profiel, pvDrempel:(STATE.werk.pvDrempel||80), projectId:pid, embed:true };   // v0.9.8: zelfverbruik-drempel als parameter (default 80%, was 90) — marginale zelfconsumptie nieuwe PV
  // De bestaande PV (kWp + injectie) is een PROJECT-eigenschap → in ELKE tegel meesturen. Zo rekent ook het
  // ontwerp (tegel 3/4) de extra PV BOVENOP de bestaande installatie, i.p.v. te doen alsof er geen PV is.
  var _bk=+STATE.werk.pv_kwp||0, _bi=+STATE.werk.pv_inj||0;
  if(_bk>0 || _bi>0){ payload.bestaandeKwp=_bk; payload.bestaandeInj=_bi; payload.bestaandeKva=Math.round((_bk/1.3)*10)/10; }
  if(id==='mobiliteit'){
    // v0.9.15 (Johan 03-08): laadpalen VERPLICHT. De simulator rekent op de échte laadpiek — geen ideaal-gespreide
    // best-case meer. Elk laadplein moet minstens één laadpaal (AC22/DC160/DC300) hebben.
    var _pl=(STATE.werk.pleinen||[]);
    if(!_pl.length){ alert('Voeg minstens één laadplein toe.'); return; }
    var _mist=_pl.filter(function(pl){ var l=pl.laadpunten||{}; return ((+l.ac22||0)+(+l.dc160||0)+(+l.dc300||0))<=0; });
    if(_mist.length){ alert('Geef de laadpalen op voor elk laadplein (AC 22 / DC 160 / DC 300 kW). Zonder palen kan de laadpiek niet realistisch berekend worden.'); return; }
    payload.laadpleinen=_pl.map(_pleinNaarSim);
  }
  // v0.9.17 (Johan): kabeltracé-koppeling — exacte kabelprijs + getekende PV + luchtfoto meesturen naar de autopilot,
  // die dan de optimale opstelling + groeistap 1 herrekent (PV/onbalans blijven optie) met de EXACTE cijfers.
  if(extra){
    if(extra.kabeltraceOverride!=null) payload.kabeltraceOverride=+extra.kabeltraceOverride;
    if(extra.pvOverrideKwp!=null)      payload.pvOverrideKwp=+extra.pvOverrideKwp;
    if(extra.kabelFoto)                payload.kabelFoto=extra.kabelFoto;
  }
  try{ localStorage.setItem('FLUCTUS_AUTOPILOT', JSON.stringify(payload)); }
  catch(e){ alert('Kon de studie niet starten: '+((e&&e.message)||e)); return; }
  _toonBerekenen(id);
  _kOpruimen();
  _kMsgListener=function(e){
    if(e.origin!==location.origin) return;
    var d=e.data; if(!d) return;
    // v0.9.7: hartslag/voortgang → ENKEL de live status verversen (geen kill-timer meer resetten).
    if(d.__fluctus==='kamino-progress'){
      if(d.projectId && d.projectId!==pid) return;
      try{ console.log('[fluctus] hartslag ontvangen:', d.status||''); }catch(_e){}   // v0.9.6: diagnose — zie je dit in de console, dan komt de hartslag door
      if(d.status) _kZetStatus(d.status);
      _kHeartbeat(id,pid);   // v0.9.7: no-op
      return;
    }
    if(d.__fluctus!=='kamino-result') return;
    if(d.projectId!==pid || d.tegel!==id) return;
    _kOpruimen();
    if(d.error){ _fout(id, 'De studie liep vast: '+d.error); return; }   // fout uit de simulator → meteen tonen
    _ontvangKern(id, pid, d.kern||{}, d.reportData||null, d.reportKey||null, d.reportHtml||null);
  };
  window.addEventListener('message', _kMsgListener);
  // verborgen simulator-iframe = de rekenmachine. De klant ziet dit niet.
  _kIframe=document.createElement('iframe');
  _kIframe.title='rekenmotor';
  _kIframe.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none';
  _kIframe.src=SIM_URL;
  document.body.appendChild(_kIframe);
  // v0.9.7: enkel een ruime absolute veiligheidscap (25 min) die hartslagen NIET resetten. Zolang de simulator
  // hartslagen stuurt zie je de live substap; een lange-maar-werkende studie wordt nooit onterecht afgekapt.
  _kStartTimers(id, pid);
}
// ─── KABELTRACÉ-KOPPELING (tegel 3/4) — identiek aan de interactieve simulator ↔ kabelplanner ───
// Heen: seed de kabelplanner (adres + laadpunten + batterij + voorgestelde PV) uit de optimale opstelling van dit
// tegel-rapport. Terug: de exacte kabelprijs + getekende PV + luchtfoto → herreken de tegel via de autopilot (de foto
// komt in de reeds voorziene bijlage van rapport T3/T4). De kabelplanner zelf blijft ongewijzigd (zelfde localStorage-contract).
var KBL_SEED_KEY='fluctus_kbl_seed', KBL_RESULT_KEY='fluctus_kbl_result', KABELPLANNER_URL='kabelplanner.html';
var _kblSeedTs={}, _kblResultTs={}, _kblLaatste={}, _kblActief=null;
var KBL_STATE_KEY='FLX_KAMINO_KBL_STATE';
// v0.9.18 (Johan 04-08): de Kamino-state is in-memory; als de kabelplanner in dezelfde tab opent of je keert terug
// via "terug", herlaadt Kamino en verdween het actieve project + de kerncijfers. We bewaren de sessie-state (zónder de
// zware rapport-JSON — die wordt bij de herrekening opnieuw gemaakt) vóór het openen, en herstellen ze bij het laden.
function _kblPersistKamino(){
  try{ sessionStorage.setItem(KBL_STATE_KEY, JSON.stringify({
    contact:STATE.contact, werk:STATE.werk, projecten:STATE.projecten, gedaan:STATE.gedaan,
    kern:STATE.kern, diag:STATE.diag, rapportOp:STATE.rapportOp,
    active:_kblActief, seedTs:_kblSeedTs, resTs:_kblResultTs })); }catch(e){}
}
function _kblRestoreKamino(){
  try{ var raw=sessionStorage.getItem(KBL_STATE_KEY); if(!raw) return false;
    var s=JSON.parse(raw); if(!s||!s.werk||!s.werk.id) return false;
    STATE.contact=s.contact||STATE.contact; STATE.werk=s.werk; STATE.projecten=s.projecten||[];
    STATE.gedaan=s.gedaan||{}; STATE.kern=s.kern||{}; STATE.diag=s.diag||{}; STATE.rapportOp=s.rapportOp||{};
    if(s.active) _kblActief=s.active; if(s.seedTs) _kblSeedTs=s.seedTs; if(s.resTs) _kblResultTs=s.resTs;
    return true;
  }catch(e){ return false; }
}
function _kblSeedTegel(id){
  var pid=STATE.werk.id, r=STATE.rapport[pid+'|'+id], rd=r&&r.data;
  if(!rd){ alert('Reken de studie eerst door voor u het kabeltracé intekent.'); return; }
  var bc=STATE.werk.baseCase||{};
  var adres=bc.leveringsadres||bc.klantAdres||(((bc.postcode||'')+' '+(bc.gemeente||'')).trim());
  var O=rd.optimaal||{}, lp=O.laadpalen||{};
  var laadpunten=[];
  if(+lp.ac>0)    laadpunten.push({type:'AC22', aantal:+lp.ac});
  if(+lp.dc160>0) laadpunten.push({type:'DC160',aantal:+lp.dc160});
  if(+lp.dc300>0) laadpunten.push({type:'DC300',aantal:+lp.dc300});
  var battKwh=+O.batterij_kwh||0, battAantal=battKwh>0?Math.max(1,Math.round(battKwh/260)):0;
  var pvKwp=(rd.extra_pv&&+rd.extra_pv.kwp)||(+O.pv_kwp||0);   // de VOORGESTELDE PV (optie) mee, zoals in de interactieve
  var seed={ ts:Date.now(), opstelling:'Optimaal', adres:adres, laadpunten:laadpunten,
             batterij:{ kwh:260, aantal:battAantal }, pv:{ kwp:pvKwp } };
  var prev=_kblLaatste[pid+'|'+id]; if(prev && prev.state) seed.restore=prev.state;
  try{ localStorage.setItem(KBL_SEED_KEY, JSON.stringify(seed)); }catch(e){}
  _kblSeedTs[pid+'|'+id]=seed.ts; _kblActief={ pid:pid, id:id };
  _kblPersistKamino();   // bewaar de sessie-state → overleeft een herlaad bij terugkeer uit de kabelplanner
  try{ window.open(KABELPLANNER_URL,'fluctus_kabelplanner'); }catch(e){ alert('Kon de kabelplanner niet openen (pop-up geblokkeerd?).'); }
}
function _kblCheckResultKamino(){
  try{
    var raw=localStorage.getItem(KBL_RESULT_KEY); if(!raw) return;
    var res=JSON.parse(raw); if(!res || res.ts==null || res.kabeltrace_eur==null) return;
    var act=_kblActief; if(!act) return;
    var key=act.pid+'|'+act.id;
    if(!_kblSeedTs[key] || res.ts < _kblSeedTs[key]) return;   // enkel een resultaat ná onze eigen seed
    if(_kblResultTs[key]===res.ts) return; _kblResultTs[key]=res.ts; _kblLaatste[key]=res;

function _ontvangKern(id, pid, k, reportData, reportKey, reportHtml){

function _openRapportOverlay(reportData, reportKey, reportHtml, jacops){

    try{ url=URL.createObjectURL(new Blob([reportHtml],{type:'text/html;charset=utf-8'})); }catch(e){ url='about:blank'; }
  }

function startStudie(id){
  var p=byId(id);
  // Factuur-studie zonder actief project + echte factuur + ingelogd → echt oplaadt/extract, dan resultaat.
  if(p.input==='factuur' && !STATE.werk.id && _factuurFile && ingelogd()){
    _bezig('Uw factuur wordt gelezen en veilig opgeslagen…');
    extractFactuur(_factuurFile).then(function(bc){
      _maakProject(bc); resultaat(id);
    }).catch(function(e){ _fout(id,'Het inlezen/opslaan van uw factuur is mislukt: '+((e&&e.message)||e)+'. Bent u ingelogd in Mijn Fluctus?'); });
    return;
  }
  // laadplein-studie zonder project maar met factuur → zelfde; anders (bestaand project of mock) → direct.
  if(p.input==='laadpleinen' && !STATE.werk.id && _factuurFile && ingelogd()){
    _bezig('Uw factuur wordt gelezen en veilig opgeslagen…');
    extractFactuur(_factuurFile).then(function(bc){ _maakProject(bc); resultaat(id); })
      .catch(function(e){ _fout(id,'Het inlezen/opslaan van uw factuur is mislukt: '+((e&&e.message)||e)); });
    return;
  }
  // v0.9.20: no-factuur → bouw baseCase uit manuele invoer en ga verder (geen factuur nodig).
  if(!STATE.werk.id && !_factuurFile && STATE.werk.noFactuur){ var _nfbc=_bouwNoFactuurBc();
    if(!_nfbc){ _fout(id,'Zonder factuur: vul minstens het jaarverbruik (kWh) in.'); return; }
    _maakProject(_nfbc); resultaat(id); return; }
  if(!STATE.werk.id){ _maakProject(null); }   // mock-fallback (niet ingelogd / geen factuur)
  resultaat(id);
}
// v0.9.6 (Johan-keuze 30-07): ELKE factuur-upload = een NIEUW, uniek project-ID. Niet langer een hash van de
// naam — anders zouden twee verschillende facturen van dezelfde klant hetzelfde ID krijgen en elkaar
// overschrijven. Uniek = laatste ms-tijd (base36) + random → voldoet aan de server-regex FLX-XXX-XXXX.
var _pidSeq=Math.floor(Math.random()*46656);   // 36^3 — per-sessie teller zodat zelfs bursts uniek zijn
function _nieuwProjectId(){
  _pidSeq=(_pidSeq+1)%46656;
  var rnd=function(n){ var s=''; while(s.length<n){ s+=Math.floor(Math.random()*36).toString(36); } return s.toUpperCase().slice(0,n); };
  var t=('000'+((Date.now()+_pidSeq)%46656).toString(36).toUpperCase()).slice(-3);
  return 'FLX-'+t+'-'+rnd(4);
}
function _maakProject(bc){

    tweestaps+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'+
      '<button class="btn green" onclick="_bekijkRapport(\''+id+'\')">📄 Bekijk uw volledige rapport</button>'+
      '<button class="btn" style="border-color:#E8352A;background:#E8352A;color:#fff" onclick="_bekijkRapport(\''+id+'\',true)">📄 JACOPS-versie</button>'+
      ((id==='aansluiting'||id==='mobiliteit')?'<button class="btn" style="border-color:#1F3864;background:#1F3864;color:#fff" onclick="_kblSeedTegel(\''+id+'\')">📍 Kabeltracé intekenen</button>':'')+
      '<button class="btn ghost" onclick="location.hash=\'#/\'">← Naar het overzicht</button></div>'+
    '</div></div>';
}

// ---------- TOEGANGSPOORT: bestaand project openen met ID + e-mail ----------
function renderOpen(){
  app.innerHTML='<div class="screen"><div class="crumb" onclick="location.hash=\'#/\'">← Terug naar het overzicht</div>'+
    '<div class="card"><div class="qh"><div class="ic">🔑</div><div><h2>Open een bestaand project</h2>'+
      '<div class="qsub" style="color:#2d4f8e">Toegangspoort · project-ID + e-mail</div></div></div>'+
    '<div class="qintro">Vul uw projectnummer (FLX-…) en het e-mailadres van de klant óf de adviseur in. Zo werken u en uw adviseur samen verder op hetzelfde project — na een eerste studie meteen een volgende, zonder heen-en-weer via mail.</div>'+
    '<div class="sec"><div class="row">'+
      '<div class="fld"><label>Projectnummer</label><input id="op-id" placeholder="FLX-XXX-XXX" value="'+(STATE.werk.id||'')+'"></div>'+
      '<div class="fld"><label>E-mail (klant of adviseur)</label><input id="op-mail" placeholder="naam@bedrijf.be" value="'+ci('k_mail')+'"></div>'+
    '</div><div id="op-msg" class="hint"></div></div>'+
    '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn green" onclick="openBestaand()">Open project</button>'+
    '<button class="btn ghost" onclick="location.hash=\'#/\'">Annuleren</button></div></div></div>';
}
function openBestaand(){
  var id=(document.getElementById('op-id').value||'').trim().toUpperCase();
  var email=(document.getElementById('op-mail').value||'').trim();
  var msg=document.getElementById('op-msg');
  if(!/^FLX-/.test(id)||!/\S+@\S+\.\S+/.test(email)){ msg.style.color='#B23'; msg.textContent='Vul een geldig projectnummer (FLX-…) en e-mailadres in.'; return; }
  msg.style.color='#5A6577'; msg.textContent='Bezig met openen…';
  kApiPost('/api/kamino/project-open',{ id:id, email:email }).then(function(r){
    laadProject(r.project, r.rapporten); location.hash='#/'; renderOverzicht();
  }).catch(function(e){ msg.style.color='#B23'; msg.textContent='Kon niet openen: '+((e&&e.message)||e); });
}
function laadProject(rec, rapporten){
  var k=rec.klant||{}, a=rec.adviseur||{};
  STATE.contact={ k_naam:k.naam||'', k_mail:k.email||'', k_tel:k.tel||'', a_naam:a.naam||'', a_mail:a.email||'', a_tel:a.tel||'' };
  var pv=rec.pv||{};
  if(!projById(rec.id)) STATE.projecten.unshift({ id:rec.id, naam:rec.naam||k.naam||'', datum:'', factuur:rec.factuur||'', baseCase:rec.baseCase||null, opgeslagen:true });
  // v0.9.13: bewaard profiel herstellen (als het nog in de lijst zit), anders default. Voorheen ging het profiel bij
  // heropenen verloren (altijd PROFIELEN[0]).
  STATE.werk={ id:rec.id, naam:rec.naam||k.naam||'', factuur:rec.factuur||'', profiel:((rec.profiel && PROFIELEN.indexOf(rec.profiel)>=0)?rec.profiel:(rec.profiel||PROFIELEN[0])), pv_kwp:pv.kwp||'', pv_inj:pv.inj||'', pleinen:[], baseCase:rec.baseCase||null, opgeslagen:true };
  STATE.gedaan[rec.id]=Object.assign({}, rec.studies||{});
  // v0.9.10: welke tegels hebben een BEWAARD rapport → per tegel een "bekijk vorig rapport"-knop.
  var m={}; if(rapporten && Array.isArray(rapporten.studies)){ rapporten.studies.forEach(function(t){ if(t) m[t]=true; }); }
  STATE.rapportOp[rec.id]=m;
}
// Projectrecord bewaren zodat het later via de toegangspoort heropend kan worden (enkel echte projecten).
function persistProject(){
  var act=projById(STATE.werk.id)||{};
  if(!STATE.werk.id || !ingelogd() || !act.opgeslagen) return;
  kApiPost('/api/kamino/project',{
    id:STATE.werk.id, naam:STATE.werk.naam,
    klant:{ naam:STATE.contact.k_naam, email:STATE.contact.k_mail, tel:STATE.contact.k_tel },
    adviseur:{ naam:STATE.contact.a_naam, email:STATE.contact.a_mail, tel:STATE.contact.a_tel },
    factuur:STATE.werk.factuur||'', baseCase:STATE.werk.baseCase||null,
    // v0.9.13 (Johan 03-08): profiel persisteren zodat het later (kamino-heropen én manager-open in de
    // interactieve simulator) correct terugkomt. Zonder dit veld viel de carryover terug op een default-profiel.
    profiel:STATE.werk.profiel||'',
    pv:{ kwp:STATE.werk.pv_kwp||'', inj:STATE.werk.pv_inj||'' }, studies:gedaanMap()
  }).catch(function(){});
}

// ---------- router ----------
function router(){ var h=location.hash||'#/', m=h.match(/#\/punt\/([a-z]+)/i);
  if(/#\/open/.test(h)){ renderOpen(); window.scrollTo(0,0); }
  else if(m){ renderPunt(m[1]); window.scrollTo(0,0); }
  else { renderOverzicht(); } }
// Echte verbruiksprofielen uit de simulator laden (zodat de naam matcht met wat de sim verwacht).
kApiGet('/api/profielen-lijst').then(function(r){
  var lijst=(r&&r.profielen)||[];
  var namen=lijst.map(function(x){ return (typeof x==='string')?x:(x&&(x.naam||x.name)||''); }).filter(Boolean);
  if(namen.length){ PROFIELEN=namen; if(PROFIELEN.indexOf(STATE.werk.profiel)<0) STATE.werk.profiel=PROFIELEN[0]; router(); }
}).catch(function(){});
// Upload-brug voor rapporten die als Blob in de rapport-overlay draaien (bv. het inline SolarActive-rapport):
// zij hebben zelf geen token/same-origin-fetch, dus posten ze de PDF hierheen. Kamino doet de authenticated
// upload naar de bucket (kApiPost = absolute Railway-URL + sb-JWT).
window.addEventListener('message', function(e){
  var d=e&&e.data; if(!d || d.type!=='fluctus-rapport-pdf' || !d.payload) return;
  kApiPost('/api/rapport-opslaan', d.payload).then(function(){
    try{ e.source && e.source.postMessage({type:'fluctus-rapport-saved', ok:true}, '*'); }catch(x){}
  }).catch(function(err){
    try{ e.source && e.source.postMessage({type:'fluctus-rapport-saved', ok:false, error:(err&&err.message)||'upload mislukt'}, '*'); }catch(x){}
  });
});
// v0.9.18: herstel de sessie-state (overleeft een herlaad bij terugkeer uit de kabelplanner) vóór de eerste render,
// render dan het scherm, en verwerk daarna een eventueel openstaand kabelplanner-resultaat (→ herrekening).
try{ _kblRestoreKamino(); }catch(e){}
window.addEventListener('hashchange',router); router();
try{ _kblCheckResultKamino(); }catch(e){}
</script>
