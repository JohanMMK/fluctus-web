<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Offerte tekenen · Energie-Compas</title>
<link rel="icon" href="/favicon-ec-32.png">
<!-- offerte-teken.html v1.0.0 (2026-10-17, Johan): offerte digitaal tekenen vanuit EK (server ≥ 15.330.0).
     ?token=<dossier>&id=<offerte-id>[#k=<base64 KPI's uit EK>] → offerte nalezen (gegevens + opgeladen bestand), naam + functie +
     handtekening + akkoord → POST /api/ek/offerte-teken. Daarna: bevestiging + ondertekeningsbewijs; de stap «getekend» staat
     meteen in het dossier. Je-vorm (EK). Geen login: de dossierlink is persoonlijk. -->
<style>
  :root{--navy:#14203a;--green:#05b050;--line:#d6e0ec;--muted:#54617a;--bg:#f4f7fb}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:15px/1.55 Poppins,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--navy)}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
  .top img{height:30px} .top span{color:var(--muted);font-size:13px}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  h1{font-size:21px;margin:2px 0 6px} h2{margin:0 0 6px;font-size:18px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
  table{width:100%;border-collapse:collapse} td{padding:7px 8px;border-bottom:1px solid #e8eef5;vertical-align:top} td:first-child{color:var(--muted);width:38%}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px} .kpis div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
  .kpis b{display:block;font-size:18px} .kpis small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
  .rij{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:600px){.rij,.kpis{grid-template-columns:1fr}}
  .pad{border:1.5px dashed #9fb1c9;border-radius:12px;background:#fbfcfe;position:relative;touch-action:none}
  .pad canvas{display:block;width:100%;height:170px;cursor:crosshair}
  .pad .hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#9aa6b8;pointer-events:none}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--navy)} .chk input{margin-top:4px;width:18px;height:18px}
  .btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;color:var(--navy);text-decoration:none}
  .btn.p{background:var(--green);border-color:var(--green);color:#fff} .btn:disabled{opacity:.5;cursor:default}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .msg{margin-top:10px;font-size:14px} .err{color:#8a1f1f}
  .banner{background:#e6f6ec;border:1px solid #bfe6cd;border-radius:14px;padding:14px 16px;margin-top:16px} .banner.warn{background:#fff3d6;border-color:#f1d08a}
  .state{padding:40px 16px;text-align:center;color:var(--muted)} .small{font-size:12.5px;color:var(--muted)}
  .stappen{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .stappen span{font-size:12.5px;border-radius:999px;padding:4px 10px;background:#eef3f9;color:var(--muted)} .stappen span.ok{background:#e6f6ec;color:#0a7d3c;font-weight:600}
</style>
</head>
<body>
<div class="top"><img src="/apps/ec-logo.png" alt="Energie-Compas"><span>Offerte tekenen</span></div>
<main id="root"><div class="state">Offerte laden…</div></main>
<script>
  var $=function(id){return document.getElementById(id);};
  var Q=new URLSearchParams(location.search), TOKEN=Q.get('token')||'', ID=Q.get('id')||'', PROXY='', INFO=null, KPI=null;
  try{ var hk=(location.hash||'').match(/k=([^&]+)/); if(hk) KPI=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(hk[1]))))); }catch(e){ KPI=null; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function eur(v){ return v==null||!isFinite(+v)?'—':'€ '+Math.round(+v).toLocaleString('nl-BE'); }
  function num(v,d){ return (+v).toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
  function tijd(ts){ try{ return new Date(ts).toLocaleString('nl-BE',{ timeZone:'Europe/Brussels' }); }catch(e){ return ''; } }
  function render(){
    var i=INFO, o=i.offerte, d=o.data||{}, h='';
    h+='<div class="card"><div class="eyebrow">'+(i.getekend?'Getekend':'Ter ondertekening')+'</div><h1>Offerte '+esc(d.installateur||'')+'</h1><div class="small">'+esc(i.klant||'')+(i.adres?' · '+esc(i.adres):'')+(i.project_id?' · dossier '+esc(i.project_id):'')+'</div>'+
      '<table style="margin-top:10px"><tbody>'+
      '<tr><td>Installateur</td><td>'+esc(d.installateur||'—')+'</td></tr>'+
      (d.referentie?'<tr><td>Referentie</td><td>'+esc(d.referentie)+'</td></tr>':'')+(d.datum?'<tr><td>Datum offerte</td><td>'+esc(d.datum)+'</td></tr>':'')+
      '<tr><td>Omvang</td><td>'+esc(o.omschrijving||'—')+'</td></tr>'+
      '<tr><td>Bedrag (excl. btw)</td><td><b>'+eur(d.totaal)+'</b></td></tr>'+
      '</tbody></table>';
    if(KPI&&(KPI.besparing!=null||KPI.rendement!=null||KPI.tvt!=null)) h+='<div class="kpis"><div><small>Besparing / jaar</small><b>'+eur(KPI.besparing)+'</b></div><div><small>Rendement</small><b>'+(KPI.rendement!=null?num(KPI.rendement,0)+' %':'—')+'</b></div><div><small>Terugverdientijd</small><b>'+(KPI.tvt!=null?num(KPI.tvt,1)+' jaar':'—')+'</b></div></div><div class="small" style="margin-top:6px">Volgens het rapport van deze offerte in je dossier (indicatief).</div>';
    if(o.bestanden&&o.bestanden.length) h+='<div class="acts">'+o.bestanden.map(function(b){ return '<a class="btn" target="_blank" rel="noopener" href="'+esc(PROXY+'/api/ek/offerte-bestand?token='+encodeURIComponent(TOKEN)+'&id='+encodeURIComponent(o.id)+'&k='+b.k)+'">📄 Offerte bekijken'+(o.bestanden.length>1?' ('+(b.k+1)+')':'')+'</a>'; }).join('')+'<a class="btn" href="'+esc(i.ek_link)+'">← Terug naar je dossier</a></div>';
    else h+='<div class="acts"><a class="btn" href="'+esc(i.ek_link)+'">← Terug naar je dossier</a></div>';
    h+='</div>';
    if(i.getekend){
      h+='<div class="banner"><b>✓ Getekend</b> door '+esc(i.getekend.naam)+(i.getekend.functie?' ('+esc(i.getekend.functie)+')':'')+' op '+esc(tijd(i.getekend.ts))+'.'+
        '<div class="acts"><a class="btn p" target="_blank" rel="noopener" href="'+esc(PROXY+'/api/ek/offerte-bewijs?token='+encodeURIComponent(TOKEN)+'&id='+encodeURIComponent(o.id))+'">🖨️ Ondertekeningsbewijs</a></div>'+
        '<div class="stappen"><span class="ok">✓ Advies</span><span class="ok">✓ Offerte</span><span class="ok">✓ Tekenen</span><span>Installatie</span><span>Sturing aan</span></div>'+
        '<p class="small" style="margin-bottom:0">De installateur neemt contact met je op voor de planning. Financiering en (voor ondernemingen) de investeringsaftrek lopen vanaf nu mee: je vindt het bankdossier en de energiestudie in je dossier.</p></div>';
    } else if(!o.bevestigd){
      h+='<div class="banner warn">Deze offerte is nog niet nagekeken in je dossier. Bevestig eerst de gelezen gegevens in EK.</div>';
    } else {
      if(i.andere_getekend) h+='<div class="banner warn">Er is in dit dossier al een andere offerte getekend.</div>';
      h+='<div class="card" id="teken"><div class="eyebrow">Tekenen</div><h2>Ik aanvaard deze offerte</h2>'+
        '<div class="rij"><div><label for="naam">Naam</label><input type="text" id="naam" autocomplete="name"></div>'+
        '<div><label for="functie">Functie (voor een onderneming)</label><input type="text" id="functie" placeholder="bv. zaakvoerder"></div></div>'+
        '<label>Handtekening</label><div class="pad"><canvas id="pad"></canvas><span class="hint" id="hint">Teken hier met muis, vinger of pen</span></div>'+
        '<div class="acts" style="margin-top:6px"><button class="btn" id="wis" type="button">Wissen</button></div>'+
        '<label class="chk"><input type="checkbox" id="akk"> <span>Ik heb de offerte van <b>'+esc(d.installateur||'de installateur')+'</b>'+(d.totaal!=null?' ('+eur(d.totaal)+' excl. btw)':'')+' gelezen en aanvaard ze'+(i.klant?' namens <b>'+esc(i.klant)+'</b>':'')+'.</span></label>'+
        '<div class="acts"><button class="btn p" id="ok" type="button">✍️ Teken de offerte</button><span class="small">We registreren je naam, functie, het tijdstip, je IP-adres en een vingerafdruk van de offerte. De bestelling komt tot stand tussen jou en de installateur.</span></div>'+
        '<div class="msg" id="msg"></div></div>';
    }
    $('root').innerHTML=h;
    if($('pad')) initPad();
    if($('ok')) $('ok').onclick=teken;
  }
  var PAD={ leeg:true };
  function initPad(){
    var c=$('pad'), ctx=null, bezig=false, last=null;
    function maat(){ var r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14203a'; PAD.leeg=true; PAD.n=0; if($('hint')) $('hint').style.display=''; }
    maat(); window.addEventListener('resize',maat);
    function pos(e){ var r=c.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
    c.addEventListener('pointerdown',function(e){ bezig=true; last=pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1,0,7); ctx.fillStyle='#14203a'; ctx.fill(); PAD.leeg=false; PAD.n=(PAD.n||0)+1; $('hint').style.display='none'; e.preventDefault(); });
    c.addEventListener('pointermove',function(e){ if(!bezig) return; var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; PAD.n=(PAD.n||0)+1; e.preventDefault(); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ c.addEventListener(ev,function(){ bezig=false; }); });
    $('wis').onclick=function(){ var r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); PAD.leeg=true; PAD.n=0; $('hint').style.display=''; };
  }
  function padPng(){
    var c=$('pad'), ctx=c.getContext('2d'), w=c.width, h=c.height, d=ctx.getImageData(0,0,w,h).data, x0=w, y0=h, x1=0, y1=0;
    for(var y=0;y<h;y+=2) for(var x=0;x<w;x+=2){ if(d[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } }
    if(x1<=x0||y1<=y0) return null;
    var m=8; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w,x1+m); y1=Math.min(h,y1+m);
    var o=document.createElement('canvas'), sc=Math.min(1,600/(x1-x0)); o.width=Math.round((x1-x0)*sc); o.height=Math.round((y1-y0)*sc);
    o.getContext('2d').drawImage(c,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height); return o.toDataURL('image/png');
  }
  async function teken(){
    var m=$('msg'), naam=$('naam').value.trim(), functie=$('functie').value.trim();
    m.className='msg err';
    if(naam.length<3){ m.textContent='Vul je naam in.'; return; }
    if(PAD.leeg||(PAD.n||0)<8){ m.textContent='Plaats je handtekening in het vak.'; return; }
    if(!$('akk').checked){ m.textContent='Vink aan dat je de offerte gelezen hebt en aanvaardt.'; return; }
    var png=padPng(); if(!png){ m.textContent='Plaats je handtekening in het vak.'; return; }
    $('ok').disabled=true; m.className='msg'; m.textContent='⏳ Bezig met tekenen…';
    try{ var r=await fetch(PROXY+'/api/ek/offerte-teken',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ token:TOKEN, id:ID, naam:naam, functie:functie, akkoord:true, handtekening:png, kpi:KPI||null }) });
      var j=await r.json().catch(function(){ return {}; });
      if(!r.ok||!j.ok) throw new Error(j.error||('status '+r.status));
      INFO.getekend={ naam:naam, functie:functie, ts:j.ts }; render(); window.scrollTo({ top:0, behavior:'smooth' });
    }catch(e){ $('ok').disabled=false; m.className='msg err'; m.textContent=e.message; }
  }
  (async function(){
    try{
      if(!TOKEN||!ID){ $('root').innerHTML='<div class="state">Deze link is onvolledig.</div>'; return; }
      try{ var rc=await fetch('/api/config'); var cfg=await rc.json(); PROXY=(cfg.fluctusProxyUrl||'').replace(/\/+$/,''); }catch(e){}
      if(!PROXY) PROXY='https://lucid-amazement-production.up.railway.app';
      var r=await fetch(PROXY+'/api/ek/offerte-teken-info?token='+encodeURIComponent(TOKEN)+'&id='+encodeURIComponent(ID)+'&cb='+Date.now(),{ cache:'no-store' }); var j=await r.json().catch(function(){ return {}; });
      if(!r.ok||!j.ok){ $('root').innerHTML='<div class="state">'+esc(j.error||'Deze link is niet (meer) geldig.')+'</div>'; return; }
      INFO=j; render();
    }catch(e){ $('root').innerHTML='<div class="state">De offerte kon niet geladen worden. Probeer het later opnieuw.</div>'; }
  })();
</script>
</body>
</html>
