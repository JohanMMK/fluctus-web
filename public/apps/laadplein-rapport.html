<!DOCTYPE html>
<!-- ============================================================
     FLUCTUS · BETALEND-LAADPLEIN RAPPORT  v1.4.0  (2026-08-21 Europe/Brussels)
     v1.4.0 (Johan 21-08): NIET-BETALENDE pleinen zichtbaar. Eigen sectie op de laadplein-definitiepagina
              (wagens, geladen MWh/km, CREG-besparing per plein + totaal). Data: D.gewone_pleinen.
     v1.3.0 (Johan 21-08): MIX — bij gewone (wagenpark) pleinen tonen de 6 scenario's per rij hun levering
              (MWh + km) en CREG-besparing; toelichting dat "km gevraagd" enkel de betalende pleinen betreft.
     Klantrapport voor een gebouw dat er een BETALEND laadplein aan koppelt.
     - E+Drive/Jacops-design (hergebruikt uit simuleer-rapport.html v1.2.2).
     - DATA: window.FLUCTUS_LAADPLEIN_RAPPORT of sessionStorage['FLUCTUS_LAADPLEIN_RAPPORT'].
       Gebouwd door _laadpleinRapportData() in simulator.html (spiegelt het scherm; rekent
       enkel de financieringsmodellen door uit capex + jaarwinst).
     - Zonder data → window._LP_DEMO=true → voorbeeldweergave met _demo().
     - Opbouw: voorblad (kerncijfers investering) · samenvatting · inhoudstafel ·
       ingegeven installatie · laadplein-definitie + heatmaps · simulatiemethode + sturing
       (3 facturen) + windfall · 6 scenario's · kabeltracé (foto + BOM) · financiële analyse
       (eigen middelen / 75%@5% / leasing 10% + 50/50) · slotpagina (CTA + services-matrix).
     ============================================================ -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betalend-laadplein rapport</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blauw:#1F3864; --blauw-l:#2d4f8e; --groen:#05B050; --groen-d:#048443;
    --oranje:#9E480E; --oranje-l:#E8A33D; --grijs:#5A6577; --lijn:#D5DBE3; --bg:#F5F7FA; --zwart:#1A1F2B;
    --rood:#C0392B; --jacops:#E8352A; --edrive:#80C539;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--zwart);background:#e9edf2;font-size:14px;line-height:1.55}
  .a4{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:16mm 18mm 12mm;box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;position:relative}
  .a4 > .a4-content{flex:1}
  .a4-foot{margin-top:auto;padding-top:8px;font-size:9px;color:var(--grijs);border-top:1px solid var(--lijn);display:flex;justify-content:space-between}
  .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grijs);font-weight:700}
  h1{font-size:32px;color:var(--blauw);line-height:1.1;margin:6px 0 10px;font-weight:800}
  h2{font-size:22px;color:var(--blauw);margin:0 0 4px;font-weight:800}
  h3{font-size:15px;color:var(--blauw);margin:16px 0 6px;font-weight:700}
  .lead{font-size:15px;color:var(--grijs);margin-bottom:14px}
  p{margin:8px 0}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .kpi-row.k3{grid-template-columns:repeat(3,1fr)}
  .kpi-row.k2{grid-template-columns:repeat(2,1fr)}
  .kpi{border:1px solid var(--lijn);border-left:4px solid var(--blauw);border-radius:4px;padding:12px}
  .kpi.groen{border-left-color:var(--groen)} .kpi.oranje{border-left-color:var(--oranje)} .kpi.rood{border-left-color:var(--jacops)}
  .kpi .l{font-size:10px;color:var(--grijs);text-transform:uppercase;letter-spacing:.05em;line-height:1.25;min-height:2.5em;display:block}
  .kpi .v{font-size:24px;font-weight:800;color:var(--zwart);margin-top:3px}
  .kpi .s{font-size:10px;color:var(--grijs);margin-top:2px}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
  th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--lijn)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--blauw);color:#fff;font-weight:700;border-bottom:none}
  tbody tr:nth-child(even){background:var(--bg)}
  tfoot td{font-weight:800;border-top:2px solid var(--blauw);background:#eef2f8}
  tr.grp td{background:#eaf0f8;font-weight:700;color:var(--blauw)}
  tr.item td:first-child{padding-left:20px;color:#3A424C}
  table.fact3{font-size:10.5px;margin:8px 0}
  table.fact3 th,table.fact3 td{padding:2.5px 8px}
  table.fact3 tr.item td:first-child{padding-left:18px}
  table.fact3 thead th{font-size:10.5px}
  table.scn{font-size:10.5px}
  table.scn th,table.scn td{padding:3.5px 6px}
  .pos{color:var(--groen-d);font-weight:700} .neg{color:var(--rood);font-weight:700}
  .box{border:1px solid var(--lijn);border-radius:6px;padding:14px;margin:12px 0;background:var(--bg)}
  .box.blauw{background:#1F386408;border-color:#1F386430}
  .box.groen{background:#05B0500f;border-color:#05B05040}
  .box.oranje{background:#FFF3E0;border-color:#9E480E55}
  .note{font-size:11px;color:var(--grijs);font-style:italic}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .stap-band{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .stap-band .nr{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--blauw);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
  .merk{display:flex;align-items:center;justify-content:space-between;gap:8mm;margin-bottom:8px}
  .merk .fl{font-weight:800;font-size:22px;color:#1A1F2B;letter-spacing:-.4px}
  .merk .fl .ed-e{color:var(--edrive)}
  .merk .jc{background:var(--jacops);color:#fff;font-family:Arial;font-weight:900;font-size:15px;letter-spacing:-.5px;padding:2.2mm 3mm;border-radius:1.4mm;display:inline-block}
  .titel-accent{height:4px;width:64px;background:var(--jacops);border-radius:3px;margin:2px 0 10px}
  .inbox{display:grid;grid-template-columns:170px 1fr;gap:2px 12px;font-size:12.5px;padding:2px 0}
  .inbox .k{color:var(--grijs);font-weight:700} .inbox .v{color:var(--zwart)}
  .toc{font-size:13px} .toc div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--lijn)}
  .toc .t{color:var(--zwart)} .toc .pg{color:var(--grijs);font-weight:700}
  /* heatmap */
  .heat-wrap{margin:8px 0 4px}
  .heat-svg{display:block;width:100%;height:auto;border:1px solid var(--lijn);border-radius:4px}
  .heat-leg{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--grijs);margin-top:4px}
  .heat-leg .bar{height:9px;width:120px;border-radius:2px;background:linear-gradient(90deg,#EAF7EE,#9AD4A6,#05B050,#048443,#0B3D24)}
  /* E+Drive-voorblad */
  .a4.cover{padding:0;overflow:hidden;background:#3B4049}
  .cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cover-free{position:absolute;left:8.5%;right:8.5%;top:60%;color:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .cf-title{color:#80C539;font-weight:800;font-size:14px;letter-spacing:.02em;margin-bottom:9px}
  .cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}
  .cf{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-left:3px solid #80C539;border-radius:6px;padding:9px 14px}
  .cf-l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#B9C0BE;font-weight:700;margin-bottom:3px}
  .cf-v{font-size:19px;font-weight:800;color:#fff;line-height:1.15;word-break:break-word}
  .cf-v .u{font-size:12px;font-weight:600;color:#B9C0BE}
  /* cover-fallback (charcoal gradient met logo-tekst) als /apps/-asset ontbreekt */
  .cover-fb{position:absolute;inset:0;background:linear-gradient(135deg,#2b3038,#3B4049 55%,#333842);display:flex;flex-direction:column;justify-content:flex-start;padding:16mm 14mm}
  .cover-fb .ed{color:#80C539;font-weight:800;font-size:30px;letter-spacing:-.5px}
  .cover-fb .ed b{color:#fff} .cover-fb .cl{color:#fff;font-size:20px;font-weight:800;margin-top:14px;max-width:70%}
  .cover-fb .jc{position:absolute;top:16mm;right:14mm;background:#E8352A;color:#fff;font-family:Arial;font-weight:900;font-size:15px;padding:2mm 3mm;border-radius:1.4mm}
  /* slotpagina */
  .a4.slot{padding:15mm 15mm 12mm;background:#3B4049;color:#fff}
  .slot-eyebrow{color:#80C539;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .slot-h{font-size:27px;font-weight:800;line-height:1.15;margin:8px 0 6px;color:#fff}
  .slot-h .g{color:#80C539}
  .slot-sub{font-size:14px;color:#C7CCD1;margin-bottom:14px;line-height:1.5}
  .svc-card{background:#fff;border-radius:8px;padding:10px 12px;color:#1A1F2B}
  .svc-cap{font-size:11px;font-weight:800;color:#1F3864;margin-bottom:5px}
  table.svc{width:100%;border-collapse:collapse;font-size:8.6px}
  table.svc th,table.svc td{padding:1.6px 5px}
  table.svc thead th{color:#6AA22E;font-weight:800;text-align:center;font-size:9px}
  table.svc thead th.sub{font-size:8px;font-weight:700;padding-top:0;border-bottom:1.5px solid #E3E8EF}
  table.svc td.r{text-align:left;color:#2A2F36}
  table.svc td.c{text-align:center}
  table.svc tr.sec td{background:#868C95;color:#EAF6DD;font-weight:800;text-transform:uppercase;font-size:8.5px;letter-spacing:.04em;padding:2.5px 6px}
  table.svc tbody tr:not(.sec):nth-child(even){background:#F5F7FA}
  .svc-chk{display:inline-block;width:12px;height:12px;line-height:12px;text-align:center;background:#2E333A;color:#fff;border-radius:2px;font-size:9px}
  .svc-un{display:inline-block;width:11px;height:11px;border:1.4px solid #AEB4BD;border-radius:2px;vertical-align:middle}
  .svc-txt{font-size:8.6px;color:#3A424C}
  .slot-foto{display:block;width:100%;height:auto;border-radius:8px;margin-top:12px}
  .slot-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:10.5px;color:#C7CCD1}
  .slot-jc{background:#E8352A;color:#fff;font-family:Arial;font-weight:900;font-size:12px;letter-spacing:-.5px;padding:2px 7px;border-radius:2px}
  #fdpdf-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px}
  #fdpdf-bar button{font-family:inherit;font-size:12px;font-weight:700;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  #fdpdf-save{background:var(--groen);color:#fff}
  #fdpdf-print{background:#fff;color:var(--blauw);border:1px solid var(--lijn)!important}
  @page{size:A4;margin:0}
  @media print{ body{background:#fff} .a4{box-shadow:none;margin:0;min-height:297mm;page-break-after:always;break-after:page} .a4:last-child{page-break-after:auto;break-after:auto} table,.box,.kpi-row,.heat-wrap{break-inside:avoid} #fdpdf-bar{display:none} }
</style>
</head>
<body>
<div id="rapport"></div>
<div id="fdpdf-bar">
  <button id="fdpdf-print" onclick="window.print()">🖨️ Print</button>
  <button id="fdpdf-save">⬇ PDF opslaan</button>
</div>
<script>
// ============================================================================
//  FLUCTUS · BETALEND-LAADPLEIN RAPPORT — renderer
// ============================================================================
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _num(x,d){ x=+x||0; return x.toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function eur(x){ return '€ '+_num(x,0); }
function eur1(x){ return '€ '+_num(x,1); }
function pct(x,d){ return _num(x,d==null?0:d)+' %'; }
function jaar(x){ return _num(x,1)+' j'; }

function _uitSessie(){ try{ return JSON.parse(sessionStorage.getItem('FLUCTUS_LAADPLEIN_RAPPORT')||'null'); }catch(e){ return null; } }
var _echt = window.FLUCTUS_LAADPLEIN_RAPPORT || _uitSessie();
window._LP_DEMO = !_echt;
var D = _echt || _demo();

var R=document.getElementById('rapport'), _pg=0;
var PID=D.project_id||'';
var FOOT_L=[D.project, D.scenario].filter(function(x){return x;}).map(esc).join(' · ') || 'Betalend-laadplein rapport';
function pagina(inner){
  var p=document.createElement('div'); p.className='a4'; _pg++;
  p.innerHTML='<div class="a4-content">'+inner+'</div>'+
    '<div class="a4-foot"><span>'+FOOT_L+'</span>'+
    '<span>'+(PID?'Projectnr. '+esc(PID)+' · ':'')+'p. '+_pg+'</span></div>';
  R.appendChild(p); return p;
}
// Merkband: E+DRIVE linksboven, JACOPS-badge rechts (zonder "energie-integrator").
function merkband(){
  return '<div class="merk"><div class="fl"><span class="ed-e">E+</span>DRIVE</div>'+
    '<div class="jc">JACOPS.</div></div>';
}
function heatKleur(t){ // t in 0..1 → E+Drive-groen ladder
  if(t<=0) return '#F2F5F8';
  var stops=[[234,247,238],[154,212,166],[5,176,80],[4,132,67],[11,61,36]];
  var x=Math.min(1,t)*(stops.length-1), i=Math.floor(x), f=x-i, a=stops[i], b=stops[Math.min(stops.length-1,i+1)];
  var r=Math.round(a[0]+(b[0]-a[0])*f), g=Math.round(a[1]+(b[1]-a[1])*f), bl=Math.round(a[2]+(b[2]-a[2])*f);
  return 'rgb('+r+','+g+','+bl+')';
}
// Heatmap: verticaal 24 uur (0 boven → 23 onder), horizontaal 365 dagen. mat = [24][365] kW-gemiddelden.
function heatmapSvg(mat, piek){
  if(!mat||!mat.length) return '<div class="note">Geen sessie-profiel beschikbaar.</div>';
  var DAYS=mat[0].length, HRS=mat.length, W=728, H=200, padL=26, padB=16;
  var cw=(W-padL)/DAYS, ch=(H-padB)/HRS, mx=piek||1;
  mat.forEach(function(row){ row.forEach(function(v){ if(v>mx) mx=v; }); });
  var s='<svg class="heat-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
  for(var h=0;h<HRS;h++){ for(var d=0;d<DAYS;d++){ var v=mat[h][d]||0; if(v<=0) continue;
    s+='<rect x="'+(padL+d*cw).toFixed(1)+'" y="'+(h*ch).toFixed(1)+'" width="'+(cw+0.6).toFixed(1)+'" height="'+(ch+0.4).toFixed(1)+'" fill="'+heatKleur(v/mx)+'"/>'; } }
  // uur-assen (0,6,12,18)
  [0,6,12,18].forEach(function(h){ s+='<text x="2" y="'+(h*ch+ch*0.5+3).toFixed(1)+'" font-size="8" fill="#5A6577">'+h+'u</text>'; });
  // maand-ticks
  var mnd=['J','F','M','A','M','J','J','A','S','O','N','D'], cum=[0,31,59,90,120,151,181,212,243,273,304,334];
  cum.forEach(function(c,i){ var x=padL+c*cw; s+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>';
    s+='<text x="'+(x+2).toFixed(1)+'" y="'+(H-4)+'" font-size="8" fill="#5A6577">'+mnd[i]+'</text>'; });
  s+='</svg>';
  return s;
}

// ---------- financieringsmodellen (rekent uit capex + jaarwinst) ----------
function _financiering(capex, jaarwinst){
  var A={ looptijd:10, lening_pct:75, lening_rente:5, leasing_rente:10, split:50 };
  function annu(pv,r,n){ r=r/100; return (r<=0)?pv/n:(pv*r/(1-Math.pow(1+r,-n))); }
  var eigen={ investering:capex, jaarwinst:jaarwinst, tvt:jaarwinst>0?capex/jaarwinst:null, rendement:capex>0?jaarwinst/capex*100:null };
  var L=capex*A.lening_pct/100, E=capex-L, an=annu(L,A.lening_rente,A.looptijd);
  var lening={ lening:L, eigen_inbreng:E, rente:A.lening_rente, looptijd:A.looptijd, annuiteit:an,
    netto_jr:jaarwinst-an, rendement_ei:E>0?(jaarwinst-an)/E*100:null, tvt_ei:(jaarwinst-an)>0?E/(jaarwinst-an):null };
  var lease=annu(capex,A.leasing_rente,A.looptijd);
  var extra=jaarwinst-lease, klant=extra*A.split/100, partner=extra*(100-A.split)/100+lease;
  var leasing={ leasetermijn:lease, extra_winst:extra, klant_netto:klant, partner_netto:partner, rente:A.leasing_rente, split:A.split, looptijd:A.looptijd };
  return { aannames:A, eigen:eigen, lening:lening, leasing:leasing };
}

var K=D.kern||{}, IN=D.input||{}, PLN=D.pleinen||[], ST=D.sturingen||{}, F3=D.factuur3||{}, SC=D.scenarios||[], KB=D.kabel||{};
var GEW=D.gewone_pleinen||[], GEW_BESP=+D.gewone_besparing_eur||0, CREG_MWH=+D.creg_forfait_eur_mwh||0;   // v1.4: niet-betalende (wagenpark) pleinen
var FIN=_financiering(+K.investering||0, +K.jaarwinst||0);
var _100 = SC.filter(function(r){return r.heeftPlein && +r.pct===100;})[0] || SC.filter(function(r){return r.heeftPlein;}).slice(-1)[0] || {};

// ===========================================================================
// PAGINA 1 — VOORBLAD met kerncijfers voor de investeringsbeoordeling
// ===========================================================================
(function(){
  function veld(l,v){ return '<div class="cf"><div class="cf-l">'+esc(l)+'</div><div class="cf-v">'+v+'</div></div>'; }
  var p=document.createElement('div'); p.className='a4 cover'; _pg++;
  p.innerHTML =
    '<img class="cover-bg" src="/apps/voorblad-simuleer.jpg" onerror="this.style.display=\'none\';var fb=this.parentNode.querySelector(\'.cover-fb\'); if(fb) fb.style.display=\'flex\';" alt="E+Drive · een filiaal van Jacops">'+
    '<div class="cover-fb" style="display:none"><div class="ed">E+<b>DRIVE</b></div>'+
      '<div class="cl">Betalend laadplein aan uw gebouw — de investering in cijfers.</div><div class="jc">JACOPS.</div></div>'+
    '<div class="cover-free">'+
      '<div class="cf-title">Betalend-laadplein rapport'+(window._LP_DEMO?' · voorbeeldweergave':'')+'</div>'+
      ((D.project||D.scenario)?'<div style="font-size:17px;font-weight:800;color:#fff;margin:-4px 0 10px">'+esc(D.project||'')+
        (D.scenario?' <span style="color:#B9C0BE;font-weight:600">· '+esc(D.scenario)+'</span>':'')+'</div>':'')+
      '<div class="cf-grid">'+
        veld('Investering', eur(K.investering)+' <span class="u">excl. btw</span>')+
        veld('Winst / jaar', eur(K.jaarwinst)+' <span class="u">netto</span>')+
        veld('Terugverdientijd', (K.tvt!=null?jaar(K.tvt):'—'))+
        veld('Rendement', (K.rendement!=null?pct(K.rendement,1)+' <span class="u">/ jaar</span>':'—'))+
      '</div>'+
    '</div>';
  R.appendChild(p);
})();

// ===========================================================================
// PAGINA 2 — DISCLAIMER (leegblad, disclaimer onderaan)
// ===========================================================================
(function(){
  var disc=
    '<div class="box" style="background:#F5F7FA;border-color:#D5DBE3">'+
    '<div style="font-size:12px;font-weight:800;color:#1F3864;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px">Disclaimer</div>'+
    '<div style="font-size:10.5px;color:#3A424C;line-height:1.6;text-align:justify">'+
    'De analyses in dit document zijn uitsluitend gebaseerd op de door de klant aangeleverde gegevens en input. De keuze van de laadpalen en de definitie van de laadsessies, laadvensters en overige parameters werden in gezamenlijk overleg met de klant bepaald. '+
    'De simulaties geven weer wat, op basis van de marktgegevens van de afgelopen twaalf (12) maanden, de berekende impact is van een sturing zonder onbalans van deze keuzes. '+
    'Deze resultaten betreffen een berekening op historische gegevens; resultaten en cijfers uit het verleden bieden geen enkele waarborg of garantie voor de toekomst. '+
    'Marktprijzen, netwerk- en distributietarieven, heffingen, verbruiks- en laadpatronen, technologie en regelgeving kunnen wijzigen, waardoor de werkelijke resultaten kunnen en zullen afwijken van de in dit document gepresenteerde inschattingen. '+

// PDF / print
// ---------------------------------------------------------------------------
(function(){
  var btn=document.getElementById('fdpdf-save');
  async function genPdf(){
    if(!window.jspdf||!window.html2canvas) throw new Error('PDF-bibliotheken niet geladen (internetverbinding?)');
    var pages=document.querySelectorAll('.a4');
    var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    for(var i=0;i<pages.length;i++){
      var canvas=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      var img=canvas.toDataURL('image/jpeg',0.92);
      var hh=canvas.height*210/canvas.width;
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,210,hh>297?297:hh);
    }
    return pdf;
  }
  btn.onclick=async function(){
    btn.disabled=true; var orig=btn.textContent; btn.textContent='⏳ PDF…';
    try{ var pdf=await genPdf(); pdf.save('Betalend_laadplein_rapport'+(PID?'_'+PID:'')+'.pdf'); }
    catch(e){ alert('PDF maken lukte niet: '+e.message); }
    finally{ btn.disabled=false; btn.textContent=orig; }
  };
})();
