<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergieKompas — Fluctus</title>
<!-- energiekompas.html v0.1.0 (2026-08-26) — HOLDING-pagina. De volledige EnergieKompas-schil
     (één invoer/resultaat-systeem, modus particulier|bedrijf, thema per partner) is Fase 4.
     Deze pagina bestaat nu enkel zodat de portaal-tegel (partnermanager ziet ENKEL EnergieKompas)
     niet in een 404 loopt. Additief: geen data, geen gate. Vervang volledig in Fase 4. -->
<style>
  :root{ --navy:#1F3864; --navy2:#12315E; --ink:#2A3140; --muted:#5A6577; --bg:#F4F7FB; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        color:var(--ink); background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:#fff; border:1px solid #dbe3ef; border-radius:16px; box-shadow:0 18px 50px rgba(18,49,94,.10);
         max-width:560px; width:100%; padding:38px 34px; text-align:center; }
  .ico{ font-size:46px; line-height:1; }
  h1{ color:var(--navy); font-size:26px; margin:14px 0 6px; letter-spacing:.2px; }
  .lead{ color:var(--muted); font-size:15px; margin:0 0 22px; }
  .modes{ display:flex; gap:12px; justify-content:center; margin:22px 0 8px; flex-wrap:wrap; }
  .mode{ flex:1; min-width:170px; border:1.5px solid #e1e8f2; border-radius:12px; padding:16px 14px; background:#fbfdff; }
  .mode b{ display:block; color:var(--navy); font-size:15px; margin-bottom:4px; }
  .mode span{ color:var(--muted); font-size:12.5px; }
  .badge{ display:inline-block; margin-top:20px; background:var(--navy); color:#fff; font-size:12.5px; font-weight:600;
          border-radius:999px; padding:7px 16px; }
  .partner{ margin-top:16px; color:var(--muted); font-size:12.5px; }
  .partner b{ color:var(--navy2); }
  a.back{ display:inline-block; margin-top:22px; color:var(--navy2); font-size:13px; text-decoration:none; font-weight:600; }
  a.back:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="ico">🔆</div>
    <h1>EnergieKompas</h1>
    <p class="lead">Uw energie-advies in één schil.</p>
    <div class="modes">
      <div class="mode"><b>Particulier</b><span>Thuis: PV, batterij en laden slim afstemmen op uw verbruik.</span></div>
      <div class="mode"><b>Bedrijf</b><span>Rendement, besparing en investeringsadvies voor uw site.</span></div>
    </div>
    <div class="badge">Wordt afgewerkt — binnenkort beschikbaar</div>
    <div class="partner" id="partner-lijn"></div>
    <a class="back" href="/portal.html">← Terug naar Mijn Fluctus</a>
  </div>
  <script>
    // Toont, indien de schil met ?partner=... geopend wordt, de partnernaam (louter cosmetisch).
    try{
      var p = new URLSearchParams(location.search).get('partner');
      if(p){ document.getElementById('partner-lijn').innerHTML = 'Partner: <b>'+String(p).replace(/[<>&]/g,'')+'</b>'; }
    }catch(e){}
  </script>
</body>
</html>
