<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groeipad laadproject — Energie-Compas</title>
<link rel="icon" href="/favicon-ec-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<!-- ek-groeipad.html v1.0.0 (2026-11-26, Johan): GROEIPAD Y1–Y4 OP ÉÉN A4 — de vier gekoppelde Energie-Compas-dossiers van een
     Betere Lader-laadproject (Y1 = nu, Y2 = over 1 jaar, Y3 = over 2 jaar, Y4 = over 3 jaar; server ≥ 15.479.0) in kolommen naast
     elkaar: wagens, aansluiting, batterij, zonnepanelen, AC- en DC-laadpunten van de gekozen configuratie + de KPI's. Bron:
     GET /api/ek/groeipad/:token (samenvatting die elk Y-dossier bewaart zodra het een resultaat toont). Nog niet berekend → link. -->
<style>
  :root{ --navy:#1F3864; --ink:#14203a; --acc:#05B050; --acc-l:#EAF7EF; --muted:#5A6577; --lijn:#E3E8EF; --oranje:#B45309; --oranje-l:#FFF4E5; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:#e9edf2;font-size:11px;line-height:1.4}
  h1,h2{font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.005em}
  .a4{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:11mm 12mm 9mm;box-shadow:0 4px 24px rgba(15,23,42,.12);display:flex;flex-direction:column}
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{ html,body{background:#fff!important} .a4{margin:0 auto!important;box-shadow:none;zoom:.94} #bar{display:none!important} }
  @media (max-width:820px){ .a4{width:100%;min-height:0;margin:0;padding:16px} }
  #bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:8px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12)}
  #bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:var(--navy);color:#fff;cursor:pointer}
  .kop{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--acc);padding-bottom:7px;margin-bottom:10px}
  .kop img{height:30px}
  .kop .ey{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}
  h1{font-size:19px;line-height:1.2;margin:0 0 3px;color:var(--navy)}
  .lead{font-size:11.5px;color:var(--muted);margin:0 0 12px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
  th,td{padding:5px 7px;border-bottom:1px solid var(--lijn);vertical-align:top}
  thead th{background:var(--navy);color:#fff;text-align:center;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;border-bottom:0}
  thead th:first-child{background:transparent}
  thead th small{display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;font-size:9.5px;opacity:.85}
  thead th.hu{background:var(--acc)}
  thead th:nth-child(2){border-top-left-radius:10px} thead th:last-child{border-top-right-radius:10px}
  td{text-align:center;font-variant-numeric:tabular-nums}
  td.l{text-align:left;color:var(--muted);font-weight:600;white-space:nowrap}
  tr.grp td{background:#F4F7FB;color:var(--navy);font-weight:800;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;border-bottom:0;padding-top:8px}
  td.hu{background:var(--acc-l)}
  td.leeg{color:#9AA4B2;font-style:italic}
  .ms{display:inline-block;font-size:9px;font-weight:800;padding:0 5px;border-radius:999px;background:var(--oranje-l);color:var(--oranje);margin-left:3px}
  .ls{display:inline-block;font-size:9px;font-weight:800;padding:0 5px;border-radius:999px;background:var(--acc-l);color:#05803C;margin-left:3px}
  a{color:var(--navy)}
  .noot{margin-top:12px;font-size:9.5px;color:var(--muted);line-height:1.5}
  .fout{max-width:640px;margin:40px auto;padding:20px;background:#fff;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<div id="bar"><button type="button" onclick="window.print()">Bewaar als PDF of druk af</button></div>
<div id="app"><div class="fout">Groeipad laden…</div></div>
<script>
(function(){
  var API='https://lucid-amazement-production.up.railway.app';
  var q=new URLSearchParams(location.search), tok=q.get('case')||'';
  function e(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
  function nf(v,d){ if(v==null||!isFinite(v)) return null; return (+v).toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
  function eur(v){ if(v==null||!isFinite(v)) return null; var a=Math.abs(v); var t=a>=10000?('€ '+nf(Math.round(a/100)/10,1)+'k'):('€ '+nf(a)); return (v<0?'− ':'')+t; }
  var RIJ=[
    ['grp','Configuratie'],
    ['Wagens', function(s,j){ return nf(s?s.ev:j.wagens); }],
    ['Aansluiting', function(s){ if(!s||s.aansluiting_kw==null) return null; return nf(s.aansluiting_kw)+' kVA'+(s.spanning?'<span class="'+(s.spanning==='MS'?'ms':'ls')+'">'+s.spanning+'</span>':''); }, true],
    ['Verzwaring (eenmalig)', function(s){ return s?(s.verzwaring_eur>0?eur(s.verzwaring_eur):'geen'):null; }],
    ['Batterij', function(s){ return s?(s.batt_kw>0?(nf(s.batt_kw)+' kW / '+nf(s.batt_kwh)+' kWh'):'geen'):null; }],
    ['Zonnepanelen', function(s){ return s?(s.pv_kwp>0?(nf(s.pv_kwp)+' kWp'):'geen'):null; }],
    ['AC-laadpunten', function(s){ return (s&&s.ac!=null)?nf(s.ac):null; }],
    ['DC-laadpunten', function(s){ return (s&&s.dc!=null)?nf(s.dc):null; }],
    ['grp','KPI’s'],
    ['Investering PV + batterij', function(s){ return s?eur(s.investering_pvbatt):null; }],
    ['Totale investering', function(s){ return s?eur(s.investering_totaal):null; }],
    ['Besparing per jaar', function(s){ return s?eur(s.besparing):null; }],
    ['Terugverdientijd', function(s){ return (s&&s.tvt!=null)?(nf(s.tvt,1)+' jaar'):null; }],
    ['Rendement', function(s){ return (s&&s.rendement!=null)?(nf(s.rendement)+' %'):null; }],
    ['Jaarkost na installatie', function(s){ return s?eur(s.factuur_na):null; }],
    ['Kost per MWh, alle verbruik', function(s){ return (s&&s.kost_mwh!=null)?('€ '+nf(s.kost_mwh)):null; }],
    ['Piekverbruik', function(s){ return (s&&s.piek_kva!=null)?(nf(s.piek_kva)+' kVA'):null; }],
    ['Loadfactor', function(s){ return (s&&s.loadfactor!=null)?(nf(s.loadfactor)+' %'):null; }],
    ['Km-dekking', function(s){ return (s&&s.kmdekking!=null)?(nf(s.kmdekking)+' %'):null; }],
    ['Energiekost per 100 km', function(s){ return (s&&s.km100!=null)?('€ '+nf(s.km100,1)):null; }]
  ];
  var MOD={ advies:'ons advies', keuze:'je keuze', offerte:'gekozen offerte' };
  function toon(j){
    var J=j.jaren||[], P=j.project||{};
    if(!J.length){ document.getElementById('app').innerHTML='<div class="fout">Dit dossier hoort niet bij een groeipad (geen gekoppelde jaren Y1–Y4).</div>'; return; }
    var d=new Date(), dat=d.toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'});
    var h='<div class="a4"><div class="kop"><img src="/apps/ec-logo.png" alt="Energie-Compas"><div class="ey">Groeipad laadproject · '+e(dat)+'</div></div>';
    h+='<h1>Groeipad '+e(J[0].jaar)+'–'+e(J[J.length-1].jaar)+(P.naam?(' · '+e(P.naam)):'')+'</h1>';
    h+='<p class="lead">'+(P.adres?e(P.adres)+' · ':'')+'Per jaar de gekozen configuratie (aansluiting, batterij, zonnepanelen, laadpunten) en wat ze oplevert. Elk jaar is een eigen Energie-Compas-dossier met de wagens van dat jaar.</p>';
    h+='<table><thead><tr><th></th>'+J.map(function(x){ return '<th class="'+(x.huidig?'hu':'')+'">'+e(x.jaar)+'<small>'+e(x.label)+(x.project_id?' · '+e(x.project_id):'')+'</small></th>'; }).join('')+'</tr></thead><tbody>';
    RIJ.forEach(function(r){
      if(r[0]==='grp'){ h+='<tr class="grp"><td colspan="'+(J.length+1)+'">'+e(r[1])+'</td></tr>'; return; }
      h+='<tr><td class="l">'+e(r[0])+'</td>'+J.map(function(x){ var s=x.samenvatting, v=null; try{ v=r[1](s,x); }catch(er){}
        if(v==null) return '<td class="leeg'+(x.huidig?' hu':'')+'">–</td>';
        return '<td class="'+(x.huidig?'hu':'')+'">'+(r[2]?v:e(v))+'</td>'; }).join('')+'</tr>';
    });
    h+='<tr><td class="l">Basis</td>'+J.map(function(x){ var s=x.samenvatting;
      if(!s) return '<td class="leeg'+(x.huidig?' hu':'')+'">nog niet berekend<br><a href="'+e(x.ek_link)+'&adv=1" target="_blank" rel="noopener">open '+e(x.jaar)+'</a></td>';
      var t=new Date(s.ts||0); return '<td class="'+(x.huidig?'hu':'')+'" style="font-size:9.5px;color:var(--muted)">'+e(MOD[s.modus]||'ons advies')+(s.exact?'':' (geschat)')+'<br>'+e(t.toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit'}))+' · <a href="'+e(x.ek_link)+'&adv=1" target="_blank" rel="noopener">open</a></td>'; }).join('')+'</tr>';
    h+='</tbody></table>';
    h+='<div class="noot">Y1 = nu, Y2 = over 1 jaar, Y3 = over 2 jaar, Y4 = over 3 jaar (wagens uit het laadplan van Betere Lader). Elke kolom toont de configuratie die in dat dossier laatst getoond werd (ons advies, je keuze in het rooster of een gekozen offerte). Aansluiting = het toegangsvermogen dat die configuratie nodig heeft; LS tot 80 kVA, daarboven MS.</div>';
    h+='</div>';
    document.getElementById('app').innerHTML=h;
    if(P.naam) document.title='Groeipad · '+P.naam;
  }
  if(!tok){ document.getElementById('app').innerHTML='<div class="fout">Geen dossier opgegeven.</div>'; return; }
  fetch(API+'/api/ek/groeipad/'+encodeURIComponent(tok)).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||'fout'); toon(j);
  }).catch(function(er){ document.getElementById('app').innerHTML='<div class="fout">Het groeipad kon niet geladen worden ('+e(er.message)+').</div>'; });
})();
</script>
</body>
</html>
