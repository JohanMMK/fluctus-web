<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV-scouting · Energie-Compas</title>
<!-- scouting.html v1.1.0 (2026-11-26, Johan): tab Agent-runs — agent AAN/UIT en zoekintensiteit (Licht ±15 · Normaal ±40 · Grondig ±80 pagina’s, max. pagina’s per run instelbaar); runs tonen het niveau of «⏸ uitgezet». Server ≥ 15.476.0. -->
<!-- scouting.html v1.0.0 (2026-11-24, Johan): tegel «🔎 EV-scouting» (server ≥ 15.469.0). Tabs Dashboard · Leads · Kanalen & concurrenten · Agent-runs · Import.
     De scouting-agent schrijft via window.api('/api/scouting/…') in een tabblad van deze pagina. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/mijnec-knop.js?v=1.0.1"></script>
<style>
  :root{--navy:#1F3864;--green:#05B050;--line:#D6E0EC;--muted:#6B7689;--bg:#F4F7FB;--amber:#B45309}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1A1F2B}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{color:var(--navy);font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px}
  main{max-width:1500px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px} .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;color:var(--navy);cursor:pointer} .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px} .kpis div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .kpis b{display:block;font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums} .kpis span{font-size:12px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px} .card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .bar input[type=search],.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff} .bar input[type=search]{flex:1;min-width:200px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--navy);font-weight:600} .btn.p{background:var(--green);border-color:var(--green);color:#fff} .btn.r{color:#8a1f1f}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%} th,td{padding:7px 9px;border-bottom:1px solid #EEF2F7;text-align:left;vertical-align:top;font-size:13px}
  thead th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
  td select,td input{font:inherit;font-size:12.5px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:150px}
  .sub{color:var(--muted);font-size:12px} .pr{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:800;color:#fff;padding:0 6px}
  .pA{background:#B42318}.pB{background:#E8A33D}.pC{background:#9AA7B8}
  .trech{display:flex;flex-direction:column;gap:6px} .trech .r{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font-size:13px} .trech .b{height:14px;border-radius:4px;background:var(--navy)}
  .flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .flow div{flex:1;min-width:120px;background:#F4F7FB;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center} .flow b{display:block;font-size:22px;color:var(--navy)}
  .det td{background:#FBFCFE} .det textarea{width:100%;min-height:70px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .det .kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px} .det .kv b{color:var(--muted);font-weight:600}
  .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px} .state{color:var(--muted);padding:20px} .ok{color:#0a7d3c}
  textarea.imp{width:100%;min-height:200px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:12.5px/1.4 ui-monospace,Menlo,monospace}
  .lst div{padding:6px 0;border-bottom:1px solid #EEF2F7;font-size:13px}
  a{color:#2a44a8}
  .sw{position:relative;display:inline-block;width:46px;height:26px;vertical-align:middle} .sw input{opacity:0;width:0;height:0} .sw i{position:absolute;inset:0;background:#C9D3DF;border-radius:999px;transition:.15s;cursor:pointer} .sw i:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s} .sw input:checked+i{background:var(--green)} .sw input:checked+i:before{transform:translateX(20px)}
  .niv{display:flex;gap:8px;flex-wrap:wrap} .niv label{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff} .niv label.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,56,100,.15)} .niv b{color:var(--navy)}
  tr.skip td{color:var(--muted);background:#FAFAFB}
</style>
</head>
<body>
<header><b>🔎 EV-scouting</b><span class="sub">bedrijven die elektrische wagens kopen → «Kunnen we het laden?» · flow Betere Lader 1 → Betere Lader 2 → Energie-Compas 1</span><span class="who" id="who"></span><a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a></header>
<main><div class="tabs" id="tabs"></div><div id="root"><div class="state">Laden…</div></div></main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var CFG=null, sb=null, SESSION=null, PROXY='', DATA=null, TAB='dash', F={q:'',prio:'',status:'',type:'',flow:''}, OPEN={};
  try{ TAB=localStorage.getItem('SC_TAB')||'dash'; }catch(e){}
  function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function dt(ts){ var d=new Date(+ts); if(isNaN(d.getTime())) return '—'; function p(n){return (n<10?'0':'')+n;} return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  async function authHeaders(){
    var tok=SESSION&&SESSION.access_token;
    try{ if(sb){ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session){ SESSION=d.data.session; tok=SESSION.access_token; } } }catch(e){}
    return { 'Authorization':'Bearer '+tok };
  }
  // API-helper — ook voor de scouting-agent: await api('/api/scouting') · await api('/api/scouting/leads',{bron:'agent',leads:[…]})
  window.api=async function(pad, body){
    var h=await authHeaders(); var o={ headers:h, cache:'no-store' };
    if(body!==undefined){ o.method='POST'; h['Content-Type']='application/json'; o.body=JSON.stringify(body); }
    var r=await fetch(PROXY+pad+(body===undefined?(pad.indexOf('?')>=0?'&':'?')+'cb='+Date.now():''), o);
    var j=await r.json().catch(function(){ return {}; });
    if(!r.ok||j.ok===false){ var e=new Error(j.error||('status '+r.status)); e.status=r.status; throw e; }
    if(j.leads){ DATA=j; try{ render(); }catch(eR){} }
    return j;
  };
  var TABS=[['dash','📊 Dashboard'],['leads','🏢 Leads'],['kan','🤝 Kanalen & concurrenten'],['runs','🤖 Agent-runs'],['imp','📥 Import']];
  function tabs(){ $('tabs').innerHTML=TABS.map(function(t){ return '<button type="button" data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+(t[0]==='leads'&&DATA?' ('+DATA.leads.length+')':'')+'</button>'; }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){ b.onclick=function(){ TAB=b.getAttribute('data-t'); try{ localStorage.setItem('SC_TAB',TAB); }catch(e){} render(); }; }); }
  function pr(p){ return p?'<span class="pr p'+esc(p)+'">'+esc(p)+'</span>':''; }
  function opts(lijst, v, leeg){ return (leeg!=null?'<option value="">'+esc(leeg)+'</option>':'')+lijst.map(function(x){ return '<option'+(x===v?' selected':'')+' value="'+esc(x)+'">'+esc(x||'—')+'</option>'; }).join(''); }
  function render(){ if(!DATA) return; tabs(); var R=$('root');
    if(TAB==='dash') R.innerHTML=dash(); else if(TAB==='leads'){ R.innerHTML=leads(); bindLeads(); } else if(TAB==='kan'){ R.innerHTML=kanalen(); bindKan(); } else if(TAB==='runs'){ R.innerHTML=runs(); bindRuns(); } else { R.innerHTML=imp(); bindImp(); } }
  function dash(){ var K=DATA.kpi||{}, L=DATA.leads, S=DATA.keuzes.status, ps=K.per_status||{}, mx=Math.max(1,Math.max.apply(null,S.map(function(s){ return ps[s]||0; })));
    var lr=K.laatste_run;
    var h='<div class="kpis"><div><b>'+(K.totaal||0)+'</b><span>leads</span></div><div><b>'+(K.nieuw_week||0)+'</b><span>nieuw deze week</span></div><div><b>'+(K.open_a||0)+'</b><span>open A-leads</span></div>'+
      '<div><b>'+((ps['Interesse']||0)+(ps['Overgedragen']||0))+'</b><span>interesse + overgedragen</span></div><div><b>'+(K.kanalen||0)+'</b><span>kanalen & concurrenten</span></div><div><b>'+(lr?dt(lr.ts):'—')+'</b><span>laatste agent-run'+(lr?' · '+lr.nieuw+' nieuw':'')+(DATA.profiel?(DATA.profiel.actief?' · agent aan ('+esc(DATA.profiel.label)+')':' · <b style="color:#8a1f1f">agent uit</b>'):'')+'</span></div></div>';
    h+='<div class="grid2"><div class="card"><h3>Trechter per status</h3><div class="trech">'+S.map(function(s){ var n=ps[s]||0; return '<div class="r"><span>'+esc(s)+'</span><div class="b" style="width:'+Math.max(2,Math.round(n/mx*100))+'%;opacity:'+(n?1:.25)+'"></div><b>'+n+'</b></div>'; }).join('')+'</div></div>';
    var pf=K.per_flow||{}; h+='<div class="card"><h3>Flow</h3><div class="flow">'+['Betere Lader 1','Betere Lader 2','Energie-Compas 1'].map(function(f,i){ return (i?'<span>→</span>':'')+'<div><b>'+(pf[f]||0)+'</b>'+esc(f)+'</div>'; }).join('')+'</div>'+
      '<div class="sub" style="margin-top:8px">Per prio: '+['A','B','C'].map(function(p){ return pr(p)+' '+((K.per_prio||{})[p]||0); }).join(' &nbsp; ')+'</div></div></div>';
    var oa=L.filter(function(l){ return l.prio==='A' && (l.status||'Te benaderen')==='Te benaderen'; });
    h+='<div class="grid2"><div class="card"><h3>Open A-leads</h3><div class="lst">'+(oa.length?oa.map(function(l){ return '<div>'+pr('A')+' <b>'+esc(l.bedrijf)+'</b> <span class="sub">'+esc(l.regio||'')+' · '+esc(l.type||'')+'</span><br><span class="sub">'+esc((l.signaal||'').slice(0,160))+'</span></div>'; }).join(''):'<div class="sub">Geen open A-leads.</div>')+'</div></div>';
    h+='<div class="card"><h3>Laatste acties</h3><div class="lst">'+((DATA.acties||[]).slice(-15).reverse().map(function(a){ return '<div><span class="sub">'+esc(dt(a.ts))+' · '+esc(a.wie||'')+'</span><br><b>'+esc(a.soort)+'</b> '+esc(a.bedrijf||'')+(a.detail?' <span class="sub">— '+esc(a.detail)+'</span>':'')+'</div>'; }).join('')||'<div class="sub">Nog niets.</div>')+'</div></div></div>';
    return h; }
  function gefilterd(){ var q=F.q.toLowerCase(); return DATA.leads.filter(function(l){
      if(F.prio&&l.prio!==F.prio) return false; if(F.status&&(l.status||'')!==F.status) return false; if(F.flow&&(l.flow||'')!==F.flow) return false; if(F.type&&(l.type||'')!==F.type) return false;
      if(q){ var t=[l.bedrijf,l.regio,l.signaal,l.type,l.eigenaar,l.notitie,l.route].join(' ').toLowerCase(); if(t.indexOf(q)<0) return false; } return true; })
    .sort(function(a,b){ return (a.prio||'Z').localeCompare(b.prio||'Z') || (+b.ts||0)-(+a.ts||0); }); }
  function leads(){ var K=DATA.keuzes, types=[]; DATA.leads.forEach(function(l){ if(l.type&&types.indexOf(l.type)<0) types.push(l.type); });
    var L=gefilterd();
    var h='<div class="bar"><input type="search" id="f-q" placeholder="Zoek bedrijf, regio, signaal…" value="'+esc(F.q)+'">'+
      '<select id="f-prio">'+opts(K.prio,F.prio,'Alle prio')+'</select><select id="f-status">'+opts(K.status,F.status,'Alle status')+'</select>'+
      '<select id="f-flow">'+opts(K.flow.filter(Boolean),F.flow,'Alle flow')+'</select><select id="f-type">'+opts(types,F.type,'Alle types')+'</select>'+
      '<button class="btn" id="b-csv" type="button">⬇ CSV</button><button class="btn p" id="b-nieuw" type="button">+ Lead</button><span class="sub" id="l-st"></span></div>';
    h+='<div class="wrap"><table><thead><tr><th>Prio</th><th>Bedrijf</th><th>Type</th><th>Regio</th><th>Signaal</th><th>Status</th><th>Flow</th><th>Eigenaar</th><th>Gevonden</th><th></th></tr></thead><tbody>';
    L.forEach(function(l){ h+='<tr><td><select data-id="'+esc(l.id)+'" data-k="prio">'+opts(K.prio,l.prio)+'</select></td><td><b>'+esc(l.bedrijf)+'</b>'+(l.bron?'<br><a href="'+esc(l.bron)+'" target="_blank" rel="noopener" class="sub">'+esc(l.bron_label||'bron')+'</a>':'')+'</td>'+
        '<td>'+esc(l.type||'')+'</td><td>'+esc(l.regio||'')+'</td><td class="sub" style="max-width:320px">'+esc((l.signaal||'').slice(0,180))+'</td>'+
        '<td><select data-id="'+esc(l.id)+'" data-k="status">'+opts(K.status,l.status||'Te benaderen')+'</select></td><td><select data-id="'+esc(l.id)+'" data-k="flow">'+opts(K.flow,l.flow||'')+'</select></td>'+
        '<td><input data-id="'+esc(l.id)+'" data-k="eigenaar" value="'+esc(l.eigenaar||'')+'" placeholder="wie?"></td><td class="sub">'+esc(l.gevonden||'')+'</td>'+
        '<td style="white-space:nowrap"><button class="btn" type="button" data-det="'+esc(l.id)+'">'+(OPEN[l.id]?'▲':'Details')+'</button></td></tr>';
      if(OPEN[l.id]) h+='<tr class="det"><td colspan="10"><div class="grid2"><div class="kv"><b>Route</b><span>'+esc(l.route||'—')+'</span><b>Signaal</b><span style="white-space:pre-wrap">'+esc(l.signaal||'—')+'</span><b>Contact</b><span>'+esc(l.contact||'—')+'</span><b>Bron</b><span>'+(l.bron?'<a href="'+esc(l.bron)+'" target="_blank" rel="noopener">'+esc(l.bron_label||l.bron)+'</a>':'—')+'</span><b>Toegevoegd</b><span>'+esc(dt(l.ts))+' · '+esc(l.bron_toegevoegd||'')+'</span></div>'+
        '<div><div class="sub">Conceptbericht</div><textarea data-id="'+esc(l.id)+'" data-k="bericht">'+esc(l.bericht||'')+'</textarea><div class="sub" style="margin-top:6px">Notitie</div><textarea data-id="'+esc(l.id)+'" data-k="notitie">'+esc(l.notitie||'')+'</textarea>'+
        '<div class="bar" style="margin-top:6px"><button class="btn" type="button" data-kop="'+esc(l.id)+'">📋 Kopieer bericht</button><button class="btn r" type="button" data-del="'+esc(l.id)+'">🗑 Verwijderen</button></div></div></div></td></tr>';
    });
    if(!L.length) h+='<tr><td colspan="10" class="sub">Geen leads'+(DATA.leads.length?' voor deze filter':' — importeer of laat de agent lopen')+'.</td></tr>';
    return h+'</tbody></table></div>'; }
  async function bewaar(id, k, v){ var st=$('l-st'); try{ if(st){ st.className='sub'; st.textContent='⏳'; } var b={id:id}; b[k]=v; await api('/api/scouting/lead', b); var s2=$('l-st'); if(s2){ s2.className='sub ok'; s2.textContent='✔ bewaard'; } }
    catch(e){ var s3=$('l-st'); if(s3){ s3.className='sub'; s3.style.color='#8a1f1f'; s3.textContent='Lukte niet: '+e.message; } } }
  function bindLeads(){ var R=$('root');
    $('f-q').oninput=function(){ F.q=this.value; var p=this.selectionStart; render(); var i=$('f-q'); i.focus(); try{ i.setSelectionRange(p,p); }catch(e){} };
    ['prio','status','flow','type'].forEach(function(k){ $('f-'+k).onchange=function(){ F[k]=this.value; render(); }; });
    Array.prototype.forEach.call(R.querySelectorAll('select[data-id],input[data-id],textarea[data-id]'),function(x){ x.onchange=function(){ bewaar(x.getAttribute('data-id'), x.getAttribute('data-k'), x.value); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-det]'),function(b){ b.onclick=function(){ var id=b.getAttribute('data-det'); OPEN[id]=!OPEN[id]; render(); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-kop]'),function(b){ b.onclick=function(){ var l=DATA.leads.filter(function(x){ return x.id===b.getAttribute('data-kop'); })[0]; try{ navigator.clipboard.writeText((l&&l.bericht)||''); b.textContent='✔ Gekopieerd'; }catch(e){} }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-del]'),function(b){ b.onclick=async function(){ var id=b.getAttribute('data-del'), l=DATA.leads.filter(function(x){ return x.id===id; })[0]; if(!confirm('Lead «'+(l&&l.bedrijf)+'» verwijderen?')) return; try{ await api('/api/scouting/lead',{id:id,verwijder:true}); }catch(e){ alert('Lukte niet: '+e.message); } }; });
    $('b-nieuw').onclick=async function(){ var n=prompt('Bedrijfsnaam van de nieuwe lead:'); if(!n||!n.trim()) return; try{ var j=await api('/api/scouting/lead',{bedrijf:n.trim()}); if(j.lead) OPEN[j.lead.id]=true; render(); }catch(e){ alert('Lukte niet: '+e.message); } };
    $('b-csv').onclick=function(){ var K=['bedrijf','prio','type','regio','status','flow','eigenaar','signaal','route','bericht','bron','bron_label','contact','gevonden','notitie'];
      var c=function(v){ v=String(v==null?'':v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
      var txt='﻿'+K.join(';')+'\n'+gefilterd().map(function(l){ return K.map(function(k){ return c(l[k]); }).join(';'); }).join('\n');
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='ev-scouting_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove(); };
  }
  function kanalen(){ var L=DATA.kanalen.slice().sort(function(a,b){ return (a.type||'').localeCompare(b.type||'')||(a.partij||'').localeCompare(b.partij||''); });
    var h='<div class="card"><h3>Kanaal of concurrent toevoegen</h3><div class="bar"><select id="k-type"><option>Kanaal</option><option>Concurrent</option></select><input type="search" id="k-partij" placeholder="Partij"><input type="search" id="k-waarom" placeholder="Waarom / gezien"><input type="search" id="k-bron" placeholder="Bron (link)"><button class="btn p" id="k-go" type="button">Toevoegen</button><span class="sub" id="k-st"></span></div></div>';
    h+='<div class="wrap"><table><thead><tr><th>Type</th><th>Partij</th><th>Gezien</th><th>Waarom</th><th>Contact</th><th>Bron</th><th></th></tr></thead><tbody>'+
      (L.map(function(k){ return '<tr><td>'+esc(k.type)+'</td><td><b>'+esc(k.partij)+'</b></td><td class="sub">'+esc(k.gezien||'')+'</td><td class="sub">'+esc(k.waarom||'')+'</td><td>'+esc(k.contact||'')+'</td><td>'+(k.bron?'<a href="'+esc(k.bron)+'" target="_blank" rel="noopener">link</a>':'')+'</td><td><button class="btn r" type="button" data-kdel="'+esc(k.id)+'">🗑</button></td></tr>'; }).join('')||'<tr><td colspan="7" class="sub">Nog geen kanalen of concurrenten.</td></tr>')+'</tbody></table></div>';
    return h; }
  function bindKan(){ $('k-go').onclick=async function(){ var p=$('k-partij').value.trim(); if(!p) return; try{ var j=await api('/api/scouting/kanalen',{kanalen:[{type:$('k-type').value,partij:p,waarom:$('k-waarom').value,bron:$('k-bron').value}]}); }catch(e){ $('k-st').textContent='Lukte niet: '+e.message; } };
    Array.prototype.forEach.call($('root').querySelectorAll('[data-kdel]'),function(b){ b.onclick=async function(){ if(!confirm('Verwijderen?')) return; try{ await api('/api/scouting/kanalen',{verwijder:b.getAttribute('data-kdel')}); }catch(e){ alert(e.message); } }; }); }
  // v1.1.0 (Johan 26-11): agent aan/uit + zoekintensiteit (server ≥ 15.476.0). De agent leest DATA.profiel bij elke start.
  function agentKaart(){ var I=DATA.instellingen||{}, P=DATA.profiel||{}, N=DATA.niveaus||[]; if(!N.length) return '<div class="card sub">Instellingen vragen server ≥ 15.476.0.</div>';
    var nv=P.niveau||'normaal', std=(N.filter(function(n){ return n.k===nv; })[0]||{}).max_paginas;
    return '<div class="card"><h3>Scouting-agent</h3><div class="bar" style="gap:12px"><label class="sw"><input type="checkbox" id="a-aan"'+(P.actief?' checked':'')+'><i></i></label>'+
      '<b style="color:'+(P.actief?'var(--green)':'#8a1f1f')+'">'+(P.actief?'Agent staat AAN':'Agent staat UIT')+'</b><span class="sub">'+(P.actief?'zoekt bij de volgende geplande run':'een geplande run slaat over en meldt «uitgezet»')+'</span></div>'+
      '<div class="sub" style="margin:4px 0 6px">Hoe hard zoeken?</div><div class="niv">'+N.map(function(n){ return '<label class="'+(n.k===nv?'on':'')+'"><input type="radio" name="a-niv" value="'+esc(n.k)+'"'+(n.k===nv?' checked':'')+'> <b>'+esc(n.label)+'</b><div class="sub">'+esc(n.uitleg)+'</div></label>'; }).join('')+'</div>'+
      '<div class="bar" style="margin-top:10px"><span class="sub">Max. pagina’s per run</span><input type="number" id="a-max" min="5" max="120" step="5" value="'+(I.max_paginas||'')+'" placeholder="'+(std||'')+' (standaard)" style="width:130px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit">'+
      '<span class="sub">nu: <b>'+(P.max_paginas||'—')+'</b> · vacatures '+esc(P.vacatures_periode||'')+' · dealers: '+esc(P.dealers||'')+'</span><span class="sub" id="a-st"></span></div>'+
      '<div class="sub">Zoektermen: '+esc((P.zoektermen||[]).join(' · '))+'</div>'+
      (I.gewijzigd_ts?'<div class="sub" style="margin-top:4px">Laatst gewijzigd '+esc(dt(I.gewijzigd_ts))+' door '+esc(I.gewijzigd_door||'?')+'</div>':'')+'</div>'; }
  function bindRuns(){ var st=function(t,ok){ var e=$('a-st'); if(e){ e.textContent=t; e.style.color=ok?'#0a7d3c':'#8a1f1f'; } };
    var zet=async function(b){ try{ await api('/api/scouting/instellingen',b); TAB='runs'; render(); st('✔ bewaard',true); }catch(e){ st('Lukte niet: '+e.message); } };
    var a=$('a-aan'); if(a) a.onchange=function(){ zet({actief:a.checked}); };
    Array.prototype.forEach.call($('root').querySelectorAll('input[name=a-niv]'),function(r){ r.onchange=function(){ zet({niveau:r.value}); }; });
    var m=$('a-max'); if(m) m.onchange=function(){ var v=m.value.trim(); zet({max_paginas:(v===''?null:+v)}); }; }
  function runs(){ var L=(DATA.runs||[]).slice().reverse();
    return agentKaart()+'<div class="wrap"><table><thead><tr><th>Wanneer</th><th>Door</th><th>Niveau</th><th>Pagina’s</th><th>Nieuw</th><th>Samenvatting</th><th>Problemen</th><th>Zoektermen</th></tr></thead><tbody>'+
      (L.map(function(r){ return '<tr'+(r.overgeslagen?' class="skip"':'')+'><td>'+esc(dt(r.ts))+'</td><td>'+esc(r.wie||'')+'</td><td>'+(r.overgeslagen?'⏸ uitgezet':esc(r.niveau||''))+'</td><td>'+(r.paginas||0)+'</td><td><b>'+(r.nieuw||0)+'</b></td><td style="white-space:pre-wrap;max-width:420px">'+esc(r.samenvatting||'')+'</td><td class="sub" style="white-space:pre-wrap">'+esc(r.problemen||'')+'</td><td class="sub">'+esc((r.zoektermen||[]).join(', '))+'</td></tr>'; }).join('')||'<tr><td colspan="8" class="sub">Nog geen runs van de scouting-agent.</td></tr>')+'</tbody></table></div>'; }
  function imp(){ return '<div class="card"><h3>Leads importeren</h3><div class="sub">Plak uit Excel/Sheets met de koprij (kolommen o.a. bedrijf, prio, type, regio, signaal, route, bericht, bron, bron_label, gevonden, status, flow, eigenaar) — of JSON: een lijst leads, of {leads:[…], kanalen:[…]}. Dubbels (zelfde bedrijfsnaam) worden overgeslagen.</div>'+
      '<textarea class="imp" id="i-txt" placeholder="bedrijf&#9;prio&#9;regio&#9;signaal…"></textarea><div class="bar" style="margin-top:8px"><label class="sub"><input type="checkbox" id="i-bij"> lege velden van bestaande leads aanvullen</label><button class="btn p" id="i-go" type="button">Importeren</button><span class="sub" id="i-st"></span></div></div>'; }
  // tab-gescheiden of ;-gescheiden tekst met koprij; aanhalingstekens rond cellen met regeleinden (Excel) worden gerespecteerd
  function parseTabel(t){ var sep=(t.split('\n')[0].indexOf('\t')>=0)?'\t':(t.split('\n')[0].indexOf(';')>=0?';':','), rows=[], row=[], cel='', q=false;
    for(var i=0;i<t.length;i++){ var c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel+=c; continue; }
      if(c==='"' && cel==='') { q=true; continue; }
      if(c===sep){ row.push(cel); cel=''; continue; }
      if(c==='\r') continue;
      if(c==='\n'){ row.push(cel); rows.push(row); row=[]; cel=''; continue; }
      cel+=c; }
    if(cel!==''||row.length){ row.push(cel); rows.push(row); }
    rows=rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); }); if(rows.length<2) return [];
    var kop=rows[0].map(function(k){ return String(k).trim().toLowerCase().replace(/\s+/g,'_'); });
    return rows.slice(1).map(function(r){ var o={}; kop.forEach(function(k,i){ if(k && r[i]!=null && String(r[i]).trim()) o[k]=String(r[i]).trim(); }); return o; }); }
  function bindImp(){ $('i-go').onclick=async function(){ var t=$('i-txt').value.trim(), st=$('i-st'); if(!t) return; var leadsL=[], kanL=[];
    try{ if(/^[\[{]/.test(t)){ var j=JSON.parse(t); if(Array.isArray(j)) leadsL=j; else { leadsL=j.leads||[]; kanL=j.kanalen||[]; } } else leadsL=parseTabel(t); }catch(e){ st.textContent='Kon niet lezen: '+e.message; return; }
    leadsL=leadsL.map(function(l){ if(l.prio) l.prio=String(l.prio).trim().toUpperCase().slice(0,1); return l; });
    st.className='sub'; st.textContent='⏳ '+leadsL.length+' leads…';
    try{ var msg=[]; if(leadsL.length){ var r=await api('/api/scouting/leads',{bron:'import',leads:leadsL,bijwerken:$('i-bij').checked}); msg.push(r.nieuw+' nieuw, '+r.dubbel+' dubbel'+(r.aangevuld?', '+r.aangevuld+' aangevuld':'')+(r.fouten&&r.fouten.length?' · fouten: '+r.fouten.join('; '):'')); }
      if(kanL.length){ var k=await api('/api/scouting/kanalen',{kanalen:kanL}); msg.push('kanalen: '+k.nieuw+' nieuw, '+k.dubbel+' dubbel'); }
      TAB='imp'; render(); var s2=$('i-st'); s2.className='sub ok'; s2.textContent='✔ '+msg.join(' · '); }
    catch(e){ st.style.color='#8a1f1f'; st.textContent='Lukte niet: '+e.message; } }; }
  (async function(){
    try{
      var rc=await fetch('/api/config'); CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      try{ await api('/api/scouting'); }catch(e){ $('root').innerHTML='<div class="fout">'+(e.status===401?'Geen toegang tot de scoutingtegel (managers).':'Fout: '+esc(e.message))+'</div>'; }
    }catch(e){ $('root').innerHTML='<div class="fout">Init-fout: '+esc(e.message)+'</div>'; }
  })();
})();
</script>
