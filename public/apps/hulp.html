<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hulpvragen · Energie-Compas</title>
<!-- hulp.html v0.2.0 (2026-10-15, Johan): HULPVRAAG ALS CHAT (server ≥ 15.302.0) — per vraag «💬 Gesprek»: het hele gesprek (klant ↔ EK) + antwoordvak: ✉️ antwoord mailen (verschijnt ook in het gesprek in EK), 📞 gebeld (afsluiten), ✔ afsluiten zonder mail. Kolom «Laatste bericht»; status open = wacht op ons, een nieuw klantbericht heropent een gesprek. Knop «← Naar MijnEC». -->
<!-- hulp.html (15-10, Johan): toont «gevraagd door adviseur/manager …» als de hulpvraag uit een adviseurssessie kwam (server ≥ 15.299.0). -->
<!-- hulp.html v0.1.0 (2026-10-11, Johan): overzicht van ALLE hulpvragen (klanten + demo-bezoekers) uit het centrale register (GET /api/ek/hulp-overzicht, server ≥ 15.272.0). Per vraag: datum, klant + contact, project, reden, vraag, terugbellen, beste TVT, status (open / beantwoord / gebeld) met wacht- of antwoordtijd; links naar het project in EK (adviseursweergave, daar beantwoorden) en de projectlog. Filter open / alle + zoeken. Enkel managers. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/mijnec-knop.js?v=1.0.0"></script>
<style>
  :root{--navy:#1F3864;--green:#05B050;--line:#D6E0EC;--muted:#6B7689;--bg:#F4F7FB;--amber:#B45309}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1A1F2B}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{color:var(--navy);font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px}
  main{max-width:1500px;margin:0 auto;padding:16px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px} .kpis div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px}
  .kpis b{display:block;font-size:22px;color:var(--navy)} .kpis span{font-size:12px;color:var(--muted)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .bar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .bar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer} .bar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:8px 10px;border-bottom:1px solid #EEF2F7;text-align:left;vertical-align:top;font-size:13px}
  thead th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
  .sub{color:var(--muted);font-size:12px} .vraag{white-space:pre-wrap;max-width:420px}
  .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .st-open{background:#FFF3D6;color:var(--amber)} .st-beantwoord{background:#E6F6EC;color:#0a7d3c} .st-gebeld,.st-gesloten{background:#E8EEFF;color:#2a44a8}
  .chat{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding:4px} .bub{max-width:80%;border-radius:12px;padding:6px 10px} .bub .w{font-size:11.5px;color:var(--muted)}
  .bub.k{background:#fff;border:1px solid #E3E9F2;align-self:flex-start} .bub.e{background:#E6F6EC;align-self:flex-end} .bub.g{background:#E8EEFF;align-self:flex-end} .sys{text-align:center;font-size:12px;color:var(--muted)}
  .gesprek td{background:#FBFCFE} .gesprek textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:8px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px} .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer} .acts button.p{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .demo{display:inline-block;padding:1px 6px;border-radius:6px;background:#F3E8FF;color:#6b2fa8;font-size:11px;font-weight:700;margin-left:4px}
  a{color:#2a44a8} .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px} .state{color:var(--muted);padding:20px}
</style>
</head>
<body>
<header><b>💬 Hulpvragen</b><span class="sub">gesprekken met klanten, demo-bezoekers en adviseurs — antwoord hier of in het project (EK, adviseursweergave)</span><span class="who" id="who"></span><a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a></header>
<main><div id="root"><div class="state">Laden…</div></div></main>
<script>
  var $=function(id){return document.getElementById(id);};
  var CFG=null, sb=null, SESSION=null, PROXY='', DATA=null, ZOEK='', FILTER='open', WEB='', OPEN={}, CHAT={};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function p2(n){ return (n<10?'0':'')+n; }
  function datum(ts){ var d=new Date(+ts); if(isNaN(d.getTime())) return '—'; return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
  function duur(ms){ if(ms==null||!isFinite(ms)||ms<0) return ''; var m=Math.round(ms/60000); if(m<60) return m+' min'; var h=Math.round(m/60); if(h<48) return h+' u'; return Math.round(h/24)+' d'; }
  function render(){
    var V=DATA.vragen||[], nu=Date.now();
    var nOpen=V.filter(function(v){return v.status==='open';}).length, nBel=V.filter(function(v){return v.status==='open'&&v.terugbellen;}).length;
    var bt=V.filter(function(v){return v.beantwoord_ts&&v.ts;}).map(function(v){return v.beantwoord_ts-v.ts;}).sort(function(a,b){return a-b;});
    var med=bt.length?bt[Math.floor(bt.length/2)]:null;
    var rij=V.filter(function(v){ if(FILTER==='open'&&v.status!=='open') return false; if(!ZOEK) return true; return ((v.naam||'')+' '+(v.mail||'')+' '+(v.project_id||'')+' '+(v.commentaar||'')).toLowerCase().indexOf(ZOEK)>=0; });
    var h='<div class="kpis"><div><b>'+nOpen+'</b><span>open</span></div><div><b>'+nBel+'</b><span>open + wil teruggebeld worden</span></div><div><b>'+V.length+'</b><span>hulpvragen totaal</span></div><div><b>'+(med!=null?duur(med):'—')+'</b><span>mediane antwoordtijd</span></div></div>';
    h+='<div class="bar"><button type="button" data-f="open" class="'+(FILTER==='open'?'on':'')+'">Open</button><button type="button" data-f="alle" class="'+(FILTER==='alle'?'on':'')+'">Alle</button><input type="search" id="zoek" placeholder="Zoek op naam, mail, project of vraag…" value="'+esc(ZOEK)+'"><button type="button" id="ververs">↻ Vernieuwen</button></div>';
    h+='<div class="wrap"><table><thead><tr><th>Datum</th><th>Klant</th><th>Project</th><th>Reden</th><th>Vraag · laatste bericht</th><th>Status</th><th></th></tr></thead><tbody>';
    if(!rij.length) h+='<tr><td colspan="7"><div class="state">'+(FILTER==='open'?'Geen open hulpvragen 🎉':'Nog geen hulpvragen.')+'</div></td></tr>';
    rij.forEach(function(v){
      var ek=WEB+'/apps/ek.html?case='+encodeURIComponent(v.token)+'&adv=1', pl=WEB+'/apps/projectlog.html?token='+encodeURIComponent(v.token);
      h+='<tr><td>'+esc(datum(v.ts))+'</td>'+
        '<td><b>'+esc(v.naam||'—')+'</b><div class="sub">'+[v.mail?esc(v.mail):'', v.gsm?'📞 '+esc(v.gsm):''].filter(Boolean).join('<br>')+'</div>'+(v.terugbellen?'<div style="color:var(--amber);font-weight:700;font-size:12px">📞 wil teruggebeld worden</div>':'')+'</td>'+
        '<td>'+esc(v.project_id||'—')+(v.demo?'<span class="demo">DEMO</span>':'')+(v.gevraagd_door?'<div style="font-size:11px;color:#6B7689;margin-top:2px">gevraagd door '+esc(v.gevraagd_door.rol||'adviseur')+(v.gevraagd_door.naam||v.gevraagd_door.mail?' · '+esc(v.gevraagd_door.naam||v.gevraagd_door.mail):'')+'</div>':'')+'</td>'+
        '<td>'+(v.reden==='niet_rendabel'?'geen rendabele combinatie':'knop «Hulp vragen»')+'<div class="sub">'+(v.beste_tvt!=null?'beste TVT '+String(v.beste_tvt).replace('.',',')+' j':'geen TVT ≤ 15 j')+'</div></td>'+
        '<td class="vraag">'+esc(v.commentaar||'—')+((v.n_berichten||0)>1?'<div class="sub" style="margin-top:4px">💬 '+v.n_berichten+' berichten · laatste van '+(v.laatste_van==='ek'?'ons':'de klant')+' ('+esc(datum(v.laatste_ts))+')'+(v.laatste_tekst?': «'+esc(String(v.laatste_tekst).slice(0,160))+'»':'')+'</div>':'')+'</td>'+
        '<td><span class="st st-'+esc(v.status||'open')+'">'+(v.status==='open'?'wacht op ons':esc(v.status||'open'))+'</span><div class="sub">'+(v.status==='open'?'wacht '+duur(nu-(+(v.laatste_van==='klant'&&v.laatste_ts||v.ts)||nu)):(esc(v.door||'')+' · '+esc(datum(v.beantwoord_ts))))+'</div></td>'+
        '<td style="white-space:nowrap"><button type="button" data-chat="'+esc(v.token+'|'+v.id)+'" style="border:1px solid var(--line);background:'+(OPEN[v.token+'|'+v.id]?'var(--navy);color:#fff':'#fff')+';border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer">💬 Gesprek</button><br><a href="'+esc(ek)+'" target="_blank" rel="noopener">🔧 Open in EK</a><br><a href="'+esc(pl)+'" target="_blank" rel="noopener">📜 Projectlog</a></td></tr>';
      if(OPEN[v.token+'|'+v.id]) h+='<tr class="gesprek"><td colspan="7">'+gesprekHtml(v)+'</td></tr>';
    });
    h+='</tbody></table></div>';
    $('root').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){ b.onclick=function(){ FILTER=b.getAttribute('data-f'); render(); }; });
    $('zoek').oninput=function(){ ZOEK=this.value.trim().toLowerCase(); var pos=this.selectionStart; render(); var z=$('zoek'); z.focus(); try{ z.setSelectionRange(pos,pos); }catch(e){} };
    $('ververs').onclick=laad;
    Array.prototype.forEach.call(document.querySelectorAll('[data-chat]'),function(b){ b.onclick=function(){ var k=b.getAttribute('data-chat'); if(OPEN[k]){ delete OPEN[k]; render(); return; } OPEN[k]=1; render(); haalChat(k.split('|')[0]); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'),function(b){ b.onclick=function(){ antwoord(b); }; });
  }
  // v0.2.0: gesprek per hulpvraag
  function gesprekHtml(v){
    var g=CHAT[v.token]; if(!g) return '<div class="state">Gesprek laden…</div>'; if(g.fout) return '<div class="fout">'+esc(g.fout)+'</div>';
    var x=(g.hulp||[]).find(function(h){ return String(h.id)===String(v.id); }); if(!x) return '<div class="fout">Gesprek niet gevonden in het dossier.</div>';
    var B=x.berichten||[], k=v.token+'|'+v.id, open=(x.status==='open');
    var h='<div class="chat">'+B.map(function(m){
      if(m.van==='ek' && m.soort==='gesloten') return '<div class="sys">✔ afgesloten'+(m.naam?' door '+esc(m.naam):'')+' · '+esc(datum(m.ts))+'</div>';
      var cls=m.van==='ek'?(m.soort==='gebeld'?'g':'e'):'k';
      var wie=m.van==='ek'?((m.naam||'EK')+(m.soort==='gebeld'?' · 📞 gebeld (notitie)':' · ✉️ gemaild')):((m.wie&&m.wie.naam&&m.wie.rol&&m.wie.rol!=='klant')?(m.wie.rol+' '+m.wie.naam):(v.naam||'klant'));
      return '<div class="bub '+cls+'"><div class="w">'+esc(wie)+' · '+esc(datum(m.ts))+(m.bel?' · <b style="color:var(--amber)">📞 wil teruggebeld worden</b>':'')+'</div>'+(m.tekst?'<div style="white-space:pre-wrap">'+esc(m.tekst)+'</div>':'')+'</div>';
    }).join('')+'</div>';
    h+='<textarea rows="3" data-tx="'+esc(k)+'" placeholder="Je antwoord (wordt gemaild in de taal van de klant en verschijnt in het gesprek in EK) — of een notitie bij terugbellen"></textarea>'+
      '<div class="acts"><button type="button" class="p" data-act="mail" data-k="'+esc(k)+'">✉️ Verstuur antwoord</button>'+(open?'<button type="button" data-act="gebeld" data-k="'+esc(k)+'">📞 Gebeld (afsluiten)</button>':'')+
      ((x.status!=='gesloten'&&x.status!=='gebeld')?'<button type="button" data-act="sluiten" data-k="'+esc(k)+'">✔ Afsluiten zonder mail</button>':'')+'<span class="sub" data-st="'+esc(k)+'"></span></div>';
    return h;
  }
  async function haalChat(token){
    try{ var r=await fetch(PROXY+'/api/ek/hulp-chat?token='+encodeURIComponent(token)+'&cb='+Date.now(),{ cache:'no-store' }); var j=await r.json();
      CHAT[token]=(r.ok&&j.ok)?{ hulp:j.hulp }:{ fout:'Gesprek ophalen lukte niet ('+(j.error||r.status)+').' }; }
    catch(e){ CHAT[token]={ fout:'Server niet bereikbaar: '+e.message }; }
    var ta=document.querySelector('textarea[data-tx^="'+token+'|"]'), bewaar=ta?{ k:ta.getAttribute('data-tx'), v:ta.value }:null;
    render(); if(bewaar){ var t2=document.querySelector('textarea[data-tx="'+bewaar.k+'"]'); if(t2) t2.value=bewaar.v; }
  }
  async function antwoord(b){
    var k=b.getAttribute('data-k'), act=b.getAttribute('data-act'), p=k.split('|'), ta=document.querySelector('textarea[data-tx="'+k+'"]'), st=document.querySelector('[data-st="'+k+'"]');
    var tx=(ta&&ta.value||'').trim();
    if(act==='mail' && tx.length<3){ st.style.color='var(--amber)'; st.textContent='Schrijf eerst een antwoord.'; return; }
    if(act==='mail' && !confirm('Dit antwoord nu naar de klant mailen?')) return;
    b.disabled=true; st.style.color=''; st.textContent='⏳ Bezig…';
    try{ var hd=await authHeaders(); hd['Content-Type']='application/json';
      var r=await fetch(PROXY+'/api/ek/hulp-antwoord',{ method:'POST', headers:hd, body:JSON.stringify({ token:p[0], id:p[1], actie:act, antwoord:tx }) });
      var j=await r.json().catch(function(){return{};}); if(!r.ok||!j.ok) throw new Error(j.error||('status '+r.status));
      CHAT[p[0]]={ hulp:j.hulp }; await laad();
    }catch(e){ b.disabled=false; st.style.color='#8a1f1f'; st.textContent='Lukte niet: '+e.message; }
  }
  async function authHeaders(){
    var tok=SESSION&&SESSION.access_token;
    try{ if(sb){ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session){ SESSION=d.data.session; tok=SESSION.access_token; } } }catch(e){}
    return { 'Authorization':'Bearer '+tok };
  }
  async function laad(){
    var r;
    try{ r=await fetch(PROXY+'/api/ek/hulp-overzicht?cb='+Date.now(),{ headers: await authHeaders(), cache:'no-store' }); }
    catch(e){ $('root').innerHTML='<div class="fout">Kan de server niet bereiken: '+esc(e.message)+'</div>'; return; }
    if(r.status===401||r.status===403){ $('root').innerHTML='<div class="fout">Dit overzicht is enkel voor managers. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
    if(!r.ok){ $('root').innerHTML='<div class="fout">Fout bij ophalen ('+r.status+').</div>'; return; }
    DATA=await r.json(); DATA.vragen=DATA.vragen||[]; WEB=(DATA.web||location.origin).replace(/\/+$/,'');
    render();
  }
  (async function(){
    try{
      var rc=await fetch('/api/config'); CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      await laad();
    }catch(e){ $('root').innerHTML='<div class="fout">Init-fout: '+esc(e.message)+'</div>'; }
  })();
</script>
</body>
</html>
