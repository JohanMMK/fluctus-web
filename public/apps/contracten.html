<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracten · Energie-Compas</title>
<!-- contracten.html v1.4.0 (2026-10-19, Johan, server ≥ 15.341.0): NIEUW FORMAT (sjabloon v2: feedback-clausule, non-circumventie — velden feedback_dagen, nc_maanden, nc_boete_pct) · «✍️ Mijn handtekening» (één keer tekenen, gaat mee in elk verstuurd contract) · PDF-VERSIES per contract (bij ondertekening automatisch + «📄 Maak PDF»), openen via een kortlevende link. -->
<!-- contracten.html v1.3.0 (2026-10-18, Johan, server ≥ 15.334.0): HUISSTIJL — WHITE-LABEL per partner (merknaam, logo, kleuren, lettertype, contact) in de contractfiche; POST /api/contract/merk. -->
<!-- contracten.html v1.2.0 (2026-10-17, Johan, server ≥ 15.321.0): REKENINSTELLINGEN — BATTERIJSTAFFELS PER PARTNER. Blok onder de
     contractvelden: particulier-paren (kW/kWh), klein-bedrijf-paren + drempel (kVA), C&I-eenheid. Vooringevuld met de huidige
     standaard; afwijkingen gelden voor alle projecten van adviseurs/indieners op het contract-domein. Buiten de getekende tekst
     (geen invloed op de hash) → ook na ondertekening aanpasbaar (POST /api/contract/staffels). -->
<!-- contracten.html v1.1.0 (2026-10-16, Johan, server ≥ 15.311.0): TOEGANG VIA E-MAILDOMEIN — veld «Toegangsdomein» (website/URL
     van de partner) i.p.v. een lijst uit te nodigen gebruikers: iedereen met een e-mail op dat domein werkt als adviseur, vanaf
     het moment dat het contract bestaat. Schakelaar 🔓/🔒 in de lijst en in de editor zet die toegang in één keer aan/uit. -->
<!-- contracten.html v1.0.0 (2026-10-16, Johan): SAMENWERKINGSOVEREENKOMSTEN (server ≥ 15.307.0) — Brelco-model (Energie-Compas
     No Cure No Pay + optioneel business development). Manueel invullen → live voorbeeld → concept bewaren → ter ondertekening
     mailen (teken-link) → partner tekent digitaal op /apps/contract.html → status «getekend» met ondertekeningsbewijs.
     Kopie van een bestaand contract als vertrekpunt. Enkel managers. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/mijnec-knop.js?v=1.0.1"></script>
<style>
  :root{--navy:#1F3864;--green:#05B050;--line:#D6E0EC;--muted:#6B7689;--bg:#F4F7FB;--amber:#B45309}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1A1F2B}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{color:var(--navy);font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px}
  main{max-width:1500px;margin:0 auto;padding:16px}
  .sub{color:var(--muted);font-size:12px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}
  .btn.p{background:var(--green);border-color:var(--green);color:#fff;font-weight:700} .btn.n{background:var(--navy);border-color:var(--navy);color:#fff} .btn.r{color:#8a1f1f}
  .btn:disabled{opacity:.5;cursor:default}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:8px 10px;border-bottom:1px solid #EEF2F7;text-align:left;vertical-align:top;font-size:13px}
  thead th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr.klik{cursor:pointer} tr.klik:hover td{background:#FAFCFF}
  .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .st-concept{background:#EEF2F7;color:#45526b} .st-verstuurd{background:#FFF3D6;color:var(--amber)} .st-getekend{background:#E6F6EC;color:#0a7d3c} .st-ingetrokken{background:#FEF2F2;color:#8a1f1f}
  .ed{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:16px;align-items:start}
  @media (max-width:980px){.ed{grid-template-columns:1fr}}
  .form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100vh - 150px);overflow:auto}
  fieldset{border:0;border-top:1px solid var(--line);margin:10px 0 0;padding:10px 0 0} legend{font-weight:700;color:var(--navy);padding:0 6px 0 0;font-size:13px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input[type=text],input[type=email],input[type=number],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff}
  input:disabled,textarea:disabled{background:#F7F9FC;color:#45526b}
  .rij{display:grid;grid-template-columns:1fr 1fr;gap:8px} .rij3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#1A1F2B} .chk input{width:auto}
  .prev{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:10px}
  .prev iframe{width:100%;height:calc(100vh - 150px);border:0;display:block;background:#fff}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;position:sticky;bottom:-14px;background:#fff;padding:8px 0}
  .msg{font-size:13px;margin-top:6px} .ok{color:#0a7d3c} .warn{color:var(--amber)} .err{color:#8a1f1f}
  .info{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px}
  .info code{font-size:11.5px;word-break:break-all}
  .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px} .state{color:var(--muted);padding:20px}
  .modal{position:fixed;inset:0;background:rgba(15,22,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal>div{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px}
  .tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;background:#fff;white-space:nowrap}
  .tg.aan{background:#E6F6EC;border-color:#BFE6CC;color:#0a7d3c} .tg.uit{background:#FEF2F2;border-color:#F2C7C7;color:#8a1f1f}
  .tgbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header><b>📝 Contracten</b><span class="sub">samenwerkingsovereenkomsten Energie-Compas opmaken, ter ondertekening sturen en digitaal laten tekenen</span><span class="who" id="who"></span><a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a></header>
<main><div id="root"><div class="state">Laden…</div></div></main>
<script>
  var $=function(id){return document.getElementById(id);};
  var CFG=null, sb=null, SESSION=null, PROXY='', LIJST=[], SJ=null, CUR=null, VIEW='lijst', PREV_T=null, DIRTY=false;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function p2(n){ return (n<10?'0':'')+n; }
  function datum(ts){ if(!ts) return '—'; var d=new Date(+ts); if(isNaN(d.getTime())) return '—'; return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
  var ST={ concept:'concept', verstuurd:'ter ondertekening', getekend:'getekend', ingetrokken:'ingetrokken' };
  async function authHeaders(json){
    var tok=SESSION&&SESSION.access_token;
    try{ if(sb){ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session){ SESSION=d.data.session; tok=SESSION.access_token; } } }catch(e){}
    var h={ 'Authorization':'Bearer '+tok }; if(json) h['Content-Type']='application/json'; return h;
  }
  async function api(pad, body){
    var r=await fetch(PROXY+pad+(body?'':((pad.indexOf('?')>=0?'&':'?')+'cb='+Date.now())),{ method:body?'POST':'GET', headers:await authHeaders(!!body), body:body?JSON.stringify(body):undefined, cache:'no-store' });
    var j=await r.json().catch(function(){ return {}; });
    if(r.status===401||r.status===403) throw new Error('Enkel voor managers — meld u aan via de portal.');
    if(!r.ok||j.ok===false){ var e=new Error(j.error||('status '+r.status)); e.j=j; throw e; }
    return j;
  }

  // ── Lijst ──
  async function laadLijst(){ var j=await api('/api/contract/lijst'); LIJST=j.contracten||[]; }
  function renderLijst(){
    VIEW='lijst';
    var h='<div class="bar"><button class="btn p" id="nieuw">＋ Nieuw contract</button><button class="btn" id="ververs">↻ Vernieuwen</button><button class="btn" id="mijnht">✍️ Mijn handtekening</button><span class="sub">Sjabloon: '+esc(SJ?SJ.naam:'—')+'</span></div>';
    h+='<div class="wrap"><table><thead><tr><th>Referentie</th><th>Partner</th><th>Ondertekenaar</th><th>Status</th><th>Toegang</th><th>Laatst gewijzigd</th><th>Verstuurd</th><th>Getekend</th><th></th></tr></thead><tbody>';
    if(!LIJST.length) h+='<tr><td colspan="9"><div class="state">Nog geen contracten. Klik op «＋ Nieuw contract».</div></td></tr>';
    LIJST.forEach(function(c){
      var verl=(c.status==='verstuurd'&&c.teken_tot&&Date.now()>c.teken_tot);
      h+='<tr class="klik" data-id="'+esc(c.id)+'"><td><b>'+esc(c.referentie)+'</b></td><td>'+esc(c.partner_naam||'—')+'<div class="sub">'+esc(c.partner_mail||'')+'</div></td><td>'+esc(c.ondertekenaar||'—')+'</td>'+
        '<td><span class="st st-'+esc(c.status)+'">'+esc(ST[c.status]||c.status)+'</span>'+(verl?'<div class="sub warn">link verlopen</div>':'')+'</td><td>'+toegangCel(c)+'</td><td>'+esc(datum(c.gewijzigd_ts))+'<div class="sub">'+esc(c.door||'')+'</div></td>'+
        '<td>'+esc(datum(c.verstuurd_ts))+'</td><td>'+esc(datum(c.getekend_ts))+'</td><td style="white-space:nowrap"><button class="btn" data-kopie="'+esc(c.id)+'" title="Nieuw contract met dezelfde afspraken">⧉ Kopie</button></td></tr>';
    });
    h+='</tbody></table></div>';
    $('root').innerHTML=h;
    $('nieuw').onclick=function(){ openEditor(null); };
    $('ververs').onclick=async function(){ await laadLijst(); renderLijst(); };
    $('mijnht').onclick=htModal;   // v1.4.0
    Array.prototype.forEach.call(document.querySelectorAll('tr[data-id]'),function(tr){ tr.onclick=function(e){ if(e.target.closest('[data-kopie]')||e.target.closest('[data-tg]')) return; openEditor(tr.getAttribute('data-id')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tg]'),function(b){ b.onclick=async function(e){ e.stopPropagation(); var id=b.getAttribute('data-tg'), c=LIJST.filter(function(x){return x.id===id;})[0]; if(!c) return; var aan=c.toegang_aan===false;
      if(!aan&&!confirm('Toegang voor iedereen met een e-mail op @'+c.domein+' afzetten?')) return;
      b.disabled=true; try{ await api('/api/contract/toegang',{ id:id, aan:aan }); await laadLijst(); renderLijst(); }catch(err){ b.disabled=false; alert(err.message); } }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-kopie]'),function(b){ b.onclick=async function(e){ e.stopPropagation(); try{ var j=await api('/api/contract/get?id='+encodeURIComponent(b.getAttribute('data-kopie'))); var v=Object.assign({},j.contract.velden); ['partner_naam','partner_adres','partner_btw','partner_vert_naam','partner_vert_functie','partner_mail','contactpersonen','gebruikers','toegang_domein','afspraken_ref','nda_datum'].forEach(function(k){ v[k]=''; }); openEditor(null, v); }catch(err){ alert(err.message); } }; });
  }

  function toegangCel(c){
    if(!c.domein) return '<span class="sub">op uitnodiging</span>';
    var aan=c.toegang_aan!==false;
    return '<button class="tg '+(aan?'aan':'uit')+'" data-tg="'+esc(c.id)+'" title="Klik om de toegang '+(aan?'af':'aan')+' te zetten">'+(aan?'🔓 aan':'🔒 uit')+'</button>'+(c.staffels?'<div class="sub" title="Eigen batterijstaffels">🔋 eigen staffels</div>':'')+'<div class="sub">@'+esc(c.domein)+'</div>';
  }
  // ── Editor ──
  var VELDEN=[
    ['Partner (opdrachtgever)',[ ['partner_naam','Naam onderneming','text'], ['partner_adres','Adres (straat, postcode, gemeente)','area2'], ['partner_btw','BTW-nummer','text'] ]],
    ['Ondertekenaar partner',[ ['partner_vert_naam','Naam','text'], ['partner_vert_functie','Functie (bv. CEO, zaakvoerder)','text'], ['partner_mail','E-mail (krijgt de teken-link)','email'] ]],
    ['Contact & toegang',[ ['contactpersonen','Contactpersonen (één per regel)','area'], ['toegang_domein','Toegangsdomein — website of e-maildomein van de partner (bv. brelco.be). Iedereen met een e-mail op dit domein werkt als adviseur, vanaf nu.','text'], ['gebruikers','Uit te nodigen gebruikers (oud — enkel zonder toegangsdomein)','area','alsGevuld'], ['afspraken_ref','Verwijzing naar de afspraken (bv. «de mailwisseling van 9 en 14 oktober 2026»)','text'] ]],
    ['Energie-Compas',[ ['whitelabel','White-label: rapporten op naam en in de huisstijl van de partner','chk'], ['offerte_optie','Optie offerte vanuit het platform (opschortende voorwaarde technische inspectie)','chk'], ['imby','Onboarding bij imby inbegrepen','chk'] ]],
    ['No Cure No Pay',[ ['ncnp_maanden','Termijn na laatste simulatie (maanden)','num'], ['melding_dagen','Melding verkoop binnen (kalenderdagen)','num'], ['betaal_dagen','Betaling binnen (dagen na factuurdatum)','num'] ]],
    ['Vergoeding per site (excl. btw, EUR)',[ ['tarief_part','Particulier','num'], ['tarief_ls','Laagspanning (LS)','num'], ['tarief_ms','Middenspanning (MS)','num'] ]],
    ['Business development',[ ['bd_aan','Artikel business development opnemen','chk'], ['bd_tarief','Tarief per begonnen uur (EUR excl. btw)','num'], ['bd_betaal_dagen','Betaling binnen (dagen)','num'] ]],
    ['Overige',[ ['nda_datum','Datum ondertekende NDA (leeg = algemene vertrouwelijkheidsclausule)','text'], ['evaluatie_maanden','Evaluatie minstens om de … maanden','num'], ['opzeg_maanden','Opzegtermijn (maanden)','num'], ['kickoff','Kick-off via Teams van 1 uur','chk'], ['geldigheid_dagen','Geldigheid aanbod / teken-link (dagen)','num'], ['extra_bepalingen','Bijzondere bepalingen (optioneel)','area'] ]],
    ['Feedback & non-circumventie (sjabloon v2)',[ ['feedback_dagen','Fluctus mag de eindklant contacteren na … dagen zonder feedback','num'], ['nc_maanden','Non-circumventie: termijn na einde (maanden)','num'], ['nc_boete_pct','Forfaitaire schadevergoeding bij inbreuk (% bovenop de vergoeding)','num'] ]],
    ['Ondertekenaar Fluctus',[ ['fluctus_vert_naam','Naam','text'], ['fluctus_vert_functie','Functie','text'] ]]
  ];
  function veldHtml(f, v, dis){
    var k=f[0], lab=f[1], t=f[2], val=v[k], d=dis?' disabled':'';
    if(f[3]==='alsGevuld' && !String(val==null?'':val).trim()) return '';
    if(t==='chk') return '<label class="chk"><input type="checkbox" data-v="'+k+'"'+(val?' checked':'')+d+'> '+esc(lab)+'</label>';
    if(t==='area'||t==='area2') return '<label>'+esc(lab)+'</label><textarea data-v="'+k+'" rows="'+(t==='area2'?2:3)+'"'+d+'>'+esc(val==null?'':val)+'</textarea>';
    return '<label>'+esc(lab)+'</label><input type="'+(t==='num'?'number':(t==='email'?'email':'text'))+'"'+(t==='num'?' step="any" min="0"':'')+' data-v="'+k+'" value="'+esc(val==null?'':val)+'"'+d+'>';
  }
  function leesVelden(){ var v={}; Array.prototype.forEach.call(document.querySelectorAll('[data-v]'),function(el){ var k=el.getAttribute('data-v'); v[k]=(el.type==='checkbox')?el.checked:el.value; }); return v; }
  async function openEditor(id, vooraf){
    VIEW='editor'; DIRTY=false;
    if(id){ try{ var j=await api('/api/contract/get?id='+encodeURIComponent(id)); CUR=j.contract; }catch(e){ alert(e.message); return; } }
    else CUR={ id:null, status:'concept', velden:Object.assign({}, SJ.defaults, vooraf||{}) };
    renderEditor();
  }
  function renderEditor(){
    var c=CUR, v=c.velden||{}, dis=(c.status==='getekend');
    var h='<div class="bar"><button class="btn" id="terug">← Alle contracten</button><b style="color:var(--navy)">'+esc(c.referentie||'Nieuw contract')+'</b><span class="st st-'+esc(c.status)+'">'+esc(ST[c.status]||c.status)+'</span><span class="sub">'+(c.id&&!c.sjabloon_v2?'sjabloon v1 (oud format)':'sjabloon v2')+'</span><span class="sub" id="dirty"></span></div>';
    h+='<div class="ed"><div class="form">';
    if(c.status==='verstuurd') h+='<div class="info">⏳ Verstuurd naar <b>'+esc(c.verstuurd_naar||'')+'</b> op '+esc(datum(c.verstuurd_ts))+(c.mail?(c.mail.sent?' (mail vertrokken)':' — <span class="err">mail niet vertrokken'+(c.mail.reden&&c.mail.reden!=='niet gevraagd'?': '+esc(c.mail.reden):'')+'</span>'):'')+'. Link geldig tot '+esc(datum(c.teken_tot))+'.<br>Wijzigt u de tekst, dan vervalt de verstuurde link en moet u opnieuw versturen.</div>';
    if(c.status==='getekend'&&c.getekend) h+='<div class="info ok">✔ Getekend door <b>'+esc(c.getekend.naam)+'</b> ('+esc(c.getekend.functie)+', '+esc(c.getekend.mail||'')+') op '+esc(datum(c.getekend.ts))+' · IP '+esc(c.getekend.ip||'?')+'<br>SHA-256 <code>'+esc(c.getekend.hash||'')+'</code>'+(c.getekend.hash===c.hash?' — identiek aan de verzonden tekst':' — <span class="err">AFWIJKEND</span>')+'</div>';
    if(c.id){
      if(c.toegang_domein){ var aan=c.toegang_aan!==false;
        h+='<div class="info tgbox"><span>Toegang als adviseur voor iedereen met een e-mail op <b>@'+esc(c.toegang_domein)+'</b></span><button class="tg '+(aan?'aan':'uit')+'" id="tg">'+(aan?'🔓 aan — klik om af te zetten':'🔒 uit — klik om aan te zetten')+'</button></div>';
      } else h+='<div class="info">Geen toegangsdomein ingevuld — vul de website van de partner in (bv. brelco.be) en bewaar om iedereen van de partner toegang te geven.</div>';
    }
    VELDEN.forEach(function(g){ h+='<fieldset><legend>'+esc(g[0])+'</legend>';
      var nums=g[1].filter(function(f){return f[2]==='num';});
      if(nums.length===3 && g[1].length===3) h+='<div class="rij3">'+g[1].map(function(f){ return '<div>'+veldHtml(f,v,dis)+'</div>'; }).join('')+'</div>';
      else h+=g[1].map(function(f){ return veldHtml(f,v,dis); }).join('');
      h+='</fieldset>'; });
    h+=staffelHtml(c);   // v1.2.0
    h+=merkHtml(c);   // v1.3.0: white-label
    h+='<div class="acts">';
    if(!dis){ h+='<button class="btn n" id="bewaar">💾 Bewaar concept</button><button class="btn p" id="verstuur">✉️ Verstuur ter ondertekening</button>'; }
    if(c.status==='verstuurd'&&c.teken_link) h+='<button class="btn" id="kopieer">🔗 Kopieer teken-link</button>';
    if(c.id) h+='<button class="btn" id="print">🖨️ Afdrukken / PDF</button>';
    if(c.status==='getekend'&&c.document_link) h+='<a class="btn" href="'+esc(c.document_link)+'" target="_blank" rel="noopener">📄 Getekende versie</a>';
    if(c.id) h+='<button class="btn" id="pdfmaak" title="PDF van de huidige versie maken en bij dit contract bewaren">📄 Maak PDF</button>';   // v1.4.0
    if(c.id&&(c.status==='verstuurd'||c.status==='concept')) h+='<button class="btn r" id="intrek">⛔ '+(c.status==='verstuurd'?'Intrekken':'Archiveren')+'</button>';
    h+='</div><div class="msg" id="msg"></div>';
    if(c.id) h+='<div class="info"><b>PDF-versies</b>'+((c.pdfs&&c.pdfs.length)?'<br>'+c.pdfs.map(function(x){ return '<a href="#" data-pdf="'+esc(x.id)+'">📄 '+esc(x.naam)+'</a> <span class="sub">'+esc(datum(x.ts))+' · '+esc(x.soort)+(x.grootte?' · '+Math.round(x.grootte/1024)+' kB':'')+(x.door?' · '+esc(x.door):'')+'</span>'; }).join('<br>'):'<br><span class="sub">Nog geen PDF. Bij ondertekening door de partner wordt de getekende PDF automatisch gemaakt, gemaild (partner + oekene) en hier bewaard.</span>')+'</div>';   // v1.4.0
    if(c.log&&c.log.length) h+='<div class="info"><b>Historiek</b><br>'+c.log.slice().reverse().map(function(l){ return esc(datum(l.ts))+' · '+esc(l.actie)+(l.wie?' · '+esc(l.wie):'')+(l.naar?' → '+esc(l.naar):''); }).join('<br>')+'</div>';
    h+='</div><div class="prev"><iframe id="prev" title="Voorbeeld"></iframe></div></div>';
    $('root').innerHTML=h;
    $('terug').onclick=async function(){ if(DIRTY&&!confirm('Niet-bewaarde wijzigingen verwerpen?')) return; await laadLijst(); renderLijst(); };

  // v1.2.0 (Johan 17-10): batterijstaffels per partner (rooster in het resultatenscherm van Energie-Compas).
  var STF_STD={ particulier:[[5,5],[5,10],[5,15],[10,10],[10,15],[10,20],[10,25]], bedrijf_klein:[[30,60],[50,100]], bedrijf_klein_tot_kva:150, ci_eenheid:[125,250] };

  function staffelHtml(c){

    var veld=function(k,lab,val,hint){ return '<label>'+esc(lab)+(e(k)?' <span class="st st-verstuurd" style="font-size:10.5px">eigen</span>':' <span class="sub">(standaard)</span>')+'</label><input type="text" data-stf="'+k+'" value="'+esc(val)+'"'+(c.id?'':' disabled')+'>'+(hint?'<div class="sub">'+esc(hint)+'</div>':''); };

    h+='<div class="rij"><div>'+veld('bedrijf_klein','Klein bedrijf — extra batterijen (kW/kWh)', stfTxt(eig.bedrijf_klein||std.bedrijf_klein), 'max. 4 paren, onder de drempel')+'</div>';
    h+='<div>'+veld('bedrijf_klein_tot_kva','Klein bedrijf tot toegangsvermogen (kVA)', String(e('bedrijf_klein_tot_kva')?eig.bedrijf_klein_tot_kva:std.bedrijf_klein_tot_kva), '0 = nooit')+'</div></div>';
    h+=veld('ci_eenheid','C&I-eenheid (kW/kWh) — rooster = veelvouden tot aansluiting/cabine/piek', (eig.ci_eenheid||std.ci_eenheid).join('/'), 'eigen batterij-eenheid op een project gaat voor');

  function merkHtml(c){

    var h='<fieldset><legend>Huisstijl — white-label rapporten</legend>';

    h+='<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" data-mk="aan"'+(m.aan?' checked':'')+dis+' style="width:auto"> White-label aan</label>';
    h+='<div class="rij">'+inp('naam','Merknaam in de rapporten',m.naam||(c.velden&&c.velden.partner_naam)||'','bv. Brelco')+inp('font','Lettertype (Google Fonts, optioneel)',m.font,'bv. Montserrat — leeg = standaard')+'</div>';
    h+='<div class="rij3"><div>'+inp('kleur','Hoofdkleur',m.kleur||'#0022AC','#0022AC','color').replace('<div>','').replace(/<\/div>$/,'')+'</div><div>'+inp('kleur2','Accentkleur',m.kleur2||'#3D75F2','#3D75F2','color').replace('<div>','').replace(/<\/div>$/,'')+'</div><div>'+inp('ink','Donkere tekstkleur',m.ink||'#0B1F6B','#0B1F6B','color').replace('<div>','').replace(/<\/div>$/,'')+'</div></div>';
    h+='<div class="rij">'+inp('web','Website',m.web,'www.brelco.be')+inp('tel','Telefoon',m.tel,'+32 …')+'</div>';
    h+='<div class="rij">'+inp('mail','E-mail',m.mail,'info@…')+inp('adres','Adres',m.adres,'Straat nr, postcode gemeente')+'</div>';
    h+='<label>Logo</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+(m.logo?'<img src="'+esc(m.logo)+'" alt="Logo" style="height:48px;max-width:220px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:4px">':'<span class="sub">nog geen logo</span>')+
       '<input type="file" id="mk-logo" accept="image/png,image/jpeg,image/svg+xml"'+dis+' style="width:auto">'+(m.logo?'<button class="btn" id="mk-logo-wis" type="button">✕ Logo wissen</button>':'')+'</div><div class="sub">PNG met transparante achtergrond aanbevolen, max. 400 kB.'+(m.logo_naam?' Huidig: '+esc(m.logo_naam):'')+'</div>';
    if(c.id) h+='<div class="acts" style="position:static;margin-top:8px"><button class="btn n" id="mk-bewaar" type="button">🎨 Bewaar huisstijl</button></div><div class="msg" id="mk-msg"></div>';
    else h+='<div class="sub">Bewaar eerst het contract om de huisstijl in te stellen.</div>';
    return h+'</fieldset>';
  }
  function leesBestand(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result)); }; r.onerror=function(){ rej(new Error('bestand niet leesbaar')); }; r.readAsDataURL(f); }); }
  async function bewaarMerk(wisLogo){
    var m={}; Array.prototype.forEach.call(document.querySelectorAll('[data-mk]'),function(el){ var k=el.getAttribute('data-mk'); m[k]=(el.type==='checkbox')?el.checked:el.value; });
    if(wisLogo){ if(!confirm('Logo wissen?')) return; m.logo=null; }
    var body={ id:CUR.id, merk:m }, f=$('mk-logo')&&$('mk-logo').files&&$('mk-logo').files[0];
    try{
      if(f){ if(f.size>400*1024) throw new Error('logo te groot (max. 400 kB)'); body.logo={ base64:await leesBestand(f), mediaType:f.type||'image/png', naam:f.name }; }
      var j=await api('/api/contract/merk', body); var d=DIRTY, vv=d?leesVelden():null; CUR=j.contract; if(d){ CUR.velden=Object.assign({},CUR.velden,vv); } renderEditor(); if(d){ DIRTY=true; $('dirty').textContent='● niet bewaard'; }
      var mm=$('mk-msg'); if(mm){ mm.className='msg ok'; mm.textContent=(CUR.merk&&CUR.merk.aan&&CUR.merk.logo)?'🎨 White-label aan — dossiers met een adviseur van deze partner krijgen deze huisstijl.':(CUR.merk&&CUR.merk.aan?'⚠ White-label staat aan maar er is nog geen logo — zonder logo blijft de standaardhuisstijl.':'🎨 Huisstijl bewaard (white-label uit).'); }
    }catch(e){ var m2=$('mk-msg'); if(m2){ m2.className='msg err'; m2.textContent='Bewaren lukte niet: '+e.message; } }
  }
  async function bewaarStaffels(reset){
    if(reset&&!confirm('Alle staffels van deze partner terug op de standaard zetten?')) return;
    var st={}; if(!reset) Array.prototype.forEach.call(document.querySelectorAll('[data-stf]'),function(el){ st[el.getAttribute('data-stf')]=el.value; });
    try{ var j=await api('/api/contract/staffels',{ id:CUR.id, staffels:reset?null:st }); var d=DIRTY, vv=d?leesVelden():null; CUR=j.contract; if(d){ CUR.velden=Object.assign({},CUR.velden,vv); } renderEditor(); if(d){ DIRTY=true; $('dirty').textContent='● niet bewaard'; }
      var m=$('stf-msg'); if(m){ m.className='msg ok'; m.textContent=CUR.staffels?'🔋 Eigen staffels bewaard — nieuwe simulaties van deze partner rekenen ermee.':'🔋 Standaardstaffels.'; }
    }catch(e){ var m2=$('stf-msg'); if(m2){ m2.className='msg err'; m2.textContent='Bewaren lukte niet: '+e.message; } }
  }
  function msg(t,cls){ var m=$('msg'); if(m){ m.className='msg '+(cls||''); m.innerHTML=t; } }
  function voorbeeldLater(){ clearTimeout(PREV_T); PREV_T=setTimeout(voorbeeld,600); }
  async function voorbeeld(){
    try{ var body=(CUR.id&&!DIRTY)?{ id:CUR.id }:{ id:CUR.id||undefined, velden:leesVelden() };
      var j=await api('/api/contract/voorbeeld', body); var f=$('prev'); if(f) f.srcdoc=j.html;
      if(j.domein_fout&&CUR.status!=='getekend') msg('Toegangsdomein: '+esc(j.domein_fout),'err'); else
      if(j.ontbrekend&&j.ontbrekend.length&&CUR.status!=='getekend') msg('Nog in te vullen vóór verzenden: '+j.ontbrekend.map(lbl).join(', ')+'.','warn'); else if(CUR.status!=='getekend' && $('msg') && /Nog in te vullen/.test($('msg').textContent)) msg('');
    }catch(e){ msg('Voorbeeld lukte niet: '+esc(e.message),'err'); }
  }
  function lbl(k){ var r=k; VELDEN.forEach(function(g){ g[1].forEach(function(f){ if(f[0]===k) r=f[1]; }); }); return r.replace(/ \(.*\)$/,''); }
  async function bewaar(stil){
    try{ var j=await api('/api/contract/opslaan',{ id:CUR.id||undefined, velden:leesVelden() }); var oudStatus=CUR.status; CUR=j.contract; DIRTY=false;
      renderEditor(); if(j.domein_fout){ msg('💾 Bewaard, maar het toegangsdomein werd niet aanvaard: '+esc(j.domein_fout),'err'); return true; } if(!stil) msg(oudStatus==='verstuurd'&&CUR.status==='concept'?'💾 Bewaard. De tekst wijzigde: de eerder verstuurde link is ongeldig — verstuur opnieuw.':'💾 Concept bewaard ('+esc(CUR.referentie)+').', oudStatus==='verstuurd'&&CUR.status==='concept'?'warn':'ok');
      return true;
    }catch(e){ msg('Bewaren lukte niet: '+esc(e.message),'err'); return false; }
  }
  function verstuurModal(){
    var v=leesVelden();
    var d=document.createElement('div'); d.className='modal';
    d.innerHTML='<div><h3 style="margin:0 0 8px;color:var(--navy)">Ter ondertekening versturen</h3>'+
      '<p style="margin:0 0 8px">Naar <b>'+esc(v.partner_vert_naam||'?')+'</b> &lt;'+esc(v.partner_mail||'?')+'&gt; — '+esc(v.partner_naam||'')+'</p>'+
      '<label class="chk"><input type="checkbox" id="m-mail" checked> Mail met de teken-link sturen vanuit Energie-Compas</label>'+
      '<label>Persoonlijke boodschap in de mail (optioneel)</label><textarea id="m-ber" rows="3" placeholder="bv. Zoals afgesproken tijdens ons gesprek …"></textarea>'+
      '<p class="sub">De tekst wordt vastgelegd (SHA-256). U ondertekent namens Fluctus door te versturen ('+esc(v.fluctus_vert_naam||'')+', '+esc(v.fluctus_vert_functie||'')+'). Zonder mail krijgt u enkel de link om zelf door te sturen.</p>'+
      '<div class="acts" style="position:static"><button class="btn p" id="m-ok">✉️ Versturen</button><button class="btn" id="m-annul">Annuleren</button></div><div class="msg" id="m-msg"></div></div>';
    document.body.appendChild(d);
    $('m-annul').onclick=function(){ d.remove(); };
    $('m-ok').onclick=async function(){
      this.disabled=true; $('m-msg').textContent='⏳ Bezig…';
      if(!(await bewaar(true))){ d.remove(); return; }
      try{ var j=await api('/api/contract/verstuur',{ id:CUR.id, mail:$('m-mail').checked, bericht:$('m-ber').value });
        CUR=j.contract; d.remove(); renderEditor();
        msg((j.mail&&j.mail.sent?'✉️ Verstuurd naar '+esc(CUR.verstuurd_naar)+'.':('Link aangemaakt'+(j.mail&&j.mail.reden&&j.mail.reden!=='niet gevraagd'?' — <span class="err">mail niet vertrokken: '+esc(j.mail.reden)+'</span>':'')+'.'))+'<br>Teken-link: <code>'+esc(j.link)+'</code>','ok');
      }catch(e){ $('m-ok').disabled=false; var mis=e.j&&e.j.ontbrekend; $('m-msg').innerHTML='<span class="err">'+esc(mis?('Nog in te vullen: '+mis.map(lbl).join(', ')):e.message)+'</span>'; }
    };
  }
  async function kopieer(t){ try{ await navigator.clipboard.writeText(t); msg('🔗 Teken-link gekopieerd.','ok'); }catch(e){ prompt('Kopieer de link:', t); } }
  async function afdrukken(){
    try{ var r=await fetch(PROXY+'/api/contract/document?id='+encodeURIComponent(CUR.id)+'&cb='+Date.now(),{ headers:await authHeaders() }); if(!r.ok) throw new Error('status '+r.status);
      var html=await r.text(); var w=window.open('','_blank'); if(!w){ msg('Pop-up geblokkeerd — sta pop-ups toe voor deze pagina.','warn'); return; }
      w.document.open(); w.document.write(html); w.document.close(); setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} },700);
    }catch(e){ msg('Afdrukken lukte niet: '+esc(e.message),'err'); }
  }
  // v1.4.0 (Johan 19-10): PDF-versies + handtekening Fluctus
  async function pdfMaak(){
    var b=$('pdfmaak'); if(b) b.disabled=true; msg('⏳ PDF maken…');
    try{ var j=await api('/api/contract/pdf-maak',{ id:CUR.id }); CUR=j.contract; renderEditor(); msg('📄 PDF gemaakt en bewaard.','ok'); }

    var w=window.open('','_blank');

  async function htModal(){
    var d=document.createElement('div'); d.className='modal';
    d.innerHTML='<div><h3 style="margin:0 0 6px;color:var(--navy)">✍️ Mijn handtekening</h3>'+
      '<p class="sub" style="margin:0 0 8px">Teken één keer met de muis of je vinger. Ze komt in het vak «Voor Fluctus.net CVSO» van elk contract dat je vanaf nu verstuurt (en in de getekende PDF). De vingerafdruk (SHA-256) van de tekst verandert er niet door.</p>'+
      '<div id="ht-nu" class="sub" style="margin-bottom:6px">Laden…</div>'+
      '<canvas id="ht-c" width="520" height="160" style="width:100%;height:160px;border:1px dashed #9aa5b8;border-radius:10px;background:#fff;touch-action:none;cursor:crosshair"></canvas>'+
      '<label>Naam (moet gelijk zijn aan de ondertekenaar Fluctus in het contract)</label><input type="text" id="ht-naam" value="Johan Konings">'+
      '<div class="acts" style="position:static;margin-top:10px"><button class="btn p" id="ht-ok">💾 Bewaar handtekening</button><button class="btn" id="ht-leeg">Leegmaken</button><button class="btn r" id="ht-wis">Verwijderen</button><button class="btn" id="ht-x">Sluiten</button></div><div class="msg" id="ht-msg"></div></div>';
    document.body.appendChild(d);
    var cv=$('ht-c'), cx=cv.getContext('2d'), teken=false, iets=false;
    cx.lineWidth=2.6; cx.lineCap='round'; cx.lineJoin='round'; cx.strokeStyle='#0B1F4D';
    function pos(e){ var r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return { x:(t.clientX-r.left)*cv.width/r.width, y:(t.clientY-r.top)*cv.height/r.height }; }
    function start(e){ e.preventDefault(); teken=true; var p=pos(e); cx.beginPath(); cx.moveTo(p.x,p.y); }
    function beweeg(e){ if(!teken) return; e.preventDefault(); var p=pos(e); cx.lineTo(p.x,p.y); cx.stroke(); iets=true; }
    function stop(){ teken=false; }
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',beweeg); window.addEventListener('mouseup',stop);
    cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',beweeg,{passive:false}); cv.addEventListener('touchend',stop);
    $('ht-x').onclick=function(){ d.remove(); };
    $('ht-leeg').onclick=function(){ cx.clearRect(0,0,cv.width,cv.height); iets=false; };
    try{ var j=await api('/api/contract/handtekening'); var ht=j.handtekening;
      $('ht-nu').innerHTML=ht&&ht.img?('Huidige handtekening ('+esc(ht.naam||'')+', '+esc(datum(ht.ts))+'):<br><img src="'+ht.img+'" alt="handtekening" style="max-height:60px;border:1px solid #e3e8ef;border-radius:6px;background:#fff">'):'Nog geen handtekening bewaard.';
      if(ht&&ht.naam) $('ht-naam').value=ht.naam;
    }catch(e){ $('ht-nu').textContent='Laden lukte niet: '+e.message; }
    $('ht-ok').onclick=async function(){
      if(!iets){ $('ht-msg').innerHTML='<span class="err">Teken eerst in het vak.</span>'; return; }
      this.disabled=true;
      try{ await api('/api/contract/handtekening',{ img:cv.toDataURL('image/png'), naam:$('ht-naam').value }); $('ht-msg').innerHTML='<span class="ok">✔ Bewaard — komt in elk contract dat je vanaf nu verstuurt.</span>'; setTimeout(function(){ d.remove(); },1200); }
      catch(e){ this.disabled=false; $('ht-msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
    };
    $('ht-wis').onclick=async function(){ if(!confirm('Handtekening verwijderen?')) return; try{ await api('/api/contract/handtekening',{ wis:true }); $('ht-nu').textContent='Verwijderd.'; }catch(e){ $('ht-msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; } };
  }
  async function wisselToegang(){
    var aan=CUR.toegang_aan===false;
    if(!aan&&!confirm('Toegang voor iedereen met een e-mail op @'+CUR.toegang_domein+' afzetten?')) return;
    try{ var j=await api('/api/contract/toegang',{ id:CUR.id, aan:aan }); CUR=j.contract; renderEditor(); msg(aan?'🔓 Toegang staat aan voor @'+esc(CUR.toegang_domein)+'.':'🔒 Toegang afgezet voor @'+esc(CUR.toegang_domein)+'.', aan?'ok':'warn'); }catch(e){ msg(esc(e.message),'err'); }
  }
  async function intrekken(){
    if(!confirm(CUR.status==='verstuurd'?'De teken-link ongeldig maken en het contract intrekken?':'Dit concept archiveren (status ingetrokken)?')) return;

  }
  window.addEventListener('beforeunload',function(e){ if(VIEW==='editor'&&DIRTY){ e.preventDefault(); e.returnValue=''; } });
  (async function(){
    try{
      var rc=await fetch('/api/config'); CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld u aan via de portal en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      var s=await api('/api/contract/sjabloon'); SJ=(s.sjablonen||[])[0];
      await laadLijst();
      var q=new URLSearchParams(location.search); if(q.get('id')) openEditor(q.get('id')); else renderLijst();
    }catch(e){ $('root').innerHTML='<div class="fout">'+esc(e.message)+'</div>'; }
  })();
