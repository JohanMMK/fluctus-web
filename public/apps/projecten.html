<!-- projecten.html v1.0.0 (2026-10-17, Johan): PROJECTPROCES (server ≥ 15.328.0) — fase per project (1–8: Binnen … Getekend, + Besproken / Gefactureerd, eindstatus Verloren / On hold), «Bal bij», tijd in fase t.o.v. de norm, volgende stap met vervaldag, 💬 vragen die op ons wachten, scope, twee timers (sinds contact / sinds laatste actie), laatste activiteit. Trechter + «te factureren» + prognose (NCNP-vergoeding uit het partnercontract × kans per fase) bovenaan. «Mijn werk», filterchips, sorteren per kolom, kolommen aan/uit en breedte slepen — onthouden per gebruiker (server). Menu «⋯» per rij: open, log, mandaat-acties, stappen (offerte gevraagd · besproken · getekend · verloren · on hold · heropen · gefactureerd), archiveer. Adviseurs/partnermanagers: dezelfde lijst, enkel hun projecten, stappen op hun eigen projecten. -->
<!-- projecten.html v0.11.0 (2026-10-16, Johan): partnermanager via contract (ondertekenaar, server ≥ 15.317.0) — titel met het bedrijf + kolom Adviseur. -->

     projecten.html v0.8.0 (2026-10-10, Johan) — knop "📜 Log" per project (lead) → apps/projectlog.html (server ≥ 15.265).
     projecten.html v0.7.1 (2026-10-06, Johan) — knop "📊 Open in Kamino" verwijderd (rij + actievenster).
     projecten.html v0.7.0 (2026-10-06, Johan) — "Open" landt nu op het voorgevulde INVOERSCHERM van Energie-Compas
     (ek.html?case=&adv=1&invoer=1): geen wachttijd op een volledige doorrekening. In de project-actie-modal blijven
     beide: "✍ Open invoer" en "📈 Open resultaat" (oud gedrag, rekent meteen door).
     projecten.html v0.6.1 (2026-09-20) — + pill "📩 offertes gevraagd" (server v15.156.8 offertes_aangevraagd).
     v0.6.0 (2026-09-20) — EK-ENGAGEMENT FILTERS: twee filters "👁 bezocht op EK" en "✍ input op EK"
     (server v15.156.4 geeft ek_bezocht/ek_input per project) + pills in de statuskolom. Zo isoleer je de dossiers waar
     de klant de EK-link effectief opende resp. aanvulde.
     v0.5.1 (2026-09-20) — navlink toegevoegd naar het factuurmail-dashboard (inbound-stats.html).
     v0.5.0 (2026-09-15) — ARCHIEF-CACHE FIX: de lijst-reload na archiveren/herstellen haalt het
     overzicht + de wachtrij nu op met cache-buster (?_=<ts>) + cache:'no-store', zodat gearchiveerde projecten
     meteen verdwijnen i.p.v. een gecachte (pre-archief) lijst te tonen. Samen met server v15.154 (verse Supabase-read).
     v0.4.0 (2026-09-15) — MANAGER-COCKPIT: overzicht van ALLE projecten (manager-only: David/Johan).
     Toont per project de status + de afgeleide volgende actie (klikbaar → actie-modal), met deeplinks en archief.
     GET /api/kamino/projecten-overzicht (?archief=1) + POST /api/kamino/archiveer {id,archived}. Server v15.150.
     v0.2.0: multi-select + bulk-archief. v0.3.0: "Open" → EnergieKompas rapport-stap (?case=&stap=rapport) of Kamino.
     v0.4.0 (15-09): klik de "volgende actie" → project-actie-modal met dezelfde mandaat/EAN-acties als de volledige
     actielijst (gedeelde module fluvius-modal.js / FLXModal); EAN's per project via /api/mandaat/wachtrij.

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/fluvius-modal.js"></script>
<style>
  :root{ --navy:#1F3864; --navy2:#12315E; --ink:#2A3140; --muted:#5A6577; --bg:#F4F7FB; --line:#dbe3ef; --green:#05B050; --amber:#9E480E; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .top{ background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .top h1{ color:var(--navy); font-size:19px; margin:0; }
  .top .links{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .top .links a:not(.mijnec-knop):not(.grp-link){ display:none; }   /* v15-10: enkel zichtbaar voor oekene (JS); v1.2.1: Groepen/Rendementen voor iedereen */
  .top a{ color:var(--navy2); font-size:13px; text-decoration:none; font-weight:600; }
  .top .who{ font-size:12.5px; color:var(--muted); }
  .wrap{ max-width:1200px; margin:0 auto; padding:16px 20px 60px; }
  .bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .bar input[type=search]{ flex:1; min-width:200px; border:1.5px solid var(--line); border-radius:9px; padding:9px 12px; font-size:13.5px; }
  .bar label{ font-size:12.5px; color:var(--muted); display:flex; gap:6px; align-items:center; cursor:pointer; }
  .telling{ font-size:12.5px; color:var(--muted); margin-left:auto; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td{ text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ background:#f7f9fd; color:var(--navy2); font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; }
  tr:last-child td{ border-bottom:none; }
  tr.arch{ opacity:.6; }
  .naam{ font-weight:700; color:var(--navy); }
  .sub{ font-size:11.5px; color:var(--muted); }
  .id{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); }
  .pill{ display:inline-block; border-radius:999px; padding:2px 8px; font-size:10.5px; font-weight:700; margin:1px 3px 1px 0; white-space:nowrap; }
  .p-ok{ background:#D1FAE5; color:#065f46; } .p-wacht{ background:#FEF3C7; color:#92610a; } .p-mis{ background:#FEE2E2; color:#9b1c1c; }
  .p-neu{ background:#EEF2F8; color:#42506a; } .p-info{ background:#E0ECFB; color:#1F3864; }
  .actie{ font-weight:700; font-size:12.5px; }
  .a-doe{ color:var(--amber); } .a-klaar{ color:#065f46; } .a-wacht{ color:#42506a; }
  .btn{ background:var(--navy); color:#fff; border:none; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.ghost{ background:#fff; color:var(--navy2); border:1.5px solid var(--line); }
  .btn.warn{ background:#fff; color:var(--amber); border:1.5px solid #f0d9bf; }
  .rowbtns{ display:flex; gap:6px; flex-wrap:wrap; }
  .bulk{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 12px; padding:10px 13px; background:#EAF1FB; border:1px solid var(--line); border-radius:10px; }
  .bulk[hidden]{ display:none; }
  .bulk b{ color:var(--navy2); }
  th.chk,td.chk{ width:32px; text-align:center; padding-left:10px; padding-right:4px; }
  th.chk input,td.chk input{ width:16px; height:16px; cursor:pointer; }
  .acbtn{ font:inherit; font-weight:700; font-size:12.5px; background:none; border:none; cursor:pointer; padding:0; text-align:left; }
  .acbtn:hover{ text-decoration:underline; }
  .m-overlay{ position:fixed; inset:0; background:rgba(18,49,94,.45); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .m-card{ background:#fff; border-radius:14px; padding:18px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .m-top{ display:flex; align-items:center; gap:8px; font-size:16px; color:var(--navy); font-weight:700; }
  .m-x{ margin-left:auto; background:transparent; border:none; font-size:16px; cursor:pointer; color:var(--muted); }
  .m-act{ display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:9px; padding:11px 13px; font-size:13.5px; font-weight:600; color:var(--navy2); cursor:pointer; margin-top:8px; }
  .m-act:hover{ background:#f2f7ff; } .m-act.danger{ color:#b23; border-color:#f2c7c7; } .m-act.danger:hover{ background:#fef2f2; }
  .code{ font-family:ui-monospace,Menlo,Consolas,monospace; }
  .state{ padding:34px; text-align:center; color:var(--muted); } .fout{ padding:28px; text-align:center; color:#b23; }
  /* v1.0.0 projectproces */
  .wrap{ max-width:1500px; }
  .kpi{ margin-bottom:12px; }
  .kpi-funnel{ display:grid; grid-template-columns:repeat(9,1fr); gap:6px; margin-bottom:8px; }
  .kf{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 8px; text-align:left; cursor:pointer; font:inherit; display:flex; flex-direction:column; gap:3px; }
  .kf.on{ border-color:var(--navy); box-shadow:0 0 0 2px rgba(31,56,100,.15); }
  .kf-n{ font-size:18px; font-weight:800; color:var(--navy); } .kf-t{ font-size:11px; color:var(--ink); font-weight:600; } .kf-m{ font-size:10.5px; color:var(--muted); min-height:13px; }
  .kf-bar{ height:4px; background:#EEF2F8; border-radius:3px; overflow:hidden; } .kf-bar i{ display:block; height:100%; background:var(--navy); }
  .kpi-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .kt{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; text-align:left; font:inherit; display:flex; flex-direction:column; gap:2px; }
  button.kt{ cursor:pointer; } .kt.on{ border-color:var(--navy); box-shadow:0 0 0 2px rgba(31,56,100,.15); }
  .kt-l{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; } .kt-v{ font-size:19px; font-weight:800; color:var(--navy); } .kt-s{ font-size:11px; color:var(--muted); }
  .sel{ border:1.5px solid var(--line); border-radius:9px; padding:7px 8px; font-size:12.5px; background:#fff; max-width:190px; }
  .btn.tg.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin:-4px 0 10px; } .chips:empty{ display:none; }
  .chip{ background:#E0ECFB; color:var(--navy); border-radius:999px; padding:3px 4px 3px 10px; font-size:12px; font-weight:600; }
  .chip button{ background:none; border:none; cursor:pointer; color:var(--navy); font-weight:800; padding:0 6px; } .chip-wis{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; }
  .kolmenu{ position:absolute; top:36px; left:0; z-index:50; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.15); width:210px; }
  .kolmenu[hidden]{ display:none; } .kolmenu label{ display:flex; gap:7px; align-items:center; font-size:13px; padding:3px 0; cursor:pointer; }
  table.pt{ table-layout:fixed; } table.pt td{ overflow:hidden; text-overflow:ellipsis; } table.pt td.c-dots{ overflow:visible; padding-left:4px; padding-right:8px; }
  th.srt{ cursor:pointer; user-select:none; position:relative; white-space:nowrap; } th.srt.on{ color:var(--navy); }
  th .rs{ position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; } th .rs:hover{ background:rgba(31,56,100,.15); }
  tr.verl{ opacity:.55; }
  .bal{ display:inline-block; border-radius:6px; padding:2px 7px; font-size:11.5px; font-weight:700; }
  .b-ons{ background:#FEE2E2; color:#9b1c1c; } .b-adviseur{ background:#E0ECFB; color:#1F3864; } .b-klant{ background:#EEF2F8; color:#42506a; }
  .dg{ font-weight:700; } .d-ok{ color:#065f46; } .d-oranje{ color:#b5600a; } .d-rood{ color:#b91c1c; }
  .laat{ color:#b91c1c; font-weight:700; }
  .vr{ font-size:12px; color:var(--muted); text-decoration:none; white-space:nowrap; } .vr-open{ color:#b91c1c; font-weight:700; }
  .f-getekend{ background:#D1FAE5; color:#065f46; } .f-besproken,.f-offerte_ingeladen,.f-offerte_gevraagd{ background:#E0ECFB; color:#1F3864; } .pill[class*="f-"]{ background:#EEF2F8; color:#1F3864; }
  .pill.f-getekend{ background:#D1FAE5; color:#065f46; }
  .dots{ padding:4px 10px; font-size:15px; line-height:1; }
  .rmenu{ position:absolute; z-index:9000; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 34px rgba(0,0,0,.18); padding:6px; width:220px; }
  .rmenu a,.rmenu button{ display:block; width:100%; text-align:left; background:none; border:none; padding:8px 10px; font:inherit; font-size:13px; color:var(--navy2); text-decoration:none; border-radius:7px; cursor:pointer; }
  .rmenu a:hover,.rmenu button:hover{ background:#f2f7ff; } .rmenu hr{ border:none; border-top:1px solid var(--line); margin:4px 0; }
  .dl{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); margin-top:8px; } .dl input,.dl select{ border:1.5px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13.5px; }
  @media(max-width:1100px){ .kpi-funnel{ grid-template-columns:repeat(3,1fr); } .kpi-tiles{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:820px){ table,thead,tbody,th,td,tr{ display:block; } thead{ display:none; } tr{ border-bottom:1px solid var(--line); padding:6px 0; } td{ border:none; padding:5px 12px; } }
</style>

<body>
  <div class="top">
    <h1>📁 Projecten</h1>
    <div class="links">
      <span class="who" id="who"></span>
      <a href="/apps/groep.html" class="grp-link">👥 Groepen</a>
      <a href="/apps/rendementen.html" class="grp-link">📈 Rendementen</a>
      <a href="/apps/fluvius-acties.html">⚡ Acties</a>
      <a href="/apps/inbound-stats.html">📧 Factuurmails</a>
      <a href="/apps/mandaten.html">Mandaten</a>
      <a href="/apps/partners.html">🤝 Partners</a>
      <a href="/apps/mailtemplates.html">✉️ Mails</a>
      <a href="/apps/kamino.html">📊 Kamino</a>
      <a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a>
    </div>
  </div>
  <div class="wrap">
    <div id="kpi" class="kpi"></div>
    <div class="bar">
      <input type="search" id="zoek" placeholder="Zoek op naam, klant, adres, adviseur, bedrijf of project-ID…">
      <button class="btn ghost tg" id="bMijn" onclick="toggleFlt('mijn')" title="Enkel waar de bal bij jou ligt">👤 Mijn werk</button>
      <select id="fStatus" class="sel" onchange="V.flt.status=this.value;weergaveBewaar();render()"><option value="actief">actief</option><option value="on_hold">on hold</option><option value="verloren">verloren</option><option value="alles">alles</option></select>
      <select id="fAdv" class="sel" onchange="V.flt.adviseur=this.value;weergaveBewaar();render()"></select>
      <select id="fBedrijf" class="sel" onchange="V.flt.bedrijf=this.value;weergaveBewaar();render()"></select>
      <span style="position:relative"><button class="btn ghost" id="bKol" onclick="kolMenu(event)">Kolommen ▾</button><div id="kolMenu" class="kolmenu" hidden></div></span>
      <button class="btn ghost tg mgr-only" id="bSel" onclick="selModus()">Selecteren</button>
      <label class="mgr-only"><input type="checkbox" id="toonArchief"> archief</label>
      <span class="telling" id="telling"></span>
    </div>
    <div id="chips" class="chips"></div>
    <div class="bulk" id="bulk" hidden>
      <b id="bulkN">0 geselecteerd</b>
      <button class="btn warn" onclick="bulkArchiveer(true)">📦 Archiveer selectie</button>
      <button class="btn ghost" onclick="bulkArchiveer(false)">↩ Herstel selectie</button>
      <button class="btn ghost" onclick="bulkGroep()">👥 Groepeer selectie</button>
      <button class="btn ghost" onclick="selWis()">Selectie wissen</button>
      <span class="sub" id="bulkMsg"></span>
    </div>
    <div id="root"><div class="state">Laden…</div></div>
  </div>
  <div id="modal" class="m-overlay" style="display:none" onclick="_flxSluit()"></div>

  <script>
    var $ = function(id){ return document.getElementById(id); };
    var CFG=null, sb=null, SESSION=null, PROXY='', DATA=[], ZOEK='', ARCHIEF=false, EKBEZ=false, EKINP=false, SEL=new Set(), EANMAP={}, BEPERKT=false, IS_ADV=false, PM=null;   // v0.10.0: BEPERKT = geen manager → enkel eigen projecten, geen beheeracties
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function kort(iso){ try{ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d.getTime())) return '—'; var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear(); }catch(e){ return '—'; } }

    async function loadConfig(){ var r=await fetch('/api/config'); CFG=await r.json(); PROXY=(CFG.fluctusProxyUrl||'').replace(/\/+$/,''); }
    async function initAuth(){
      if(!CFG.supabaseUrl || !CFG.supabaseAnonKey){ $('root').innerHTML='<div class="fout">Supabase nog niet geconfigureerd op de server.</div>'; return; }
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      var d = await sb.auth.getSession(); SESSION = d.data.session;
      if(!SESSION){ window.location.href='https://www.energie-compas.eu/login'; return; }
      $('who').textContent = (SESSION.user && SESSION.user.email) || '';
      // v15-10 (Johan): de navigatieknoppen (Acties, Factuurmails, Mandaten, Partners, Mails, Kamino) enkel voor oekene;
      //   anderen zien enkel «← Naar MijnEC».
      try{ var _oek=String((SESSION.user && SESSION.user.email)||'').toLowerCase()==='oekene@gmail.com';
        document.querySelectorAll('.top .links a').forEach(function(a){ if(!a.classList.contains('mijnec-knop') && !a.classList.contains('grp-link')) a.style.display=_oek?'inline':'none'; }); }catch(eNav){}
      await laad();
    }
    async function authHeaders(){
      var tok = SESSION && SESSION.access_token;
      try{ if(sb){ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session){ SESSION=d.data.session; tok=SESSION.access_token; } } }catch(e){}
      return { 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' };
    }

    async function laad(){
      SEL.clear();
      $('root').innerHTML='<div class="state">Projecten laden…</div>';
      var r;
      try{ r = await fetch(PROXY+'/api/kamino/projecten-overzicht?_='+Date.now()+(ARCHIEF?'&archief=1':''), { headers: await authHeaders(), cache:'no-store' }); }
      catch(e){ $('root').innerHTML='<div class="fout">Kan de server niet bereiken: '+esc(e.message)+'</div>'; return; }
      if(r.status===403){ $('root').innerHTML='<div class="fout">Geen toegang.<br><a href="https://www.energie-compas.eu/login">← naar MijnEC</a></div>'; return; }
      if(r.status===401){ window.location.href='https://www.energie-compas.eu/login'; return; }
      if(!r.ok){ $('root').innerHTML='<div class="fout">Fout bij ophalen ('+r.status+').</div>'; return; }
      var j = await r.json(); DATA = (j&&j.projecten)||[];
      BEPERKT=!!(j&&j.beperkt); IS_ADV=!!(j&&j.adviseur); PM=(j&&j.partnermanager)||null;   // v0.10.0 (server ≥ 15.316.0) · v0.11.0: partnermanager via contract (server ≥ 15.317.0)
      document.querySelectorAll('.mgr-only').forEach(function(e){ e.style.display=BEPERKT?'none':''; });
      if(!window._vGeladen){ window._vGeladen=true; await weergaveLaden(); }   // v1.0.0: weergave per gebruiker
      syncBar();
      if(BEPERKT){ var zk=$('zoek'); if(zk) zk.placeholder='Zoek in je projecten…'; var h1=document.querySelector('.top h1'); if(h1) h1.textContent=PM?('📁 Projecten'+(PM.bedrijf?' — '+PM.bedrijf:'')):'📁 Mijn projecten'; render(); return; }
      // v0.4.0: EAN's per project ophalen (voor de actie-modal, dezelfde als in fluvius-acties). Los-entries mappen
      // op hun seed_project_id. Niet-blokkerend.
      EANMAP={};

        (SELMODE?'<th class="chk"><input type="checkbox" id="selAll" onclick="toggleAlle(this.checked)" title="Selecteer alle (gefilterde)"></th>':'')+
        cols.map(function(c){ var on=V.sort.k===c.k; return '<th style="width:'+(V.w[c.k]||c.w)+'px" onclick="sortOp(\''+c.k+'\')" class="srt'+(on?' on':'')+'">'+esc(c.t)+(on?(V.sort.dir>0?' ▲':' ▼'):'')+'<span class="rs" onmousedown="rsStart(event,\''+c.k+'\')" onclick="event.stopPropagation()"></span></th>'; }).join('')+
        '<th></th></tr></thead><tbody>';
      rows.forEach(function(p){
        var q=pr(p);
        h+='<tr class="'+(p.archief?'arch ':'')+(q.status==='verloren'?'verl ':'')+'">'+
          (SELMODE?'<td class="chk"><input type="checkbox" class="rowsel" '+(SEL.has(p.id)?'checked':'')+' onclick="toggleEen(\''+esc(p.id)+'\',this.checked)"></td>':'')+
          cols.map(function(c){ return '<td class="c-'+c.k+'">'+cel(p,c.k)+'</td>'; }).join('')+
          '<td class="c-dots"><button class="btn ghost dots" onclick="rijMenu(event,\''+esc(p.id)+'\')" title="Acties">⋯</button></td></tr>';
      });
      $('root').innerHTML=h+'</tbody></table>';
      syncSelAll(); updateBulk();
    }
    // ── menu per rij ──
    window.rijMenu=function(ev,id){
      ev.stopPropagation(); var old=document.querySelector('.rmenu'); if(old) old.remove();
      var p=projById(id); if(!p) return; var q=pr(p), tk=p.lead_token, it=[];
      if(tk){ it.push(['✍ Open invoer','href:/apps/ek.html?case='+encodeURIComponent(tk)+(BEPERKT&&!IS_ADV?'':'&adv=1&invoer=1')]); if(!BEPERKT||IS_ADV) it.push(['📈 Open resultaat','href:/apps/ek.html?case='+encodeURIComponent(tk)+'&adv=1']); }
      else if(!BEPERKT) it.push(['Open in Kamino','href:/apps/kamino.html?open='+encodeURIComponent(id)]);
      if(tk && !BEPERKT) it.push(['📜 Projectlog','hrefb:/apps/projectlog.html?token='+encodeURIComponent(tk)]);
      if(!BEPERKT) it.push(['⚡ Mandaat-acties','js:openProjectActies(\''+id+'\')']);
      if(tk && p.mag_stap){
        it.push(['—','']);
        if(q.status==='verloren'||q.status==='on_hold'||q.status==='wakker') it.push(['↩ Heropen','js:stapZet(\''+id+'\',\'heropend\')']);
        else {
          if(['offerte_gevraagd','offerte_ingeladen','besproken','getekend'].indexOf(q.fase)<0) it.push(['📩 Offerte gevraagd','js:stapZet(\''+id+'\',\'offerte_gevraagd\')']);
          if(['offerte_ingeladen','offerte_gevraagd'].indexOf(q.fase)>=0) it.push(['🗣 Besproken met klant','js:stapZet(\''+id+'\',\'besproken\')']);
          if(q.fase!=='getekend') it.push(['✍ Offerte getekend…','js:stapGetekend(\''+id+'\')']);
          if(q.fase==='getekend' && !q.factuur && !BEPERKT) it.push(['🧾 Gefactureerd…','js:stapFactuur(\''+id+'\')']);
          if(q.fase!=='getekend') { it.push(['⏸ On hold…','js:stapHold(\''+id+'\')']); it.push(['✖ Verloren…','js:stapVerloren(\''+id+'\')']); }
        }
      }
      if(!BEPERKT){ it.push(['—','']); it.push(p.archief?['↩ Herstel uit archief','js:archiveer(\''+id+'\',false)']:['📦 Archiveer','js:archiveer(\''+id+'\',true)']); }
      var m=document.createElement('div'); m.className='rmenu';
      m.innerHTML=it.map(function(x){ if(x[0]==='—') return '<hr>'; var a=x[1]; if(a.indexOf('href:')===0) return '<a href="'+esc(a.slice(5))+'">'+esc(x[0])+'</a>'; if(a.indexOf('hrefb:')===0) return '<a href="'+esc(a.slice(6))+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>'; return '<button onclick="document.querySelector(\'.rmenu\').remove();'+esc(a.slice(3))+'">'+esc(x[0])+'</button>'; }).join('');
      document.body.appendChild(m); var r=ev.target.getBoundingClientRect(); var mw=220;
      m.style.top=(window.scrollY+r.bottom+4)+'px'; m.style.left=Math.max(8,Math.min(window.innerWidth-mw-8, window.scrollX+r.right-mw))+'px';
    };
    // ── stappen ──
    async function stapPost(id, body){
      var p=projById(id); if(!p||!p.lead_token) return;
      body.token=p.lead_token;
      try{ var r=await fetch(PROXY+'/api/project/stap',{method:'POST',headers:await authHeaders(),body:JSON.stringify(body)}); var j=await r.json().catch(function(){return{};});
        if(!r.ok||!j.ok){ alert('Lukte niet: '+(j.error||r.status)); return false; }
        p.proces=j.proces||p.proces; try{ _flxSluit(); }catch(e){} render(); return true; }catch(e){ alert('Fout: '+e.message); return false; }
    }
    window.stapZet=function(id,stap){ stapPost(id,{stap:stap}); };
    function vandaag(){ var d=new Date(); return d.toISOString().slice(0,10); }
    function dlg(titel, body, knop, cb){
      var m=$('modal'); m.innerHTML='<div class="m-card" onclick="event.stopPropagation()"><div class="m-top"><span>'+esc(titel)+'</span><button class="m-x" onclick="_flxSluit()">✕</button></div>'+body+'<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="dlgOk">'+esc(knop)+'</button><button class="btn ghost" onclick="_flxSluit()">Annuleer</button></div><div class="sub" id="dlgSt"></div></div>';
      m.style.display='flex'; $('dlgOk').onclick=cb;
    }
    function veld(lab,html){ return '<label class="dl"><span>'+esc(lab)+'</span>'+html+'</label>'; }
    window.stapGetekend=function(id){
      var p=projById(id), sc=(p&&p.scope)||{}, o=sc.offerte||{};
      dlg('Offerte getekend — '+(p?p.naam:''), '<div class="sub" style="margin-bottom:8px">Dit is het factuurmoment voor de no-cure-no-pay-vergoeding'+(p&&p.vergoeding&&p.vergoeding.bedrag?(' ('+eur(p.vergoeding.bedrag)+', '+esc(p.vergoeding.soort)+', contract '+esc(p.vergoeding.partner)+')'):'')+'.</div>'+
        veld('Datum van ondertekening','<input type="date" id="dD" value="'+vandaag()+'">')+veld('Welke offerte (installateur / referentie)','<input id="dO" value="'+esc(o.installateur||'')+'">')+veld('Bedrag excl. btw (€)','<input id="dB" inputmode="numeric" value="'+esc(o.totaal||'')+'">')+
        '<div class="dl"><span>Wat</span><label><input type="checkbox" id="cB" '+(+sc.batt_kwh>0||+o.batt_kwh>0?'checked':'')+'> batterij</label> <label><input type="checkbox" id="cP" '+(+sc.pv_kwp>0||+o.pv_kwp>0?'checked':'')+'> zonnepanelen</label> <label><input type="checkbox" id="cL"> laadpalen</label></div>',
        'Bewaar', function(){ stapPost(id,{stap:'getekend',datum:$('dD').value,offerte:$('dO').value,bedrag:$('dB').value,componenten:{batterij:$('cB').checked,pv:$('cP').checked,laadpalen:$('cL').checked}}); });
    };
    window.stapFactuur=function(id){ var p=projById(id); dlg('Gefactureerd — '+(p?p.naam:''), veld('Factuurdatum','<input type="date" id="dD" value="'+vandaag()+'">')+veld('Factuurnummer','<input id="dN">')+veld('Bedrag excl. btw (€)','<input id="dB" inputmode="numeric" value="'+esc((p&&p.vergoeding&&p.vergoeding.bedrag)||'')+'">'), 'Bewaar', function(){ stapPost(id,{stap:'gefactureerd',datum:$('dD').value,factuurnr:$('dN').value,bedrag:$('dB').value}); }); };
    window.stapHold=function(id){ var p=projById(id), d=new Date(Date.now()+30*864e5).toISOString().slice(0,10); dlg('On hold — '+(p?p.naam:''), veld('Wekdatum (dan komt het project terug op de lijst)','<input type="date" id="dW" value="'+d+'">')+veld('Notitie','<input id="dT">'), 'Bewaar', function(){ stapPost(id,{stap:'on_hold',wekdatum:$('dW').value,notitie:$('dT').value}); }); };
    window.stapVerloren=function(id){ var p=projById(id), R=['prijs','rendement te laag','geen budget','concurrent','geen reactie','technisch niet haalbaar','andere'];
      dlg('Verloren — '+(p?p.naam:''), veld('Reden','<select id="dR">'+R.map(function(x){ return '<option>'+esc(x)+'</option>'; }).join('')+'</select>')+veld('Notitie','<input id="dT">'), 'Bewaar', function(){ stapPost(id,{stap:'verloren',reden:$('dR').value,notitie:$('dT').value}); }); };
    window.selModus=function(){ SELMODE=!SELMODE; if(!SELMODE) SEL.clear(); var b=$('bSel'); if(b) b.classList.toggle('on',SELMODE); render(); };
    // ── Selectie + bulk-archief ──
    function toggleEen(id, on){ if(on) SEL.add(id); else SEL.delete(id); syncSelAll(); updateBulk(); }
    function toggleAlle(on){ GEFILTERD.forEach(function(id){ if(on) SEL.add(id); else SEL.delete(id); }); render(); }
    function selWis(){ SEL.clear(); render(); }
    function syncSelAll(){
      var m=$('selAll'); if(!m) return;
      var n=GEFILTERD.filter(function(id){ return SEL.has(id); }).length;
      m.checked = n>0 && n===GEFILTERD.length;
      m.indeterminate = n>0 && n<GEFILTERD.length;
    }
    function updateBulk(){
      var n=SEL.size, bar=$('bulk'); if(bar) bar.hidden = (n===0);
      var l=$('bulkN'); if(l) l.textContent = n+' geselecteerd';
    }
    // v1.1.0 (Johan 17-10): GROEPSDOSSIER — geselecteerde projecten als één groep (server ≥ 15.330.0) → groep.html
    async function bulkGroep(){
      var ids=GEFILTERD.filter(function(id){ return SEL.has(id); }), tok=[], eerste='';
      ids.forEach(function(id){ var p=projById(id); if(p&&p.lead_token){ tok.push(p.lead_token); if(!eerste) eerste=(p.klant||p.naam||''); } });
      if(tok.length<2){ $('bulkMsg').textContent='Kies minstens twee projecten met een dossier.'; return; }
      var nm=prompt('Naam van de groep ('+tok.length+' dossiers)', String(eerste).replace(/[_\s-]*\d+\w*$/,'').trim()); if(!nm) return;
      $('bulkMsg').textContent='⏳ Groep maken…';
      try{ var r=await fetch(PROXY+'/api/groep/zet',{ method:'POST', headers:await authHeaders(), body:JSON.stringify({ naam:nm, klant:eerste, tokens:tok }) }); var j=await r.json().catch(function(){ return {}; });
        if(!r.ok||!j.ok) throw new Error(j.error||('fout '+r.status)); location.href='/apps/groep.html?id='+encodeURIComponent(j.groep.id); }
      catch(e){ $('bulkMsg').textContent='⚠ '+e.message; }
    }
    async function bulkArchiveer(archived){
      var ids = Array.from(SEL); if(!ids.length) return;
      if(archived && !confirm(ids.length+' project'+(ids.length===1?'':'en')+' archiveren? Ze verdwijnen uit het actieve overzicht (herstelbaar via "toon archief").')) return;
      if(!archived && !confirm(ids.length+' project'+(ids.length===1?'':'en')+' herstellen uit het archief?')) return;
      var msg=$('bulkMsg'), ok=0, fout=0;
      for(var i=0;i<ids.length;i++){
        if(msg) msg.textContent='Bezig… '+(i+1)+'/'+ids.length;
        try{
          var r=await fetch(PROXY+'/api/kamino/archiveer',{ method:'POST', headers: await authHeaders(), body: JSON.stringify({ id:ids[i], archived:archived }) });
          if(r.ok) ok++; else fout++;
        }catch(e){ fout++; }
      }
      if(msg) msg.textContent='✓ '+ok+' verwerkt'+(fout?(' · '+fout+' mislukt'):'');
      SEL.clear(); await laad();
    }
    // ── Project-actie-modal (gedeeld met fluvius-acties via FLXModal) ──
    function projById(id){ for(var i=0;i<DATA.length;i++) if(DATA[i].id===id) return DATA[i]; return null; }
    window.openProjectActies=function(id){
      var p=projById(id); if(!p) return;
      var eans=EANMAP[id]||[];
      var m=$('modal'); if(!m) return;
      var h='<div class="m-card" onclick="event.stopPropagation()">'+
        '<div class="m-top"><span>'+esc(p.naam)+'</span><button class="m-x" onclick="_flxSluit()">✕</button></div>'+
        '<div class="sub" style="margin:2px 0 10px"><span class="code">'+esc(p.id)+'</span>'+(p.klant?(' · '+esc(p.klant)):'')+(p.partner?(' · '+esc(p.partner)):'')+'</div>';
      if(p.lead_token) h+='<a class="m-act" href="/apps/ek.html?case='+encodeURIComponent(p.lead_token)+'&adv=1&invoer=1" target="_blank" rel="noopener" style="text-decoration:none">✍ Open invoer in Energie-Compas</a>'+
                         '<a class="m-act" href="/apps/ek.html?case='+encodeURIComponent(p.lead_token)+'&adv=1" target="_blank" rel="noopener" style="text-decoration:none">📈 Open resultaat in Energie-Compas</a>';
      if(eans.length){
        h+='<div class="sub" style="margin:12px 0 4px;font-weight:700;color:var(--navy2)">Mandaat-acties per EAN</div>';
        eans.forEach(function(en,i){
          var _kw=(en.status==='actief' && !en.kwartierdata_aanwezig)?' · <span style="color:#b5600a">📥 kwartierdata op te halen</span>':'';
          h+='<button class="m-act" onclick="eanActie(\''+esc(id)+'\','+i+')"><b>'+esc(en.status)+'</b> · <span class="code">'+esc(en.ean)+'</span>'+(en.richting?(' · '+esc(en.richting)):'')+_kw+' — acties…</button>';
        });
      } else {
        var _fe=(p.factuur_eans||[]);
        h+= (_fe.length
              ? '<div class="sub" style="margin:12px 0 4px">EAN uit factuur: '+_fe.map(function(x){return '<span class="code">'+esc(x.ean)+'</span>'+(x.richting?(' ('+esc(x.richting)+')'):'');}).join(', ')+'</div>'
              : '<div class="sub" style="margin:12px 0 4px">Nog geen mandaat gekoppeld · geen EAN uit de factuur.</div>')+
           '<button class="m-act" onclick="mandaatWachtrij(\''+esc(id)+'\')">➕ Zet mandaat-aanvraag in wachtrij'+(_fe.length?(' ('+_fe.length+' EAN)'):'')+'</button>'+
           '<button class="m-act" onclick="_flxOpenFluvius(FLXModal.AANVRAAG,\''+esc(p.naam||'Mijn Fluvius')+'\')">📶 Open Mijn Fluvius — mandaat aanvragen</button>';
      }
      h+=(p.archief
        ? '<button class="m-act" onclick="archiveer(\''+esc(id)+'\',false)">↩ Herstel uit archief</button>'
        : '<button class="m-act danger" onclick="archiveer(\''+esc(id)+'\',true)">📦 Archiveer project</button>');
      h+='</div>';
      m.innerHTML=h; m.style.display='flex';
    };
    window.eanActie=function(id,i){ var arr=EANMAP[id]||[]; if(arr[i]) FLXModal.open(arr[i]); };
    // v0.6.1 (Johan): mandaat-aanvraag in de server-wachtrij → nadien "werk de Fluvius-wachtrij af" (Claude drijft Mijn Fluvius).
    //   EAN('s) komen uit de factuur (p.factuur_eans, server v15.237); geen factuur-EAN → prompt-fallback.
    window.mandaatWachtrij=async function(id){
      var p=projById(id);
      var items=((p&&p.factuur_eans)||[]).map(function(x){return {ean:String((x&&x.ean)||'').replace(/\D/g,''), richting:(x&&x.richting)||null};}).filter(function(x){return /^\d{18}$/.test(x.ean);});
      if(items.length){
        if(!confirm('Mandaat aanvragen voor '+items.length+' EAN uit de factuur:\n'+items.map(function(x){return x.ean+(x.richting?(' ('+x.richting+')'):'');}).join('\n'))) return;
      } else {
        var ean=(prompt('Geen EAN uit de factuur gevonden. Geef de EAN (18 cijfers):')||'').replace(/\D/g,'');
        if(!ean) return;
        if(!/^\d{18}$/.test(ean)){ alert('Een EAN telt 18 cijfers.'); return; }
        items=[{ean:ean, richting:null}];
      }
      try{
        var r=await fetch(PROXY+'/api/mandaat/aanvraag',{ method:'POST', headers: await authHeaders(), body: JSON.stringify({ project_id:id, eans:items }) });
        var j=await r.json().catch(function(){return {};});
        if(!r.ok){ alert('Kon niet in wachtrij zetten: '+(j.error||r.status)); return; }
        alert('✔ In de Fluvius-wachtrij gezet'+(j.nieuw!=null?(' ('+j.nieuw+' nieuw'+(j.gekoppeld?', '+j.gekoppeld+' gekoppeld':'')+')'):'')+'. Vraag Claude: "werk de Fluvius-wachtrij af".');
        try{ _flxSluit(); }catch(e){}
        await laad();
      }catch(e){ alert('Fout: '+e.message); }
    };
    window.archiveer = async function(id, archived){
      if(archived && !confirm('Project '+id+' archiveren? Het verdwijnt uit het actieve overzicht (herstelbaar via "toon archief").')) return;
      try{
        var r=await fetch(PROXY+'/api/kamino/archiveer',{ method:'POST', headers: await authHeaders(), body: JSON.stringify({ id:id, archived:archived }) });
        if(!r.ok){ var j=await r.json().catch(function(){return {};}); alert('Kon niet: '+(j.error||r.status)); return; }
        try{ _flxSluit(); }catch(e){}
        await laad();
      }catch(e){ alert('Fout: '+e.message); }
    };

    window.addEventListener('DOMContentLoaded', async function(){
      $('zoek').addEventListener('input', function(){ ZOEK=this.value.trim().toLowerCase(); render(); });
      $('toonArchief').addEventListener('change', function(){ ARCHIEF=this.checked; laad(); });
      try{ await loadConfig(); FLXModal.init({proxy:PROXY, authHeaders:authHeaders, onDone:laad}); await initAuth(); }
      catch(e){ $('root').innerHTML='<div class="fout">Init-fout: '+esc(e.message)+'</div>'; }
    });
  </script>
</body>
</html>
