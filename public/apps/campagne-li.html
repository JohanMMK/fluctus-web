<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campagne LinkedIn · Energie-Compas</title>
<link rel="icon" href="/favicon-ec.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-ec-32.png">
<!-- campagne-li.html v1.2.0 (2026-10-30, Johan): tab «Bereik» — webstatistiek energie-compas.eu zonder cookies (bezoekers, herkomst, knopkliks per pagina en per post; server ≥ 15.365.0). Eigen posts linken naar de blog met ?s=li-<post-id>. -->
<!-- campagne-li.html v1.1.1 (2026-10-26, Johan): knop «✔ Gepost» → «Markeer als gepost» (het is een actie, geen status). -->
<!-- campagne-li.html v1.1.0 (2026-10-24, Johan): posts standaard 11:00; knop «← Naar MijnEC»; instelling «ambassadeurs automatisch elke week» (server ≥ 15.352.0).
     campagne-li.html v1.0.0 (2026-10-24, Johan): CAMPAGNE LINKEDIN «Bedankt om het net beter te gebruiken» — campagnedashboard.
     Vandaag (wat posten, tekst/foto/eerste reactie kopiëren, blog publiceren, afvinken), Kalender, Blogs (energie-compas.eu/blog),
     Ambassadeurs (uitnodiging + weekbericht per mail), Bronnen (curatie: mail naar dossier@ met onderwerp «bron …»),
     Acties (klikken, gepost-meldingen → «reageer nu»), Instellingen. Enkel managers. Server ≥ 15.351.0 (/api/campagne/li*). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/apps/mijnec-knop.js?v=1.0.1"></script>
<style>
  :root{--ink:#14203a;--ink2:#54617a;--muted:#8a94a6;--line:#e6eaf1;--soft:#f5f8fc;--green:#05b050;--green-d:#048443;--green-bg:#e6f6ec;--amber:#B45309;--amber-bg:#FFF4DE;--red:#c0392b;--blue:#0A66C2}
  *{box-sizing:border-box} body{margin:0;background:var(--soft);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header b{font-size:16px} .who{margin-left:auto;color:var(--muted);font-size:12px} .sub{color:var(--muted);font-size:12px}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
  nav.tabs button{border-radius:999px;padding:7px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit}
  nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tel{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:4px;text-align:center}
  main{max-width:1250px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  .rij{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .rij label,label.blok{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{width:100%;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.groen{background:var(--green);border-color:var(--green);color:#fff;font-weight:600} button.groen:hover{background:var(--green-d)}
  button.li{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.klein{padding:4px 10px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  .wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%} th,td{padding:7px 10px;border-bottom:1px solid #EEF2F7;text-align:left;font-size:13px;vertical-align:top}
  thead th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
  .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .st-ok{background:var(--green-bg);color:var(--green-d)} .st-nee{background:#F1F3F7;color:var(--ink2)} .st-fout{background:#FDECEC;color:var(--red)} .st-am{background:var(--amber-bg);color:var(--amber)}
  .msg{font-size:13px;min-height:1.2em} .ok{color:var(--green-d)} .err{color:var(--red)}
  .post{display:grid;grid-template-columns:300px 1fr;gap:16px} @media(max-width:760px){.post{grid-template-columns:1fr}}
  .post img{width:100%;border-radius:10px;display:block}
  pre.tx{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:13.5px/1.5 inherit;font-family:inherit}
  .reactie{background:var(--green-bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px;word-break:break-word}
  .knoppen{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .kop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px} .kop b{font-size:15px}
  .dag{font-weight:700;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
  .leeg{color:var(--muted);padding:14px}
  .fout{background:#FEF2F2;border:1px solid #F2C7C7;color:#8a1f1f;padding:12px;border-radius:10px}
  .state{color:var(--muted);padding:20px}
  .actie-open{background:#FFF8EC}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;display:none;z-index:60}
  a{color:#2a44a8}
</style>
</head>
<body>
<header><b>📅 Campagne LinkedIn</b><span class="sub">Bedankt om het net beter te gebruiken</span><span class="who" id="who"></span><a class="mijnec-knop" href="https://www.energie-compas.eu/login">← Naar MijnEC</a></header>
<nav class="tabs" id="tabs"></nav>
<main><div id="root"><div class="state">Laden…</div></div></main>
<div id="toast"></div>
<script>
  var $=function(id){return document.getElementById(id);};
  var sb=null, SESSION=null, PROXY='', D=null, TAB='vandaag', SEL=new Set(), BLOG=null, POLL=null;
  var WWW='https://www.energie-compas.eu';
  try{ TAB=localStorage.getItem('cli-tab')||'vandaag'; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function p2(n){ return (n<10?'0':'')+n; }
  function dt(ts){ var d=new Date(+ts); if(isNaN(d.getTime())) return ''; return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
  var DAGEN=['zo','ma','di','wo','do','vr','za'];
  function dagLabel(iso){ if(!iso) return '—'; var d=new Date(iso+'T12:00:00'); return DAGEN[d.getDay()]+' '+p2(d.getDate())+'/'+p2(d.getMonth()+1); }
  function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(function(){ e.style.display='none'; },2200); }
  async function hdr(){ try{ var d=await sb.auth.getSession(); if(d&&d.data&&d.data.session) SESSION=d.data.session; }catch(e){} return { 'Authorization':'Bearer '+(SESSION&&SESSION.access_token), 'Content-Type':'application/json' }; }
  async function api(pad, body){ var r=await fetch(PROXY+pad,{ method:body?'POST':'GET', headers:await hdr(), body:body?JSON.stringify(body):undefined, cache:'no-store' }); var j=await r.json().catch(function(){return{};}); if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
  async function zet(pad, body, melding){ try{ var j=await api(pad, body); if(j.posts) D=j; render(); if(melding) toast(melding); return j; }catch(e){ toast('Fout: '+e.message); throw e; } }
  function blogUrl(slug){ return WWW+'/blog/'+encodeURIComponent(slug||''); }
  function vul(t,p){ return String(t||'').replace(/\{blog\}/g, p&&p.blog?blogUrl(p.blog)+(p.id?'?s=li-'+encodeURIComponent(p.id):''):WWW+'/blog'); }
  function absB(b){ return b||''; }   // relatief pad: zelfde server (www. of app.)
  async function kopieer(t,m){ try{ await navigator.clipboard.writeText(t); toast(m||'Gekopieerd'); }catch(e){ prompt('Kopieer:',t); } }
  async function kopieerFoto(url){
    if(!url){ toast('Geen banner'); return; }
    try{ var r=await fetch(url,{cache:'no-store'}); var b=await r.blob(); var img=await createImageBitmap(b); var c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0);
      var png=await new Promise(function(ok){ c.toBlob(ok,'image/png'); }); await navigator.clipboard.write([new ClipboardItem({'image/png':png})]); toast('Foto gekopieerd: plak met Ctrl/Cmd+V'); }
    catch(e){ window.open(url,'_blank'); toast('Kopiëren lukte niet: foto geopend in een nieuw tabblad'); }
  }
  function posts(){ return Object.values(D.posts||{}).sort(function(a,b){ return String(a.datum||'9').localeCompare(String(b.datum||'9'))||String(a.uur||'').localeCompare(String(b.uur||''))||String(a.id).localeCompare(String(b.id)); }); }
  function openActies(){ return (D.acties||[]).filter(function(a){ return !a.afgehandeld; }); }
  function nieuweBronnen(){ return (D.bronnen||[]).filter(function(b){ return b.status==='nieuw'; }); }
  var TABS=[['vandaag','Vandaag'],['kalender','Kalender'],['blogs','Blogs'],['amb','Ambassadeurs'],['bronnen','Bronnen'],['acties','Acties'],['bereik','Bereik'],['inst','Instellingen']];
  function renderTabs(){
    var na=openActies().length, nb=nieuweBronnen().length;
    $('tabs').innerHTML=TABS.map(function(t){ var n=t[0]==='acties'?na:(t[0]==='bronnen'?nb:0); return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+(n?'<span class="tel">'+n+'</span>':'')+'</button>'; }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){ b.onclick=function(){ TAB=b.getAttribute('data-tab'); BLOG=null; try{localStorage.setItem('cli-tab',TAB);}catch(e){} render(); }; });
  }
  function render(){
    renderTabs();
    if(!D.posts||!Object.keys(D.posts).length){ $('root').innerHTML='<div class="card"><h3>Nog geen campagne-inhoud</h3><p>Laad de startinhoud: 26 berichten (2 basisberichten + 24 uit de planning) met datum, tekst, eerste reactie en ambassadeurstekst, en 26 blogs (2 uitgeschreven, 24 als concept).</p><button class="groen" id="seed">Startinhoud laden</button><div class="msg" id="seed-msg"></div></div>';
      $('seed').onclick=laadSeed; return; }
    var f={vandaag:rVandaag,kalender:rKalender,blogs:rBlogs,amb:rAmb,bronnen:rBronnen,acties:rActies,bereik:rBereik,inst:rInst}[TAB]||rVandaag; f();
  }
  async function laadSeed(){ this.disabled=true; try{ var r=await fetch('/apps/campagne-li-seed.json',{cache:'no-store'}); var data=await r.json(); await zet('/api/campagne/li/seed',{data:data},'Startinhoud geladen'); }catch(e){ $('seed-msg').textContent='Fout: '+e.message; this.disabled=false; } }

  // ── Vandaag ──
  function postKaart(p, groot){
    var blog=p.blog?D.blogs[p.blog]:null, bpub=blog&&blog.status==='gepubliceerd';
    var reactie=vul(p.reactie||'Meer hierover: {blog}',p);
    var st=p.status==='gepost'?'<span class="st st-ok">✔ gepost '+esc(dt(p.gepost_ts))+'</span>':(p.status==='idee'?'<span class="st st-nee">idee</span>':'<span class="st st-am">gepland</span>');
    var h='<div class="card"><div class="post"><div>'+(p.banner?'<img src="'+esc(absB(p.banner))+'" alt="">':'<div class="leeg">geen banner</div>')+
      '<div class="knoppen"><button class="klein" data-foto="'+esc(p.banner||'')+'">📋 Kopieer foto</button><a class="klein" href="'+esc(absB(p.banner))+'" download target="_blank">⬇ Bewaar</a></div></div><div>'+
      '<div class="kop"><b>'+esc(p.titel||p.id)+'</b>'+st+'<span class="sub">'+esc(dagLabel(p.datum))+' '+esc(p.uur||'')+' · '+esc(p.doelgroep==='adviseur'?'voor adviseurs':(p.doelgroep==='kmo'?'voor KMO\'s':'algemeen'))+(p.amb_tekst?' · ook naar ambassadeurs':'')+'</span></div>'+
      '<pre class="tx">'+esc(p.tekst||'')+'</pre>'+
      '<div class="knoppen"><button class="klein" data-kop="tekst" data-id="'+esc(p.id)+'">📋 Kopieer tekst</button><button class="klein li" data-li="'+esc(p.id)+'">Open LinkedIn met tekst</button>'+(D.config.pagina_url?'<a class="klein" href="'+esc(D.config.pagina_url)+'" target="_blank" rel="noopener">Bedrijfspagina</a>':'')+'</div>'+
      '<div style="margin-top:8px"><b style="font-size:12px;color:var(--ink2)">EERSTE REACTIE</b><div class="reactie">'+esc(reactie)+'</div>'+
      '<div class="knoppen"><button class="klein" data-kop="reactie" data-id="'+esc(p.id)+'">📋 Kopieer eerste reactie</button>'+
      (blog?(bpub?'<span class="st st-ok">blog gepubliceerd</span> <a class="klein" href="'+esc(blogUrl(p.blog))+'" target="_blank">bekijk</a>':'<span class="st st-fout">blog nog niet gepubliceerd</span> <button class="klein groen" data-pub="'+esc(p.blog)+'">Publiceer blog</button> <button class="klein" data-blog="'+esc(p.blog)+'">Bewerk blog</button>'):'<span class="st st-nee">geen blog</span>')+'</div></div>'+
      '<div class="rij" style="margin-top:10px">'+
      (p.status!=='gepost'?'<label>Na het posten: plak de link van je post (optioneel)<input id="url-'+esc(p.id)+'" placeholder="https://www.linkedin.com/posts/…" style="min-width:260px" value="'+esc(p.li_url||'')+'"></label><button class="groen" data-gepost="'+esc(p.id)+'" title="Klik nadat je de post op LinkedIn plaatste">Markeer als gepost</button>'
        :('<span class="sub">'+(p.li_url?'<a href="'+esc(p.li_url)+'" target="_blank" rel="noopener">post openen</a>':'geen link')+'</span>'+
          (p.reactie_ts?'<span class="st st-ok">✔ eerste reactie geplaatst</span>':'<button class="groen klein" data-reactie="'+esc(p.id)+'">✔ Eerste reactie geplaatst</button>')+
          '<button class="klein" data-ongepost="'+esc(p.id)+'">ongedaan</button>'))+
      '</div></div></div></div>';
    return h;
  }
  function bedraadPosts(){
    var R=$('root');
    Array.prototype.forEach.call(R.querySelectorAll('[data-foto]'),function(b){ b.onclick=function(){ kopieerFoto(b.getAttribute('data-foto')); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-kop]'),function(b){ b.onclick=function(){ var p=D.posts[b.getAttribute('data-id')]; if(b.getAttribute('data-kop')==='tekst') kopieer(p.tekst,'Tekst gekopieerd'); else kopieer(vul(p.reactie||'Meer hierover: {blog}',p),'Eerste reactie gekopieerd'); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-li]'),function(b){ b.onclick=function(){ var p=D.posts[b.getAttribute('data-li')]; var u='https://www.linkedin.com/feed/?shareActive=true&text='+encodeURIComponent(p.tekst||'');
      kopieerFoto(p.banner||'').then(function(){ var w=window.open(u,'_blank'); if(!w){ var a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener'; a.textContent='LinkedIn openen'; a.className='klein'; b.after(a); toast('Pop-up geblokkeerd: klik «LinkedIn openen»'); } }); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-pub]'),function(b){ b.onclick=function(){ zet('/api/campagne/li/blog',{slug:b.getAttribute('data-pub'),publiceer:true},'Blog gepubliceerd'); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-blog]'),function(b){ b.onclick=function(){ TAB='blogs'; BLOG=b.getAttribute('data-blog'); render(); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-gepost]'),function(b){ b.onclick=function(){ var id=b.getAttribute('data-gepost'); var u=($('url-'+id)||{}).value||''; zet('/api/campagne/li/post',{id:id,gepost:true,li_url:u},'Gemarkeerd als gepost — zet nu de eerste reactie'); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-reactie]'),function(b){ b.onclick=function(){ zet('/api/campagne/li/post',{id:b.getAttribute('data-reactie'),reactie_geplaatst:true},'Afgevinkt'); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-ongepost]'),function(b){ b.onclick=function(){ zet('/api/campagne/li/post',{id:b.getAttribute('data-ongepost'),gepost:false,reactie_geplaatst:false}); }; });
  }
  function rVandaag(){
    var nu=D.nu.datum, ps=posts();
    var vandaag=ps.filter(function(p){ return p.datum===nu; });
    var achter=ps.filter(function(p){ return p.datum&&p.datum<nu&&p.status!=='gepost'&&p.status!=='idee'; });
    var grens=new Date(nu+'T12:00:00'); grens.setDate(grens.getDate()+7); var g=grens.toISOString().slice(0,10);
    var komend=ps.filter(function(p){ return p.datum>nu&&p.datum<=g; });
    var na=openActies(), nb=nieuweBronnen();
    var h='';
    if(na.length||nb.length) h+='<div class="card" style="border-color:#F2C77B;background:#FFFBF2"><b>Te doen:</b> '+(na.length?'<a href="#" id="ga-acties">'+na.length+' open actie(s) van ambassadeurs</a>':'')+(na.length&&nb.length?' · ':'')+(nb.length?'<a href="#" id="ga-bronnen">'+nb.length+' nieuwe bron(nen)</a>':'')+'</div>';
    h+='<div class="dag">Vandaag · '+esc(dagLabel(nu))+'</div>';
    h+=vandaag.length?vandaag.map(function(p){return postKaart(p,true);}).join(''):'<div class="card leeg">Vandaag staat er niets op de planning.</div>';
    if(achter.length){ h+='<div class="dag" style="color:var(--red)">Achterstand: gepland maar niet als gepost gemarkeerd</div>'+achter.map(function(p){return postKaart(p);}).join(''); }
    h+='<div class="dag">De komende 7 dagen</div>';
    h+=komend.length?komend.map(function(p){return postKaart(p);}).join(''):'<div class="card leeg">Niets gepland.</div>';
    $('root').innerHTML=h; bedraadPosts();
    if($('ga-acties')) $('ga-acties').onclick=function(e){ e.preventDefault(); TAB='acties'; render(); };
    if($('ga-bronnen')) $('ga-bronnen').onclick=function(e){ e.preventDefault(); TAB='bronnen'; render(); };
  }

  // ── Kalender ──
  function rKalender(){
    var ps=posts(), nu=D.nu.datum;
    var h='<div class="card"><h3>Kalender</h3><p class="sub">Datum en uur zijn aan te passen (bv. kerstvakantie overslaan). Op de dag zelf krijg je 15 minuten vooraf een mail met tekst, foto en eerste reactie. Klik een titel om tekst en ambassadeurstekst te bewerken.</p>'+
      '<div class="knoppen"><button class="klein" id="extra">➕ Extra bericht (bv. uit een bron)</button></div></div>';
    h+='<div class="wrap"><table><thead><tr><th>Datum</th><th>Uur</th><th>Bericht</th><th>Voor</th><th>Blog</th><th>Ambassadeurs</th><th>Status</th></tr></thead><tbody>';
    ps.forEach(function(p){
      var blog=p.blog?D.blogs[p.blog]:null;
      h+='<tr'+(p.datum===nu?' style="background:#F2FBF5"':'')+'><td><input type="date" data-dat="'+esc(p.id)+'" value="'+esc(p.datum||'')+'"></td><td><input type="time" data-uur="'+esc(p.id)+'" value="'+esc(p.uur||'11:00')+'" style="width:96px"></td>'+
        '<td><a href="#" data-ed="'+esc(p.id)+'"><b>'+esc(p.titel||p.id)+'</b></a><div class="sub">'+esc(p.id)+'</div></td><td>'+esc(p.doelgroep||'')+'</td>'+
        '<td>'+(blog?(blog.status==='gepubliceerd'?'<span class="st st-ok">online</span>':(blog.tekst?'<span class="st st-am">klaar, niet online</span>':'<span class="st st-nee">te schrijven</span>')):'—')+'</td>'+
        '<td>'+(p.amb_tekst?'<span class="st st-ok">ja</span>':'—')+'</td>'+
        '<td>'+(p.status==='gepost'?'<span class="st st-ok">gepost</span>'+(p.reactie_ts?' <span class="sub">+ reactie</span>':''):(p.status==='idee'?'<span class="st st-nee">idee</span>':'<span class="st st-am">gepland</span>'))+'</td></tr>'+
        '<tr id="ed-'+esc(p.id)+'" style="display:none"><td colspan="7"><div class="grid2">'+
        '<label class="blok">Titel<input data-f="titel" value="'+esc(p.titel||'')+'"></label><label class="blok">Status<select data-f="status"><option'+(p.status==='idee'?' selected':'')+'>idee</option><option'+(p.status==='gepland'?' selected':'')+'>gepland</option><option'+(p.status==='gepost'?' selected':'')+'>gepost</option></select></label>'+
        '<label class="blok">Tekst (max. 6 regels)<textarea data-f="tekst" rows="7">'+esc(p.tekst||'')+'</textarea></label><label class="blok">Eerste reactie ({blog} = link naar de blog)<textarea data-f="reactie" rows="3">'+esc(p.reactie||'')+'</textarea>'+

      var li=0; Object.keys(S.bronnen).forEach(function(b){ if(b==='linkedin'||/^li-/.test(b)) li+=S.bronnen[b]; });
      h+='<div class="card"><div style="display:flex;gap:24px;flex-wrap:wrap">'+[[tb,'bezoekers (som per dag)'],[tw,'paginaweergaven'],[li,'weergaven via LinkedIn'],[tk,'knopkliks']].map(function(x){ return '<div><div style="font-size:26px;font-weight:700">'+x[0]+'</div><div class="sub">'+x[1]+'</div></div>'; }).join('')+'</div></div>';
      var mx=Math.max(1,Math.max.apply(null,S.dagen.map(function(d){return d.bezoekers;})));
      h+='<div class="card"><h3>Per dag</h3><table><tr><th>Dag</th><th>Bezoekers</th><th style="width:45%"></th><th>Weergaven</th><th>Kliks</th></tr>'+S.dagen.slice().reverse().map(function(d){ return '<tr><td>'+dagLabel(d.datum)+'</td><td>'+d.bezoekers+'</td><td><div style="background:var(--green-bg);height:10px;border-radius:5px;width:'+Math.round(d.bezoekers/mx*100)+'%"></div></td><td>'+d.weergaven+'</td><td>'+d.kliks+'</td></tr>'; }).join('')+'</table></div>';
      var posts=Object.keys(S.bronnen).filter(function(b){ return /^li-/.test(b); }).sort(function(a,b){ return S.bronnen[b]-S.bronnen[a]; });
      h+='<div class="card"><h3>Per LinkedIn-post</h3><p class="sub">Bezoeken via de bloglink in de eerste reactie van onze eigen posts.</p>'+(posts.length?'<table><tr><th>Post</th><th>Weergaven</th></tr>'+posts.map(function(b){ return '<tr><td>'+esc(bronLabel(b))+'</td><td>'+S.bronnen[b]+'</td></tr>'; }).join('')+'</table>':'<p class="sub">Nog geen bezoek via een postlink.</p>')+'</div>';
      var bron=Object.keys(S.bronnen).filter(function(b){ return !/^li-/.test(b); }).sort(function(a,b){ return S.bronnen[b]-S.bronnen[a]; });
      h+='<div class="card"><h3>Herkomst</h3>'+(bron.length?'<table><tr><th>Bron</th><th>Weergaven</th></tr>'+bron.map(function(b){ return '<tr><td>'+esc(bronLabel(b))+'</td><td>'+S.bronnen[b]+'</td></tr>'; }).join('')+'</table>':'<p class="sub">Nog geen bezoek.</p>')+'</div>';
      h+='<div class="card"><h3>Per pagina</h3>'+(S.paginas.length?'<table><tr><th>Pagina</th><th>Weergaven</th><th>Uniek</th><th>Kliks</th><th>Belangrijkste bron</th></tr>'+S.paginas.map(function(p){ var kl=Object.keys(p.knop).map(function(k){ return esc(KNOPNAAM[k]||k)+': '+p.knop[k]; }).join('<br>'); var bb=Object.keys(p.bron).sort(function(a,b){ return p.bron[b]-p.bron[a]; })[0]; return '<tr><td><a class="klein" href="'+esc(WWW+(p.pad==='/'?'':p.pad))+'" target="_blank">'+esc(p.pad)+'</a></td><td>'+p.v+'</td><td>'+p.u+'</td><td>'+(kl||'—')+'</td><td>'+esc(bb?bronLabel(bb):'—')+'</td></tr>'; }).join('')+'</table>':'<p class="sub">Nog geen bezoek gemeten.</p>')+'</div>';
    }
    $('root').innerHTML=h;
    Array.prototype.forEach.call($('root').querySelectorAll('[data-dg]'),function(b){ b.onclick=function(){ BER.dagen=+b.getAttribute('data-dg'); BER.data=null; laadBereik(); }; });
    if($('ber-ver')) $('ber-ver').onclick=function(){ laadBereik(); };
  }
  function rActies(){
    var A=(D.acties||[]).slice().reverse(), tag=(D.config.hashtag||'#NetBeterGebruiken');
    var zoek='https://www.linkedin.com/search/results/content/?keywords='+encodeURIComponent(tag)+'&sortBy=%22date_posted%22';
    var T={klik:'klikte «Open LinkedIn»',gepost:'postte en gaf de link door',blogbezoek:'blogbezoek via zijn link',inschrijving:'schreef zich in'};
    var h='<div class="card"><h3>Acties van ambassadeurs</h3><p class="sub">Een klik betekent: hij is waarschijnlijk aan het posten. Zoek zijn post via de hashtag en reageer binnen het uur met een zin die iets toevoegt. Bij «postte» heb je de link meteen (en kreeg je een mail).</p>'+
      '<div class="knoppen"><a class="klein" href="'+esc(zoek)+'" target="_blank" rel="noopener">🔎 Recente posts met '+esc(tag)+'</a><button class="klein" id="alles-af">Alles afvinken</button></div></div>';
    h+='<div class="wrap"><table><thead><tr><th>Wanneer</th><th>Wie</th><th>Wat</th><th>Bericht</th><th></th></tr></thead><tbody>';
    if(!A.length) h+='<tr><td colspan="5"><div class="state">Nog geen acties.</div></td></tr>';
    A.forEach(function(a){ var p=a.post?D.posts[a.post]:null;
      h+='<tr'+(!a.afgehandeld?' class="actie-open"':'')+'><td>'+esc(dt(a.ts))+'</td><td><b>'+esc(a.wie||'')+'</b></td><td>'+esc(T[a.type]||a.type)+'</td><td>'+esc(p?p.titel:(a.slug||''))+'</td>'+
        '<td style="white-space:nowrap">'+(a.url?'<a class="klein" href="'+esc(a.url)+'" target="_blank" rel="noopener">Open post</a> ':'')+(a.type==='klik'?'<a class="klein" href="'+esc(zoek)+'" target="_blank" rel="noopener">Zoek post</a> ':'')+
        (p&&p.amb_reactie?'<button class="klein" data-sug="'+esc(a.id)+'">📋 Suggestie</button> ':'')+
        (!a.afgehandeld?'<button class="klein groen" data-af="'+esc(a.id)+'">✔ Gereageerd</button>':'<span class="sub">✔</span>')+'</td></tr>'; });
    h+='</tbody></table></div>';
    $('root').innerHTML=h; var R=$('root');
    Array.prototype.forEach.call(R.querySelectorAll('[data-af]'),function(b){ b.onclick=function(){ zet('/api/campagne/li/actie',{ids:[b.getAttribute('data-af')]},'Afgevinkt'); }; });
    Array.prototype.forEach.call(R.querySelectorAll('[data-sug]'),function(b){ b.onclick=function(){ var a=D.acties.find(function(x){return x.id===b.getAttribute('data-sug');}); var p=D.posts[a.post];
      kopieer('Sterk punt, '+String(a.wie||'').split(' ')[0]+'. '+vul('Wie het zelf wil narekenen: {blog}',p),'Suggestie gekopieerd'); }; });
    $('alles-af').onclick=function(){ var ids=openActies().map(function(a){return a.id;}); if(ids.length) zet('/api/campagne/li/actie',{ids:ids},'Alles afgevinkt'); };
  }

  // ── Instellingen ──
  function rInst(){
    var c=D.config||{};
    var h='<div class="card"><h3>Instellingen</h3><div class="grid2">'+
      '<label class="blok">Vaste kerntekst bovenaan elke blog<textarea id="c-kern" rows="5">'+esc(c.kern||'')+'</textarea></label>'+
      '<div><label class="blok">Meldingen naar (herinnering 15 min voor elke post, nieuwe ambassadeurs, «reageer nu»)<input id="c-mel" value="'+esc(c.melding_aan||'')+'" style="width:100%"></label>'+
      '<label class="blok" style="margin-top:8px">Bronnen: afzenders die naar dossier@ mogen mailen (onderwerp «bron …»)<input id="c-van" value="'+esc(c.bron_van||'')+'" style="width:100%"></label>'+
      '<label class="blok" style="margin-top:8px">Campagne-hashtag (in de ambassadeursposts)<input id="c-tag" value="'+esc(c.hashtag||'')+'"></label>'+
      '<label class="blok" style="margin-top:8px">Link naar de bedrijfspagina (beheer)<input id="c-pag" value="'+esc(c.pagina_url||'')+'" placeholder="https://www.linkedin.com/company/…/admin/" style="width:100%"></label>'+
      '<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="c-her"'+(c.herinnering?' checked':'')+'> Herinneringsmail op de dag van elke post (15 min vooraf)</label>'+
      '<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="c-auto"'+(c.amb_auto!==false?' checked':'')+'> Ambassadeurs krijgen automatisch elke week hun volgende bericht, vanaf <input type="time" id="c-auur" value="'+esc(c.amb_uur||'10:30')+'" style="width:96px"> (weekdagen)</label>'+
      '<div style="margin-top:4px;font-size:12px;color:#5b6577">Bericht 1 gaat meteen bij de inschrijving; daarna één per week op dezelfde weekdag, tot de reeks rond is. Wie in maart instapt, doorloopt zo zijn eigen 12 berichten.</div></div></div>'+
      '<div class="knoppen"><button class="groen" id="c-ok">Opslaan</button></div><p class="sub">Server '+esc(D.server||'')+' · tijd Brussel '+esc(D.nu.datum+' '+D.nu.uur)+'</p></div>'+
      '<div class="card"><h3>Startinhoud opnieuw laden</h3><p class="sub">Voegt ontbrekende berichten en blogs uit de startinhoud toe; bestaande blijven ongewijzigd.</p><button id="seed2">Ontbrekende startinhoud toevoegen</button></div>';
    $('root').innerHTML=h;
    $('c-ok').onclick=function(){ zet('/api/campagne/li/config',{kern:$('c-kern').value,melding_aan:$('c-mel').value,bron_van:$('c-van').value,hashtag:$('c-tag').value,pagina_url:$('c-pag').value,herinnering:$('c-her').checked,amb_auto:$('c-auto').checked,amb_uur:$('c-auur').value},'Opgeslagen'); };
    $('seed2').onclick=async function(){ var r=await fetch('/apps/campagne-li-seed.json',{cache:'no-store'}); var data=await r.json(); delete data.config; zet('/api/campagne/li/seed',{data:data}).then(function(j){ toast((j.nieuw_posts||0)+' berichten, '+(j.nieuw_blogs||0)+' blogs toegevoegd'); }); };
  }

  async function laad(){ D=await api('/api/campagne/li'); render(); }
  (async function(){
    try{
      var rc=await fetch('/api/config'); var CFG=await rc.json(); PROXY=(CFG.fluctusProxyUrl||'https://lucid-amazement-production.up.railway.app').replace(/\/+$/,'');
      if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey); var d=await sb.auth.getSession(); SESSION=d.data.session; }
      if(!SESSION){ $('root').innerHTML='<div class="fout">Niet aangemeld. Meld je aan via MijnEC en open deze pagina opnieuw.</div>'; return; }
      $('who').textContent=(SESSION.user&&SESSION.user.email)||'';
      await laad();
      setInterval(function(){ if(document.visibilityState==='visible'&&!(D&&D.job&&D.job.bezig)&&!document.activeElement.matches('input,textarea,select')) api('/api/campagne/li').then(function(j){ D=j; render(); }).catch(function(){}); },60000);
    }catch(e){ $('root').innerHTML='<div class="fout">Fout: '+esc(e.message)+'</div>'; }
  })();
</script>
