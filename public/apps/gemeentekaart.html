<!DOCTYPE html>
<!-- ============================================================
     ENERGIE-COMPAS LEAD GENERATOR — KAART PER GEMEENTE  v1.4.1
     v1.4.1: Overpass robuuster (mail.ru eerst, 9 s/server, 2 rondes, ↻ opnieuw-knop) — overpass-api.de hing 25 s live.
     v1.4 (17-10, Johan): ALLE BESTAANDE LAADPALEN (AC + DC). Vlaanderen: MOW-WFS beleid:laadpunten_public (Eco-Movement,
       alle publieke + semi-publieke laadpunten, per connector → gegroepeerd per locatie). Brussel/Wallonië of MOW faalt:
       OpenStreetMap via Overpass (gratis, geen key, CORS; overpass-api.de faalt soms → kumi.systems). Binnen de kaartzone; laag «🔌 Bestaande laadpalen». Per parking: aantal laadpalen ≤150 m (popup + lijst),
       filter «verberg parkings met laadpalen». Cache per gemeente 24 u (localStorage). Logt laadpalen_geladen / laadpaal_bekeken.
     v1.3: Energie-Compas-logo linksboven + EC-favicon; geen Fluctus-merk zichtbaar.  (16-10-2026, Johan)
     v1.1: tabblad draagt de gemeentenaam; terminologie «Lead Generator».
     v1.2: basiskaart OpenStreetMap (CARTO voyager vroeg een API-key); leesbare parkingtypes + groep auto/tankstation.
     public/apps/gemeentekaart.html — opent vanuit de Lead Generator in een nieuw tabblad.
     ?slug=<Kaart-slug>&nis=<niscode>&naam=<gemeentenaam>
     - Enkel voor ingelogde gebruikers (Supabase-sessie; zelfde gate als gemeenteplan.html).
     - Data: johanmmk.github.io/gemeenten/Kaart_bedrijfsparkings_<slug>.html (sites, boundary,
       cabines, chargers) → hier opnieuw getekend zodat we ELKE handeling kunnen loggen.
       Lukt het uitlezen niet → val terug op de originele kaart in een iframe (enkel openen gelogd).
     - Bedrijfsparkings (grootte = geschatte plaatsen), MS-cabines (geel, restcapaciteit),
       bestaande snelladers ≥40 kW (groen). Per parking: dichtste cabine + afstand.
     - Adviseur kan een parking «⭐ Noteren als lead» (met opmerking) of «✕ Geen lead».
     - Logging: fluctus-proxy POST /api/app-activity/log, app_id 'gemeenteplan'
       (opvolgen in /apps/leadgen-log.html, enkel managers).
     ============================================================ -->
<html lang="nl">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#1F3864;--groen:#05B050;--groen-d:#048443;--grijs:#5b6b85;--lijn:#E2E8F2;--bg:#F4F7FB;--geel:#FFD400;}
    html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--navy);}
    .gk-top{height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid var(--lijn);box-sizing:border-box;}
    .gk-top .brand{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:16px;white-space:nowrap;}
    .gk-top .brand em{font-style:normal;color:var(--groen);}
    .gk-top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .gk-top .sp{flex:1;}
    .gk-top .who{font-size:12px;color:var(--grijs);white-space:nowrap;}
    .gk-top a.back{color:var(--navy);text-decoration:none;font-size:13px;border:1px solid #C9D6EC;border-radius:8px;padding:6px 11px;background:#fff;white-space:nowrap;}
    .gk-top a.back:hover{background:#EAF0F8;}
    .gk-wrap{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;}
    .gk-side{width:340px;flex:0 0 340px;background:#fff;border-right:1px solid var(--lijn);display:flex;flex-direction:column;min-height:0;}
    #gk-map{flex:1;min-width:0;background:#e8eef2;}
    .gk-kpi{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:12px 12px 6px;}
    .gk-kpi div{background:#EAF0F8;border-radius:8px;padding:7px 8px;font-size:11px;color:var(--grijs);}
    .gk-kpi b{display:block;font-size:17px;color:var(--navy);}
    .gk-filt{padding:6px 12px 8px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--lijn);}
    .gk-filt input[type=text]{width:100%;box-sizing:border-box;font-size:14px;padding:8px 10px;border:1px solid #C9D6EC;border-radius:8px;color:var(--navy);}
    .gk-filt input[type=text]:focus{outline:none;border-color:var(--groen);box-shadow:0 0 0 3px rgba(5,176,80,.12);}
    .gk-filt .r{display:flex;align-items:center;gap:8px;font-size:12.5px;}
    .gk-filt .r input[type=range]{flex:1;accent-color:var(--groen);}
    .gk-filt label{cursor:pointer;}
    .gk-list{flex:1;overflow:auto;min-height:0;}
    .gk-item{padding:9px 12px;border-bottom:1px solid #F0F4FA;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:flex-start;}
    .gk-item:hover,.gk-item.act{background:#EAF0F8;}
    .gk-item .nm{font-weight:bold;flex:1;}
    .gk-item .sub{font-size:11.5px;color:var(--grijs);font-weight:normal;margin-top:2px;}
    .gk-item .pl{font-weight:bold;color:var(--groen-d);white-space:nowrap;}
    .gk-item .st{font-size:14px;}
    .gk-item.band{opacity:.6;}
    .gk-leeg{padding:14px 12px;font-size:13px;color:var(--grijs);}
    .gk-voet{padding:8px 12px;font-size:11px;color:#8a99b5;border-top:1px solid var(--lijn);}
    .gk-pin{border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:11px;box-sizing:border-box;}
    .gk-pin.lead{border-color:var(--geel);border-width:3px;}
    .gk-pin.nee{opacity:.35;}
    .gk-pop{font-size:13px;line-height:1.45;min-width:220px;}
    .gk-pop b.t{font-size:14.5px;color:var(--navy);}
    .gk-pop .m{color:var(--grijs);font-size:12px;}
    .gk-pop .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
    .gk-pop button,.gk-pop a.bt{font-size:12.5px;border-radius:7px;padding:6px 9px;cursor:pointer;border:1px solid #C9D6EC;background:#fff;color:var(--navy);text-decoration:none;}
    .gk-pop button.lead{background:var(--groen);border-color:var(--groen);color:#fff;font-weight:bold;}
    .gk-pop button.lead:hover{background:var(--groen-d);}
    .gk-pop textarea{width:100%;box-sizing:border-box;margin-top:7px;font-family:inherit;font-size:12.5px;border:1px solid #C9D6EC;border-radius:7px;padding:6px 8px;resize:vertical;}
    .gk-pop .ok{color:var(--groen-d);font-weight:bold;margin-top:6px;}
    .gk-legend{background:#fff;padding:8px 10px;border-radius:8px;border:1px solid var(--lijn);font-size:12px;line-height:1.7;box-shadow:0 2px 8px rgba(0,0,0,.08);}
    .gk-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #fff;}
    #gk-status{position:absolute;z-index:1000;left:50%;top:70px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-width:90%;}
    #gk-frame{flex:1;border:0;display:none;}
    #gk-gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:99999;}
    #gk-gate .box{background:#fff;border:1px solid var(--lijn);border-radius:14px;padding:30px 34px;max-width:400px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.1);}
    #gk-gate h2{margin:0 0 8px;font-size:20px;}
    #gk-gate p{color:var(--grijs);font-size:14px;line-height:1.5;margin:0 0 18px;}
    #gk-gate a{display:inline-block;background:var(--groen);color:#fff;text-decoration:none;font-weight:bold;font-size:14px;padding:11px 22px;border-radius:8px;}
    #gk-toggle{display:none;}
    @media (max-width:760px){
      .gk-top .who{display:none;}
      .gk-wrap{flex-direction:column;}
      .gk-side{width:auto;flex:0 0 auto;max-height:42%;border-right:none;border-bottom:1px solid var(--lijn);}
      .gk-side.dicht .gk-filt,.gk-side.dicht .gk-list,.gk-side.dicht .gk-voet{display:none;}
      #gk-toggle{display:block;width:100%;border:none;background:#EAF0F8;color:var(--navy);font-size:12.5px;padding:6px;cursor:pointer;}
      #gk-map{min-height:0;}
    }
      .ec-logo{height:30px;width:auto;display:block;}
    @media (max-width:760px){.ec-logo{height:24px;}}
  </style>
</head>
<body>
  <div class="gk-top">
    <div class="brand"><a href="https://www.energie-compas.eu" target="_blank" rel="noopener" title="Energie-Compas"><img src="/apps/ec-logo.png" alt="Energie-Compas" class="ec-logo"></a></div>

  <div class="gk-wrap">

      <div class="gk-kpi">
        <div>Parkings<b id="k-park">–</b></div>

  <div id="gk-gate">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function(){
    'use strict';
    // ------------------------------------------------------------ configuratie
    var SUPA_URL   = 'https://haagysosdaorrxkrwkcj.supabase.co';
    var SUPA_ANON  = 'sb_publishable_lnpeEjaj960Jjk_jbc-bdw_WFZnORL3';
    var PROXY_BASE = 'https://lucid-amazement-production.up.railway.app';
    var APP_ID     = 'gemeenteplan';
    var REPO_BASE  = 'https://johanmmk.github.io/gemeenten/';
    // v1.2: groepen + leesbare labels voor de OSM-types uit de gemeentekaarten
    var GROEP_KLEUR = { industrie:'#34568C', handel:'#9E480E', kantoor:'#05803B', auto:'#8A6A00' };
    var TYPE_GROEP  = { industrial:'industrie', works:'industrie', warehouse:'industrie', wholesale:'industrie', trade:'industrie', roof:'industrie', bedrijf:'industrie',
                        office:'kantoor', car:'auto', car_repair:'auto', car_parts:'auto', fuel:'auto', tyres:'auto' };
    var TYPE_LBL    = { industrial:'Industrie', works:'Fabriek', warehouse:'Magazijn', wholesale:'Groothandel', trade:'Groothandel', roof:'Overdekt', bedrijf:'Bedrijf',
                        office:'Kantoor', car:'Autogarage / -dealer', car_repair:'Autoherstelling', car_parts:'Auto-onderdelen', fuel:'Tankstation', tyres:'Banden',
                        commercial:'Handel', retail:'Winkel', supermarket:'Supermarkt', doityourself:'Doe-het-zelf', hardware:'IJzerwaren', clothes:'Kleding',
                        convenience:'Buurtwinkel', furniture:'Meubels', carpet:'Tapijt', bakery:'Bakkerij', garden_centre:'Tuincentrum', electronics:'Elektronica',
                        kitchen:'Keukens', shoes:'Schoenen', variety_store:'Discount', mall:'Winkelcentrum', pet:'Dierenwinkel', butcher:'Slagerij',
                        beverages:'Drankenhandel', bicycle:'Fietsen', bed:'Bedden', hairdresser:'Kapper', sports:'Sport', second_hand:'Tweedehands',
                        department_store:'Warenhuis', yes:'Bedrijfsparking', no:'Parking' };
    function typeKleur(t){ return GROEP_KLEUR[TYPE_GROEP[t] || 'handel']; }
    function typeLbl(t){ return TYPE_LBL[t] || (t ? String(t).replace(/_/g, ' ') : ''); }

    var qs   = new URLSearchParams(location.search);
    var SLUG = qs.get('slug') || '';
    var NIS  = qs.get('nis') || '';
    var GEM  = qs.get('naam') || SLUG.replace(/_/g, ' ') || 'gemeente';
    document.getElementById('gk-titel').textContent = GEM + ' — Lead Generator';
    document.title = GEM;   // tabblad = naam van de gemeente

    var sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
    var TOKEN = null, EMAIL = null, UID = null;
    var T0 = Date.now(), N_BEKEKEN = 0, BEKEKEN = {};

    // ------------------------------------------------------------ helpers
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
    function nf(v){ return (v == null || isNaN(v)) ? '–' : Number(v).toLocaleString('nl-BE'); }
    function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
    function rnd(x, d){ var f = Math.pow(10, d || 5); return Math.round(x * f) / f; }
    function afstandM(a, b, c, d){
      var R = 6371000, r = Math.PI / 180, dLa = (c - a) * r, dLo = (d - b) * r;
      var h = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    function status(t, ms){
      var el = document.getElementById('gk-status');
      el.textContent = t || ''; el.style.display = t ? 'block' : 'none';
      if (t && ms) setTimeout(function(){ if (el.textContent === t) el.style.display = 'none'; }, ms);
    }
    function showGate(t, p){
      if (t) document.getElementById('gk-gate-t').textContent = t;
      if (p) document.getElementById('gk-gate-p').textContent = p;
      document.getElementById('gk-gate').style.display = 'flex';
    }

    // ------------------------------------------------------------ logging
    // Best-effort, blokkeert nooit. Gemeente zit altijd in de details zodat de log per gemeente filtert.
    function verseToken(){
      return sb.auth.getSession().then(function(r){
        var s = r && r.data && r.data.session;
        if (s && s.access_token) TOKEN = s.access_token;
        return TOKEN;
      }).catch(function(){ return TOKEN; });
    }
    function post(token, body){
      if (!token) return;
      try {
        fetch(PROXY_BASE + '/api/app-activity/log', {
          method:'POST', keepalive:true,
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
          body: body
        }).catch(function(){});
      } catch(e){}
    }
    function log(actie, details, klantNaam, sync){
      var d = details || {};
      d.gemeente = GEM; d.nis = NIS; d.slug = SLUG;
      var body = JSON.stringify({ app_id: APP_ID, actie: actie, klant_naam: klantNaam || GEM, details: d });
      if (sync) { post(TOKEN, body); return; }          // pagehide: geen async meer mogelijk
      verseToken().then(function(t){ post(t, body); });
    }
    // debounce per sleutel (kaartbeweging, filters)
    var _deb = {};
    function logLater(key, ms, fn){ clearTimeout(_deb[key]); _deb[key] = setTimeout(fn, ms); }

    // ------------------------------------------------------------ eigen leads (lokaal geheugen, per gebruiker)
    var LEADS = {};
    function leadKey(){ return 'gk_leads_' + (UID || 'anon'); }
    function siteId(s){ return rnd(s.lat, 5) + ',' + rnd(s.lng, 5); }
    function leadsLaden(){ try { LEADS = JSON.parse(localStorage.getItem(leadKey()) || '{}') || {}; } catch(e){ LEADS = {}; } }
    function leadsBewaar(){ try { localStorage.setItem(leadKey(), JSON.stringify(LEADS)); } catch(e){} }

    // ------------------------------------------------------------ auth-gate
    function guard(){
      return sb.auth.getSession().then(function(r){
        var s = r && r.data && r.data.session;
        if (!s){ location.replace('https://www.energie-compas.eu/login'); return false; }
        TOKEN = s.access_token; EMAIL = (s.user && s.user.email) || ''; UID = (s.user && s.user.id) || null;
        try { sb.auth.onAuthStateChange(function(_e, ss){ if (ss && ss.access_token) TOKEN = ss.access_token; }); } catch(e){}
        return fetch(PROXY_BASE + '/api/app-access/check', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + TOKEN },
          body: JSON.stringify({ app_id: APP_ID })
        }).then(function(res){
          return res.json().catch(function(){ return {}; }).then(function(j){
            var isMgr = j && ((j.user && j.user.role === 'manager') || j.role === 'manager' || j.manager === true);
            if (res.ok && j && j.toegang === false && !isMgr){ showGate('Geen toegang', 'Vraag toegang tot de “Lead Generator” aan uw manager.'); return false; }
            return true;
          });
        }).catch(function(){ return true; });
      }).catch(function(){ location.replace('https://www.energie-compas.eu/login'); return false; });
    }

    // ------------------------------------------------------------ data uit de bestaande gemeentekaart halen
    // Scant een JS-literal ([...] of {...}) vanaf een marker, met respect voor strings.
    function literalNa(src, marker){
      var i = src.indexOf(marker); if (i < 0) return null;
      i += marker.length;
      while (i < src.length && src[i] !== '[' && src[i] !== '{') i++;
      var open = src[i], close = open === '[' ? ']' : '}', depth = 0, inStr = false, q = '', start = i;
      for (; i < src.length; i++){
        var c = src[i];
        if (inStr){ if (c === '\\') { i++; continue; } if (c === q) inStr = false; continue; }
        if (c === '"' || c === "'"){ inStr = true; q = c; continue; }
        if (c === open) depth++;
        else if (c === close){ depth--; if (depth === 0) { try { return JSON.parse(src.slice(start, i + 1)); } catch(e){ return null; } } }
      }
      return null;
    }

    var map, SITES = [], CABINES = [], CHARGERS = [], BOUNDARY = null;
    var siteLayer, cabLayer, chgLayer, MARKERS = {};

    function laadData(){
      var url = REPO_BASE + 'Kaart_bedrijfsparkings_' + encodeURIComponent(SLUG) + '.html';
      return fetch(url, { cache:'no-cache' }).then(function(r){
        if (!r.ok) throw new Error('kaart ' + r.status);
        return r.text();
      }).then(function(h){
        SITES    = literalNa(h, 'var sites=') || [];
        BOUNDARY = literalNa(h, 'var boundary=');
        CABINES  = literalNa(h, 'cabines=') || [];
        CHARGERS = literalNa(h, 'var chargers=') || [];
        if (!SITES.length && !CABINES.length) throw new Error('geen data in kaart');
        return true;
      });
    }

    function terugvalIframe(reden){
      document.getElementById('gk-side').style.display = 'none';
      document.getElementById('gk-map').style.display = 'none';
      var f = document.getElementById('gk-frame');
      f.src = REPO_BASE + 'Kaart_bedrijfsparkings_' + encodeURIComponent(SLUG) + '.html';
      f.style.display = 'block';
      log('kaart_terugval_iframe', { reden: String(reden || '') });
    }

    // ------------------------------------------------------------ verrijking: dichtste cabine
    // ------------------------------------------------------------ v1.4: bestaande laadpalen (OpenStreetMap / Overpass)
    // v1.4.1: publieke Overpass-servers zijn wisselvallig (rate-limit/hangen) → korte timeout per server + 2 rondes
    var OVERPASS = ['https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
    var MOW_WFS = 'https://geoserver.gis.cloud.mow.vlaanderen.be/geoserver/beleid/wfs';
    var LP_BRON = '';
    function gewestNis(nis){
      var n = String(nis || ''); while (n.length < 5) n = '0' + n; var p2 = n.slice(0, 2), d = n.charAt(0);
      if (p2 === '21') return 'BRU'; if (p2 === '25') return 'WAL'; if (p2 === '23' || p2 === '24') return 'VLA';
      if ('1347'.indexOf(d) >= 0) return 'VLA'; if ('5689'.indexOf(d) >= 0) return 'WAL'; return '?';
    }
    function metTimeout(ms){ var c = ('AbortController' in window) ? new AbortController() : null; if (c) setTimeout(function(){ c.abort(); }, ms); return c ? c.signal : undefined; }
    // MOW: één feature per connector → groeperen per locatie (adres + coördinaat op ~1 m)
    function lpMow(bb){
      var url = MOW_WFS + '?service=WFS&version=2.0.0&request=GetFeature&typeNames=beleid:laadpunten_public&outputFormat=application/json'
              + '&srsName=EPSG:4326&count=30000&bbox=' + bb.join(',') + ',urn:ogc:def:crs:EPSG::4326';
      return fetch(url, { signal: metTimeout(30000) }).then(function(r){ if (!r.ok) throw new Error('mow http ' + r.status); return r.json(); }).then(function(j){
        var G = {};
        (j.features || []).forEach(function(f){
          var pr = f.properties || {}, la = pr.latitude, lo = pr.longitude;
          if ((la == null || lo == null) && f.geometry && f.geometry.coordinates){ lo = f.geometry.coordinates[0]; la = f.geometry.coordinates[1]; }
          if (la == null || lo == null) return;
          var k = rnd(la, 5) + ',' + rnd(lo, 5);
          var g = G[k] || (G[k] = { la: la, lo: lo, kw: 0, dc: false, cap: 0, n: pr.uitbater || '', op: pr.uitbater || '', acc: pr.toegankelijkheid || '', fee: '', st: {}, adres: pr.adres || '', id: 'mow/' + k });
          g.cap++;
          var kw = parseFloat(pr.maximaal_vermogen_kw); if (!isNaN(kw) && kw > g.kw) g.kw = kw;
          if (/dc/i.test(pr.stroomtype || '') || (kw >= 40) || /snel/i.test(pr.snelheid || '')) g.dc = true;
          if (pr.connector) g.st[String(pr.connector).replace(/_/g, ' ')] = 1;
        });
        return Object.keys(G).map(function(k){ var g = G[k]; g.stek = Object.keys(g.st).slice(0, 4).join(', '); delete g.st; g.kw = g.kw || null; g.bron = 'MOW Vlaanderen (Eco-Movement)'; return g; });
      });
    }
    var LP = [], LP_GELADEN = false, LP_STRAAL = 150, lpLayer = null, LAYERCTL = null;
    function kwUit(v){
      if (v == null) return null;
      var m = String(v).replace(',', '.').match(/([\d.]+)\s*(kw|w|kva)?/i); if (!m) return null;
      var x = parseFloat(m[1]); if (isNaN(x)) return null;
      if (m[2] && m[2].toLowerCase() === 'w') x = x / 1000;
      if (!m[2] && x > 1000) x = x / 1000;              // "22000" = W
      return x;
    }
    function lpVan(el){
      var tg = el.tags || {}, la = el.lat != null ? el.lat : (el.center && el.center.lat), lo = el.lon != null ? el.lon : (el.center && el.center.lon);
      if (la == null || lo == null) return null;
      var kw = 0, dc = false, stek = [];
      Object.keys(tg).forEach(function(k){
        var m = k.match(/^socket:([^:]+)(?::(output))?$/); if (!m) return;
        if (m[2] === 'output'){ var x = kwUit(tg[k]); if (x && x > kw) kw = x; }
        else if (tg[k] && tg[k] !== 'no'){
          stek.push(m[1].replace(/_/g, ' '));
          if (/combo|ccs|chademo|tesla_supercharger/i.test(m[1])) dc = true;
        }
      });
      ['charging_station:output', 'maxpower', 'output'].forEach(function(k){ var x = kwUit(tg[k]); if (x && x > kw) kw = x; });
      if (kw >= 40) dc = true;
      var cap = parseInt(tg.capacity, 10);
      return { la: la, lo: lo, kw: kw || null, dc: dc, cap: isNaN(cap) ? null : cap, n: tg.name || tg.operator || tg.network || tg.brand || '',
               op: tg.operator || tg.network || '', acc: tg.access || '', fee: tg.fee || '', stek: stek.slice(0, 4).join(', '), id: el.type + '/' + el.id, bron: 'OpenStreetMap' };
    }
    function lpBbox(){
      var la1 = 90, la2 = -90, lo1 = 180, lo2 = -180;
      function u(a, b){ if (a < la1) la1 = a; if (a > la2) la2 = a; if (b < lo1) lo1 = b; if (b > lo2) lo2 = b; }
      SITES.forEach(function(s){ u(s.lat, s.lng); });
      if (BOUNDARY && BOUNDARY.coordinates){ JSON.stringify(BOUNDARY.coordinates).replace(/\[(-?[\d.]+),(-?[\d.]+)\]/g, function(_, x, y){ u(+y, +x); return ''; }); }
      if (la1 > la2) return null;
      var pad = 0.01;
      return [rnd(la1 - pad, 4), rnd(lo1 - pad, 4), rnd(la2 + pad, 4), rnd(lo2 + pad, 4)];
    }
    function lpQuery(bb){
      var q = '[out:json][timeout:40];nwr["amenity"="charging_station"](' + bb.join(',') + ');out center tags;';
      var i = 0, ronde = 0;
      function poging(){
        if (i >= OVERPASS.length){
          if (ronde++ >= 1) return Promise.reject(new Error('overpass onbereikbaar'));
          i = 0; return new Promise(function(ok){ setTimeout(ok, 2500); }).then(poging);
        }
        var url = OVERPASS[i++];
        return fetch(url, { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q), signal: metTimeout(9000) })
          .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(function(j){ if (!j || !Array.isArray(j.elements)) throw new Error('leeg antwoord'); return j; })
          .catch(function(){ return poging(); });
      }
      return poging();
    }
    function lpLaden(){
      var bb = lpBbox(); if (!bb) return;
      var key = 'gk_lp2_' + SLUG, cache = null;
      try { cache = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){}
      var vers = cache && cache.ts && (Date.now() - cache.ts) < 24 * 3600 * 1000 && Array.isArray(cache.lp);
      function osm(){ return lpQuery(bb).then(function(j){ return { lp: (j.elements || []).map(lpVan).filter(Boolean), bron: 'OpenStreetMap' }; }); }
      var p = vers ? Promise.resolve({ lp: cache.lp, bron: cache.bron || '', cache: true })
                   : (gewestNis(NIS) === 'VLA'
                        ? lpMow(bb).then(function(lp){ if (!lp.length) throw new Error('mow leeg'); return { lp: lp, bron: 'MOW Vlaanderen (Eco-Movement)' }; }).catch(function(){ return osm(); })
                        : osm())
                     .then(function(r){
                       try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), lp: r.lp, bron: r.bron })); } catch(e){}
                       r.cache = false; return r;
                     });
      setLpLabel('🔌 Bestaande laadpalen (laden…)');
      p.then(function(r){
        LP = r.lp; LP_GELADEN = true; LP_BRON = r.bron || '';
        lpVerrijk(); tekenLp(); tekenSites(); renderLijst();
        var nDc = LP.filter(function(x){ return x.dc; }).length;
        var nPunt = LP.reduce(function(a, x){ return a + (x.cap || 1); }, 0);
        setLpLabel('🔌 Bestaande laadpalen (' + LP.length + ' locaties)');
        document.getElementById('k-lp').textContent = nf(LP.length);
        document.getElementById('k-lp').title = nf(nPunt) + ' laadpunten op ' + nf(LP.length) + ' locaties · bron: ' + LP_BRON;
        log('laadpalen_geladen', { aantal: LP.length, laadpunten: nPunt, dc: nDc, ac: LP.length - nDc, bron: LP_BRON, uit_cache: !!r.cache });
      }).catch(function(e){
        setLpLabel('🔌 Bestaande laadpalen (niet beschikbaar)');
        var kl = document.getElementById('k-lp');
        kl.innerHTML = '<a href="#" style="font-size:13px;color:#048443">↻ opnieuw</a>';
        kl.title = 'Laadpalen-server tijdelijk niet bereikbaar — klik om opnieuw te proberen';
        kl.firstChild.onclick = function(ev){ ev.preventDefault(); kl.textContent = '…'; lpLaden(); };
        log('laadpalen_fout', { reden: String(e && e.message || e) });
      });
    }
    function setLpLabel(t){
      if (!LAYERCTL || !lpLayer) return;
      LAYERCTL.removeLayer(lpLayer); LAYERCTL.addOverlay(lpLayer, t);
    }
    function lpVerrijk(){
      SITES.forEach(function(s){
        var n = 0, nDc = 0, nPt = 0, best = null, bd = Infinity;
        LP.forEach(function(x){
          if (Math.abs(x.la - s.lat) > 0.003 || Math.abs(x.lo - s.lng) > 0.005) return;
          var d = afstandM(s.lat, s.lng, x.la, x.lo);
          if (d <= LP_STRAAL){ n++; nPt += (x.cap || 1); if (x.dc) nDc++; if (d < bd){ bd = d; best = x; } }
        });
        s._lp = n; s._lpPt = nPt; s._lpDc = nDc; s._lpBest = best; s._lpM = best ? Math.round(bd) : null;
      });
    }
    function lpInfo(x){
      return '<b>' + (x.dc ? 'DC-snellader' : 'Laadpaal (AC)') + '</b>' + (x.n ? '<br>' + esc(x.n) : '') +
        (x.op && x.op !== x.n ? '<br><span style="color:#5b6b85">' + esc(x.op) + '</span>' : '') +
        (x.adres ? '<br>' + esc(x.adres) : '') +
        (x.kw ? '<br>≈ ' + nf(Math.round(x.kw)) + ' kW' : '') + (x.cap ? ' · ' + x.cap + ' laadpunt' + (x.cap === 1 ? '' : 'en') : '') +
        (x.stek ? '<br><span style="color:#5b6b85">' + esc(x.stek) + '</span>' : '') +
        (x.acc && x.acc !== 'yes' ? '<br><span style="color:#9E480E">toegang: ' + esc(x.acc) + '</span>' : '') +
        '<br><span style="font-size:11px;color:#8a99b5">bron: ' + esc(x.bron || 'OpenStreetMap') + '</span>';
    }
    function tekenLp(){
      if (!lpLayer) return;
      lpLayer.clearLayers();
      LP.forEach(function(x){
        var m = L.circleMarker([x.la, x.lo], { radius: x.dc ? 6 : 4.5, color:'#fff', weight:1.5, fillColor: x.dc ? '#7B3FA0' : '#2F80ED', fillOpacity:.95 });
        m.bindTooltip(lpInfo(x), { direction:'top', sticky:true });
        m.bindPopup(lpInfo(x));
        m.on('popupopen', function(){ log('laadpaal_bekeken', { laadpaal: x.n || '', dc: x.dc, kw: x.kw, laadpunten: x.cap || null, id: x.id }); });
        lpLayer.addLayer(m);
      });
    }

    function verrijk(){
      SITES.forEach(function(s){
        s._id = siteId(s);
        var best = null, bd = Infinity;
        CABINES.forEach(function(c){ var d = afstandM(s.lat, s.lng, c.la, c.lo); if (d < bd){ bd = d; best = c; } });
        s._cab = best; s._cabM = best ? Math.round(bd) : null;
      });
      SITES.sort(function(a, b){ return (b.p || 0) - (a.p || 0); });
    }

    // ------------------------------------------------------------ kaart
    function pinIcon(s){
      var p = s.p || 0, d = Math.max(20, Math.min(46, 14 + Math.sqrt(p) * 2.2));
      var kl = typeKleur(s.t);
      var st = LEADS[s._id];
      var cls = 'gk-pin' + (st && st.status === 'lead' ? ' lead' : '') + (st && st.status === 'geen' ? ' nee' : '');
      return L.divIcon({ className:'', html:'<div class="' + cls + '" style="width:' + d + 'px;height:' + d + 'px;background:' + kl + ';' + (s.o ? 'opacity:.55;' : '') + '">' + (p >= 10 ? p : '') + '</div>', iconSize:[d, d], iconAnchor:[d / 2, d / 2] });
    }
    function popHtml(s){
      var st = LEADS[s._id];
      var cab = s._cab ? ('<div>⚡ Dichtste MS-cabine <b>' + esc(s._cab.n) + '</b> op <b>' + nf(s._cabM) + ' m</b>' +
                (s._cab.a ? '<br><span class="m">restcap. afname ' + esc(s._cab.a) + (s._cab.i ? ' · injectie ' + esc(s._cab.i) : '') + '</span>' : '') + '</div>') : '';
      var gm = 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng;
      return '<div class="gk-pop" data-id="' + esc(s._id) + '">' +
        '<b class="t">' + esc(s.n || 'Parking') + '</b><br>' +
        '<span class="m">' + esc(typeLbl(s.t)) + (s.o ? ' · band ±2 km buiten de grens' : '') + '</span>' +
        '<div style="margin-top:5px">🅿️ ± <b>' + nf(s.p) + '</b> plaatsen (schatting)</div>' + cab +
        (LP_GELADEN ? (s._lp ? '<div>🔌 <b>' + s._lpPt + '</b> bestaande laadpunt' + (s._lpPt === 1 ? '' : 'en') + ' op ' + s._lp + ' locatie' + (s._lp === 1 ? '' : 's') + ' ≤' + LP_STRAAL + ' m' + (s._lpDc ? ' (waarvan ' + s._lpDc + ' DC)' : '') + ' — dichtste op ' + nf(s._lpM) + ' m</div>'
                                : '<div>🔌 Geen bestaande laadpalen ≤' + LP_STRAAL + ' m</div>') : '') +
        (st ? '<div class="ok">' + (st.status === 'lead' ? '⭐ Genoteerd als lead' : '✕ Gemarkeerd als geen lead') + (st.opm ? ' — ' + esc(st.opm) : '') + '</div>' : '') +
        '<textarea rows="2" placeholder="Opmerking (bedrijf, contact, waarom interessant…)" data-act="opm">' + esc(st && st.opm || '') + '</textarea>' +
        '<div class="btns">' +
          '<button class="lead" data-act="lead">⭐ Noteren als lead</button>' +
          '<button data-act="geen">✕ Geen lead</button>' +
          '<a class="bt" data-act="gmaps" href="' + gm + '" target="_blank" rel="noopener">📍 Google Maps</a>' +
          '<a class="bt" data-act="streetview" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + s.lat + ',' + s.lng + '" target="_blank" rel="noopener">👁 Street View</a>' +
        '</div></div>';
    }
    function siteDetails(s){
      return { site: s.n || '', plaatsen: s.p || 0, type: s.t || '', band: !!s.o, lat: rnd(s.lat, 5), lng: rnd(s.lng, 5),
               cabine: s._cab ? s._cab.n : null, cabine_m: s._cabM, cabine_afname: s._cab ? (s._cab.a || null) : null,
               laadpalen_150m: LP_GELADEN ? (s._lpPt || 0) : null };
    }

    function tekenSites(){
      siteLayer.clearLayers(); MARKERS = {};
      zichtbareSites().forEach(function(s){
        var m = L.marker([s.lat, s.lng], { icon: pinIcon(s), riseOnHover:true });
        m.bindTooltip('<b>' + esc(s.n || 'Parking') + '</b><br>± ' + nf(s.p) + ' plaatsen' + (s._cabM != null ? '<br>cabine op ' + nf(s._cabM) + ' m' : ''), { direction:'top', offset:[0, -8] });
        m.bindPopup(function(){ return popHtml(s); }, { maxWidth:300 });
        m.on('popupopen', function(){
          if (!BEKEKEN[s._id]){ BEKEKEN[s._id] = 1; N_BEKEKEN++; }
          log('parking_bekeken', siteDetails(s), s.n);
          markeerLijst(s._id);
        });
        var hoverT = null;
        m.on('mouseover', function(){ hoverT = setTimeout(function(){ log('parking_hover', { site: s.n || '', plaatsen: s.p || 0 }, s.n); }, 1500); });
        m.on('mouseout', function(){ clearTimeout(hoverT); });
        m._site = s;
        MARKERS[s._id] = m;
        siteLayer.addLayer(m);
      });
    }
    function tekenCabines(){
      cabLayer.clearLayers();
      CABINES.forEach(function(c){
        var m = L.circleMarker([c.la, c.lo], { radius:5, color:'#6b5300', weight:1, fillColor:'#FFD400', fillOpacity:.95 });
        var info = '<b>MS-cabine ' + esc(c.n) + '</b>' + (c.a ? '<br>Restcapaciteit afname: ' + esc(c.a) : '') + (c.i ? '<br>Restcapaciteit injectie: ' + esc(c.i) : '') + (c.v ? '<br>Voeding: ' + esc(c.v) : '');
        m.bindTooltip(info, { direction:'top', sticky:true });
        m.bindPopup(info);
        m.on('popupopen', function(){ log('cabine_bekeken', { cabine: c.n, afname: c.a || null, injectie: c.i || null, lat: rnd(c.la, 5), lng: rnd(c.lo, 5) }); });
        cabLayer.addLayer(m);
      });
    }
    function tekenChargers(){
      chgLayer.clearLayers();
      CHARGERS.forEach(function(c){
        var ic = L.divIcon({ className:'', html:'<div class="gk-pin" style="width:20px;height:20px;background:#05B050;border-radius:5px;font-size:12px">&#9889;</div>', iconSize:[20, 20], iconAnchor:[10, 10] });
        var m = L.marker([c.la, c.lo], { icon: ic });
        var info = '<b>Bestaand snellaadpunt</b>' + (c.n ? '<br>' + esc(c.n) : '') + '<br>≈ ' + nf(c.kw) + ' kW';
        m.bindTooltip(info, { direction:'top' }); m.bindPopup(info);
        m.on('popupopen', function(){ log('laadpunt_bekeken', { laadpunt: c.n || '', kw: c.kw || null }); });
        chgLayer.addLayer(m);
      });
    }

    // klikken in de popup (lead / geen lead / Google Maps)
    function popupActies(e){
      var el = e.target, act = el && el.getAttribute && el.getAttribute('data-act');
      if (!act || act === 'opm') return;
      var pop = el.closest('.gk-pop'); if (!pop) return;
      var id = pop.getAttribute('data-id');
      var s = SITES.filter(function(x){ return x._id === id; })[0]; if (!s) return;
      var ta = pop.querySelector('textarea[data-act=opm]');
      var opm = ta ? ta.value.trim().slice(0, 500) : '';
      var d = siteDetails(s);
      if (act === 'gmaps' || act === 'streetview'){ log(act === 'gmaps' ? 'google_maps_klik' : 'streetview_klik', d, s.n); return; }
      if (act === 'lead' || act === 'geen'){
        LEADS[id] = { status: act === 'lead' ? 'lead' : 'geen', opm: opm, ts: new Date().toISOString(), naam: s.n || '' };
        leadsBewaar();
        d.opmerking = opm;
        log(act === 'lead' ? 'lead_genoteerd' : 'geen_lead', d, s.n);
        var m = MARKERS[id];
        if (m){ m.setIcon(pinIcon(s)); m.setPopupContent(popHtml(s)); }
        renderLijst();
        status(act === 'lead' ? '⭐ ' + (s.n || 'Parking') + ' genoteerd als lead' : '✕ ' + (s.n || 'Parking') + ' gemarkeerd als geen lead', 2500);
      }
    }

    // ------------------------------------------------------------ lijst + filters
    var F = { zoek:'', min:0, band:false, leads:false, zonderlp:false };
    function zichtbareSites(){
      var nq = norm(F.zoek);
      return SITES.filter(function(s){
        if (!F.band && s.o) return false;
        if ((s.p || 0) < F.min) return false;
        if (F.leads && !(LEADS[s._id] && LEADS[s._id].status === 'lead')) return false;
        if (F.zonderlp && LP_GELADEN && s._lp) return false;
        if (nq && norm(s.n).indexOf(nq) < 0) return false;
        return true;
      });
    }
    function renderLijst(){
      var lst = zichtbareSites(), el = document.getElementById('gk-list');
      if (!lst.length){ el.innerHTML = '<div class="gk-leeg">Geen parkings voor deze filter.</div>'; return; }
      el.innerHTML = lst.slice(0, 400).map(function(s){
        var st = LEADS[s._id];
        return '<div class="gk-item' + (s.o ? ' band' : '') + '" data-id="' + esc(s._id) + '">' +
          '<span class="st">' + (st ? (st.status === 'lead' ? '⭐' : '✕') : '🅿️') + '</span>' +
          '<div class="nm">' + esc(s.n || 'Parking') + '<div class="sub">' + esc(typeLbl(s.t)) +
          (s._cabM != null ? ' · cabine ' + nf(s._cabM) + ' m' : '') + (LP_GELADEN && s._lp ? ' · 🔌 ' + s._lpPt : '') + (s.o ? ' · band' : '') + '</div></div>' +
          '<span class="pl">' + nf(s.p) + '</span></div>';
      }).join('') + (lst.length > 400 ? '<div class="gk-leeg">+' + (lst.length - 400) + ' meer — verfijn de filter.</div>' : '');
    }
    function markeerLijst(id){
      Array.prototype.forEach.call(document.querySelectorAll('.gk-item'), function(it){ it.classList.toggle('act', it.getAttribute('data-id') === id); });
    }
    function filterGewijzigd(bron){
      tekenSites(); renderLijst();
      logLater('filter', 1500, function(){ log('filter', { bron: bron, zoek: F.zoek.slice(0, 60), min_plaatsen: F.min, band: F.band, enkel_leads: F.leads, zonder_laadpalen: F.zonderlp, resultaat: zichtbareSites().length }); });
    }

    function koppelUI(){
      document.getElementById('f-zoek').addEventListener('input', function(){ F.zoek = this.value; filterGewijzigd('zoek'); });
      document.getElementById('f-min').addEventListener('input', function(){ F.min = +this.value; document.getElementById('f-minv').textContent = this.value; filterGewijzigd('min_plaatsen'); });
      document.getElementById('f-band').addEventListener('change', function(){ F.band = this.checked; filterGewijzigd('band'); });
      document.getElementById('f-leads').addEventListener('change', function(){ F.leads = this.checked; filterGewijzigd('enkel_leads'); });
      document.getElementById('f-zonderlp').addEventListener('change', function(){ F.zonderlp = this.checked; filterGewijzigd('zonder_laadpalen'); });
      document.getElementById('gk-list').addEventListener('click', function(e){
        var it = e.target.closest('.gk-item'); if (!it) return;
        var id = it.getAttribute('data-id'), m = MARKERS[id]; if (!m) return;
        log('lijst_klik', { site: m._site.n || '', plaatsen: m._site.p || 0 }, m._site.n);
        map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
        m.openPopup();
      });
      document.getElementById('gk-toggle').addEventListener('click', function(){
        var sd = document.getElementById('gk-side'); sd.classList.toggle('dicht');
        setTimeout(function(){ map.invalidateSize(); }, 50);
      });
      document.getElementById('gk-back').addEventListener('click', function(){ log('terug_naar_lead_generator', {}); });
      document.addEventListener('click', popupActies);
    }

    // ------------------------------------------------------------ boot
    function boot(){
      document.getElementById('gk-who').textContent = EMAIL ? ('Aangemeld als ' + EMAIL) : '';
      leadsLaden();
      if (!SLUG){ status('Geen gemeente opgegeven — open de kaart via de Lead Generator.'); return; }

      var basis = {
        'Kaart': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }),
        'Luchtfoto': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'© Esri', maxZoom:20 })
      };
      map = L.map('gk-map', { zoomControl:true, layers:[basis['Kaart']] }).setView([50.6, 4.6], 9);
      siteLayer = L.layerGroup().addTo(map);
      cabLayer  = L.layerGroup().addTo(map);
      chgLayer  = L.layerGroup().addTo(map);
      lpLayer   = L.layerGroup().addTo(map);

      status('Kaart van ' + GEM + ' laden…');
      laadData().then(function(){
        status('');
        verrijk();
        var binnen = SITES.filter(function(s){ return !s.o; });
        document.getElementById('k-park').textContent = nf(binnen.length);
        document.getElementById('k-pl').textContent = nf(binnen.reduce(function(a, s){ return a + (s.p || 0); }, 0));
        document.getElementById('k-cab').textContent = nf(CABINES.length);

        if (BOUNDARY) L.geoJSON(BOUNDARY, { style:{ color:'#1F3864', weight:2, fill:false, dashArray:'5 4' }, interactive:false }).addTo(map);
        tekenSites(); tekenCabines(); tekenChargers(); renderLijst();

        var ov = {};
        ov['🅿️ Bedrijfsparkings'] = siteLayer;
        if (CABINES.length) ov['● MS-cabines (' + CABINES.length + ')'] = cabLayer;
        if (CHARGERS.length) ov['⚡ Snelladen ≥40 kW (' + CHARGERS.length + ')'] = chgLayer;
        ov['🔌 Bestaande laadpalen'] = lpLayer;
        LAYERCTL = L.control.layers(basis, ov, { collapsed: window.innerWidth < 760, position:'topright' }).addTo(map);
        var lg = L.control({ position:'bottomright' });
        lg.onAdd = function(){ var d = L.DomUtil.create('div', 'gk-legend');
          d.innerHTML = '<i style="background:#34568C"></i>Industrie / magazijn<br><i style="background:#9E480E"></i>Handel / winkel<br><i style="background:#8A6A00"></i>Auto / tankstation<br><i style="background:#05803B"></i>Kantoor<br><i style="background:#FFD400;border-color:#6b5300"></i>MS-cabine<br><i style="background:#05B050;border-radius:3px"></i>Snelladen ≥40 kW<br><i style="background:#2F80ED"></i>Laadpaal AC<br><i style="background:#7B3FA0"></i>Laadpaal DC / snel<br><span style="font-size:11px;color:#5b6b85">cijfer = geschatte plaatsen · geel kader = uw lead</span>';
          return d; };
        lg.addTo(map);

        var pts = SITES.filter(function(s){ return !s.o; }).map(function(s){ return [s.lat, s.lng]; });
        if (!pts.length) pts = SITES.map(function(s){ return [s.lat, s.lng]; }).concat(CABINES.map(function(c){ return [c.la, c.lo]; }));
        if (pts.length) map.fitBounds(pts, { padding:[30, 30] });

        // logging van kaartgebruik
        map.on('baselayerchange', function(e){ log('basislaag', { laag: e.name }); });
        map.on('overlayadd', function(e){ log('laag_aan', { laag: e.name }); });
        map.on('overlayremove', function(e){ log('laag_uit', { laag: e.name }); });
        map.on('moveend', function(){
          logLater('beweging', 4000, function(){
            var c = map.getCenter();
            log('kaart_beweging', { zoom: map.getZoom(), lat: rnd(c.lat, 4), lng: rnd(c.lng, 4) });
          });
        });

        lpLaden();
        log('kaart_geopend', { parkings: binnen.length, parkings_band: SITES.length - binnen.length, cabines: CABINES.length, laadpunten: CHARGERS.length });
      }).catch(function(err){
        status('');
        terugvalIframe(err && err.message);
      });
      koppelUI();

      // sessieduur bij verlaten van het tabblad
      var gesloten = false;
      function einde(){
        if (gesloten) return; gesloten = true;
        log('kaart_gesloten', { duur_s: Math.round((Date.now() - T0) / 1000), parkings_bekeken: N_BEKEKEN }, null, true);
      }
      window.addEventListener('pagehide', einde);
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'hidden') log('tab_verborgen', { na_s: Math.round((Date.now() - T0) / 1000) }, null, true);
        else if (!gesloten) log('tab_terug', { na_s: Math.round((Date.now() - T0) / 1000) });
      });
    }

    guard().then(function(ok){ if (ok) boot(); });
  })();
  </script>
</body>
</html>
