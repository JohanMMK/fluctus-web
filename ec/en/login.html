<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyEC — Energie-Compas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="/en" class="brand">
      <img src="../logo.png" alt="Energie-Compas" width="562" height="120">
    </a>
    <nav><ul>
      <li class="lang"><a href="/login">NL</a><span class="sep">|</span><a href="/fr/login">FR</a><span class="sep">|</span><a href="/en/login" class="active">EN</a></li>
      <li><span id="portal-user" class="notice"></span></li>
      <li><button id="portal-logout" class="btn ghost hidden" style="padding:8px 16px">Log out</button></li>
    </ul></nav>
  </div>
</header>

<main class="portal-main"><div class="wrap">

  <!-- LOGIN GATE (passwordless — email code) -->
  <section id="gate" class="pcard" style="max-width:440px;margin:0 auto">
    <span class="eyebrow">MyEC</span>
    <h2 style="margin:10px 0 6px">Log in</h2>
    <p class="notice" style="margin-bottom:16px">Enter your email address and you will receive a code — no password needed.</p>
    <div class="fld-col"><label>Email address</label><input id="login-email" type="email" placeholder="you@company.com" autocomplete="email"></div>
    <div id="stap-code" class="hidden">
      <div class="fld-col"><label>Code from your email</label><input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code"></div>
    </div>
    <div class="cta-row" style="margin-top:8px">
      <button id="btn-code" class="btn">Send me a code</button>
      <button id="btn-verify" class="btn hidden">Log in</button>
      <button id="btn-opnieuw" class="btn ghost hidden">Different email</button>
    </div>
    <p id="login-msg" class="notice" style="margin-top:12px"></p>
  </section>

  <!-- PORTAL (after login) -->
  <section id="app" class="hidden">
    <span class="eyebrow">My apps</span>
    <h2 style="margin:10px 0 4px">Welcome<span id="hi-naam"></span></h2>
    <p class="notice">Only the apps you have access to are shown.</p>
    <div id="apps" class="grid-apps"></div>
  </section>

</div></main>

<footer>
  <div class="wrap">
    <div class="fine">© Energie-Compas — revenue model: energy arbitrage (day-ahead / intraday) and passive imbalance settlement.</div>
  </div>
</footer>

<script type="module" src="/src/mijnec.js"></script>
</body>
</html>
