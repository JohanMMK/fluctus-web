<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MijnEC — Energie-Compas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="/" class="brand">
      <img src="logo.png" alt="Energie-Compas" width="562" height="120">
    </a>
    <nav><ul>
      <li class="lang"><a href="/login" class="active">NL</a><span class="sep">|</span><a href="/fr/login">FR</a></li>
      <li><span id="portal-user" class="notice"></span></li>
      <li><button id="portal-logout" class="btn ghost hidden" style="padding:8px 16px">Uitloggen</button></li>
    </ul></nav>
  </div>
</header>

<main class="portal-main"><div class="wrap">

  <!-- LOGIN-GATE (passwordless — e-mailcode) -->
  <section id="gate" class="pcard" style="max-width:440px;margin:0 auto">
    <span class="eyebrow">MijnEC</span>
    <h2 style="margin:10px 0 6px">Inloggen</h2>
    <p class="notice" style="margin-bottom:16px">Vul je e-mail in, je krijgt een code toegestuurd — geen wachtwoord nodig.</p>
    <div class="fld-col"><label>E-mailadres</label><input id="login-email" type="email" placeholder="jij@bedrijf.be" autocomplete="email"></div>
    <div id="stap-code" class="hidden">
      <div class="fld-col"><label>Code uit je e-mail</label><input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-cijferige code"></div>
    </div>
    <div class="cta-row" style="margin-top:8px">
      <button id="btn-code" class="btn">Stuur mij een code</button>
      <button id="btn-verify" class="btn hidden">Inloggen</button>
      <button id="btn-opnieuw" class="btn ghost hidden">Andere e-mail</button>
    </div>
    <p id="login-msg" class="notice" style="margin-top:12px"></p>
  </section>

  <!-- PORTAAL (na login) -->
  <section id="app" class="hidden">
    <span class="eyebrow">Mijn apps</span>
    <h2 style="margin:10px 0 4px">Welkom<span id="hi-naam"></span></h2>
    <p class="notice">Enkel de apps waar je toegang toe hebt, worden getoond.</p>
    <div id="apps" class="grid-apps"></div>
  </section>

</div></main>

<footer>
  <div class="wrap">
    <div class="fine">© Energie-Compas — verdienmodel: energie-arbitrage (day-ahead / intraday) en passieve onbalansverrekening.</div>
  </div>
</footer>

<script type="module" src="/src/mijnec.js"></script>
</body>
</html>
